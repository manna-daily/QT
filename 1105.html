<style>

    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;

  *{box-sizing:border-box;margin:0;padding:0}

  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;

  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}

  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}

  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "11월 5일 목요일", "ref": "고린도후서 4장 1–18절", "headline": "낙심할 때,<br>내 시선은 어디에 있습니까?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 고린도후서 4:1-18", "s1heading": "오늘의 말씀", "verse": "\"그러므로 우리가 낙심하지 아니하노니<br>우리의 겉사람은 낡아지나<br>우리의 속사람은 날로 새로워지도다\"", "verseRef": "고린도후서 4:16", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 일이 잘되는 것이 믿음의 기준이 될 때", "paragraphs": ["우리는 하나님을 믿으면서 삶이 안정되고 맡은 일이 잘 풀리기를 바랍니다. 그런데 일이 잘되는 것이 믿음을 판단하는 기준이 되면 형편에 따라 마음이 흔들립니다. 풀리면 하나님이 함께하신다고 기뻐하고, 막히면 믿음이나 사명까지 의심합니다. 3장에서 수건이 벗겨져 주님의 형상으로 변화된다고 했던 그 영광이, 4장에서는 <mark>고난받는 바울의 삶</mark>에서 어떻게 드러나는지 보여 줍니다.", "1장에서 살 소망까지 끊어졌다고 고백한 바울이 오늘은 <mark>\"낙심하지 아니하고\"</mark>라고 말합니다. 눈앞의 안정과 성공에 시선을 두면 그 결과가 기쁨과 낙심을 가릅니다. 그러나 <mark>하나님이 지금 하시는 일과 부활로 완성하실 하나님 나라</mark>에 시선을 두면, 고난 속에서도 소망을 품고 오늘의 섬김을 이어갈 수 있습니다."], "points": ["지금 나를 움직이는 것은 눈에 보이는 이 땅의 결과입니까, 하나님께서 이루실 일에 대한 소망입니까?"]}, {"title": "1–6절 · 하나님의 긍휼로 받은 직분, 예수 그리스도를 전합니다", "paragraphs": ["<mark>\"우리가 이 직분을 받아 긍휼하심을 입은 대로 낙심하지 아니하고\"</mark>(1절). 낙심하지 않는 이유는 하나님께서 긍휼을 베푸셔서 새 언약의 직분을 맡기셨기 때문입니다. 그래서 바울은 반응이 기대와 달라도 말씀을 입맛에 맞게 바꾸거나 속임수에 기대지 않고, <mark>진리를 나타냄으로</mark> 각 사람의 양심 앞에 섰습니다(2절). 결과를 빨리 내고 싶을 때 방법을 가볍게 여기기 쉽지만, 하나님께 받은 일이라면 과정도 진실해야 합니다. 복음을 분명히 전해도 이 세상의 신이 마음을 혼미하게 하여 그리스도의 영광을 보지 못하는 사람들이 있습니다(4절).", "바울은 자신이 아니라 <mark>주 되신 예수 그리스도</mark>를 전하고, 자신은 예수를 위해 성도들의 종이 되었다고 말합니다(5절). 어둠 속에 빛을 비추신 창조의 하나님이 이제 <mark>\"우리 마음에 비추사 예수 그리스도의 얼굴에 있는 하나님의 영광을 아는 빛\"</mark>을 주셨습니다(6절). 사람의 마음을 밝히시는 분이 하나님이심을 믿을 때, 반응이 더디더라도 진실하게 말하고 기다릴 수 있습니다."], "points": ["복음을 전하는 몫에 충실하고, 사람의 마음은 하나님께 맡깁니다."]}, {"title": "7–12절 · 연약한 질그릇을 통해 예수님의 생명이 드러납니다", "paragraphs": ["<mark>\"우리가 이 보배를 질그릇에 가졌으니 이는 심히 큰 능력은 하나님께 있고 우리에게 있지 아니함을 알게 하려 함이라\"</mark>(7절). 보배는 그리스도의 복음이고, 질그릇은 흔하고 깨지기 쉬운 그릇입니다. 3장의 영광을 이해하려면 4장의 질그릇도 함께 보아야 합니다. 바울은 사방으로 우겨쌈을 당해도 싸이지 않고, 답답한 일을 당해도 절망에 삼켜지지 않고, 박해를 받아도 버림받지 않고, <mark>거꾸러뜨림을 당해도 망하지 않았습니다</mark>(8–9절). 실제로 답답했고 넘어지기도 했지만, 그 자리마다 하나님이 붙드셨습니다.", "바울은 <mark>\"예수의 죽음을 몸에 짊어짐은 예수의 생명도 우리 몸에 나타나게 하려 함\"</mark>(10절)이라고 말합니다. 예수님 때문에 고난과 위험을 감당하는 바로 그 몸에서 부활의 생명이 드러납니다. <mark>\"사망은 우리 안에서, 생명은 너희 안에서\"</mark>(12절). 바울이 위험 속에서도 복음을 전했기에 성도들이 생명을 누렸습니다. 내가 믿음 안에서 자라기까지 누군가 감당한 수고를 기억하면 공동체에 감사가 생기고, 나도 그 섬김에 참여하게 됩니다."], "points": ["하나님의 능력은 고난 속에서 다시 일어나 복음을 전하고 사람을 섬기게 하는 힘입니다."]}, {"title": "13–15절 · 부활을 믿기에 말하고 함께 섬깁니다", "paragraphs": ["바울은 시편 116편 10절을 인용합니다. <mark>\"내가 믿었으므로 말하였다\"</mark>. 시편 기자가 고난 속에서도 하나님을 믿었기에 말했듯, 바울도 믿기 때문에 복음을 전합니다. 그가 믿는 것은 분명합니다. <mark>\"주 예수를 다시 살리신 이가 예수와 함께 우리도 다시 살리사\"</mark>(14절). 부활은 바울이 오늘 위험을 감수하면서도 복음을 전할 수 있는 근거였습니다.", "특히 <mark>\"너희와 함께 그 앞에 서게 하실\"</mark>이라는 말을 눈여겨보십시오. 바울과 고린도 성도들 사이에는 갈등이 있었지만, 바울은 그들을 장차 자신과 함께 주님 앞에 설 사람들로 바라봅니다. 그래서 그들을 위해 수고하며, 더 많은 사람이 은혜를 받고 그 <mark>감사가 하나님께 영광으로 돌아가기를</mark> 바랍니다(15절). 갈등 중인 사람도 주님 앞에 함께 설 사람으로 바라볼 때 섬김이 달라집니다."], "points": ["부활의 소망은 오늘의 위험과 수고를 감당할 근거가 됩니다."]}, {"title": "16–18절 · 보이지 않는 영원한 것을 주목합니다", "paragraphs": ["1절에서 \"낙심하지 아니하고\"로 시작한 바울은 다시 <mark>\"그러므로 우리가 낙심하지 아니하노니\"</mark>라고 고백합니다. 바울의 몸은 고난으로 쇠약해지고 있었지만 <mark>\"속사람은 날로 새로워지도다\"</mark>(16절). 고난의 흔적이 쌓이는 동안에도 하나님을 신뢰하고 그리스도를 닮아 가는 삶이 자라고 있었습니다. 3장의 \"주의 형상으로 변화\"하는 말씀이 고난받는 바울의 삶으로 나타난 것입니다.", "1장에서 감당하기 어려울 만큼 무거운 고난을 고백했던 바울이 이제 그것을 <mark>\"잠시 받는 환난의 경한 것\"</mark>이라 부르며 <mark>\"영원한 영광의 중한 것\"</mark>과 나란히 놓습니다(17절). 4장에는 '보는 일'의 흐름이 있습니다. 4절에서는 그리스도의 영광을 보지 못하는 마음, 6절에서는 그 마음에 비추시는 빛, 18절에서는 그 빛을 받은 바울이 <mark>보이는 것이 아니라 보이지 않는 영원한 것을 주목</mark>하는 모습입니다."], "points": ["날마다 새로워지는 삶은, 지친 자리에서 하나님께 힘을 얻어 다시 믿음으로 한 걸음을 내딛는 삶입니다."]}, {"title": "적용 · 부활하신 예수님을 바라보며 다시 한 걸음", "paragraphs": ["히브리서 12장은 <mark>예수님을 바라보라</mark>고 권면합니다. 예수님은 앞에 놓인 기쁨을 바라보며 십자가의 고통과 수치를 견디셨고, 우리가 지쳐 낙심할 때 그 예수님을 깊이 생각하라고 합니다(히 12:2–3). 십자가를 지신 예수님은 죽음을 이기고 살아나셨습니다. 그래서 바울이 바라본 미래에는 확실한 근거가 있었습니다. <mark>예수님을 다시 살리신 하나님께서 그분께 속한 사람들도 다시 살리실 것입니다</mark>. 나는 세상에 속한 사람입니까, 그리스도께 속한 사람입니까?", "그 소망을 품은 바울은 오늘 자기 앞에 있는 사람을 섬겼습니다. 하나님 나라를 바라보는 시선이 그의 하루를 움직였습니다. 우리도 오래 기도하고 수고했는데 아무것도 달라지지 않는 것처럼 보일 때가 많습니다. 그때 결과가 아니라 <mark>하나님께서 내게 맡기신 한 가지</mark>를 살펴보십시오.", "지쳐서 멈추었던 섬김이 있다면 오늘 다시 작게 시작하십시오. 마음이 급해 내 말만 앞세웠다면, 오늘은 <mark>그 사람의 이야기를 끝까지 들어 주십시오</mark>. 사람을 살리시는 하나님을 믿는 마음은 그런 작은 섬김에서 드러납니다. 나는 질그릇이지만, 그 안의 보배와 능력은 하나님께 있습니다.", "오늘 내 마음을 가장 크게 흔드는 일 앞에서, 부활하신 예수님을 바라보며 힘을 내어 다시 내디딜 한 걸음은 무엇입니까?"], "points": ["보이는 결과가 아니라 부활하신 주님을 바라보며, 오늘의 섬김을 이어 갑니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "일이 잘되고 안되는 것으로 하나님의 함께하심과 내 믿음을 판단하지 않았는지 돌아봤다"}, {"key": "c2", "text": "결과를 빨리 내려고 진실하지 않은 방법을 가볍게 여기지 않았는지 점검했다"}, {"key": "c3", "text": "나의 연약함을 숨기기보다 질그릇 안의 하나님의 능력을 의지했다"}, {"key": "c4", "text": "갈등 중인 사람도 주님 앞에 함께 설 사람으로 바라보려 했다"}], "s4heading": "묵상 한 줄", "memoHint": "지금 나를 낙심하게 하는 일은 무엇이며, 그 일 너머 보이지 않는 영원한 것을 바라볼 때 무엇이 달라집니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "시선 옮기기", "value": "낙심되는 일 하나를 적고, 그 옆에 부활의 소망으로 바라본 한 문장을 적어 보기"}, {"key": "act2", "label": "멈춘 섬김 다시", "value": "지쳐서 멈추었던 섬김 하나를 오늘 작게라도 다시 시작하기"}, {"key": "act3", "label": "끝까지 들어 주기", "value": "마음이 급해 내 말만 앞세웠던 사람의 이야기를 오늘은 끝까지 들어 주기"}, {"key": "act4", "label": "수고에 감사하기", "value": "내 믿음이 자라기까지 수고해 준 사람에게 감사의 마음 전하기"}, {"key": "act5", "label": "말씀 암송", "value": "고린도후서 4:16–18을 외우며 보이지 않는 영원한 것을 주목하기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "긍휼로 직분을 맡기시고, 연약한 질그릇 안에 복음의 보배를 두시며, 예수님을 살리신 능력으로 우리도 다시 살리실 하나님께 감사합니다"}, {"key": "p2", "tag": "회개", "text": "일의 결과로 믿음을 판단하고, 결과를 서두르며 방법을 가볍게 여기고, 보이는 것에만 시선을 두어 쉽게 낙심했던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "겉사람은 낡아져도 속사람이 날로 새로워지게 하시고, 보이지 않는 영원한 것을 주목하며 오늘 맡기신 섬김을 이어 가게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "November 5, Thursday", "ref": "2 Corinthians 4:1–18", "headline": "When I'm Discouraged,<br>Where Is My Gaze?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · 2 Corinthians 4:1-18", "s1heading": "Today's Word", "verse": "\"So we do not lose heart.<br>Though our outer self is wasting away,<br>our inner self is being renewed day by day.\"", "verseRef": "2 Corinthians 4:16", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · When Things Going Well Becomes the Measure of Faith", "paragraphs": ["As we believe in God, we hope our lives will be stable and our work will go well. But when things going well becomes the standard for judging our faith, our hearts begin to sway with our circumstances. When things work out, we rejoice that God is with us; when they get stuck, we doubt even our faith or calling. In chapter 3, Paul spoke of the glory shining on Moses' face as he came down from Sinai, and said that those who turn to the Lord have the veil over their hearts removed and are transformed by the Spirit into the Lord's image. Chapter 4 shows how that glory was revealed in <mark>the life of Paul, who was suffering</mark>.", "Even the apostle Paul had limits to what he could bear. There were times when the way ahead looked hopeless, his body was exhausted, and he could hardly hold on by his own strength. This is the human weakness today's passage shows. In chapter 1, Paul confessed he had despaired even of life; today he says, <mark>'we do not lose heart.'</mark> Still in the midst of suffering, what is he looking at? If we fix our eyes on immediate stability and success, the outcome decides whether we rejoice or despair. But if we fix our eyes on <mark>what God is doing now and the kingdom He will complete through resurrection</mark>, we can hold hope even in suffering and continue today's service and sacrifice. As you listen to the Word, ask yourself: Is what moves me now the earthly result I'm looking at, or hope in what God will accomplish? Let's look at three parts."], "points": ["Is what moves me now the visible earthly result, or hope in what God will accomplish?"]}, {"title": "Verses 1–6 · A Ministry Received by God's Mercy, Proclaiming Jesus Christ", "paragraphs": ["Paul begins verse 1 with <mark>'Therefore, having this ministry by the mercy of God, we do not lose heart.'</mark> The reason is in chapter 3: God showed mercy and entrusted him with this ministry — the ministry of the new covenant, in which God appoints servants and the Spirit gives people life. So even when people's responses differed from his expectations, Paul did not alter the Word to suit their tastes or rely on deception. He revealed the truth before God and let people examine his words and actions with their consciences — <mark>'by the open statement of the truth we would commend ourselves to everyone's conscience in the sight of God'</mark> (v. 2). When we want quick results, it's easy to treat our methods lightly. But if we are doing work received from God, we must be truthful in the process of carrying it out too. In verses 3–4, even when Paul proclaimed the gospel clearly, not everyone accepted it. The problem of the veil covering people's hearts in chapter 3 continues in chapter 4 as the problem of not seeing the light of the gospel. Paul explains that 'the god of this world' — Satan — has blinded the minds of unbelievers. What they cannot see is the glory of Christ, who is the image of God. For people to recognize God's love and power in the crucified Jesus, God must illuminate their hearts.", "In verses 5–6, the One Paul proclaims is <mark>Jesus Christ as Lord</mark>, and the place Paul takes before the Corinthians is that of a servant: 'ourselves as your servants for Jesus' sake.' Because Jesus is Lord, Paul serves people for Him. Verse 6 recalls the first scene of Genesis: <mark>'For God, who said, \"Let light shine out of darkness,\" has shone in our hearts to give the light of the knowledge of the glory of God in the face of Jesus Christ.'</mark> The God who shone light into darkness now illuminates human hearts, making known God's glory revealed in the face of Jesus Christ. Those who believe this can be faithful to their part in proclaiming the gospel and entrust people's hearts to God. When we believe it is God who illuminates hearts, we can speak truthfully and wait, even when the response is slow."], "points": ["I am faithful to my part in proclaiming the gospel, and I entrust people's hearts to God."]}, {"title": "Verses 7–12 · Jesus' Life Is Revealed Through Fragile Clay Jars", "paragraphs": ["Verse 7: <mark>'But we have this treasure in jars of clay, to show that the surpassing power belongs to God and not to us.'</mark> 'This treasure' is the gospel of Christ just mentioned — the light of knowing God's glory through Christ. A clay jar is a common, easily broken vessel. Paul says that he and his co-workers, entrusted with that precious gospel, are such weak, breakable clay jars. To understand the glory of chapter 3, we must also see the clay jars of chapter 4. God proclaims the gospel and gives life to people even through Paul, who is suffering. Seeing this makes it clear whose power is at work. In verses 8–9, Paul was <mark>'afflicted in every way, but not crushed; perplexed, but not driven to despair; persecuted, but not forsaken; struck down, but not destroyed.'</mark> Paul really was hard-pressed, and he really was knocked down. But in every such place, God held him up. The power of God Paul speaks of is the strength to rise again in that very suffering, proclaim the gospel, and serve people.", "In verses 10–12, carrying <mark>'in the body the death of Jesus'</mark> means bearing suffering and the danger of death for Jesus' sake. And Paul confesses that in that very suffering body, the life of the risen Jesus is also revealed. Jesus accomplished salvation for us on the cross; Paul suffered while proclaiming the news of that salvation. So verse 12 shifts the focus from the crisis of death Paul faces to the life the Corinthians enjoy: <mark>'So death is at work in us, but life in you.'</mark> Because Paul proclaimed the gospel even in danger, they heard it and came to enjoy life. Becoming like Christ took this form in Paul: even when his own situation was hard, he served to the end so that the people before him might have life. If we remember the labor someone bore until we heard the gospel and grew in faith, gratitude will shape how we treat our community, and we'll join in that service too."], "points": ["God's power is the strength to rise again in suffering, proclaim the gospel, and serve people."]}, {"title": "Verses 13–15 · Believing in Resurrection, We Speak and Serve Together", "paragraphs": ["In verse 13, Paul quotes Psalm 116:10: <mark>'I believed, and so I spoke.'</mark> Just as the psalmist spoke because he trusted God even in suffering, Paul proclaims the gospel because he believes. What he believes is clear: <mark>'knowing that He who raised the Lord Jesus will raise us also with Jesus'</mark> (v. 14). Resurrection was Paul's ground for proclaiming the gospel today, even at the risk of danger.", "Notice especially the words <mark>'and bring us with you into His presence.'</mark> There was conflict between Paul and the Corinthian believers. Yet Paul sees them as people who will one day stand with him before the Lord. So he labors for them, hoping that as grace extends to more and more people, <mark>it may increase thanksgiving, to the glory of God</mark> (v. 15). When we see even those we're in conflict with as people who will stand together before the Lord, our service changes."], "points": ["The hope of resurrection is the ground for bearing today's dangers and labors."]}, {"title": "Verses 16–18 · Looking to the Unseen and Eternal", "paragraphs": ["Paul, who began verse 1 with 'we do not lose heart,' confesses again as he enters the final section: <mark>'So we do not lose heart.'</mark> Having received his ministry by God's mercy, he now holds on to the hope of resurrection and returns to the same confession. Even then, Paul's body was wasting away through suffering. Yet he confesses that <mark>'our inner self is being renewed day by day'</mark> (v. 16). While the marks of suffering accumulated on his body, a life of trusting God and becoming like Christ was growing. The words of chapter 3 — that the Spirit transforms us into the Lord's image — appear here in the life of the suffering Paul.", "In verses 17–18, Paul calls his present affliction <mark>'light momentary affliction.'</mark> In chapter 1, he confessed suffering so heavy he could hardly bear it. Paul, who knew that weight better than anyone, now sets the affliction side by side with <mark>'an eternal weight of glory beyond all comparison'</mark> that he will enjoy. He had the hope that God would use even that suffering to accomplish eternal glory. Chapter 4 has a flow concerning seeing. In verse 4, a heart that cannot see Christ's glory appears; in verse 6, God shines light into that heart; and in verse 18, we see where Paul, having received that light, fixes his gaze: <mark>'as we look not to the things that are seen but to the things that are unseen. For the things that are seen are transient, but the things that are unseen are eternal.'</mark> Beyond the affliction visible now lie the resurrection and eternal glory God has promised. Because Paul believes that future, he continues today's labor."], "points": ["A life renewed day by day draws strength from God and takes one more step of faith from a place of exhaustion."]}, {"title": "Application · Looking to the Risen Jesus, One More Step", "paragraphs": ["Hebrews 12 urges us to <mark>look to Jesus</mark>. He endured the pain and shame of the cross for the joy set before Him, and the writer tells us to consider Him deeply when we grow weary and lose heart (Hebrews 12:2–3). Jesus, who bore the cross, conquered death and rose again. So the future Paul looked to had a sure foundation: <mark>the God who raised Jesus will also raise those who belong to Him.</mark> Whom do you belong to — the world, or Christ?", "Holding that hope, Paul served the people before him each day. His gaze on God's kingdom moved his day that way. We too often feel that we've prayed and labored long, yet nothing seems to have changed. At such times, hold on to today's Word and look not at the results but at <mark>the one thing God has entrusted to you</mark>.", "If there's a service you stopped because you were worn out, begin it again today, even in a small way. If you've been in a hurry and pushed only your own words, today <mark>listen to that person's story to the end</mark>. A heart that believes in the God who gives life shows itself in small acts of service like these. I am a clay jar — but the treasure and the power within belong to God.", "In the matter that shakes my heart most today, what is the one step I will take again, drawing strength as I look to the risen Jesus?"], "points": ["Looking not at visible results but at the risen Lord, I continue today's service."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether I judge God's presence and my faith by whether things go well or not."}, {"key": "c2", "text": "I checked whether I treated untruthful methods lightly in a hurry for results."}, {"key": "c3", "text": "Rather than hiding my weakness, I relied on God's power within the clay jar."}, {"key": "c4", "text": "I tried to see even someone I'm in conflict with as a person who will stand with me before the Lord."}], "s4heading": "One-Line Reflection", "memoHint": "What is discouraging me right now, and what changes when I look beyond it to the unseen and eternal?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Shift My Gaze", "value": "Write down one discouraging matter, and next to it write one sentence seeing it through the hope of resurrection"}, {"key": "act2", "label": "Resume Service", "value": "Restart, even in a small way, one service you stopped because you were worn out"}, {"key": "act3", "label": "Listen to the End", "value": "Listen fully today to someone you've rushed past with your own words"}, {"key": "act4", "label": "Thank Their Labor", "value": "Express gratitude to someone who labored for your faith to grow"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize 2 Corinthians 4:16–18 and fix your eyes on the unseen and eternal"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, God, for entrusting me with ministry by Your mercy, placing the treasure of the gospel in a fragile clay jar, and promising to raise us by the power that raised Jesus."}, {"key": "p2", "tag": "Repent", "text": "I repent of judging my faith by results, rushing outcomes while treating methods lightly, and losing heart easily by fixing my eyes only on what is seen."}, {"key": "p3", "tag": "Ask", "text": "Though my outer self wastes away, renew my inner self day by day; help me fix my eyes on the unseen and eternal and continue the service You've entrusted to me today."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Nobyembre 5, Huwebes", "ref": "2 Corinto 4:1–18", "headline": "Kapag Ako'y Nanghihina ang Loob,<br>Saan Nakatuon ang Aking Paningin?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · 2 Corinto 4:1-18", "s1heading": "Salita Ngayon", "verse": "\"Kaya hindi kami nanghihina ang loob.<br>Bagama't ang aming panlabas na pagkatao ay nanlulupaypay,<br>ang aming panloob na pagkatao ay binabago araw-araw.\"", "verseRef": "2 Corinto 4:16", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Kapag Nagiging Sukatan ng Pananampalataya ang Maayos na Takbo ng mga Bagay", "paragraphs": ["Habang nananampalataya tayo sa Diyos, inaasahan nating magiging matatag ang ating buhay at magiging maayos ang ating gawain. Ngunit kapag ang maayos na takbo ng mga bagay ay naging pamantayan sa paghatol sa ating pananampalataya, nagsisimulang umuga ang ating puso ayon sa ating kalagayan. Kapag umaayon ang mga bagay, nagagalak tayong kasama natin ang Diyos; kapag naiipit, pinagdududahan pa natin ang ating pananampalataya o tawag. Sa kabanata 3, nagsalita si Pablo tungkol sa kaluwalhatiang nagniningning sa mukha ni Moises nang bumaba siya mula sa Sinai, at sinabing ang mga bumabaling sa Panginoon ay inaalisan ng talukbong sa kanilang puso at binabago ng Espiritu sa larawan ng Panginoon. Ipinapakita ng kabanata 4 kung paano nahayag ang kaluwalhatiang iyon sa <mark>buhay ni Pablo, na nagdurusa</mark>.", "Kahit si apostol Pablo ay may hangganan sa kaya niyang pasanin. May mga panahong mukhang walang pag-asa ang daan sa unahan, pagod ang kanyang katawan, at halos hindi siya makatagal sa sarili niyang lakas. Ito ang kahinaan ng tao na ipinapakita ng talata ngayon. Sa kabanata 1, ipinahayag ni Pablo na nawalan siya ng pag-asang mabuhay; ngayon ay sinasabi niyang, <mark>'hindi kami nanghihina ang loob.'</mark> Nasa gitna pa rin ng pagdurusa, ano ang kanyang tinitingnan? Kung itutuon natin ang ating mata sa agarang katatagan at tagumpay, ang resulta ang magpapasya kung tayo'y magagalak o manghihina ang loob. Ngunit kung itutuon natin ang ating mata sa <mark>ginagawa ng Diyos ngayon at sa kahariang Kanyang lulubusin sa pamamagitan ng muling pagkabuhay</mark>, maaari tayong humawak ng pag-asa kahit sa pagdurusa at ipagpatuloy ang paglilingkod at sakripisyo ngayon. Habang nakikinig sa Salita, tanungin ang sarili: Ang nagpapakilos ba sa akin ngayon ay ang makalupang resultang tinitingnan ko, o ang pag-asa sa gagawin ng Diyos? Tingnan natin ang tatlong bahagi."], "points": ["Ang nagpapakilos ba sa akin ngayon ay ang nakikitang makalupang resulta, o ang pag-asa sa gagawin ng Diyos?"]}, {"title": "Talata 1–6 · Ministeryong Natanggap sa Awa ng Diyos, Ipinapahayag si Jesu-Cristo", "paragraphs": ["Sinimulan ni Pablo ang talata 1 sa <mark>'Kaya nga, dahil taglay namin ang ministeryong ito sa awa ng Diyos, hindi kami nanghihina ang loob.'</mark> Nasa kabanata 3 ang dahilan: nagpakita ng awa ang Diyos at ipinagkatiwala sa kanya ang ministeryong ito — ang ministeryo ng bagong tipan, kung saan nagtatalaga ang Diyos ng mga lingkod at nagbibigay-buhay ang Espiritu sa mga tao. Kaya kahit iba ang tugon ng mga tao sa kanyang inaasahan, hindi binago ni Pablo ang Salita upang umangkop sa kanilang panlasa o umasa sa panlilinlang. Inihayag niya ang katotohanan sa harap ng Diyos at hinayaang suriin ng mga tao ang kanyang mga salita at kilos sa kanilang konsensya — <mark>'sa hayag na pagpapahayag ng katotohanan ay inirerekomenda namin ang aming sarili sa konsensya ng bawat isa sa paningin ng Diyos'</mark> (t. 2). Kapag gusto natin ng mabilis na resulta, madaling gaanin ang ating mga paraan. Ngunit kung gawaing natanggap mula sa Diyos ang ginagawa natin, dapat tayong maging tapat din sa proseso ng pagsasagawa nito. Sa talata 3–4, kahit malinaw na ipinangaral ni Pablo ang ebanghelyo, hindi lahat ay tumanggap nito. Ang problema ng talukbong na tumatakip sa puso ng tao sa kabanata 3 ay nagpapatuloy sa kabanata 4 bilang problema ng hindi pagkakita sa liwanag ng ebanghelyo. Ipinaliwanag ni Pablo na binulag ng 'diyos ng sanlibutang ito' — si Satanas — ang isip ng mga hindi mananampalataya. Ang hindi nila nakikita ay ang kaluwalhatian ni Cristo, na larawan ng Diyos. Upang makilala ng tao ang pag-ibig at kapangyarihan ng Diyos sa ipinakong si Jesus, kailangang liwanagan ng Diyos ang kanilang puso.", "Sa talata 5–6, ang Isang ipinangangaral ni Pablo ay si <mark>Jesu-Cristo bilang Panginoon</mark>, at ang lugar na kinukuha ni Pablo sa harap ng mga taga-Corinto ay ang lugar ng lingkod: 'ang aming sarili bilang inyong mga lingkod alang-alang kay Jesus.' Dahil si Jesus ang Panginoon, naglilingkod si Pablo sa mga tao para sa Kanya. Ipinapaalala ng talata 6 ang unang tagpo ng Genesis: <mark>'Sapagkat ang Diyos na nagsabing, \"Magliwanag ang ilaw mula sa kadiliman,\" ay nagliwanag sa aming mga puso upang ibigay ang liwanag ng pagkakilala sa kaluwalhatian ng Diyos sa mukha ni Jesu-Cristo.'</mark> Ang Diyos na nagpaliwanag sa kadiliman ay nagliliwanag na ngayon sa puso ng tao, ipinakikilala ang kaluwalhatian ng Diyos na inihayag sa mukha ni Jesu-Cristo. Ang mga naniniwala rito ay maaaring maging tapat sa kanilang bahagi sa pagpapahayag ng ebanghelyo at ipagkatiwala sa Diyos ang puso ng mga tao. Kapag naniniwala tayong ang Diyos ang nagliliwanag sa mga puso, maaari tayong magsalita nang totoo at maghintay, kahit mabagal ang tugon."], "points": ["Tapat ako sa aking bahagi sa pagpapahayag ng ebanghelyo, at ipinagkakatiwala ko sa Diyos ang puso ng mga tao."]}, {"title": "Talata 7–12 · Nahahayag ang Buhay ni Jesus sa Pamamagitan ng Marupok na Sisidlang Luwad", "paragraphs": ["Talata 7: <mark>'Ngunit taglay namin ang kayamanang ito sa mga sisidlang luwad, upang ipakitang sa Diyos ang napakahigit na kapangyarihan at hindi sa amin.'</mark> Ang 'kayamanang ito' ay ang ebanghelyo ni Cristo na kababanggit lamang — ang liwanag ng pagkakilala sa kaluwalhatian ng Diyos sa pamamagitan ni Cristo. Ang sisidlang luwad ay pangkaraniwan at madaling mabasag. Sinasabi ni Pablo na siya at ang kanyang mga kamanggagawa, na pinagkatiwalaan ng mahalagang ebanghelyong iyon, ay ganoong mahihina at nababasag na sisidlang luwad. Upang maunawaan ang kaluwalhatian ng kabanata 3, dapat din nating makita ang mga sisidlang luwad ng kabanata 4. Ipinapahayag ng Diyos ang ebanghelyo at nagbibigay-buhay sa mga tao kahit sa pamamagitan ni Pablo na nagdurusa. Sa pagkakita rito, lumilinaw kung kaninong kapangyarihan ang kumikilos. Sa talata 8–9, si Pablo ay <mark>'pinahihirapan sa lahat ng paraan, ngunit hindi nadudurog; nalilito, ngunit hindi nawawalan ng pag-asa; inuusig, ngunit hindi pinababayaan; pinababagsak, ngunit hindi nawawasak.'</mark> Tunay na naipit si Pablo, at tunay siyang napabagsak. Ngunit sa bawat ganoong lugar, inalalayan siya ng Diyos. Ang kapangyarihan ng Diyos na sinasabi ni Pablo ay ang lakas na bumangong muli sa mismong pagdurusang iyon, ipangaral ang ebanghelyo, at maglingkod sa mga tao.", "Sa talata 10–12, ang pagdadala <mark>'sa katawan ng kamatayan ni Jesus'</mark> ay nangangahulugang pagpasan ng pagdurusa at panganib ng kamatayan alang-alang kay Jesus. At ipinahayag ni Pablo na sa mismong nagdurusang katawang iyon ay nahahayag din ang buhay ng muling nabuhay na si Jesus. Nagsakatuparan si Jesus ng kaligtasan para sa atin sa krus; nagdusa si Pablo habang ipinapahayag ang balita ng kaligtasang iyon. Kaya inililipat ng talata 12 ang tuon mula sa krisis ng kamatayang hinaharap ni Pablo tungo sa buhay na tinatamasa ng mga taga-Corinto: <mark>'Kaya ang kamatayan ay kumikilos sa amin, ngunit ang buhay sa inyo.'</mark> Dahil ipinangaral ni Pablo ang ebanghelyo kahit sa panganib, narinig nila ito at tinamasa ang buhay. Ang pagiging kawangis ni Cristo ay nagkaroon ng ganitong anyo kay Pablo: kahit mahirap ang sarili niyang kalagayan, naglingkod siya hanggang sa wakas upang magkaroon ng buhay ang mga tao sa harap niya. Kung aalalahanin natin ang pagpapagal na pinasan ng iba hanggang sa marinig natin ang ebanghelyo at lumago sa pananampalataya, huhubugin ng pasasalamat ang pagtrato natin sa ating komunidad, at makikibahagi rin tayo sa paglilingkod na iyon."], "points": ["Ang kapangyarihan ng Diyos ay ang lakas na bumangong muli sa pagdurusa, ipangaral ang ebanghelyo, at maglingkod sa mga tao."]}, {"title": "Talata 13–15 · Dahil Naniniwala sa Muling Pagkabuhay, Nagsasalita at Sama-samang Naglilingkod", "paragraphs": ["Sa talata 13, sinipi ni Pablo ang Awit 116:10: <mark>'Naniwala ako, kaya ako nagsalita.'</mark> Kung paanong nagsalita ang mang-aawit dahil nagtiwala siya sa Diyos kahit sa pagdurusa, ipinangangaral ni Pablo ang ebanghelyo dahil siya'y naniniwala. Malinaw ang kanyang pinaniniwalaan: <mark>'nalalamang ang Diyos na bumuhay sa Panginoong Jesus ay bubuhay rin sa amin kasama ni Jesus'</mark> (t. 14). Ang muling pagkabuhay ang batayan ni Pablo sa pangangaral ng ebanghelyo ngayon, kahit may panganib.", "Pansinin lalo ang mga salitang <mark>'at dadalhin kami kasama ninyo sa Kanyang harapan.'</mark> May alitan sa pagitan ni Pablo at ng mga mananampalataya sa Corinto. Gayunman, nakikita sila ni Pablo bilang mga taong balang araw ay tatayo kasama niya sa harap ng Panginoon. Kaya nagpapagal siya para sa kanila, umaasang habang umaabot ang biyaya sa parami nang paraming tao, <mark>madaragdagan nito ang pasasalamat, para sa kaluwalhatian ng Diyos</mark> (t. 15). Kapag nakikita natin kahit ang mga kaalitan natin bilang mga taong sama-samang tatayo sa harap ng Panginoon, nagbabago ang ating paglilingkod."], "points": ["Ang pag-asa ng muling pagkabuhay ang batayan sa pagpasan ng mga panganib at pagpapagal ngayon."]}, {"title": "Talata 16–18 · Tumitingin sa Hindi Nakikita at Walang Hanggan", "paragraphs": ["Si Pablo, na nagsimula sa talata 1 sa 'hindi kami nanghihina ang loob,' ay muling nagpahayag habang pumapasok sa huling bahagi: <mark>'Kaya hindi kami nanghihina ang loob.'</mark> Dahil natanggap niya ang kanyang ministeryo sa awa ng Diyos, hinahawakan niya ngayon ang pag-asa ng muling pagkabuhay at bumabalik sa parehong pagpapahayag. Kahit noon, nanlulupaypay ang katawan ni Pablo dahil sa pagdurusa. Gayunman, ipinahayag niyang <mark>'ang aming panloob na pagkatao ay binabago araw-araw'</mark> (t. 16). Habang naiipon ang mga marka ng pagdurusa sa kanyang katawan, lumalago ang buhay ng pagtitiwala sa Diyos at pagiging kawangis ni Cristo. Ang mga salita ng kabanata 3 — na binabago tayo ng Espiritu sa larawan ng Panginoon — ay lumilitaw dito sa buhay ng nagdurusang si Pablo.", "Sa talata 17–18, tinatawag ni Pablo ang kanyang kasalukuyang kapighatian na <mark>'magaan at panandaliang kapighatian.'</mark> Sa kabanata 1, ipinahayag niya ang pagdurusang napakabigat na halos hindi niya mapasan. Si Pablo, na nakaaalam sa bigat na iyon nang higit sa sinuman, ay inilalagay na ngayon ang kapighatian katabi ng <mark>'walang-hanggang bigat ng kaluwalhatiang higit sa lahat ng paghahambing'</mark> na kanyang tatamasahin. May pag-asa siyang gagamitin ng Diyos kahit ang pagdurusang iyon upang makamit ang walang-hanggang kaluwalhatian. May daloy ang kabanata 4 tungkol sa pagtingin. Sa talata 4, lumilitaw ang pusong hindi makakita sa kaluwalhatian ni Cristo; sa talata 6, nagpapaliwanag ang Diyos sa pusong iyon; at sa talata 18, nakikita natin kung saan itinuon ni Pablo, na nakatanggap ng liwanag na iyon, ang kanyang paningin: <mark>'habang tumitingin kami hindi sa mga bagay na nakikita kundi sa mga bagay na hindi nakikita. Sapagkat ang mga nakikita ay pansamantala, ngunit ang mga hindi nakikita ay walang hanggan.'</mark> Lampas sa kapighatiang nakikita ngayon ay naroon ang muling pagkabuhay at walang-hanggang kaluwalhatiang ipinangako ng Diyos. Dahil naniniwala si Pablo sa hinaharap na iyon, ipinagpapatuloy niya ang pagpapagal ngayon."], "points": ["Ang buhay na binabago araw-araw ay kumukuha ng lakas sa Diyos at muling humahakbang sa pananampalataya mula sa lugar ng pagkapagod."]}, {"title": "Aplikasyon · Tumitingin sa Muling Nabuhay na si Jesus, Isa Pang Hakbang", "paragraphs": ["Hinihimok tayo ng Hebreo 12 na <mark>tumingin kay Jesus</mark>. Tiniis Niya ang sakit at kahihiyan ng krus dahil sa kagalakang nakalagay sa harap Niya, at sinasabi ng manunulat na isipin natin Siya nang malalim kapag tayo'y napapagod at nanghihina ang loob (Hebreo 12:2–3). Si Jesus, na nagpasan ng krus, ay nagtagumpay sa kamatayan at muling nabuhay. Kaya may matibay na pundasyon ang hinaharap na tinitingnan ni Pablo: <mark>ang Diyos na bumuhay kay Jesus ay bubuhay rin sa mga kabilang sa Kanya.</mark> Kanino ka nabibilang — sa mundo, o kay Cristo?", "Sa paghawak sa pag-asang iyon, naglingkod si Pablo araw-araw sa mga tao sa harap niya. Ang kanyang pagtingin sa kaharian ng Diyos ang nagpakilos sa kanyang araw sa ganoong paraan. Madalas din nating madama na matagal na tayong nananalangin at nagpapagal, ngunit tila walang nagbago. Sa mga ganoong panahon, hawakan ang Salita ngayon at tingnan hindi ang mga resulta kundi <mark>ang isang bagay na ipinagkatiwala sa iyo ng Diyos</mark>.", "Kung may paglilingkod na itinigil mo dahil pagod ka, simulan itong muli ngayon, kahit sa maliit na paraan. Kung nagmamadali ka at inuna mo lamang ang sarili mong salita, ngayon ay <mark>pakinggan ang kuwento ng taong iyon hanggang sa dulo</mark>. Nahahayag ang pusong naniniwala sa Diyos na nagbibigay-buhay sa maliliit na paglilingkod na tulad nito. Ako'y sisidlang luwad — ngunit ang kayamanan at kapangyarihan sa loob ay sa Diyos.", "Sa bagay na pinakamalakas na yumayanig sa aking puso ngayon, ano ang isang hakbang na muli kong gagawin, kumukuha ng lakas habang tumitingin sa muling nabuhay na si Jesus?"], "points": ["Tumitingin hindi sa nakikitang resulta kundi sa muling nabuhay na Panginoon, ipinagpapatuloy ko ang paglilingkod ngayon."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung hinahatulan ko ang presensya ng Diyos at ang aking pananampalataya batay sa kung maayos o hindi ang takbo ng mga bagay."}, {"key": "c2", "text": "Sinuri ko kung ginaan ko ang mga hindi tapat na paraan dahil nagmamadali ako sa resulta."}, {"key": "c3", "text": "Sa halip na itago ang aking kahinaan, umasa ako sa kapangyarihan ng Diyos sa loob ng sisidlang luwad."}, {"key": "c4", "text": "Sinikap kong makita kahit ang taong kaalitan ko bilang taong tatayo kasama ko sa harap ng Panginoon."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Ano ang nagpapahina ng aking loob ngayon, at ano ang nagbabago kapag tumingin ako lampas dito sa hindi nakikita at walang hanggan?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Ilipat ang Paningin", "value": "Isulat ang isang bagay na nagpapahina ng loob, at sa tabi nito ay sumulat ng isang pangungusap na tinitingnan ito sa pag-asa ng muling pagkabuhay"}, {"key": "act2", "label": "Ipagpatuloy ang Paglilingkod", "value": "Simulang muli, kahit sa maliit na paraan, ang isang paglilingkod na itinigil mo dahil pagod ka"}, {"key": "act3", "label": "Makinig Hanggang Dulo", "value": "Pakinggan nang buo ngayon ang taong nilampasan mo dahil inuna mo ang sarili mong salita"}, {"key": "act4", "label": "Pasalamatan ang Kanilang Pagpapagal", "value": "Ipahayag ang pasasalamat sa taong nagpagal upang lumago ang iyong pananampalataya"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang 2 Corinto 4:16–18 at itutok ang mata sa hindi nakikita at walang hanggan"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Diyos, sa pagkakatiwala sa akin ng ministeryo sa Iyong awa, sa paglalagay ng kayamanan ng ebanghelyo sa marupok na sisidlang luwad, at sa pangakong bubuhayin kami sa kapangyarihang bumuhay kay Jesus."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa paghatol sa aking pananampalataya batay sa resulta, sa pagmamadali sa kinalabasan habang ginagaan ang mga paraan, at sa madaling panghihina ng loob dahil sa pagtingin lamang sa nakikita."}, {"key": "p3", "tag": "Kahilingan", "text": "Bagama't nanlulupaypay ang aking panlabas na pagkatao, baguhin Mo araw-araw ang aking panloob na pagkatao; tulungan Mo akong itutok ang mata sa hindi nakikita at walang hanggan at ipagpatuloy ang paglilingkod na ipinagkatiwala Mo sa akin ngayon."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-11-05';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
