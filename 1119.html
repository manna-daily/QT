<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "11월 19일 목요일", "ref": "시편 20편 1–9절", "headline": "준비를 다 마친 뒤에도<br>왜 함께 기도할까요?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 시편 20:1-9", "s1heading": "오늘의 말씀", "verse": "\"어떤 사람은 병거, 어떤 사람은 말을 의지하나<br>우리는 여호와 우리 하나님의 이름을 자랑하리로다\"", "verseRef": "시편 20:7", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 길이 보인 뒤에도 하나님께 길을 묻습니까", "paragraphs": ["어려운 일이 생기면 우리는 먼저 연락할 사람이 있는지, 준비한 돈과 시간이 충분한지 살펴봅니다. 그러다 도와줄 사람이 생기고 해결할 길이 보이면 한숨 돌립니다. 그런데 바로 그때 우리의 기도는 어떻게 달라집니까? <mark>길이 보인 뒤에도 여전히 하나님께 길을 묻고 있습니까?</mark> 시편 19편은 한 사람이 입의 말과 마음의 묵상을 하나님께 드리는 기도로 끝났습니다.", "오늘 시편 20편에서는 <mark>온 백성이 왕의 소원과 계획을 함께 하나님께 올려드립니다</mark>. 병거와 말이 등장하는 것을 보면 전쟁을 앞둔 때로 보입니다. 왕에게는 백성을 지킬 계획이 필요했고, 그 왕에게도 함께 기도해 줄 백성이 필요했습니다. 이 시편은 맡은 일에 최선을 다하면서 그 계획과 결과까지 하나님의 주권 아래 두는 믿음을 보여 줍니다. 그래서 공동체는 준비를 마친 뒤에도 기도합니다."], "points": ["준비가 충분하다고 느낄 때, 나의 기도는 줄어들고 있지 않습니까?"]}, {"title": "1–3절 · 환난을 앞둔 왕을 위해 함께 구하는 공동체", "paragraphs": ["왕은 백성을 지킬 책임이 있는 사람입니다. 그런데 시편의 첫 장면에서는 <mark>백성이 왕을 위해 보호를 구합니다</mark>. <mark>\"환난 날에 여호와께서 네게 응답하시고 야곱의 하나님의 이름이 너를 높이 드시며\"</mark>(1절). 야곱은 환난 날에 응답하시고 가는 길에 함께하신 하나님을 기억했습니다. 백성은 그 하나님께 왕을 높이 들어 위험이 미치지 못하는 곳에 두시고, 성소에서 돕고 시온에서 붙들어 주시기를 구합니다(2절).", "이어서 그들은 왕의 소제를 기억하시고 <mark>번제를 받아 주시기를</mark>(3절) 구합니다. 나라의 중요한 결정을 내리는 왕도 하나님 앞에서는 은혜를 구하는 예배자입니다. 우리도 교회와 공동체에서 책임을 맡은 이들을 위해 이렇게 기도할 수 있습니다. 결정할 일이 많은 그분이 <mark>먼저 하나님 앞에 마음을 드리고, 예배 가운데 힘을 얻도록</mark> 말입니다."], "points": ["나는 책임을 맡은 사람들에게 요구하기보다, 그들을 위해 먼저 기도하고 있습니까?"]}, {"title": "4–5절 · 준비한 계획을 하나님 앞에 올려드리는 기도", "paragraphs": ["<mark>\"네 마음의 소원대로 허락하시고 네 모든 계획을 이루어 주시기를 원하노라\"</mark>(4절). 마지막 말 '원하노라'에 귀를 기울여 보십시오. 왕이 무엇을 준비했는지 아는 백성이 그 계획을 하나님 앞에 가져와 이루어 주시기를 간청합니다. 우리도 중요한 일을 앞두고 이렇게 기도할 수 있습니다. \"주님, 이 일을 위해 여기까지 준비했습니다. 저희가 놓친 것이 있다면 보게 해 주십시오.\" 이렇게 기도할 때 <mark>준비한 일에 책임을 다하면서도 자기 판단을 고집하지 않을 수 있습니다</mark>.", "백성은 왕이 구원받는 날 <mark>하나님의 이름으로 깃발을 세우고</mark> 함께 기뻐할 것을 바라봅니다(5절). 누군가를 위해 오래 기도해 본 사람은 압니다. 그 사람이 힘을 되찾았다는 소식이 오면 내 일처럼 기쁩니다. 함께 기도하는 동안 그의 어려움이 이미 우리 마음에 들어와 있었기 때문입니다. 지도자를 위해 기도하면 그에게 모든 답을 기대하던 마음을 내려놓고, <mark>그가 감당하는 짐을 함께 지게 됩니다</mark>."], "points": ["중요한 일을 앞두고 \"제가 놓친 것을 보게 해 주십시오\"라고 기도하고 있습니까?"]}, {"title": "6–8절 · 병거와 말이 아니라 여호와의 이름을", "paragraphs": ["함께 드리던 기도 가운데 한 사람의 목소리가 들립니다. <mark>\"이제 내가 아노니 여호와께서 기름 부음 받은 자를 구원하시는 줄\"</mark>(6절). 2절에서 시온에서 도와주시기를 구했는데, 6절은 바로 그 하나님이 <mark>거룩한 하늘에서 오른손의 힘으로</mark> 응답하신다고 고백합니다. 내 사정을 가까이서 들으시는 분이 온 세상을 다스리시는 하나님이십니다. 여기에 기도하는 사람의 확신이 있습니다.", "<mark>\"어떤 사람은 병거, 어떤 사람은 말을 의지하나 우리는 여호와 우리 하나님의 이름을 자랑하리로다\"</mark>(7절). 병거와 말은 눈으로 확인할 수 있는 군사력이었고, 이 백성에게도 왕의 계획이 있었습니다. 그러나 계획을 위해 기도하던 입술로 그들은 여호와의 이름을 자랑합니다. '자랑한다'에는 기억하여 부른다는 뜻도 담겨 있습니다. 우리에게도 예산과 경험 많은 일꾼, 도와줄 사람들이 있습니다. <mark>\"여러 번 해 본 일이니 더 물어볼 게 없겠지\"</mark> 싶을 때가 내 마음이 어디에 기대는지 돌아볼 때입니다. 병거를 의지한 이들은 엎드러지고 하나님을 의지하는 이들은 <mark>일어나 바로 섭니다</mark>(8절)."], "points": ["준비가 충분한 날에도 하나님께 길을 묻고 있습니까, 아니면 내 자원을 의지하고 있습니까?"]}, {"title": "9절 · 확신하는 공동체는 끝까지 응답을 구합니다", "paragraphs": ["6절에서 백성은 하나님이 구원하실 줄 안다고 고백했고, 8절에서는 일어나 바로 설 것이라고 노래했습니다. 그런데 시편의 마지막에 들리는 소리는 또다시 드리는 기도입니다. <mark>\"여호와여 왕을 구원하소서 우리가 부를 때에 우리에게 응답하소서\"</mark>(9절). 확신이 있다고 기도를 멈추지 않습니다. <mark>하나님을 신뢰하기 때문에 끝까지 그분을 부르는 것</mark>입니다.", "1절에서 백성은 '네게' 응답해 주시기를 구했습니다. 마지막 절에서는 '우리에게' 응답해 달라고 합니다. 처음에는 한 사람을 위해 입을 열었는데, 이제는 온 공동체가 한마음으로 자기들의 사정을 아룁니다. 그렇게 환난의 날이 <mark>함께 하나님을 부르는 날</mark>이 되었습니다. \"기도할게요\"라고 말한 뒤 며칠 지나 다시 안부를 묻고, 그 자리에서 함께 기도하는 것도 이 말씀을 살아내는 한 방법입니다."], "points": ["\"기도할게요\"라고 말한 사람을 다시 찾아가 안부를 묻고 함께 기도한 적이 있습니까?"]}, {"title": "적용 · 최선을 다한 계획도 주님께 맡기는 겸손", "paragraphs": ["겟세마네에서 기도하신 예수님을 생각해 보십시오. 예수님은 아버지께 그 잔을 옮겨 주시기를 구하셨습니다. 자신의 소원을 정직하게 아뢰신 바로 그 자리에서 <mark>아버지의 뜻에 자신을 기꺼이 맡기셨습니다</mark>. 그리고 일어나 우리를 위해 십자가의 길을 걸으셨습니다. 우리를 위해 죽으시고 다시 살아나신 주님은 지금도 우리를 위해 간구하십니다. 교회가 지치고 우리의 기도가 약해지는 날에도, 우리는 <mark>먼저 우리를 위해 기도하시는 주님</mark>을 의지할 수 있습니다.", "공동체가 내년을 준비한다고 생각해 보십시오. 일정을 잡고 예산을 살피고 각자 맡은 일까지 정했습니다. 그때 한 사람이 조심스럽게 말합니다. \"그 시간이면 주말에 일하시는 분들은 이번에도 함께하기 어렵겠네요.\" 바로 그때가 기도할 때입니다. 그분들의 사정을 듣고, 이웃을 사랑하라는 말씀에 비추어 일정을 다시 의논할 수 있습니다. 가장 많이 수고한 사람도 <mark>\"제가 미처 생각하지 못했네요. 같이 살펴봅시다\"</mark>라고 말할 수 있습니다.", "하나님이 일하실 자리를 마음에 둔다는 것은 <mark>최선을 다해 준비한 뒤에도 주님께 길을 묻고, 그 뜻을 따라 내 계획을 기꺼이 고치는 겸손</mark>입니다. 준비가 부족해서 기도하는 것이 아니라, 준비한 모든 것이 하나님의 손안에 있음을 알기에 기도합니다.", "오늘 내가 가장 공들여 세운 계획은 무엇입니까? 그 계획을 두고도 \"주님, 제가 놓친 것을 보여 주시면 기꺼이 바꾸겠습니다\"라고 기도할 수 있겠습니까? 그리고 그 계획을 함께 짊어진 사람들, 책임을 맡은 이들을 위해서도 오늘 이름을 불러 기도해 보십시오."], "points": ["제가 공들여 세운 계획도 주님 앞에 내려놓습니다. 놓친 것을 보여 주시면 기꺼이 바꾸겠습니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "준비가 충분하다고 느껴질 때도 하나님께 길을 묻는 기도를 멈추지 않았다"}, {"key": "c2", "text": "책임을 맡은 사람들에게 요구하기보다 그들을 위해 먼저 기도했다"}, {"key": "c3", "text": "내 계획에 대한 다른 사람의 조심스러운 의견을 열린 마음으로 들었다"}, {"key": "c4", "text": "기도하겠다고 말한 사람을 기억하고 실제로 기도하며 안부를 물었다"}], "s4heading": "묵상 한 줄", "memoHint": "오늘 내가 가장 공들여 세운 계획은 무엇이며, 그 계획을 두고 주님께 어떻게 길을 묻겠습니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "계획 올려드리기", "value": "준비 중인 일 하나를 두고 \"제가 놓친 것을 보게 해 주십시오\"라고 기도하기"}, {"key": "act2", "label": "책임자 위해 기도", "value": "교회나 직장에서 결정할 일이 많은 사람 한 명의 이름을 불러 기도하기"}, {"key": "act3", "label": "다른 의견 듣기", "value": "내 계획에 대한 다른 사람의 조심스러운 의견을 끝까지 듣고 함께 다시 살펴보기"}, {"key": "act4", "label": "다시 안부 묻기", "value": "\"기도할게요\"라고 했던 사람에게 연락해 안부를 묻고 함께 기도하기"}, {"key": "act5", "label": "말씀 암송", "value": "시편 20:7을 외우며 내가 의지하는 '병거와 말'이 무엇인지 돌아보기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "환난 날에 응답하시는 야곱의 하나님, 겟세마네에서 아버지의 뜻에 자신을 맡기시고 지금도 저를 위해 간구하시는 주님께 감사드립니다."}, {"key": "p2", "tag": "회개", "text": "준비가 충분하다고 느낄 때 기도를 멈추고, 예산과 경험과 사람을 더 의지하며, 내 판단을 고집했던 것을 회개합니다."}, {"key": "p3", "tag": "간구", "text": "최선을 다해 준비한 뒤에도 주님께 길을 묻게 하시고, 놓친 것을 보여 주실 때 기꺼이 계획을 고치며, 책임 맡은 이들을 위해 함께 기도하는 공동체가 되게 해 주십시오."}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "November 19, Thursday", "ref": "Psalm 20:1–9", "headline": "Even After Everything Is Ready,<br>Why Do We Still Pray Together?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · Psalm 20:1-9", "s1heading": "Today's Word", "verse": "\"Some trust in chariots and some in horses,<br>but we trust in the name of the LORD our God.\"", "verseRef": "Psalm 20:7", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · Do We Still Ask God for the Way After the Way Appears?", "paragraphs": ["When trouble comes, what do we check first? We look for someone to call, and we see whether we have enough money and time. Then, when someone offers to help and a way forward appears, we breathe a sigh of relief. But at that very moment, how does our prayer change? <mark>Even after the way becomes clear, do we still ask God for the way?</mark>", "Psalm 19 ended with one person offering the words of his mouth and the meditation of his heart to God. In Psalm 20, <mark>the whole people lift up the king's desires and plans to God together</mark>. The mention of chariots and horses suggests a time before battle. The king needed a plan to protect his people, and the king, too, needed a people who would pray with him.", "This psalm shows a faith that does its best in the task at hand while placing both the plan and its outcome under God's sovereignty. That is why the community of faith prays even after the preparations are finished—keeping our hearts open so that, if the Lord corrects our course, we are ready to follow."], "points": ["When I feel well prepared, is my prayer quietly shrinking?"]}, {"title": "Verses 1–3 · A Community Praying for a King Facing Trouble", "paragraphs": ["The king is the one responsible for protecting the people. Yet in the opening scene of this psalm, <mark>it is the people who ask for the king's protection</mark>: <mark>\"May the LORD answer you in the day of trouble! May the name of the God of Jacob protect you!\"</mark> (v.1). Jacob remembered the God who answered him in the day of his distress and was with him wherever he went. Now the people ask that same God to lift the king up and set him beyond the reach of danger, to send him help from the sanctuary and support him from Zion (v.2).", "Then they pray, <mark>\"May he remember all your offerings and regard with favor your burnt sacrifices!\"</mark> (v.3). Even the king who makes the nation's weightiest decisions is, before God, a worshiper who must seek grace.", "We can pray this way for those who carry responsibility in our churches and communities too—that those who must make many decisions would <mark>first offer their hearts to God and find strength in worship</mark> themselves."], "points": ["Instead of placing demands on those in responsibility, do I pray for them first?"]}, {"title": "Verses 4–5 · Lifting Our Prepared Plans Before God", "paragraphs": ["<mark>\"May he grant you your heart's desire and fulfill all your plans!\"</mark> (v.4). Listen carefully to the tone of this line: it is a heartfelt request. The people who know what their king has prepared bring that plan before God and plead for Him to bring it to completion.", "We can pray just as concretely before important tasks: \"Lord, we have prepared this far for this work. If there is anything we have missed, please help us see it.\" When we pray this way, <mark>we can take full responsibility for what we have prepared without clinging stubbornly to our own judgment</mark>.", "The people look ahead to the day of the king's victory, when they will shout for joy and <mark>set up their banners in the name of our God</mark> (v.5). Anyone who has prayed a long time for someone knows this feeling: when news comes that the person has regained strength, we rejoice as if it were our own. While we prayed together, their struggle had already entered our hearts. When we pray for our leaders, we set down our expectation that they must have every answer, and we <mark>begin to share the burden they carry</mark>."], "points": ["Before an important task, do I pray, \"Help me see what I have missed\"?"]}, {"title": "Verses 6–8 · Not Chariots and Horses, but the Name of the LORD", "paragraphs": ["In the midst of the shared prayer, one voice now rises: <mark>\"Now I know that the LORD saves his anointed\"</mark> (v.6). In verse 2, the people asked for help from Zion. In verse 6, they confess that the same God answers <mark>from His holy heaven with the saving might of His right hand</mark>. The One who listens closely to our situation is the God who rules over the whole world. Here lies the confidence of the one who prays.", "<mark>\"Some trust in chariots and some in horses, but we trust in the name of the LORD our God\"</mark> (v.7). Chariots and horses were military strength anyone could see. And as verse 4 showed, this people also had the king's plans. Yet with the same lips that prayed for those plans, they now boast in the name of the LORD. In verse 3 they asked God to 'remember' the king's offerings; the word in verse 7 also carries the sense of remembering and calling upon a name. The people who asked God to remember them now remember the God who has kept them.", "We too have resources to be thankful for: budgets, experienced workers, people we can call in hard times. But at some point we may think, <mark>\"We have enough budget and we've done this many times—there's nothing more to ask.\"</mark> That is the moment to examine what our hearts are leaning on. By the logic of strategy alone, the side with more chariots looks secure. But in the scene the people see by faith, those who trust in chariots collapse and fall, while those who trust God <mark>rise and stand upright</mark> (v.8). Even on days when we accept results different from what we hoped despite our best efforts, the One we ask for strength to rise again is still our God."], "points": ["On days when I am well prepared, do I still ask God for the way, or do I lean on my own resources?"]}, {"title": "Verse 9 · A Confident Community Keeps Asking Until the End", "paragraphs": ["In verse 6 the people confessed that they know God will save, and in verse 8 they sang that they will rise and stand firm. Yet the final sound of the psalm is prayer once again: <mark>\"O LORD, save the king! May he answer us when we call\"</mark> (v.9). Confidence does not end prayer. <mark>Because they trust God, they keep calling on Him to the very end.</mark> This is also why the church continues to pray.", "In verse 1, the people asked God to answer 'you'—the king. In the final verse, they ask Him to answer 'us.' At first they opened their mouths for one person; now the whole community, with one heart, brings its own situation before God. And so the day of trouble became <mark>a day of calling on God together</mark>.", "Telling someone, \"I'll pray for you,\" and then checking back a few days later to ask how they are—and praying with them right there—is one way to live out this Word."], "points": ["Have I gone back to someone I promised to pray for, asked how they are, and prayed with them?"]}, {"title": "Application · The Humility to Entrust Even Our Best Plans to the Lord", "paragraphs": ["Think of Jesus praying in Gethsemane. He asked the Father to take the cup away from Him. And in the very place where He honestly poured out His desire, <mark>He willingly entrusted Himself to the Father's will</mark>. Then He rose and walked the way of the cross for us. The Lord who died and rose again for us still intercedes for us today. Even on days when the church is weary and our prayers grow weak, we can rely on <mark>the Lord who prays for us first</mark>.", "Imagine a community preparing for the coming year. They have set the schedule, reviewed the budget, and assigned everyone's roles. Then someone speaks up carefully: \"At that time, those who work on weekends won't be able to join again this time.\" That is the moment to pray. We can listen to their situation and, in light of the Lord's command to love our neighbor, discuss the schedule again. Even the person who worked hardest on the plan can say, <mark>\"I didn't think of that. Let's look at it together.\"</mark>", "Keeping room in our hearts for God to work means <mark>the humility to keep asking the Lord for the way even after we have prepared our best, and to gladly revise our plans to follow His will</mark>. We do not pray because our preparation is lacking; we pray because we know that everything we have prepared rests in God's hands.", "What is the plan you have worked hardest on today? Can you pray over it, \"Lord, if You show me what I have missed, I will gladly change it\"? And today, call by name and pray for those who carry that plan with you and for those who bear responsibility."], "points": ["I lay even my most carefully made plans before the Lord. Show me what I've missed, and I will gladly change."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "Even when I felt well prepared, I did not stop praying and asking God for the way."}, {"key": "c2", "text": "Rather than placing demands on those in responsibility, I prayed for them first."}, {"key": "c3", "text": "I listened with an open heart to someone's careful concerns about my plans."}, {"key": "c4", "text": "I remembered someone I said I'd pray for, actually prayed, and checked in on them."}], "s4heading": "One-Line Reflection", "memoHint": "What is the plan I have worked hardest on today, and how will I ask the Lord for the way concerning it?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Offer the Plan", "value": "Over one task you are preparing, pray, \"Help me see what I have missed\""}, {"key": "act2", "label": "Pray for Leaders", "value": "Pray by name for one person at church or work who carries many decisions"}, {"key": "act3", "label": "Hear Other Views", "value": "Listen fully to someone's careful concern about your plan and review it together"}, {"key": "act4", "label": "Check Back In", "value": "Contact someone you said you'd pray for, ask how they are, and pray with them"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize Psalm 20:7 and reflect on what 'chariots and horses' you tend to rely on"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, God of Jacob, who answers in the day of trouble, and Lord Jesus, who entrusted Yourself to the Father's will in Gethsemane and still intercedes for me today."}, {"key": "p2", "tag": "Repent", "text": "I repent of stopping my prayers when I felt prepared, of relying more on budgets, experience, and people, and of clinging to my own judgment."}, {"key": "p3", "tag": "Ask", "text": "Help me ask You for the way even after I have prepared my best, gladly revise my plans when You show me what I've missed, and make us a community that prays together for those who bear responsibility."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Nobyembre 19, Huwebes", "ref": "Awit 20:1–9", "headline": "Kahit Handa na ang Lahat,<br>Bakit Tayo Sama-samang Nananalangin?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Awit 20:1-9", "s1heading": "Salita Ngayon", "verse": "\"Ang iba'y nagtitiwala sa mga karwahe at ang iba'y sa mga kabayo,<br>ngunit kami'y magtitiwala sa pangalan ng PANGINOON naming Diyos.\"", "verseRef": "Awit 20:7", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Nagtatanong Pa Ba Tayo sa Diyos Kahit Nakita na ang Daan?", "paragraphs": ["Kapag may problema, ano ang una nating tinitingnan? Hinahanap natin kung may matatawagan, at sinusuri kung sapat ang pera at oras na inihanda natin. At kapag may tumulong at may nakitang paraan, nakahihinga tayo nang maluwag. Ngunit sa mismong sandaling iyon, paano nagbabago ang ating panalangin? <mark>Kahit malinaw na ang daan, nagtatanong pa rin ba tayo sa Diyos kung saan tayo dapat pumunta?</mark>", "Nagtapos ang Awit 19 sa panalangin ng isang tao na iniaalay sa Diyos ang mga salita ng kanyang bibig at ang pagninilay ng kanyang puso. Sa Awit 20, <mark>sama-samang iniaakyat ng buong bayan sa Diyos ang mga hangarin at plano ng hari</mark>. Ang pagbanggit ng mga karwahe at kabayo ay nagpapahiwatig na ito ay bago ang isang digmaan. Kailangan ng hari ng plano para ipagtanggol ang bayan, at kailangan din ng hari ng bayang mananalangin kasama niya.", "Ipinapakita ng awit na ito ang pananampalatayang ginagawa ang lahat ng makakaya sa tungkulin habang inilalagay ang plano at ang kalalabasan nito sa ilalim ng kapangyarihan ng Diyos. Kaya ang komunidad ng pananampalataya ay nananalangin kahit tapos na ang paghahanda—bukas ang puso upang kung itama ng Panginoon ang ating landas, handa tayong sumunod."], "points": ["Kapag pakiramdam ko'y handa na ako, unti-unti bang lumiliit ang aking panalangin?"]}, {"title": "Talata 1–3 · Isang Komunidad na Nananalangin para sa Haring Haharap sa Kagipitan", "paragraphs": ["Ang hari ang may pananagutang ipagtanggol ang bayan. Ngunit sa unang tagpo ng awit na ito, <mark>ang bayan ang humihingi ng proteksyon para sa hari</mark>: <mark>\"Sagutin ka nawa ng PANGINOON sa araw ng kagipitan! Ingatan ka nawa ng pangalan ng Diyos ni Jacob!\"</mark> (t.1). Naalala ni Jacob ang Diyos na sumagot sa kanya sa araw ng kanyang kagipitan at sumama sa kanya saan man siya pumunta. Ngayon, hinihiling ng bayan sa Diyos ding iyon na itaas ang hari sa lugar na hindi maaabot ng panganib, padalhan siya ng tulong mula sa santuwaryo, at alalayan siya mula sa Zion (t.2).", "Pagkatapos ay nanalangin sila, <mark>\"Alalahanin nawa Niya ang lahat ng iyong handog at tanggapin nang may lugod ang iyong mga handog na sinusunog!\"</mark> (t.3). Kahit ang haring gumagawa ng pinakamabibigat na desisyon ng bansa ay, sa harap ng Diyos, isang sumasamba na kailangang humingi ng biyaya.", "Ganito rin tayo maaaring manalangin para sa mga may pananagutan sa ating iglesya at komunidad—na ang mga kailangang gumawa ng maraming desisyon ay <mark>unang ialay ang kanilang puso sa Diyos at makatanggap ng lakas sa pagsamba</mark>."], "points": ["Sa halip na humingi sa mga may pananagutan, inuuna ko bang ipanalangin sila?"]}, {"title": "Talata 4–5 · Pag-aakyat ng Inihandang Plano sa Harap ng Diyos", "paragraphs": ["<mark>\"Ipagkaloob nawa Niya ang nais ng iyong puso at tuparin ang lahat ng iyong mga plano!\"</mark> (t.4). Pakinggang mabuti ang tono ng linyang ito: ito ay taos-pusong pakiusap. Ang bayang nakaaalam kung ano ang inihanda ng kanilang hari ay nagdadala ng planong iyon sa harap ng Diyos at nakikiusap na Kanya itong tuparin.", "Maaari rin tayong manalangin nang ganito katiyak bago ang mahahalagang gawain: \"Panginoon, hanggang dito na ang aming inihanda para sa gawaing ito. Kung may nakaligtaan kami, tulungan Mo kaming makita ito.\" Kapag ganito tayo nananalangin, <mark>maaari nating panagutan nang buo ang ating inihanda nang hindi ipinagpipilitan ang sarili nating paghatol</mark>.", "Inaasahan ng bayan ang araw ng tagumpay ng hari, kung kailan sila sisigaw sa galak at <mark>magtatayo ng kanilang mga bandila sa pangalan ng ating Diyos</mark> (t.5). Alam ito ng sinumang matagal nang nananalangin para sa iba: kapag dumating ang balitang nakabawi na ng lakas ang taong iyon, nagagalak tayo na parang sarili nating tagumpay. Habang sama-sama tayong nananalangin, nakapasok na sa ating puso ang kanyang paghihirap. Kapag ipinapanalangin natin ang ating mga pinuno, ibinababa natin ang pag-asang dapat nasa kanila ang lahat ng sagot, at <mark>nagsisimula tayong makibahagi sa pasaning dala nila</mark>."], "points": ["Bago ang isang mahalagang gawain, nananalangin ba ako ng, \"Tulungan Mo akong makita ang aking nakaligtaan\"?"]}, {"title": "Talata 6–8 · Hindi sa mga Karwahe at Kabayo, Kundi sa Pangalan ng PANGINOON", "paragraphs": ["Sa gitna ng sama-samang panalangin, isang tinig ang umaangat: <mark>\"Ngayon ay alam ko na inililigtas ng PANGINOON ang Kanyang pinahiran\"</mark> (t.6). Sa talata 2, humingi ang bayan ng tulong mula sa Zion. Sa talata 6, ipinahahayag nilang ang Diyos ding iyon ay sumasagot <mark>mula sa Kanyang banal na langit sa nagliligtas na lakas ng Kanyang kanang kamay</mark>. Ang Siyang malapit na nakikinig sa ating kalagayan ay ang Diyos na naghahari sa buong mundo. Narito ang katiyakan ng nananalangin.", "<mark>\"Ang iba'y nagtitiwala sa mga karwahe at ang iba'y sa mga kabayo, ngunit kami'y magtitiwala sa pangalan ng PANGINOON naming Diyos\"</mark> (t.7). Ang mga karwahe at kabayo ay lakas-militar na nakikita ng lahat. At gaya ng nakita sa talata 4, may mga plano rin ang hari ng bayang ito. Gayunman, sa parehong mga labing nanalangin para sa mga planong iyon, ipinagmamalaki nila ngayon ang pangalan ng PANGINOON. Sa talata 3, hiniling nilang 'alalahanin' ng Diyos ang mga handog ng hari; ang salita sa talata 7 ay may kahulugan ding pag-alala at pagtawag sa isang pangalan. Ang bayang humiling na alalahanin sila ng Diyos ay umaalala ngayon sa Diyos na nag-ingat sa kanila.", "Tayo rin ay may mga mapagkukunang dapat ipagpasalamat: badyet, mga bihasang manggagawa, mga taong matatawagan sa oras ng kagipitan. Ngunit may sandaling maiisip natin, <mark>\"Sapat ang badyet at ilang beses na nating nagawa ito—wala nang dapat itanong pa.\"</mark> Iyon ang sandaling dapat nating suriin kung saan nakasandal ang ating puso. Ayon sa estratehiya lamang, mukhang matatag ang panig na mas maraming karwahe. Ngunit sa tagpong nakikita ng bayan sa pananampalataya, ang mga nagtitiwala sa karwahe ay bumabagsak, samantalang ang mga nagtitiwala sa Diyos ay <mark>bumabangon at tumatayo nang matuwid</mark> (t.8). Kahit sa mga araw na tumatanggap tayo ng resultang iba sa inaasahan sa kabila ng ating pagsisikap, ang Diyos pa rin ang hinihingan natin ng lakas para muling bumangon."], "points": ["Sa mga araw na handang-handa ako, nagtatanong pa rin ba ako sa Diyos, o sa sarili kong kakayahan ako sumasandal?"]}, {"title": "Talata 9 · Ang May Katiyakang Komunidad ay Patuloy na Humihingi Hanggang sa Wakas", "paragraphs": ["Sa talata 6, ipinahayag ng bayan na alam nilang magliligtas ang Diyos, at sa talata 8, umawit sila na sila'y babangon at tatayo nang matatag. Ngunit ang huling tunog ng awit ay muling panalangin: <mark>\"O PANGINOON, iligtas Mo ang hari! Sagutin Mo kami kapag kami'y tumatawag\"</mark> (t.9). Hindi tinatapos ng katiyakan ang panalangin. <mark>Dahil nagtitiwala sila sa Diyos, patuloy nila Siyang tinatawag hanggang sa wakas.</mark> Ito rin ang dahilan kung bakit patuloy na nananalangin ang iglesya.", "Sa talata 1, hiniling ng bayan na sagutin ng Diyos ang 'ikaw'—ang hari. Sa huling talata, hinihiling nilang sagutin Niya ang 'kami.' Sa simula, nagbukas sila ng bibig para sa isang tao; ngayon, ang buong komunidad, sa iisang puso, ay naglalapit ng sarili nilang kalagayan sa Diyos. Kaya ang araw ng kagipitan ay naging <mark>araw ng sama-samang pagtawag sa Diyos</mark>.", "Ang pagsasabi sa isang tao ng \"Ipapanalangin kita,\" at pagbalik makalipas ang ilang araw upang kumustahin siya—at manalangin kasama niya sa mismong sandaling iyon—ay isang paraan ng pagsasabuhay ng Salitang ito."], "points": ["Binalikan ko na ba ang taong pinangakuan kong ipapanalangin, kinumusta siya, at nanalangin kasama niya?"]}, {"title": "Pagsasabuhay · Ang Kababaang-loob na Ipagkatiwala sa Panginoon Kahit ang Pinakamahusay Nating Plano", "paragraphs": ["Isipin si Jesus na nananalangin sa Getsemani. Hiniling Niya sa Ama na alisin ang saro sa Kanya. At sa mismong lugar kung saan tapat Niyang ibinuhos ang Kanyang hangarin, <mark>kusa Niyang ipinagkatiwala ang sarili sa kalooban ng Ama</mark>. Pagkatapos ay bumangon Siya at nilakad ang daan ng krus para sa atin. Ang Panginoong namatay at muling nabuhay para sa atin ay patuloy na namamagitan para sa atin ngayon. Kahit sa mga araw na pagod ang iglesya at humihina ang ating mga panalangin, maaasahan natin <mark>ang Panginoong unang nananalangin para sa atin</mark>.", "Isipin ang isang komunidad na naghahanda para sa darating na taon. Naitakda na ang iskedyul, nasuri ang badyet, at naitalaga na ang tungkulin ng bawat isa. Pagkatapos ay maingat na nagsalita ang isang tao: \"Sa oras na iyon, hindi na naman makakasama ang mga nagtatrabaho tuwing Sabado at Linggo.\" Iyon ang sandali para manalangin. Maaari nating pakinggan ang kanilang kalagayan at, sa liwanag ng utos ng Panginoon na mahalin ang kapwa, pag-usapang muli ang iskedyul. Kahit ang taong pinakanagpagal sa plano ay makapagsasabi, <mark>\"Hindi ko iyon naisip. Tingnan natin ito nang sama-sama.\"</mark>", "Ang pagbibigay ng puwang sa ating puso para kumilos ang Diyos ay <mark>ang kababaang-loob na patuloy na magtanong sa Panginoon kahit naihanda na natin ang ating pinakamahusay, at kusang baguhin ang ating mga plano upang sundin ang Kanyang kalooban</mark>. Hindi tayo nananalangin dahil kulang ang ating paghahanda; nananalangin tayo dahil alam nating nasa kamay ng Diyos ang lahat ng ating inihanda.", "Ano ang planong pinakapinagpaguran mo ngayon? Maipapanalangin mo ba ito ng, \"Panginoon, kung ipapakita Mo ang aking nakaligtaan, buong-puso ko itong babaguhin\"? At ngayon, tawagin sa pangalan at ipanalangin ang mga kasama mong nagdadala ng planong iyon at ang mga may pananagutan."], "points": ["Inilalapag ko sa harap ng Panginoon kahit ang pinakamaingat kong plano. Ipakita Mo ang aking nakaligtaan, at buong-puso akong magbabago."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Kahit pakiramdam ko'y handa na ako, hindi ako tumigil sa pananalangin at pagtatanong sa Diyos."}, {"key": "c2", "text": "Sa halip na humingi sa mga may pananagutan, inuna ko silang ipanalangin."}, {"key": "c3", "text": "Nakinig ako nang bukas ang puso sa maingat na alalahanin ng iba tungkol sa aking plano."}, {"key": "c4", "text": "Naalala ko ang taong sinabi kong ipapanalangin, talagang nanalangin ako, at kinumusta ko siya."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Ano ang planong pinakapinagpaguran ko ngayon, at paano ako magtatanong sa Panginoon tungkol dito?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Ialay ang Plano", "value": "Sa isang gawaing inihahanda mo, manalangin ng, \"Tulungan Mo akong makita ang aking nakaligtaan\""}, {"key": "act2", "label": "Ipanalangin ang mga Pinuno", "value": "Ipanalangin sa pangalan ang isang tao sa iglesya o trabaho na maraming desisyong dinadala"}, {"key": "act3", "label": "Pakinggan ang Ibang Pananaw", "value": "Pakinggan nang buo ang maingat na alalahanin ng iba tungkol sa iyong plano at suriin ito nang sama-sama"}, {"key": "act4", "label": "Kumustahin Muli", "value": "Kontakin ang taong sinabi mong ipapanalangin, kumustahin siya, at manalangin kasama niya"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang Awit 20:7 at pagnilayan kung anong 'mga karwahe at kabayo' ang madalas mong sandalan"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Diyos ni Jacob, na sumasagot sa araw ng kagipitan, at Panginoong Jesus, na nagkatiwala ng sarili sa kalooban ng Ama sa Getsemani at patuloy na namamagitan para sa akin ngayon."}, {"key": "p2", "tag": "Pagsisisi", "text": "Pinagsisisihan ko ang pagtigil sa pananalangin kapag pakiramdam ko'y handa na, ang mas pagsandal sa badyet, karanasan, at tao, at ang pagpipilit sa sarili kong paghatol."}, {"key": "p3", "tag": "Kahilingan", "text": "Tulungan Mo akong magtanong sa Iyo kahit naihanda ko na ang aking pinakamahusay, buong-pusong baguhin ang aking mga plano kapag ipinakita Mo ang aking nakaligtaan, at gawin Mo kaming komunidad na sama-samang nananalangin para sa mga may pananagutan."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-11-19';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
