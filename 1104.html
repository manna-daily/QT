<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}

  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}

  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "11월 4일 수요일", "ref": "고린도후서 3장 1–18절", "headline": "말씀을 읽는 나는,<br>누구를 닮아 가고 있습니까?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 고린도후서 3:1-18", "s1heading": "오늘의 말씀", "verse": "\"우리가 다 수건을 벗은 얼굴로 거울을 보는 것 같이<br>주의 영광을 보매 그와 같은 형상으로 변화하여<br>영광에서 영광에 이르니 곧 주의 영으로 말미암음이니라\"", "verseRef": "고린도후서 3:18", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 편지에서 시작해 형상으로 마무리되는 말씀", "paragraphs": ["\"세 살 버릇 여든까지 간다\"는 말처럼 사람이 달라지는 일은 쉽지 않습니다. 무엇이 옳은지 알면서도 같은 잘못을 반복합니다. 광야와 약속의 땅에서 불순종을 반복했던 이스라엘에게서 우리 자신을 보기도 합니다. 그렇다면 우리는 어떻게 변화될 수 있습니까? 오늘 말씀의 중심은 이것입니다. <mark>성령님께서 말씀을 통해 그리스도를 바라보게 하시고, 우리를 그리스도를 닮은 사람으로 변화시키십니다</mark>.", "앞에서 바울은 <mark>\"누가 이것을 감당하리요\"</mark>(2:16)라고 물었습니다. 오늘 본문은 그 질문에 답합니다. 감당할 능력은 하나님께서 주시고, 성령께서 일으키신 공동체가 그 사역의 참됨을 증언합니다. 본문은 <mark>'편지'</mark>에서 시작해 <mark>'형상'</mark>으로 마무리됩니다. 성령께서 우리를 그리스도처럼 변화시키실 때, 우리의 삶과 교회를 통해 그리스도가 드러납니다."], "points": ["나는 말씀을 통해 무엇을 알아 가고 있으며, 실제로 누구를 닮아 가고 있습니까?"]}, {"title": "1–3절 · 성령께서 변화시키신 공동체가 그리스도의 편지입니다", "paragraphs": ["바울은 자신을 소개하는 추천서가 굳이 필요하냐고 묻습니다. 추천서 자체를 거부하는 것이 아니라, 고린도 성도들을 그리스도의 공동체로 만드신 하나님의 일이 이미 바울의 사역을 증언한다는 뜻입니다. <mark>\"너희는 우리의 편지라 우리 마음에 썼고 뭇 사람이 알고 읽는 바라\"</mark>(2절). 바울은 그들의 믿음과 삶을 마음에 품고 살았고, 그 공동체는 사람들이 읽는 살아 있는 편지였습니다.", "그 편지의 주인은 그리스도이시고, 쓰신 분은 <mark>\"살아 계신 하나님의 영\"</mark>이십니다. 먹과 돌판 대신 성령과 <mark>\"육의 마음판\"</mark>이 등장합니다. 굳은 마음을 새롭게 하고 말씀을 마음에 새기시겠다는 구약의 약속(렘 31:33, 겔 36:26)이 이루어지는 것입니다. 갈등과 잘못이 남아 있던 교회를 바울은 그리스도의 편지라고 불렀습니다. 우리도 잘못을 바로잡으면서 <mark>그 가운데 일하시는 하나님의 은혜를 함께 보아야</mark> 합니다."], "points": ["세상 사람들은 우리가 함께 살아가는 모습에서 우리가 믿는 그리스도가 어떤 분인지 읽습니다."]}, {"title": "4–6절 · 하나님께서 일꾼을 세우시고 성령께서 살리십니다", "paragraphs": ["바울의 확신은 <mark>\"그리스도로 말미암아 하나님을 향하여\"</mark>(4절) 있습니다. 사람을 변화시킬 능력이 자신에게서 나온다고 생각하지 않습니다. <mark>\"우리의 만족은 오직 하나님께로부터 나느니라\"</mark>(5절). 여기서 '만족'은 일을 감당할 충분함과 능력입니다. 우리도 섬길 때 배우고 준비하며 수고하되, 마음을 바꾸시는 성령님을 절대적으로 의지해야 합니다. <mark>자라게 하시는 분은 우리가 아니라 성령님</mark>이십니다.", "하나님은 바울을 예수님이 피로 세우신 <mark>새 언약의 일꾼</mark>으로 세우셨습니다. <mark>\"율법 조문은 죽이는 것이요 영은 살리는 것이니라\"</mark>(6절). 율법은 하나님의 뜻을 알려 주고 죄를 드러내지만, 명령 자체가 굳은 마음을 새롭게 하지는 못합니다. 성령께서 마음을 살리시고 하나님께 응답하게 하십니다. 그렇다고 성경을 정확히 읽을 필요가 없다는 뜻은 아닙니다. 성령님은 말씀을 믿고 순종하도록 이끄십니다."], "points": ["말씀을 읽다가 내 잘못이 드러날 때, 성령의 도우심을 구하며 그 말씀을 받아들입니다."]}, {"title": "7–11절 · 새 언약의 영광은 더욱 크고 영원합니다", "paragraphs": ["모세가 시내산에서 하나님과 말씀을 나누고 내려왔을 때 얼굴에 광채가 났습니다(출 34장). 하나님이 주신 율법이기에 그 사역에도 영광이 있었습니다. 그러나 성령의 사역은 더욱 영광스럽습니다. 율법을 거역한 죄인에게 정죄와 죽음이 선포되었다면, 새 언약에서는 <mark>그리스도를 통해 의와 생명</mark>을 누리기 때문입니다. 의는 먼저 하나님께서 죄인을 그리스도 안에서 의롭다 여겨 주시는 은혜입니다. <mark>변화에 성공해야 받아들여지는 것이 아니라, 받아들여진 사람이 성령으로 계속 새로워지는 것</mark>입니다.", "그러니 말씀 앞에서 죄를 발견했을 때 숨을 필요가 없습니다. 그리스도의 용서를 의지하며 회개하고 순종의 길로 나아가면 됩니다. 새 언약의 영광은 옛 언약의 영광이 빛을 잃을 만큼 뛰어나고 영원합니다. 한 사람이 죄를 인정하고 미움을 내려놓고 정직하게 살기 시작하는 자리에서도 <mark>성령께서 행하시는 영광스러운 일</mark>을 볼 수 있습니다."], "points": ["하나님께서 나를 받아 주셨다는 은혜가, 실패한 자리에서도 다시 회개하고 순종하게 하는 힘이 됩니다."]}, {"title": "12–18절 · 수건이 벗겨지고 주님의 형상으로 변화됩니다", "paragraphs": ["바울은 하나님께서 사람을 살리신다는 소망이 있기에 <mark>\"담대히\"</mark> 복음을 전합니다(12절). 모세의 수건과 바울의 담대함이 대조됩니다. 이어서 수건은 모세의 글을 읽으면서도 그리스도 안의 구원을 받아들이지 못하는 <mark>마음의 완고함</mark>으로 설명됩니다. 말씀을 읽으며 내가 고칠 모습을 남의 문제로만 돌리고 있지는 않습니까? <mark>\"언제든지 주께로 돌아가면 그 수건이 벗겨지리라\"</mark>(16절). 묵상할 때 내 판단까지 주님 앞에 내려놓아야 하는 이유입니다.", "<mark>\"주의 영이 계신 곳에는 자유가 있느니라\"</mark>(17절). 수건이 벗겨져 주님의 영광을 바라보는 자유입니다. 잘못을 숨기던 사람이 회개하고, 미움에 붙들렸던 사람이 용서를 향해 한 걸음 내딛습니다. 그리고 <mark>\"우리가 다\"</mark> 주의 영광을 보며 그와 같은 형상으로 변화됩니다(18절). 특별한 지도자만이 아니라 모든 성도의 은혜입니다. 우리는 복음에 나타난 예수님을 알아 가며 그 영광을 봅니다. 이 변화는 <mark>영광에서 영광에 이르는 계속되는 과정</mark>이기에, 오늘 넘어졌다고 성령의 역사가 없다고 단정할 수 없습니다."], "points": ["말씀 속에서 예수님의 사랑과 진실함과 순종을 배우고, 내 말과 선택을 그 말씀에 맡깁니다."]}, {"title": "적용 · 오늘 바꿀 말이나 행동 한 가지", "paragraphs": ["오늘 본문은 편지에서 시작해 형상으로 마무리됩니다. 성령께서 우리를 그리스도처럼 변화시키실 때, 우리의 삶은 <mark>그리스도를 보여 주는 살아 있는 편지</mark>가 됩니다. 말씀을 묵상한 뒤에는 무엇을 알게 되었는지와 함께, 그 말씀 앞에서 내 말과 선택이 어떻게 달라지고 있는지 살펴보아야 합니다.", "예수님은 제자들의 발을 씻기시고 서로 그렇게 섬기라 하시며 <mark>\"너희가 이것을 알고 행하면 복이 있으리라\"</mark>(요 13:17)고 말씀하셨습니다. 우리에게 필요한 변화가 바로 그 모습입니다. 주님의 사랑이 누군가를 섬기는 손, 잘못을 인정하는 말, 다른 사람의 아픔을 듣는 태도로 나타나는 것입니다.", "예수님은 본만 보이신 분이 아닙니다. 십자가에서 우리의 죄를 담당하시고 부활하셔서 <mark>새 생명의 길</mark>을 여셨습니다. 그리고 성령님은 그 은혜를 받은 우리가 주님을 닮아 가도록 도우시고 이끄십니다. 넘어졌다면 숨지 말고 다시 일어나 주께 돌아오면 됩니다. 변화에 성공해야 받아들여지는 것이 아니라, 이미 받아들여진 사람이기에 다시 시작할 수 있습니다.", "오늘 묵상한 말씀을 붙들고 <mark>바꾸어야 할 말이나 행동 한 가지</mark>를 정해 보십시오. 사과해야 한다면 미루지 말고, 누군가의 말을 들어야 한다면 내 말을 멈추고, 섬길 일이 있다면 먼저 손을 내미십시오. 성령의 도우심을 구하며 그 한 걸음을 내딛으십시오."], "points": ["성령의 도우심을 구하며, 오늘 그리스도를 닮은 한 걸음을 내딛습니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "말씀을 읽고 아는 데서 멈추지 않고, 내 말과 선택이 어떻게 달라지는지 돌아봤다"}, {"key": "c2", "text": "교회의 부족함만 보지 않고 그 가운데 일하시는 성령의 은혜도 보려 했다"}, {"key": "c3", "text": "말씀 앞에서 드러난 내 잘못을 남의 문제로 돌리지 않았는지 점검했다"}, {"key": "c4", "text": "넘어졌을 때 숨지 않고 그리스도의 용서를 의지하며 다시 주께 돌아왔다"}], "s4heading": "묵상 한 줄", "memoHint": "오늘 말씀 앞에서 내가 바꾸어야 할 말이나 행동 한 가지는 무엇이며, 어떻게 실천하겠습니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "미루지 않고 사과하기", "value": "사과해야 할 사람이 떠오른다면 오늘 먼저 연락해 진심으로 사과하기"}, {"key": "act2", "label": "내 말 멈추고 듣기", "value": "대화 중 내 말을 멈추고 상대의 아픔과 이야기를 끝까지 들어 주기"}, {"key": "act3", "label": "먼저 손 내밀기", "value": "가정이나 공동체에서 섬길 일 하나를 찾아 먼저 손 내밀기"}, {"key": "act4", "label": "은혜 알아보기", "value": "부족해 보이는 공동체나 사람 안에서 성령께서 행하신 은혜 하나를 찾아 감사하기"}, {"key": "act5", "label": "말씀 암송", "value": "고린도후서 3:18을 외우며 말씀 속에서 예수님을 바라보기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "그리스도 안에서 저를 받아 주시고, 성령으로 굳은 마음을 살리시며, 주님의 형상으로 영광에서 영광에 이르도록 변화시키시는 하나님께 감사합니다"}, {"key": "p2", "tag": "회개", "text": "말씀을 알면서도 같은 잘못을 반복하고, 드러난 허물을 남의 문제로 돌리며, 공동체의 부족함만 보았던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "수건을 벗은 얼굴로 주님을 바라보게 하시고, 제 삶이 그리스도를 보여 주는 살아 있는 편지가 되도록 성령께서 오늘의 말과 선택을 새롭게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "November 4, Wednesday", "ref": "2 Corinthians 3:1–18", "headline": "As I Read the Word,<br>Whom Am I Becoming Like?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · 2 Corinthians 3:1-18", "s1heading": "Today's Word", "verse": "\"And we all, with unveiled face, beholding the glory of the Lord,<br>are being transformed into the same image<br>from one degree of glory to another. For this comes from the Lord who is the Spirit.\"", "verseRef": "2 Corinthians 3:18", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · A Passage That Begins with a Letter and Ends with an Image", "paragraphs": ["Changing a person is very hard. There's a Korean proverb: 'Habits formed at three last until eighty.' We know what is right, yet we keep doing the same things and repeating the same mistakes. We even see ourselves in Israel, who repeatedly disobeyed in the wilderness and in the promised land. So how can we be changed? Here is the center of today's Word: <mark>the Holy Spirit, through the Word, makes us look to Christ and transforms us into people who resemble Christ.</mark> In this way God's image is revealed in our lives.", "In the previous passage, Paul admonished the believers with tears because he loved and cared for them, and he confessed that God reveals the fragrance of Christ through his weakness. He asked, <mark>'Who is sufficient for these things?'</mark> (2:16). Today's passage answers that question: the sufficiency comes from God. And the community the Spirit raised up through Paul's ministry testifies to the genuineness of that ministry. Paul calls the Corinthian believers a letter of Christ, making clear what he trusts as he continues his ministry. Today's passage begins with <mark>a 'letter'</mark> and ends with <mark>an 'image.'</mark> When the Spirit transforms us to be like Christ, Christ — God's image — is revealed through our lives and our church. As we meditate on today's Word, let's look at ourselves: What am I coming to know through the Word — and as I hold on to it, whom am I actually becoming like?"], "points": ["What am I learning through the Word — and whom am I actually becoming like?"]}, {"title": "Verses 1–3 · A Community Transformed by the Spirit Is a Letter from Christ", "paragraphs": ["In verse 1, Paul asks whether he really needs a letter of recommendation to introduce himself to the Corinthian church. He isn't rejecting recommendation letters as such. The Corinthian believers had heard the gospel from Paul and experienced his ministry. God's work in making them a community of Christ was itself testimony to Paul's ministry. Verse 2: <mark>'You yourselves are our letter of recommendation, written on our hearts, to be known and read by all.'</mark> The believers are a letter written on the hearts of Paul and his co-workers — a living letter. It's a confession that Paul carried their faith and lives in his heart. And that community is a letter people know and read. The gospel Paul preached and the believers' lives are connected.", "Verse 3 reveals that the author of this letter is Christ. Paul served so the letter would appear, but the One who worked in people's hearts is <mark>'the Spirit of the living God.'</mark> Instead of ink and stone tablets, the Spirit and <mark>'tablets of human hearts'</mark> appear. A heart of flesh is a living heart that can respond to God. The Old Testament's repeated promise — to write the Word on hearts and renew hardened hearts (Jeremiah 31:33; Ezekiel 36:26) — is being fulfilled. The Corinthian church still had conflict and wrongdoing. Yet Paul regards them and calls them a letter of Christ. He recognized what the Spirit had done even in an imperfect community. We too, while correcting the church's wrongs, must <mark>also see God's grace at work in its midst</mark>. A heart that acknowledges grace and an attitude of repentance always go together."], "points": ["The world reads who the Christ we believe in is from the way we live together."]}, {"title": "Verses 4–6 · God Appoints Servants, and the Spirit Gives Life", "paragraphs": ["In verses 4–5, Paul's confidence is <mark>'through Christ toward God.'</mark> He doesn't think the power to change people comes from himself. <mark>'Not that we are sufficient in ourselves to claim anything as coming from us, but our sufficiency is from God.'</mark> 'Sufficiency' here means the adequacy and ability to carry out the task, and Paul confesses it comes from God. These words refer first to the ministry of Paul and his co-workers. When we serve our church family, we too should learn, prepare, and work hard — while relying absolutely on the Holy Spirit who changes hearts. We must remember: <mark>the One who gives growth is not you or me, but the Holy Spirit alone</mark>.", "In verse 6, God made Paul a minister of <mark>a new covenant</mark> — the new covenant Jesus established with His own blood, the continuation in Christ of God's promise to write His law on our hearts. Paul writes, <mark>'For the letter kills, but the Spirit gives life.'</mark> Here 'Spirit' is the Holy Spirit. The law reveals God's will and exposes our sin; sinners who defied that Word are condemned. But the law's commands themselves cannot renew a sinner's hardened heart. The Holy Spirit gives that heart life and enables it to respond to God. So we must not take this to mean that reading Scripture accurately is unnecessary. The Spirit leads us to believe and obey the Word. When our faults are exposed as we read, we ask for the Spirit's help and receive that Word."], "points": ["When my faults are exposed as I read, I ask for the Spirit's help and receive the Word."]}, {"title": "Verses 7–11 · The Glory of the New Covenant Is Greater and Eternal", "paragraphs": ["In verses 7–9, when Moses came down from Mount Sinai after speaking with God, his face shone (Exodus 34). Because the law was given by God, his ministry had glory too. But the ministry of the Spirit is even more glorious. If condemnation and death were pronounced on sinners who defied the law, in the new covenant we enjoy <mark>righteousness and life through Christ</mark>. Righteousness here first means the grace by which God counts sinners righteous in Christ. <mark>We aren't accepted by God only after succeeding at change; those already accepted in Christ keep being renewed by the Spirit's work.</mark> So when we discover sin before the Word, we don't need to hide. Relying on Christ's forgiveness, we can repent and move forward on the path of obedience the Spirit leads us on.", "In verses 10–11, Paul contrasts the ministry of the old covenant with the ministry of the new covenant that remains forever. The glory of the new covenant is so surpassing that the glory of Moses' time loses its brightness by comparison. The salvation by which God forgave and gave life to sinners in Christ is eternal. Where are we looking for that glory? Even where a person begins to admit their sin, lay down hatred, and live honestly, we can see <mark>the glorious work the Spirit is doing</mark>. The grace that God has accepted me becomes the strength to repent and obey again, even in the place of failure."], "points": ["The grace of being accepted by God becomes the strength to repent and obey again, even after failure."]}, {"title": "Verses 12–18 · The Veil Is Removed, and We Are Transformed into His Image", "paragraphs": ["In verses 12–13, Paul preaches the gospel <mark>'with great boldness,'</mark> holding the hope that God gives people life. Moses' veil and Paul's boldness are contrasted. Some see what the veil covered as the fading end of that glory; others connect it with the judgment sinners would face before that glory. Interpretations differ, but the direction of the following words is unmistakably clear: in Christ the veil is removed, and believers come to behold the Lord's glory directly. In verses 14–16, the veil is now explained as referring to people's hearts — <mark>the hardness</mark> that reads the writings of Moses yet cannot accept God's salvation accomplished in Christ. This makes us examine ourselves: As we read the Word, are we turning what we need to fix in ourselves into other people's problems? Paul says, <mark>'But when one turns to the Lord, the veil is removed.'</mark> It means returning from the place of insisting on ourselves to the place of trusting and relying on the Lord. That's why, when we meditate on the Word, we must lay even our own judgments before the Lord.", "Verse 17: <mark>'Now the Lord is the Spirit, and where the Spirit of the Lord is, there is freedom.'</mark> In this context, it is the freedom to behold the Lord's glory with the veil removed. Let me say it again: where the Spirit of the Lord is — where there is obedience to the Word — there is freedom. When we live such a life, the veil is lifted and we are given freedom to behold the Lord's glory; the Spirit lets us enjoy God's presence and life. This freedom leads to a life of becoming like the Lord. A person who hid their wrongs repents; a person gripped by hatred takes a step toward forgiveness. These responses are possible because the Spirit renews the heart. Verse 18: <mark>'And we all, with unveiled face, beholding the glory of the Lord, are being transformed into the same image from one degree of glory to another.'</mark> 'We all' includes everyone — this isn't grace reserved for special leaders. All believers are transformed as they behold the Lord's glory. Where do we see that glory? Chapter 4 speaks of Christ, the image of God, and the glory of God in His face. We see God's glory as we come to know the Jesus revealed in the gospel. That's why meditating on the Word is so important: in it we learn Jesus' love, truthfulness, and obedience, and we entrust our words and choices to that Word. It is the Spirit alone who leads us to believe and obey and makes us like Christ. This change is <mark>an ongoing process — the journey of our lives</mark>. We cannot conclude the Spirit isn't working just because we fell today. We must rise again, return to the Lord, repent, and obey."], "points": ["In the Word I learn Jesus' love, truthfulness, and obedience, and I entrust my words and choices to it."]}, {"title": "Application · One Word or Action to Change Today", "paragraphs": ["Today's passage begins with a letter and ends with an image. When the Spirit transforms us to be like Christ, our lives become <mark>living letters that show Christ</mark>. After meditating on the Word, we must ask not only what we learned, but how our words and choices are changing before that Word.", "Jesus washed His disciples' feet, told them to serve one another the same way, and said, <mark>'If you know these things, blessed are you if you do them'</mark> (John 13:17). That is the change we need: the Lord's love showing itself in hands that serve someone, words that admit wrong, and an attitude that listens to another's pain.", "Jesus isn't only an example for us. On the cross He bore our sins, and in His resurrection He opened <mark>the way of new life</mark>. And the Holy Spirit helps and leads us, who have received that grace, to become like the Lord. If you have fallen, rise again and return to the Lord.", "Holding on to today's Word, decide on <mark>one word or action you need to change</mark>. If you need to apologize, don't delay. If you need to listen to someone, stop talking. If there's a way to serve, reach out first. Ask for the Spirit's help and take that one step."], "points": ["Asking for the Spirit's help, I take one Christlike step today."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I didn't stop at reading and knowing the Word, but reflected on how my words and choices are changing."}, {"key": "c2", "text": "I tried to see not only the church's shortcomings but also the Spirit's grace at work in it."}, {"key": "c3", "text": "I checked whether I turned faults exposed by the Word into other people's problems."}, {"key": "c4", "text": "When I fell, I didn't hide but returned to the Lord, relying on Christ's forgiveness."}], "s4heading": "One-Line Reflection", "memoHint": "What is one word or action I need to change before today's Word, and how will I put it into practice?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Apologize Without Delay", "value": "If someone comes to mind whom you need to apologize to, reach out first today and apologize sincerely"}, {"key": "act2", "label": "Stop and Listen", "value": "In conversation, stop talking and listen to the other person's pain and story to the end"}, {"key": "act3", "label": "Reach Out First", "value": "Find one way to serve at home or in your community and reach out first"}, {"key": "act4", "label": "Recognize Grace", "value": "Find one grace the Spirit has worked in a community or person that seems lacking, and give thanks"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize 2 Corinthians 3:18 and behold Jesus in the Word"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, God, for accepting me in Christ, giving life to my hardened heart by the Spirit, and transforming me into the Lord's image from glory to glory."}, {"key": "p2", "tag": "Repent", "text": "I repent of repeating the same wrongs while knowing Your Word, turning my exposed faults into others' problems, and seeing only my community's shortcomings."}, {"key": "p3", "tag": "Ask", "text": "Let me behold the Lord with an unveiled face, and may the Spirit renew my words and choices today so that my life becomes a living letter that shows Christ."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Nobyembre 4, Miyerkules", "ref": "2 Corinto 3:1–18", "headline": "Habang Binabasa Ko ang Salita,<br>Kanino Ako Nagiging Kawangis?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · 2 Corinto 3:1-18", "s1heading": "Salita Ngayon", "verse": "\"At tayong lahat, na may mukhang walang talukbong, na nakamasid sa kaluwalhatian ng Panginoon,<br>ay binabago sa gayunding larawan<br>mula sa isang antas ng kaluwalhatian tungo sa iba. Sapagkat ito'y mula sa Panginoon na siyang Espiritu.\"", "verseRef": "2 Corinto 3:18", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Isang Talatang Nagsisimula sa Liham at Nagtatapos sa Larawan", "paragraphs": ["Napakahirap magbago ng isang tao. May kasabihang Koreano: 'Ang ugaling nabuo sa edad na tatlo ay tatagal hanggang walumpu.' Alam natin kung ano ang tama, ngunit patuloy nating ginagawa ang parehong bagay at inuulit ang parehong pagkakamali. Nakikita pa natin ang ating sarili sa Israel, na paulit-ulit na sumuway sa ilang at sa lupang pangako. Kaya paano tayo mababago? Narito ang sentro ng Salita ngayon: <mark>ang Espiritu Santo, sa pamamagitan ng Salita, ay nagpapatingin sa atin kay Cristo at binabago tayo upang maging mga taong kawangis ni Cristo.</mark> Sa ganitong paraan nahahayag ang larawan ng Diyos sa ating buhay.", "Sa naunang talata, pinayuhan ni Pablo ang mga mananampalataya nang may luha dahil iniibig at inaalagaan niya sila, at ipinahayag niyang inihahayag ng Diyos ang halimuyak ni Cristo sa pamamagitan ng kanyang kahinaan. Nagtanong siya, <mark>'Sino ang sapat para sa mga bagay na ito?'</mark> (2:16). Sinasagot ng talata ngayon ang tanong na iyon: mula sa Diyos ang kasapatan. At ang komunidad na itinayo ng Espiritu sa pamamagitan ng ministeryo ni Pablo ay nagpapatotoo sa katapatan ng ministeryong iyon. Tinatawag ni Pablo ang mga mananampalataya sa Corinto na liham ni Cristo, nililinaw kung ano ang pinagtitiwalaan niya habang ipinagpapatuloy ang kanyang ministeryo. Nagsisimula ang talata ngayon sa <mark>'liham'</mark> at nagtatapos sa <mark>'larawan.'</mark> Kapag binabago tayo ng Espiritu upang maging tulad ni Cristo, nahahayag si Cristo — ang larawan ng Diyos — sa pamamagitan ng ating buhay at iglesya. Habang nagbubulay tayo sa Salita ngayon, tingnan natin ang ating sarili: Ano ang natututunan ko sa pamamagitan ng Salita — at habang hawak ko ito, kanino ako tunay na nagiging kawangis?"], "points": ["Ano ang natututunan ko sa pamamagitan ng Salita — at kanino ako tunay na nagiging kawangis?"]}, {"title": "Talata 1–3 · Ang Komunidad na Binago ng Espiritu ay Liham Mula kay Cristo", "paragraphs": ["Sa talata 1, nagtanong si Pablo kung talagang kailangan niya ng liham ng rekomendasyon upang ipakilala ang sarili sa iglesya sa Corinto. Hindi niya tinatanggihan ang mga liham ng rekomendasyon mismo. Narinig ng mga mananampalataya sa Corinto ang ebanghelyo mula kay Pablo at naranasan ang kanyang ministeryo. Ang gawa ng Diyos sa paggawa sa kanila na komunidad ni Cristo ay patotoo na mismo sa ministeryo ni Pablo. Talata 2: <mark>'Kayo mismo ang aming liham ng rekomendasyon, nakasulat sa aming mga puso, nakikilala at nababasa ng lahat.'</mark> Ang mga mananampalataya ay liham na nakasulat sa puso ni Pablo at ng kanyang mga kamanggagawa — isang buhay na liham. Pagpapahayag ito na dala ni Pablo sa kanyang puso ang kanilang pananampalataya at buhay. At ang komunidad na iyon ay liham na nakikilala at nababasa ng mga tao. Magkaugnay ang ebanghelyong ipinangaral ni Pablo at ang buhay ng mga mananampalataya.", "Inihahayag ng talata 3 na si Cristo ang may-akda ng liham na ito. Naglingkod si Pablo upang lumitaw ang liham, ngunit ang Isang kumilos sa puso ng mga tao ay <mark>'ang Espiritu ng buhay na Diyos.'</mark> Sa halip na tinta at tapyas na bato, lumilitaw ang Espiritu at <mark>'mga tapyas ng pusong laman.'</mark> Ang pusong laman ay buhay na pusong makatutugon sa Diyos. Natutupad ang paulit-ulit na pangako ng Lumang Tipan — na isusulat ang Salita sa mga puso at babaguhin ang matitigas na puso (Jeremias 31:33; Ezekiel 36:26). May alitan at pagkakamali pa rin ang iglesya sa Corinto. Gayunman, itinuturing at tinatawag sila ni Pablo na liham ni Cristo. Nakilala niya ang ginawa ng Espiritu kahit sa hindi perpektong komunidad. Tayo rin, habang itinatama ang mga mali ng iglesya, ay dapat <mark>makita rin ang biyaya ng Diyos na kumikilos sa gitna nito</mark>. Laging magkasama ang pusong kumikilala sa biyaya at ang saloobin ng pagsisisi."], "points": ["Binabasa ng mundo kung sino ang Cristong sinasampalatayanan natin mula sa paraan ng ating sama-samang pamumuhay."]}, {"title": "Talata 4–6 · Nagtatalaga ang Diyos ng mga Lingkod, at Nagbibigay-Buhay ang Espiritu", "paragraphs": ["Sa talata 4–5, ang tiwala ni Pablo ay <mark>'sa pamamagitan ni Cristo tungo sa Diyos.'</mark> Hindi niya iniisip na mula sa kanyang sarili ang kapangyarihang magbago ng tao. <mark>'Hindi sa kami'y sapat sa aming sarili upang angkinin ang anuman bilang mula sa amin, kundi ang aming kasapatan ay mula sa Diyos.'</mark> Ang 'kasapatan' dito ay nangangahulugang kakayahan at lakas upang gampanan ang gawain, at ipinahayag ni Pablo na mula ito sa Diyos. Ang mga salitang ito ay tumutukoy muna sa ministeryo ni Pablo at ng kanyang mga kamanggagawa. Kapag naglilingkod tayo sa ating kapatiran sa iglesya, dapat din tayong matuto, maghanda, at magsikap — habang lubos na umaasa sa Espiritu Santo na nagbabago ng puso. Dapat nating alalahanin: <mark>ang Isang nagpapalago ay hindi ikaw o ako, kundi ang Espiritu Santo lamang</mark>.", "Sa talata 6, ginawa ng Diyos si Pablo na ministro ng <mark>bagong tipan</mark> — ang bagong tipang itinatag ni Jesus sa Kanyang sariling dugo, ang pagpapatuloy kay Cristo ng pangako ng Diyos na isulat ang Kanyang kautusan sa ating mga puso. Isinulat ni Pablo, <mark>'Sapagkat ang titik ay pumapatay, ngunit ang Espiritu ay nagbibigay-buhay.'</mark> Ang 'Espiritu' rito ay ang Espiritu Santo. Inihahayag ng kautusan ang kalooban ng Diyos at inilalantad ang ating kasalanan; hinahatulan ang mga makasalanang sumuway sa Salitang iyon. Ngunit hindi kayang baguhin ng mga utos ng kautusan mismo ang matigas na puso ng makasalanan. Ang Espiritu Santo ang nagbibigay-buhay sa pusong iyon at nagpapangyaring tumugon ito sa Diyos. Kaya hindi natin dapat unawain ito na hindi na kailangan ang wastong pagbasa ng Kasulatan. Inaakay tayo ng Espiritu na manampalataya at sumunod sa Salita. Kapag nalantad ang ating mga pagkakamali habang nagbabasa, humihingi tayo ng tulong ng Espiritu at tinatanggap ang Salitang iyon."], "points": ["Kapag nalantad ang aking mga pagkakamali habang nagbabasa, humihingi ako ng tulong ng Espiritu at tinatanggap ang Salita."]}, {"title": "Talata 7–11 · Mas Dakila at Walang Hanggan ang Kaluwalhatian ng Bagong Tipan", "paragraphs": ["Sa talata 7–9, nang bumaba si Moises mula sa Bundok ng Sinai matapos makipag-usap sa Diyos, nagliwanag ang kanyang mukha (Exodo 34). Dahil ibinigay ng Diyos ang kautusan, may kaluwalhatian din ang kanyang ministeryo. Ngunit mas maluwalhati pa ang ministeryo ng Espiritu. Kung hatol at kamatayan ang ipinahayag sa mga makasalanang sumuway sa kautusan, sa bagong tipan ay tinatamasa natin ang <mark>katuwiran at buhay sa pamamagitan ni Cristo</mark>. Ang katuwiran dito ay unang nangangahulugan ng biyayang ibinibilang ng Diyos na matuwid ang mga makasalanan kay Cristo. <mark>Hindi tayo tinatanggap ng Diyos pagkatapos lamang magtagumpay sa pagbabago; ang mga tinanggap na kay Cristo ay patuloy na binabago ng gawa ng Espiritu.</mark> Kaya kapag natuklasan natin ang kasalanan sa harap ng Salita, hindi natin kailangang magtago. Sa pag-asa sa kapatawaran ni Cristo, maaari tayong magsisi at sumulong sa landas ng pagsunod na inaakay ng Espiritu.", "Sa talata 10–11, pinaghahambing ni Pablo ang ministeryo ng lumang tipan at ang ministeryo ng bagong tipan na nananatili magpakailanman. Napakahigit ng kaluwalhatian ng bagong tipan kaya nawawalan ng ningning ang kaluwalhatian ng panahon ni Moises kung ihahambing. Walang hanggan ang kaligtasang pinatawad at binigyang-buhay ng Diyos ang mga makasalanan kay Cristo. Saan natin hinahanap ang kaluwalhatiang iyon? Kahit kung saan nagsisimula ang isang tao na aminin ang kanyang kasalanan, ilapag ang poot, at mamuhay nang tapat, makikita natin ang <mark>maluwalhating gawang ginagawa ng Espiritu</mark>. Ang biyayang tinanggap ako ng Diyos ay nagiging lakas upang muling magsisi at sumunod, kahit sa lugar ng kabiguan."], "points": ["Ang biyaya ng pagiging tinanggap ng Diyos ay nagiging lakas upang muling magsisi at sumunod, kahit matapos ang kabiguan."]}, {"title": "Talata 12–18 · Inaalis ang Talukbong, at Tayo'y Binabago sa Kanyang Larawan", "paragraphs": ["Sa talata 12–13, ipinangangaral ni Pablo ang ebanghelyo <mark>'nang buong katapangan,'</mark> dala ang pag-asang nagbibigay-buhay ang Diyos sa mga tao. Pinaghahambing ang talukbong ni Moises at ang katapangan ni Pablo. May ilang nakikita na ang tinakpan ng talukbong ay ang kumukupas na wakas ng kaluwalhatiang iyon; ang iba ay iniuugnay ito sa paghatol na haharapin ng mga makasalanan sa harap ng kaluwalhatiang iyon. Magkakaiba ang interpretasyon, ngunit napakalinaw ng direksyon ng mga sumunod na salita: kay Cristo, inaalis ang talukbong, at nakikita ng mga mananampalataya nang tuwiran ang kaluwalhatian ng Panginoon. Sa talata 14–16, ipinaliliwanag na ngayon ang talukbong bilang tumutukoy sa puso ng mga tao — <mark>ang katigasang</mark> nagbabasa ng mga isinulat ni Moises ngunit hindi matanggap ang kaligtasan ng Diyos na natupad kay Cristo. Pinasusuri tayo nito sa ating sarili: Habang binabasa natin ang Salita, ginagawa ba nating problema ng iba ang kailangan nating ayusin sa ating sarili? Sinasabi ni Pablo, <mark>'Ngunit kapag ang isa'y bumaling sa Panginoon, inaalis ang talukbong.'</mark> Ibig sabihin, pagbabalik mula sa lugar ng pagpipilit sa ating sarili tungo sa lugar ng pagtitiwala at pag-asa sa Panginoon. Kaya kapag nagbubulay tayo sa Salita, dapat nating ilapag kahit ang sarili nating paghatol sa harap ng Panginoon.", "Talata 17: <mark>'Ngayon, ang Panginoon ay ang Espiritu, at kung nasaan ang Espiritu ng Panginoon, naroon ang kalayaan.'</mark> Sa kontekstong ito, ito ang kalayaang makita ang kaluwalhatian ng Panginoon nang inalis na ang talukbong. Muli kong sasabihin: kung nasaan ang Espiritu ng Panginoon — kung saan may pagsunod sa Salita — naroon ang kalayaan. Kapag ganoon ang ating pamumuhay, naaalis ang talukbong at binibigyan tayo ng kalayaang makita ang kaluwalhatian ng Panginoon; pinatatamasa sa atin ng Espiritu ang presensya at buhay ng Diyos. Humahantong ang kalayaang ito sa buhay ng pagiging kawangis ng Panginoon. Ang taong nagtatago ng kanyang mga mali ay nagsisisi; ang taong hawak ng poot ay humahakbang tungo sa kapatawaran. Posible ang mga tugong ito dahil binabago ng Espiritu ang puso. Talata 18: <mark>'At tayong lahat, na may mukhang walang talukbong, na nakamasid sa kaluwalhatian ng Panginoon, ay binabago sa gayunding larawan mula sa isang antas ng kaluwalhatian tungo sa iba.'</mark> Kasama sa 'tayong lahat' ang bawat isa — hindi ito biyayang nakalaan lamang sa mga espesyal na pinuno. Binabago ang lahat ng mananampalataya habang nakamasid sila sa kaluwalhatian ng Panginoon. Saan natin nakikita ang kaluwalhatiang iyon? Nagsasalita ang kabanata 4 tungkol kay Cristo, ang larawan ng Diyos, at ang kaluwalhatian ng Diyos sa Kanyang mukha. Nakikita natin ang kaluwalhatian ng Diyos habang nakikilala natin si Jesus na inihayag sa ebanghelyo. Kaya napakahalaga ng pagbubulay sa Salita: dito natin natututunan ang pag-ibig, katapatan, at pagsunod ni Jesus, at ipinagkakatiwala natin sa Salitang iyon ang ating mga salita at pasya. Ang Espiritu lamang ang umaakay sa atin na manampalataya at sumunod at ginagawa tayong kawangis ni Cristo. Ang pagbabagong ito ay <mark>patuloy na proseso — ang paglalakbay ng ating buhay</mark>. Hindi natin maipapasyang hindi kumikilos ang Espiritu dahil lamang bumagsak tayo ngayon. Dapat tayong bumangong muli, bumalik sa Panginoon, magsisi, at sumunod."], "points": ["Sa Salita, natututunan ko ang pag-ibig, katapatan, at pagsunod ni Jesus, at ipinagkakatiwala ko rito ang aking mga salita at pasya."]}, {"title": "Aplikasyon · Isang Salita o Kilos na Babaguhin Ngayon", "paragraphs": ["Nagsisimula ang talata ngayon sa liham at nagtatapos sa larawan. Kapag binabago tayo ng Espiritu upang maging tulad ni Cristo, nagiging <mark>buhay na liham na nagpapakita kay Cristo</mark> ang ating buhay. Matapos magbulay sa Salita, dapat nating itanong hindi lamang kung ano ang natutunan natin, kundi kung paano nagbabago ang ating mga salita at pasya sa harap ng Salitang iyon.", "Hinugasan ni Jesus ang mga paa ng Kanyang mga alagad, sinabihan silang maglingkod sa isa't isa sa gayunding paraan, at sinabing, <mark>'Kung alam ninyo ang mga bagay na ito, mapalad kayo kung ginagawa ninyo ang mga ito'</mark> (Juan 13:17). Iyan ang pagbabagong kailangan natin: ang pag-ibig ng Panginoon na nahahayag sa mga kamay na naglilingkod sa iba, sa mga salitang umaamin ng mali, at sa saloobing nakikinig sa sakit ng iba.", "Si Jesus ay hindi lamang halimbawa para sa atin. Sa krus, pinasan Niya ang ating mga kasalanan, at sa Kanyang muling pagkabuhay ay binuksan Niya <mark>ang daan ng bagong buhay</mark>. At tinutulungan at inaakay ng Espiritu Santo tayong tumanggap ng biyayang iyon upang maging kawangis ng Panginoon. Kung bumagsak ka, bumangong muli at bumalik sa Panginoon.", "Habang hawak ang Salita ngayon, magpasya sa <mark>isang salita o kilos na kailangan mong baguhin</mark>. Kung kailangan mong humingi ng tawad, huwag ipagpaliban. Kung kailangan mong makinig sa iba, ihinto ang pagsasalita. Kung may paraan upang maglingkod, ikaw muna ang mag-abot ng kamay. Humingi ng tulong ng Espiritu at gawin ang isang hakbang na iyon."], "points": ["Sa paghingi ng tulong ng Espiritu, gagawa ako ng isang hakbang na kawangis ni Cristo ngayon."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Hindi ako huminto sa pagbasa at pagkaalam ng Salita, kundi pinag-isipan ko kung paano nagbabago ang aking mga salita at pasya."}, {"key": "c2", "text": "Sinikap kong makita hindi lamang ang mga kakulangan ng iglesya kundi pati ang biyaya ng Espiritu na kumikilos dito."}, {"key": "c3", "text": "Sinuri ko kung ginawa kong problema ng iba ang mga pagkakamaling inilantad ng Salita."}, {"key": "c4", "text": "Nang bumagsak ako, hindi ako nagtago kundi bumalik sa Panginoon, umaasa sa kapatawaran ni Cristo."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Ano ang isang salita o kilos na kailangan kong baguhin sa harap ng Salita ngayon, at paano ko ito isasagawa?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Humingi ng Tawad Agad", "value": "Kung may naaalala kang taong kailangan mong hingan ng tawad, ikaw muna ang makipag-ugnayan ngayon at taimtim na humingi ng tawad"}, {"key": "act2", "label": "Huminto at Makinig", "value": "Sa pakikipag-usap, ihinto ang pagsasalita at pakinggan hanggang dulo ang sakit at kuwento ng iba"}, {"key": "act3", "label": "Ikaw Muna ang Mag-abot", "value": "Maghanap ng isang paraan upang maglingkod sa tahanan o komunidad at ikaw muna ang mag-abot ng kamay"}, {"key": "act4", "label": "Kilalanin ang Biyaya", "value": "Maghanap ng isang biyayang ginawa ng Espiritu sa komunidad o taong mukhang kulang, at magpasalamat"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang 2 Corinto 3:18 at masdan si Jesus sa Salita"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Diyos, sa pagtanggap sa akin kay Cristo, sa pagbibigay-buhay sa aking matigas na puso sa pamamagitan ng Espiritu, at sa pagbabago sa akin sa larawan ng Panginoon mula sa kaluwalhatian tungo sa kaluwalhatian."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa pag-uulit ng parehong mali habang alam ko ang Iyong Salita, sa paggawang problema ng iba ng aking mga nalantad na pagkakamali, at sa pagtingin lamang sa mga kakulangan ng aking komunidad."}, {"key": "p3", "tag": "Kahilingan", "text": "Hayaan Mong masdan ko ang Panginoon nang may mukhang walang talukbong, at baguhin nawa ng Espiritu ang aking mga salita at pasya ngayon upang ang aking buhay ay maging buhay na liham na nagpapakita kay Cristo."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-11-04';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
