<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "11월 23일 월요일", "ref": "시편 23편 1–6절", "headline": "앞이 보이지 않으면<br>길을 잘못 든 걸까요?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 시편 23:1-6", "s1heading": "오늘의 말씀", "verse": "\"내가 사망의 음침한 골짜기로 다닐지라도<br>해를 두려워하지 않을 것은 주께서 나와 함께 하심이라<br>주의 지팡이와 막대기가 나를 안위하시나이다\"", "verseRef": "시편 23:4", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 일이 더 어려워진 날에도 주님이 이끄신다고 말할 수 있을까요", "paragraphs": ["오랫동안 기도한 일이 잘 풀리면 우리는 이렇게 말합니다. \"돌아보니 하나님이 인도하셨습니다.\" 그런데 기도하고 내린 결정인데도 <mark>일이 더 어려워질 때</mark>가 있습니다. 할 수 있는 일은 최선을 다했고, 이제는 기다리는 일만 남았습니다. 그날에도 우리는 하나님이 나를 이끌고 계신다고 말할 수 있을까요?", "앞선 22편에서 시인은 하나님께서 멀리 계시지 말아 달라고 부르짖었고, 회중 앞에서 하나님이 자기 울음을 들으셨다고 전했습니다. 오늘 23편에서는 <mark>아직 골짜기를 걷는 시인이 주님이 곁에 계신다고 고백합니다</mark>. 울며 부를 때에도, 믿고 걸을 때에도 시인은 같은 하나님을 향합니다.", "다윗은 <mark>부족함이 없다</mark>고 고백합니다. 앞에는 골짜기가 있고 원수들도 보이는데 어떻게 그럴 수 있을까요? 다윗의 시선을 따라가 보십시오. 주님은 지친 양을 눕히고 다시 일으켜 길을 이끄십니다. 원수 앞에서는 손수 밥상을 차려 주십니다. 다윗은 이렇게 자기를 돌보시는 분께 평생을 맡깁니다."], "points": ["기도하고 내린 결정이 더 어려워졌을 때, 하나님이 나를 떠나셨다고 생각하고 있지는 않습니까?"]}, {"title": "1절 · 다른 이를 돌보는 목자에게도 목자가 계십니다", "paragraphs": ["<mark>\"여호와는 나의 목자시니 내게 부족함이 없으리로다\"</mark>(1절). 다윗은 사무엘하 5장에서 이스라엘 백성의 목자로 부름 받았습니다. 백성 앞에서는 목자였지만, <mark>하나님 앞에서는 그도 돌봄이 필요한 한 마리 양</mark>이었습니다.", "양은 내일 어느 풀밭에서 먹을지 몰라도, 자기를 먹이시는 목자를 믿을 수 있습니다. '부족함이 없다'는 고백은 모든 것을 이미 손에 쥐었다는 뜻이 아니라, <mark>필요한 것을 채우실 목자가 계시다</mark>는 신뢰입니다.", "가정에서든 교회에서든 다른 사람을 챙기다 보면 내 걱정은 자꾸 뒤로 미루게 됩니다. 자녀가 길을 물어 오면 어떻게든 답을 찾아 주고 싶습니다. 그런 날에는 우리도 먼저 주님께 길을 물을 수 있습니다. <mark>\"주님, 저도 어디로 가야 할지 모르겠습니다.\"</mark> 남을 돌보는 다윗 왕에게도 이렇게 의지할 목자가 계셨습니다."], "points": ["다른 사람을 돌보느라 지친 나도, 주님께 돌봄받아야 할 양임을 인정하고 있습니까?"]}, {"title": "2–3절 · 쉬게 하시고 다시 의의 길로 이끄시는 목자", "paragraphs": ["<mark>\"그가 나를 푸른 풀밭에 누이시며 쉴 만한 물 가로 인도하시는도다\"</mark>(2절). 목자가 양에게 먼저 해 주는 일은 풀밭에 눕히는 것입니다. 그곳에는 먹을 풀이 있고, 가까운 물가에서는 목을 축일 수 있습니다. 그렇게 먹고 쉬면서 지친 몸이 다시 걸을 힘을 얻습니다. <mark>\"내 영혼을 소생시키시고\"</mark>(3절)라는 말씀이 바로 그런 뜻입니다. 기력이 다한 날을 주님이 다시 일으켜 주십니다.", "이제 목자는 양을 <mark>\"자기 이름을 위하여 의의 길로\"</mark> 이끄십니다. 양에게는 목적지로 가는 바른 길이 있고, 우리에게는 하나님이 기뻐하시는 길이 있습니다. 손해를 감수하고 약속을 지키는 일도 그런 걸음입니다. 주님은 자기 이름을 위하여 우리를 이끄십니다. <mark>내가 흔들리는 날에도 그분은 자기 이름에 걸맞게 신실하십니다.</mark>", "할 일이 쌓여 있으면 쉬는 동안에도 시간을 버리는 것 같습니다. 그런데 2절의 양은 <mark>풀밭에 누워 있는 동안에도 목자의 인도를 받고 있습니다</mark>. 내 계획이 멈춘 날에도 주님은 지친 나를 돌보십니다. 쉼도 주님의 인도하심 가운데 있습니다."], "points": ["멈춰 쉬어야 하는 날, 그 쉼도 주님의 인도하심 안에 있음을 믿고 있습니까?"]}, {"title": "4절 · 어두운 골짜기를 걸을 때에도 주께서 함께하십니다", "paragraphs": ["다윗이 말하는 골짜기는 죽음의 위협을 느낄 만큼 깊고 어둡습니다. 그런데 3절에서 바른 길로 인도받던 바로 그 사람이 4절에서 이 골짜기를 걷습니다. 우리는 일이 어려워지면 '내가 어디서 길을 잘못 들었을까' 하는 생각부터 듭니다. 그러나 다윗의 고백을 들어 보면, <mark>목자를 따라 걷는 길에도 어두운 골짜기가 있습니다</mark>. 용기를 내어 먼저 사과했는데 답은 정작 오지 않을 때, 하루에도 몇 번씩 휴대폰을 보며 괜한 말을 했나 싶습니다. 그래도 내 잘못을 인정한 것은 여전히 옳은 걸음입니다.", "<mark>\"내가 사망의 음침한 골짜기로 다닐지라도 해를 두려워하지 않을 것은 주께서 나와 함께 하심이라 주의 지팡이와 막대기가 나를 안위하시나이다\"</mark>(4절). 풀밭에서는 '그가 나를 이끄신다'고 했습니다. 그런데 골짜기에서는 <mark>'주께서 나와 함께 하신다'</mark>고 말합니다. 하나님이 어떤 분인지 들려주던 다윗이 이제 그 하나님께 직접 말을 건넵니다. 목자의 손에는 양을 이끌고 지켜 줄 지팡이와 막대기가 있고, 다윗은 그 손을 의지해 어두운 길에서 한 걸음을 더 내딛습니다.", "우리는 대개 어려운 일을 다 겪고 나서야 사람들에게 그 이야기를 꺼냅니다. 그러나 주님께는 <mark>아직 한가운데 있을 때 말할 수 있습니다</mark>. \"주님, 오늘은 무섭습니다. 두렵습니다.\" 이 짧은 기도에도 곁에 계신 분을 향한 믿음이 담겨 있습니다. 상대의 마음이 풀리는 데 시간이 걸리는 오늘도, 주님께 마음을 맡기며 기다릴 수 있습니다."], "points": ["지금 걷는 골짜기 한가운데서, \"주님, 두렵습니다\"라고 주님께 직접 말하고 있습니까?"]}, {"title": "5–6절 · 원수 앞에서 상을 차리시고 평생 따르는 사랑", "paragraphs": ["<mark>\"주께서 내 원수의 목전에서 내게 상을 차려 주시고 기름을 내 머리에 부으셨으니 내 잔이 넘치나이다\"</mark>(5절). 주님은 손님을 맞는 집주인처럼 다윗에게 밥상을 차려 주십니다. 기름과 넘치는 잔에는 귀한 손님을 맞는 주인의 기쁨이 담겨 있습니다. 그런데 이 식탁이 놓인 곳을 보십시오. <mark>다윗을 위협하는 원수들이 아직 거기에 있습니다</mark>. 주님은 그들이 보는 앞에서 다윗의 자리를 마련하십니다.", "22편에도 고통받는 사람을 쳐다보는 이들이 있었습니다. 그들은 하나님이 정말 그를 기뻐하신다면 건져 보라고 조롱했습니다. 오늘 23편에서 원수들이 보는 것은 <mark>하나님이 다윗을 대접하시는 모습</mark>입니다. 사람들의 말에 마음이 움츠러드는 날, 이 식탁을 기억하십시오. 하나님이 나를 얼마나 귀하게 여기시는지 그분이 차려 주신 상에서 알 수 있습니다.", "<mark>\"내 평생에 선하심과 인자하심이 반드시 나를 따르리니 내가 여호와의 집에 영원히 살리로다\"</mark>(6절). '따른다'는 말에는 뒤를 바짝 쫓는다는 뜻이 있습니다. 원수들이 나왔으니 누가 다윗을 쫓아올까 싶지만, 다윗의 대답은 <mark>주님의 선하심과 인자하심</mark>입니다. 인자하심은 자기 백성을 끝까지 사랑하시는 한결같은 사랑입니다. 마지막에 다윗은 그 상을 차려 주신 분의 집을 바라봅니다. 음식을 다 먹고도 나를 반겨 준 이와 조금 더 앉아 있고 싶은 식탁처럼, 다윗은 평생 그분 곁에 머물며 예배하는 삶을 소망합니다."], "points": ["사람들의 말에 움츠러드는 날, 주님이 나를 귀히 여겨 차려 주신 식탁을 기억하고 있습니까?"]}, {"title": "적용 · 앞에서, 곁에서, 뒤에서 나를 돌보시는 선한 목자", "paragraphs": ["길을 모를 때 주님은 <mark>앞에서 이끄십니다</mark>. 골짜기에서는 <mark>곁에 계십니다</mark>. 앞날을 바라보면 주님의 사랑이 <mark>뒤를 따릅니다</mark>. 내 눈이 온통 원수에게 쏠린 날에도, 주님은 내 걸음의 앞과 곁과 뒤를 돌보고 계십니다.", "마가복음 6장에서 예수님은 사람들을 돌보느라 밥 먹을 겨를도 없던 제자들에게 <mark>\"한적한 곳에 가서 잠깐 쉬어라\"</mark>(막 6:31)고 하셨습니다. 또 목자 없는 양 같은 무리를 불쌍히 여기시고 그들을 가르치셨습니다. 날이 저물자 예수님은 그들을 푸른 잔디 위에 앉히시고 떡을 떼어 나누게 하셨고, 사람들은 모두 배불리 먹었습니다. 제자들이 얼마나 지쳤는지 아셨고, 무리에게 한 끼가 필요하다는 것도 아셨습니다.", "그렇게 사람들을 먹이신 예수님은 십자가에서 우리를 위해 자기 목숨을 내어 주셨고, 다시 살아나셨습니다. <mark>선한 목자이신 예수님</mark>은 자기 양들에게 영원한 생명을 주시며 그들을 자기 손으로 지키십니다(요 10:11, 28). 우리가 두려운 날에도 삶을 맡길 수 있는 분이 바로 이 예수님이십니다.", "요즘 어떤 일을 두고 가장 오래 기다리고 계십니까? 오늘 하루를 마치기 전에 그 일 하나를 주님께 있는 그대로 말씀드려 보십시오. \"주님, 저는 아직 길이 보이지 않아 두렵습니다. 저와 함께 걸어 주시는 주님을 믿습니다. <mark>오늘 제가 걸어가야 할 바른 길을 보여 주십시오.</mark>\""], "points": ["길이 보이지 않아도, 앞과 곁과 뒤에서 나를 돌보시는 선한 목자를 믿고 오늘 한 걸음 내딛겠습니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "일이 어려워졌다고 해서 곧바로 하나님이 떠나셨다고 단정하지 않았다"}, {"key": "c2", "text": "다른 사람을 돌보면서도 나 역시 주님께 길을 물으며 의지했다"}, {"key": "c3", "text": "쉬어야 할 때 죄책감 없이 주님의 돌보심 안에서 쉬었다"}, {"key": "c4", "text": "골짜기 한가운데서도 두려움을 주님께 솔직하게 아뢰었다"}], "s4heading": "묵상 한 줄", "memoHint": "요즘 가장 오래 기다리고 있는 일은 무엇이며, 그 일을 두고 주님께 어떻게 말씀드리겠습니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "있는 그대로 아뢰기", "value": "오래 기다리는 일 하나를 \"주님, 길이 보이지 않아 두렵습니다\"라고 있는 그대로 말씀드리기"}, {"key": "act2", "label": "쉼 누리기", "value": "오늘 잠깐이라도 일을 멈추고 주님 안에서 쉬는 시간 갖기"}, {"key": "act3", "label": "옳은 걸음 지키기", "value": "손해가 되더라도 오늘 지켜야 할 약속이나 해야 할 사과 하나를 실천하기"}, {"key": "act4", "label": "식탁 기억하기", "value": "사람들의 말에 움츠러들 때 나를 귀히 여기시는 주님의 사랑을 떠올리고 감사 적기"}, {"key": "act5", "label": "말씀 암송", "value": "시편 23:4를 외우며 어두운 골짜기에서도 함께하시는 주님을 의지하기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "지친 저를 푸른 풀밭에 누이시고, 어두운 골짜기에서도 곁에 계시며, 원수 앞에서 상을 차려 주시는 선한 목자 예수님께 감사드립니다."}, {"key": "p2", "tag": "회개", "text": "일이 어려워지면 주님이 떠나셨다고 단정하고, 다른 이를 돌본다는 이유로 주님께 길 묻기를 잊으며, 쉼을 시간 낭비로 여겼던 것을 회개합니다."}, {"key": "p3", "tag": "간구", "text": "아직 길이 보이지 않아도 저와 함께 걸어 주시는 주님을 믿게 하시고, 오늘 제가 걸어가야 할 바른 길을 보여 주시며, 평생 주님 곁에 머물게 해 주십시오."}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "November 23, Monday", "ref": "Psalm 23:1–6", "headline": "If I Can't See the Way Ahead,<br>Have I Taken the Wrong Road?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · Psalm 23:1-6", "s1heading": "Today's Word", "verse": "\"Even though I walk through the valley of the shadow of death,<br>I will fear no evil, for you are with me;<br>your rod and your staff, they comfort me.\"", "verseRef": "Psalm 23:4", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · Can We Say God Is Leading Us Even When Things Get Harder?", "paragraphs": ["When something we've prayed about for a long time works out, we say, \"Looking back, God led me.\" But sometimes, even after making a decision in prayer, <mark>things only get harder</mark>. We've done everything we can, and now all that's left is to wait. On a day like that, can we still say that God is leading us?", "In Psalm 22, the psalmist cried out for God not to be far away, and then told the congregation that God had heard his weeping. In Psalm 23, <mark>the psalmist—still walking through the valley—confesses that the Lord is beside him</mark>. Whether calling out in tears or walking in trust, the psalmist turns toward the same God.", "David confesses, <mark>\"I shall not want.\"</mark> How can he say that, with a valley ahead and enemies in sight? Follow David's gaze. The Lord lets the weary sheep lie down, raises it up again, and leads it on the path. Before enemies, He personally prepares a table. David entrusts his whole life to the One who cares for him like this."], "points": ["When a decision I made in prayer becomes harder, do I conclude that God has left me?"]}, {"title": "Verse 1 · Even the Shepherd Who Cares for Others Has a Shepherd", "paragraphs": ["<mark>\"The LORD is my shepherd; I shall not want\"</mark> (v.1). In 2 Samuel 5, David was called to shepherd the people of Israel. Before the people he was a shepherd, but <mark>before God he too was a single sheep in need of care</mark>.", "A sheep may not know which pasture it will graze in tomorrow, yet it can trust the shepherd who feeds it. The confession 'I shall not want' does not mean that we already have everything in hand; it is trust that <mark>there is a Shepherd who will provide what we need</mark>.", "Whether at home or at church, when we are busy caring for others, our own worries keep getting pushed aside. When our children ask us which way to go, we want to find them an answer somehow. On days like that, we too can first ask the Lord for the way: <mark>\"Lord, I don't know where to go either.\"</mark> Even King David, who cared for others, had a Shepherd like this to rely on."], "points": ["Weary from caring for others, do I admit that I too am a sheep who needs the Lord's care?"]}, {"title": "Verses 2–3 · The Shepherd Who Gives Rest and Leads in Paths of Righteousness", "paragraphs": ["<mark>\"He makes me lie down in green pastures. He leads me beside still waters\"</mark> (v.2). The first thing the shepherd does for the sheep is to have it lie down in the pasture. There is grass to eat, and nearby water to drink. By eating and resting, the weary body regains strength to walk again. That is what <mark>\"He restores my soul\"</mark> (v.3) means. On days when our strength is spent, the Lord raises us up again.", "Then the shepherd leads the sheep <mark>\"in paths of righteousness for his name's sake.\"</mark> For a sheep, there is a right path to the destination; for us, there is the path that pleases God. Keeping a promise even at a cost is one such step. The Lord leads us for His name's sake. <mark>Even on days when I waver, He remains faithful, true to His name.</mark>", "When work piles up, resting can feel like wasting time. But the sheep in verse 2 is <mark>being led by the shepherd even while lying in the pasture</mark>. Even on days when my plans have come to a halt, the Lord is caring for my weary self. Rest, too, is part of the Lord's leading."], "points": ["On days I must stop and rest, do I believe that rest is also within the Lord's leading?"]}, {"title": "Verse 4 · Even in the Dark Valley, the Lord Is with Me", "paragraphs": ["The valley David speaks of is deep and dark enough to feel the threat of death. Yet the very person being led in right paths in verse 3 walks through this valley in verse 4. When things get hard, our first thought is, 'Where did I take a wrong turn?' But David's confession tells us that <mark>even on the path of following the Shepherd, there are dark valleys</mark>. Perhaps you found the courage to apologize first, but no reply comes. Several times a day you check your phone and wonder if you said too much. Still, admitting your wrong remains the right step.", "<mark>\"Even though I walk through the valley of the shadow of death, I will fear no evil, for you are with me; your rod and your staff, they comfort me\"</mark> (v.4). In the pasture, David said, 'He leads me.' But in the valley, he says, <mark>'You are with me.'</mark> David, who had been describing who God is, now speaks directly to Him. In the shepherd's hands are the rod and staff to guide and protect the sheep, and leaning on those hands, David takes one more step on the dark path.", "We usually share the story of a hard time with others only after it's over. But with the Lord, <mark>we can speak while we are still in the middle of it</mark>: \"Lord, I'm scared today. I'm afraid.\" Even this short prayer holds faith in the One who is beside us. Even today, while the other person's heart takes time to soften, we can entrust our hearts to the Lord and wait."], "points": ["In the middle of the valley I'm walking through, am I telling the Lord directly, \"Lord, I'm afraid\"?"]}, {"title": "Verses 5–6 · A Table Before Enemies, and Love That Pursues All My Days", "paragraphs": ["<mark>\"You prepare a table before me in the presence of my enemies; you anoint my head with oil; my cup overflows\"</mark> (v.5). Like a host welcoming a guest, the Lord sets a table for David. The oil and overflowing cup carry the joy of a host receiving an honored guest. But look where this table is set: <mark>the enemies threatening David are still there</mark>. The Lord prepares David's place right before their eyes.", "In Psalm 22, too, there were people staring at the one who suffered. They mocked, saying that if God truly delighted in him, let Him rescue him. In Psalm 23, what the enemies see is <mark>God honoring David as His guest</mark>. On days when people's words make your heart shrink, remember this table. You can see how precious you are to God by the table He has set for you.", "<mark>\"Surely goodness and mercy shall follow me all the days of my life, and I shall dwell in the house of the LORD forever\"</mark> (v.6). The word 'follow' carries the sense of pursuing closely. With enemies just mentioned, we might wonder who is chasing David—but David's answer is <mark>the Lord's goodness and steadfast love</mark>. Steadfast love is His unchanging love that loves His people to the end. At the close, David looks toward the house of the One who set the table. Like a table where, even after the meal is finished, we want to stay a little longer with the one who welcomed us, David longs to remain beside Him in worship all his life."], "points": ["On days when people's words make me shrink, do I remember the table the Lord set because He treasures me?"]}, {"title": "Application · The Good Shepherd Who Cares for Me Ahead, Beside, and Behind", "paragraphs": ["When we don't know the way, the Lord <mark>leads from in front</mark>. In the valley, He <mark>is beside us</mark>. When we look to the days ahead, His love <mark>follows behind</mark>. Even on days when my eyes are fixed entirely on my enemies, the Lord is caring for the path ahead of me, beside me, and behind me.", "In Mark 6, Jesus said to His disciples, who had been so busy caring for people that they had no time even to eat, <mark>\"Come away by yourselves to a desolate place and rest a while\"</mark> (Mark 6:31). He also had compassion on the crowd, who were like sheep without a shepherd, and taught them. As evening came, Jesus had them sit down on the green grass, broke the bread and had it distributed, and everyone ate and was satisfied. He knew how tired His disciples were, and He knew the crowd needed a meal.", "The Jesus who fed people this way gave His life for us on the cross and rose again. <mark>Jesus, the Good Shepherd</mark>, gives His sheep eternal life and keeps them in His own hand (John 10:11, 28). This Jesus is the One to whom we can entrust our lives, even on days when we are afraid.", "What are you waiting on the longest these days? Before this day ends, tell the Lord about that one thing just as it is: \"Lord, I still can't see the way, and I'm afraid. I believe You are walking with me. <mark>Show me the right path I should walk today.</mark>\""], "points": ["Even when I can't see the way, I will trust the Good Shepherd who cares for me ahead, beside, and behind, and take one step today."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I did not immediately conclude that God had left me just because things got harder."}, {"key": "c2", "text": "Even while caring for others, I relied on the Lord and asked Him for the way."}, {"key": "c3", "text": "When I needed rest, I rested in the Lord's care without guilt."}, {"key": "c4", "text": "Even in the middle of the valley, I honestly told the Lord about my fears."}], "s4heading": "One-Line Reflection", "memoHint": "What have I been waiting on the longest these days, and how will I speak to the Lord about it?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Tell Him As It Is", "value": "Bring one long-awaited matter to the Lord just as it is: \"Lord, I can't see the way, and I'm afraid\""}, {"key": "act2", "label": "Enjoy Rest", "value": "Stop working even briefly today and take time to rest in the Lord"}, {"key": "act3", "label": "Keep the Right Step", "value": "Even at a cost, keep one promise or make one apology you need to today"}, {"key": "act4", "label": "Remember the Table", "value": "When people's words make you shrink, recall the Lord's love that treasures you and write down your thanks"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize Psalm 23:4 and rely on the Lord who is with you even in the dark valley"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, Jesus, my Good Shepherd, for making me lie down in green pastures when I'm weary, for being beside me in the dark valley, and for preparing a table before my enemies."}, {"key": "p2", "tag": "Repent", "text": "I repent of concluding You had left me when things got hard, of forgetting to ask You for the way while caring for others, and of treating rest as a waste of time."}, {"key": "p3", "tag": "Ask", "text": "Help me trust that You walk with me even when I can't see the way; show me the right path to walk today, and let me remain beside You all my life."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Nobyembre 23, Lunes", "ref": "Awit 23:1–6", "headline": "Kung Hindi Ko Makita ang Daan sa Unahan,<br>Naligaw na ba Ako?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Awit 23:1-6", "s1heading": "Salita Ngayon", "verse": "\"Kahit ako'y lumakad sa libis ng lilim ng kamatayan,<br>hindi ako matatakot sa anumang kasamaan, sapagkat Ikaw ay kasama ko;<br>ang Iyong pamalo at tungkod, ang mga ito'y umaaliw sa akin.\"", "verseRef": "Awit 23:4", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Masasabi ba Nating Gumagabay ang Diyos Kahit Lalong Humihirap ang mga Bagay?", "paragraphs": ["Kapag naging maayos ang isang bagay na matagal nating ipinanalangin, sinasabi natin, \"Kung babalikan, ginabayan ako ng Diyos.\" Ngunit minsan, kahit nagpasya tayo sa panalangin, <mark>lalo pang humihirap ang mga bagay</mark>. Ginawa na natin ang lahat ng makakaya, at paghihintay na lamang ang natitira. Sa ganoong araw, masasabi pa rin ba nating ginagabayan tayo ng Diyos?", "Sa Awit 22, dumaing ang mang-aawit na huwag lumayo ang Diyos, at pagkatapos ay ikinuwento niya sa kapulungan na pinakinggan ng Diyos ang kanyang pag-iyak. Sa Awit 23, <mark>ang mang-aawit—na naglalakad pa rin sa libis—ay nagpapahayag na ang Panginoon ay nasa kanyang tabi</mark>. Tumatawag man nang lumuluha o lumalakad nang may tiwala, iisang Diyos ang hinaharap ng mang-aawit.", "Ipinahayag ni David, <mark>\"Hindi ako magkukulang.\"</mark> Paano niya ito nasasabi, gayong may libis sa unahan at may mga kaaway na natatanaw? Sundan ang tingin ni David. Pinahihiga ng Panginoon ang pagod na tupa, muli itong ibinabangon, at ginagabayan sa landas. Sa harap ng mga kaaway, Siya mismo ang naghahanda ng hapag. Ipinagkatiwala ni David ang buong buhay niya sa Siyang ganito kung mag-alaga sa kanya."], "points": ["Kapag humirap ang desisyong ginawa ko sa panalangin, inaakala ko bang iniwan na ako ng Diyos?"]}, {"title": "Talata 1 · Kahit ang Pastol na Nag-aalaga sa Iba ay May Pastol", "paragraphs": ["<mark>\"Ang PANGINOON ang aking pastol; hindi ako magkukulang\"</mark> (t.1). Sa 2 Samuel 5, tinawag si David upang maging pastol ng bayang Israel. Sa harap ng bayan siya ay pastol, ngunit <mark>sa harap ng Diyos, siya rin ay isang tupang nangangailangan ng pag-aalaga</mark>.", "Maaaring hindi alam ng tupa kung saang pastulan siya kakain bukas, ngunit makapagtitiwala siya sa pastol na nagpapakain sa kanya. Ang pagpapahayag na 'hindi ako magkukulang' ay hindi nangangahulugang hawak na natin ang lahat; ito ay pagtitiwala na <mark>may Pastol na magbibigay ng ating kailangan</mark>.", "Sa tahanan man o sa iglesya, kapag abala tayo sa pag-aalaga sa iba, palaging naiisantabi ang sarili nating mga alalahanin. Kapag nagtanong ang ating mga anak kung saan sila dapat pumunta, nais nating makahanap ng sagot para sa kanila. Sa ganoong mga araw, maaari rin tayong unang magtanong sa Panginoon: <mark>\"Panginoon, hindi ko rin alam kung saan pupunta.\"</mark> Kahit si Haring David, na nag-aalaga sa iba, ay may ganitong Pastol na masasandalan."], "points": ["Pagod sa pag-aalaga sa iba, inaamin ko bang ako rin ay tupang nangangailangan ng pag-aalaga ng Panginoon?"]}, {"title": "Talata 2–3 · Ang Pastol na Nagpapahinga at Gumagabay sa mga Landas ng Katuwiran", "paragraphs": ["<mark>\"Pinahihiga Niya ako sa luntiang pastulan. Inaakay Niya ako sa tabi ng tahimik na tubig\"</mark> (t.2). Ang unang ginagawa ng pastol para sa tupa ay pahigain ito sa pastulan. May damong makakain doon, at may malapit na tubig na maiinom. Sa pagkain at pagpapahinga, muling nagkakaroon ng lakas ang pagod na katawan upang lumakad. Iyan ang ibig sabihin ng <mark>\"Pinanunumbalik Niya ang aking kaluluwa\"</mark> (t.3). Sa mga araw na ubos na ang ating lakas, muli tayong ibinabangon ng Panginoon.", "Pagkatapos ay ginagabayan ng pastol ang tupa <mark>\"sa mga landas ng katuwiran alang-alang sa Kanyang pangalan.\"</mark> Para sa tupa, may tamang landas patungo sa destinasyon; para sa atin, may landas na kinalulugdan ng Diyos. Ang pagtupad sa pangako kahit may kapalit ay isang ganoong hakbang. Ginagabayan tayo ng Panginoon alang-alang sa Kanyang pangalan. <mark>Kahit sa mga araw na ako'y nag-aalinlangan, nananatili Siyang tapat, karapat-dapat sa Kanyang pangalan.</mark>", "Kapag natatambak ang trabaho, parang pag-aaksaya ng oras ang pagpapahinga. Ngunit ang tupa sa talata 2 ay <mark>ginagabayan ng pastol kahit habang nakahiga sa pastulan</mark>. Kahit sa mga araw na tumigil ang aking mga plano, inaalagaan ng Panginoon ang aking pagod na sarili. Ang pahinga rin ay bahagi ng paggabay ng Panginoon."], "points": ["Sa mga araw na kailangan kong tumigil at magpahinga, naniniwala ba akong bahagi rin ng paggabay ng Panginoon ang pahingang iyon?"]}, {"title": "Talata 4 · Kahit sa Madilim na Libis, Kasama Ko ang Panginoon", "paragraphs": ["Ang libis na sinasabi ni David ay napakalalim at napakadilim kaya nadarama ang banta ng kamatayan. Gayunman, ang mismong taong ginagabayan sa tamang landas sa talata 3 ay lumalakad sa libis na ito sa talata 4. Kapag humirap ang mga bagay, ang una nating naiisip ay, 'Saan ako lumiko nang mali?' Ngunit sinasabi sa atin ng pagpapahayag ni David na <mark>kahit sa landas ng pagsunod sa Pastol, may madidilim na libis</mark>. Marahil naglakas-loob kang maunang humingi ng tawad, ngunit walang dumating na sagot. Ilang beses sa isang araw mong tinitingnan ang iyong telepono at iniisip kung sobra ba ang iyong nasabi. Gayunman, ang pag-amin sa iyong pagkakamali ay nananatiling tamang hakbang.", "<mark>\"Kahit ako'y lumakad sa libis ng lilim ng kamatayan, hindi ako matatakot sa anumang kasamaan, sapagkat Ikaw ay kasama ko; ang Iyong pamalo at tungkod, ang mga ito'y umaaliw sa akin\"</mark> (t.4). Sa pastulan, sinabi ni David, 'Ginagabayan Niya ako.' Ngunit sa libis, sinasabi niya, <mark>'Ikaw ay kasama ko.'</mark> Si David, na naglalarawan kung sino ang Diyos, ay tuwiran nang nakikipag-usap sa Kanya ngayon. Nasa mga kamay ng pastol ang pamalo at tungkod upang gabayan at ingatan ang tupa, at nakasandal sa mga kamay na iyon, humahakbang pa si David nang isang hakbang sa madilim na landas.", "Kadalasan, ibinabahagi lamang natin sa iba ang kuwento ng mahirap na panahon kapag tapos na ito. Ngunit sa Panginoon, <mark>maaari tayong magsalita habang nasa gitna pa tayo nito</mark>: \"Panginoon, natatakot ako ngayon. Natatakot ako.\" Kahit ang maikling panalanging ito ay may pananampalataya sa Siyang nasa ating tabi. Kahit ngayon, habang natatagalan ang paglambot ng puso ng kapwa, maaari nating ipagkatiwala ang ating puso sa Panginoon at maghintay."], "points": ["Sa gitna ng libis na nilalakaran ko, tuwiran ko bang sinasabi sa Panginoon, \"Panginoon, natatakot ako\"?"]}, {"title": "Talata 5–6 · Isang Hapag sa Harap ng mga Kaaway, at Pag-ibig na Sumusunod sa Lahat ng Aking mga Araw", "paragraphs": ["<mark>\"Naghahanda Ka ng hapag sa harap ko sa presensya ng aking mga kaaway; pinahiran Mo ng langis ang aking ulo; umaapaw ang aking saro\"</mark> (t.5). Gaya ng isang punong-abalang tumatanggap ng panauhin, naghahanda ang Panginoon ng hapag para kay David. Ang langis at umaapaw na saro ay may galak ng punong-abalang tumatanggap ng marangal na panauhin. Ngunit tingnan kung saan inihanda ang hapag na ito: <mark>naroon pa rin ang mga kaaway na nagbabanta kay David</mark>. Inihahanda ng Panginoon ang upuan ni David sa mismong harap ng kanilang mga mata.", "Sa Awit 22, may mga tao ring nakatitig sa nagdurusa. Tinuya nila siya, na kung talagang kinalulugdan siya ng Diyos, iligtas Niya siya. Sa Awit 23, ang nakikita ng mga kaaway ay <mark>ang pagpaparangal ng Diyos kay David bilang Kanyang panauhin</mark>. Sa mga araw na lumiliit ang iyong puso dahil sa salita ng mga tao, alalahanin ang hapag na ito. Makikita mo kung gaano ka kahalaga sa Diyos sa hapag na inihanda Niya para sa iyo.", "<mark>\"Tiyak na ang kabutihan at awa ay susunod sa akin sa lahat ng araw ng aking buhay, at ako'y mananahan sa bahay ng PANGINOON magpakailanman\"</mark> (t.6). Ang salitang 'susunod' ay may kahulugang mahigpit na paghabol. Dahil kababanggit lamang ng mga kaaway, maaaring isipin natin kung sino ang humahabol kay David—ngunit ang sagot ni David ay <mark>ang kabutihan at tapat na pag-ibig ng Panginoon</mark>. Ang tapat na pag-ibig ay ang Kanyang di-nagbabagong pag-ibig na nagmamahal sa Kanyang bayan hanggang sa wakas. Sa huli, tumitingin si David sa bahay ng Siyang naghanda ng hapag. Gaya ng isang hapag na kahit tapos na ang pagkain ay nais pa nating manatili nang kaunti kasama ang taong tumanggap sa atin, hinahangad ni David na manatili sa tabi Niya sa pagsamba sa buong buhay niya."], "points": ["Sa mga araw na lumiliit ako dahil sa salita ng tao, naaalala ko ba ang hapag na inihanda ng Panginoon dahil mahalaga ako sa Kanya?"]}, {"title": "Pagsasabuhay · Ang Mabuting Pastol na Nag-aalaga sa Akin sa Unahan, sa Tabi, at sa Likuran", "paragraphs": ["Kapag hindi natin alam ang daan, <mark>gumagabay ang Panginoon mula sa unahan</mark>. Sa libis, <mark>Siya ay nasa ating tabi</mark>. Kapag tumitingin tayo sa mga araw na darating, <mark>sumusunod sa likuran</mark> ang Kanyang pag-ibig. Kahit sa mga araw na ang aking mga mata ay buong nakatuon sa aking mga kaaway, inaalagaan ng Panginoon ang landas sa aking unahan, sa aking tabi, at sa aking likuran.", "Sa Marcos 6, sinabi ni Jesus sa Kanyang mga alagad, na napakaabala sa pag-aalaga sa mga tao kaya wala man lang silang panahong kumain, <mark>\"Halikayo sa isang ilang na lugar at magpahinga nang kaunti\"</mark> (Marcos 6:31). Nahabag din Siya sa karamihan, na gaya ng mga tupang walang pastol, at tinuruan sila. Nang gumabi na, pinaupo sila ni Jesus sa luntiang damo, pinagputul-putol ang tinapay at ipinamahagi, at kumain ang lahat at nabusog. Alam Niya kung gaano kapagod ang Kanyang mga alagad, at alam Niyang kailangan ng karamihan ng isang kainan.", "Ang Jesus na nagpakain sa mga tao nang ganito ay nag-alay ng Kanyang buhay para sa atin sa krus at muling nabuhay. <mark>Si Jesus, ang Mabuting Pastol</mark>, ay nagbibigay ng buhay na walang hanggan sa Kanyang mga tupa at iniingatan sila sa Kanyang sariling kamay (Juan 10:11, 28). Ang Jesus na ito ang Siyang mapagkakatiwalaan natin ng ating buhay, kahit sa mga araw na tayo'y natatakot.", "Ano ang pinakamatagal mong hinihintay sa mga araw na ito? Bago matapos ang araw na ito, sabihin sa Panginoon ang isang bagay na iyon, kung ano ito: \"Panginoon, hindi ko pa rin makita ang daan, at natatakot ako. Naniniwala akong lumalakad Ka kasama ko. <mark>Ipakita Mo sa akin ang tamang landas na dapat kong lakaran ngayon.</mark>\""], "points": ["Kahit hindi ko makita ang daan, magtitiwala ako sa Mabuting Pastol na nag-aalaga sa akin sa unahan, sa tabi, at sa likuran, at hahakbang ako ngayon."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Hindi ko agad inakalang iniwan ako ng Diyos dahil lamang humirap ang mga bagay."}, {"key": "c2", "text": "Kahit habang nag-aalaga sa iba, umasa ako sa Panginoon at nagtanong sa Kanya ng daan."}, {"key": "c3", "text": "Nang kailangan kong magpahinga, nagpahinga ako sa pag-aalaga ng Panginoon nang walang pagkakonsensya."}, {"key": "c4", "text": "Kahit sa gitna ng libis, tapat kong sinabi sa Panginoon ang aking mga takot."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Ano ang pinakamatagal kong hinihintay sa mga araw na ito, at paano ko ito sasabihin sa Panginoon?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Sabihin Kung Ano Ito", "value": "Dalhin sa Panginoon ang isang matagal nang hinihintay, kung ano ito: \"Panginoon, hindi ko makita ang daan, at natatakot ako\""}, {"key": "act2", "label": "Magpahinga", "value": "Tumigil sa trabaho kahit sandali ngayon at maglaan ng oras upang magpahinga sa Panginoon"}, {"key": "act3", "label": "Panatilihin ang Tamang Hakbang", "value": "Kahit may kapalit, tuparin ang isang pangako o gawin ang isang paghingi ng tawad na kailangan ngayon"}, {"key": "act4", "label": "Alalahanin ang Hapag", "value": "Kapag lumiliit ka dahil sa salita ng tao, alalahanin ang pag-ibig ng Panginoon na nagpapahalaga sa iyo at isulat ang iyong pasasalamat"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang Awit 23:4 at umasa sa Panginoong kasama mo kahit sa madilim na libis"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Jesus, aking Mabuting Pastol, sa pagpapahiga sa akin sa luntiang pastulan kapag ako'y pagod, sa pananatili sa aking tabi sa madilim na libis, at sa paghahanda ng hapag sa harap ng aking mga kaaway."}, {"key": "p2", "tag": "Pagsisisi", "text": "Pinagsisisihan ko ang pag-aakalang iniwan Mo ako kapag humirap ang mga bagay, ang paglimot na magtanong sa Iyo ng daan habang nag-aalaga sa iba, at ang pagturing sa pahinga bilang pag-aaksaya ng oras."}, {"key": "p3", "tag": "Kahilingan", "text": "Tulungan Mo akong magtiwala na lumalakad Ka kasama ko kahit hindi ko makita ang daan; ipakita Mo ang tamang landas na lalakaran ko ngayon, at hayaan Mong manatili ako sa Iyong tabi sa buong buhay ko."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};

  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
