<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>만나 큐티</title>

<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "10월 9일 금요일", "ref": "사사기 19장 22–30절", "headline": "내가 옳다고 생각할 때<br>누가 희생되고 있습니까?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 사사기 19:22-30", "s1heading": "오늘의 말씀", "verse": "\"인자가 온 것은 섬김을 받으려 함이 아니라<br>도리어 섬기려 하고<br>자기 목숨을 많은 사람의 대속물로 주려 함이니라\"", "verseRef": "마가복음 10:45", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 소돔이 아니라 기브아에서 — 이스라엘이 가나안이 되었습니다", "paragraphs": ["앞선 본문은 평화롭게 끝났습니다. 에브라임 출신 노인이 나그네를 집으로 영접하고, 나귀에게 먹이를 주고, 발을 씻기고, 함께 먹고 마셨습니다. 이제 안전해진 것처럼 보였습니다. 그런데 22절이 시작되자 모든 것이 무너집니다. 오늘 본문은 <mark>성경 안에서도 매우 참혹한 본문</mark>입니다. 본문 자체도 그 일을 길게 묘사하지 않기에, 우리도 조심스럽고 무거운 마음으로 읽어야 합니다.", "이 장면은 창세기 19장 소돔 이야기를 떠올리게 합니다. 손님을 폭행하려던 소돔 사람들, 그리고 그들을 막겠다며 딸들을 내놓으려 했던 롯. 그런데 창세기 19장은 소돔이고, 사사기 19장은 이스라엘의 기브아입니다. 이것이 충격입니다. <mark>가나안이 이스라엘을 공격하는 것이 아니라, 이스라엘이 가나안이 되어 버렸습니다</mark>.", "왜 그렇게 되었습니까? 말씀의 기준을 잃고 <mark>사람마다 자기 소견에 옳은 대로</mark> 살았기 때문입니다. 기브아 사람들은 자기 욕망대로, 노인은 자기가 보기에 덜 나쁜 방법대로, 레위인은 자기 목숨을 지키기 위해 행동합니다. 행동은 다르지만 뿌리는 같습니다. 하나님 보시기에 무엇이 옳은가가 아니라 내 눈에 무엇이 옳아 보이는가가 기준이 되었고, 그 결과 가장 약한 사람이 철저히 희생되었습니다."], "points": ["내 삶의 기준은 정말 하나님의 말씀입니까? 아니면 내 필요와 판단과 이익이 말씀보다 앞서고 있습니까?"]}, {"title": "22–24절 · 한 악을 막으려고 또 다른 악을 택한 노인", "paragraphs": ["기브아의 악한 사람들이 집을 에워싸고 문을 두드리며 손님을 내놓으라고 요구합니다. 본문은 그들을 <mark>'벨리알의 아들들(불량배)'</mark>이라 부릅니다. 단순히 무례한 사람이 아니라 도덕적으로 타락하고 폭력적인 자들을 가리키는 강한 표현입니다. 그들의 요구는 집단 성폭력으로 한 사람을 굴복시키고 모욕하려는 폭력이었습니다. 거기에는 타인을 지배하려는 욕망, 환대의 파괴, 약자에 대한 폭력, 하나님의 기준을 거부한 인간의 욕망이 함께 뒤섞여 있습니다.", "사사기 앞부분에서는 모압, 미디안, 블레셋이 적이었습니다. 그러나 마지막에는 <mark>이스라엘 안에서 자라난 죄가 이스라엘을 무너뜨립니다</mark>. 하나님의 백성을 가장 깊이 무너뜨리는 것은 밖에서 오는 공격만이 아니라 안에서 자라는 죄일 수 있습니다.", "노인은 밖으로 나가 말합니다. <mark>\"내 형제들아, 청하건대 이같은 악을 행하지 말라\"</mark>. 그가 쓴 말(네발라)은 단순한 실수가 아니라 도덕적으로 수치스럽고 끔찍한 행동을 가리킵니다. 여기까지는 옳았습니다. 그런데 바로 다음 말이 문제입니다. 그는 자기 딸과 레위인의 첩을 대신 내주겠다며 <mark>\"너희 눈에 좋은 대로 행하라\"</mark>고 말합니다. 사사기 전체의 \"자기 소견에 옳은 대로\"와 그대로 이어지는 말입니다.", "노인은 악을 악이라고 알아보았지만, 무엇이 선인지는 잃어버렸습니다. 남자 손님은 보호해야 하지만 힘없는 여성들은 희생시켜도 된다고 생각했습니다. 앞에서 가장 좋은 인물처럼 보였던 그도 위기 앞에서 진짜 기준이 드러납니다. <mark>사람의 가치를 동등하게 보지 않은 것</mark>입니다."], "points": ["한 악을 막기 위해 다른 악을 선택한다고 그것이 의가 되지는 않습니다. 하나님의 기준을 잃으면 '덜 나쁜 악'을 선이라고 착각할 수 있습니다."]}, {"title": "25–26절 · \"그녀의 마음에 말하려\" 왔던 사람이 그녀를 내보냈습니다", "paragraphs": ["기브아 사람들은 자기 욕망대로, 노인은 자기 판단대로, 레위인은 자기 생존을 위해 움직입니다. 모두 달라 보이지만 공통점이 하나 있습니다. <mark>하나님의 뜻을 묻는 사람이 아무도 없습니다</mark>. 그래서 결국 누가 희생됩니까? 가장 힘없는 사람입니다. 자기 소견이 왕이 되는 공동체에서는 힘없는 사람이 가장 먼저 대가를 치릅니다.", "25절은 너무나 충격적입니다. <mark>\"그 사람이 자기 첩을 붙잡아 그들에게 밖으로 끌어내매\"</mark>. 문맥상 레위인이 자기 첩을 내준 것으로 읽는 것이 자연스럽습니다. 19장 3절을 기억하십시오. 그는 그녀의 마음에 말하고 데려오려고 베들레헴까지 찾아갔습니다. 처음에는 '당신을 되찾으러 왔습니다'였는데, 결국 '나를 살리기 위해 당신을 내어줍니다'로 변했습니다. <mark>사랑한다고 말하는 것과 위험 앞에서 그 사람을 지켜 주는 것은 다릅니다</mark>.", "그 밤 여인은 폭력의 희생자가 됩니다. 본문은 그 내용을 길게 묘사하지 않고 짧고 냉정하게 기록합니다. 새벽이 되자 그녀는 그 집으로 돌아와 <mark>문 앞에 손을 문지방에 얹은 채 쓰러집니다</mark>. 자신을 보호해야 할 사람들이 있는 집이었지만, 그녀는 문 밖에 있었습니다.", "죄의 가장 무서운 모습 중 하나는 사람을 인격이 아니라 수단으로 보는 것입니다. 기브아 사람들에게 레위인은 욕망의 대상, 노인에게 두 여성은 문제 해결의 대안, 레위인에게 첩은 자기 목숨을 살리기 위한 희생물이었습니다. <mark>사람을 사랑하지 않고 이용하기 시작하는 순간, 우리는 이미 하나님 나라의 방식에서 멀어지고 있습니다</mark>."], "points": ["나는 사랑한다고 말하는 사람을 정작 위기의 순간에 지켜 주고 있습니까, 아니면 나를 지키기 위해 그를 내어 주고 있습니까?"]}, {"title": "27–30절 · 살아서도 죽어서도 도구가 된 여인, 악을 알아보고도", "paragraphs": ["아침이 되자 레위인은 일어나 문을 열고 자기 길을 가려 합니다. 밤새 그녀를 찾았다거나, 울었다거나, 기도했다는 기록은 없습니다. 문 앞에 쓰러진 여인을 보고 그는 말합니다. <mark>\"일어나라 우리가 떠나가자\"</mark>. 너무나 차가운 말입니다. 그녀의 마음에 말하려고 베들레헴까지 갔던 그가, 정작 가장 큰 위로가 필요한 순간에는 아무 위로도 없습니다. 본문은 짧게 말합니다. <mark>\"아무 대답이 없는지라\"</mark>. 본문은 이때 그녀가 이미 숨졌는지 명시하지 않습니다. 그 불확실성이 이후 그의 행동을 더 섬뜩하게 만듭니다.", "레위인은 집에 도착한 뒤 여인의 몸을 열두 부분으로 나누어 이스라엘 사방에 보냅니다. 고대 세계에서 이런 행위는 사람들을 소집하는 강력한 경고 신호였을 수 있습니다. 사무엘상 11장에서 사울도 소를 각 떠서 보냅니다. 그러나 차이가 큽니다. 사울에게는 <mark>\"하나님의 영이 크게 임하매\"</mark>라는 언급이 있고 그가 나눈 것은 소였습니다. 여기에는 하나님의 명령이나 성령의 역사에 대한 언급이 없고, 레위인은 한 사람의 몸을 사용합니다.", "그녀는 처음에는 이름 없는 여인이었고, 다음에는 목소리를 잃었고, 그다음에는 희생물이 되었고, 마지막에는 메시지가 되었습니다. <mark>죄는 사람을 하나님의 형상을 지닌 존재가 아니라 내 욕망, 내 안전, 내 목적을 위한 도구로 바꾸어 버립니다</mark>.", "이스라엘 사람들은 충격을 받습니다. <mark>\"이스라엘 자손이 애굽 땅에서 올라온 날부터 오늘까지 이런 일은 일어나지도 아니하였고 보지도 못하였도다\"</mark>. 드디어 이스라엘이 '이건 잘못됐다'고 말합니다. 그런데 20–21장에서 그들은 이 악을 바로잡으려다 또다시 엄청난 폭력을 만들어 냅니다. 사사기의 문제는 악을 모른다는 것만이 아니라, <mark>악을 알아보고도 하나님의 방법이 아니라 자기 방식으로 해결하려 한다</mark>는 데 있습니다."], "points": ["옳은 목적만으로는 충분하지 않습니다. 방법도 하나님의 말씀 아래 있어야 합니다. 말씀의 기준을 잃으면 악을 해결하는 방법까지 또 다른 악이 될 수 있습니다."]}, {"title": "적용 · 너를 희생시켜 나를 살리는 힘, 나를 내어주어 너를 살리는 힘", "paragraphs": ["오늘 본문에서 가장 두려운 것은 기브아 사람들의 끔찍한 범죄만이 아닙니다. 모두가 자기 눈에 옳은 대로 행동했다는 것입니다. 힘을 가진 사람이 자신을 보호하기 위해 힘없는 사람을 내어 주었습니다. <mark>자기 소견이 왕이 되면 결국 약한 사람이 희생됩니다</mark>. 우리도 말씀의 기준을 잃으면 다르지 않을 수 있습니다.", "교회에서도, 가정에서도, 직장에서도 내가 가진 자리와 권한과 말의 힘으로 누군가에게 희생을 요구할 수 있습니다. 그리고 그것을 '어쩔 수 없었다', '더 큰 일을 위해 필요했다', '이 방법이 그나마 낫다'고 정당화할 수 있습니다.", "그러나 하나님 나라의 힘은 전혀 다릅니다. 예수님은 말씀하셨습니다. <mark>\"인자가 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이니라\"</mark>. 사사기 19장에서는 힘 있는 사람이 약한 사람을 희생시켜 자기를 살립니다. 예수님은 반대로 자기 생명을 내어 주셔서 약한 우리를 살리셨습니다. 세상의 힘은 말합니다. <mark>\"너를 희생시켜서 나를 살리겠다.\"</mark> 예수님의 힘은 말합니다. <mark>\"내가 나를 내어주어 너를 살리겠다.\"</mark>", "사사기의 사람들은 모두 자기 눈에 옳은 것을 선택했습니다. 예수님은 자신의 뜻이 아니라 아버지의 뜻에 순종하셨고, 그 순종으로 다른 사람을 희생시키지 않고 자신을 내어 주셨습니다. 말씀의 기준을 붙드는 사람은 <mark>힘없는 사람을 희생시키는 사람이 아니라 보호하는 사람</mark>입니다."], "points": ["내가 가진 힘 때문에 누군가가 희생되고 있지는 않습니까? 더 강한 위치에 있다는 이유로 누군가에게 계속 양보와 희생만 요구하고 있지는 않습니까? 내가 옳다고 생각하는 그 판단은 말씀 앞에서도 옳습니까?"]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "내가 옳다고 여기는 판단이 하나님의 말씀 앞에서도 옳은지, 아니면 내 눈에만 옳아 보이는지 점검했다"}, {"key": "c2", "text": "가정·교회·직장에서 내 자리나 권한 때문에 누군가에게 양보와 희생만 요구하고 있지 않은지 돌아봤다"}, {"key": "c3", "text": "'어쩔 수 없었다', '그나마 낫다'는 말로 덜 나쁜 악을 정당화한 적은 없는지 점검했다"}, {"key": "c4", "text": "사람을 인격이 아니라 내 목적을 위한 수단처럼 대하고 있지는 않은지 돌아봤다"}], "s4heading": "묵상 한 줄", "memoHint": "내가 옳다고 생각하며 밀어붙일 때, 내 곁에서 조용히 희생되고 있는 사람은 누구입니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "내 기준 점검", "value": "오늘 내리는 결정 하나를 놓고 '내 눈에 옳은가, 말씀 앞에 옳은가'를 먼저 기도로 묻기"}, {"key": "act2", "label": "희생 요구 멈추기", "value": "내가 계속 양보를 요구해 온 한 사람에게 이번에는 내가 먼저 양보하기"}, {"key": "act3", "label": "약한 사람 지키기", "value": "공동체나 일터에서 목소리 없는 한 사람의 편에 서서 그를 보호하는 말이나 행동 하기"}, {"key": "act4", "label": "방법도 말씀대로", "value": "옳은 목적을 위해 쓰고 있던 옳지 않은 방법 하나를 찾아 내려놓기"}, {"key": "act5", "label": "섬김의 힘", "value": "마가복음 10:45를 외우며, 오늘 한 사람을 위해 내 시간이나 편의를 내어 주기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "우리를 희생시켜 자신을 살리지 않으시고, 자기 생명을 내어 주셔서 약한 우리를 살리신 예수님께 감사합니다"}, {"key": "p2", "tag": "회개", "text": "내 눈에 옳은 대로 판단하며, 내 자리와 힘으로 약한 사람에게 희생을 요구하고 그것을 정당화했던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "목적뿐 아니라 방법까지 말씀 아래 두게 하시고, 힘없는 사람을 희생시키는 사람이 아니라 보호하는 사람으로 예수님의 길을 따르게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "October 9, Friday", "ref": "Judges 19:22–30", "headline": "When I Think I'm Right,<br>Who Is Being Sacrificed?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · Judges 19:22-30", "s1heading": "Today's Word", "verse": "\"For even the Son of Man came not to be served<br>but to serve,<br>and to give His life as a ransom for many.\"", "verseRef": "Mark 10:45", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · Not in Sodom, but in Gibeah — Israel Had Become Canaan", "paragraphs": ["The previous passage ended peacefully. The old man from Ephraim welcomed the travelers into his home, fed the donkeys, had them wash their feet, and they ate and drank together. It seemed they were safe. But as verse 22 begins, everything collapses. Today's passage is <mark>one of the most harrowing texts in all of Scripture</mark>. The text itself does not describe the events at length, so we too should read it carefully and with a heavy heart.", "This scene recalls the story of Sodom in Genesis 19 — the men of Sodom seeking to assault the guests, and Lot offering his daughters to stop them. But Genesis 19 is Sodom; Judges 19 is Gibeah of Israel. That's the shock. <mark>Canaan isn't attacking Israel — Israel has become Canaan.</mark>", "Why? Because they lost the standard of God's Word and <mark>everyone did what was right in his own eyes</mark>. The men of Gibeah act on their desires; the old man chooses what seems the lesser evil to him; the Levite acts to save his own life. Their actions differ, but the root is the same. The standard became not what is right in God's sight but what looks right in my eyes — and the result was that the weakest person was utterly sacrificed."], "points": ["Is God's Word truly the standard of my life? Or do my needs, judgments, and interests come before the Word?"]}, {"title": "Verses 22–24 · An Old Man Who Chose One Evil to Stop Another", "paragraphs": ["Wicked men of Gibeah surround the house, pound on the door, and demand the guest be brought out. The text calls them <mark>'sons of Belial' (worthless men)</mark> — not merely rude people, but a strong expression for the morally corrupt and violent. Their demand was violence meant to subdue and humiliate a person through group sexual assault. Mixed together in it are the desire to dominate others, the destruction of hospitality, violence against the vulnerable, and human desire that rejects God's standard.", "Earlier in Judges, the enemies were Moab, Midian, and the Philistines. But at the end, <mark>sin grown up within Israel is what brings Israel down</mark>. What most deeply destroys God's people may be not only attacks from outside, but sin growing within.", "The old man goes out and says, <mark>\"No, my brothers, do not act so wickedly.\"</mark> The word he uses (nebalah) refers not to a simple mistake but to a morally shameful, outrageous act. So far, he was right. But his very next words are the problem. He offers his own daughter and the Levite's concubine instead and says, <mark>\"Do with them what seems good to you.\"</mark> These words echo the refrain of the whole book: \"what was right in his own eyes.\"", "The old man recognized evil as evil, but he had lost sight of what is good. He thought the male guest must be protected, but powerless women could be sacrificed. Though he seemed the best character earlier, in a crisis his true standard is revealed: <mark>he did not see people as equal in worth</mark>."], "points": ["Choosing one evil to prevent another doesn't make it righteous. When we lose God's standard, we can mistake 'the lesser evil' for good."]}, {"title": "Verses 25–26 · The Man Who Came \"to Speak to Her Heart\" Pushed Her Out", "paragraphs": ["The men of Gibeah act on their desires, the old man on his own judgment, the Levite for his own survival. They look different, but they share one thing: <mark>no one asks for God's will</mark>. So who is sacrificed in the end? The most powerless person. In a community where one's own opinion is king, the powerless pay the price first.", "Verse 25 is deeply shocking: <mark>\"So the man seized his concubine and made her go out to them.\"</mark> In context, it's most natural to read this as the Levite handing her over. Remember 19:3 — he went all the way to Bethlehem to speak to her heart and bring her back. It began as 'I've come to win you back,' and became 'I'll give you up to save myself.' <mark>Saying you love someone and protecting them in the face of danger are not the same.</mark>", "That night the woman became a victim of violence. The text doesn't describe it at length; it records it briefly and starkly. At dawn she came back to the house and <mark>fell down at the door, her hands on the threshold</mark>. It was the house of those who should have protected her — but she was outside the door.", "One of sin's most frightening forms is seeing people not as persons but as means. To the men of Gibeah, the Levite was an object of desire; to the old man, the two women were an option for solving a problem; to the Levite, his concubine was a sacrifice to save his own life. <mark>The moment we stop loving people and start using them, we are already drifting from the way of God's kingdom.</mark>"], "points": ["Do I actually protect the people I say I love when a crisis comes — or do I give them up to protect myself?"]}, {"title": "Verses 27–30 · A Woman Used in Life and in Death — and Evil Recognized, Yet…", "paragraphs": ["In the morning, the Levite rises, opens the door, and prepares to go on his way. There's no record that he searched for her all night, wept, or prayed. Seeing her collapsed at the door, he says, <mark>\"Get up, let us be going.\"</mark> Such cold words. He had gone to Bethlehem to speak to her heart, yet at the moment she most needed comfort, there is none. The text says briefly, <mark>\"But there was no answer.\"</mark> The text doesn't state whether she had already died at that moment, and that uncertainty makes his next actions all the more chilling.", "Once home, the Levite divides the woman's body into twelve pieces and sends them throughout Israel. In the ancient world, such an act could serve as a powerful summons and warning. In 1 Samuel 11, Saul also cuts up oxen and sends the pieces out. But the difference is great: with Saul, Scripture says <mark>\"the Spirit of God rushed upon him,\"</mark> and what he divided were oxen. Here there's no mention of God's command or the Spirit's work, and the Levite uses a human being's body.", "She was first a nameless woman, then lost her voice, then became a sacrifice, and finally became a message. <mark>Sin turns people from bearers of God's image into tools for my desires, my safety, my goals.</mark>", "The Israelites are shocked: <mark>\"Such a thing has never happened or been seen from the day that the people of Israel came up out of the land of Egypt until this day.\"</mark> At last Israel says, 'This is wrong.' But in chapters 20–21, while trying to correct this evil, they produce enormous violence once again. The problem in Judges isn't only ignorance of evil, but that <mark>even after recognizing evil, they try to resolve it their own way rather than God's way</mark>."], "points": ["A right purpose alone is not enough; our methods must also be under God's Word. When we lose the Word's standard, even our way of fixing evil can become another evil."]}, {"title": "Application · Power That Sacrifices You to Save Me — or Gives Itself to Save You", "paragraphs": ["The most frightening thing in today's passage isn't only the horrific crime of the men of Gibeah. It's that everyone acted according to what was right in their own eyes. Those with power handed over the powerless to protect themselves. <mark>When one's own opinion becomes king, the weak end up being sacrificed.</mark> If we lose the standard of the Word, we may be no different.", "In church, at home, and at work, we can use our position, authority, and the power of our words to demand sacrifice from someone. And we can justify it: 'It couldn't be helped,' 'It was necessary for something greater,' 'This way is at least better.'", "But the power of God's kingdom is entirely different. Jesus said, <mark>\"The Son of Man came not to be served but to serve, and to give His life as a ransom for many.\"</mark> In Judges 19, the powerful sacrifice the weak to save themselves. Jesus did the opposite — He gave His own life to save us, the weak. The world's power says, <mark>\"I'll save myself by sacrificing you.\"</mark> Jesus' power says, <mark>\"I'll give Myself to save you.\"</mark>", "The people in Judges all chose what was right in their own eyes. Jesus obeyed not His own will but the Father's, and through that obedience He sacrificed not others, but Himself. Those who hold fast to the Word's standard are <mark>not people who sacrifice the powerless, but people who protect them</mark>."], "points": ["Is someone being sacrificed because of the power I hold? Because I'm in a stronger position, am I constantly demanding that someone yield and sacrifice? Is the judgment I think is right also right before the Word?"]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I checked whether the judgments I think are right are also right before God's Word, or only right in my own eyes."}, {"key": "c2", "text": "I reflected on whether, at home, church, or work, I'm demanding only concessions and sacrifice from someone because of my position or authority."}, {"key": "c3", "text": "I checked whether I've justified a 'lesser evil' with words like 'it couldn't be helped' or 'it's better than the alternative.'"}, {"key": "c4", "text": "I reflected on whether I'm treating people not as persons but as means to my goals."}], "s4heading": "One-Line Reflection", "memoHint": "When I push ahead thinking I'm right, who beside me is quietly being sacrificed?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Check Your Standard", "value": "For one decision today, first ask in prayer: 'Is this right in my eyes, or right before the Word?'"}, {"key": "act2", "label": "Stop Demanding Sacrifice", "value": "Toward someone you've kept asking to yield, be the one who yields first this time"}, {"key": "act3", "label": "Protect the Vulnerable", "value": "In your community or workplace, stand with someone who has no voice and speak or act to protect them"}, {"key": "act4", "label": "Methods Under the Word Too", "value": "Find one wrong method you've been using for a right goal, and lay it down"}, {"key": "act5", "label": "The Power of Serving", "value": "Memorize Mark 10:45 and give up some of your time or comfort for one person today"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, Jesus, that You did not sacrifice us to save Yourself, but gave Your own life to save us, the weak."}, {"key": "p2", "tag": "Repent", "text": "I repent of judging by what is right in my own eyes, and of using my position and power to demand sacrifice from the weak and justifying it."}, {"key": "p3", "tag": "Ask", "text": "Help me place not only my goals but also my methods under Your Word, and follow the way of Jesus as one who protects the powerless rather than sacrificing them."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Oktubre 9, Biyernes", "ref": "Mga Hukom 19:22–30", "headline": "Kapag Akala Ko'y Tama Ako,<br>Sino ang Isinasakripisyo?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Mga Hukom 19:22-30", "s1heading": "Salita Ngayon", "verse": "\"Sapagkat ang Anak ng Tao ay hindi pumarito upang paglingkuran,<br>kundi upang maglingkod,<br>at ibigay ang Kanyang buhay bilang pantubos sa marami.\"", "verseRef": "Marcos 10:45", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Hindi sa Sodoma, Kundi sa Gibea — Naging Canaan ang Israel", "paragraphs": ["Payapang nagtapos ang nakaraang bahagi. Tinanggap ng matandang taga-Efraim ang mga manlalakbay sa kanyang bahay, pinakain ang mga asno, pinahugasan ang kanilang mga paa, at sabay silang kumain at uminom. Mukhang ligtas na sila. Ngunit pagsimula ng talata 22, gumuho ang lahat. Ang talata ngayon ay <mark>isa sa pinakamasakit na bahagi sa buong Kasulatan</mark>. Hindi rin ito inilarawan nang mahaba ng teksto, kaya dapat din nating basahin ito nang maingat at may mabigat na puso.", "Ipinapaalala ng eksenang ito ang kwento ng Sodoma sa Genesis 19 — ang mga taga-Sodoma na gustong saktan ang mga panauhin, at si Lot na nag-alok ng kanyang mga anak na babae upang pigilan sila. Ngunit ang Genesis 19 ay Sodoma; ang Mga Hukom 19 ay Gibea ng Israel. Iyan ang nakagugulat. <mark>Hindi ang Canaan ang sumasalakay sa Israel — ang Israel mismo ang naging Canaan.</mark>", "Bakit? Dahil nawala sa kanila ang pamantayan ng Salita ng Diyos at <mark>ginawa ng bawat isa ang tama sa kanyang sariling paningin</mark>. Kumilos ang mga taga-Gibea ayon sa kanilang pagnanasa; pinili ng matanda ang sa tingin niya'y mas maliit na kasamaan; kumilos ang Levita upang iligtas ang sariling buhay. Magkakaiba ang kanilang ginawa, ngunit iisa ang ugat. Ang naging pamantayan ay hindi kung ano ang tama sa paningin ng Diyos kundi kung ano ang mukhang tama sa aking paningin — at ang bunga ay lubusang naisakripisyo ang pinakamahina."], "points": ["Tunay bang ang Salita ng Diyos ang pamantayan ng aking buhay? O inuuna ko ang aking pangangailangan, paghatol, at interes kaysa sa Salita?"]}, {"title": "Talata 22–24 · Isang Matandang Pumili ng Isang Kasamaan upang Pigilan ang Isa Pa", "paragraphs": ["Pinalibutan ng masasamang tao ng Gibea ang bahay, kinatok nang malakas ang pinto, at hiniling na ilabas ang panauhin. Tinawag sila ng teksto na <mark>'mga anak ni Belial' (mga walang-kwentang tao)</mark> — hindi lamang bastos, kundi matinding pananalita para sa mga tiwali at marahas. Ang kanilang hinihingi ay karahasang naglalayong supilin at hiyain ang isang tao sa pamamagitan ng sama-samang sekswal na karahasan. Halo-halo rito ang pagnanasang mangibabaw sa iba, ang pagsira sa pagkamapagpatuloy, ang karahasan laban sa mahihina, at ang pagnanasa ng taong tumanggi sa pamantayan ng Diyos.", "Noong una sa Mga Hukom, ang mga kaaway ay Moab, Midian, at mga Filisteo. Ngunit sa huli, <mark>ang kasalanang lumaki sa loob ng Israel ang nagpabagsak sa Israel</mark>. Ang pinakamalalim na sumisira sa bayan ng Diyos ay maaaring hindi lamang pag-atake mula sa labas, kundi kasalanang lumalaki sa loob.", "Lumabas ang matanda at nagsabi, <mark>\"Huwag, mga kapatid ko, huwag kayong gumawa ng ganitong kasamaan.\"</mark> Ang salitang ginamit niya (nebalah) ay hindi tumutukoy sa simpleng pagkakamali kundi sa nakahihiya at kakila-kilabot na gawa. Hanggang dito, tama siya. Ngunit ang kasunod niyang sinabi ang problema. Inalok niya ang sarili niyang anak na babae at ang babae ng Levita bilang kapalit at sinabi, <mark>\"Gawin ninyo sa kanila ang mabuti sa inyong paningin.\"</mark> Umaalingawngaw ito sa paulit-ulit na linya ng buong aklat: \"ang tama sa kanyang sariling paningin.\"", "Nakilala ng matanda ang kasamaan bilang kasamaan, ngunit nawala sa kanya kung ano ang mabuti. Inisip niyang dapat protektahan ang lalaking panauhin, ngunit maaaring isakripisyo ang mga babaeng walang kapangyarihan. Bagaman siya ang mukhang pinakamabuting tauhan kanina, sa harap ng krisis ay nahayag ang tunay niyang pamantayan: <mark>hindi niya nakita ang tao bilang may pantay na halaga</mark>."], "points": ["Ang pagpili ng isang kasamaan upang pigilan ang isa pa ay hindi nagiging katuwiran. Kapag nawala ang pamantayan ng Diyos, maaari nating mapagkamalang mabuti ang 'mas maliit na kasamaan.'"]}, {"title": "Talata 25–26 · Ang Lalaking Dumating \"upang Magsalita sa Kanyang Puso\" ang Nagtulak sa Kanya Palabas", "paragraphs": ["Kumilos ang mga taga-Gibea ayon sa kanilang pagnanasa, ang matanda ayon sa sarili niyang paghatol, ang Levita para sa sariling kaligtasan. Mukhang magkakaiba, ngunit may iisang pagkakapareho: <mark>walang nagtanong ng kalooban ng Diyos</mark>. Kaya sino ang naisakripisyo sa huli? Ang pinakawalang-kapangyarihan. Sa komunidad kung saan hari ang sariling opinyon, ang mahihina ang unang nagbabayad.", "Lubhang nakagugulat ang talata 25: <mark>\"Kaya hinawakan ng lalaki ang kanyang babae at inilabas siya sa kanila.\"</mark> Sa konteksto, pinakanatural na basahin ito na ang Levita ang nagbigay sa kanya. Alalahanin ang 19:3 — pumunta siya hanggang Betlehem upang magsalita sa kanyang puso at ibalik siya. Nagsimula ito bilang 'Dumating ako upang bawiin ka,' at naging 'Isusuko kita upang iligtas ang sarili ko.' <mark>Ang pagsasabing iniibig mo ang isang tao at ang pagprotekta sa kanya sa harap ng panganib ay hindi magkapareho.</mark>", "Nang gabing iyon, naging biktima ng karahasan ang babae. Hindi ito inilarawan nang mahaba ng teksto; maikli at malamig itong itinala. Pagbubukang-liwayway, bumalik siya sa bahay at <mark>bumagsak sa may pinto, nakapatong ang mga kamay sa pasukan</mark>. Iyon ang bahay ng mga dapat sanang nagprotekta sa kanya — ngunit nasa labas siya ng pinto.", "Isa sa pinakanakatatakot na anyo ng kasalanan ay ang pagtingin sa tao hindi bilang persona kundi bilang kasangkapan. Sa mga taga-Gibea, ang Levita ay bagay ng pagnanasa; sa matanda, ang dalawang babae ay opsyon upang lutasin ang problema; sa Levita, ang kanyang babae ay sakripisyo upang iligtas ang sariling buhay. <mark>Sa sandaling tumigil tayo sa pag-ibig sa tao at nagsimulang gamitin sila, lumalayo na tayo sa paraan ng kaharian ng Diyos.</mark>"], "points": ["Talaga bang pinoprotektahan ko ang mga taong sinasabi kong iniibig ko kapag dumating ang krisis — o isinusuko ko sila upang protektahan ang sarili ko?"]}, {"title": "Talata 27–30 · Isang Babaeng Ginamit Buhay man o Patay — at Kasamaang Nakilala, Ngunit…", "paragraphs": ["Kinaumagahan, bumangon ang Levita, binuksan ang pinto, at naghandang magpatuloy sa kanyang lakad. Walang tala na hinanap niya siya buong gabi, umiyak, o nanalangin. Nang makita siyang nakabulagta sa may pinto, sinabi niya, <mark>\"Bumangon ka, umalis na tayo.\"</mark> Napakalamig na mga salita. Pumunta siya sa Betlehem upang magsalita sa kanyang puso, ngunit sa sandaling pinakakailangan niya ng aliw, walang anuman. Maikling sinabi ng teksto, <mark>\"Ngunit walang sumagot.\"</mark> Hindi sinabi ng teksto kung patay na siya sa sandaling iyon, at ang kawalang-katiyakang iyon ang lalong nagpapakilabot sa mga susunod niyang ginawa.", "Pagdating sa bahay, hinati ng Levita ang katawan ng babae sa labindalawang bahagi at ipinadala sa buong Israel. Sa sinaunang mundo, maaaring isang malakas na panawagan at babala ang ganitong gawa. Sa 1 Samuel 11, pinagpira-piraso rin ni Saul ang mga baka at ipinadala. Ngunit malaki ang pagkakaiba: kay Saul, sinasabi ng Kasulatan na <mark>\"ang Espiritu ng Diyos ay makapangyarihang dumating sa kanya,\"</mark> at mga baka ang kanyang hinati. Dito, walang banggit ng utos ng Diyos o gawa ng Espiritu, at katawan ng isang tao ang ginamit ng Levita.", "Una siyang babaeng walang pangalan, pagkatapos ay nawalan ng tinig, pagkatapos ay naging sakripisyo, at sa huli ay naging mensahe. <mark>Ginagawa ng kasalanan ang tao — mula sa nagdadala ng larawan ng Diyos — na kasangkapan para sa aking pagnanasa, aking kaligtasan, aking layunin.</mark>", "Nagulantang ang mga Israelita: <mark>\"Hindi pa nangyari o nakita ang ganitong bagay mula nang umahon ang mga Israelita mula sa lupain ng Egipto hanggang sa araw na ito.\"</mark> Sa wakas, sinabi ng Israel, 'Mali ito.' Ngunit sa kabanata 20–21, habang sinusubukang ituwid ang kasamaang ito, muli silang lumikha ng napakalaking karahasan. Ang problema sa Mga Hukom ay hindi lamang kamangmangan sa kasamaan, kundi na <mark>kahit nakilala na ang kasamaan, sinusubukan nilang lutasin ito sa sarili nilang paraan sa halip na sa paraan ng Diyos</mark>."], "points": ["Hindi sapat ang tamang layunin lamang; dapat ding nasa ilalim ng Salita ng Diyos ang ating paraan. Kapag nawala ang pamantayan ng Salita, maging ang paraan natin ng paglutas sa kasamaan ay maaaring maging isa pang kasamaan."]}, {"title": "Aplikasyon · Kapangyarihang Nagsasakripisyo sa Iyo upang Iligtas Ako — o Nagbibigay ng Sarili upang Iligtas Ka", "paragraphs": ["Ang pinakanakatatakot sa talata ngayon ay hindi lamang ang kakila-kilabot na krimen ng mga taga-Gibea. Ito ay na kumilos ang lahat ayon sa tama sa kanilang sariling paningin. Isinuko ng may kapangyarihan ang walang kapangyarihan upang protektahan ang sarili. <mark>Kapag naging hari ang sariling opinyon, ang mahihina ang nauuwing isinasakripisyo.</mark> Kung mawawala sa atin ang pamantayan ng Salita, maaaring hindi tayo naiiba.", "Sa iglesia, sa tahanan, at sa trabaho, maaari nating gamitin ang ating posisyon, awtoridad, at kapangyarihan ng ating salita upang humingi ng sakripisyo sa isang tao. At maaari natin itong bigyang-katwiran: 'Wala nang magagawa,' 'Kailangan ito para sa mas malaking bagay,' 'Ito na ang mas mabuting paraan.'", "Ngunit lubos na naiiba ang kapangyarihan ng kaharian ng Diyos. Sinabi ni Jesus, <mark>\"Ang Anak ng Tao ay hindi pumarito upang paglingkuran, kundi upang maglingkod, at ibigay ang Kanyang buhay bilang pantubos sa marami.\"</mark> Sa Mga Hukom 19, isinasakripisyo ng makapangyarihan ang mahihina upang iligtas ang sarili. Ginawa ni Jesus ang kabaligtaran — ibinigay Niya ang sariling buhay upang iligtas tayo, ang mahihina. Sinasabi ng kapangyarihan ng mundo, <mark>\"Ililigtas ko ang sarili ko sa pagsasakripisyo sa iyo.\"</mark> Sinasabi ng kapangyarihan ni Jesus, <mark>\"Ibibigay Ko ang Aking sarili upang iligtas ka.\"</mark>", "Pinili ng lahat ng tao sa Mga Hukom ang tama sa kanilang sariling paningin. Sumunod si Jesus hindi sa sarili Niyang kalooban kundi sa kalooban ng Ama, at sa pagsunod na iyon ay hindi Niya isinakripisyo ang iba, kundi ang Kanyang sarili. Ang mga kumakapit sa pamantayan ng Salita ay <mark>hindi mga taong nagsasakripisyo sa walang kapangyarihan, kundi mga taong nagpoprotekta sa kanila</mark>."], "points": ["May isinasakripisyo ba dahil sa kapangyarihang hawak ko? Dahil nasa mas malakas akong posisyon, palagi ko bang hinihingan ang isang tao na magparaya at magsakripisyo? Ang paghatol bang inaakala kong tama ay tama rin sa harap ng Salita?"]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Sinuri ko kung ang mga paghatol na inaakala kong tama ay tama rin sa harap ng Salita ng Diyos, o tama lamang sa aking sariling paningin."}, {"key": "c2", "text": "Pinag-isipan ko kung, sa tahanan, iglesia, o trabaho, puro pagpaparaya at sakripisyo lamang ang hinihingi ko sa isang tao dahil sa aking posisyon o awtoridad."}, {"key": "c3", "text": "Sinuri ko kung binigyang-katwiran ko ang isang 'mas maliit na kasamaan' sa mga salitang tulad ng 'wala nang magagawa' o 'ito na ang mas mabuti.'"}, {"key": "c4", "text": "Pinag-isipan ko kung tinatrato ko ang tao hindi bilang persona kundi bilang kasangkapan para sa aking mga layunin."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Kapag nagpupumilit ako dahil akala ko'y tama ako, sino sa tabi ko ang tahimik na naisasakripisyo?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Suriin ang Iyong Pamantayan", "value": "Para sa isang desisyon ngayon, itanong muna sa panalangin: 'Tama ba ito sa aking paningin, o tama sa harap ng Salita?'"}, {"key": "act2", "label": "Itigil ang Paghingi ng Sakripisyo", "value": "Sa taong palagi mong hinihinging magparaya, ikaw naman ang unang magparaya ngayon"}, {"key": "act3", "label": "Protektahan ang Mahihina", "value": "Sa iyong komunidad o trabaho, pumanig sa isang walang tinig at magsalita o kumilos upang protektahan siya"}, {"key": "act4", "label": "Paraan Din ay Ayon sa Salita", "value": "Hanapin ang isang maling paraang ginagamit mo para sa tamang layunin, at bitawan ito"}, {"key": "act5", "label": "Ang Kapangyarihan ng Paglilingkod", "value": "Isaulo ang Marcos 10:45 at ibigay ang ilan sa iyong oras o ginhawa para sa isang tao ngayon"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Jesus, na hindi Mo kami isinakripisyo upang iligtas ang Iyong sarili, kundi ibinigay Mo ang sarili Mong buhay upang iligtas kami, ang mahihina."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa paghatol ayon sa tama sa aking sariling paningin, at sa paggamit ng aking posisyon at kapangyarihan upang humingi ng sakripisyo sa mahihina at bigyang-katwiran ito."}, {"key": "p3", "tag": "Kahilingan", "text": "Tulungan Mo akong ilagay hindi lamang ang aking mga layunin kundi pati ang aking mga paraan sa ilalim ng Iyong Salita, at sundan ang daan ni Jesus bilang isang nagpoprotekta sa walang kapangyarihan sa halip na nagsasakripisyo sa kanila."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
