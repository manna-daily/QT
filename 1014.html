<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>만나 큐티</title>
<meta property="og:title" content="10/14(수) 큐티 · 사사기 21:13–25">
<meta property="og:description" content="내 눈에 옳은 것이 정말 하나님 보시기에도 옳을까요?">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>
<div class="wrap">

<div class="top">
  <button class="bgm" id="bgm">🎵 <span id="bgmLabel">묵상 음악</span> <span class="bar"><i></i><i></i><i></i></span></button>
  <div class="topRight">
    <span class="langsw" id="langsw">
      <button data-lang="ko">한국어</button><button data-lang="en">English</button><button data-lang="tl">Tagalog</button>
    </span>
    <span class="fs"><span id="fontLabel">글자</span> <button data-f="f1"><b>가</b></button><button data-f="" class="on"><b>가</b></button><button data-f="f3"><b>가</b></button></span>
  </div>
</div>

<header>
  <div class="kicker" id="kickerEl">Daily Bible QT</div>

<section>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "10월 14일 수요일", "ref": "사사기 21장 13–25절", "headline": "내 눈에 옳은 것이<br>정말 하나님 보시기에도 옳을까요?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 사사기 21:13-25", "s1heading": "오늘의 말씀", "verse": "\"사람의 행위가 자기 보기에는 모두 정직하여도<br>여호와는 마음을 감찰하시느니라\"", "verseRef": "잠언 21:2", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 사사기의 마지막 문장", "paragraphs": ["오늘은 사사기의 마지막 본문입니다. 25절은 사사기 전체를 해석하는 문장입니다. <mark>\"그 때에 이스라엘에 왕이 없으므로 사람이 각기 자기의 소견에 옳은 대로 행하였더라\"</mark>. 이스라엘에게는 왕 되신 하나님이 계셨습니다. 문제는 그분을 왕으로 인정하며 살지 않았다는 것입니다. 사사기는 '여호와의 눈'에서 '삼손의 눈'(\"내 눈에 맞으니\")을 지나 '모든 사람의 눈'으로 기준이 옮겨 가는 이야기입니다.", "오늘 본문에서 겉으로는 모든 문제가 해결됩니다. 베냐민은 살아남고, 전쟁은 끝나고, 사람들은 집으로 돌아갑니다. 그러나 성경은 '모든 것이 잘되었다'로 끝나지 않습니다. <mark>상황이 정리된 것과 하나님 앞에서 바로잡힌 것은 다르기 때문</mark>입니다. 후회는 있었지만 회개는 없었고, 종교 행위는 있었지만 하나님의 다스림은 없었습니다."], "points": ["하나님의 백성이 가장 위험할 때는, 하나님의 이름으로 자기 뜻을 행하면서 그것을 하나님의 뜻이라고 믿을 때입니다."]}, {"title": "13–18절 · 평화를 선포했지만, 아직 자기 맹세에 묶여 있습니다", "paragraphs": ["회중은 림몬 바위의 베냐민에게 <mark>평화를 공포합니다</mark>. 그러나 야베스 길르앗에서 데려온 여인은 사백 명뿐이라 이백 명에게 아직 아내가 없습니다. 더 중요한 것은 이 평화가 어떤 대가 위에 세워졌는가입니다. 베냐민은 거의 멸절되었고, 야베스 길르앗은 공격당했고, 사백 명의 여인은 자기 의사와 상관없이 문제 해결의 수단이 되었습니다. <mark>갈등이 끝났다고 회복과 화해가 완성된 것은 아닙니다</mark>.", "백성은 베냐민을 위해 \"뉘우쳤다\"고 하지만, 그것은 회개라기보다 안타까움에 가깝습니다. 그들은 \"딸을 베냐민에게 주는 자는 저주를 받으리라\"는 자기 맹세 때문에 여전히 움직이지 못합니다. 사람을 살리는 것보다 <mark>자기들이 만든 맹세의 문자를 지키는 것에 더 묶여</mark> 있습니다."], "points": ["좋은 목적을 세웠다고 좋은 방법이 자동으로 따라오지 않습니다. 문제를 해결했다고 죄까지 해결된 것은 아닙니다."]}, {"title": "19–24절 · 여호와의 절기까지 이용한 해결책", "paragraphs": ["장로들은 실로에서 열리는 <mark>여호와의 절기</mark>를 떠올립니다. 그런데 그들이 생각한 것은 예배도 회개도 아니라, 포도원에 숨어 있다가 춤추러 나오는 여인들을 붙잡아 가라는 계획이었습니다. 20장에서 베냐민을 무너뜨린 '매복'이 이제 힘없는 여인들을 붙잡는 방법이 됩니다. 19장에서 한 여인이 남자들의 결정 속에서 희생되었는데, 사사기는 <mark>더 많은 여인들이 희생되는 것으로 끝납니다</mark>.", "아버지와 형제들이 항의하면 \"너희가 준 것이 아니니 죄가 없다\"고 답하겠다는 궤변도 준비합니다. 형식적으로는 맹세를 지켰지만, 그것을 위해 납치를 계획했습니다. <mark>법의 문자는 지키면서 하나님의 마음은 완전히 놓쳤습니다</mark>. 그리고 모두 집으로 돌아갑니다. 그러나 회개도, 언약 갱신도, 피해자를 위한 정의도, 말씀으로 돌아갔다는 기록도 없습니다."], "points": ["순종은 '어디까지 하면 죄가 아닙니까?'를 묻는 것이 아니라 '무엇이 하나님을 기쁘시게 할까?'를 묻는 것입니다. 율법의 빈틈을 찾는 것은 순종이 아닙니다."]}, {"title": "25절 · \"자기의 소견에 옳은 대로\"", "paragraphs": ["이 한 절이 앞의 모든 장면을 해석합니다. 그들은 대부분 자기 나름대로 옳다고 생각했습니다. 노인은 남자 손님을 지키는 것이, 레위인은 자기 목숨을 지키는 것이, 이스라엘은 베냐민을 멸절하는 것이, 장로들은 베냐민을 보존하는 것이 옳다고 여겼습니다. 그런데 결과는 폭력과 희생의 반복이었습니다. <mark>자기 눈이 왕이 된 것</mark>입니다.", "하나님은 옷니엘, 에훗, 드보라와 바락, 기드온, 입다, 삼손을 보내셨지만 사사는 백성을 영원히 바꾸지 못했고, 마지막에는 사사조차 등장하지 않습니다. 레위인도, 노인도, 장로들도, 공동체 전체도 실패합니다. 사사기는 이렇게 묻는 듯합니다. <mark>\"그렇다면 과연 누가 이 백성을 다스릴 수 있는가?\"</mark>"], "points": ["자기 눈에 옳은 사람의 가장 큰 위험은, 자신이 틀렸다는 것을 모른다는 것입니다."]}, {"title": "적용 · 지금 내 삶의 왕은 누구입니까?", "paragraphs": ["이스라엘에는 인간 왕이 필요했습니다. 그러나 성경을 계속 읽으면 사울도 실패하고, 다윗도 죄를 짓고, 솔로몬도 무너집니다. 우리에게 필요한 왕은 단지 더 좋은 인간 지도자가 아니라, <mark>자기 눈이 아니라 하나님의 뜻을 완전히 이루시는 왕</mark>입니다. 그 왕이 예수 그리스도이십니다. 예수님은 겟세마네에서 \"나의 원대로 마시옵고 아버지의 원대로 하옵소서\"라고 기도하셨습니다. 사사기의 사람들은 내 눈에 옳은 대로 살았지만, 예수님은 아버지의 뜻대로 사셨고, 그 순종은 십자가까지 이어졌습니다.", "사사기에서는 계속 약한 사람들이 다른 사람의 문제를 해결하기 위해 희생되었습니다. 그러나 십자가에서는 <mark>왕이 자기 백성을 살리기 위해 자신을 내어 주셨습니다</mark>. 예수님은 우리 죄를 짊어지고 죽으셨지만 죽음으로 끝나지 않고 부활하셨고, 지금도 살아 계신 온전한 왕이십니다. 그리고 우리를 자기 힘으로 살라고 내버려 두지 않으시고 성령을 보내셔서, 내 눈이 아니라 하나님의 뜻대로, 내 욕망이 아니라 말씀에 순종하며, 사람을 누르는 것이 아니라 사랑으로 섬기도록 우리를 변화시키십니다.", "그래서 사사기의 해답은 '조금 더 열심히 살아라'가 아니라 <mark>'참된 왕의 다스림을 받으라'</mark>입니다. 그리고 우리는 그 왕이 다시 오실 날을 기다립니다. 그날 사사기에서 반복된 폭력과 억울함과 자기 소견의 세상은 영원히 끝나고, 그분이 완전한 정의로 다스리실 것입니다.", "그러므로 그날까지 매일 물어야 합니다. 내가 원하는 일, 내게 유리한 일, 우리가 익숙하게 해 온 일이 아니라 <mark>\"우리 왕 예수님은 무엇을 원하시는가?\"</mark> 교회도 첫사랑으로 돌아가고, 우리의 예배와 사역과 가정과 결정을 다시 왕의 통치 아래 놓아야 합니다. 사사기의 마지막 질문을 오늘 나의 질문으로 받아들이십시오. 지금 내 삶에서 실제로 왕은 누구입니까? 예수님입니까, 아니면 여전히 내 눈과 내 소견입니까?"], "points": ["믿음의 질문은 '내가 보기에 무엇이 옳은가'가 아니라 '하나님 보시기에 무엇이 옳은가'여야 합니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "문제가 정리되었다는 이유로 하나님 앞에서도 바로잡혔다고 여기고 있지는 않은지 돌아봤다"}, {"key": "c2", "text": "하나님의 이름이나 교회 일을 내 계획을 이루는 수단으로 포장하고 있지 않은지 점검했다"}, {"key": "c3", "text": "'어디까지 하면 괜찮은가'를 묻는 대신 '무엇이 하나님을 기쁘시게 할까'를 물었다"}, {"key": "c4", "text": "오늘 내 결정의 기준이 내 눈과 소견인지, 왕 되신 예수님의 뜻인지 정직하게 돌아봤다"}], "s4heading": "묵상 한 줄", "memoHint": "요즘 내가 '내 눈에 옳다'고 확신하며 밀고 나가는 일 가운데, 예수님께 다시 여쭈어야 할 것은 무엇입니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "왕께 여쭙기", "value": "오늘 내릴 결정 하나를 놓고 '예수님, 이 일에서 무엇을 원하십니까?'라고 먼저 기도하기"}, {"key": "act2", "label": "빈틈 대신 기쁨", "value": "'이 정도는 괜찮겠지' 하고 넘기던 일 하나를 '하나님이 기뻐하실까?'로 다시 판단하기"}, {"key": "act3", "label": "피해자 기억하기", "value": "내 문제를 해결하는 과정에서 상처받은 사람이 없는지 떠올리고, 있다면 사과나 회복의 걸음 내딛기"}, {"key": "act4", "label": "첫사랑 회복", "value": "예수님을 처음 만났을 때의 감사와 결단을 떠올리며 짧게 감사 기도문 적기"}, {"key": "act5", "label": "말씀 암송", "value": "잠언 21:2를 외우며 '내 눈에 옳은 것'을 하나님 앞에 내려놓기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "자기 눈이 아니라 아버지의 뜻대로 사시고, 자기 백성을 살리기 위해 자신을 내어 주신 참된 왕 예수님께 감사합니다"}, {"key": "p2", "tag": "회개", "text": "하나님의 이름을 부르면서도 내 눈에 옳은 대로 살고, 문제가 정리되면 하나님 앞에서도 괜찮다고 여기며, 율법의 빈틈을 찾았던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "성령님, 제 예배와 가정과 사역과 모든 결정을 다시 왕 되신 예수님의 통치 아래 두게 하시고, 다시 오실 그날까지 날마다 주님의 뜻을 묻게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "October 14, Wednesday", "ref": "Judges 21:13–25", "headline": "What's Right in My Eyes —<br>Is It Right in God's Eyes?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · Judges 21:13-25", "s1heading": "Today's Word", "verse": "\"Every way of a man is right in his own eyes,<br>but the LORD weighs the heart.\"", "verseRef": "Proverbs 21:2", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · The Final Sentence of Judges", "paragraphs": ["Today's passage is the last in the book of Judges. So verse 25 is not just a sentence wrapping up one event — it's like the final sentence that interprets the whole book we've been reading: <mark>\"In those days there was no king in Israel. Everyone did what was right in his own eyes.\"</mark> Israel wasn't truly without a king; they had God as their King. The problem was that they didn't live acknowledging Him as King and Ruler. And the most frightening problem in Judges isn't people openly declaring, 'I'm going to live wickedly.' What's far more frightening is that people live believing that what is right in their own eyes is good.", "Early in Judges, Israel asked God, \"Who shall go up first?\" But over time Israel was repeatedly assessed: \"They did what was evil in the sight of the LORD.\" Then the last judge, Samson, said, \"Get her for me, for she is right in my eyes.\" One man, Samson, choosing what was right in his eyes became, by the end of Judges, a whole society where everyone did what was right in their own eyes. <mark>Judges shows the standard moving from the eyes of the LORD, through Samson's eyes, finally to everyone's eyes.</mark> Chapters 19–21 show the results most tragically: a Levite sacrificed a woman to protect himself; a war begun to judge Gibeah's evil spread into revenge that nearly wiped out Benjamin; to preserve Benjamin, Israel attacked Jabesh-gilead and took 400 women — and still 200 men of Benjamin have no wives.", "In today's text the elders produce yet another solution: when the feast of the LORD is held at Shiloh, the men of Benjamin are to hide in the vineyards and seize the young women who come out to dance. Outwardly, every problem is solved. Benjamin survives, the war ends, cities are rebuilt, and everyone returns to their inheritance. But Scripture doesn't end with 'And all was well.' Instead it ends: \"Everyone did what was right in his own eyes.\" Why? <mark>Because having a situation settled is different from being set right before God.</mark> They had regret, but no repentance. They had religious activity, but no rule of God. They had problems solved, but no spiritual restoration."], "points": ["God's people are in the greatest danger when they do their own will in God's name while believing it is God's will."]}, {"title": "Verses 13–18 · Peace Declared — Yet Still Bound by Their Own Oath", "paragraphs": ["In verse 13, the congregation sends word to the Benjaminites hiding at the rock of Rimmon and <mark>proclaims peace</mark>. During the war, Benjamin had been treated almost like Canaanites rather than brothers — their towns destroyed, marriage ties cut off. Now Israel proclaims peace and seeks to receive them back into the community. But verse 14 shows the problem: only 400 women were brought from Jabesh-gilead, so 200 of the 600 Benjaminite men still have no wives. Peace has been declared, yet the problem remains.", "More importantly, we must ask what price this peace was built upon. Benjamin was nearly wiped out. Jabesh-gilead was attacked. Four hundred women became a means of solving the community's problem regardless of their own will. So this is a peace in which the war ended — but it is hard to call it a peace in which everything was justly restored. <mark>The end of a conflict in our lives doesn't mean restoration and reconciliation are complete.</mark> A situation being settled is different from being set right before God.", "Verse 15 says again, \"The people had compassion on Benjamin\" — closer to pity and sorrow than to repentance. Their hearts ache, but their methods haven't changed. The elders ask, \"What shall we do for wives for those who are left?\" The issue isn't only marriage; verse 17 raises the matter of inheritance — if Benjamin can't continue its line, it can't keep the land God gave the tribe. The goal is understandable. The problem is the method. Verse 18: \"We cannot give them wives from our daughters,\" because they had sworn, \"Cursed be he who gives a wife to Benjamin.\" In the end, they are <mark>more bound to keeping the letter of their own oath than to saving people</mark>."], "points": ["Setting a good goal doesn't automatically bring a good method. Solving a problem doesn't mean the sin has been dealt with."]}, {"title": "Verses 19–24 · A Solution That Even Used the Feast of the LORD", "paragraphs": ["In verse 19 an idea suddenly arises: <mark>\"Behold, there is the yearly feast of the LORD at Shiloh.\"</mark> The text doesn't say exactly which feast. What's certain is that under the name of the LORD's feast, people gather to worship and young women come out to dance. But what do the elders think of when they see this feast? Not worship. Not repentance. They see an opportunity for abduction — vineyards nearby, young women coming outside. The feast of the LORD becomes an opportunity to solve their problem. This is truly frightening: something bearing God's name doesn't make it God's will. Even in religious settings we can do our own will. In church, ministry, and worship, we can package our plans as God's will.", "In verse 20 the elders tell the Benjaminite men, \"Go and lie in ambush in the vineyards.\" This recalls the previous war: in chapter 20, Benjamin fell because of an ambush. Now in chapter 21, Benjamin lies in ambush against the women of Shiloh — the very method that destroyed them is now used to seize the powerless. Verse 21: \"Each man catch his wife from the daughters of Shiloh.\" This isn't a free choice of marriage; it's taking women by force without their consent — abduction. How did Judges 19 begin? With a woman sacrificed in men's decisions. And how does the final story of Judges end? <mark>With more women sacrificed in men's decisions.</mark> What began as judgment for one woman's suffering ends in the suffering of many more. When problems are solved without repentance, sin may change form, but its pattern repeats.", "In verse 22 the elders even anticipate protests from the women's fathers and brothers, and prepare an answer in advance — a truly twisted argument: 'You didn't give your daughters to Benjamin; they took them. So you haven't broken the oath.' How clever! Formally, they kept the oath — but to keep it, they planned and permitted abduction. <mark>They kept the letter of the law and completely missed the heart of God.</mark> Then they take wives, return to their inheritance, rebuild their towns, and the rest of Israel returns home. Outwardly everything is normal again. But look closely at what's missing: no repentance, no covenant renewal, no justice for the victims, no record of returning to God's Word. They simply all go home."], "points": ["Obedience doesn't ask 'How far can I go before it's sin?' but 'What would please God?' Looking for loopholes in the law is not obedience."]}, {"title": "Verse 25 · \"What Was Right in His Own Eyes\"", "paragraphs": ["Verse 25, the final words of Judges, interprets every scene before it. The Israelites didn't do these things believing they were wrong. Most of them thought they were right in their own way. The men of Gibeah followed their desires. The old man thought protecting his male guest was right. The Levite thought saving his own life was what mattered. Israel thought wiping out Benjamin was justice. The elders thought preserving Benjamin was right. Yet the result was repeated violence and sacrifice. <mark>This is the most frightening sin in Judges: they didn't simply call evil good — they made their own standard the standard of good. Their own eyes became king.</mark>", "Reading Judges from beginning to end leaves our hearts heavy. God kept sending deliverers: Othniel, Ehud, Deborah and Barak, Gideon, Jephthah, Samson. But the judges couldn't change the people permanently. When a judge died, sin returned. Over time even the judges themselves deteriorated, and in the end no judge appears at all. The Levite fails. The old man fails. The elders fail. The whole community fails. So Judges seems to end by asking: <mark>\"Then who can truly rule this people?\"</mark>"], "points": ["The greatest danger for someone who is right in their own eyes is not knowing that they are wrong."]}, {"title": "Application · Who Is Really King of My Life Right Now?", "paragraphs": ["Israel needed a human king. But as we keep reading Scripture, Saul fails, David sins, and Solomon falls. The King we need isn't merely a better human leader, but <mark>a King who fully accomplishes God's will rather than His own eyes</mark>. That King is Jesus Christ. In Gethsemane Jesus prayed, \"Not as I will, but as You will.\" The people of Judges lived by what was right in their own eyes; Jesus lived by the Father's will — and that obedience went all the way to the cross.", "In Judges, the weak were repeatedly sacrificed to solve other people's problems. But at the cross it's different: <mark>the King gave Himself to save His people</mark>. Jesus bore our sins and died, but it didn't end in death — He rose again, and He is the living, perfect King today. And He didn't leave us to live by our own strength. He sent the Holy Spirit, who dwells in us now, gives us discernment, and transforms us to live by God's will rather than our own eyes, to obey the Word rather than our desires, and to serve with love rather than press others down with our power.", "So the answer of Judges is not 'Try a little harder.' It is <mark>'Come under the rule of the true King.'</mark> And we also wait. The King who died, rose, and is with us now by the Spirit will surely come again. When Jesus returns, the world of violence, injustice, and 'everyone's own opinion' that repeated in Judges will end forever. He will rule in perfect justice.", "So until that day we must ask every day — not what I want, not what benefits me, not what our church has always done — but <mark>\"What does Jesus our King want?\"</mark> Pastors must return to their first calling; the church must return to its first love. Our worship, ministry, homes, and decisions must be placed again under the King's rule. Take the final question of Judges as your own question today: Who is really King in my life right now? Is it Jesus — or is it still my own eyes and my own opinion?"], "points": ["The question of faith must not be 'What is right in my eyes?' but 'What is right in God's eyes?'"]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether I assume something is set right before God just because the situation has been settled."}, {"key": "c2", "text": "I checked whether I'm packaging my own plans as God's will by using His name or church work."}, {"key": "c3", "text": "Instead of asking 'How far is okay?', I asked 'What would please God?'"}, {"key": "c4", "text": "I honestly reflected on whether today's decisions are based on my own eyes and opinions, or on the will of Jesus my King."}], "s4heading": "One-Line Reflection", "memoHint": "Among the things I'm pushing ahead with, convinced they're 'right in my eyes,' what should I bring back to Jesus and ask Him about?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Ask the King", "value": "For one decision today, first pray: 'Jesus, what do You want in this?'"}, {"key": "act2", "label": "Delight, Not Loopholes", "value": "Take one thing you've let slide as 'this much is fine' and judge it again by 'Would God be pleased?'"}, {"key": "act3", "label": "Remember Those Hurt", "value": "Consider whether anyone was hurt while you solved your own problems, and if so, take a step toward apology or restoration"}, {"key": "act4", "label": "Return to First Love", "value": "Recall the gratitude and commitment you had when you first met Jesus, and write a short prayer of thanks"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize Proverbs 21:2 and lay down 'what's right in my eyes' before God"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, Jesus, true King, who lived not by Your own eyes but by the Father's will, and gave Yourself to save Your people."}, {"key": "p2", "tag": "Repent", "text": "I repent that while calling on Your name I lived by what was right in my own eyes, assumed all was fine before You once things were settled, and looked for loopholes in Your law."}, {"key": "p3", "tag": "Ask", "text": "Holy Spirit, place my worship, home, ministry, and every decision again under the rule of Jesus my King, and help me ask His will every day until He comes again."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Oktubre 14, Miyerkules", "ref": "Mga Hukom 21:13–25", "headline": "Ang Tama sa Aking Paningin —<br>Tama Rin Ba sa Paningin ng Diyos?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Mga Hukom 21:13-25", "s1heading": "Salita Ngayon", "verse": "\"Bawat lakad ng tao ay matuwid sa kanyang sariling paningin,<br>ngunit tinitimbang ni Yahweh ang puso.\"", "verseRef": "Kawikaan 21:2", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Ang Huling Pangungusap ng Mga Hukom", "paragraphs": ["Ang talata ngayon ay ang huli sa aklat ng Mga Hukom. Kaya ang talata 25 ay hindi lamang pangungusap na nagbubuod ng isang pangyayari — para itong huling pangungusap na nagpapaliwanag sa buong aklat na ating binabasa: <mark>\"Nang mga araw na iyon ay walang hari sa Israel. Ginawa ng bawat isa ang tama sa kanyang sariling paningin.\"</mark> Hindi talaga walang hari ang Israel; ang Diyos ang kanilang Hari. Ang problema ay hindi sila namuhay na kinikilala Siya bilang Hari at Pinuno. At ang pinakanakatatakot na problema sa Mga Hukom ay hindi ang hayagang pagsasabi ng tao na 'Mamumuhay ako nang masama.' Mas nakatatakot na namumuhay ang tao na naniniwalang mabuti ang tama sa kanilang sariling paningin.", "Sa simula ng Mga Hukom, nagtanong ang Israel sa Diyos, \"Sino ang unang aakyat?\" Ngunit sa paglipas ng panahon, paulit-ulit na sinabi tungkol sa Israel: \"Gumawa sila ng masama sa paningin ni Yahweh.\" Pagkatapos, sinabi ng huling hukom na si Samson, \"Kunin mo siya para sa akin, sapagkat tama siya sa aking paningin.\" Ang isang taong si Samson na pumili ng tama sa kanyang paningin ay naging, sa wakas ng Mga Hukom, isang buong lipunang ginagawa ng lahat ang tama sa kanilang sariling paningin. <mark>Ipinapakita ng Mga Hukom ang paglipat ng pamantayan mula sa paningin ni Yahweh, sa paningin ni Samson, at sa wakas sa paningin ng lahat.</mark> Ipinapakita ng kabanata 19–21 ang pinakatrahedyang bunga: isinakripisyo ng isang Levita ang isang babae upang protektahan ang sarili; ang digmaang nagsimula upang hatulan ang kasamaan ng Gibea ay lumawak sa paghihiganting halos lumipol sa Benjamin; upang mapanatili ang Benjamin, sinalakay ng Israel ang Jabes-gilead at kumuha ng 400 babae — at 200 lalaki pa rin ng Benjamin ang walang asawa.", "Sa teksto ngayon, gumawa ang matatanda ng isa pang solusyon: kapag ginanap ang kapistahan ni Yahweh sa Silo, dapat magtago ang mga lalaki ng Benjamin sa mga ubasan at dakpin ang mga dalagang lalabas upang sumayaw. Sa panlabas, nalutas ang bawat problema. Nakaligtas ang Benjamin, natapos ang digmaan, muling itinayo ang mga lungsod, at bumalik ang lahat sa kanilang mana. Ngunit hindi nagtatapos ang Kasulatan sa 'At naging maayos ang lahat.' Sa halip, nagtatapos ito sa: \"Ginawa ng bawat isa ang tama sa kanyang sariling paningin.\" Bakit? <mark>Dahil iba ang pagkakaayos ng sitwasyon sa pagkakaituwid sa harap ng Diyos.</mark> May panghihinayang sila, ngunit walang pagsisisi. May gawaing panrelihiyon, ngunit walang paghahari ng Diyos. Nalutas ang mga problema, ngunit walang espirituwal na pagpapanumbalik."], "points": ["Nasa pinakamalaking panganib ang bayan ng Diyos kapag ginagawa nila ang sarili nilang kalooban sa pangalan ng Diyos habang naniniwalang iyon ang kalooban ng Diyos."]}, {"title": "Talata 13–18 · Ipinahayag ang Kapayapaan — Ngunit Nakatali Pa Rin sa Sariling Panunumpa", "paragraphs": ["Sa talata 13, nagpadala ng mensahe ang kapulungan sa mga Benjamitang nagtatago sa bato ng Rimon at <mark>ipinahayag ang kapayapaan</mark>. Noong digmaan, halos tinrato ang Benjamin na parang mga Cananeo sa halip na mga kapatid — winasak ang kanilang mga bayan, pinutol ang ugnayan ng pag-aasawa. Ngayon, ipinapahayag ng Israel ang kapayapaan at nais silang tanggaping muli sa komunidad. Ngunit ipinapakita ng talata 14 ang problema: 400 babae lamang ang dinala mula sa Jabes-gilead, kaya 200 sa 600 lalaking Benjamita ang wala pa ring asawa. Naipahayag ang kapayapaan, ngunit nananatili ang problema.", "Higit na mahalaga, dapat nating itanong kung sa anong halaga itinayo ang kapayapaang ito. Halos nalipol ang Benjamin. Sinalakay ang Jabes-gilead. Apat na raang babae ang naging kasangkapan sa paglutas ng problema ng komunidad nang walang pagsasaalang-alang sa kanilang kalooban. Kaya ito ay kapayapaang natapos ang digmaan — ngunit mahirap itong tawaging kapayapaang makatarungang naibalik ang lahat. <mark>Ang pagtatapos ng alitan sa ating buhay ay hindi nangangahulugang kumpleto na ang pagpapanumbalik at pagkakasundo.</mark> Iba ang pagkakaayos ng sitwasyon sa pagkakaituwid sa harap ng Diyos.", "Muling sinasabi ng talata 15, \"Nahabag ang bayan sa Benjamin\" — mas malapit sa awa at lungkot kaysa sa pagsisisi. Masakit ang kanilang puso, ngunit hindi nagbago ang kanilang paraan. Nagtanong ang matatanda, \"Ano ang gagawin natin para sa mga asawa ng mga natira?\" Hindi lamang pag-aasawa ang isyu; binabanggit ng talata 17 ang usapin ng mana — kung hindi maipagpapatuloy ng Benjamin ang lahi nito, hindi nito mapapanatili ang lupaing ibinigay ng Diyos sa lipi. Nauunawaan ang layunin. Ang problema ay ang paraan. Talata 18: \"Hindi natin sila mabibigyan ng asawa mula sa ating mga anak na babae,\" dahil nanumpa sila, \"Sumpain ang magbigay ng asawa sa Benjamin.\" Sa huli, <mark>mas nakatali sila sa pagtupad sa letra ng sarili nilang panunumpa kaysa sa pagliligtas sa tao</mark>."], "points": ["Ang pagtatakda ng mabuting layunin ay hindi awtomatikong nagdadala ng mabuting paraan. Ang paglutas ng problema ay hindi nangangahulugang nalutas na ang kasalanan."]}, {"title": "Talata 19–24 · Isang Solusyong Ginamit Pati ang Kapistahan ni Yahweh", "paragraphs": ["Sa talata 19, biglang may naisip na ideya: <mark>\"Narito, may taunang kapistahan ni Yahweh sa Silo.\"</mark> Hindi eksaktong sinabi ng teksto kung anong kapistahan. Ang tiyak ay sa pangalan ng kapistahan ni Yahweh, nagtitipon ang mga tao upang sumamba at lumalabas ang mga dalaga upang sumayaw. Ngunit ano ang naisip ng matatanda nang makita ang kapistahang ito? Hindi pagsamba. Hindi pagsisisi. Nakita nila ang pagkakataon para sa pagdukot — may mga ubasan sa malapit, lumalabas ang mga dalaga. Naging pagkakataon ang kapistahan ni Yahweh upang lutasin ang kanilang problema. Tunay na nakatatakot ito: ang pagkakaroon ng pangalan ng Diyos ay hindi ginagawang kalooban ng Diyos ang isang bagay. Kahit sa mga lugar na panrelihiyon, magagawa natin ang sarili nating kalooban. Sa iglesia, ministeryo, at pagsamba, maaari nating balutin ang ating mga plano bilang kalooban ng Diyos.", "Sa talata 20, sinabi ng matatanda sa mga lalaking Benjamita, \"Pumunta kayo at mag-abang sa mga ubasan.\" Ipinapaalala nito ang nakaraang digmaan: sa kabanata 20, bumagsak ang Benjamin dahil sa isang tambangan. Ngayon sa kabanata 21, nag-aabang ang Benjamin laban sa mga babae ng Silo — ang mismong paraang sumira sa kanila ay ginagamit ngayon upang dakpin ang mga walang kapangyarihan. Talata 21: \"Dakpin ng bawat lalaki ang kanyang asawa mula sa mga anak na babae ng Silo.\" Hindi ito malayang pagpili ng pag-aasawa; ito ay sapilitang pagkuha sa mga babae nang walang pahintulot nila — pagdukot. Paano nagsimula ang Mga Hukom 19? Sa isang babaeng isinakripisyo sa mga desisyon ng kalalakihan. At paano nagtatapos ang huling kwento ng Mga Hukom? <mark>Sa mas maraming babaeng isinakripisyo sa mga desisyon ng kalalakihan.</mark> Ang nagsimula bilang paghatol para sa pagdurusa ng isang babae ay nagtapos sa pagdurusa ng mas marami pa. Kapag nilulutas ang problema nang walang pagsisisi, maaaring magbago ang anyo ng kasalanan, ngunit umuulit ang padron nito.", "Sa talata 22, inaasahan pa ng matatanda ang pagtutol ng mga ama at kapatid ng mga babae, at naghanda ng sagot nang maaga — isang tunay na baluktot na katwiran: 'Hindi ninyo ibinigay ang inyong mga anak na babae sa Benjamin; sila ang kumuha. Kaya hindi ninyo nilabag ang panunumpa.' Napakatuso! Sa porma, natupad nila ang panunumpa — ngunit upang matupad ito, nagplano at nagpahintulot sila ng pagdukot. <mark>Tinupad nila ang letra ng batas at lubusang nakaligtaan ang puso ng Diyos.</mark> Pagkatapos ay kumuha sila ng asawa, bumalik sa kanilang mana, muling itinayo ang kanilang mga bayan, at umuwi ang ibang bahagi ng Israel. Sa panlabas, normal na muli ang lahat. Ngunit tingnang mabuti ang nawawala: walang pagsisisi, walang pagpapanibago ng tipan, walang katarungan para sa mga biktima, walang tala ng pagbabalik sa Salita ng Diyos. Basta umuwi silang lahat."], "points": ["Ang pagsunod ay hindi nagtatanong ng 'Hanggang saan ako puwede bago maging kasalanan?' kundi 'Ano ang makalulugod sa Diyos?' Ang paghahanap ng butas sa batas ay hindi pagsunod."]}, {"title": "Talata 25 · \"Ang Tama sa Kanyang Sariling Paningin\"", "paragraphs": ["Ang talata 25, ang huling salita ng Mga Hukom, ang nagpapaliwanag sa bawat eksena bago nito. Hindi ginawa ng mga Israelita ang mga bagay na ito na naniniwalang mali sila. Karamihan sa kanila ay nag-akalang tama sila sa sarili nilang paraan. Sinunod ng mga taga-Gibea ang kanilang pagnanasa. Inakala ng matanda na tama ang protektahan ang lalaking panauhin. Inakala ng Levita na ang mahalaga ay iligtas ang sariling buhay. Inakala ng Israel na katarungan ang paglipol sa Benjamin. Inakala ng matatanda na tama ang pagpapanatili sa Benjamin. Gayunman, ang bunga ay paulit-ulit na karahasan at sakripisyo. <mark>Ito ang pinakanakatatakot na kasalanan sa Mga Hukom: hindi lamang nila tinawag na mabuti ang masama — ginawa nilang pamantayan ng mabuti ang sarili nilang pamantayan. Naging hari ang sarili nilang paningin.</mark>", "Ang pagbasa sa Mga Hukom mula simula hanggang wakas ay nag-iiwan ng bigat sa ating puso. Patuloy na nagsugo ang Diyos ng mga tagapagligtas: si Otniel, si Ehud, sina Debora at Barak, si Gideon, si Jefte, si Samson. Ngunit hindi napabago ng mga hukom ang bayan nang permanente. Kapag namatay ang isang hukom, bumabalik ang kasalanan. Sa paglipas ng panahon, maging ang mga hukom mismo ay lumala, at sa huli ay wala nang hukom na lumilitaw. Nabigo ang Levita. Nabigo ang matanda. Nabigo ang matatanda. Nabigo ang buong komunidad. Kaya parang nagtatapos ang Mga Hukom sa tanong na: <mark>\"Kung gayon, sino ang tunay na makapaghahari sa bayang ito?\"</mark>"], "points": ["Ang pinakamalaking panganib sa taong tama sa sariling paningin ay ang hindi niya pagkaalam na mali siya."]}, {"title": "Aplikasyon · Sino ang Tunay na Hari ng Aking Buhay Ngayon?", "paragraphs": ["Kailangan ng Israel ng haring tao. Ngunit habang patuloy nating binabasa ang Kasulatan, nabigo si Saul, nagkasala si David, at bumagsak si Solomon. Ang Haring kailangan natin ay hindi lamang mas mabuting pinunong tao, kundi <mark>isang Haring lubos na tumutupad sa kalooban ng Diyos sa halip na sa sarili Niyang paningin</mark>. Ang Haring iyon ay si Jesu-Cristo. Sa Getsemani, nanalangin si Jesus, \"Hindi ang kalooban Ko, kundi ang kalooban Mo.\" Namuhay ang mga tao sa Mga Hukom ayon sa tama sa kanilang sariling paningin; namuhay si Jesus ayon sa kalooban ng Ama — at umabot ang pagsunod na iyon hanggang sa krus.", "Sa Mga Hukom, paulit-ulit na isinakripisyo ang mahihina upang lutasin ang problema ng iba. Ngunit iba sa krus: <mark>ibinigay ng Hari ang Kanyang sarili upang iligtas ang Kanyang bayan</mark>. Pinasan ni Jesus ang ating mga kasalanan at namatay, ngunit hindi ito nagtapos sa kamatayan — muli Siyang nabuhay, at Siya ang buhay at ganap na Hari ngayon. At hindi Niya tayo iniwang mamuhay sa sarili nating lakas. Isinugo Niya ang Banal na Espiritu, na nananahan sa atin ngayon, nagbibigay ng pagkilala, at binabago tayo upang mamuhay ayon sa kalooban ng Diyos sa halip na sa sarili nating paningin, sumunod sa Salita sa halip na sa ating pagnanasa, at maglingkod sa pag-ibig sa halip na pilitin ang iba gamit ang ating kapangyarihan.", "Kaya ang sagot ng Mga Hukom ay hindi 'Magsikap ka pa nang kaunti.' Ito ay <mark>'Pumailalim sa paghahari ng tunay na Hari.'</mark> At naghihintay rin tayo. Ang Haring namatay, muling nabuhay, at kasama natin ngayon sa pamamagitan ng Espiritu ay tiyak na babalik. Pagbalik ni Jesus, ang mundo ng karahasan, kawalang-katarungan, at 'sariling opinyon ng bawat isa' na paulit-ulit sa Mga Hukom ay magwawakas magpakailanman. Maghahari Siya nang may ganap na katarungan.", "Kaya hanggang sa araw na iyon, dapat tayong magtanong araw-araw — hindi kung ano ang gusto ko, hindi kung ano ang pakinabang sa akin, hindi kung ano ang palaging ginagawa ng aming iglesia — kundi <mark>\"Ano ang nais ni Jesus na aming Hari?\"</mark> Dapat bumalik ang mga pastor sa kanilang unang pagkatawag; dapat bumalik ang iglesia sa unang pag-ibig nito. Ang ating pagsamba, ministeryo, tahanan, at mga desisyon ay dapat muling ilagay sa ilalim ng paghahari ng Hari. Tanggapin ang huling tanong ng Mga Hukom bilang sarili mong tanong ngayon: Sino ang tunay na Hari sa aking buhay ngayon? Si Jesus ba — o ang sarili ko pa ring paningin at opinyon?"], "points": ["Ang tanong ng pananampalataya ay hindi dapat 'Ano ang tama sa aking paningin?' kundi 'Ano ang tama sa paningin ng Diyos?'"]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung inaakala kong naituwid na sa harap ng Diyos ang isang bagay dahil lamang naayos na ang sitwasyon."}, {"key": "c2", "text": "Sinuri ko kung binabalot ko ang sarili kong mga plano bilang kalooban ng Diyos gamit ang Kanyang pangalan o gawain sa iglesia."}, {"key": "c3", "text": "Sa halip na itanong ang 'Hanggang saan ang puwede?', itinanong ko ang 'Ano ang makalulugod sa Diyos?'"}, {"key": "c4", "text": "Tapat kong pinag-isipan kung ang mga desisyon ko ngayon ay batay sa sarili kong paningin at opinyon, o sa kalooban ni Jesus na aking Hari."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Sa mga bagay na ipinipilit ko dahil kumbinsido akong 'tama sa aking paningin,' ano ang dapat kong ibalik kay Jesus at itanong sa Kanya?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Magtanong sa Hari", "value": "Para sa isang desisyon ngayon, manalangin muna: 'Jesus, ano ang nais Mo rito?'"}, {"key": "act2", "label": "Kaluguran, Hindi Butas", "value": "Kumuha ng isang bagay na pinalampas mo bilang 'ayos na ito' at hatulan muli ayon sa 'Malulugod kaya ang Diyos?'"}, {"key": "act3", "label": "Alalahanin ang Nasaktan", "value": "Isipin kung may nasaktan habang nilulutas mo ang sarili mong problema, at kung mayroon, humakbang tungo sa paghingi ng tawad o pagpapanumbalik"}, {"key": "act4", "label": "Bumalik sa Unang Pag-ibig", "value": "Alalahanin ang pasasalamat at pagpapasyang taglay mo nang una mong makilala si Jesus, at sumulat ng maikling panalangin ng pasasalamat"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang Kawikaan 21:2 at ilapag sa harap ng Diyos ang 'tama sa aking paningin'"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Jesus, tunay na Hari, na namuhay hindi ayon sa sarili Mong paningin kundi ayon sa kalooban ng Ama, at ibinigay ang Iyong sarili upang iligtas ang Iyong bayan."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako na habang tumatawag sa Iyong pangalan ay namuhay ako ayon sa tama sa aking sariling paningin, inakalang ayos na ang lahat sa harap Mo kapag naayos na ang sitwasyon, at naghanap ng butas sa Iyong batas."}, {"key": "p3", "tag": "Kahilingan", "text": "Banal na Espiritu, ilagay Mong muli ang aking pagsamba, tahanan, ministeryo, at bawat desisyon sa ilalim ng paghahari ni Jesus na aking Hari, at tulungan Mo akong itanong ang Kanyang kalooban araw-araw hanggang sa Kanyang muling pagdating."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-09-16';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
