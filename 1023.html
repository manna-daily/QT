<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "10월 23일 금요일", "ref": "야고보서 4장 13절–5장 6절", "headline": "내 계획과 돈의 사용에도<br>믿음이 드러나나요?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 야고보서 4:13-5:6", "s1heading": "오늘의 말씀", "verse": "\"너희가 도리어 말하기를<br>주의 뜻이면 우리가 살기도 하고<br>이것이나 저것을 하리라 할 것이거늘\"", "verseRef": "야고보서 4:15", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 일정표와 지갑에서도 드러나는 믿음", "paragraphs": ["앞에서 야고보는 혀가 공동체를 무너뜨릴 수 있다고 경고하고, 이웃의 최종 심판자는 하나님이시니 형제를 비방하지 말라고 했습니다. 오늘은 믿음이 드러나야 할 또 다른 자리를 보여 줍니다. <mark>내일을 계획하는 자리와 돈을 벌고 사용하는 자리</mark>입니다. 입으로는 하나님을 주님이라 고백하면서도 계획을 세울 때는 내 뜻만 앞세우고, 재물을 얻고 쓰는 과정에서 고통받는 이웃을 외면할 수 있습니다.", "오늘 붙들 한 문장은 이것입니다. <mark>생명과 미래의 주인은 하나님이십니다. 그러므로 오늘 내게 맡겨진 시간과 물질을 주님의 뜻에 따라 사용해야 합니다</mark>. 본문은 두 번의 \"들으라\"로 시작합니다. 첫째는 미래를 장담하는 사람들, 둘째는 재물을 쌓으며 이웃을 해치는 사람들을 향한 말씀입니다."], "points": ["나의 일정표와 돈의 사용에는 하나님을 의지하는 믿음이 드러나고 있습니까?"]}, {"title": "4:13–17 · 내일을 장담하는 교만에서 오늘 순종하는 믿음으로", "paragraphs": ["<mark>\"오늘이나 내일이나 우리가 어떤 도시에 가서 거기서 일 년을 머물며 장사하여 이익을 보리라\"</mark>. 계획을 세우고 성실하게 준비하는 것은 필요하지만, 그들은 생명과 미래가 자기 손에 있는 것처럼 말합니다. 야고보는 말합니다. <mark>\"너희 생명이 무엇이냐 너희는 잠깐 보이다가 없어지는 안개니라\"</mark>. 그래서 이렇게 말해야 합니다. <mark>\"주의 뜻이면 우리가 살기도 하고 이것이나 저것을 하리라\"</mark>. 이 고백은 습관적인 말버릇이 아니라, 내 계획의 목적과 방법까지 말씀 앞에서 점검하는 태도입니다. 이익을 얻은 뒤 감사하면서 그 과정에서 다른 사람의 정당한 몫을 빼앗을 수는 없습니다.", "<mark>\"사람이 선을 행할 줄 알고도 행하지 아니하면 죄니라\"</mark>. 14절은 우리가 <mark>내일을 모른다</mark>고 말하고, 17절은 우리가 <mark>해야 할 선은 알 수 있다</mark>고 말합니다. 내일은 알 수 없어도 오늘 해야 할 선은 알고 있을 수 있습니다. 사과해야 한다는 것을 알면서 미루고, 정직하게 처리해야 한다는 것을 알면서 넘어가지는 않습니까?"], "points": ["미래가 더 확실해질 때까지 순종을 미루고 있지는 않습니까? 내일을 하나님께 맡기는 믿음은 오늘의 순종으로 드러납니다."]}, {"title": "5:1–3 · 이웃을 해치며 쌓은 재물은 자신에게 불리한 증거가 됩니다", "paragraphs": ["두 번째 \"들으라\"는 품삯을 가로채고 힘없는 사람을 억압한 부자들을 향합니다. <mark>\"너희에게 임할 고생으로 말미암아 울고 통곡하라\"</mark>. 가진 돈과 영향력으로는 하나님의 심판을 피할 수 없습니다. 썩은 재물, 좀먹은 옷, 녹슨 금과 은은 그들이 의지한 부가 자신을 지켜 주지 못한다는 사실을 보여 줍니다.", "더 두려운 것은 <mark>\"이 녹이 너희에게 증거가 되며\"</mark>라는 말씀입니다. 재물은 얼마나 소유했는지뿐 아니라 <mark>어떻게 얻고 무엇을 위해 썼는지</mark>도 증언합니다. 이웃의 몫을 빼앗고 필요를 외면하며 쌓은 재물이라면 그 축적이 탐욕의 증거가 됩니다. \"말세에 재물을 쌓았도다\"는 하나님의 심판 앞에서 삶을 돌아보아야 할 때에 더 모으는 일에만 몰두한 모습을 드러냅니다."], "points": ["재물을 얻고 쓰는 방식도 신앙의 문제입니다. 가진 것이 많아졌는지와 함께, 그 과정에 정직과 이웃 사랑이 있었는지 살펴야 합니다."]}, {"title": "5:4–6 · 지급하지 않은 품삯이 소리 지르고, 하나님은 그 울음을 들으십니다", "paragraphs": ["<mark>\"너희 밭에서 추수한 품꾼에게 주지 아니한 삯이 소리 지르며 그 추수한 자의 우는 소리가 만군의 주의 귀에 들렸느니라\"</mark>. 품삯은 일한 사람의 정당한 몫입니다. 하루 벌어 생계를 잇는 사람에게 그 돈을 주지 않으면 가족의 먹을 것까지 빼앗게 됩니다. <mark>내 손에 있다는 이유만으로 모두 내 몫이 되는 것은 아닙니다</mark>. 얼마나 베풀지를 생각하기 전에 돌려주거나 지급해야 할 것을 붙잡고 있지 않은지 살펴야 합니다. 헌금과 선행이 그 책임을 대신할 수는 없습니다.", "일꾼들은 품삯을 받지 못해 우는데 부자들은 사치하며, 살육의 날을 앞두고 자신을 살찌웁니다. 그들은 <mark>대항하지도 못하는 의인</mark>을 정죄하고 죽였습니다. 탐욕이 사람의 생명까지 해칩니다. 이 경고는 고통받는 성도에게는 위로이기도 합니다. <mark>아무도 내 사정을 듣지 않는 것 같아도, 하나님은 그 울음을 이미 들으셨습니다</mark>."], "points": ["하나님이 들으시는 목소리에 교회도 귀 기울여야 합니다. 영향력 있는 사람의 말과 함께, 자기 권리를 말하기 어려운 사람의 이야기도 들어야 합니다."]}, {"title": "적용 · 은혜가 움켜쥔 손을 펴게 합니다", "paragraphs": ["삭개오를 생각해 보십시오. 사람들이 죄인이라 손가락질하던 그가 재산을 나누겠다고 약속하기 전에, 예수님은 먼저 <mark>그의 이름을 부르시고 그의 집에 머물겠다</mark>고 하셨습니다. 예수님을 기쁘게 맞이한 삭개오는 소유의 절반을 가난한 사람에게 나누고, 속여 빼앗은 것이 있다면 네 배로 갚겠다고 선언합니다. 예수님은 \"오늘 구원이 이 집에 이르렀다\"고 말씀하셨습니다. 그의 나눔과 배상은 <mark>예수님을 만난 사람에게 나타난 변화</mark>였습니다.", "예수님은 친히 사람을 섬기시고, 우리를 구원하시기 위해 <mark>\"자기 목숨을 많은 사람의 대속물로\"</mark>(막 10:45) 주셨습니다. 십자가에서 자신을 내어 주신 그 은혜가 우리의 움켜쥔 손도 펴게 합니다.", "오늘 세 가지를 실천해 보십시오. 첫째, <mark>일정표를 펴고</mark> 주님의 뜻보다 앞세운 계획이 있는지 살피고, 알면서 미뤄 온 순종 한 가지를 오늘 시작하십시오. 둘째, <mark>돈의 사용을 돌아보십시오</mark>. 지급하거나 돌려주어야 할 몫이 있다면 바로잡고, 내 형편 안에서 도울 수 있는 이웃을 돌아보십시오. 셋째, <mark>자기 사정을 말하기 어려워하는 사람에게 먼저 물어보십시오</mark>. 그의 이야기를 듣고 필요를 찾아가십시오.", "우리는 내일을 보장할 수 없습니다. 그러나 오늘 주님의 말씀에 순종할 수는 있습니다. 내일을 하나님께 맡기고, <mark>오늘 맡겨진 시간과 물질로 교회 식구들과 이웃을 사랑하십시오</mark>. 하나님을 주님이라 고백하는 믿음이 우리의 일정표와 돈의 사용에서도 드러나기를 바랍니다."], "points": ["내일은 하나님께 맡기고, 오늘 맡겨진 시간과 물질은 주님의 뜻대로 사용하십시오."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "내 계획을 세울 때 '주의 뜻이면'이라는 고백으로 목적과 방법까지 점검했는지 돌아봤다"}, {"key": "c2", "text": "해야 할 선을 알면서 미뤄 둔 순종(사과, 약속, 정직한 처리)이 있는지 점검했다"}, {"key": "c3", "text": "지급하거나 돌려주어야 할 몫을 붙잡고 있지는 않은지 돌아봤다"}, {"key": "c4", "text": "자기 사정을 말하기 어려운 사람의 목소리를 외면하고 있지 않은지 점검했다"}], "s4heading": "묵상 한 줄", "memoHint": "내일은 하나님께 맡기고, 오늘 내가 알고 있는 선 가운데 미루지 않고 실천할 한 가지는 무엇입니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "일정표 점검", "value": "이번 주 일정표를 펴고 주님의 뜻보다 앞세운 계획이 있는지 살펴 '주의 뜻이면'으로 다시 기도하기"}, {"key": "act2", "label": "미룬 순종", "value": "해야 한다고 알면서 미뤄 온 전화 한 통, 사과, 약속 하나를 오늘 실천하기"}, {"key": "act3", "label": "정당한 몫", "value": "돌려주거나 지급해야 할 돈이나 빌린 것이 있다면 오늘 바로 정리하기"}, {"key": "act4", "label": "먼저 묻기", "value": "사정을 잘 말하지 못하는 한 사람에게 먼저 안부를 묻고 필요를 들어 주기"}, {"key": "act5", "label": "말씀 암송", "value": "야고보서 4:15를 외우며 오늘의 계획을 주님께 맡기기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "죄인이라 불리던 삭개오의 이름을 먼저 부르셨듯 우리를 찾아오시고, 자기 목숨을 대속물로 주셔서 움켜쥔 손을 펴게 하시는 예수님께 감사합니다"}, {"key": "p2", "tag": "회개", "text": "생명과 미래가 제 손에 있는 것처럼 계획하고, 해야 할 선을 미루며, 재물을 얻고 쓰는 과정에서 이웃의 정당한 몫과 울음을 외면했던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "내일은 주님께 맡기고 오늘 맡기신 시간과 물질을 주님의 뜻대로 쓰게 하시며, 하나님이 들으시는 약한 이웃의 목소리에 저도 귀 기울이게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "October 23, Friday", "ref": "James 4:13–5:6", "headline": "Does My Faith Show<br>in My Plans and My Money?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · James 4:13-5:6", "s1heading": "Today's Word", "verse": "\"Instead you ought to say,<br>'If the Lord wills, we will live<br>and do this or that.'\"", "verseRef": "James 4:15", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · Faith That Shows in Our Calendars and Wallets", "paragraphs": ["The book of James teaches how faith that confesses Jesus as Lord must show up in everyday life. The previous passage warned that the small tongue can tear down lives and communities, and urged us not to slander our brothers in conflict, because the final Judge of our neighbor is God. Today shows another place where faith must appear: <mark>where we plan for tomorrow, and where we earn and spend money</mark>. We can confess God as Lord with our lips yet put only our own will first when making plans. We can gain and use wealth while ignoring neighbors who suffer in the process. James exposes the pride hidden there.", "Are our calendars and our spending revealing faith that relies on God? The wisdom from above shows itself in our schedules and spending too: the meekness, mercy, and good fruit we learned about must now appear in our planning and our transactions. Zacchaeus experienced such a change when he met Jesus: he declared he would give to the poor and repay what he had unjustly taken. The grace he received changed how he treated money and neighbors. Let's hold onto one truth today: <mark>God is the Master of our lives and our future. So we must use the time and resources entrusted to us today according to His will.</mark> Today's passage has two parts, each beginning with \"Come now\": the first to those who boast about the future, the second to those who hoard wealth while harming their neighbors."], "points": ["Are my calendar and my spending revealing a faith that relies on God?"]}, {"title": "4:13–17 · From Pride That Presumes on Tomorrow to Faith That Obeys Today", "paragraphs": ["Verse 13: <mark>\"Come now, you who say, 'Today or tomorrow we will go into such and such a town and spend a year there and trade and make a profit.'\"</mark> The merchants' plans are very specific: when to leave, which city, how long to stay, what to earn. But they speak as if they could guarantee it all, as though their life and future were entirely in their own hands. Planning and diligent preparation are necessary. But along with 'How much can I earn?' we must ask whether the purpose and method are fitting before God. Check whether there's reliance on God within your plans. Verse 14 compares our life to <mark>\"a mist that appears for a little time and then vanishes.\"</mark> We can set tomorrow's schedule, but we can't guarantee we'll be alive tomorrow. Waking up today, talking with family, and doing the work entrusted to us are gifts from God. Those who know their weakness treasure today — loving the people to love now and fulfilling today's responsibilities.", "In verse 15 James teaches what we should say instead: <mark>\"If the Lord wills, we will live and do this or that.\"</mark> Before accomplishing anything, even our being alive depends on the Lord, so we must entrust both our lives and our plans to Him. This confession is an attitude that reviews our plans before the Word and corrects wrong purposes or methods — and the humility to keep relying on God and re-examine our path when things don't go our way. 'If the Lord wills' must examine even our methods of success. We can't thank God after making a profit while having taken someone else's rightful share in the process. If we seek the Lord's will, we must also look at how we conduct business, how we keep our promises, and the circumstances of those who work for us.", "Verse 16 calls boasting that presumes on the future evil, and verse 17 continues: <mark>\"So whoever knows the right thing to do and fails to do it, for him it is sin.\"</mark> Connected to what precedes, it makes us examine the attitude of knowing we should live humbly by God's will yet putting only our own will first. Our relationships and daily lives are similar: knowing we should apologize but delaying; knowing we should handle something honestly but letting it slide; ignoring a neighbor we could help. Look at verses 14 and 17 together: verse 14 says <mark>we don't know tomorrow</mark>; verse 17 says <mark>we can know the good we ought to do</mark>. Though tomorrow is unknown, we may well know today's good."], "points": ["Are you postponing obedience until the future feels more certain? Start with today's phone call, the wrong you need to admit, the promise you need to keep. Faith that entrusts tomorrow to God shows itself in today's obedience."]}, {"title": "5:1–3 · Wealth Hoarded by Harming Neighbors Becomes Evidence Against Us", "paragraphs": ["The second \"Come now\" is addressed to the rich who withheld wages, defrauded, and oppressed the powerless. James declares, <mark>\"Weep and howl for the miseries that are coming upon you.\"</mark> Money and influence cannot escape God's judgment. Rotted riches, moth-eaten garments, and corroded gold and silver show that the wealth they relied on cannot protect them.", "Even more fearful is the word that <mark>\"their corrosion will be evidence against you.\"</mark> Wealth testifies not only to how much one owned, but to <mark>how it was gained and what it was used for</mark>. If it was hoarded by taking neighbors' shares and ignoring their needs, that accumulation becomes evidence of greed. The warning \"You have laid up treasure in the last days\" exposes people absorbed only in gathering more, at the very time they should be examining their lives before God's judgment. How we gain and use wealth is a matter of faith. Along with whether we have more, we must examine whether honesty and love for neighbor were present in the process."], "points": ["How we earn and use money is a matter of faith — not only how much we have, but whether honesty and love for neighbor were part of the process."]}, {"title": "5:4–6 · Unpaid Wages Cry Out — and God Hears the Cries", "paragraphs": ["Verse 4: <mark>\"Behold, the wages of the laborers who mowed your fields, which you kept back by fraud, are crying out against you, and the cries of the harvesters have reached the ears of the Lord of hosts.\"</mark> Wages are the rightful share of those who work. For people who live day to day, withholding that money can take away even their family's food. <mark>Something isn't mine just because it's in my hands.</mark> Before thinking about how much to give, we must check whether we're holding onto what we ought to pay or return. Offerings and good deeds can't replace that responsibility. The One who hears those workers' cries is the Lord of hosts, and the text declares that their cry has already reached His ears. Do you feel no one is listening to your situation? This Word doesn't promise immediate resolution, but it gives hope that God does not ignore your suffering. And the church must also listen to the voices God hears — not only the words of the influential, but the stories of those who find it hard to speak up or claim their rights.", "In verses 5–6, while the workers weep for unpaid wages, the rich live in luxury. James portrays them as fattening their hearts in a day of slaughter — absorbed in their own satisfaction even as judgment approaches. Verse 6 charges: <mark>\"You have condemned and murdered the righteous person. He does not resist you.\"</mark> In context, this refers to innocent people oppressed by the rich — whether through actual violence, unjust verdicts, or oppression that strips away livelihood to the point of death. Greed harms even human life. 'He does not resist you' shows the plight of the oppressed. This warning is also comfort for suffering believers, which is why verse 7 continues with the call to be patient until the Lord comes. God knows injustice and will judge evil."], "points": ["Along with asking whether my situation has improved, I must ask whether I respected others' rightful share and lives in the process."]}, {"title": "Application · Grace Opens Our Clenched Hands", "paragraphs": ["We began by asking to examine our calendars and spending. Think of Zacchaeus again. Before he ever promised to share his wealth, Jesus — while others pointed at him as a sinner — <mark>called him by name and said He would stay at his house</mark>. Zacchaeus joyfully welcomed Jesus, then declared he would give half his goods to the poor and repay fourfold anyone he had defrauded. Jesus said, \"Today salvation has come to this house.\" His sharing and restitution were <mark>the change that appeared in someone who met Jesus</mark>. A person who received grace began to see his neighbors' needs and his own responsibilities.", "Jesus Himself served people and, to save us, willingly gave His life — as Mark 10:45 says, <mark>\"to give His life as a ransom for many.\"</mark> The grace of Him who gave Himself on the cross opens even our clenched hands.", "So try these three things today. First, <mark>open your calendar</mark> and see if there are plans you've put ahead of the Lord's will; start today one act of obedience you've known you should do but kept postponing. Second, <mark>review your spending</mark>: if there's a share you need to pay or return, set it right; and within your means, look for a neighbor you can help. Third, <mark>ask first those who find it hard to speak about their situation</mark>: listen to their story and go to meet their need.", "We cannot guarantee tomorrow. But we can obey the Lord's Word today. Entrust tomorrow to God, and <mark>with the time and resources entrusted to you today, love your church family and the neighbors around you</mark>. May faith that confesses God as Lord show itself in our calendars and our spending too."], "points": ["Entrust tomorrow to God, and use the time and resources entrusted to you today according to His will."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether I've examined even the purpose and method of my plans with the confession 'If the Lord wills.'"}, {"key": "c2", "text": "I checked whether there's obedience I've postponed while knowing the good I should do (an apology, a promise, an honest resolution)."}, {"key": "c3", "text": "I reflected on whether I'm holding onto a share I ought to pay or return."}, {"key": "c4", "text": "I checked whether I'm ignoring the voices of those who find it hard to speak about their situation."}], "s4heading": "One-Line Reflection", "memoHint": "Entrusting tomorrow to God, what is one good I already know I should do today without delay?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Check Your Calendar", "value": "Open this week's calendar, see if any plan is ahead of the Lord's will, and pray over it again with 'If the Lord wills'"}, {"key": "act2", "label": "Postponed Obedience", "value": "Do today the one call, apology, or promise you've known you should do but kept putting off"}, {"key": "act3", "label": "Rightful Share", "value": "If there's money or something borrowed you need to return or pay, settle it today"}, {"key": "act4", "label": "Ask First", "value": "Check in first on someone who doesn't easily speak about their situation, and listen to their needs"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize James 4:15 and entrust today's plans to the Lord"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, Jesus, for coming to us as You first called Zacchaeus by name, and for giving Your life as a ransom so that our clenched hands can open."}, {"key": "p2", "tag": "Repent", "text": "I repent of planning as if my life and future were in my hands, of postponing the good I should do, and of ignoring my neighbors' rightful share and cries as I gained and used money."}, {"key": "p3", "tag": "Ask", "text": "Help me entrust tomorrow to You and use the time and resources You've entrusted to me today according to Your will. Let me listen, as You do, to the voices of vulnerable neighbors."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Oktubre 23, Biyernes", "ref": "Santiago 4:13–5:6", "headline": "Nakikita Ba ang Aking Pananampalataya<br>sa Aking Plano at Paggamit ng Pera?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Santiago 4:13-5:6", "s1heading": "Salita Ngayon", "verse": "\"Sa halip, dapat ninyong sabihin,<br>'Kung loloobin ng Panginoon, mabubuhay kami<br>at gagawin namin ito o iyon.'\"", "verseRef": "Santiago 4:15", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Pananampalatayang Nakikita sa Ating Kalendaryo at Pitaka", "paragraphs": ["Itinuturo ng aklat ng Santiago kung paano dapat makita sa araw-araw na buhay ang pananampalatayang nagpapahayag kay Jesus bilang Panginoon. Nagbabala ang nakaraang bahagi na kayang sirain ng maliit na dila ang buhay at komunidad, at hinimok tayong huwag siraan ang ating mga kapatid sa alitan, dahil ang Diyos ang huling Hukom ng ating kapwa. Ipinapakita ngayon ang isa pang lugar kung saan dapat makita ang pananampalataya: <mark>kung saan tayo nagpaplano para sa bukas, at kung saan tayo kumikita at gumagastos</mark>. Maaari nating ipahayag ang Diyos bilang Panginoon sa ating labi ngunit inuuna lamang ang sariling kalooban sa pagpaplano. Maaari tayong kumita at gumastos habang binabalewala ang kapwang nagdurusa sa proseso. Inilalantad ni Santiago ang kapalaluang nakatago roon.", "Inihahayag ba ng ating kalendaryo at paggastos ang pananampalatayang umaasa sa Diyos? Nakikita rin ang karunungang mula sa itaas sa ating iskedyul at paggastos: ang kaamuan, habag, at mabuting bungang natutunan natin ay dapat makita ngayon sa ating pagpaplano at transaksyon. Naranasan ni Zaqueo ang ganitong pagbabago nang makilala niya si Jesus: ipinahayag niyang magbibigay siya sa dukha at babayaran ang di-makatarungang kinuha niya. Binago ng biyayang tinanggap niya ang pagtrato niya sa pera at kapwa. Hawakan natin ang isang katotohanan ngayon: <mark>Ang Diyos ang Panginoon ng ating buhay at kinabukasan. Kaya dapat nating gamitin ayon sa Kanyang kalooban ang oras at yamang ipinagkatiwala sa atin ngayon.</mark> May dalawang bahagi ang talata ngayon, bawat isa'y nagsisimula sa \"Makinig kayo\": ang una ay sa mga nagmamayabang tungkol sa kinabukasan, ang ikalawa ay sa mga nag-iipon ng yaman habang sinasaktan ang kapwa."], "points": ["Inihahayag ba ng aking kalendaryo at paggastos ang pananampalatayang umaasa sa Diyos?"]}, {"title": "4:13–17 · Mula sa Kapalaluang Nagmamayabang sa Bukas Tungo sa Pananampalatayang Sumusunod Ngayon", "paragraphs": ["Talata 13: <mark>\"Makinig kayo, kayong nagsasabing, 'Ngayon o bukas ay pupunta kami sa ganoong lungsod at mananatili roon nang isang taon, makikipagkalakalan, at kikita.'\"</mark> Napakatiyak ng plano ng mga mangangalakal: kailan aalis, saang lungsod, gaano katagal, ano ang kikitain. Ngunit nagsasalita sila na parang kaya nilang garantiyahan ang lahat, na parang lubos na nasa kanilang kamay ang kanilang buhay at kinabukasan. Kailangan ang pagpaplano at masipag na paghahanda. Ngunit kasama ng 'Magkano ang kikitain ko?' dapat nating itanong kung angkop sa harap ng Diyos ang layunin at paraan. Suriin kung may pag-asa sa Diyos sa loob ng iyong mga plano. Inihahambing ng talata 14 ang ating buhay sa <mark>\"ulap na lumilitaw nang sandali at pagkatapos ay naglalaho.\"</mark> Maaari nating itakda ang iskedyul bukas, ngunit hindi natin magagarantiya na buhay pa tayo bukas. Ang paggising ngayon, pakikipag-usap sa pamilya, at paggawa ng gawaing ipinagkatiwala ay mga kaloob ng Diyos. Pinahahalagahan ng nakaaalam ng kanilang kahinaan ang araw na ito — iniibig ang dapat ibigin ngayon at ginagampanan ang pananagutan ngayon.", "Sa talata 15, itinuro ni Santiago ang dapat nating sabihin: <mark>\"Kung loloobin ng Panginoon, mabubuhay kami at gagawin namin ito o iyon.\"</mark> Bago pa makamit ang anuman, nakasalalay sa Panginoon maging ang ating pagiging buhay, kaya dapat nating ipagkatiwala sa Kanya kapwa ang ating buhay at mga plano. Ang pagpapahayag na ito ay saloobing sinusuri ang ating mga plano sa harap ng Salita at itinutuwid ang maling layunin o paraan — at ang kababaang-loob na patuloy na umasa sa Diyos at muling suriin ang landas kapag hindi nangyayari ang gusto natin. Dapat suriin ng 'Kung loloobin ng Panginoon' maging ang paraan ng ating pagtatagumpay. Hindi tayo maaaring magpasalamat sa Diyos pagkatapos kumita habang kinuha natin ang nararapat na bahagi ng iba sa proseso. Kung hinahanap natin ang kalooban ng Panginoon, dapat din nating tingnan kung paano tayo nakikipagnegosyo, paano natin tinutupad ang pangako, at ang kalagayan ng mga nagtatrabaho para sa atin.", "Tinatawag ng talata 16 na masama ang pagmamayabang na umaasa sa kinabukasan, at nagpapatuloy ang talata 17: <mark>\"Kaya ang nakaaalam ng tamang gawin ngunit hindi ginagawa ito, iyon ay kasalanan para sa kanya.\"</mark> Kaugnay ng nauna, pinasusuri tayo nito sa saloobing alam nating dapat mamuhay nang mapagpakumbaba ayon sa kalooban ng Diyos ngunit inuuna pa rin ang sariling kalooban. Ganoon din ang ating relasyon at araw-araw na buhay: alam nating dapat humingi ng tawad ngunit ipinagpapaliban; alam nating dapat harapin nang tapat ang isang bagay ngunit pinalalampas; binabalewala ang kapwang matutulungan natin. Tingnan nang magkasama ang talata 14 at 17: sinasabi ng talata 14 na <mark>hindi natin alam ang bukas</mark>; sinasabi ng talata 17 na <mark>maaari nating malaman ang mabuting dapat gawin</mark>. Bagaman hindi alam ang bukas, maaaring alam na natin ang mabuti ngayon."], "points": ["Ipinagpapaliban mo ba ang pagsunod hanggang sa mas tiyak na ang kinabukasan? Magsimula sa tawag ngayon, sa maling dapat aminin, sa pangakong dapat tuparin. Ang pananampalatayang nagpapaubaya ng bukas sa Diyos ay nakikita sa pagsunod ngayon."]}, {"title": "5:1–3 · Ang Yamang Inipon sa Pananakit sa Kapwa ay Nagiging Ebidensya Laban sa Atin", "paragraphs": ["Ang ikalawang \"Makinig kayo\" ay para sa mga mayamang nagkait ng sahod, nandaya, at nang-api sa mga walang kapangyarihan. Ipinahayag ni Santiago, <mark>\"Umiyak kayo at managhoy dahil sa mga kapighatiang darating sa inyo.\"</mark> Hindi makatatakas sa paghatol ng Diyos ang pera at impluwensya. Ang nabulok na yaman, kinain ng tanga na damit, at kinalawang na ginto at pilak ay nagpapakitang hindi sila maipagtatanggol ng yamang inasahan nila.", "Mas nakatatakot pa ang salitang <mark>\"ang kalawang nila ay magiging ebidensya laban sa inyo.\"</mark> Nagpapatotoo ang yaman hindi lamang kung gaano karami ang pag-aari, kundi pati <mark>kung paano ito nakuha at saan ito ginamit</mark>. Kung inipon ito sa pagkuha ng bahagi ng kapwa at pagbalewala sa kanilang pangangailangan, nagiging ebidensya ng kasakiman ang pag-iipong iyon. Ang babalang \"Nag-ipon kayo ng kayamanan sa mga huling araw\" ay naglalantad sa mga taong abala lamang sa pag-iipon pa, sa mismong panahong dapat nilang suriin ang kanilang buhay sa harap ng paghatol ng Diyos. Ang paraan ng pagkuha at paggamit ng yaman ay usapin ng pananampalataya. Kasama ng kung mas marami na tayong pag-aari, dapat nating suriin kung may katapatan at pag-ibig sa kapwa sa proseso."], "points": ["Ang paraan ng pagkita at paggamit ng pera ay usapin ng pananampalataya — hindi lamang kung gaano karami, kundi kung may katapatan at pag-ibig sa kapwa sa proseso."]}, {"title": "5:4–6 · Sumisigaw ang Hindi Ibinayad na Sahod — at Naririnig ng Diyos ang Daing", "paragraphs": ["Talata 4: <mark>\"Narito, ang sahod ng mga manggagawang gumapas sa inyong mga bukid, na inyong ipinagkait sa pandaraya, ay sumisigaw laban sa inyo, at ang daing ng mga nag-ani ay umabot sa pandinig ng Panginoon ng mga hukbo.\"</mark> Ang sahod ay nararapat na bahagi ng nagtatrabaho. Para sa mga nabubuhay sa arawang kita, ang pagkakait ng perang iyon ay maaaring mag-alis pati ng pagkain ng kanilang pamilya. <mark>Hindi akin ang isang bagay dahil lamang nasa aking kamay ito.</mark> Bago isipin kung gaano karami ang ibibigay, dapat nating suriin kung hawak natin ang dapat nating bayaran o ibalik. Hindi mapapalitan ng handog at mabubuting gawa ang pananagutang iyon. Ang nakaririnig sa daing ng mga manggagawang iyon ay ang Panginoon ng mga hukbo, at ipinapahayag ng teksto na umabot na sa Kanyang pandinig ang kanilang daing. Nararamdaman mo bang walang nakikinig sa iyong kalagayan? Hindi nangangako ang Salitang ito ng agarang paglutas, ngunit nagbibigay ito ng pag-asa na hindi binabalewala ng Diyos ang iyong pagdurusa. At dapat ding makinig ang iglesia sa mga tinig na naririnig ng Diyos — hindi lamang sa salita ng maimpluwensya, kundi sa kwento ng mga nahihirapang magsalita o igiit ang kanilang karapatan.", "Sa talata 5–6, habang umiiyak ang mga manggagawa dahil sa hindi ibinayad na sahod, namumuhay sa luho ang mayaman. Inilarawan sila ni Santiago na pinatataba ang kanilang puso sa araw ng katayan — abala sa sariling kasiyahan kahit papalapit ang paghatol. Inaakusahan ng talata 6: <mark>\"Hinatulan at pinatay ninyo ang matuwid; hindi siya lumaban sa inyo.\"</mark> Sa konteksto, tumutukoy ito sa mga walang-salang inapi ng mayaman — sa tunay na karahasan, di-makatarungang hatol, o pang-aaping nag-aalis ng kabuhayan hanggang kamatayan. Sinasaktan ng kasakiman pati ang buhay ng tao. Ipinapakita ng 'hindi siya lumaban sa inyo' ang kalagayan ng inaapi. Ang babalang ito ay aliw din para sa nagdurusang mananampalataya, kaya sinusundan ito ng talata 7 ng panawagang magtiis hanggang sa pagdating ng Panginoon. Alam ng Diyos ang kawalang-katarungan at hahatulan Niya ang kasamaan."], "points": ["Kasama ng pagtatanong kung gumanda ang aking kalagayan, dapat kong itanong kung iginalang ko ang nararapat na bahagi at buhay ng iba sa proseso."]}, {"title": "Aplikasyon · Binubuksan ng Biyaya ang Ating Nakakuyom na Kamay", "paragraphs": ["Nagsimula tayo sa panawagang suriin ang ating kalendaryo at paggastos. Isipin muli si Zaqueo. Bago pa siya nangakong magbabahagi ng kayamanan, si Jesus — habang itinuturo siya ng iba bilang makasalanan — ay <mark>tinawag siya sa pangalan at sinabing tutuloy Siya sa kanyang bahay</mark>. Masayang tinanggap ni Zaqueo si Jesus, at pagkatapos ay ipinahayag na ibibigay niya ang kalahati ng kanyang ari-arian sa dukha at babayaran nang apat na beses ang sinumang nadaya niya. Sinabi ni Jesus, \"Ngayon ay dumating ang kaligtasan sa bahay na ito.\" Ang kanyang pagbabahagi at pagbabayad ay <mark>ang pagbabagong lumitaw sa taong nakatagpo kay Jesus</mark>. Ang taong tumanggap ng biyaya ay nagsimulang makita ang pangangailangan ng kapwa at ang sarili niyang pananagutan.", "Si Jesus mismo ay naglingkod sa tao at, upang iligtas tayo, kusang ibinigay ang Kanyang buhay — gaya ng sinasabi ng Marcos 10:45, <mark>\"upang ibigay ang Kanyang buhay bilang pantubos sa marami.\"</mark> Ang biyaya Niyang nagbigay ng sarili sa krus ay nagbubukas maging ng ating nakakuyom na kamay.", "Kaya subukan ang tatlong bagay na ito ngayon. Una, <mark>buksan ang iyong kalendaryo</mark> at tingnan kung may mga planong inuna mo kaysa sa kalooban ng Panginoon; simulan ngayon ang isang pagsunod na alam mong dapat gawin ngunit patuloy na ipinagpapaliban. Ikalawa, <mark>suriin ang iyong paggastos</mark>: kung may bahaging dapat mong bayaran o ibalik, ituwid ito; at sa loob ng iyong kakayahan, maghanap ng kapwang matutulungan mo. Ikatlo, <mark>unang tanungin ang mga nahihirapang magsalita tungkol sa kanilang kalagayan</mark>: pakinggan ang kanilang kwento at puntahan upang tugunan ang kanilang pangangailangan.", "Hindi natin magagarantiya ang bukas. Ngunit maaari tayong sumunod sa Salita ng Panginoon ngayon. Ipagkatiwala ang bukas sa Diyos, at <mark>sa oras at yamang ipinagkatiwala sa iyo ngayon, ibigin ang iyong pamilya sa iglesia at ang kapwa sa paligid mo</mark>. Nawa'y makita rin sa ating kalendaryo at paggastos ang pananampalatayang nagpapahayag sa Diyos bilang Panginoon."], "points": ["Ipagkatiwala ang bukas sa Diyos, at gamitin ayon sa Kanyang kalooban ang oras at yamang ipinagkatiwala sa iyo ngayon."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung sinuri ko maging ang layunin at paraan ng aking mga plano sa pagpapahayag ng 'Kung loloobin ng Panginoon.'"}, {"key": "c2", "text": "Sinuri ko kung may pagsunod akong ipinagpaliban habang alam ang mabuting dapat gawin (paghingi ng tawad, pangako, tapat na pag-aayos)."}, {"key": "c3", "text": "Pinag-isipan ko kung may hawak akong bahaging dapat kong bayaran o ibalik."}, {"key": "c4", "text": "Sinuri ko kung binabalewala ko ang tinig ng mga nahihirapang magsalita tungkol sa kanilang kalagayan."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Sa pagpapaubaya ng bukas sa Diyos, ano ang isang mabuting alam ko nang dapat kong gawin ngayon nang hindi ipinagpapaliban?", "memoPlaceholder": "Sapat na ang isang pangungusap  "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-10-23';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
