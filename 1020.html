<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>만나 큐티</title>
<meta property="og:title" content="10/20(화) 큐티 · 야고보서 3:1–12">
<meta property="og:description" content="내 말은 복이 되고 있습니까, 독이 되고 있습니까?">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>
<div class="wrap">

<div class="top">
  <button class="bgm" id="bgm">🎵 <span id="bgmLabel">묵상 음악</span> <span class="bar"><i></i><i></i><i></i></span></button>
  <div class="topRight">
    <span class="langsw" id="langsw">
      <button data-lang="ko">한국어</button><button data-lang="en">English</button><button data-lang="tl">Tagalog</button>
    </span>
    <span class="fs"><span id="fontLabel">글자</span> <button data-f="f1"><b>가</b></button><button data-f="" class="on"><b>가</b></button><button data-f="f3"><b>가</b></button></span>
  </div>
</div>

<header>
  <div class="kicker" id="kickerEl">Daily Bible QT</div>

  <div class="play"></div>

</a>

    <span id="verseEl"></span>

<section>

<section>
  <h2><span class="n">3</span><span id="s3heading"></span></h2>

<section>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "10월 20일 화요일", "ref": "야고보서 3장 1–12절", "headline": "내 말은 복이 되고 있습니까,<br>독이 되고 있습니까?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 야고보서 3:1-12", "s1heading": "오늘의 말씀", "verse": "\"한 입으로 찬송과 저주가 나오는도다<br>내 형제들아 이것이 마땅하지 아니하니라\"", "verseRef": "야고보서 3:10", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 손이 움직이는지, 입에서 무엇이 나오는지", "paragraphs": ["앞에서 야고보는 도움이 필요한 이웃에게 좋은 말만 하고 실제로 돕지 않는 믿음을 책망했습니다. 오늘은 <mark>우리의 말 자체</mark>를 돌아보게 합니다. 이미 1장에서 \"듣기는 속히 하고 말하기는 더디 하라\"(1:19), \"혀를 재갈 물리지 아니하면 경건은 헛것\"(1:26)이라 했던 주제를 본격적으로 펼칩니다. 앞에서 이웃을 향해 손이 움직이는지를 물었다면, 이제는 <mark>그 이웃을 향해 입에서 어떤 말이 나오는지</mark>를 묻습니다.", "하나님은 말씀으로 세상을 지으셨고 우리를 자신의 형상으로 만드셨습니다. 그래서 우리의 말에는 사람을 격려하고 관계를 세우는 힘도, 사람을 무너뜨리는 힘도 있습니다. 부부 사이가 멀어질 때도 서운함이 비난이 되고, 비난이 반복되면서 상대의 마음을 들을 수 없게 됩니다. 오늘은 다른 사람의 얼굴보다 <mark>나의 말을 먼저</mark> 살펴보면 좋겠습니다."], "points": ["내 입술에서 나오는 말은 사람에게 복이 되고 있습니까, 아니면 독이 되고 있습니까?"]}, {"title": "1–2절 · 말을 맡은 사람은 자신의 말부터 말씀 아래 두어야 합니다", "paragraphs": ["<mark>\"선생된 우리가 더 큰 심판을 받을 줄 알고 선생이 많이 되지 말라\"</mark>. 가르치는 사람의 말은 듣는 사람이 하나님을 어떻게 이해하고 무엇을 선택하며 사람을 어떻게 대하는지에 영향을 줍니다. 그래서 가르치는 자리는 맡겨진 영향력에 책임을 지는 자리입니다. 야고보는 자신도 그 책임에 포함시킵니다. 바른 내용을 가르치면서도 상대를 무시하거나, 권위를 지키려고 다른 사람을 깎아내릴 수 있습니다. <mark>많이 안다는 것과 사람을 잘 세울 준비가 된 것은 다릅니다</mark>.", "<mark>\"우리가 다 실수가 많으니 만일 말에 실수가 없는 자라면 곧 온전한 사람이라\"</mark>. 누구나 넘어지기에 자신을 과신해서는 안 되지만, 누구나 넘어진다는 이유로 말의 죄를 가볍게 여겨서도 안 됩니다. \"원래 제 성격이 그래요\"가 아니라, 잘못 말했을 때는 \"그런 뜻이 아니었어요\"라는 설명에 머물지 않고 <mark>\"제가 그렇게 말한 것은 잘못했습니다\"</mark>라고 먼저 인정하는 것이 성숙입니다."], "points": ["상처를 주었다면 사과하고, 잘못된 이야기를 전했다면 정정하는 것이 우리의 순종입니다."]}, {"title": "3–8절 · 작은 혀가 삶 전체를 움직입니다", "paragraphs": ["말의 입에 물린 작은 재갈이 온몸을 이끌고, 작은 키가 광풍에 밀리는 큰 배의 방향을 조절합니다. <mark>크기와 영향력은 비례하지 않습니다</mark>. 짧은 사과 한마디가 멀어진 관계를 다시 열고, 무심코 던진 비난이 대화 전체를 싸움으로 바꿉니다. 다스려진 말은 삶과 공동체를 바른 방향으로 이끌 수 있습니다.", "그러나 <mark>\"보라 얼마나 작은 불이 얼마나 많은 나무를 태우는가\"</mark>. 한 사람에게 전한 뒷말에 추측과 해석이 더해지면 공동체 전체에 불신이 퍼집니다. 혀는 \"온 몸을 더럽히고 삶의 수레바퀴를 불사르나니\", 사람을 해치는 말은 사소한 버릇이 아닙니다. 사람은 온갖 짐승을 길들였지만 혀는 길들이지 못합니다. <mark>\"쉬지 아니하는 악이요 죽이는 독이 가득한 것\"</mark>입니다. 지식과 경력과 직분이 언어의 성숙을 자동으로 만들어 주지 않습니다."], "points": ["말한 사람에게는 끝난 말이, 들은 사람에게는 계속되는 말일 수 있습니다. 내 의도만 설명하지 말고 그 말이 무엇을 남겼는지 살펴야 합니다."]}, {"title": "9–12절 · 하나님을 찬송하는 입으로 하나님의 형상을 저주하지 마십시오", "paragraphs": ["<mark>\"이것으로 우리가 주 아버지를 찬송하고 또 이것으로 하나님의 형상대로 지음을 받은 사람을 저주하나니\"</mark>. 사람을 존중해야 하는 근거는 그가 유능하거나 친절하거나 내 의견에 동의해서가 아니라, <mark>하나님이 그를 자신의 형상으로 지으셨기 때문</mark>입니다. 잘못을 분명히 지적해야 할 때도 그 사람의 존재 자체를 경멸해서는 안 됩니다. 내 감정이 말의 최종 기준이 될 수 없습니다. 교회에서 하나님을 높였다는 사실이 가정에서 준 상처를 없애 주지 않습니다.", "샘이 한 구멍으로 단 물과 쓴 물을 내지 못하고, 무화과나무가 감람 열매를 맺지 못합니다. 앞의 '키'가 말이 어디로 이끄는지를 보여 주었다면, '샘'은 <mark>말이 어디에서 나오는지</mark>를 보여 줍니다. 경멸과 비난이 반복된다면 그 말을 낳는 마음의 뿌리, 곧 시기와 분노, 우월감과 지배욕을 살펴야 합니다. 그러나 마음이 바뀔 때까지 상처 주는 말을 계속할 수는 없습니다. 지금 멈춰야 할 말은 멈추고, 그 마음도 하나님께 내어 드려야 합니다."], "points": ["2절은 넘어지는 우리를 정직하게 보게 하고, 10절은 그 자리에 머물지 않도록 부릅니다. \"이것이 마땅하지 아니하니라.\""]}, {"title": "적용 · 은혜가 사과의 말로, 사랑이 존중의 말로, 소망이 회복의 말로", "paragraphs": ["그렇다면 아무도 혀를 길들일 수 없으니 포기해야 합니까? 아닙니다. 야고보는 앞에서 <mark>하나님께 지혜를 구하고 마음에 심어진 말씀을 온유하게 받으라</mark>고 했고, 뒤에서는 하나님이 겸손한 자에게 은혜를 주신다고 말합니다. 말의 문제 앞에서도 그 지혜와 은혜가 필요합니다. 화를 내기 전에 멈추고, 반박하기 전에 듣고, 보내려던 문장을 다시 읽는 작은 순종이 필요합니다.", "그 길을 예수님이 보여 주셨습니다. <mark>\"그 입에 거짓도 없으시며 욕을 당하시되 맞대어 욕하지 아니하시고… 오직 공의로 심판하시는 이에게 부탁하시며\"</mark>(벧전 2:22–23). 그리고 십자가에서 우리 죄를 담당하셔서 우리가 죄에 대하여 죽고 의에 대하여 살게 하셨습니다. 우리의 변화는 그 은혜에서 시작됩니다. 말의 죄까지 주님 앞에 인정하고 용서를 구할 수 있고, 부활하신 주님이 계시기에 오래된 말버릇 앞에서도 새롭게 순종할 수 있습니다.", "십자가의 은혜를 기억하면 <mark>\"제가 잘못했습니다\"</mark>라고 말할 수 있습니다. 부활의 주님을 신뢰하면 사람을 실패한 모습에 영원히 가두는 말을 경계하게 됩니다. 완성될 하나님 나라를 바라보면 모든 판단을 내 말로 끝내려 하지 않고, 진실하게 말하면서도 하나님께 맡길 수 있습니다. 복음은 잘못을 인정할 정직함과 회복을 바라볼 소망을 함께 줍니다.", "가까운 사람에게 먼저 시작해 보십시오. <mark>변명하던 자리에서 잘못을 인정하고, 상대의 말을 끊던 자리에서 끝까지 들어 주십시오</mark>. 필요한 책망을 하더라도 그 사람의 존엄을 지키며 말하십시오. 하나님이 진리의 말씀으로 우리를 낳으셨으니, 이제 그 말씀으로 살아난 우리의 입술에서도 복음의 열매가 맺혀야 합니다."], "points": ["내가 용서받은 은혜가 사과하는 말이 되고, 내가 받은 사랑이 존중하는 말이 되며, 내가 믿는 부활의 소망이 사람의 회복을 돕는 말이 되기를 바랍니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "가정이나 가까운 관계에서 서운함이 비난의 말로 바뀌고 있지는 않은지 돌아봤다"}, {"key": "c2", "text": "잘못 말했을 때 '그런 뜻이 아니었다'는 설명에 머물지 않고 먼저 잘못을 인정했는지 점검했다"}, {"key": "c3", "text": "내가 퍼뜨리거나 덧붙인 뒷말이 누군가의 신뢰를 무너뜨리고 있지 않은지 돌아봤다"}, {"key": "c4", "text": "교회에서의 찬송과 가정·직장에서 사람을 대하는 말이 일치하는지 점검했다"}], "s4heading": "묵상 한 줄", "memoHint": "오늘 사과의 말이나 존중의 말로 바꾸어야 할, 내가 가까운 사람에게 했던 말은 무엇입니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "먼저 인정하기", "value": "최근 상처 준 말이 있다면 변명 없이 '제가 그렇게 말한 것은 잘못했습니다'라고 사과하기"}, {"key": "act2", "label": "끝까지 듣기", "value": "오늘 대화에서 상대의 말을 끊지 않고 끝까지 들은 뒤 대답하기"}, {"key": "act3", "label": "보내기 전 다시 읽기", "value": "감정이 실린 메시지는 보내기 전에 한 번 더 읽고, 필요하면 고치거나 보내지 않기"}, {"key": "act4", "label": "뒷말 멈추기", "value": "누군가에 대한 뒷말이 시작되면 그 자리에서 대화를 멈추거나 좋은 방향으로 돌리기"}, {"key": "act5", "label": "말씀 암송", "value": "야고보서 3:10을 외우며 찬송하는 입으로 사람을 세우는 말을 하기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "욕을 당하시되 맞대어 욕하지 않으시고, 십자가에서 우리 죄를 담당하셔서 우리가 의에 대하여 살게 하신 예수님께 감사합니다"}, {"key": "p2", "tag": "회개", "text": "하나님을 찬송하는 입으로 하나님의 형상을 지닌 사람을 비난하고 깎아내렸으며, 잘못을 인정하기보다 변명했던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "성령님, 제 혀를 다스려 주시고 말을 낳는 마음의 뿌리까지 새롭게 하셔서, 제 입술에서 사과와 존중과 회복을 돕는 복된 말이 흘러나오게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "October 20, Tuesday", "ref": "James 3:1–12", "headline": "Are My Words a Blessing —<br>or a Poison?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · James 3:1-12", "s1heading": "Today's Word", "verse": "\"From the same mouth come blessing and cursing.<br>My brothers, these things ought not to be so.\"", "verseRef": "James 3:10", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · Are My Hands Moving — and What Comes Out of My Mouth?", "paragraphs": ["In the previous passage, James stressed that our confession of faith and our actual lives cannot be separated. If we only speak kind words to a brother or sister in need and don't actually give what they need, that faith can't be called living faith. Today's passage makes us examine <mark>our words themselves</mark>, because along with helping our neighbor, how we speak to them also matters. This builds on the earlier teaching and fully develops the issue of speech James already raised in chapter 1: \"Let every person be quick to hear, slow to speak\" (1:19), and \"If anyone thinks he is religious and does not bridle his tongue… this person's religion is worthless\" (1:26). If before we were asked whether our hands move toward neighbors in need, now we're asked <mark>what words come out of our mouths toward those neighbors</mark>.", "As we meditate today, let's examine <mark>our own words first</mark>, before picturing other people's faces. Restrained words build relationships, but words handed over to anger can leave deep wounds. God created the world by His Word and made us in His image. Our words, too, have power to encourage people and build relationships — and also a harmful power to tear people down. When a married couple grows distant, the conflict often surfaces in words: disappointment turns into criticism, and as criticism repeats, we can no longer hear the other's heart. When we forget the gospel and look at each other, we easily get trapped in words that defend ourselves and condemn the other. How then should the words of people who hold the grace of the cross, the power of the resurrection, and the hope of God's kingdom be different?"], "points": ["Are the words that come from my lips a blessing to people — or a poison?"]}, {"title": "Verses 1–2 · Those Entrusted with Words Must First Place Their Own Words Under the Word", "paragraphs": ["In verse 1, James warns against rushing to become teachers: <mark>\"Not many of you should become teachers, my brothers, for you know that we who teach will be judged with greater strictness.\"</mark> A teacher's words don't end with the teacher; they influence how hearers understand God, what they choose, and how they treat others. So the teaching role is one of responsibility for entrusted influence. This doesn't mean every church teacher will be condemned; it's a warning to seriously reflect on how we've served the Word and the people God entrusted to us. James includes himself in this responsibility: the Word we deliver to others must first apply to us. Pastors and teachers must ask: How well am I explaining the Word? And how are my words, as I deliver it, treating people? We can teach right content while disregarding people, or tear others down to protect our authority. So we must examine both our teaching and our speech. <mark>Having a lot to teach is different from being ready to teach</mark>; knowing much doesn't by itself mean we can build people up well.", "In verse 2, James admits, <mark>\"For we all stumble in many ways. And if anyone does not stumble in what he says, he is a perfect man, able also to bridle his whole body.\"</mark> James himself and teachers are no exception. Controlling the tongue is that difficult, and speech is deeply connected to all of life. Wholeness here doesn't stop at polishing expressions; it looks to a life where words, heart, and actions are not divided before God. Since everyone stumbles, no one should be overconfident. Yet we must not take sins of speech lightly just because everyone stumbles. When we slip in speech, we often say, 'That's just my personality.' But even the language through which that personality shows must be brought before God's Word. When we've spoken wrongly, we must not stop at explaining, 'That's not what I meant,' but first acknowledge, <mark>'I was wrong to say that.'</mark> Maturity shows in accepting responsibility for our words and correcting them."], "points": ["If we've hurt someone, we apologize; if we've passed on something false, we correct it. That is our obedience."]}, {"title": "Verses 3–8 · A Small Tongue Steers a Whole Life", "paragraphs": ["In verse 3, the bit in a horse's mouth is small, yet it guides the whole body. A ship's rudder, small compared to the ship, steers it even when driven by strong winds. The point of both images: <mark>size and influence are not proportional</mark>. So with our words. A brief apology can reopen a distant relationship; a careless criticism can turn a whole conversation into a fight. Words express the heart and also shape later actions and relationships. If we keep speaking dismissively of someone, it becomes easier to treat them carelessly. If we honestly admit wrong, the next steps toward restoration open up. The bit and rudder also show the beneficial potential of speech: governed words can lead our lives and community in the right direction.", "From the middle of verse 5, the image changes from bit and rudder to a small fire: <mark>\"How great a forest is set ablaze by such a small fire!\"</mark> A spark is tiny, but once fire spreads, even the one who lit it can't control its reach. Gossip told to one person passes to another; with guesses and interpretations added, distrust can spread through the whole community. We sometimes see this in churches: I only spoke briefly, but someone's trust can be broken for a long time. Verse 6 says the tongue stains the whole body and sets on fire the entire course of life — and connects that fire to hell. The sin of speech doesn't end at the mouth; it can destructively affect all of life's relationships. Harmful words can't be dismissed as trivial habits. So after speaking, we must look not only at our intentions but at what our words left behind.", "In verses 7–8, humans have tamed every kind of animal, yet cannot fully govern the small tongue in their own mouth. This contrast deflates our confidence. Managing other things skillfully doesn't mean we govern our words. Knowledge, experience, and church position don't automatically produce mature speech. James describes the tongue as <mark>\"a restless evil, full of deadly poison\"</mark> — quiet most of the time, but when anger or rivalry is stirred, words that harm people can burst out."], "points": ["Words that are finished for the speaker may keep going for the hearer. Remember this."]}, {"title": "Verses 9–12 · Don't Curse God's Image with the Mouth That Praises God", "paragraphs": ["In verse 9, James exposes the contradiction: <mark>\"With it we bless our Lord and Father, and with it we curse people who are made in the likeness of God.\"</mark> Who are those people? People created in God's image. The basis for respecting people isn't that they're competent, kind to me, or agree with me — it's that <mark>God made them in His image</mark>. People of different faith, people who make me uncomfortable — they bear that image too. We may be disappointed in someone. There are times to point out wrongs clearly and give needed rebuke. Even then, we must not treat their very existence as worthless or hold them in contempt. My feelings can't be the final standard for how I speak to someone; before what I think of them, I must remember how God made them.", "Verse 10: \"From the same mouth come blessing and cursing. My brothers, these things ought not to be so.\" James knows our reality well, but he doesn't accept it as normal Christian life. Verses 2 and 10 must be read together: verse 2 makes us honestly see that we stumble; verse 10 calls us not to stay there. Having prayed and praised a lot doesn't make criticism and mockery light. Having exalted God at church doesn't erase wounds we gave people at home. Religious words don't cover our responsibility for harmful words. Our confession toward God must bear fruit in how we speak to people.", "In verses 11–12, water from a spring reveals the nature of the spring. A fig tree doesn't bear olives, nor a grapevine figs; fruit is connected to the tree that bears it. So with our words. If contempt and criticism keep coming out, we must examine, along with our expressions, <mark>the roots of the heart that produces those words</mark> — envy, anger, superiority, and the desire to dominate. This doesn't mean concluding that someone isn't saved because of one big wrong; James acknowledged all our weaknesses. But those who have received new life must bear the fruit of speech fitting that life. Earlier, the rudder showed where words lead; now the spring shows where words come from. Words reveal the heart and affect life's direction, so examining the heart and actually restraining our words must go together. We can't keep speaking hurtful words while waiting for the heart to change. Stop the words that must stop now, admit the wrongs that must be admitted, and give the heart that produces those words to God."], "points": ["A heart that treasures God must lead to words that treasure the people God made."]}, {"title": "Application · Grace Becoming Apology, Love Becoming Respect, Hope Becoming Words of Restoration", "paragraphs": ["Then, since no one can tame the tongue, should we just give up? No. In verse 10 James says blessing and cursing from the same mouth ought not to be. We must acknowledge our limits yet bear responsibility for our words, keep watch, and learn restraint. Earlier James urged us to <mark>ask God for wisdom and receive with meekness the implanted Word</mark>; later he says God gives grace to the humble. We need that wisdom and grace in the matter of speech, too. We need small acts of obedience: stopping before getting angry, listening before rebutting, rereading a message before sending it. Restraint in speech means acknowledging our weakness, asking for God's wisdom, and obeying in the very word we're about to say.", "Jesus showed us the way. 1 Peter 2 testifies that <mark>no deceit was found in His mouth; when He was reviled, He did not revile in return, but continued entrusting Himself to Him who judges justly</mark>. And on the cross He bore our sins so that we might die to sin and live to righteousness. Our change begins in that grace. We can acknowledge even our sins of speech before the Lord and ask forgiveness. Because Jesus conquered death and rose again, even before long-standing habits of sin we can seek His help and obey anew.", "Remembering the grace of the cross, we can say, <mark>'I was wrong.'</mark> Trusting the risen Lord, we'll guard against words that imprison people forever in their failures. Looking to the kingdom of God that will be completed, we won't try to make our words the final judgment, but can speak truthfully while entrusting things to God. The gospel gives us both honesty to admit wrong and hope to look toward restoration.", "Start with the people closest to you. <mark>Where you once made excuses, admit your wrong; where you once cut people off, listen to the end.</mark> Even when a rebuke is necessary, speak in a way that protects the person's dignity. God brought us forth by the word of truth; now the fruit of the gospel must grow on the lips of those brought to life by that Word."], "points": ["May the grace by which I've been forgiven become words of apology; may the love I've received become words of respect; and may my hope in the resurrection become words that help people be restored."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether disappointment is turning into words of criticism at home or in close relationships."}, {"key": "c2", "text": "I checked whether, when I spoke wrongly, I acknowledged the wrong first rather than stopping at 'That's not what I meant.'"}, {"key": "c3", "text": "I reflected on whether gossip I've spread or added to is breaking down someone's trust."}, {"key": "c4", "text": "I checked whether my praise at church matches the words I use toward people at home and work."}], "s4heading": "One-Line Reflection", "memoHint": "What words I said to someone close to me should I turn into words of apology or respect today?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Admit First", "value": "If you've recently said something hurtful, apologize without excuses: 'I was wrong to say that'"}, {"key": "act2", "label": "Listen to the End", "value": "In today's conversations, don't interrupt — listen to the end before answering"}, {"key": "act3", "label": "Reread Before Sending", "value": "Before sending an emotional message, reread it once more and revise or don't send it if needed"}, {"key": "act4", "label": "Stop the Gossip", "value": "When gossip about someone starts, stop the conversation there or steer it in a good direction"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize James 3:10 and use the mouth that praises God to speak words that build people up"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, Jesus, who when reviled did not revile in return, and who bore our sins on the cross so we might live to righteousness."}, {"key": "p2", "tag": "Repent", "text": "I repent of criticizing and tearing down people made in God's image with the same mouth that praises You, and of making excuses rather than admitting my wrongs."}, {"key": "p3", "tag": "Ask", "text": "Holy Spirit, govern my tongue and renew even the roots of the heart that produces my words, so that blessed words of apology, respect, and restoration flow from my lips."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Oktubre 20, Martes", "ref": "Santiago 3:1–12", "headline": "Ang Aking mga Salita ba'y Pagpapala —<br>o Lason?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Santiago 3:1-12", "s1heading": "Salita Ngayon", "verse": "\"Mula sa iisang bibig ay lumalabas ang pagpapala at sumpa.<br>Mga kapatid ko, hindi dapat ganito.\"", "verseRef": "Santiago 3:10", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Kumikilos Ba ang Aking mga Kamay — at Ano ang Lumalabas sa Aking Bibig?", "paragraphs": ["Sa nakaraang bahagi, idiniin ni Santiago na hindi mapaghihiwalay ang ating pagpapahayag ng pananampalataya at ang tunay nating buhay. Kung mabubuting salita lamang ang sinasabi natin sa nangangailangang kapatid at hindi natin ibinibigay ang kailangan niya, hindi matatawag na buhay ang pananampalatayang iyon. Pinasusuri tayo ng talata ngayon sa <mark>ating mga salita mismo</mark>, dahil kasama ng pagtulong sa kapwa, mahalaga rin kung paano tayo nagsasalita sa kanila. Ipinagpapatuloy nito ang naunang turo at ganap na pinalalawak ang usapin ng pananalitang binanggit na ni Santiago sa kabanata 1: \"Ang bawat tao ay maging maagap sa pakikinig, mabagal sa pagsasalita\" (1:19), at \"Kung inaakala ng sinuman na siya'y relihiyoso ngunit hindi pinipigilan ang kanyang dila… walang kabuluhan ang kanyang relihiyon\" (1:26). Kung dati'y itinanong kung kumikilos ba ang ating kamay tungo sa nangangailangang kapwa, ngayon ay itinatanong kung <mark>anong mga salita ang lumalabas sa ating bibig tungo sa kapwang iyon</mark>.", "Habang nagninilay tayo ngayon, suriin muna natin <mark>ang sarili nating mga salita</mark>, bago isipin ang mukha ng iba. Ang mga salitang napipigilan ay nagpapatibay ng relasyon, ngunit ang mga salitang ipinaubaya sa galit ay maaaring mag-iwan ng malalim na sugat. Nilikha ng Diyos ang mundo sa pamamagitan ng Kanyang Salita at ginawa tayo ayon sa Kanyang larawan. Ang ating mga salita rin ay may kapangyarihang magpalakas-loob at magpatibay ng relasyon — at mapanirang kapangyarihan ding magpabagsak ng tao. Kapag lumalayo ang mag-asawa, madalas lumilitaw ang alitan sa salita: nagiging pagpuna ang pagtatampo, at habang umuulit ang pagpuna, hindi na natin marinig ang puso ng isa't isa. Kapag nakalimutan natin ang ebanghelyo at nagtinginan sa isa't isa, madali tayong makulong sa mga salitang nagtatanggol sa sarili at humahatol sa iba. Kung gayon, paano dapat maging iba ang mga salita ng mga taong taglay ang biyaya ng krus, kapangyarihan ng muling pagkabuhay, at pag-asa sa kaharian ng Diyos?"], "points": ["Ang mga salitang lumalabas sa aking labi ba ay pagpapala sa tao — o lason?"]}, {"title": "Talata 1–2 · Ang Pinagkatiwalaan ng Salita ay Dapat Munang Ilagay ang Sariling Salita sa Ilalim ng Salita", "paragraphs": ["Sa talata 1, nagbabala si Santiago laban sa pagmamadaling maging guro: <mark>\"Huwag maging guro ang marami sa inyo, mga kapatid ko, sapagkat alam ninyong kaming nagtuturo ay hahatulan nang mas mahigpit.\"</mark> Hindi natatapos sa guro ang kanyang mga salita; naiimpluwensyahan nito kung paano nauunawaan ng nakikinig ang Diyos, ano ang kanilang pinipili, at paano nila tinatrato ang iba. Kaya ang tungkulin ng pagtuturo ay pananagutan sa ipinagkatiwalang impluwensya. Hindi ito nangangahulugang hahatulan ang bawat guro sa iglesia; babala ito upang seryosong pagnilayan kung paano natin pinaglingkuran ang Salita at mga taong ipinagkatiwala ng Diyos. Isinasama ni Santiago ang sarili sa pananagutang ito: ang Salitang inihahatid natin sa iba ay dapat munang ilapat sa atin. Dapat magtanong ang mga pastor at guro: Gaano kahusay ko ipinaliliwanag ang Salita? At paano tinatrato ng aking mga salita ang tao habang inihahatid ko ito? Maaari tayong magturo ng tamang nilalaman habang binabalewala ang tao, o magpabagsak ng iba upang protektahan ang ating awtoridad. Kaya dapat nating suriin kapwa ang ating turo at pananalita. <mark>Iba ang pagkakaroon ng maraming ituturo sa pagiging handang magturo</mark>; ang maraming kaalaman ay hindi nangangahulugang kaya nating patibayin nang mabuti ang tao.", "Sa talata 2, inamin ni Santiago, <mark>\"Sapagkat tayong lahat ay natitisod sa maraming paraan. At kung ang sinuman ay hindi natitisod sa kanyang pananalita, siya'y taong ganap, na kaya ring pigilan ang buong katawan.\"</mark> Hindi eksepsiyon si Santiago mismo at ang mga guro. Ganoon kahirap pigilan ang dila, at malalim na nakaugnay ang pananalita sa buong buhay. Ang kabuuan dito ay hindi humihinto sa pagpapakinis ng pananalita; tumitingin ito sa buhay kung saan hindi nahahati ang salita, puso, at kilos sa harap ng Diyos. Dahil natitisod ang lahat, walang dapat labis na magtiwala sa sarili. Gayunman, hindi natin dapat balewalain ang kasalanan ng pananalita dahil lamang natitisod ang lahat. Kapag nagkakamali tayo sa pananalita, madalas nating sabihin, 'Ganyan lang talaga ang ugali ko.' Ngunit maging ang wikang nagpapakita ng ugaling iyon ay dapat dalhin sa harap ng Salita ng Diyos. Kapag mali ang ating nasabi, hindi tayo dapat huminto sa pagpapaliwanag na, 'Hindi iyon ang ibig kong sabihin,' kundi unang aminin, <mark>'Mali ang pagsasabi ko niyon.'</mark> Nakikita ang pagkahinog sa pag-ako ng pananagutan sa ating mga salita at pagtutuwid sa mga ito."], "points": ["Kung nakasakit tayo, humingi ng tawad; kung nagpasa tayo ng maling kwento, ituwid ito. Iyan ang ating pagsunod."]}, {"title": "Talata 3–8 · Pinapatnubayan ng Maliit na Dila ang Buong Buhay", "paragraphs": ["Sa talata 3, maliit ang renda sa bibig ng kabayo, ngunit pinapatnubayan nito ang buong katawan. Ang timon ng barko, maliit kumpara sa barko, ay nagdidirekta rito kahit itinutulak ng malakas na hangin. Ang punto ng dalawang larawan: <mark>hindi magkatimbang ang laki at impluwensya</mark>. Ganoon din ang ating mga salita. Ang maikling paghingi ng tawad ay maaaring muling magbukas ng malayong relasyon; ang pabayang pagpuna ay maaaring gawing away ang buong usapan. Inihahayag ng salita ang puso at hinuhubog din ang susunod na kilos at relasyon. Kung patuloy tayong nagsasalita nang pahamak tungkol sa isang tao, mas madali na siyang tratuhin nang basta-basta. Kung tapat nating aaminin ang mali, nabubuksan ang susunod na hakbang tungo sa pagpapanumbalik. Ipinapakita rin ng renda at timon ang kapaki-pakinabang na potensyal ng pananalita: maaaring akayin ng mga salitang napipigilan ang ating buhay at komunidad sa tamang direksyon.", "Mula sa gitna ng talata 5, nagbago ang larawan mula renda at timon tungo sa maliit na apoy: <mark>\"Napakalaking gubat ang nasusunog ng napakaliit na apoy!\"</mark> Napakaliit ng siklab, ngunit kapag kumalat ang apoy, kahit ang nagsindi ay hindi na makontrol ang abot nito. Ang tsismis na sinabi sa isang tao ay naipapasa sa iba; kapag dinagdagan ng hula at interpretasyon, maaaring kumalat ang kawalang-tiwala sa buong komunidad. Minsan nakikita natin ito sa iglesia: sandali lang akong nagsalita, ngunit maaaring masira nang matagal ang tiwala ng isang tao. Sinasabi ng talata 6 na dinudungisan ng dila ang buong katawan at sinusunog ang buong takbo ng buhay — at iniuugnay ang apoy na iyon sa impiyerno. Ang kasalanan ng pananalita ay hindi natatapos sa bibig; maaari itong mapanirang makaapekto sa lahat ng relasyon sa buhay. Hindi maipapasa bilang maliit na ugali ang mga salitang nakasasakit. Kaya pagkatapos magsalita, dapat nating tingnan hindi lamang ang ating intensyon kundi kung ano ang iniwan ng ating mga salita.", "Sa talata 7–8, napaamo na ng tao ang lahat ng uri ng hayop, ngunit hindi lubusang mapigilan ang maliit na dila sa sarili niyang bibig. Ibinababa ng paghahambing na ito ang ating pagtitiwala sa sarili. Ang mahusay na pamamahala sa ibang bagay ay hindi nangangahulugang napipigilan natin ang ating mga salita. Hindi awtomatikong nagbubunga ng hinog na pananalita ang kaalaman, karanasan, at posisyon sa iglesia. Inilarawan ni Santiago ang dila bilang <mark>\"walang-tigil na kasamaan, puno ng nakamamatay na lason\"</mark> — tahimik kadalasan, ngunit kapag napukaw ang galit o tunggalian, maaaring sumabog ang mga salitang nakasasakit ng tao."], "points": ["Ang mga salitang tapos na para sa nagsalita ay maaaring nagpapatuloy pa para sa nakarinig. Tandaan ito."]}, {"title": "Talata 9–12 · Huwag Sumpain ang Larawan ng Diyos gamit ang Bibig na Pumupuri sa Diyos", "paragraphs": ["Sa talata 9, inilantad ni Santiago ang kontradiksyon: <mark>\"Dito'y pinupuri natin ang ating Panginoon at Ama, at dito rin ay isinusumpa natin ang mga taong nilikha ayon sa wangis ng Diyos.\"</mark> Sino ang mga taong iyon? Mga taong nilikha ayon sa larawan ng Diyos. Ang batayan ng paggalang sa tao ay hindi dahil mahusay sila, mabait sa akin, o sang-ayon sa akin — kundi dahil <mark>nilikha sila ng Diyos ayon sa Kanyang larawan</mark>. Ang mga taong iba ang pananampalataya, ang mga taong hindi ako komportable — taglay din nila ang larawang iyon. Maaari tayong mabigo sa isang tao. May mga panahong dapat malinaw na ituro ang mali at magbigay ng kailangang pagsaway. Kahit noon, hindi natin dapat ituring na walang halaga ang kanilang pag-iral o hamakin sila. Hindi maaaring maging pinal na pamantayan ng aking pananalita ang aking damdamin; bago ang iniisip ko tungkol sa kanila, dapat kong alalahanin kung paano sila nilikha ng Diyos.", "Talata 10: \"Mula sa iisang bibig ay lumalabas ang pagpapala at sumpa. Mga kapatid ko, hindi dapat ganito.\" Alam na alam ni Santiago ang ating realidad, ngunit hindi niya ito tinatanggap bilang normal na buhay-Kristiyano. Dapat basahin nang magkasama ang talata 2 at 10: pinatitingin tayo ng talata 2 nang tapat na tayo'y natitisod; tinatawag tayo ng talata 10 na huwag manatili roon. Ang maraming panalangin at papuri ay hindi nagpapagaan sa pagpuna at panunuya. Ang pagpaparangal sa Diyos sa iglesia ay hindi bumubura sa mga sugat na ibinigay natin sa tao sa tahanan. Hindi tinatakpan ng mga salitang panrelihiyon ang ating pananagutan sa mga salitang nakasasakit. Dapat mamunga ang ating pagpapahayag sa Diyos sa paraan ng ating pakikipag-usap sa tao.", "Sa talata 11–12, inihahayag ng tubig mula sa bukal ang uri ng bukal. Hindi namumunga ng olibo ang puno ng igos, ni igos ang ubas; nakaugnay ang bunga sa punong nagbubunga nito. Ganoon din ang ating mga salita. Kung patuloy na lumalabas ang paghamak at pagpuna, dapat nating suriin, kasama ng ating pananalita, <mark>ang ugat ng pusong nagbubunga ng mga salitang iyon</mark> — inggit, galit, pagmamataas, at pagnanasang mangibabaw. Hindi ito nangangahulugang hatulang hindi ligtas ang isang tao dahil sa isang malaking mali; inamin ni Santiago ang kahinaan nating lahat. Ngunit ang mga tumanggap ng bagong buhay ay dapat mamunga ng pananalitang angkop sa buhay na iyon. Kanina, ipinakita ng timon kung saan humahantong ang salita; ngayon, ipinapakita ng bukal kung saan nagmumula ang salita. Inihahayag ng salita ang puso at naaapektuhan ang direksyon ng buhay, kaya magkasamang lumalakad ang pagsusuri sa puso at tunay na pagpipigil sa salita. Hindi tayo maaaring patuloy na magsalita ng nakasasakit habang hinihintay na magbago ang puso. Itigil ngayon ang mga salitang dapat itigil, aminin ang mga maling dapat aminin, at ibigay sa Diyos ang pusong nagbubunga ng mga salitang iyon."], "points": ["Ang pusong nagpapahalaga sa Diyos ay dapat humantong sa mga salitang nagpapahalaga sa mga taong nilikha ng Diyos."]}, {"title": "Aplikasyon · Biyayang Nagiging Paghingi ng Tawad, Pag-ibig na Nagiging Paggalang, Pag-asang Nagiging Salita ng Pagpapanumbalik", "paragraphs": ["Kung gayon, dahil walang makapagpapaamo sa dila, susuko na lang ba tayo? Hindi. Sa talata 10, sinasabi ni Santiago na hindi dapat lumabas ang pagpapala at sumpa sa iisang bibig. Dapat nating aminin ang ating hangganan ngunit akuin ang pananagutan sa ating mga salita, patuloy na magbantay, at matuto ng pagpipigil. Kanina, pinayuhan tayo ni Santiago na <mark>humingi ng karunungan sa Diyos at tanggapin nang may kaamuan ang Salitang itinanim</mark>; pagkatapos, sinabi niyang nagbibigay ang Diyos ng biyaya sa mapagpakumbaba. Kailangan din natin ang karunungan at biyayang iyon sa usapin ng pananalita. Kailangan natin ang maliliit na gawa ng pagsunod: huminto bago magalit, makinig bago sumagot, basahing muli ang mensahe bago ipadala. Ang pagpipigil sa pananalita ay pag-amin ng ating kahinaan, paghingi ng karunungan ng Diyos, at pagsunod sa mismong salitang sasabihin natin.", "Ipinakita ni Jesus ang daan. Nagpapatotoo ang 1 Pedro 2 na <mark>walang daya sa Kanyang bibig; nang Siya'y laitin, hindi Siya gumanti ng lait, kundi patuloy na ipinagkatiwala ang sarili sa Kanya na humahatol nang makatarungan</mark>. At sa krus, pinasan Niya ang ating mga kasalanan upang tayo'y mamatay sa kasalanan at mabuhay para sa katuwiran. Nagsisimula ang ating pagbabago sa biyayang iyon. Maaari nating aminin maging ang ating mga kasalanan sa pananalita sa harap ng Panginoon at humingi ng tawad. Dahil nagtagumpay si Jesus sa kamatayan at muling nabuhay, kahit sa harap ng matatagal nang ugali ng kasalanan ay maaari nating hingin ang Kanyang tulong at muling sumunod.", "Sa pag-alala sa biyaya ng krus, masasabi natin, <mark>'Mali ako.'</mark> Sa pagtitiwala sa muling nabuhay na Panginoon, mag-iingat tayo laban sa mga salitang ikinukulong ang tao magpakailanman sa kanilang mga pagkabigo. Sa pagtingin sa kaharian ng Diyos na makukumpleto, hindi natin gagawing huling paghatol ang ating mga salita, kundi makapagsasalita nang tapat habang ipinagkakatiwala sa Diyos ang mga bagay. Ibinibigay ng ebanghelyo kapwa ang katapatang umamin ng mali at ang pag-asang tumingin sa pagpapanumbalik.", "Magsimula sa mga pinakamalapit sa iyo. <mark>Kung saan dati kang nagdadahilan, aminin ang iyong mali; kung saan dati mong pinuputol ang usapan, makinig hanggang dulo.</mark> Kahit kailangan ang pagsaway, magsalita sa paraang nagpoprotekta sa dignidad ng tao. Isinilang tayo ng Diyos sa pamamagitan ng salita ng katotohanan; ngayon, dapat mamunga ang ebanghelyo sa labi ng mga binuhay ng Salitang iyon."], "points": ["Nawa'y maging salita ng paghingi ng tawad ang biyayang nagpatawad sa akin; maging salita ng paggalang ang pag-ibig na tinanggap ko; at maging salitang tumutulong sa pagpapanumbalik ng tao ang aking pag-asa sa muling pagkabuhay."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung nagiging salita ng pagpuna ang pagtatampo sa tahanan o malalapit na relasyon."}, {"key": "c2", "text": "Sinuri ko kung, nang mali ang aking nasabi, inamin ko muna ang mali sa halip na huminto sa 'Hindi iyon ang ibig kong sabihin.'"}, {"key": "c3", "text": "Pinag-isipan ko kung ang tsismis na ikinalat o dinagdagan ko ay sumisira sa tiwala ng isang tao."}, {"key": "c4", "text": "Sinuri ko kung tugma ang aking papuri sa iglesia at ang mga salitang ginagamit ko sa tao sa tahanan at trabaho."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Anong mga salitang sinabi ko sa isang malapit sa akin ang dapat kong gawing salita ng paghingi ng tawad o paggalang ngayon?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Unang Umamin", "value": "Kung may nasabi kang nakasakit kamakailan, humingi ng tawad nang walang dahilan: 'Mali ang pagsasabi ko niyon'"}, {"key": "act2", "label": "Makinig Hanggang Dulo", "value": "Sa mga usapan ngayon, huwag sumabad — makinig hanggang dulo bago sumagot"}, {"key": "act3", "label": "Basahing Muli Bago Ipadala", "value": "Bago ipadala ang emosyonal na mensahe, basahin itong muli at baguhin o huwag ipadala kung kailangan"}, {"key": "act4", "label": "Itigil ang Tsismis", "value": "Kapag nagsimula ang tsismis tungkol sa isang tao, itigil ang usapan doon o ibaling ito sa mabuting direksyon"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang Santiago 3:10 at gamitin ang bibig na pumupuri sa Diyos upang magsalita ng nagpapatibay sa tao"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Jesus, na nang laitin ay hindi gumanti ng lait, at pinasan ang aming mga kasalanan sa krus upang kami'y mabuhay para sa katuwiran."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa pagpuna at pagpapabagsak sa mga taong nilikha ayon sa larawan ng Diyos gamit ang parehong bibig na pumupuri sa Iyo, at sa pagdadahilan sa halip na pag-amin ng aking mga mali."}, {"key": "p3", "tag": "Kahilingan", "text": "Banal na Espiritu, pigilan Mo ang aking dila at baguhin maging ang ugat ng pusong nagbubunga ng aking mga salita, upang dumaloy mula sa aking labi ang pinagpalang salita ng paghingi ng tawad, paggalang, at pagpapanumbalik."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-10-20';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
