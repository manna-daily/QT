<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>만나 큐티</title>
<meta property="og:title" content="9/16(수) 큐티 · 사사기 7:15–25">
<meta property="og:description" content="내가 할 일은 내 자리에 서는 것입니다">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <button class="bgm" id="bgm">🎵 <span id="bgmLabel">묵상 음악</span> <span class="bar"><i></i><i></i><i></i></span></button>
  <div class="topRight">
    <span class="langsw" id="langsw">
      <button data-lang="ko">한국어</button><button data-lang="en">English</button><button data-lang="tl">Tagalog</button>
    </span>
    <span class="fs"><span id="fontLabel">글자</span> <button data-f="f1"><b>가</b></button><button data-f="" class="on"><b>가</b></button><button data-f="f3"><b>가</b></button></span>
  </div>
</div>

<header>
  <div class="kicker" id="kickerEl">Daily Bible QT</div>
  <div class="date" id="dateEl"></div>
  <div class="ref" id="refEl"></div>
  <h1 id="headlineEl"></h1>
</header>

<a class="video" id="video" href="VIDEO_URL" target="_blank">
  <div class="play"></div>
  <div><span id="videoLabelEl"></span><small id="videoSubEl"></small></div>
</a>

<section>
  <h2><span class="n">1</span><span id="s1heading"></span></h2>
  <blockquote class="key">
    <span id="verseEl"></span>
    <small id="verseRefEl"></small>
  </blockquote>
</section>

<section>
  <h2><span class="n">2</span><span id="s2heading"></span></h2>
  <div id="cardsContainer"></div>
</section>

<section>
  <h2><span class="n">3</span><span id="s3heading"></span></h2>
  <div id="checklistContainer"></div>
</section>

<section>
  <h2><span class="n">4</span><span id="s4heading"></span></h2>
  <p class="hint" id="memoHintEl"></p>
  <textarea id="memo" placeholder=""></textarea>
</section>

<section>
  <h2><span class="n">5</span><span id="s5heading"></span></h2>
  <div class="pill" id="pillsContainer"></div>
  <div id="actDetail">
    <input class="line" id="actWho" placeholder="">
  </div>
</section>

<section>
  <h2><span class="n">6</span><span id="s6heading"></span></h2>
  <div id="prayerContainer"></div>
</section>

<section>
  <h2><span class="n">7</span><span id="s7heading"></span></h2>
  <div class="field"><label id="pr1LabelEl"></label><input class="line" id="pr1" placeholder=""></div>
  <div class="field"><label id="pr2LabelEl"></label><input class="line" id="pr2" placeholder=""></div>
  <p class="done" id="saved"></p>
</section>

<footer id="footerEl"></footer>
</div>

<div class="actions">
  <button class="b b1" id="copy"></button>
  <button class="b b2" id="share"></button>
</div>
<audio id="audio" src="bgm.mp3" loop preload="none"></audio>
<div class="toast" id="toast"></div>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "9월 16일 수요일", "ref": "사사기 7장 15–25절", "headline": "내가 할 일은<br>내 자리에 서는 것입니다", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 사사기 7:15–25", "s1heading": "오늘의 말씀", "verse": "\"각기 제자리에 서서 그 진영을 에워싸매<br>그 온 진영의 군사들이 뛰고 부르짖으며 도망하였는데\"", "verseRef": "사사기 7:21", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 칼이 없는 전투", "paragraphs": ["어제 하나님은 군대를 32,000에서 300으로 줄이셨습니다. 이유는 이미 말씀하셨습니다 — \"내 손이 나를 구원하였다 할까 함이니라.\" 오늘 본문에서 드디어 그 약속하신 승리가 실제로 이루어집니다.", "그런데 전투 장면이 참 독특합니다. <mark>300명의 손에는 칼이 없습니다.</mark> 본문에 300명의 칼이라는 단어가 등장하지 않습니다. 나팔과 빈 항아리와 항아리 속에 숨긴 횃불을 들고 갑니다. 그리고 놀란 미디안 군대가 서로를 칩니다. 본문은 아주 분명하게 말합니다 — <mark>\"여호와께서 그 온 진영에서 친구끼리 칼로 치게 하시므로\"</mark>(7:22)."]}, {"title": "15–18절 · 첫 반응은 전략이 아니라 경배", "paragraphs": ["기드온은 적군의 꿈과 해몽을 듣고 무엇부터 했습니까? 15절 — \"<mark>듣고 경배하고</mark>.\" 전략 회의가 아니라 예배가 먼저였습니다. 그는 \"미디안이 우리를 무서워하는구나\"라는 군사 정보를 얻은 게 아니라, 적군의 입을 통해서도 하나님이 이미 약속하신 승리를 다시 확인한 것입니다. 그리고 돌아와 말합니다 — \"일어나라. 여호와께서 미디안의 진을 너희 손에 넘겨주셨느니라.\" <mark>확신은 마음이 편해지는 데서 끝나지 않고 경배에서 순종으로 이어집니다.</mark>", "16절, 300명을 세 부대로 나누고 나팔과 빈 항아리와 횃불을 줍니다. 한 손에 횃불, 다른 손에 나팔이면 <mark>칼을 들 손조차 남지 않습니다.</mark> 밤중에 여러 방향에서 나팔을 불고 항아리를 깨면 훨씬 큰 군대가 둘러싼 것처럼 보였을 것입니다. 상당히 지혜로운 전략입니다. 그러나 300명이 그 거대한 연합군을 상대하는 상황에서 전략만으로 승리를 설명할 수는 없습니다.", "17–18절, \"너희는 나만 보고 내가 하는 대로 하라.\" 포도주 틀에 숨어 있던 사람이 이제 300명 앞에 섭니다. 엄청난 변화입니다. 다만 이 변화는 기드온 혼자 만든 게 아닙니다 — 하나님이 말씀하시고, 표징을 주시고, 성령으로 입히시고, 두려울 때마다 확신을 더하시며 여기까지 세우셨습니다. 그리고 \"여호와를 위하여, 기드온을 위하여\"라는 구호가 등장합니다. 이것을 곧바로 교만이라 단정하기는 어렵습니다. <mark>그러나 기드온의 이름이 여호와의 이름 옆에 나란히 서기 시작했다는 점은, 이후 이야기를 읽을 때 주의해서 볼 대목입니다.</mark>"], "points": ["하나님을 의지한다는 건 전략이 필요 없다는 뜻이 아니라, 전략을 하나님으로 착각하지 않는 것이다"]}, {"title": "19–22절 · 각기 제자리에 서서", "paragraphs": ["19절, 중간 파수가 교대하는 시간 — 진영이 가장 혼란스러울 수 있는 때에 접근합니다. 300명이 동시에 나팔을 불고 항아리를 깨고 횃불을 듭니다. 기드온이 지시한 것을 그대로 실행합니다. <mark>하나님의 주권은 우리의 순종을 불필요하게 만들지 않습니다.</mark> 승리는 약속되었지만, 300명은 실제로 일어나 움직였습니다.", "그런데 21절에 결정적인 표현이 있습니다 — \"<mark>각기 제자리에 서서.</mark>\" 그들은 적진 한가운데로 뛰어들어 자기 힘을 증명하지 않았습니다. 맡겨진 자리에 서 있었습니다. 같은 장면에서 미디안은 뛰고 부르짖고 도망합니다. <mark>이스라엘은 서 있고, 미디안은 뛰고 있습니다.</mark> 우리는 믿음이 크면 뭔가 특별하고 대단한 일을 계속해야 한다고 생각할 때가 있습니다. 그러나 믿음은 더 많은 일을 하는 것이 아닙니다. 그날 300명에게 필요한 순종은 자리를 떠나 영웅이 되는 게 아니라 <mark>자기 자리에 서 있는 것</mark>이었습니다.", "22절, 주어를 보십시오 — \"나팔을 불 때에 <mark>여호와께서</mark> 그 온 진영에서 친구끼리 칼로 치게 하시므로.\" 전략도 있었고 순종도 있었지만, 미디안을 무너뜨린 결정적인 일은 하나님이 하셨습니다. 여기에 아이러니가 있습니다. 그들은 \"여호와와 기드온의 칼이다\"라고 외쳤는데, <mark>실제로 적을 친 칼은 300명의 칼이 아니라 미디안 자신들의 칼이었습니다.</mark> 이스라엘은 끝내 \"내 손이 나를 구원하였다\"고 말할 수 없게 되었습니다."], "points": ["믿음은 내가 모든 것을 하는 게 아니라, 하나님이 나에게 맡기신 것을 하는 것이다", "순종은 우리의 몫이지만 구원은 하나님의 일 — 우리의 순종이 하나님의 자리를 대신하지는 못한다"]}, {"title": "23–25절 · 함께 참여하는 승리, 포도주 틀의 반전", "paragraphs": ["미디안이 무너지자 납달리와 아셀과 므낫세 사람들이 부름을 받고 추격합니다. \"하나님이 300명만 남기셨는데 왜 다시 사람을 부르는가?\" 이 부분은 해석의 차이가 있습니다만, 본문만 보면 <mark>이미 승패가 결정된 뒤 도망하는 적을 추격하는 단계</mark>로 읽는 것이 자연스럽습니다. 하나님이 구원의 주체라는 사실과 하나님의 백성이 그 일에 참여하는 것은 서로 충돌하지 않습니다.", "24–25절, 에브라임이 길목을 차단하고 미디안의 두 방백 오렙과 스엡을 사로잡습니다. 오렙은 바위에서, <mark>스엡은 포도주 틀에서</mark> 죽습니다. 기드온 이야기가 시작될 때 그는 어디 있었습니까? 미디안이 두려워 포도주 틀에 숨어 밀을 타작하고 있었습니다. <mark>두려움의 장소였던 포도주 틀이 이제 하나님의 승리를 기억하는 장소가 됩니다.</mark> 그러나 여기서도 기드온만 바라보아서는 안 됩니다. 포도주 틀에 숨어 있던 사람을 여기까지 세우신 분이 하나님이시기 때문입니다."], "points": ["하나님의 일은 한 사람만 빛나는 이야기가 아니라, 각 사람이 맡겨진 자리에서 함께 참여하는 이야기다"]}, {"title": "적용 · 십자가의 자리에서 물러서지 않으신 분", "paragraphs": ["오늘 두 가지를 점검했으면 합니다. <b>첫째, 내 삶의 시작과 끝이 하나님 손에 있음을 정말 믿는가.</b> 이것은 \"하나님이 다 하시니 나는 계획하지 않아도 된다\"가 아닙니다. 기드온도 전략을 세웠고 300명도 움직였습니다. 다만 시작할 때는 \"이 일은 주님의 손에 있습니다\"라고 고백하고, 결과가 좋을 때는 \"내가 해냈다\"가 아니라 <mark>\"하나님께서 은혜를 주셨습니다\"</mark>라고 말할 수 있어야 합니다. 반대로 원하던 결과가 나오지 않았을 때도 모든 것이 끝난 것처럼 무너지지 않을 수 있어야 합니다. 시작과 끝은 우리가 통제하는 것이 아니기 때문입니다.", "<b>둘째, 나는 지금 하나님이 서 있으라 하신 그 자리에 서 있는가.</b> 우리는 보통 더 높고 편하고 인정받는 자리를 좋은 자리라 여깁니다. 그러나 하나님이 주시는 복된 자리는 <mark>아무도 알아주지 않는 자리, 반복해서 책임을 감당하는 자리, 떠나고 싶은데 조금 더 머물러야 하는 자리</mark>일 때가 많습니다. 부모로서, 자녀로서, 성도로서, 직장인으로서 지금 맡겨진 자리가 있습니다. 다만 평생 같은 자리에 있으라는 뜻은 아닙니다. 삶에는 시즌이 있습니다. 그러니 질문은 \"평생 이 자리를 지켜야 하는가\"가 아니라 <mark>\"지금 이 시즌에 하나님이 나에게 맡기신 자리는 어디인가\"</mark>입니다.", "예수님도 십자가가 쉬워서 가신 것이 아닙니다. 아버지의 뜻을 신뢰하셨기에 <mark>자신에게 맡겨진 순종의 자리에서 물러서지 않으셨고</mark>, 그 순종을 통해 우리가 생명을 얻었습니다. 300명이 각기 제자리에 섰을 때, 그들은 자기들이 할 수 없는 일을 하나님이 하시는 것을 보았습니다. 우리가 맡겨진 자리에 충실히 서 있을 때, 그 자리는 답답한 자리가 아니라 <mark>하나님이 일하시는 것을 보게 되는 은혜의 자리</mark>가 될 수 있습니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "오늘 시작하는 일 하나를 \"이 일의 시작과 끝은 주님의 손에 있습니다\"라고 먼저 맡겼다"}, {"key": "c2", "text": "내 계획·경험·좋은 조언을 하나님 자리에 올려놓고 있지는 않은지 하나 점검했다"}, {"key": "c3", "text": "지금 이 시즌에 하나님이 나에게 맡기신 자리가 어디인지 한 곳을 분명히 떠올렸다"}, {"key": "c4", "text": "뛰어들어 증명하려 하지 않고 그 자리에 서 있어야 할 일이 무엇인지 돌아봤다"}], "s4heading": "묵상 한 줄", "memoHint": "지금 이 시즌에 하나님이 나에게 \"여기 서 있으라\" 하시는 자리는 어디입니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "제자리 지키기", "value": "떠나고 싶은 자리 하나를 오늘 하루 더 지키기"}, {"key": "act2", "label": "고백 바꾸기", "value": "오늘 잘된 일을 '하나님께서 은혜 주셨습니다'로 말하기"}, {"key": "act3", "label": "먼저 맡기기", "value": "세운 계획을 시작하기 전에 하나님께 먼저 맡기고 시작하기"}, {"key": "act4", "label": "함께 참여하기", "value": "지금 자기 자리에서 버티고 있는 사람 한 명에게 힘을 보태기"}, {"key": "act5", "label": "포도주 틀 기억", "value": "예전에 두려웠던 자리에서 하나님이 하신 일을 하나 적어 감사하기"}], "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "제 손이 아니라 주님의 손으로 구원하시고, 십자가의 자리에서 물러서지 않으신 예수님께 감사합니다"}, {"key": "p2", "tag": "회개", "text": "내 전략과 판단을 하나님 자리에 올려놓고, 맡겨진 자리를 답답해하며 떠나려 했던 것을 회개합니다"}, {"key": "p3", "tag": "간구", "text": "결과는 하나님께 맡기고, 오늘 제게 맡기신 자리에서 나팔을 불고 횃불을 드는 순종을 하게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "September 16, Wednesday", "ref": "Judges 7:15–25", "headline": "What I must do<br>is stand in my place", "videoLabel": "Listen to today's 10-minute message", "videoSub": "Daily Bread QT · Judges 7:15–25", "s1heading": "Today's Word", "verse": "\"Every man stood in his place round about the camp,<br>and all the army ran, and cried, and fled.\"", "verseRef": "Judges 7:21", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · A Battle Without Swords", "paragraphs": ["Yesterday God reduced the army from 32,000 to 300. He had already told us why — \"lest Israel vaunt themselves against me, saying, Mine own hand hath saved me.\" In today's passage, that promised victory finally happens.", "But the battle scene is strange. <mark>None of the 300 have a sword in hand.</mark> The word \"sword\" never even appears for the 300. They carry trumpets, empty jars, and torches hidden inside the jars — and the startled Midianite army turns on itself. The text says it plainly — <mark>\"the LORD set every man's sword against his fellow\"</mark> (7:22)."]}, {"title": "Verses 15–18 · The First Response Was Worship, Not Strategy", "paragraphs": ["When Gideon heard the enemy's dream and its interpretation, what did he do first? Verse 15 — \"<mark>he worshipped</mark>.\" Worship came before any strategy meeting. He didn't just gain intel that \"Midian is afraid of us\" — through the enemy's own mouth, God confirmed again the victory He had already promised. Then Gideon returns and says, \"Arise, for the LORD hath delivered into your hand the host of Midian.\" <mark>Assurance doesn't end with a comforted heart — it flows from worship into obedience.</mark>", "In verse 16 he divides the 300 into three companies and gives each a trumpet, an empty jar, and a torch. With a torch in one hand and a trumpet in the other, <mark>there isn't even a free hand left to hold a sword.</mark> Blowing trumpets and smashing jars from several directions at night would make it look like a far larger army surrounded the camp — a genuinely clever strategy. But strategy alone cannot explain how 300 men could face that huge coalition.", "In verses 17–18, \"Look on me, and do likewise.\" The man who once hid in a winepress now stands in front of 300 men. It's a remarkable change — but Gideon didn't bring about this change on his own. God spoke, gave signs, clothed him with the Spirit, and kept building his confidence every time he was afraid. And now a cry rises: \"For the LORD, and for Gideon.\" It's hard to call this pride outright, <mark>but the fact that Gideon's name now stands right beside the LORD's is worth watching closely as the story continues.</mark>"], "points": ["Depending on God doesn't mean strategy is unnecessary — it means not mistaking strategy for God"]}, {"title": "Verses 19–22 · Each One Standing in His Place", "paragraphs": ["In verse 19 they approach during the changing of the watch — the moment the camp would be most confused. All 300 blow their trumpets, break their jars, and hold up their torches at once, exactly as Gideon instructed. <mark>God's sovereignty doesn't make our obedience unnecessary.</mark> The victory was promised, but the 300 still got up and moved.", "But verse 21 holds a decisive phrase — \"<mark>every man stood in his place.</mark>\" They didn't charge into the enemy camp to prove their own strength. They stood where they were placed. In the same scene the Midianites run, cry out, and flee. <mark>Israel is standing; Midian is running.</mark> We sometimes think great faith must keep producing something spectacular. But faith isn't about doing more. What the 300 needed that night wasn't to leave their post and become heroes — it was simply <mark>to stand in their place.</mark>", "Look at the subject of verse 22 — \"as they blew the trumpets, <mark>the LORD</mark> set every man's sword against his fellow.\" There was strategy, there was obedience, but the decisive act that brought Midian down was God's own doing. Here's the irony: they shouted \"The sword of the LORD and of Gideon,\" yet <mark>the sword that actually struck the enemy wasn't the sword of the 300 — it was Midian's own sword.</mark> In the end Israel could never say, \"my own hand has saved me.\""], "points": ["Faith is not doing everything myself — it is doing what God has entrusted to me", "Obedience is our part, but salvation is God's work — our obedience can never take God's place"]}, {"title": "Verses 23–25 · A Victory Shared Together, the Winepress Reversed", "paragraphs": ["As Midian collapses, the men of Naphtali, Asher, and Manasseh are called out to pursue. \"If God left only 300, why call others back in?\" There's room for different readings here, but taken plainly this reads naturally as <mark>the stage of chasing down a fleeing enemy after the outcome was already decided.</mark> God being the one who saves does not conflict with His people taking part in that work.", "In verses 24–25 Ephraim cuts off the crossing and captures Midian's two princes, Oreb and Zeeb. Oreb dies at a rock; <mark>Zeeb dies at a winepress.</mark> Where was Gideon when this story began? Hiding in a winepress, threshing wheat out of fear of Midian. <mark>The winepress that was once a place of fear now becomes a place that remembers God's victory.</mark> But even here we shouldn't look at Gideon alone — because it was God who raised up the man once hiding in that winepress to get this far."], "points": ["God's work is never a story where only one person shines — it's a story where each person takes part from the place they've been given"]}, {"title": "Application · The One Who Did Not Step Back from the Cross", "paragraphs": ["Today let's examine two things. <b>First, do I truly believe the beginning and end of my life are in God's hands?</b> This doesn't mean \"God does everything, so I don't need to plan.\" Gideon made a strategy, and the 300 moved. But when we start something we should be able to say, \"This is in the Lord's hands,\" and when the outcome is good, say not \"I did it\" but <mark>\"God gave the grace.\"</mark> And when the result isn't what we hoped for, we shouldn't collapse as if everything is over — because the beginning and the end were never ours to control.", "<b>Second, am I standing right now in the place God told me to stand?</b> We usually think a good place is one that's higher, easier, and more recognized. But the blessed place God gives is often <mark>a place no one notices, a place of repeated responsibility, a place we want to leave but must stay in a little longer.</mark> As a parent, a child, a believer, an employee — there's a place entrusted to each of us right now. That doesn't mean staying in the same place forever; life has seasons. So the question isn't \"must I keep this place forever,\" but <mark>\"where is the place God has entrusted to me in this season?\"</mark>", "Jesus didn't go to the cross because it was easy. Because He trusted the Father's will, <mark>He did not step back from the place of obedience entrusted to Him,</mark> and through that obedience we received life. When the 300 each stood in their place, they watched God do what they themselves could not do. When we stand faithfully in the place entrusted to us, that place can become — not a stifling place — but <mark>a place of grace where we get to watch God at work.</mark>"]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I entrusted one thing I'm starting today, saying first, \"The beginning and end of this is in the Lord's hands.\""}, {"key": "c2", "text": "I checked whether I've been putting my own plans, experience, or good advice in God's place."}, {"key": "c3", "text": "I clearly identified one place God has entrusted to me in this season."}, {"key": "c4", "text": "I reflected on what it means to stand in my place, instead of charging in to prove myself."}], "s4heading": "One-Line Reflection", "memoHint": "Where is the place God is telling you, \"stand here,\" in this season?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Stay put", "value": "Stay one more day in a place I want to leave"}, {"key": "act2", "label": "Change my words", "value": "Say of today's good outcome, 'God gave the grace'"}, {"key": "act3", "label": "Entrust it first", "value": "Before starting a plan, entrust it to God first"}, {"key": "act4", "label": "Join in together", "value": "Give strength to one person holding their post right now"}, {"key": "act5", "label": "Remember the winepress", "value": "Write down and give thanks for one thing God did in a place I once feared"}], "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You for saving us not by our hand but by Your hand, and for Jesus who did not step back from the cross."}, {"key": "p2", "tag": "Repent", "text": "I repent of putting my own strategy and judgment in God's place, and of wanting to leave the place entrusted to me out of frustration."}, {"key": "p3", "tag": "Ask", "text": "I entrust the results to You — let me obey today, blowing the trumpet and holding up the torch, right where You've placed me."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Setyembre 16, Miyerkules", "ref": "Mga Hukom 7:15–25", "headline": "Ang dapat kong gawin ay<br>tumayo sa aking kinalalagyan", "videoLabel": "Pakinggan ang 10-minutong mensahe ngayon", "videoSub": "Daily Bread QT · Mga Hukom 7:15–25", "s1heading": "Ang Salita Ngayon", "verse": "\"Ang bawat isa ay tumayo sa kanya-kanyang kinatatayuan sa palibot ng kampo,<br>at ang buong hukbo ay tumakbo, sumigaw, at tumakas.\"", "verseRef": "Mga Hukom 7:21", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Isang Labanang Walang Espada", "paragraphs": ["Kahapon, binawasan ng Diyos ang hukbo mula 32,000 tungo sa 300. Sinabi na Niya ang dahilan — \"baka ipagmalaki ng Israel laban sa akin, na sabihin, Iniligtas ako ng aking sariling kamay.\" Sa bahaging ito ngayon, natupad na sa wakas ang ipinangakong tagumpay.", "Ngunit kakaiba ang eksena ng labanan. <mark>Wala ni isa man sa 300 ang may hawak na espada.</mark> Hindi lumalabas ang salitang \"espada\" para sa 300. May dala silang mga trumpeta, mga walang lamang banga, at mga sulo na nakatago sa loob ng mga banga. At ang nagulat na hukbo ng Midian ay nagpatayan sila-sila. Malinaw na sinasabi ng teksto — <mark>\"pinasalakay ng Panginoon ang espada ng bawat isa laban sa kanyang kasamahan\"</mark> (7:22)."]}, {"title": "Talata 15–18 · Ang Unang Tugon ay Pagsamba, Hindi Estratehiya", "paragraphs": ["Nang marinig ni Gideon ang panaginip ng kaaway at ang kahulugan nito, ano ang unang ginawa niya? Talata 15 — \"<mark>sumamba siya</mark>.\" Nauna ang pagsamba bago ang pagpaplano ng estratehiya. Hindi lang niya nalaman na \"natatakot sa amin ang Midian\" bilang balita ng digmaan — sa pamamagitan mismo ng bibig ng kaaway, muling pinatunayan ng Diyos ang tagumpay na dati na Niyang ipinangako. At bumalik siya at nagsabi, \"Bumangon kayo; sapagka't ibinigay ng Panginoon sa inyong kamay ang hukbo ng Midian.\" <mark>Ang katiyakan ay hindi lamang nagtatapos sa panatag na puso — dumadaloy ito mula sa pagsamba tungo sa pagsunod.</mark>", "Sa talata 16, hinati niya ang 300 sa tatlong pangkat at binigyan ng trumpeta, walang lamang banga, at sulo ang bawat isa. May sulo sa isang kamay at trumpeta sa isa pa, <mark>wala nang kamay na maiiwan para humawak ng espada.</mark> Ang pagpatunog ng trumpeta at pagbasag ng mga banga mula sa iba't ibang direksyon sa gabi ay magpapakita na parang mas malaking hukbo ang pumapalibot — isang talagang matalinong estratehiya. Ngunit hindi kayang ipaliwanag ng estratehiya lamang kung paano haharapin ng 300 katao ang napakalaking pinagsamang hukbo na iyon.", "Sa talata 17–18, \"Tumingin kayo sa akin, at gawin ninyo ang gaya ng ginagawa ko.\" Ang taong minsang nagtago sa lagayan ng alak ay ngayon ay tumatayo sa harap ng 300 katao. Isang malaking pagbabago — ngunit hindi lang si Gideon ang gumawa ng pagbabagong ito. Nagsalita ang Diyos, nagbigay ng mga tanda, dinamitan siya ng Espiritu, at patuloy na nagpalakas ng kanyang tiwala sa tuwing siya ay natatakot. At ngayon, lumitaw ang sigaw na \"Para sa Panginoon, at para kay Gideon.\" Mahirap agad itong tawaging kayabangan. <mark>Ngunit ang katotohanang ang pangalan ni Gideon ay nagsimulang tumayo sa tabi mismo ng pangalan ng Panginoon ay isang bagay na dapat pagmasdang mabuti habang nagpapatuloy ang kwento.</mark>"], "points": ["Ang pananalig sa Diyos ay hindi nangangahulugang hindi na kailangan ng estratehiya — kundi ang huwag ipagkamali ang estratehiya bilang Diyos"]}, {"title": "Talata 19–22 · Bawat Isa'y Tumayo sa Kanyang Kinatatayuan", "paragraphs": ["Sa talata 19, lumapit sila sa oras ng pagpapalit ng bantay — ang sandaling pinaka-magulo ang kampo. Sabay-sabay na hinipan ng lahat ng 300 ang kanilang mga trumpeta, binasag ang mga banga, at itinaas ang mga sulo, eksaktong sinunod ang tagubilin ni Gideon. <mark>Ang soberanya ng Diyos ay hindi nagpapawalang-saysay sa ating pagsunod.</mark> Ipinangako na ang tagumpay, ngunit bumangon at kumilos pa rin ang 300.", "Ngunit may mahalagang parirala sa talata 21 — \"<mark>bawat isa ay tumayo sa kanyang kinatatayuan.</mark>\" Hindi sila sumugod sa gitna ng kampo ng kaaway upang patunayan ang sariling lakas. Tumayo sila kung saan sila inatasan. Sa parehong eksena, ang mga Midianita ay tumatakbo, sumisigaw, at tumatakas. <mark>Nakatayo ang Israel; tumatakbo ang Midian.</mark> Minsan iniisip natin na ang malaking pananampalataya ay dapat patuloy na gumagawa ng kahanga-hangang bagay. Ngunit ang pananampalataya ay hindi tungkol sa paggawa ng mas marami. Ang kailangan ng 300 sa gabing iyon ay hindi ang umalis sa kanilang puwesto upang maging bayani — kundi <mark>ang tumayo lamang sa kanilang kinalalagyan.</mark>", "Tingnan ang paksa ng talata 22 — \"nang hipan nila ang mga trumpeta, <mark>pinasalakay ng Panginoon</mark> ang espada ng bawat isa laban sa kanyang kasamahan.\" May estratehiya, may pagsunod, ngunit ang Diyos ang gumawa ng mapagpasyang bagay na bumagsak sa Midian. Narito ang kabalintunaan: sumigaw sila, \"Ang espada ng Panginoon at ni Gideon,\" ngunit <mark>ang espadang talagang tumama sa kaaway ay hindi espada ng 300 kundi ang sarili nilang espada ng Midian.</mark> Sa huli, hindi na kailanman masasabi ng Israel, \"iniligtas ako ng aking sariling kamay.\""], "points": ["Ang pananampalataya ay hindi ang paggawa ko ng lahat — ito ay ang paggawa ng ipinagkatiwala sa akin ng Diyos", "Ang pagsunod ay atin, ngunit ang kaligtasan ay gawa ng Diyos — hindi kailanman mapapalitan ng ating pagsunod ang lugar ng Diyos"]}, {"title": "Talata 23–25 · Sama-samang Tagumpay, Pagbabaligtad sa Lagayan ng Alak", "paragraphs": ["Nang bumagsak ang Midian, tinawag ang mga lalaki ng Neftali, Aser, at Manases upang habulin sila. \"Kung 300 lamang ang iniwan ng Diyos, bakit tatawagin pa ang iba?\" May pagkakaiba-iba ng interpretasyon dito, ngunit kung ang teksto lamang ang titingnan, mas natural itong basahin bilang <mark>ang yugto ng paghabol sa tumatakas na kaaway matapos na maipasya ang labanan.</mark> Ang katotohanang ang Diyos ang tagapagligtas ay hindi sumasalungat sa pakikilahok ng Kanyang bayan sa gawaing iyon.", "Sa talata 24–25, hinarang ng Efraim ang mga daanan at hinuli ang dalawang pinuno ng Midian, si Oreb at si Zeeb. Namatay si Oreb sa isang bato; <mark>si Zeeb ay namatay sa isang lagayan ng alak.</mark> Nasaan si Gideon nang magsimula ang kwentong ito? Nagtatago sa isang lagayan ng alak, gumigiik ng trigo dahil sa takot sa Midian. <mark>Ang lagayan ng alak na dating lugar ng takot ay naging lugar na ngayon ng alaala ng tagumpay ng Diyos.</mark> Ngunit kahit dito, hindi tayo dapat tumingin lamang kay Gideon — dahil ang Diyos ang nagtaas sa taong minsang nagtago sa lagayan ng alak hanggang sa puntong ito."], "points": ["Ang gawain ng Diyos ay hindi kwento kung saan iisang tao lamang ang nagniningning — ito ay kwento ng bawat isa na kasama sa gawain mula sa lugar na ipinagkaloob sa kanila"]}, {"title": "Pagsasabuhay · Siyang Hindi Umatras sa Krus", "paragraphs": ["Ngayon, gusto kong suriin natin ang dalawang bagay. <b>Una, tunay ba akong naniniwala na ang simula at wakas ng aking buhay ay nasa kamay ng Diyos?</b> Hindi ito nangangahulugang \"ginagawa na lahat ng Diyos kaya hindi ko na kailangang magplano.\" Nagplano rin si Gideon at kumilos ang 300. Ngunit kapag nagsisimula tayo, dapat nating masabing \"Ito ay nasa kamay ng Panginoon,\" at kapag magandang resulta ang lumabas, hindi \"Ako ang gumawa nito\" kundi <mark>\"Ang Diyos ang nagbigay ng biyaya.\"</mark> At kapag hindi naging tulad ng inaasahan ang resulta, hindi tayo dapat gumuho na parang tapos na ang lahat — dahil ang simula at wakas ay hindi kailanman atin ang kontrol.", "<b>Ikalawa, nakatayo ba ako ngayon sa lugar na sinabi ng Diyos na tayuan ko?</b> Karaniwan nating iniisip na ang mabuting lugar ay iyong mas mataas, mas madali, at mas kinikilala. Ngunit ang pinagpalang lugar na ibinibigay ng Diyos ay kadalasang <mark>isang lugar na walang nakakapansin, isang lugar ng paulit-ulit na responsibilidad, isang lugar na gusto mong iwan ngunit kailangan mo pang manatili nang kaunti pa.</mark> Bilang magulang, bilang anak, bilang mananampalataya, bilang empleyado — may lugar na ipinagkatiwala sa iyo ngayon. Hindi ibig sabihin nito na dapat kang manatili sa parehong lugar habang buhay; may mga panahon ang buhay. Kaya ang tanong ay hindi \"kailangan ko bang panatilihin ito habambuhay,\" kundi <mark>\"saang lugar ako ipinagkatiwala ng Diyos sa panahong ito?\"</mark>", "Hindi rin madali para kay Jesus na pumunta sa krus. Dahil nagtiwala Siya sa kalooban ng Ama, <mark>hindi Siya umatras sa lugar ng pagsunod na ipinagkatiwala sa Kanya,</mark> at sa pamamagitan ng pagsunod na iyon, tumanggap tayo ng buhay. Nang tumayo ang bawat isa sa 300 sa kanilang kinalalagyan, nasaksihan nila ang Diyos na gumagawa ng bagay na hindi nila kayang gawin. Kapag matapat tayong nakatayo sa lugar na ipinagkatiwala sa atin, ang lugar na iyon ay hindi magiging nakakasakal na lugar kundi <mark>isang lugar ng biyaya kung saan nasasaksihan natin ang Diyos na gumagawa.</mark>"]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Ipinagkatiwala ko ang isang bagay na sinisimulan ko ngayon, sinasabing muna, \"Ang simula at wakas nito ay nasa kamay ng Panginoon.\""}, {"key": "c2", "text": "Sinuri ko kung inilalagay ko ba ang sarili kong plano, karanasan, o magandang payo sa lugar ng Diyos."}, {"key": "c3", "text": "Malinaw kong naalala ang isang lugar na ipinagkatiwala sa akin ng Diyos sa panahong ito."}, {"key": "c4", "text": "Sinuri ko kung ano ang dapat kong gawin — hindi ang sumugod para patunayan ang sarili, kundi ang tumayo sa aking kinalalagyan."}], "s4heading": "Isang Linyang Pagninilay", "memoHint": "Saang lugar ka sinasabihan ng Diyos ngayon, \"tumayo ka rito,\" sa panahong ito?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Manatili sa puwesto", "value": "Manatili nang isa pang araw sa isang lugar na gusto kong iwan"}, {"key": "act2", "label": "Baguhin ang sasabihin", "value": "Sabihin tungkol sa magandang nangyari ngayon, 'Biyaya ito ng Diyos'"}, {"key": "act3", "label": "Ipagkatiwala muna", "value": "Bago simulan ang isang plano, ipagkatiwala muna ito sa Diyos"}, {"key": "act4", "label": "Makilahok nang sama-sama", "value": "Bigyan ng lakas ang isang taong kasalukuyang matatag sa kanyang puwesto"}, {"key": "act5", "label": "Alalahanin ang lagayan ng alak", "value": "Isulat at magpasalamat sa isang bagay na ginawa ng Diyos sa lugar na dati kong kinatakutan"}], "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat sa pagliligtas Mo sa amin hindi sa pamamagitan ng aming kamay kundi ng Iyong kamay, at kay Jesus na hindi umatras sa krus."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa paglalagay ng sarili kong estratehiya at hatol sa lugar ng Diyos, at sa pagnanais kong umalis sa lugar na ipinagkatiwala sa akin dahil sa inip."}, {"key": "p3", "tag": "Kahilingan", "text": "Ipinagkakatiwala ko ang resulta sa Iyo — tulungan Mo akong sumunod ngayon, hipan ang trumpeta at itaas ang sulo, sa mismong lugar na inilagay Mo sa akin."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};

}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>
</body>
</html>
