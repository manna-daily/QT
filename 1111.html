<style>

  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}

  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}

  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}

  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}

  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "11월 11일 수요일", "ref": "고린도후서 8장 16–24절", "headline": "좋은 뜻만으로<br>충분할까요?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 고린도후서 8:16-24", "s1heading": "오늘의 말씀", "verse": "\"이는 우리가 주 앞에서뿐 아니라<br>사람 앞에서도<br>선한 일에 조심하려 함이라\"", "verseRef": "고린도후서 8:21", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 선한 동기는 신뢰할 수 있는 방식으로 이어져야 합니다", "paragraphs": ["좋은 일을 시작할 때 먼저 중요한 것은 동기입니다. 왜 그 일을 하는지, 누구를 위해 하는지를 살펴야 합니다. 그리스도께 받은 은혜는 수고를 인정받지 못할 때에도 섬김을 이어 가는 힘이 됩니다. 그러나 좋은 뜻이 실제적인 도움으로 이어지려면 <mark>그 일을 진행하는 방식</mark>도 중요합니다. 사람을 신중하게 세우고, 맡겨진 것을 정직하게 다루며, 공동체가 함께 확인할 수 있어야 합니다. <mark>사람을 신뢰하는 마음과 일을 함께 확인하는 책임은 함께 갑니다</mark>.", "앞에서 바울은 마게도냐 교회들의 나눔과 그리스도의 은혜를 이야기하며 고린도 성도들에게 형편에 맞게 나누라고 권면했습니다. 오늘은 그 일을 누가 맡고 어떻게 진행할지 설명합니다. 디도와 두 형제를 소개하고, 연보를 정직하게 관리하기 위해 어떤 준비를 했는지 밝힙니다."], "points": ["나는 좋은 뜻을 가졌다는 사실만 설명하고 있습니까, 다른 사람도 신뢰할 수 있는 방식으로 그 일을 감당하고 있습니까?"]}, {"title": "16–17절 · 하나님이 주신 간절함으로 자원하여 섬깁니다", "paragraphs": ["<mark>\"너희를 위하여 같은 간절함을 디도의 마음에 주신 하나님께 감사하노니\"</mark>(16절). 바울은 디도를 소개하며 먼저 하나님께 감사합니다. 성도들을 진심으로 돌보려는 그 마음을 주신 분이 하나님이시기 때문입니다. 디도는 연보만 받아 오려는 사람이 아니라, 고린도 성도들이 받은 은혜에 합당하게 살도록 돕는 동역자였습니다. 나누는 사람도, 그 나눔을 맡아 돕는 사람도 모두 하나님의 은혜 위에서 섬깁니다. 그러니 일꾼을 세울 때 능력과 함께 <mark>이 사람이 누구를 위해 일하는가</mark>를 살펴야 합니다.", "디도는 권함을 받고 <mark>\"더욱 간절함으로 자원하여\"</mark>(17절) 나아갔습니다. 하나님이 마음을 주셨다는 사실과 디도가 스스로 기쁘게 응답했다는 사실이 함께 나타납니다. 하나님의 역사는 사람의 자원함을 통해 드러납니다. 우리도 섬길 때 맡은 일을 끝내는 데만 관심을 두고 있는지, <mark>그 일로 도움받을 사람들을 진심으로 생각하는지</mark> 돌아보아야 합니다."], "points": ["하나님이 주시는 간절함은 일을 이루면서도 그 안에 있는 사람을 소중히 여기게 합니다."]}, {"title": "18–19절 · 교회가 인정한 사람과 함께 세웁니다", "paragraphs": ["이 연보는 예루살렘의 가난한 성도들을 돕기 위한 것이었고, 여러 교회가 모은 돈을 사람이 직접 가지고 가야 했으므로 누가 책임지고 전달할지가 중요했습니다. 고린도전서 16장에서도 바울은 교회가 인정한 사람들에게 편지를 주어 연보를 가져가게 하겠다고 했습니다(고전 16:3). 오늘도 디도 혼자 맡지 않습니다. 바울은 <mark>\"복음으로써 모든 교회에서 칭찬을 받는\"</mark> 형제를 함께 보냅니다(18절).", "그는 <mark>\"여러 교회의 택함을 받아\"</mark>(19절) 이 일에 참여했습니다. 우리는 그의 이름을 모르지만, 교회들이 그의 삶과 사역을 인정하고 일을 맡겼다는 사실은 압니다. 바울은 개인적인 친분만으로 사람을 세우지 않았습니다. <mark>사람을 세우는 일에는 믿음과 신중함이 함께 있어야 합니다</mark>. 좋은 마음을 가졌는지와 함께, 실제로 맡은 일을 신실하게 감당해 왔는지도 확인해야 합니다. 바울은 이 섬김이 주의 영광을 나타내려는 것이라고 말합니다."], "points": ["좋은 마음을 살피면서, 맡은 일을 신실하게 감당해 온 삶도 함께 확인합니다."]}, {"title": "20–21절 · 주 앞에서뿐 아니라 사람 앞에서도 조심합니다", "paragraphs": ["<mark>\"이것을 조심함은 우리가 맡은 이 거액의 연보에 대하여 아무도 우리를 비방하지 못하게 하려 함이니\"</mark>(20절). <mark>\"이는 우리가 주 앞에서뿐 아니라 사람 앞에서도 선한 일에 조심하려 함이라\"</mark>(21절). 바울은 하나님이 자신의 마음을 아신다는 고백과 함께, 사람들이 확인할 수 있는 정직한 방식도 중요하게 여겼습니다. 이것이 모든 비난을 피할 수 있다는 뜻은 아닙니다. 그러나 자신의 부주의 때문에 복음 사역이 의심받는 일은 예방하려 힘썼습니다.", "<mark>신뢰와 확인은 함께 갈 수 있습니다</mark>. 사람을 믿으면서도 맡긴 일을 함께 살피는 것은 그 사람과 공동체를 함께 보호하는 일입니다. 오늘로 말하면 맡은 돈의 수입과 지출을 기록하고, 중요한 내용을 함께 확인하며, 사용 내역을 공동체에 설명하고, 책임이 누구에게 있는지 분명히 하는 일입니다. 이것은 사람을 방해하는 일이 아니라, <mark>여러 사람의 헌신을 소중히 여기고 그 도움이 제대로 전달되도록 지키는 일</mark>입니다."], "points": ["사람을 믿는다는 이유로 확인을 생략할 필요는 없습니다. 함께 확인하는 방식은 섬기는 사람을 보호합니다."]}, {"title": "22–24절 · 검증된 동역자들과 함께 사랑을 행동으로 드러냅니다", "paragraphs": ["바울은 또 한 형제를 보내 모두 세 명이 됩니다. 그의 간절함은 <mark>\"여러 가지 일에 … 여러 번 확인\"</mark>되었습니다(22절). 한 번의 인상이나 뜨거운 말만으로 추천된 사람이 아니었습니다. 일을 맡길 때 살필 것은 <mark>꾸준히 드러난 성품과 책임감</mark>입니다. 디도는 바울의 동료이자 동역자이고, 두 형제는 <mark>\"여러 교회의 사자들이요 그리스도의 영광\"</mark>입니다(23절). 교회들을 대표해 보냄받은 사람들이며, 그들의 신실한 섬김이 그리스도를 영광스럽게 합니다. 이름이 알려지지 않아도 맡은 일을 정직하게 감당하는 삶은 교회를 유익하게 합니다.", "이제 바울은 고린도 성도들에게 응답을 요청합니다. 보내는 사람들을 받아들이고 연보를 마무리하여 <mark>\"너희의 사랑 … 의 증거를 그들에게 보이라\"</mark>(24절). 책임은 지도자와 담당자에게만 있지 않고 성도들의 협력에도 있습니다. 확인을 요청받을 때 마음이 불편할 수 있지만, 공동체가 함께 맡은 일이라면 설명하고 확인받는 과정도 섬김의 일부로 받아들여야 합니다."], "points": ["신뢰받는 일꾼과 협력하는 성도들이 함께 진실함을 드러낼 때 교회가 건강하게 세워집니다."]}, {"title": "적용 · 목적과 과정 모두에서 진실하게", "paragraphs": ["오늘 말씀은 어떤 마음으로 시작했는지와 함께, 그 일을 어떤 방식으로 감당하고 있는지 묻습니다. 예수님의 십자가 길을 떠올려 봅니다. 주님은 우리를 사랑하셨고, 그 사랑을 이루어 가는 길에서도 끝까지 진실하셨습니다. 베드로전서 2장은 <mark>\"그는 죄를 범하지 아니하시고 그 입에 거짓도 없으시며\"</mark>, 욕을 당하셔도 맞대어 욕하지 않으셨으며, <mark>\"친히 나무에 달려 그 몸으로 우리 죄를 담당하셨으니\"</mark>라고 증언합니다(벧전 2:22–24).", "그 은혜를 받은 우리도 주님을 따르는 사람답게 <mark>섬김의 목적과 과정 모두에서 진실함</mark>을 지켜야 합니다. 정직하게 일한다고 언제나 인정받는 것은 아닙니다. 그러나 결과를 서두르느라 설명을 생략하거나, \"나를 믿어 달라\"는 말로 확인을 피하지는 말아야 합니다.", "오늘 내가 맡은 사역이나 공동체의 일 하나를 떠올려 보십시오. 책임을 함께 나누고 있는지, 맡겨진 것을 어떻게 사용했는지 설명할 수 있는지 살펴보십시오. <mark>빠트린 기록이 있다면 남기고, 혼자 결정해 온 중요한 일이 있다면 동역자와 함께 확인하십시오</mark>. 주님께 받은 은혜를 끝까지 소중히 다룬다는 것은, 그 은혜로 시작한 일이 사람을 살리고 공동체를 세우도록 책임지는 것입니다.", "나는 좋은 뜻을 가진 사람으로만 믿어 달라고 하고 있지는 않습니까, 아니면 공동체와 함께 확인하고 신뢰할 수 있는 방식으로 하나님의 사랑을 실천하고 있습니까?"], "points": ["좋은 뜻에 정직한 방식을 더하여, 맡겨진 섬김을 끝까지 신실하게 감당합니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "섬길 때 일을 끝내는 것뿐 아니라 도움받을 사람을 진심으로 생각했는지 돌아봤다"}, {"key": "c2", "text": "사람을 세울 때 친분보다 꾸준히 드러난 성품과 신실함을 살폈다"}, {"key": "c3", "text": "맡은 돈이나 일을 기록하고 설명할 수 있는 방식으로 다루고 있는지 점검했다"}, {"key": "c4", "text": "확인을 요청받을 때 불편해하기보다 섬김의 일부로 받아들였다"}], "s4heading": "묵상 한 줄", "memoHint": "내가 맡은 일 가운데 좋은 뜻만큼 정직하고 투명한 방식이 필요한 일은 무엇이며, 오늘 무엇을 보완하겠습니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "기록 남기기", "value": "맡은 일이나 재정에서 빠트린 기록이 있다면 오늘 정리해 남기기"}, {"key": "act2", "label": "함께 확인하기", "value": "혼자 결정해 온 중요한 일 하나를 동역자와 함께 확인하기"}, {"key": "act3", "label": "사람 생각하기", "value": "맡은 일로 도움받을 사람을 떠올리며 그를 위해 기도하고 일하기"}, {"key": "act4", "label": "숨은 일꾼 격려", "value": "이름 없이 신실하게 섬기는 동역자에게 감사와 격려의 말 전하기"}, {"key": "act5", "label": "말씀 암송", "value": "고린도후서 8:21을 외우며 주 앞과 사람 앞에서 선한 일에 조심하기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "섬기는 사람의 마음에 간절함을 주시고, 이름 없이 신실한 일꾼들을 통해 교회를 세우시며, 끝까지 진실하게 우리를 위해 자신을 내어 주신 주님께 감사합니다"}, {"key": "p2", "tag": "회개", "text": "좋은 뜻만 내세우며 설명과 확인을 피하고, 맡은 일을 끝내는 데만 마음을 두어 도움받을 사람을 잊었던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "주 앞에서뿐 아니라 사람 앞에서도 선한 일에 조심하게 하시고, 섬김의 목적과 과정 모두에서 정직하며, 공동체와 함께 신뢰를 세우게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "November 11, Wednesday", "ref": "2 Corinthians 8:16–24", "headline": "Are Good Intentions<br>Enough?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · 2 Corinthians 8:16-24", "s1heading": "Today's Word", "verse": "\"For we aim at what is honorable<br>not only in the Lord's sight<br>but also in the sight of man.\"", "verseRef": "2 Corinthians 8:21", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · Good Motives Must Be Carried Out in Trustworthy Ways", "paragraphs": ["When you begin something good, what do you consider important? First, motive matters. We must examine why we're starting it and whom we're doing it for. The grace we've received from Christ can be the strength to keep serving even when our labor isn't recognized. But for good intentions to become real help, <mark>the way the work is carried out</mark> matters too. People must be appointed carefully, what's entrusted must be handled honestly, and the community must be able to verify it together. Good motives must flow into methods the community can trust. <mark>A heart that trusts people and the responsibility to verify the work together go hand in hand.</mark>", "In the previous passage, Paul spoke of the Macedonian churches' generosity and Christ's grace, and urged the Corinthians to give willingly according to their means to meet the needs of believers in hardship. Today he explains who will handle that work and how it will proceed. He introduces Titus and two brothers and makes clear what preparations he made to manage the collection honestly. We too begin many things with good intentions to serve God. Before today's Word, let's examine both our motives and our methods: Am I only explaining that I had good intentions? Or am I carrying out the work in a way others can trust? Let's look at three parts."], "points": ["Am I only explaining that I had good intentions, or carrying out the work in a way others can trust?"]}, {"title": "Verses 16–17 · Serving Willingly with the Earnestness God Gives", "paragraphs": ["In verse 16, as Paul introduces Titus again, he first thanks God: <mark>'But thanks be to God, who put into the heart of Titus the same earnest care I have for you.'</mark> It was God who gave Titus his earnest heart for the Corinthians. 'The same earnest care' refers to a heart that genuinely seeks to care for the believers. Titus wasn't someone merely trying to collect money; he was a co-worker helping the Corinthians live worthily of the grace they had received. In the previous passage, God gave the Macedonian churches a heart to share; today He gives earnestness to Titus, who will serve in that work. Both those who give and those who help carry out the giving serve on the foundation of God's grace. So when appointing workers, along with ability we must examine one more thing: <mark>for whom is this person working?</mark> A heart to care for people must be at the center of the work.", "In verse 17, Paul urged Titus to go to Corinth. Titus accepted and went <mark>'of his own accord,' being 'himself very earnest.'</mark> Both facts appear together: God gave him the heart, and Titus joyfully responded of his own will. God's work is revealed through people's willingness. How do you respond to God's call? When we serve, we must examine our hearts: Are we only interested in finishing the task? Or are we <mark>genuinely thinking of the people who will be helped through it</mark>? Zeal for the task and love for people must exist together."], "points": ["The earnestness God gives makes us treasure the people within the work even as we accomplish it."]}, {"title": "Verses 18–19 · Appointing Together Those the Church Has Approved", "paragraphs": ["In verses 18–19, this collection was to help the poor believers in Jerusalem. Since money gathered from churches in various regions had to be carried in person, who would take responsibility for delivering it was important. In 1 Corinthians 16, Paul had said he would give letters to people approved by the Corinthian church to take the gift to Jerusalem (1 Corinthians 16:3). In today's passage, too, Titus doesn't handle it alone. Paul sends another brother with him — <mark>'the brother who is famous among all the churches for his preaching of the gospel.'</mark>", "He was <mark>'appointed by the churches'</mark> to take part in this work. The grounds are concrete: what life and ministry he had shown, how the community evaluated him, and what responsibility he was given. We don't know his name. But we do know that the churches recognized his ministry and entrusted the work to him. Paul didn't appoint him based only on personal friendship. <mark>Appointing people requires both trust and prudence.</mark> While examining whether someone has a good heart, we must also confirm whether they have actually carried out their responsibilities faithfully. Paul says this service is 'for the glory of the Lord himself and to show our good will.'"], "points": ["While examining someone's heart, we also confirm a life that has faithfully carried out its responsibilities."]}, {"title": "Verses 20–21 · Taking Care Not Only Before the Lord but Before People", "paragraphs": ["In verses 20–21, Paul explains why he prepared this way: <mark>'We take this course so that no one should blame us about this generous gift that is being administered by us, for we aim at what is honorable not only in the Lord's sight but also in the sight of man.'</mark> Along with confessing that God knows his heart, Paul valued honest methods people could verify. He arranged for representatives approved by the churches to take part so the collection would be handled faithfully. This doesn't mean all criticism can be avoided — Paul was baselessly criticized too. But he worked to prevent the gospel ministry from being suspected because of his own carelessness.", "Here is an important lesson for us today: <mark>trust and verification can go together.</mark> Trusting a person while also reviewing the entrusted work together protects both that person and the community. Applying this principle today might mean recording the income and expenses of money we handle, checking important matters together, explaining how funds were used to the community, and making clear who is responsible. These processes don't hinder people. They <mark>treasure the gathered devotion of many and protect it so the help truly reaches those in need</mark>. Paul describes the collection as service that glorifies the Lord. Church finances are part of gospel ministry, so the way we handle them must also show honesty worthy of the Lord."], "points": ["There's no need to skip verification just because we trust someone; shared checking protects those who serve with good hearts."]}, {"title": "Verses 22–24 · Showing Love in Action with Proven Co-workers", "paragraphs": ["In verses 22–23, Paul sends yet another brother — three in all. This man's earnestness had been <mark>'tested and found earnest in many matters'</mark> many times. He wasn't recommended on the strength of a single impression or fervent words. He trusted the Corinthians and was eager to serve them all the more. When entrusting work to someone, what we should look at is <mark>consistently demonstrated character and responsibility</mark>. In verse 23, Paul sums up their relationships and roles: Titus is his partner and fellow worker for the Corinthians; the two brothers are <mark>'messengers of the churches, the glory of Christ.'</mark> 'Messengers of the churches' means people sent as representatives of the churches; we needn't read it as meaning they all had apostolic authority like Paul. Their faithful service glorifies Christ — who Christ is shows not only in the words of the gospel but in how people are treated and how entrusted things are managed. We don't know exactly why the two brothers' names aren't given. But their faithful service is clearly preserved in the text. Even when unknown by name, a life that honestly carries out its entrusted work benefits the church.", "In verse 24, Paul now asks the Corinthians to respond: receive those being sent and complete the collection together — <mark>'give proof before the churches of your love and of our boasting about you.'</mark> Responsibility doesn't lie only with leaders and those in charge; the believers must cooperate in the service too. Paul explains his management and states his co-workers' qualifications; the believers respond with willing cooperation and giving. It's a community where everyone shows sincerity in action. We may feel uncomfortable when asked for verification. But if the work is entrusted to the community together, we must be able to accept explaining and being checked as part of the service."], "points": ["When trusted workers and cooperating believers show sincerity together, the church is built up healthily."]}, {"title": "Application · Truthful in Both Purpose and Process", "paragraphs": ["Today's Word asks not only with what heart we began, but how we are carrying out the work. Think of Jesus' path to the cross. The Lord loved us, and on the path of fulfilling that love He remained truthful to the end. First Peter 2 testifies that <mark>'He committed no sin, neither was deceit found in His mouth'</mark>; when reviled, He did not revile in return; and <mark>'He Himself bore our sins in His body on the tree'</mark> (1 Peter 2:22–24). The Lord willingly gave Himself to save us.", "Having received that grace, we too must keep <mark>truthfulness in both the purpose and the process of our service</mark>, as people who follow the Lord. Working honestly doesn't always win people's recognition. But we must not skip explanations in a hurry for results, or avoid verification with the words 'Just trust me.'", "Think of one ministry or community task entrusted to you today. Check whether responsibility is being shared, and whether you can explain how what was entrusted has been used. <mark>If there are records you've missed, make them; if there are important matters you've been deciding alone, review them with your co-workers.</mark> To treat the grace received from the Lord as precious to the end means taking responsibility that the work begun by that grace gives life to people and builds up the community.", "Am I only asking to be trusted as someone with good intentions — or am I practicing God's love in a way the community can verify and trust together?"], "points": ["Adding honest methods to good intentions, I faithfully carry out the service entrusted to me to the end."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether, in serving, I genuinely thought of those to be helped, not just of finishing the task."}, {"key": "c2", "text": "When appointing people, I looked at consistently shown character and faithfulness rather than friendship."}, {"key": "c3", "text": "I checked whether I'm handling entrusted money or tasks in ways I can record and explain."}, {"key": "c4", "text": "When asked for verification, I accepted it as part of service rather than feeling offended."}], "s4heading": "One-Line Reflection", "memoHint": "Among the tasks entrusted to me, which needs honest and transparent methods as much as good intentions, and what will I improve today?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Keep Records", "value": "If there are missing records in your tasks or finances, organize and record them today"}, {"key": "act2", "label": "Verify Together", "value": "Review one important matter you've been deciding alone together with a co-worker"}, {"key": "act3", "label": "Think of the People", "value": "Remember those who will be helped by your work, and pray and work for them"}, {"key": "act4", "label": "Encourage Hidden Workers", "value": "Offer thanks and encouragement to a co-worker who serves faithfully without recognition"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize 2 Corinthians 8:21 and take care to do what is honorable before the Lord and people"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, Lord, for putting earnestness into the hearts of those who serve, for building the church through faithful workers without names, and for giving Yourself for us, truthful to the end."}, {"key": "p2", "tag": "Repent", "text": "I repent of putting forward only my good intentions while avoiding explanation and verification, and of focusing only on finishing tasks while forgetting the people to be helped."}, {"key": "p3", "tag": "Ask", "text": "Help me take care to do what is honorable not only before You but before people, be honest in both the purpose and process of service, and build trust together with the community."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Nobyembre 11, Miyerkules", "ref": "2 Corinto 8:16–24", "headline": "Sapat na ba<br>ang Mabuting Intensyon?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · 2 Corinto 8:16-24", "s1heading": "Salita Ngayon", "verse": "\"Sapagkat layunin namin ang kagalang-galang<br>hindi lamang sa paningin ng Panginoon<br>kundi pati sa paningin ng tao.\"", "verseRef": "2 Corinto 8:21", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Dapat Isagawa ang Mabuting Motibo sa Mapagkakatiwalaang Paraan", "paragraphs": ["Kapag nagsisimula ka ng isang mabuting bagay, ano ang itinuturing mong mahalaga? Una, mahalaga ang motibo. Dapat nating suriin kung bakit natin ito sinisimulan at para kanino natin ito ginagawa. Ang biyayang natanggap natin mula kay Cristo ay maaaring maging lakas upang patuloy na maglingkod kahit hindi kinikilala ang ating pagpapagal. Ngunit upang maging tunay na tulong ang mabuting intensyon, mahalaga rin <mark>ang paraan ng pagsasagawa ng gawain</mark>. Dapat maingat na italaga ang mga tao, tapat na hawakan ang ipinagkatiwala, at dapat itong masuri ng komunidad nang sama-sama. Dapat dumaloy ang mabuting motibo sa mga paraang mapagkakatiwalaan ng komunidad. <mark>Magkasama ang pusong nagtitiwala sa tao at ang pananagutang sama-samang suriin ang gawain.</mark>", "Sa naunang talata, nagsalita si Pablo tungkol sa kagandahang-loob ng mga iglesya sa Macedonia at sa biyaya ni Cristo, at hinimok ang mga taga-Corinto na kusang-loob na magbigay ayon sa kanilang kakayahan upang punan ang pangangailangan ng mga mananampalatayang nasa hirap. Ngayon, ipinaliliwanag niya kung sino ang hahawak sa gawaing iyon at kung paano ito isasagawa. Ipinakilala niya si Tito at ang dalawang kapatid at nilinaw kung anong paghahanda ang ginawa niya upang tapat na pamahalaan ang koleksyon. Tayo rin ay nagsisimula ng maraming bagay nang may mabuting intensyong maglingkod sa Diyos. Sa harap ng Salita ngayon, suriin natin kapwa ang ating motibo at paraan: Ipinaliliwanag ko lamang ba na may mabuti akong intensyon? O ginagampanan ko ang gawain sa paraang mapagkakatiwalaan ng iba? Tingnan natin ang tatlong bahagi."], "points": ["Ipinaliliwanag ko lamang ba na may mabuti akong intensyon, o ginagampanan ko ang gawain sa paraang mapagkakatiwalaan ng iba?"]}, {"title": "Talata 16–17 · Kusang-loob na Naglilingkod sa Kasigasigang Ibinibigay ng Diyos", "paragraphs": ["Sa talata 16, habang muling ipinakikilala ni Pablo si Tito, una siyang nagpasalamat sa Diyos: <mark>'Ngunit salamat sa Diyos, na naglagay sa puso ni Tito ng parehong masigasig na malasakit na mayroon ako para sa inyo.'</mark> Ang Diyos ang nagbigay kay Tito ng masigasig na puso para sa mga taga-Corinto. Ang 'parehong masigasig na malasakit' ay tumutukoy sa pusong tunay na naghahangad na alagaan ang mga mananampalataya. Si Tito ay hindi taong nagsisikap lamang na mangolekta ng pera; siya ay kamanggagawang tumutulong sa mga taga-Corinto na mamuhay nang karapat-dapat sa biyayang natanggap nila. Sa naunang talata, binigyan ng Diyos ang mga iglesya sa Macedonia ng pusong magbahagi; ngayon ay binibigyan Niya ng kasigasigan si Tito, na maglilingkod sa gawaing iyon. Kapwa ang mga nagbibigay at ang mga tumutulong sa pagsasagawa ng pagbibigay ay naglilingkod sa pundasyon ng biyaya ng Diyos. Kaya kapag nagtatalaga ng mga manggagawa, kasama ng kakayahan ay dapat nating suriin ang isa pang bagay: <mark>para kanino nagtatrabaho ang taong ito?</mark> Ang pusong nag-aalaga sa mga tao ay dapat nasa sentro ng gawain.", "Sa talata 17, hinimok ni Pablo si Tito na pumunta sa Corinto. Tinanggap ito ni Tito at pumunta <mark>'sa sarili niyang kusa,' na 'lubhang masigasig.'</mark> Magkasamang lumilitaw ang dalawang katotohanan: ang Diyos ang nagbigay ng puso, at masayang tumugon si Tito sa sarili niyang kalooban. Nahahayag ang gawa ng Diyos sa pamamagitan ng pagkukusa ng tao. Paano ka tumutugon sa tawag ng Diyos? Kapag naglilingkod tayo, dapat nating suriin ang ating puso: Interesado lamang ba tayo sa pagtatapos ng gawain? O <mark>tunay nating iniisip ang mga taong matutulungan nito</mark>? Dapat magkasama ang sigasig sa gawain at pag-ibig sa mga tao."], "points": ["Ang kasigasigang ibinibigay ng Diyos ay nagpapahalaga sa atin sa mga tao sa loob ng gawain habang tinutupad natin ito."]}, {"title": "Talata 18–19 · Sama-samang Pagtatalaga sa mga Kinilala ng Iglesya", "paragraphs": ["Sa talata 18–19, ang koleksyong ito ay upang tulungan ang mga dukhang mananampalataya sa Jerusalem. Dahil kailangang personal na dalhin ang perang nakolekta mula sa mga iglesya sa iba't ibang rehiyon, mahalaga kung sino ang mananagot sa paghahatid nito. Sa 1 Corinto 16, sinabi ni Pablo na bibigyan niya ng mga liham ang mga taong kinilala ng iglesya sa Corinto upang dalhin ang kaloob sa Jerusalem (1 Corinto 16:3). Sa talata ngayon din, hindi ito hinahawakan ni Tito nang mag-isa. Nagpadala si Pablo ng isa pang kapatid kasama niya — <mark>'ang kapatid na kilala sa lahat ng iglesya dahil sa kanyang pangangaral ng ebanghelyo.'</mark>", "Siya ay <mark>'itinalaga ng mga iglesya'</mark> upang makibahagi sa gawaing ito. Tiyak ang mga batayan: kung anong buhay at ministeryo ang ipinakita niya, kung paano siya sinuri ng komunidad, at kung anong pananagutan ang ibinigay sa kanya. Hindi natin alam ang kanyang pangalan. Ngunit alam natin na kinilala ng mga iglesya ang kanyang ministeryo at ipinagkatiwala sa kanya ang gawain. Hindi siya itinalaga ni Pablo batay lamang sa personal na pagkakaibigan. <mark>Ang pagtatalaga ng tao ay nangangailangan kapwa ng tiwala at pag-iingat.</mark> Habang sinusuri kung may mabuting puso ang isang tao, dapat din nating kumpirmahin kung tapat niyang ginampanan ang kanyang mga pananagutan. Sinasabi ni Pablo na ang paglilingkod na ito ay 'para sa kaluwalhatian ng Panginoon mismo at upang ipakita ang aming mabuting kalooban.'"], "points": ["Habang sinusuri ang puso ng isang tao, kinukumpirma rin natin ang buhay na tapat na gumanap sa mga pananagutan nito."]}, {"title": "Talata 20–21 · Nag-iingat Hindi Lamang sa Harap ng Panginoon kundi sa Harap ng Tao", "paragraphs": ["Sa talata 20–21, ipinaliwanag ni Pablo kung bakit siya naghanda nang ganito: <mark>'Ginagawa namin ito upang walang sinumang sumisi sa amin tungkol sa masaganang kaloob na ito na aming pinamamahalaan, sapagkat layunin namin ang kagalang-galang hindi lamang sa paningin ng Panginoon kundi pati sa paningin ng tao.'</mark> Kasama ng pagpapahayag na alam ng Diyos ang kanyang puso, pinahalagahan ni Pablo ang mga tapat na paraang masusuri ng tao. Inayos niya na makibahagi ang mga kinatawang kinilala ng mga iglesya upang matapat na mahawakan ang koleksyon. Hindi ito nangangahulugang maiiwasan ang lahat ng puna — si Pablo rin ay pinuna nang walang batayan. Ngunit nagsikap siya na hindi mapaghinalaan ang ministeryo ng ebanghelyo dahil sa sarili niyang kapabayaan.", "Narito ang mahalagang aral para sa atin ngayon: <mark>maaaring magkasama ang tiwala at pagsusuri.</mark> Ang pagtitiwala sa isang tao habang sama-samang sinusuri ang ipinagkatiwalang gawain ay nagpoprotekta kapwa sa taong iyon at sa komunidad. Ang paglalapat ng prinsipyong ito ngayon ay maaaring mangahulugan ng pagtatala ng kita at gastos ng perang hinahawakan natin, sama-samang pagsusuri sa mahahalagang bagay, pagpapaliwanag sa komunidad kung paano ginamit ang pondo, at paglilinaw kung sino ang may pananagutan. Hindi hinahadlangan ng mga prosesong ito ang mga tao. <mark>Pinahahalagahan nito ang sama-samang debosyon ng marami at pinoprotektahan ito upang tunay na umabot ang tulong sa mga nangangailangan.</mark> Inilalarawan ni Pablo ang koleksyon bilang paglilingkod na lumuluwalhati sa Panginoon. Bahagi ng ministeryo ng ebanghelyo ang pananalapi ng iglesya, kaya dapat ding magpakita ng katapatang karapat-dapat sa Panginoon ang paraan ng ating paghawak dito."], "points": ["Hindi kailangang laktawan ang pagsusuri dahil lamang nagtitiwala tayo sa isang tao; pinoprotektahan ng sama-samang pagsusuri ang mga naglilingkod nang may mabuting puso."]}, {"title": "Talata 22–24 · Ipinapakita ang Pag-ibig sa Kilos Kasama ng mga Napatunayang Kamanggagawa", "paragraphs": ["Sa talata 22–23, nagpadala pa si Pablo ng isa pang kapatid — tatlo lahat. Ang kasigasigan ng taong ito ay <mark>'sinubok at napatunayang masigasig sa maraming bagay'</mark> nang maraming ulit. Hindi siya inirekomenda batay sa isang impresyon o maalab na salita lamang. Nagtiwala siya sa mga taga-Corinto at lalo pang nasabik na paglingkuran sila. Kapag nagkakatiwala ng gawain sa isang tao, ang dapat nating tingnan ay <mark>ang palagiang ipinakitang ugali at pananagutan</mark>. Sa talata 23, binuod ni Pablo ang kanilang mga relasyon at tungkulin: si Tito ay kanyang kasama at kamanggagawa para sa mga taga-Corinto; ang dalawang kapatid ay <mark>'mga sugo ng mga iglesya, ang kaluwalhatian ni Cristo.'</mark> Ang 'mga sugo ng mga iglesya' ay nangangahulugang mga taong isinugo bilang kinatawan ng mga iglesya; hindi natin kailangang basahin ito na lahat sila ay may awtoridad ng apostol tulad ni Pablo. Lumuluwalhati kay Cristo ang kanilang tapat na paglilingkod — nahahayag kung sino si Cristo hindi lamang sa mga salita ng ebanghelyo kundi sa kung paano tinatrato ang mga tao at pinamamahalaan ang mga ipinagkatiwala. Hindi natin alam kung bakit eksaktong hindi ibinigay ang mga pangalan ng dalawang kapatid. Ngunit malinaw na naingatan sa talata ang kanilang tapat na paglilingkod. Kahit hindi kilala sa pangalan, ang buhay na tapat na gumaganap sa ipinagkatiwalang gawain ay nakikinabang sa iglesya.", "Sa talata 24, hinihiling na ngayon ni Pablo na tumugon ang mga taga-Corinto: tanggapin ang mga isinugo at sama-samang tapusin ang koleksyon — <mark>'ipakita sa harap ng mga iglesya ang patunay ng inyong pag-ibig at ng aming pagmamalaki sa inyo.'</mark> Ang pananagutan ay hindi lamang nasa mga pinuno at sa mga namamahala; dapat ding makipagtulungan ang mga mananampalataya sa paglilingkod. Ipinaliliwanag ni Pablo ang kanyang pamamahala at sinasabi ang kwalipikasyon ng kanyang mga kamanggagawa; tumutugon ang mga mananampalataya sa kusang-loob na pakikipagtulungan at pagbibigay. Isa itong komunidad kung saan ipinapakita ng lahat ang katapatan sa kilos. Maaaring hindi tayo komportable kapag hinihingan ng pagsusuri. Ngunit kung ang gawain ay sama-samang ipinagkatiwala sa komunidad, dapat nating matanggap ang pagpapaliwanag at pagpapasuri bilang bahagi ng paglilingkod."], "points": ["Kapag sama-samang nagpapakita ng katapatan ang mga mapagkakatiwalaang manggagawa at nakikipagtulungang mananampalataya, malusog na naitatayo ang iglesya."]}, {"title": "Aplikasyon · Tapat Kapwa sa Layunin at Proseso", "paragraphs": ["Itinatanong ng Salita ngayon hindi lamang kung anong puso tayo nagsimula, kundi kung paano natin ginagampanan ang gawain. Isipin ang daan ni Jesus patungo sa krus. Inibig tayo ng Panginoon, at sa landas ng pagtupad sa pag-ibig na iyon ay nanatili Siyang tapat hanggang sa wakas. Pinatototohanan ng 1 Pedro 2 na <mark>'Hindi Siya nagkasala, ni natagpuan ang panlilinlang sa Kanyang bibig'</mark>; nang alipustain, hindi Siya gumanti; at <mark>'Siya mismo ang nagpasan ng ating mga kasalanan sa Kanyang katawan sa puno'</mark> (1 Pedro 2:22–24). Kusang-loob na ibinigay ng Panginoon ang Kanyang sarili upang iligtas tayo.", "Dahil natanggap natin ang biyayang iyon, dapat din nating panatilihin ang <mark>katapatan kapwa sa layunin at proseso ng ating paglilingkod</mark>, bilang mga taong sumusunod sa Panginoon. Hindi laging nakakamit ng tapat na paggawa ang pagkilala ng tao. Ngunit hindi natin dapat laktawan ang pagpapaliwanag dahil nagmamadali sa resulta, o iwasan ang pagsusuri sa mga salitang 'Magtiwala ka na lang sa akin.'", "Mag-isip ng isang ministeryo o gawain ng komunidad na ipinagkatiwala sa iyo ngayon. Suriin kung ibinabahagi ang pananagutan, at kung maipaliliwanag mo kung paano ginamit ang ipinagkatiwala. <mark>Kung may mga talaang nakaligtaan mo, gawin ang mga ito; kung may mahahalagang bagay na mag-isa mong pinagpapasyahan, suriin ang mga ito kasama ng iyong mga kamanggagawa.</mark> Ang pagpapahalaga sa biyayang natanggap mula sa Panginoon hanggang sa wakas ay nangangahulugang pananagutan na ang gawaing sinimulan ng biyayang iyon ay nagbibigay-buhay sa mga tao at nagtatayo sa komunidad.", "Hinihiling ko lamang bang pagkatiwalaan ako bilang taong may mabuting intensyon — o isinasagawa ko ang pag-ibig ng Diyos sa paraang masusuri at mapagkakatiwalaan ng komunidad nang sama-sama?"], "points": ["Sa pagdaragdag ng tapat na paraan sa mabuting intensyon, tapat kong ginagampanan hanggang sa wakas ang paglilingkod na ipinagkatiwala sa akin."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung, sa paglilingkod, tunay kong inisip ang mga matutulungan, hindi lamang ang pagtatapos ng gawain."}, {"key": "c2", "text": "Kapag nagtatalaga ng tao, tiningnan ko ang palagiang ipinakitang ugali at katapatan sa halip na pagkakaibigan."}, {"key": "c3", "text": "Sinuri ko kung hinahawakan ko ang ipinagkatiwalang pera o gawain sa paraang maitatala at maipaliliwanag ko."}, {"key": "c4", "text": "Nang hingan ng pagsusuri, tinanggap ko ito bilang bahagi ng paglilingkod sa halip na masaktan."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Sa mga gawaing ipinagkatiwala sa akin, alin ang nangangailangan ng tapat at malinaw na paraan gaya ng mabuting intensyon, at ano ang aayusin ko ngayon?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Magtala", "value": "Kung may kulang na talaan sa iyong gawain o pananalapi, ayusin at itala ang mga ito ngayon"}, {"key": "act2", "label": "Sama-samang Suriin", "value": "Suriin kasama ng kamanggagawa ang isang mahalagang bagay na mag-isa mong pinagpapasyahan"}, {"key": "act3", "label": "Isipin ang mga Tao", "value": "Alalahanin ang mga matutulungan ng iyong gawain, at ipanalangin at paglingkuran sila"}, {"key": "act4", "label": "Palakasin ang Nakatagong Manggagawa", "value": "Mag-alok ng pasasalamat at pampalakas-loob sa kamanggagawang tapat na naglilingkod nang walang pagkilala"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang 2 Corinto 8:21 at mag-ingat na gawin ang kagalang-galang sa harap ng Panginoon at ng tao"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Panginoon, sa paglalagay ng kasigasigan sa puso ng mga naglilingkod, sa pagtatayo ng iglesya sa pamamagitan ng mga tapat na manggagawang walang pangalan, at sa pagbibigay ng Iyong sarili para sa amin, tapat hanggang sa wakas."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa pagpapakita lamang ng aking mabuting intensyon habang iniiwasan ang pagpapaliwanag at pagsusuri, at sa pagtuon lamang sa pagtatapos ng gawain habang nalilimutan ang mga taong matutulungan."}, {"key": "p3", "tag": "Kahilingan", "text": "Tulungan Mo akong mag-ingat na gawin ang kagalang-galang hindi lamang sa harap Mo kundi sa harap ng tao, maging tapat kapwa sa layunin at proseso ng paglilingkod, at magtayo ng tiwala kasama ng komunidad."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-11-11';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
