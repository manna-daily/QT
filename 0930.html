<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "9월 30일 수요일", "ref": "사사기 14장 1–20절", "headline": "내 눈에 좋아 보이는 것이<br>정말 옳은 것일까요", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 사사기 14:1-20", "s1heading": "오늘의 말씀", "verse": "\"내 아버지여 만일 할 만하시거든 이 잔을 내게서 지나가게 하옵소서<br>그러나 나의 원대로 마옵시고 아버지의 원대로 하옵소서\"", "verseRef": "마태복음 26:39", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 하나님이 결정하시던 13장, 내 눈이 결정하는 14장", "paragraphs": ["13장은 철저히 하나님이 시작하시는 이야기였습니다. 아무도 부르짖지 않았지만 하나님이 먼저 찾아오셔서 생명을 주시고, 태어나기도 전에 삼손을 나실인으로 구별하셨습니다. 그런데 14장에 들어오면 분위기가 달라집니다. 청년이 된 삼손은 하나님의 뜻을 묻기보다 <mark>자기 눈에 좋아 보이는 것</mark>을 따라갑니다.", "놀라운 것은 하나님입니다. 삼손이 잘못된 길을 가는데도 하나님의 구원 계획은 멈추지 않습니다. 그러나 반드시 구분해야 합니다. 하나님이 삼손을 죄짓게 만드신 것도, 그의 욕망을 선하다고 인정하신 것도 아닙니다. 가룟 유다의 배신이 분명 죄였지만 십자가의 구원 계획을 무너뜨리지 못했던 것처럼, 하나님은 삼손의 잘못된 선택조차 자신의 구원 계획 안에서 사용하십니다."], "points": ["하나님께 쓰임받는 것과 하나님을 닮아가는 것은 같은 것이 아닙니다."]}, {"title": "1–4절 · \"그 여자가 내 눈에 옳으니이다\"", "paragraphs": ["삼손이 딤나로 내려가 블레셋 여인을 <mark>눈으로 봅니다</mark>. 그리고 부모에게 요구합니다. \"그 여자를 데려다가 내 아내로 삼게 하소서.\" 부모는 반대합니다. 단지 민족이 달라서만이 아닙니다. 블레셋은 지금 이스라엘을 억압하는 민족이었고, \"할례 받지 않은 블레셋\"이라는 표현은 언약 백성과 그들 사이의 영적 경계를 보여줍니다.", "그러자 삼손이 말합니다. 우리말로는 \"내가 그 여자를 좋아하오니\"이지만, 원어의 뜻은 <mark>\"그 여자가 내 눈에 옳으니이다\"</mark>입니다. 이것이 14장의 핵심 표현입니다. 이스라엘의 기준은 원래 \"여호와의 눈에 옳은가\"였습니다. 그런데 삼손의 기준은 \"내 눈에 옳은가\"입니다. 그리고 이 표현은 사사기 마지막의 <mark>\"사람이 각기 자기 소견에 옳은 대로 행하였더라\"</mark>를 미리 보여줍니다. 삼손은 한 개인이지만, 당시 이스라엘 전체의 모습이기도 했습니다.", "4절은 놀랍게 말합니다. \"그의 부모는 이 일이 여호와께로부터 나온 것인 줄은 알지 못하였더라. 이는 삼손이 틈을 타서 블레셋 사람을 치려 함이었으니.\" 하나님이 어떤 일을 <mark>사용하셨다</mark>는 것과 그 일을 <mark>옳다고 인정하셨다</mark>는 것은 다릅니다. 이스라엘은 40년 동안 블레셋의 지배에 익숙해져 있었고, 하나님은 그 거짓 평화를 깨뜨리고 계셨습니다."], "points": ["욕망은 내가 원하는 것을 옳은 것처럼 느끼게 합니다. 거짓 평화보다 불편한 구원이 낫습니다 — 하나님은 때로 우리가 너무 익숙해진 삶의 방식을 깨뜨리십니다."]}, {"title": "5–9절 · 숨기는 삼손, 쌓여가는 작은 타협", "paragraphs": ["딤나의 포도원 근처에서 어린 사자가 삼손에게 달려듭니다. <mark>\"여호와의 영이 삼손에게 강하게 임하니\"</mark> — 그는 아무 무기 없이 사자를 찢습니다. 분명히 해야 할 것은 삼손의 힘의 근원이 머리카락이 아니라 여호와의 영이라는 사실입니다. 그런데 삼손은 이 놀라운 일을 부모에게 말하지 않습니다. 부모가 모르는 비밀이 생긴 것입니다. 여인을 만난 뒤에도 성경은 다시 말합니다. \"그 여자가 삼손의 눈에 들었더라\" — 1절에서 보고, 3절과 7절에서도 여전히 자기 눈으로 판단합니다. 아이러니하게도 삼손은 훗날 바로 그 눈을 잃게 됩니다.", "얼마 후 삼손은 일부러 길을 벗어나 죽은 사자의 사체를 보러 갑니다. 그 안에 벌 떼와 꿀이 있었고, 그는 그것을 보고, 손으로 취하고, 먹고, 부모에게도 줍니다. <mark>보고, 취하고, 먹고, 건네는</mark> 흐름은 창세기 3장을 떠올리게 합니다. 나실인으로서 부정한 사체에 손을 댄 것이고, 게다가 꿀을 어디서 가져왔는지도 말하지 않습니다. 또 숨깁니다."], "points": ["무너짐은 대개 마지막 한 번의 선택에서 시작되지 않습니다. 작은 경계를 계속 무시할 때 감각이 무뎌집니다. 나의 강점만큼, 나를 넘어뜨리는 약점과 그 출구를 아는 것이 중요합니다."]}, {"title": "10–18절 · 수수께끼 — 관계를 무너뜨린 비밀", "paragraphs": ["혼인 잔치에서 블레셋 사람들은 삼손에게 서른 명의 동무를 붙입니다. 삼손은 수수께끼를 냅니다. <mark>\"먹는 자에게서 먹는 것이 나오고, 강한 자에게서 단 것이 나왔느니라\"</mark>. 답은 죽은 사자 속의 꿀이었지만, 부모에게도 말하지 않았으니 이것을 아는 사람은 삼손뿐이었습니다. 풀 수 없는 문제에 베옷 서른 벌과 겉옷 서른 벌이라는 큰 내기까지 걸면서, 놀이는 자존심 싸움이 됩니다.", "답을 알아내지 못한 블레셋 사람들은 삼손의 아내를 협박합니다. \"너와 네 아버지의 집을 불사르리라.\" 이 여인을 단순히 악한 배신자로만 볼 수는 없습니다. 자신과 가족의 생명이 위협받고 있었습니다. 그녀는 울며 \"당신이 나를 미워할 뿐이요 사랑하지 아니하는도다\"라고 삼손을 계속 압박하고, 결국 삼손은 비밀을 알려 줍니다. <mark>사자를 찢을 만큼 강한 사람이 관계 속의 압박에서는 무너진 것</mark>입니다. 이 장면은 훗날 들릴라 사건을 미리 보여줍니다.", "블레셋 사람들이 답을 말하자 삼손은 거칠게 말합니다. \"너희가 내 암송아지로 밭 갈지 아니하였더면 내 수수께끼를 풀지 못하였으리라.\" 14장에서는 누구도 서로에게 정직하지 않습니다. 삼손은 부모에게 숨기고, 아내는 협박받는 사실을 남편에게 숨깁니다. 결혼 관계가 사랑이 아니라 비밀과 협박과 조종의 관계로 변해 버렸습니다."], "points": ["가장 강한 사람도 자신의 약점을 모르면 그 약점으로 무너집니다. 건강한 관계는 비밀을 무기로 쓰는 관계가 아니라, 진실을 안전하게 나눌 수 있는 관계입니다."]}, {"title": "19–20절 · 충돌을 통해 시작되는 구원", "paragraphs": ["수치를 당하고 화가 난 삼손에게 <mark>다시 여호와의 영이 갑자기 임합니다</mark>. 그는 아스글론으로 내려가 블레셋 사람 서른 명을 죽이고 그들의 옷을 가져와 내기의 값을 치릅니다. 여기에는 두 흐름이 동시에 있습니다. 삼손에게는 분노와 상처받은 자존심과 복수심이 있었지만, 하나님은 4절에서 말씀하신 블레셋과의 충돌을 시작하고 계셨습니다. 성령이 능력을 주셨다는 것이 삼손의 모든 동기와 성품을 인정하셨다는 뜻은 아닙니다.", "14장은 \"저 여자를 내 아내로 데려오라\"로 시작했습니다. 그는 자기 눈에 옳다고 생각했고 부모의 반대에도 밀어붙였습니다. 그런데 20절은 어떻게 끝납니까? <mark>그 여인은 다른 사람의 아내가 됩니다</mark>. 끝까지 밀어붙였지만 결국 얻지 못했고, 손에 남은 것은 분노와 깨진 관계뿐이었습니다."], "points": ["능력은 성품을 대신하지 못합니다. \"나는 얼마나 쓰임받고 있는가\"만이 아니라 \"나는 얼마나 예수님을 닮아가고 있는가\"를 물어야 합니다."]}, {"title": "적용 · 내 눈에 옳은 것이 아니라, 아버지의 뜻대로", "paragraphs": ["삼손은 말합니다. \"내 눈에 옳습니다.\" 그러나 예수님은 겟세마네에서 십자가를 앞두고 간절히 기도하셨습니다. <mark>\"나의 원대로 마옵시고 아버지의 원대로 하옵소서\"</mark>. 이것이 제자의 삶입니다. 우리는 매일 수많은 선택을 합니다. 내 눈에 좋아 보이는 것, 내 감정이 원하는 것, 반드시 가져야 할 것처럼 느껴지는 것이 많습니다. 그러나 한 번 더 물어야 합니다. \"이것이 하나님께서 기뻐하시는 것인가?\" 내 눈에 옳은 것을 얻는 것이 반드시 복은 아닙니다.", "그리고 한 가지를 더 기억하십시오. 우리가 잘못 선택했다고 하나님의 주권까지 무너지는 것은 아닙니다. 삼손의 실패도 하나님의 구원 계획을 멈추지 못했습니다. 그러니 과거의 실패 때문에 절망하지 마십시오. 동시에, 하나님의 주권을 핑계 삼아 잘못된 선택을 정당화하지도 마십시오."], "points": ["오늘 내가 반복해서 넘어지는 욕망은 무엇입니까? 하나님의 뜻보다 내 눈에 옳은 것을 따라가는 영역은 어디입니까? 예수님의 기도로 다시 돌아가십시오."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "최근의 선택들이 '하나님이 기뻐하시는가'보다 '내 눈에 좋아 보이는가'를 기준으로 하고 있지는 않은지 돌아봤다"}, {"key": "c2", "text": "가족이나 가까운 사람에게 숨기고 있는 작은 타협이나 비밀이 없는지 점검했다"}, {"key": "c3", "text": "나를 반복해서 넘어뜨리는 약점이 무엇이며, 그 출구가 어디인지 정직하게 돌아봤다"}, {"key": "c4", "text": "쓰임받는 것에 만족하지 않고, 예수님을 닮아가는 성품의 변화를 구하고 있는지 점검했다"}], "s4heading": "묵상 한 줄", "memoHint": "지금 '내 눈에 옳다'며 밀어붙이고 있는 것이 있다면 무엇입니까? 그것을 '아버지의 원대로'의 기도 앞에 내려놓는다면 무엇이 달라질까요?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "결정 앞에서 한 번 더 묻기", "value": "오늘 내리는 선택 하나에 '내가 좋은가'가 아니라 '하나님이 기뻐하시는가'를 먼저 묻기"}, {"key": "act2", "label": "숨긴 것 정직하게 나누기", "value": "가족이나 믿을 만한 사람에게 숨겨왔던 작은 일 하나를 정직하게 나누기"}, {"key": "act3", "label": "약점의 출구 막기", "value": "나를 자주 넘어뜨리는 유혹의 통로(앱·장소·시간) 하나를 오늘 구체적으로 막기"}, {"key": "act4", "label": "겟세마네 기도", "value": "붙들고 있는 소원 하나를 놓고 '나의 원대로 마옵시고 아버지의 원대로 하옵소서'라고 기도하기"}, {"key": "act5", "label": "관계를 진실로 세우기", "value": "정보나 비밀을 무기로 쓰지 않고, 상대가 안전하게 진실을 말할 수 있도록 먼저 들어주기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "제가 잘못된 길을 갈 때에도 구원 계획을 멈추지 않으시고, 실패 속에서도 여전히 일하시는 하나님께 감사합니다"}, {"key": "p2", "tag": "회개", "text": "하나님의 뜻보다 내 눈에 옳은 것을 따라가고, 작은 타협을 숨기며 경계를 무시했던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "쓰임받는 것에 머물지 않고 예수님을 닮아가게 하시며, 날마다 '나의 원대로 마옵시고 아버지의 원대로'를 기도하게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "September 30, Wednesday", "ref": "Judges 14:1–20", "headline": "What Looks Good in My Eyes —<br>Is It Really Right?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · Judges 14:1-20", "s1heading": "Today's Word", "verse": "\"My Father, if it be possible, let this cup pass from Me;<br>nevertheless, not as I will, but as You will.\"", "verseRef": "Matthew 26:39", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · Chapter 13, Where God Decided — Chapter 14, Where My Eyes Decide", "paragraphs": ["Chapter 13 was a story God began entirely on His own. No one cried out, yet God came first, gave life, and set Samson apart as a Nazirite before he was born. But in chapter 14 the mood changes. Samson, now a young man, follows <mark>what looks good in his own eyes</mark> rather than asking for God's will.", "What's remarkable is God. Even as Samson goes the wrong way, God's plan of salvation doesn't stop. But we must be clear: God didn't make Samson sin, nor did He approve of his desires. Just as Judas's betrayal was truly sin yet couldn't overturn God's plan of salvation through the cross, God uses even Samson's wrong choices within His saving purposes."], "points": ["Being used by God is not the same as becoming like God."]}, {"title": "Verses 1–4 · \"She Is Right in My Eyes\"", "paragraphs": ["Samson goes down to Timnah and <mark>sees</mark> a Philistine woman. He demands of his parents, \"Get her for me as my wife.\" His parents object — not just because she's from another people. The Philistines were oppressing Israel, and the phrase \"uncircumcised Philistines\" marks the spiritual boundary between the covenant people and them.", "Samson answers — in many translations, \"she pleases me,\" but the Hebrew literally says <mark>\"she is right in my eyes.\"</mark> This is the key phrase of chapter 14. Israel's standard was supposed to be \"what is right in the eyes of the LORD.\" But Samson's standard is \"what is right in my eyes.\" And this phrase foreshadows the closing line of Judges: <mark>\"everyone did what was right in his own eyes.\"</mark> Samson was one man, but he mirrored all of Israel at that time.", "Verse 4 says something surprising: \"His father and mother did not know that it was from the LORD, for He was seeking an opportunity against the Philistines.\" That God <mark>used</mark> something is different from God <mark>approving</mark> it. Israel had grown used to Philistine rule for forty years, and God was breaking that false peace."], "points": ["Desire makes what I want feel like what's right. An uncomfortable salvation is better than a false peace — sometimes God breaks the ways of life we've grown too used to."]}, {"title": "Verses 5–9 · A Samson Who Hides, and Small Compromises That Pile Up", "paragraphs": ["Near the vineyards of Timnah, a young lion roars at Samson. <mark>\"The Spirit of the LORD rushed upon him\"</mark> — and he tears the lion apart with his bare hands. Let's be clear: the source of Samson's strength wasn't his hair but the Spirit of the LORD. Yet Samson doesn't tell his parents about this astonishing event. A secret has formed that his parents don't know. After meeting the woman, Scripture repeats, \"she was right in Samson's eyes\" — he saw in verse 1, and in verses 3 and 7 he's still judging by his own eyes. Ironically, Samson will later lose those very eyes.", "Some time later, Samson deliberately turns aside to see the lion's carcass. Inside is a swarm of bees and honey. He sees it, scoops it into his hands, eats, and gives some to his parents. This flow — <mark>see, take, eat, give</mark> — echoes Genesis 3. As a Nazirite, he touched an unclean carcass, and he doesn't say where the honey came from. He hides again."], "points": ["Collapse usually doesn't start with one final choice. When we keep ignoring small boundaries, our senses grow dull. Knowing the weaknesses that trip us up — and their entry points — matters as much as knowing our strengths."]}, {"title": "Verses 10–18 · The Riddle — A Secret That Broke a Relationship", "paragraphs": ["At the wedding feast, the Philistines assign thirty companions to Samson. He poses a riddle: <mark>\"Out of the eater came something to eat. Out of the strong came something sweet.\"</mark> The answer was the honey in the dead lion — but since he hadn't even told his parents, only Samson could know it. An unsolvable puzzle, with a big wager of thirty linen garments and thirty changes of clothes, turned a game into a battle of pride.", "Unable to solve it, the Philistines threaten Samson's wife: \"We will burn you and your father's house with fire.\" We can't see her simply as a wicked betrayer — her life and her family's lives were under threat. She weeps and keeps pressing him, \"You only hate me; you don't love me,\" until Samson finally tells her the secret. <mark>A man strong enough to tear apart a lion collapses under the pressure of a relationship.</mark> This scene foreshadows what will later happen with Delilah.", "When the Philistines give the answer, Samson says harshly, \"If you had not plowed with my heifer, you would not have found out my riddle.\" In chapter 14, no one is honest with anyone. Samson hides things from his parents; his wife hides from her husband that she's being threatened. The marriage has become a relationship not of love, but of secrets, threats, and manipulation."], "points": ["Even the strongest person can fall through a weakness they don't recognize. A healthy relationship isn't one where secrets are used as weapons, but one where truth can be shared safely."]}, {"title": "Verses 19–20 · Salvation That Begins Through Conflict", "paragraphs": ["Shamed and angry, Samson has <mark>the Spirit of the LORD rush upon him again</mark>. He goes down to Ashkelon, strikes down thirty Philistines, and takes their garments to pay off the wager. Two currents run together here. Samson has anger, wounded pride, and a desire for revenge — but God is beginning the conflict with the Philistines He spoke of in verse 4. That the Spirit gave Samson power doesn't mean God approved of all his motives and character.", "Chapter 14 began with \"Get her for me as my wife.\" He thought she was right in his eyes and pushed ahead despite his parents' objections. And how does verse 20 end? <mark>The woman is given to another man.</mark> He pushed to the end but didn't get what he wanted; all that remained in his hands was anger and broken relationships."], "points": ["Power cannot replace character. We must ask not only \"How much am I being used?\" but \"How much am I becoming like Jesus?\""]}, {"title": "Application · Not What's Right in My Eyes, but As the Father Wills", "paragraphs": ["Samson says, \"It's right in my eyes.\" But Jesus, facing the cross in Gethsemane, prayed earnestly: <mark>\"Not as I will, but as You will.\"</mark> This is the life of a disciple. We make countless choices every day. So many things look good to our eyes, our emotions want many things, and some things feel like we simply must have them. But we need to ask once more: \"Is this what pleases God?\" Getting what's right in my eyes is not necessarily a blessing.", "And remember one more thing: our wrong choices don't bring down God's sovereignty. Even Samson's failures couldn't stop God's plan of salvation. So don't despair over past failures. At the same time, don't use God's sovereignty as an excuse to justify wrong choices."], "points": ["What desire keeps tripping you up today? In what area are you following what's right in your own eyes rather than God's will? Return to Jesus' prayer."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether my recent choices have been based on 'does it look good to me' rather than 'does it please God.'"}, {"key": "c2", "text": "I checked whether there's a small compromise or secret I'm hiding from my family or those close to me."}, {"key": "c3", "text": "I honestly reflected on what weakness keeps tripping me up, and where its entry point is."}, {"key": "c4", "text": "I checked whether I'm not content just being used, but seeking a change in character that makes me more like Jesus."}], "s4heading": "One-Line Reflection", "memoHint": "Is there something you're pushing ahead with because it's 'right in your eyes'? What would change if you laid it before the prayer 'as the Father wills'?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Ask Once More Before Deciding", "value": "For one choice today, ask first not 'Do I like it?' but 'Does it please God?'"}, {"key": "act2", "label": "Share What You've Hidden", "value": "Honestly share one small thing you've been hiding with a family member or trusted person"}, {"key": "act3", "label": "Close the Entry Point", "value": "Concretely close one channel of temptation that often trips you up (an app, a place, a time of day)"}, {"key": "act4", "label": "Pray the Gethsemane Prayer", "value": "Take one wish you're holding onto and pray, 'Not as I will, but as You will'"}, {"key": "act5", "label": "Build Relationships on Truth", "value": "Instead of using information or secrets as weapons, listen first so the other person can safely speak the truth"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "God, thank You for not stopping Your plan of salvation even when I go the wrong way, and for still working in the midst of my failures."}, {"key": "p2", "tag": "Repent", "text": "I repent of following what's right in my own eyes rather than Your will, hiding small compromises, and ignoring boundaries."}, {"key": "p3", "tag": "Ask", "text": "Don't let me settle for being used — make me more like Jesus, and let me pray each day, 'Not as I will, but as You will.'"}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Setyembre 30, Miyerkules", "ref": "Mga Hukom 14:1–20", "headline": "Ang Mukhang Mabuti sa Aking Paningin —<br>Tama Ba Talaga?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Mga Hukom 14:1-20", "s1heading": "Salita Ngayon", "verse": "\"Ama ko, kung maaari, ilayo Mo sa Akin ang sarong ito;<br>gayunma'y hindi ang kalooban Ko ang masunod, kundi ang Iyo.\"", "verseRef": "Mateo 26:39", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Kabanata 13, Kung Saan Nagpasya ang Diyos — Kabanata 14, Kung Saan Nagpasya ang Aking Mata", "paragraphs": ["Ang kabanata 13 ay kwentong ganap na sinimulan ng Diyos. Walang dumaing, ngunit ang Diyos ang unang dumating, nagbigay ng buhay, at itinalaga si Samson bilang Nazareo bago pa siya isilang. Ngunit sa kabanata 14, nagbago ang kapaligiran. Si Samson, na binata na ngayon, ay sumusunod sa <mark>mukhang mabuti sa kanyang sariling paningin</mark> sa halip na hanapin ang kalooban ng Diyos.", "Ang kahanga-hanga ay ang Diyos. Kahit tumatahak si Samson sa maling daan, hindi humihinto ang plano ng Diyos na pagliligtas. Ngunit dapat nating linawin: hindi pinagkasala ng Diyos si Samson, at hindi Niya sinang-ayunan ang kanyang mga pagnanasa. Kung paanong ang pagtataksil ni Hudas ay tunay na kasalanan ngunit hindi nito naibagsak ang plano ng Diyos na pagliligtas sa pamamagitan ng krus, ginagamit ng Diyos kahit ang maling pagpili ni Samson sa loob ng Kanyang layunin ng pagliligtas."], "points": ["Ang pagiging ginagamit ng Diyos ay hindi katulad ng pagiging kawangis ng Diyos."]}, {"title": "Talata 1–4 · \"Siya'y Tama sa Aking Paningin\"", "paragraphs": ["Bumaba si Samson sa Timna at <mark>nakita</mark> ang isang babaeng Filisteo. Hiniling niya sa kanyang mga magulang, \"Kunin ninyo siya para sa akin bilang asawa.\" Tumutol ang kanyang mga magulang — hindi lamang dahil mula siya sa ibang bayan. Inaapi ng mga Filisteo ang Israel, at ang pariralang \"di-tuling Filisteo\" ay nagmamarka ng espirituwal na hangganan sa pagitan ng bayan ng tipan at nila.", "Sumagot si Samson — sa maraming salin, \"nakalulugod siya sa akin,\" ngunit literal na sinasabi ng Hebreo, <mark>\"siya'y tama sa aking paningin.\"</mark> Ito ang pangunahing parirala ng kabanata 14. Ang pamantayan ng Israel ay dapat na \"ano ang tama sa paningin ni Yahweh.\" Ngunit ang pamantayan ni Samson ay \"ano ang tama sa aking paningin.\" At ipinahihiwatig ng pariralang ito ang huling linya ng Mga Hukom: <mark>\"ginawa ng bawat isa ang tama sa kanyang sariling paningin.\"</mark> Iisang tao si Samson, ngunit sinasalamin niya ang buong Israel noong panahong iyon.", "Nakagugulat ang sinasabi ng talata 4: \"Hindi alam ng kanyang ama at ina na ito'y mula kay Yahweh, sapagkat naghahanap Siya ng pagkakataon laban sa mga Filisteo.\" Ang <mark>paggamit</mark> ng Diyos sa isang bagay ay iba sa <mark>pagsang-ayon</mark> Niya dito. Nasanay na ang Israel sa pamamahala ng Filisteo sa loob ng apatnapung taon, at sinisira ng Diyos ang huwad na kapayapaang iyon."], "points": ["Pinararamdam ng pagnanasa na ang gusto ko ay ang tama. Mas mabuti ang di-komportableng pagliligtas kaysa sa huwad na kapayapaan — kung minsan, sinisira ng Diyos ang mga paraan ng buhay na labis na nating kinasanayan."]}, {"title": "Talata 5–9 · Si Samson na Nagtatago, at Maliliit na Kompromisong Nagpapatong-patong", "paragraphs": ["Malapit sa mga ubasan ng Timna, isang batang leon ang umungal kay Samson. <mark>\"Dumaluhong sa kanya ang Espiritu ni Yahweh\"</mark> — at pinunit niya ang leon gamit ang walang lamang mga kamay. Linawin natin: ang pinagmumulan ng lakas ni Samson ay hindi ang kanyang buhok kundi ang Espiritu ni Yahweh. Ngunit hindi sinabi ni Samson sa kanyang mga magulang ang kahanga-hangang pangyayaring ito. Nagkaroon ng lihim na hindi alam ng kanyang mga magulang. Matapos makilala ang babae, inulit ng Kasulatan, \"siya'y tama sa paningin ni Samson\" — nakita niya sa talata 1, at sa talata 3 at 7 ay humahatol pa rin siya ayon sa sariling mata. Kabalintunaan, mawawala kay Samson sa huli ang mismong mga matang iyon.", "Makalipas ang ilang panahon, sadyang lumihis si Samson upang tingnan ang bangkay ng leon. Sa loob ay may kuyog ng mga bubuyog at pulot. Nakita niya ito, kinuha sa kanyang mga kamay, kinain, at binigyan ang kanyang mga magulang. Ang daloy na ito — <mark>nakita, kinuha, kinain, ibinigay</mark> — ay umaalingawngaw sa Genesis 3. Bilang Nazareo, humawak siya ng maruming bangkay, at hindi niya sinabi kung saan nanggaling ang pulot. Muli siyang nagtago."], "points": ["Karaniwang hindi nagsisimula ang pagbagsak sa isang huling pagpili. Kapag patuloy nating binabalewala ang maliliit na hangganan, pumupurol ang ating pakiramdam. Kasinghalaga ng pag-alam sa ating mga lakas ang pag-alam sa mga kahinaang nagpapatisod sa atin — at sa mga daanan nito."]}, {"title": "Talata 10–18 · Ang Bugtong — Isang Lihim na Sumira sa Relasyon", "paragraphs": ["Sa handaan ng kasal, nagtalaga ang mga Filisteo ng tatlumpung kasama kay Samson. Nagbigay siya ng bugtong: <mark>\"Mula sa kumakain ay lumabas ang makakain. Mula sa malakas ay lumabas ang matamis.\"</mark> Ang sagot ay ang pulot sa patay na leon — ngunit dahil hindi niya ito sinabi kahit sa kanyang mga magulang, si Samson lamang ang makakaalam. Isang bugtong na hindi malulutas, na may malaking pustahan ng tatlumpung linong damit at tatlumpung pampalit na kasuotan, na ginawang labanan ng pagmamataas ang isang laro.", "Dahil hindi nila malutas, binantaan ng mga Filisteo ang asawa ni Samson: \"Susunugin ka namin at ang bahay ng iyong ama.\" Hindi natin siya maaaring tingnan lamang bilang masamang taksil — nanganganib ang kanyang buhay at ang buhay ng kanyang pamilya. Umiyak siya at patuloy na pinilit si Samson, \"Kinapopootan mo lamang ako; hindi mo ako mahal,\" hanggang sa wakas ay sinabi ni Samson ang lihim. <mark>Ang lalaking sapat ang lakas upang punitin ang leon ay bumagsak sa ilalim ng presyon ng isang relasyon.</mark> Ipinahihiwatig ng eksenang ito ang mangyayari sa huli kay Delila.", "Nang sabihin ng mga Filisteo ang sagot, marahas na sinabi ni Samson, \"Kung hindi kayo nag-araro gamit ang aking dumalagang baka, hindi ninyo matutuklasan ang aking bugtong.\" Sa kabanata 14, walang tapat sa kanino man. Nagtatago si Samson sa kanyang mga magulang; itinago ng kanyang asawa na binabantaan siya. Ang kasal ay naging relasyon hindi ng pag-ibig, kundi ng mga lihim, pagbabanta, at pagmamanipula."], "points": ["Kahit ang pinakamalakas na tao ay maaaring bumagsak dahil sa kahinaang hindi niya kinikilala. Ang malusog na relasyon ay hindi yaong gumagamit ng lihim bilang sandata, kundi yaong ligtas na nakapagbabahagi ng katotohanan."]}, {"title": "Talata 19–20 · Pagliligtas na Nagsisimula sa Pamamagitan ng Alitan", "paragraphs": ["Napahiya at nagalit, <mark>muling dumaluhong kay Samson ang Espiritu ni Yahweh</mark>. Bumaba siya sa Ashkelon, pinatay ang tatlumpung Filisteo, at kinuha ang kanilang mga kasuotan upang bayaran ang pustahan. Dalawang agos ang sabay na umaagos dito. May galit si Samson, sugatang pagmamataas, at pagnanais na maghiganti — ngunit sinisimulan ng Diyos ang alitan sa mga Filisteo na binanggit Niya sa talata 4. Ang pagbibigay ng Espiritu ng kapangyarihan kay Samson ay hindi nangangahulugang sinang-ayunan ng Diyos ang lahat ng kanyang motibo at pagkatao.", "Nagsimula ang kabanata 14 sa \"Kunin ninyo siya para sa akin bilang asawa.\" Inakala niyang tama siya sa kanyang paningin at nagpumilit kahit tutol ang kanyang mga magulang. At paano nagtapos ang talata 20? <mark>Ang babae ay ibinigay sa ibang lalaki.</mark> Nagpumilit siya hanggang wakas ngunit hindi niya nakuha ang gusto niya; ang natira lamang sa kanyang mga kamay ay galit at sirang mga relasyon."], "points": ["Hindi kayang palitan ng kapangyarihan ang pagkatao. Dapat nating itanong hindi lamang \"Gaano ako ginagamit?\" kundi \"Gaano ako nagiging kawangis ni Jesus?\""]}, {"title": "Aplikasyon · Hindi ang Tama sa Aking Paningin, Kundi ang Kalooban ng Ama", "paragraphs": ["Sinabi ni Samson, \"Tama ito sa aking paningin.\" Ngunit si Jesus, na nahaharap sa krus sa Getsemani, ay taimtim na nanalangin: <mark>\"Hindi ang kalooban Ko, kundi ang Iyo.\"</mark> Ito ang buhay ng isang alagad. Gumagawa tayo ng napakaraming pagpili araw-araw. Maraming bagay ang mukhang mabuti sa ating mga mata, maraming gusto ang ating damdamin, at may mga bagay na tila dapat nating makuha. Ngunit kailangan nating magtanong muli: \"Ito ba ang nakalulugod sa Diyos?\" Ang makuha ang tama sa aking paningin ay hindi laging pagpapala.", "At tandaan ang isa pang bagay: hindi naibabagsak ng ating maling pagpili ang soberanya ng Diyos. Kahit ang mga kabiguan ni Samson ay hindi napahinto ang plano ng Diyos na pagliligtas. Kaya huwag mawalan ng pag-asa dahil sa mga nakaraang kabiguan. Kasabay nito, huwag gamitin ang soberanya ng Diyos bilang dahilan upang bigyang-katwiran ang maling pagpili."], "points": ["Anong pagnanasa ang paulit-ulit na nagpapatisod sa iyo ngayon? Sa anong larangan mo sinusunod ang tama sa iyong sariling paningin sa halip na ang kalooban ng Diyos? Bumalik sa panalangin ni Jesus."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung ang aking mga pagpili kamakailan ay batay sa 'mukhang mabuti ba sa akin' sa halip na 'nakalulugod ba sa Diyos.'"}, {"key": "c2", "text": "Sinuri ko kung may maliit na kompromiso o lihim na itinatago ko sa aking pamilya o mga malalapit sa akin."}, {"key": "c3", "text": "Tapat kong pinag-isipan kung anong kahinaan ang paulit-ulit na nagpapatisod sa akin, at kung nasaan ang daanan nito."}, {"key": "c4", "text": "Sinuri ko kung hindi ako nasisiyahan lamang na ginagamit, kundi naghahangad ng pagbabago ng pagkataong ginagawa akong mas kawangis ni Jesus."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "May ipinagpipilitan ka ba dahil 'tama ito sa iyong paningin'? Ano ang magbabago kung ilalagay mo ito sa harap ng panalanging 'ayon sa kalooban ng Ama'?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Magtanong Muli Bago Magpasya", "value": "Para sa isang pagpili ngayon, itanong muna hindi 'Gusto ko ba ito?' kundi 'Nakalulugod ba ito sa Diyos?'"}, {"key": "act2", "label": "Ibahagi ang Itinago", "value": "Tapat na ibahagi ang isang maliit na bagay na itinatago mo sa isang kapamilya o pinagkakatiwalaang tao"}, {"key": "act3", "label": "Isara ang Daanan", "value": "Tiyak na isara ang isang daanan ng tukso na madalas magpatisod sa iyo (isang app, lugar, o oras)"}, {"key": "act4", "label": "Ang Panalangin sa Getsemani", "value": "Kunin ang isang hangaring kinakapitan mo at manalangin, 'Hindi ang kalooban ko, kundi ang Iyo'"}, {"key": "act5", "label": "Itayo ang Relasyon sa Katotohanan", "value": "Sa halip na gamitin ang impormasyon o lihim bilang sandata, makinig muna upang ligtas na makapagsalita ng totoo ang kabila"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Diyos, salamat sa hindi Mo paghinto ng Iyong plano ng pagliligtas kahit tumatahak ako sa maling daan, at sa patuloy Mong paggawa sa gitna ng aking mga kabiguan."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa pagsunod sa tama sa aking sariling paningin sa halip na sa Iyong kalooban, sa pagtatago ng maliliit na kompromiso, at sa pagbalewala sa mga hangganan."}, {"key": "p3", "tag": "Kahilingan", "text": "Huwag Mo akong hayaang makuntento sa pagiging ginagamit — gawin Mo akong mas kawangis ni Jesus, at hayaang manalangin ako araw-araw, 'Hindi ang kalooban ko, kundi ang Iyo.'"}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-09-16';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
