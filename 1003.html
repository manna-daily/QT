<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "10월 3일 토요일", "ref": "사사기 16장 15–31절", "headline": "삼손은 힘을 잃기 전에<br>먼저 감각을 잃었습니다", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 사사기 16:15-31", "s1heading": "오늘의 말씀", "verse": "\"그가 내 안에, 내가 그 안에 거하면 사람이 열매를 많이 맺나니<br>나를 떠나서는 너희가 아무 것도 할 수 없음이라\"", "verseRef": "요한복음 15:5", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 삼손의 삶에서 우리를 보다", "paragraphs": ["오늘은 삼손의 마지막 이야기입니다. 삼손에게는 분명한 부르심이 있었습니다. 태어나기도 전에 하나님은 그를 구별하시고 블레셋의 손에서 이스라엘을 구원하기 시작할 사람으로 부르셨습니다. 문제는 그가 부르심을 몰랐던 것이 아닙니다. 17절에서 그는 분명히 말합니다. <mark>\"나는 모태에서부터 하나님의 나실인이 되었음이라\"</mark>. 그는 알았습니다. 그러나 부르심보다 자기 욕망을 더 중요하게 여겼습니다.", "삼손의 무너짐에는 몇 가지 흐름이 있었습니다. 하나님의 뜻보다 <mark>자기 눈</mark>을 따라 살았고, 거룩한 경계를 점점 가볍게 여겼습니다. 죽은 사자에게서 꿀을 꺼내 먹고, 블레셋 문화 깊숙이 들어가고, 마침내 나실인의 표지인 머리카락까지 가지고 놀았습니다. 육체의 능력이 너무 컸기에 오히려 위험을 위험으로 느끼지 못했고, 하나님의 은혜를 감사가 아니라 당연함으로 받아들였습니다.", "우리도 그렇습니다. 기도할 수 있다는 것, 말씀을 읽을 수 있다는 것, 예배하고 믿음의 공동체가 있다는 것이 얼마나 큰 은혜입니까? 그런데 은혜가 반복되면 어느 순간 '원래 있는 것', '내 권리'처럼 느껴질 수 있습니다. 오늘 본문의 중심은 20절과 28절 사이에 있습니다. 20절의 삼손은 <mark>\"내가 전과 같이 하리라\"</mark>고 말하고, 28절의 삼손은 <mark>\"나를 강하게 하옵소서\"</mark>라고 기도합니다."], "points": ["오늘 삼손을 평가하는 데서 멈추지 말고, 내 삶이 삼손과 닮아 있지는 않은지 진지하게 돌아보십시오."]}, {"title": "15–22절 · \"여호와께서 이미 자기를 떠나신 줄을 깨닫지 못하였더라\"", "paragraphs": ["들릴라가 말합니다. <mark>\"당신의 마음이 내게 있지 아니하면서 당신이 어찌 나를 사랑한다 하느냐\"</mark>. 그녀는 삼손의 사랑을 이용해 마음 가장 깊은 곳을 요구합니다. 14장에서 딤나의 아내도 \"당신이 나를 미워할 뿐이요 사랑하지 아니하는도다\"라며 같은 방식으로 비밀을 얻어냈습니다. 그런데도 삼손은 또 반복합니다. 실패를 경험하는 것과 실패에서 배우는 것은 다른 문제입니다.", "결국 삼손은 마음을 다 털어놓습니다. \"내 머리 위에는 삭도를 대지 아니하였나니 이는 내가 모태에서부터 하나님의 나실인이 되었음이라.\" 그의 비극은 단순한 무지가 아니었습니다. <mark>알면서도 가볍게 여긴 것</mark>입니다. 머리카락 자체에 마법적인 힘이 있었던 것이 아닙니다. 사사기는 그의 힘이 여호와의 영에게서 왔음을 반복해서 보여주었습니다. 머리를 미는 것은 단순한 이발이 아니라, 하나님께 받은 구별됨을 얼마나 가볍게 다뤘는지를 보여주는 절정이었습니다.", "\"삼손이여, 블레셋 사람들이 당신에게 들이닥쳤느니라!\" 삼손은 잠에서 깨어 생각합니다. <mark>\"내가 전과 같이 나가서 몸을 떨치리라\"</mark>. 지난번에도, 그전에도 괜찮았으니 이번에도 괜찮을 것이라는 생각입니다. 그러나 성경은 말합니다. <mark>\"여호와께서 이미 자기를 떠나신 줄을 깨닫지 못하였더라\"</mark>. 블레셋 사람들은 그의 두 눈을 빼고, 가사로 끌고 가 놋 줄로 매어 옥에서 맷돌을 돌리게 합니다. 평생 '내 눈에 옳은 것'을 따라 살던 사람이 눈을 잃고, 아무도 자신을 묶지 못한다던 사람이 묶이고, 사람들을 가지고 놀던 사람이 조롱거리가 됩니다.", "그런데 22절에 짧은 한 문장이 나옵니다. <mark>\"그의 머리털이 밀린 후에 다시 자라기 시작하니라\"</mark>. 뽑힌 눈은 돌아오지 않고 잃어버린 시간도 돌아오지 않습니다. 그러나 하나님은 삼손의 실패가 마지막 문장이 되도록 내버려두지 않으셨습니다."], "points": ["삼손은 육신의 힘을 잃기 전에 먼저 영적 감각을 잃었습니다. 영적 무뎌짐의 가장 위험한 단계는, 죄가 더 이상 위험하게 느껴지지 않는 상태입니다."]}, {"title": "23–27절 · 삼손의 패배가 여호와의 패배로 오해되다", "paragraphs": ["블레셋 방백들이 모여 그들의 신 다곤에게 큰 제사를 드리며 말합니다. <mark>\"우리의 신이 우리 원수 삼손을 우리 손에 넘겨주었다\"</mark>. 이제 이야기는 삼손 대 블레셋이 아니라, 그들의 눈에는 여호와 대 다곤의 싸움이 되어 버렸습니다. 그러나 삼손이 진 것은 다곤이 이겨서가 아니라, 여호와께서 그를 떠나셨기 때문이었습니다. 우상에게 돌아가는 거짓 영광은 반드시 무너져야 했습니다.", "블레셋 사람들은 흥겨워하며 말합니다. \"삼손을 불러다가 우리를 위하여 재주를 부리게 하자.\" 힘센 사사에서 죄수로, 죄수에서 구경거리로 추락했습니다. 그리고 삼손은 자기 손을 붙잡고 인도하는 소년에게 부탁합니다. <mark>\"나에게 이 집을 버틴 기둥을 찾아 그것을 의지하게 하라\"</mark>. 사자를 찢고, 성문을 통째로 뽑던 사람이 이제는 어린아이의 손 없이는 길도 찾지 못합니다. 그리고 바로 그 낮아진 자리에서 마지막 기도가 시작됩니다."], "points": ["죄가 약속하는 자유의 끝에는 묶임이 있습니다. 참된 자유는 하나님에게서 벗어나는 것이 아니라 하나님 안에 머무는 것입니다."]}, {"title": "28–31절 · 삼손의 마지막 기도", "paragraphs": ["삼손이 부르짖습니다. <mark>\"주 여호와여 구하옵나니 나를 생각하옵소서. 하나님이여 구하옵나니 이번만 나를 강하게 하사…\"</mark>. 세 가지가 들립니다 — 나를 기억하소서, 나를 강하게 하소서, 이번 한 번만. '기억하소서'는 단순히 잊지 말아 달라는 것을 넘어, 하나님이 맺으신 관계에 근거해 다시 사사로 세워 달라는 간구입니다. 물론 이것을 완전한 회개의 기도라 단정할 수는 없습니다. 그는 여전히 \"내 두 눈을 뺀 원수를 갚게 하옵소서\"라고 기도합니다. 그러나 분명히 달라진 것이 있습니다. 20절의 \"내가 전과 같이 하리라\"가 28절에서는 <mark>\"나를 강하게 하소서\"</mark>가 되었습니다.", "삼손은 양손으로 두 기둥을 붙들고 <mark>\"블레셋 사람과 함께 죽기를 원하노라\"</mark>며 힘을 다해 몸을 굽힙니다. 신전이 무너지고, \"삼손이 죽을 때에 죽인 자가 살았을 때에 죽인 자보다 더욱 많았더라.\" 승리이면서 동시에 비극입니다. 하나님은 삼손의 불완전한 동기까지 사용하셔서 블레셋의 지도력과 다곤의 거짓 영광에 큰 타격을 주셨습니다. \"그가 블레셋 사람의 손에서 이스라엘을 구원하기 <mark>시작하리라</mark>\"던 13장의 말씀대로, 그는 구원을 완성하지는 못했지만 시작했습니다.", "가족들이 그의 시신을 가져와 소라와 에스다올 사이, 아버지 마노아의 장지에 장사합니다. 13장에서 여호와의 영이 그를 처음 움직이기 시작했던 바로 그곳입니다. 성경은 그의 실패를 숨기지 않지만, 그의 삶 전체를 실패 하나로만 정의하지도 않습니다. 히브리서 11장은 놀랍게도 삼손을 믿음의 사람들 가운데 언급합니다."], "points": ["삼손이 회복한 가장 중요한 것은 머리카락이 아니라 기도였습니다. 회복의 시작은 \"나는 다시 강해져야 한다\"가 아니라 \"나는 하나님 없이는 약합니다\"라고 인정하는 것입니다."]}, {"title": "적용 · 가장 큰 회복은 다시 하나님을 의지하는 것", "paragraphs": ["죄는 말합니다. \"네가 원하는 대로 살아라. 그것이 자유고 행복이다.\" 삼손도 그렇게 살았습니다. 그러나 마지막에 눈을 잃고, 결박되고, 갇히고, 다른 사람에게 이끌렸습니다. 내 마음대로 살겠다는 자유가, 결국 아무것도 내 마음대로 할 수 없는 속박으로 끝났습니다. 예수님은 반대로 말씀하셨습니다. <mark>\"너희가 내 말에 거하면… 진리를 알지니 진리가 너희를 자유롭게 하리라\"</mark>. 참된 자유는 그리스도 안에, 말씀 안에 거할 때 옵니다.", "그리고 기억하십시오. 삼손의 눈은 돌아오지 않았습니다. 죄에는 결과가 있고, 잃어버린 시간과 무너진 관계와 남은 상처가 있을 수 있습니다. 은혜는 모든 결과를 없던 일로 만드는 것이 아닙니다. 그러나 \"머리털이 다시 자라기 시작하니라\" — 끝난 것 같은 자리에서도 하나님은 다시 시작하실 수 있습니다. 예수님은 말씀하십니다. <mark>\"나를 떠나서는 너희가 아무것도 할 수 없음이라\"</mark>. 이것이 삼손이 너무 늦게 배운 진리입니다."], "points": ["지금 예수님 안에 거하고 계십니까, 아니면 삼손처럼 \"전과 같이 할 수 있다\"며 자기 힘을 믿고 계십니까? 더 늦기 전에 돌아와 고백하십시오. \"주님, 저는 주님 없이는 아무것도 할 수 없습니다.\""]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "알면서도 가볍게 여기고 있는 하나님의 부르심이나 말씀이 없는지 돌아봤다"}, {"key": "c2", "text": "기도·말씀·예배·공동체를 은혜가 아니라 당연한 것으로 여기고 있지는 않은지 점검했다"}, {"key": "c3", "text": "'전과 같이 할 수 있다'며 하나님 없이 내 힘을 믿고 있는 영역이 없는지 돌아봤다"}, {"key": "c4", "text": "실패의 자리에서도 다시 시작하게 하시는 하나님을 바라보며 기도를 회복하고 있는지 점검했다"}], "s4heading": "묵상 한 줄", "memoHint": "지금 내 삶에서 '머리털이 다시 자라기 시작하는' 자리, 곧 하나님이 다시 시작하시길 원하는 곳은 어디입니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "기도 회복하기", "value": "오늘 정해진 시간에 '주님 없이는 아무것도 할 수 없습니다'라고 고백하며 기도하기"}, {"key": "act2", "label": "당연한 은혜에 감사", "value": "당연하게 여겼던 은혜 세 가지(기도·말씀·공동체 등)를 적고 감사드리기"}, {"key": "act3", "label": "무뎌진 감각 깨우기", "value": "더 이상 위험하게 느껴지지 않는 죄나 습관 하나를 정직하게 하나님 앞에 내놓기"}, {"key": "act4", "label": "다시 시작하기", "value": "실패로 멈춰 있던 영역 하나를 놓고 하나님께 다시 시작할 힘을 구하기"}, {"key": "act5", "label": "말씀 안에 거하기", "value": "요한복음 15장을 천천히 읽고 '내 안에 거하라'는 말씀을 하루 종일 붙들기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "실패한 자리에서도 머리털이 다시 자라게 하시듯, 끝난 것 같은 곳에서 저를 다시 시작하게 하시는 은혜를 감사합니다"}, {"key": "p2", "tag": "회개", "text": "부르심을 알면서도 가볍게 여기고, 은혜를 당연하게 여기며, '전과 같이 할 수 있다'고 제 힘을 믿었던 것을 회개합니다"}, {"key": "p3", "tag": "간구", "text": "제 영적 감각을 깨워 주시고, 주님 안에 거하며 '주님 없이는 아무것도 할 수 없다'고 날마다 고백하게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "October 3, Saturday", "ref": "Judges 16:15–31", "headline": "Samson Lost His Sense<br>Before He Lost His Strength", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · Judges 16:15-31", "s1heading": "Today's Word", "verse": "\"Whoever abides in Me and I in him, he it is that bears much fruit,<br>for apart from Me you can do nothing.\"", "verseRef": "John 15:5", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · Seeing Ourselves in Samson's Life", "paragraphs": ["Today is the last chapter of Samson's story. Samson had a clear calling: before he was born, God set him apart and called him to begin saving Israel from the Philistines. His problem wasn't that he didn't know his calling. In verse 17 he says plainly, <mark>\"I have been a Nazirite to God from my mother's womb.\"</mark> He knew. But he valued his own desires more than his calling.", "Several threads ran through Samson's collapse. He lived by <mark>his own eyes</mark> rather than God's will, and he treated holy boundaries more and more lightly — eating honey from a dead lion, going deep into Philistine culture, and finally toying with his hair, the sign of his Nazirite vow. Because his physical power was so great, he stopped feeling danger as danger, and he began to receive God's grace not with gratitude but as something he was owed.", "We're the same. What great grace it is that we can pray, read the Word, worship, and belong to a community of faith! But when grace repeats, at some point it can start to feel like 'just how things are,' even 'my right.' The heart of today's passage lies between verses 20 and 28. In verse 20 Samson says, <mark>\"I will go out as at other times,\"</mark> and in verse 28 he prays, <mark>\"Strengthen me.\"</mark>"], "points": ["Don't stop at evaluating Samson today — seriously reflect on whether your own life resembles his."]}, {"title": "Verses 15–22 · \"He Did Not Know That the LORD Had Left Him\"", "paragraphs": ["Delilah says, <mark>\"How can you say, 'I love you,' when your heart is not with me?\"</mark> She uses Samson's love to demand the deepest part of his heart. In chapter 14, the woman of Timnah got his secret the same way: \"You only hate me; you don't love me.\" Yet Samson repeats it. Experiencing failure and learning from failure are two different things.", "In the end Samson tells her all his heart: \"A razor has never come upon my head, for I have been a Nazirite to God from my mother's womb.\" His tragedy wasn't simple ignorance — it was <mark>knowing, yet treating it lightly</mark>. His hair had no magical power in itself; Judges repeatedly showed that his strength came from the Spirit of the LORD. Shaving his head wasn't just a haircut — it was the climax of how lightly he had treated the consecration God had given him.", "\"The Philistines are upon you, Samson!\" He wakes and thinks, <mark>\"I will go out as at other times and shake myself free.\"</mark> It was fine last time, and the time before, so it'll be fine this time too. But Scripture says, <mark>\"He did not know that the LORD had left him.\"</mark> The Philistines gouge out his eyes, take him down to Gaza, bind him with bronze shackles, and set him grinding at the mill in prison. The man who lived by 'what's right in my eyes' loses his eyes; the man no one could bind is bound; the man who toyed with others becomes their laughingstock.", "But verse 22 has one short sentence: <mark>\"But the hair of his head began to grow again after it had been shaved.\"</mark> The gouged eyes don't come back, and lost time doesn't return. But God did not let Samson's failure be the final sentence."], "points": ["Samson lost his spiritual sense before he lost his physical strength. The most dangerous stage of spiritual numbness is when sin no longer feels dangerous."]}, {"title": "Verses 23–27 · Samson's Defeat Mistaken for the LORD's Defeat", "paragraphs": ["The Philistine lords gather to offer a great sacrifice to their god Dagon, saying, <mark>\"Our god has given Samson our enemy into our hand.\"</mark> In their eyes, the story is no longer Samson versus the Philistines, but the LORD versus Dagon. But Samson fell not because Dagon won — he fell because the LORD had left him. The false glory being given to an idol had to come crashing down.", "In their revelry the Philistines say, \"Call Samson, that he may entertain us.\" From mighty judge to prisoner, from prisoner to spectacle. Then Samson asks the boy who leads him by the hand, <mark>\"Let me feel the pillars on which the house rests, that I may lean against them.\"</mark> The man who tore apart a lion and pulled up a city's gates can't even find his way without a child's hand. And it's in that lowest place that his final prayer begins."], "points": ["At the end of the freedom sin promises, there are chains. True freedom is not escaping from God, but abiding in God."]}, {"title": "Verses 28–31 · Samson's Final Prayer", "paragraphs": ["Samson cries out, <mark>\"O Lord GOD, please remember me and please strengthen me only this once, O God...\"</mark> Three things ring out: remember me, strengthen me, just this once. \"Remember\" means more than \"don't forget me\" — it's a plea, rooted in the relationship God had established, to be raised up again as judge. We can't call it a perfect prayer of repentance; he still prays, \"that I may be avenged on the Philistines for my two eyes.\" But something has clearly changed. Verse 20's \"I will go out as at other times\" has become verse 28's <mark>\"Strengthen me.\"</mark>", "Samson grasps the two pillars, one in each hand, says, <mark>\"Let me die with the Philistines,\"</mark> and bows with all his might. The house falls, and \"the dead whom he killed at his death were more than those whom he had killed during his life.\" It is both victory and tragedy. God used even Samson's imperfect motives to strike a heavy blow against the Philistine leadership and Dagon's false glory. As chapter 13 said, \"He shall <mark>begin</mark> to save Israel from the hand of the Philistines\" — he didn't complete the salvation, but he began it.", "His family brings his body and buries him between Zorah and Eshtaol in the tomb of his father Manoah — the very place where the Spirit of the LORD first began to stir him in chapter 13. Scripture doesn't hide his failures, but it doesn't define his whole life by failure alone either. Remarkably, Hebrews 11 lists Samson among the people of faith."], "points": ["The most important thing Samson recovered wasn't his hair — it was prayer. Restoration begins not with \"I need to be strong again,\" but with admitting, \"Without God, I am weak.\""]}, {"title": "Application · The Greatest Restoration Is Relying on God Again", "paragraphs": ["Sin says, \"Live however you want — that's freedom, that's happiness.\" Samson lived that way. But in the end he lost his eyes, was bound, imprisoned, and led by others. The freedom of 'living my own way' ended in bondage where nothing was his own way. Jesus said the opposite: <mark>\"If you abide in My word... you will know the truth, and the truth will set you free.\"</mark> True freedom comes when we abide in Christ and in His Word.", "And remember: Samson's eyes never came back. Sin has consequences — lost time, broken relationships, lingering wounds. Grace doesn't make every consequence vanish. But \"his hair began to grow again\" — even where everything seems over, God can begin again. Jesus says, <mark>\"Apart from Me you can do nothing.\"</mark> This is the truth Samson learned far too late."], "points": ["Are you abiding in Jesus right now — or, like Samson, trusting your own strength, saying \"I can do it as before\"? Come back before it's too late, and confess: \"Lord, without You I can do nothing.\""]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether there's a calling or word from God I know, yet treat lightly."}, {"key": "c2", "text": "I checked whether I've come to treat prayer, the Word, worship, and community as givens rather than grace."}, {"key": "c3", "text": "I reflected on whether there's an area where I trust my own strength without God, saying 'I can do it as before.'"}, {"key": "c4", "text": "I checked whether I'm recovering prayer, looking to the God who lets me begin again even from the place of failure."}], "s4heading": "One-Line Reflection", "memoHint": "Where in my life is the place where 'my hair is beginning to grow again' — where God wants to begin again?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Recover Prayer", "value": "At a set time today, pray and confess, 'Without You, Lord, I can do nothing'"}, {"key": "act2", "label": "Thank God for Grace You Took for Granted", "value": "Write down three graces you've taken for granted (prayer, the Word, community, etc.) and give thanks"}, {"key": "act3", "label": "Wake Your Dulled Sense", "value": "Honestly bring before God one sin or habit that no longer feels dangerous"}, {"key": "act4", "label": "Begin Again", "value": "For one area that's been stalled by failure, ask God for strength to begin again"}, {"key": "act5", "label": "Abide in the Word", "value": "Read John 15 slowly and hold onto 'Abide in Me' all day"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You for the grace that lets me begin again even where everything seems over — just as You made Samson's hair grow again."}, {"key": "p2", "tag": "Repent", "text": "I repent of knowing my calling yet treating it lightly, taking grace for granted, and trusting my own strength, saying 'I can do it as before.'"}, {"key": "p3", "tag": "Ask", "text": "Awaken my spiritual senses, and let me abide in You, confessing every day, 'Without You I can do nothing.'"}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Oktubre 3, Sabado", "ref": "Mga Hukom 16:15–31", "headline": "Nawala Muna kay Samson ang Pakiramdam<br>Bago ang Kanyang Lakas", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Mga Hukom 16:15-31", "s1heading": "Salita Ngayon", "verse": "\"Ang nananatili sa Akin at Ako sa kanya ay mamumunga nang sagana,<br>sapagkat kung hiwalay kayo sa Akin ay wala kayong magagawa.\"", "verseRef": "Juan 15:5", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Nakikita ang Ating Sarili sa Buhay ni Samson", "paragraphs": ["Ngayon ang huling kabanata ng kwento ni Samson. May malinaw na pagkatawag si Samson: bago pa siya isilang, itinalaga siya ng Diyos at tinawag upang magsimulang iligtas ang Israel mula sa mga Filisteo. Ang problema ay hindi dahil hindi niya alam ang kanyang pagkatawag. Sa talata 17, malinaw niyang sinabi, <mark>\"Ako'y Nazareo sa Diyos mula sa sinapupunan ng aking ina.\"</mark> Alam niya. Ngunit mas pinahalagahan niya ang sariling pagnanasa kaysa sa kanyang pagkatawag.", "May ilang hibla sa pagbagsak ni Samson. Namuhay siya ayon sa <mark>kanyang sariling mata</mark> sa halip na sa kalooban ng Diyos, at lalo niyang binalewala ang mga banal na hangganan — kumain ng pulot mula sa patay na leon, pumasok nang malalim sa kultura ng Filisteo, at sa huli ay pinaglaruan ang kanyang buhok, ang tanda ng kanyang panata bilang Nazareo. Dahil napakalaki ng kanyang pisikal na kapangyarihan, hindi na niya naramdaman ang panganib bilang panganib, at nagsimula niyang tanggapin ang biyaya ng Diyos hindi nang may pasasalamat kundi bilang karapatan.", "Ganoon din tayo. Napakalaking biyaya na nakapananalangin tayo, nakababasa ng Salita, nakasasamba, at may komunidad ng pananampalataya! Ngunit kapag paulit-ulit ang biyaya, maaaring sa isang punto ay maramdaman natin itong 'ganyan talaga,' o maging 'karapatan ko.' Ang puso ng binasa natin ngayon ay nasa pagitan ng talata 20 at 28. Sa talata 20, sinabi ni Samson, <mark>\"Lalabas ako gaya ng dati,\"</mark> at sa talata 28, nanalangin siya, <mark>\"Palakasin Mo ako.\"</mark>"], "points": ["Huwag huminto sa pagsusuri kay Samson ngayon — seryosong pagnilayan kung kahawig ng kanya ang iyong sariling buhay."]}, {"title": "Talata 15–22 · \"Hindi Niya Nalaman na Iniwan na Siya ni Yahweh\"", "paragraphs": ["Sinabi ni Delila, <mark>\"Paano mo masasabing 'Mahal kita,' gayong wala sa akin ang iyong puso?\"</mark> Ginamit niya ang pag-ibig ni Samson upang hingin ang pinakamalalim na bahagi ng kanyang puso. Sa kabanata 14, ganito rin nakuha ng babae sa Timna ang kanyang lihim: \"Kinapopootan mo lamang ako; hindi mo ako mahal.\" Ngunit inulit pa rin ito ni Samson. Ang pagdanas ng kabiguan at ang pagkatuto mula sa kabiguan ay dalawang magkaibang bagay.", "Sa huli, sinabi ni Samson ang lahat ng nasa kanyang puso: \"Hindi pa kailanman dumampi ang labaha sa aking ulo, sapagkat ako'y Nazareo sa Diyos mula sa sinapupunan ng aking ina.\" Ang kanyang trahedya ay hindi simpleng kamangmangan — ito ay <mark>pagkaalam, ngunit pagbalewala</mark>. Walang mahiwagang kapangyarihan ang kanyang buhok mismo; paulit-ulit na ipinakita ng Mga Hukom na ang kanyang lakas ay mula sa Espiritu ni Yahweh. Ang pag-ahit ng kanyang ulo ay hindi lamang gupit — ito ang rurok ng kung gaano niya binalewala ang pagkakatalagang ibinigay sa kanya ng Diyos.", "\"Narito na sa iyo ang mga Filisteo, Samson!\" Nagising siya at nag-isip, <mark>\"Lalabas ako gaya ng dati at kakawala ako.\"</mark> Okay naman noong nakaraan, at bago pa noon, kaya okay din ngayon. Ngunit sinasabi ng Kasulatan, <mark>\"Hindi niya nalaman na iniwan na siya ni Yahweh.\"</mark> Dinukit ng mga Filisteo ang kanyang mga mata, dinala siya sa Gaza, ginapos ng tansong kadena, at pinagiling sa bilangguan. Ang taong namuhay ayon sa 'tama sa aking paningin' ay nawalan ng mata; ang taong hindi maigapos ninuman ay naigapos; ang taong naglalaro sa iba ay naging katatawanan nila.", "Ngunit may isang maikling pangungusap sa talata 22: <mark>\"Ngunit nagsimulang tumubo muli ang buhok sa kanyang ulo matapos itong ahitan.\"</mark> Hindi na bumalik ang mga dinukit na mata, at hindi na bumalik ang nawalang panahon. Ngunit hindi hinayaan ng Diyos na ang kabiguan ni Samson ang maging huling pangungusap."], "points": ["Nawala muna kay Samson ang espirituwal na pakiramdam bago ang pisikal na lakas. Ang pinakamapanganib na yugto ng espirituwal na pagkamanhid ay kapag hindi na mapanganib ang pakiramdam ng kasalanan."]}, {"title": "Talata 23–27 · Ang Pagkatalo ni Samson ay Napagkamalang Pagkatalo ni Yahweh", "paragraphs": ["Nagtipon ang mga pinuno ng Filisteo upang maghandog ng malaking handog sa kanilang diyos na si Dagon, na sinasabing, <mark>\"Ibinigay ng aming diyos sa aming kamay si Samson na aming kaaway.\"</mark> Sa kanilang paningin, ang kwento ay hindi na Samson laban sa Filisteo, kundi Yahweh laban kay Dagon. Ngunit bumagsak si Samson hindi dahil nanalo si Dagon — bumagsak siya dahil iniwan siya ni Yahweh. Kailangang gumuho ang huwad na kaluwalhatiang ibinibigay sa isang diyus-diyosan.", "Sa kanilang pagsasaya, sinabi ng mga Filisteo, \"Tawagin si Samson upang aliwin tayo.\" Mula sa makapangyarihang hukom tungo sa bilanggo, mula sa bilanggo tungo sa panoorin. Pagkatapos ay hiniling ni Samson sa batang umaakay sa kanya, <mark>\"Ipadama mo sa akin ang mga haliging pinagpapatungan ng bahay, upang makasandal ako sa mga ito.\"</mark> Ang taong pumunit sa leon at bumunot sa mga pintuan ng lungsod ay hindi man lamang makita ang daan nang walang kamay ng isang bata. At sa pinakamababang lugar na iyon nagsimula ang kanyang huling panalangin."], "points": ["Sa dulo ng kalayaang ipinapangako ng kasalanan ay may mga tanikala. Ang tunay na kalayaan ay hindi pagtakas mula sa Diyos, kundi pananatili sa Diyos."]}, {"title": "Talata 28–31 · Ang Huling Panalangin ni Samson", "paragraphs": ["Dumaing si Samson, <mark>\"O Panginoong Yahweh, alalahanin Mo ako, at palakasin Mo ako kahit ngayon lamang, O Diyos...\"</mark> Tatlong bagay ang umaalingawngaw: alalahanin Mo ako, palakasin Mo ako, ngayon lamang. Ang \"alalahanin\" ay higit pa sa \"huwag Mo akong kalimutan\" — ito ay pakiusap, batay sa relasyong itinatag ng Diyos, na muling itaas siya bilang hukom. Hindi natin ito matatawag na ganap na panalangin ng pagsisisi; nananalangin pa rin siya, \"upang makapaghiganti ako sa mga Filisteo para sa aking dalawang mata.\" Ngunit may malinaw na nagbago. Ang \"Lalabas ako gaya ng dati\" sa talata 20 ay naging <mark>\"Palakasin Mo ako\"</mark> sa talata 28.", "Hinawakan ni Samson ang dalawang haligi, isa sa bawat kamay, sinabing <mark>\"Hayaan Mo akong mamatay kasama ng mga Filisteo,\"</mark> at buong lakas na yumuko. Gumuho ang bahay, at \"ang mga napatay niya sa kanyang kamatayan ay higit pa sa mga napatay niya habang siya'y buhay.\" Ito ay tagumpay at trahedya nang sabay. Ginamit ng Diyos kahit ang di-ganap na motibo ni Samson upang magbigay ng mabigat na dagok sa pamunuan ng Filisteo at sa huwad na kaluwalhatian ni Dagon. Gaya ng sinabi sa kabanata 13, \"Siya'y <mark>magsisimulang</mark> magligtas sa Israel mula sa kamay ng mga Filisteo\" — hindi niya natapos ang pagliligtas, ngunit sinimulan niya ito.", "Dinala ng kanyang pamilya ang kanyang bangkay at inilibing sa pagitan ng Zora at Estaol sa libingan ng kanyang amang si Manoa — ang mismong lugar kung saan unang nagsimulang kumilos sa kanya ang Espiritu ni Yahweh sa kabanata 13. Hindi itinatago ng Kasulatan ang kanyang mga kabiguan, ngunit hindi rin nito binibigyang-kahulugan ang buong buhay niya sa kabiguan lamang. Kahanga-hanga, inililista ng Hebreo 11 si Samson kasama ng mga tao ng pananampalataya."], "points": ["Ang pinakamahalagang naibalik kay Samson ay hindi ang kanyang buhok — kundi ang panalangin. Ang pagpapanumbalik ay nagsisimula hindi sa \"Kailangan kong lumakas muli,\" kundi sa pag-amin na \"Kung wala ang Diyos, ako'y mahina.\""]}, {"title": "Aplikasyon · Ang Pinakadakilang Pagpapanumbalik ay Muling Pag-asa sa Diyos", "paragraphs": ["Sinasabi ng kasalanan, \"Mamuhay ka ayon sa gusto mo — iyan ang kalayaan, iyan ang kaligayahan.\" Ganoon namuhay si Samson. Ngunit sa huli, nawalan siya ng mata, ginapos, ibinilanggo, at inakay ng iba. Ang kalayaan ng 'pamumuhay sa sarili kong paraan' ay nagtapos sa pagkaalipin kung saan walang anumang ayon sa kanyang paraan. Kabaligtaran ang sinabi ni Jesus: <mark>\"Kung mananatili kayo sa Aking salita... makikilala ninyo ang katotohanan, at palalayain kayo ng katotohanan.\"</mark> Ang tunay na kalayaan ay dumarating kapag nananatili tayo kay Cristo at sa Kanyang Salita.", "At tandaan: hindi na bumalik ang mga mata ni Samson. May mga bunga ang kasalanan — nawalang panahon, sirang relasyon, natitirang sugat. Hindi pinawawala ng biyaya ang bawat bunga. Ngunit \"nagsimulang tumubo muli ang kanyang buhok\" — kahit kung saan tila tapos na ang lahat, kaya ng Diyos na magsimulang muli. Sinabi ni Jesus, <mark>\"Kung hiwalay kayo sa Akin ay wala kayong magagawa.\"</mark> Ito ang katotohanang huli nang natutunan ni Samson."], "points": ["Nananatili ka ba kay Jesus ngayon — o, tulad ni Samson, nagtitiwala sa sariling lakas, sinasabing \"Kaya ko gaya ng dati\"? Bumalik ka bago mahuli ang lahat, at ipahayag: \"Panginoon, kung wala Ka ay wala akong magagawa.\""]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung may pagkatawag o salita ng Diyos na alam ko, ngunit binabalewala ko."}, {"key": "c2", "text": "Sinuri ko kung itinuturing ko na lamang na karaniwan ang panalangin, Salita, pagsamba, at komunidad sa halip na biyaya."}, {"key": "c3", "text": "Pinag-isipan ko kung may bahaging nagtitiwala ako sa sariling lakas nang walang Diyos, sinasabing 'Kaya ko gaya ng dati.'"}, {"key": "c4", "text": "Sinuri ko kung ibinabalik ko ang panalangin, tumitingin sa Diyos na nagpapahintulot sa aking magsimulang muli kahit mula sa lugar ng kabiguan."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Saan sa aking buhay ang lugar kung saan 'nagsisimulang tumubo muli ang aking buhok' — kung saan nais ng Diyos na magsimulang muli?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Ibalik ang Panalangin", "value": "Sa isang takdang oras ngayon, manalangin at ipahayag, 'Kung wala Ka, Panginoon, ay wala akong magagawa'"}, {"key": "act2", "label": "Magpasalamat sa Biyayang Binalewala", "value": "Isulat ang tatlong biyayang binalewala mo (panalangin, Salita, komunidad, atbp.) at magpasalamat"}, {"key": "act3", "label": "Gisingin ang Namanhid na Pakiramdam", "value": "Tapat na dalhin sa Diyos ang isang kasalanan o ugaling hindi na mapanganib ang pakiramdam"}, {"key": "act4", "label": "Magsimulang Muli", "value": "Para sa isang bahaging natigil dahil sa kabiguan, humingi sa Diyos ng lakas upang magsimulang muli"}, {"key": "act5", "label": "Manatili sa Salita", "value": "Basahin nang dahan-dahan ang Juan 15 at kapitan ang 'Manatili kayo sa Akin' buong araw"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat sa biyayang nagpapahintulot sa aking magsimulang muli kahit kung saan tila tapos na ang lahat — kung paanong pinatubo Mong muli ang buhok ni Samson."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa pagkaalam ng aking pagkatawag ngunit pagbalewala dito, sa pagtrato sa biyaya bilang karaniwan, at sa pagtitiwala sa sariling lakas, sinasabing 'Kaya ko gaya ng dati.'"}, {"key": "p3", "tag": "Kahilingan", "text": "Gisingin Mo ang aking espirituwal na pakiramdam, at hayaang manatili ako sa Iyo, ipinapahayag araw-araw, 'Kung wala Ka ay wala akong magagawa.'"}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-09-16';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
