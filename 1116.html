<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "11월 16일 월요일", "ref": "고린도후서 12장 1–13절", "headline": "약함이 남아 있어도<br>주님은 일하십니다", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 고린도후서 12:1-13", "s1heading": "오늘의 말씀", "verse": "\"나에게 이르시기를 내 은혜가 네게 족하도다<br>이는 내 능력이 약한 데서 온전하여짐이라 하신지라<br>그러므로 도리어 크게 기뻐함으로 나의 여러 약한 것들에 대하여 자랑하리니\"", "verseRef": "고린도후서 12:9", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 해결되지 않은 연약함 속에도 은혜는 충분합니까", "paragraphs": ["우리는 하나님의 능력이 함께하면 문제가 빨리 해결되리라 기대합니다. 그래서 어려움이 오래 남으면 믿음이 부족한 것인지, 하나님이 함께하지 않으시는 것인지 생각하게 됩니다. 바울에게는 특별한 체험도 있었고 사역 가운데 놀라운 역사도 있었습니다. 그럼에도 <mark>자신을 괴롭히는 육체의 가시는 남아 있었습니다</mark>.", "앞에서 바울은 복음을 전하다 겪은 고난과 광주리에 실려 다메섹을 빠져나온 일을 숨기지 않고 오히려 자랑했습니다. 오늘은 하늘에 이끌려 간 특별한 경험을 먼저 언급하지만, 이야기는 곧 육체의 가시와 그리스도의 은혜로 이어집니다. 바울이 드러내려는 것은 <mark>연약한 자신을 통해 일하시는 주님의 능력</mark>입니다. 우리의 연약함은 주님의 일하심을 막는 결정적인 이유가 되지 않습니다. 오히려 그 자리에서 주님을 더욱 의지하고 그분의 능력을 드러낼 수 있습니다."], "points": ["지금 내게 남아 있는 연약함 때문에, 주님이 함께하지 않으신다고 단정하고 있지는 않습니까?"]}, {"title": "1–6절 · 특별한 체험보다 삶과 가르침으로 판단받기를", "paragraphs": ["바울은 <mark>\"무익하나마 내가 부득불 자랑하노니 주의 환상과 계시를 말하리라\"</mark>(1절)고 합니다. 경험 자체보다 그것으로 우월함을 증명하려는 자랑을 경계하는 것입니다. <mark>\"그리스도 안에 있는 한 사람\"</mark>(2절)은 바울 자신이지만, 그는 자신을 제삼자처럼 표현하며 자기 자랑에서 의도적으로 거리를 둡니다. 14년 전 <mark>셋째 하늘</mark>과 <mark>낙원</mark>에 이끌려 간 경험이었지만, 몸 안에 있었는지 밖에 있었는지 모른다고 거듭 말하며 \"하나님은 아시느니라\"고 인정합니다. 들은 말도 공개하지 않습니다. 바울이 설명하지 않는 부분을 우리가 상상으로 채울 필요는 없습니다.", "바울은 진실한 경험이라도 <mark>\"누가 나를 보는 바와 내게 듣는 바에 지나치게 생각할까 두려워하여\"</mark>(6절) 자랑을 멈춥니다. 자신에게서 본 삶과 들은 가르침을 살피라는 것입니다. <mark>개인의 특별한 체험은 공동체의 분별을 대신할 수 없습니다</mark>. 그 가르침과 삶이 그리스도의 복음에 합당한지 함께 살펴야 합니다."], "points": ["영적 성숙은 나를 크게 보이게 하기보다, 사람들이 그리스도를 바르게 바라보도록 돕는 태도에서 드러납니다."]}, {"title": "7–8절 · 육체의 가시와 세 번의 간구", "paragraphs": ["<mark>\"여러 계시를 받은 것이 지극히 크므로 너무 자만하지 않게 하시려고 내 육체에 가시 곧 사탄의 사자를 주셨으니\"</mark>(7절). 6절에서 다른 사람이 자신을 지나치게 높이는 일을 경계했다면, 이제는 스스로 높아지는 것을 막으시는 하나님의 손길을 고백합니다. 이 가시를 질병이나 지속적인 박해로 보기도 하지만 본문은 정체를 밝히지 않습니다. 분명한 것은 바울이 실제로 괴로움과 한계를 겪었다는 사실입니다. 그는 그것을 사탄의 사자라 부르면서도 그 안에서 하나님의 목적을 고백합니다. <mark>사탄의 괴롭힘이 하나님의 선한 뜻까지 무너뜨리지는 못했습니다</mark>. 다만 이것으로 다른 사람의 고통을 교만에 대한 벌이라고 판단해서는 안 됩니다.", "<mark>\"이것이 내게서 떠나가게 하기 위하여 내가 세 번 주께 간구하였더니\"</mark>(8절). 바울도 고통이 사라지기를 간절히 바랐습니다. 고난을 많이 겪을수록 신앙이 훌륭해진다고 생각하지 않았고, 해결할 수 없는 문제를 주님께 가져갔습니다. <mark>우리도 회복과 도움을 구하며 기도할 수 있습니다</mark>."], "points": ["고통이 떠나가기를 구하는 기도는 믿음이 부족해서가 아니라, 해결할 수 없는 문제를 주님께 맡기는 믿음입니다."]}, {"title": "9–10절 · \"내 은혜가 네게 족하도다\"", "paragraphs": ["주님은 응답하십니다. <mark>\"내 은혜가 네게 족하도다 이는 내 능력이 약한 데서 온전하여짐이라\"</mark>(9절). 가시가 별로 아프지 않다는 뜻이 아닙니다. 고통 속에서도 바울을 붙들고 복음을 전하며 사람을 섬기게 하시는 은혜가 충분하다는 뜻입니다. 능력이 \"온전하여진다\"는 것은 원래 불완전했다는 뜻이 아니라, 약한 바울을 통해 그 능력이 충분히 역사하며 드러난다는 뜻입니다. <mark>약함이 모두 사라져야 주님의 능력이 시작되는 것이 아닙니다</mark>. 바울은 낙원에서 들은 말은 전하지 않았지만, 가시 가운데 받은 이 응답은 분명히 전합니다.", "그래서 바울은 <mark>\"그리스도의 능력이 내게 머물게\"</mark> 하려고 약함을 자랑합니다. '머문다'에는 장막을 쳐 덮는 그림이 담겨 있습니다. 그리고 <mark>\"그리스도를 위하여 약한 것들과 능욕과 궁핍과 박해와 곤고를 기뻐하노니 이는 내가 약한 그 때에 강함이라\"</mark>(10절)고 고백합니다. 이는 죄나 무책임을 정당화하는 말씀이 아니며, 약함을 일부러 만들거나 고난의 크기를 비교할 이유도 없습니다. 부족함 속에서도 그리스도의 능력을 의지해 살아간다는 고백입니다."], "points": ["가시가 사라졌다는 말씀은 없지만, 가시를 바라보는 바울의 기준이 달라졌습니다."]}, {"title": "11–13절 · 교회가 직접 경험한 사역의 증거", "paragraphs": ["고린도 성도들은 바울을 통해 복음을 듣고 교회로 세워졌기에 그의 사역을 증언할 수 있었지만, 바울이 직접 자신을 변호해야 했습니다. 그는 <mark>\"지극히 크다는 사도들보다 조금도 부족하지 아니하니라\"</mark>고 하면서도 <mark>\"내가 아무것도 아니나\"</mark>라고 고백합니다(11절). 은혜의 열매는 인정하되 그 일을 이루신 하나님께 영광을 돌리는 것입니다. <mark>\"사도의 표가 된 것은 내가 너희 가운데서 모든 참음과 표적과 기사와 능력을 행한 것이라\"</mark>(12절). 하나님의 놀라운 역사와 함께 <mark>모든 참음</mark>을 말합니다. 참된 사역에는 하나님의 능력과 함께 인내와 사랑이 나타납니다.", "특히 12절의 놀라운 역사와 7–9절의 남아 있는 가시는 한 사람의 삶에 함께 있었습니다. 하나님의 능력이 바울에게 모든 상황을 마음대로 바꾸는 힘으로 주어진 것은 아니었습니다. 13절의 \"용서하라\"는 생활비 부담을 지우지 않은 일을 두고 한 반어적 표현입니다. 사랑으로 행한 섬김마저 잘못으로 여기는 상황을 드러낸 것입니다. 모든 사역자가 보수를 받지 말아야 한다는 뜻이 아니라, <mark>고린도 성도들의 유익을 구한 바울의 사랑</mark>을 보아야 합니다."], "points": ["문제 해결 여부만으로 사역을 판단하면, 연약함 속에서도 신실하게 일하시는 주님을 놓칠 수 있습니다."]}, {"title": "적용 · 연약함 속에서 드러나는 주님의 은혜", "paragraphs": ["예수님도 겟세마네 동산에서 고난의 잔을 옮겨 달라고 기도하셨습니다. 그러나 <mark>아버지의 뜻에 자신을 맡기시고</mark> 십자가의 길을 걸어가셨습니다. 십자가에서 주님은 우리를 위해 대신 죽으셨고, 하나님은 그 죽음을 통해 우리를 구원하시고 예수님을 다시 살리셨습니다. 바울도 다음 장에서 <mark>\"그리스도께서 약하심으로 십자가에 못 박히셨으나 하나님의 능력으로 살아 계시니\"</mark>(13:4)라고 말합니다.", "그 주님이 연약한 바울을 붙드셨습니다. 바울은 가시가 남아 있는 동안에도 복음을 전하고 성도들을 사랑했습니다. 주님의 능력은 그를 <mark>사랑과 순종으로</mark> 이끌었습니다. 우리도 회복을 위해 기도하면서 오늘의 사랑을 감당할 수 있습니다. 도움이 필요하면 손을 내밀고, 할 수 있는 만큼 이웃을 돌보며, 어려움 속에서도 정직한 길을 선택할 수 있습니다.", "우리가 바라볼 방향은 분명합니다. <mark>나를 붙드시는 그리스도를 의지하며 받은 은혜로 다른 사람들을 섬기는 것</mark>입니다. 크게 보이기보다 그 자리에서 함께하시는 주님을 드러내는 것입니다. 연약함이 남아 있다는 사실만으로 주님이 함께하지 않으신다고 단정하지 마십시오. 그 자리가 주님을 더욱 의지하는 자리가 될 수 있습니다.", "지금 내게 남아 있는 연약함은 무엇입니까? 오늘 나는 그 연약함 속에서 어떤 순종과 사랑으로 나를 붙드시는 주님의 은혜를 드러낼 수 있겠습니까?"], "points": ["주님의 은혜가 내게 족합니다. 약할 그 때에 그리스도의 능력을 의지합니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "어려움이 오래 남아 있다는 이유로 주님이 함께하지 않으신다고 단정하지 않았다"}, {"key": "c2", "text": "특별한 체험이나 겉모습보다 삶과 가르침으로 사역을 분별하려 했다"}, {"key": "c3", "text": "내 연약함을 숨기지 않고 주님께 가져가 솔직하게 간구했다"}, {"key": "c4", "text": "다른 사람의 고통을 교만이나 믿음 부족의 벌로 쉽게 판단하지 않았다"}], "s4heading": "묵상 한 줄", "memoHint": "지금 내게 남아 있는 연약함은 무엇이며, 그 자리에서 \"내 은혜가 네게 족하도다\"라는 말씀을 어떻게 붙들겠습니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "솔직하게 간구하기", "value": "오래 남아 있는 연약함이나 문제 하나를 주님께 솔직하게 아뢰고 맡기기"}, {"key": "act2", "label": "은혜 붙들기", "value": "힘들 때마다 '내 은혜가 네게 족하도다'를 되뇌며 오늘 할 일 하나를 감당하기"}, {"key": "act3", "label": "도움 구하기", "value": "혼자 감당하기 어려운 일이 있다면 믿을 만한 사람에게 손을 내밀기"}, {"key": "act4", "label": "약한 중에 섬기기", "value": "내 형편이 넉넉하지 않아도 할 수 있는 만큼 한 사람을 돌보기"}, {"key": "act5", "label": "말씀 암송", "value": "고린도후서 12:9–10을 외우며 약할 때 그리스도의 능력을 의지하기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "약함이 남아 있는 자리에서도 '내 은혜가 네게 족하도다' 말씀하시고, 십자가의 약함과 부활의 능력으로 저를 붙드시는 주님께 감사합니다"}, {"key": "p2", "tag": "회개", "text": "어려움이 오래 남으면 주님이 떠나셨다고 단정하고, 특별한 체험과 겉모습으로 사람을 판단하며, 다른 이의 고통을 쉽게 정죄했던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "제 연약함을 주님께 솔직히 가져가게 하시고, 가시가 남아 있어도 그리스도의 능력이 제게 머물러, 오늘 순종과 사랑으로 주님의 은혜를 드러내게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "November 16, Monday", "ref": "2 Corinthians 12:1–13", "headline": "Even When Weakness Remains,<br>the Lord Is at Work", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · 2 Corinthians 12:1-13", "s1heading": "Today's Word", "verse": "\"But He said to me, 'My grace is sufficient for you,<br>for My power is made perfect in weakness.'<br>Therefore I will boast all the more gladly of my weaknesses.\"", "verseRef": "2 Corinthians 12:9", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · Is Grace Enough Even in Unresolved Weakness?", "paragraphs": ["We expect that if God's power is with us, our problems will be solved quickly. So when difficulties linger too long, we wonder whether our faith is lacking, or whether God isn't with us. Paul had extraordinary experiences and saw amazing works in his ministry. Even so, <mark>a thorn in the flesh that tormented him remained</mark>. Can the Lord's grace and power be fully present in a life where weakness remains unresolved?", "In the previous passage, Paul spoke of the sufferings he endured preaching the gospel and of escaping Damascus with others' help. He didn't hide his weakness; he boasted of it. Today he first mentions an extraordinary experience of being caught up into heaven, but the story soon moves to the thorn in the flesh and Christ's grace. What Paul wants to reveal is <mark>the Lord's power working through his weakness</mark>. Ministry can't be judged only by how extraordinary someone's experiences are; we must also look at what gospel they preach and how they serve people. Paul himself needed God's holding hand so he wouldn't become conceited. We too have weaknesses. But they aren't the decisive reason the Lord's work is blocked. Rather, in that very place we can rely on the Lord more and reveal His power that holds us. Let's look at three parts."], "points": ["Because of the weakness that remains in me, am I concluding that the Lord isn't with me?"]}, {"title": "Verses 1–6 · Wanting to Be Judged by Life and Teaching, Not Extraordinary Experiences", "paragraphs": ["In verse 1, Paul says, <mark>'I must go on boasting. Though there is nothing to be gained by it, I will go on to visions and revelations of the Lord.'</mark> He guards against boasting that uses experience to prove superiority. Some in the Corinthian church evaluated Paul by his weak impression and speech; Paul speaks of an extraordinary experience yet doesn't take the path of exalting himself. In verses 2–4, <mark>'a man in Christ'</mark> refers to Paul himself — verse 7 makes the connection clear when he says a thorn was given him because of these revelations. He describes himself as a third person, deliberately distancing himself from self-praise. The experience happened fourteen years before he wrote the letter. People then spoke of multiple heavens; 'the third heaven' and <mark>'paradise'</mark> are most naturally read as describing being caught up to God. Yet he repeats that he doesn't know whether it was in the body or out of the body — 'God knows.' He also deliberately doesn't disclose what he heard, which others would surely have wanted to hear. We needn't fill in with imagination what Paul doesn't explain.", "In verses 5–6, even of a true experience, Paul stops boasting <mark>'so that no one may think more of me than he sees in me or hears from me.'</mark> He asks them to examine the life they saw and the teaching they heard — what gospel he preached and how he treated people. <mark>A person's extraordinary experience cannot replace the community's discernment.</mark> We must examine together whether that teaching and life are worthy of Christ's gospel. Paul restrains even stories that would make him look great."], "points": ["Spiritual maturity shows not in making myself look great, but in helping people see Christ rightly."]}, {"title": "Verses 7–8 · The Thorn in the Flesh and Three Pleas", "paragraphs": ["In verse 6, Paul guarded against others exalting him too much; now in verse 7 he confesses God's hand preventing him from exalting himself: <mark>'So to keep me from becoming conceited because of the surpassing greatness of the revelations, a thorn was given me in the flesh, a messenger of Satan to harass me.'</mark> Some understand this thorn as an illness or ongoing persecution, but the text doesn't reveal what it was. What's clear is that Paul truly suffered and felt his limits. He calls it a messenger of Satan, yet confesses God's purpose of keeping him from conceit. <mark>Satan's harassment could not overturn God's good purpose.</mark> But we must not use this to judge others' suffering as punishment for pride. Paul is confessing the grace he discovered in his own experience.", "In verse 8, <mark>'Three times I pleaded with the Lord about this, that it should leave me.'</mark> Paul too earnestly wanted the pain gone. He didn't think faith becomes finer the more we suffer. He brought a problem he couldn't solve to the Lord. <mark>We too can pray, seeking healing and help.</mark>"], "points": ["Praying for pain to leave isn't a lack of faith; it's faith that entrusts an unsolvable problem to the Lord."]}, {"title": "Verses 9–10 · 'My Grace Is Sufficient for You'", "paragraphs": ["In verse 9, the Lord answers Paul: <mark>'My grace is sufficient for you, for My power is made perfect in weakness.'</mark> This doesn't mean the thorn didn't hurt much. It means the grace that held Paul in pain and enabled him to preach the gospel and serve people was enough. Grace is also the Lord's help for living today. 'Made perfect' doesn't mean His power was originally incomplete; it means His power works fully and is revealed through weak Paul. When the gospel spreads and churches are built through weak Paul, it becomes clear who is accomplishing the work. What matters here is that weakness and the Lord's power exist together. <mark>The Lord's power doesn't begin only after all weakness disappears.</mark> Paul didn't share what he heard in paradise — but he clearly shares this answer received amid the thorn. The text draws our attention not to heaven's secrets, but to the grace that holds us today.", "So Paul boasts of his weakness, <mark>'so that the power of Christ may rest upon me'</mark> — a phrase carrying the picture of a tent pitched over him. Christ is with weak Paul and holds him. In verse 10, he extends this confession to insults, hardships, persecutions, and calamities: <mark>'For the sake of Christ, then, I am content with weaknesses … For when I am weak, then I am strong.'</mark> The key direction is 'for the sake of Christ' — even in hardships suffered while serving Him, he rejoices because the Lord's power is with him. This isn't a word justifying our sin or irresponsibility. 'When I am weak, then I am strong' is a confession of living in reliance on Christ's power even in our lack. So there's no reason to create weakness deliberately or to compare the size of sufferings. The One who holds us is Christ."], "points": ["There's no word that the thorn left — but Paul's standard for viewing the thorn changed."]}, {"title": "Verses 11–13 · Evidence of Ministry the Church Experienced Firsthand", "paragraphs": ["In verse 11, the Corinthians had heard the gospel through Paul and been built into a church; they could have testified to the genuineness of his ministry, yet Paul had to defend himself. He says he is <mark>'not at all inferior to these super-apostles,'</mark> while confessing, <mark>'even though I am nothing.'</mark> He acknowledges the fruit of grace while giving glory to the God who accomplished it. In verse 12, Paul says <mark>'the signs of a true apostle were performed among you with utmost patience, with signs and wonders and mighty works.'</mark> These were amazing works God did, evidence that Paul served as a true apostle — and together with them he mentions <mark>utmost patience</mark>, not overlooking the endurance with which he preached and cared for the believers amid hardship. True ministry displays God's power together with endurance and love. We must look at life and teaching, endurance and God's work together; one remarkable phenomenon alone can't decide it.", "Notably, the amazing works of verse 12 and the remaining thorn of verses 7–9 existed together in one person's life. God's power wasn't given to Paul as a power to change every situation at will; Paul himself was one who needed grace every day. In verse 13, Paul asks how they were treated worse than other churches — except that he didn't burden them with his living costs. <mark>'Forgive me this wrong!'</mark> is irony, deliberately exposing a situation in which even service done in love was regarded as wrong. Paul received help from other churches and acknowledged the right of gospel preachers to be supported. So this doesn't mean all ministers should refuse pay; what we must see is <mark>Paul's love that sought the Corinthians' good</mark>."], "points": ["If we judge ministry only by whether problems are solved, we may miss the Lord working faithfully even in weakness."]}, {"title": "Application · The Lord's Grace Revealed in Weakness", "paragraphs": ["In the garden of Gethsemane, Jesus also prayed for the cup of suffering to pass. But He <mark>entrusted Himself to the Father's will</mark> and walked the path of the cross. On the cross the Lord died in our place, and through that death God saved us and raised Jesus again. In the next chapter Paul too speaks of this: <mark>'For He was crucified in weakness, but lives by the power of God'</mark> (13:4).", "That Lord held weak Paul. While the thorn remained, Paul still preached the gospel and loved the believers. The Lord's power led him into <mark>love and obedience</mark>. We too can pray for healing while carrying out today's love. When we need help, we can reach out; we can care for our neighbors as much as we're able; and we can choose the honest path even in difficulty.", "The direction we should look to is clear: <mark>relying on the Christ who holds us, and serving others with the grace we've received</mark> — not appearing great, but revealing the Lord who is with us right where we are. Don't conclude that the Lord isn't with you simply because weakness remains. That very place can become where you rely on Him more.", "What weakness remains in me now? Today, in that weakness, with what obedience and love can I reveal the grace of the Lord who holds me?"], "points": ["The Lord's grace is sufficient for me. When I am weak, I rely on the power of Christ."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I didn't conclude the Lord isn't with me just because difficulty has lingered long."}, {"key": "c2", "text": "I tried to discern ministry by life and teaching rather than extraordinary experiences or appearances."}, {"key": "c3", "text": "I didn't hide my weakness, but brought it to the Lord and pleaded honestly."}, {"key": "c4", "text": "I didn't quickly judge others' suffering as punishment for pride or lack of faith."}], "s4heading": "One-Line Reflection", "memoHint": "What weakness remains in me now, and how will I hold on to 'My grace is sufficient for you' in that place?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Plead Honestly", "value": "Tell the Lord honestly about one long-standing weakness or problem and entrust it to Him"}, {"key": "act2", "label": "Hold On to Grace", "value": "Whenever it's hard, repeat 'My grace is sufficient for you' and carry out one task for today"}, {"key": "act3", "label": "Ask for Help", "value": "If something is too hard to bear alone, reach out to a trustworthy person"}, {"key": "act4", "label": "Serve in Weakness", "value": "Even if your circumstances aren't comfortable, care for one person as much as you can"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize 2 Corinthians 12:9–10 and rely on Christ's power when you are weak"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, Lord, for saying 'My grace is sufficient for you' even where weakness remains, and for holding me by the weakness of the cross and the power of the resurrection."}, {"key": "p2", "tag": "Repent", "text": "I repent of concluding You had left when difficulties lingered, judging people by extraordinary experiences and appearances, and quickly condemning others' suffering."}, {"key": "p3", "tag": "Ask", "text": "Help me bring my weakness honestly to You; even if the thorn remains, let Christ's power rest upon me, so that today I reveal Your grace through obedience and love."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Nobyembre 16, Lunes", "ref": "2 Corinto 12:1–13", "headline": "Kahit Nananatili ang Kahinaan,<br>Kumikilos ang Panginoon", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · 2 Corinto 12:1-13", "s1heading": "Salita Ngayon", "verse": "\"Ngunit sinabi Niya sa akin, 'Sapat sa iyo ang Aking biyaya,<br>sapagkat ang Aking kapangyarihan ay nagiging ganap sa kahinaan.'<br>Kaya lalo kong ikinagagalak na ipagmalaki ang aking mga kahinaan.\"", "verseRef": "2 Corinto 12:9", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Sapat ba ang Biyaya Kahit sa Kahinaang Hindi Nalulutas?", "paragraphs": ["Inaasahan natin na kung kasama natin ang kapangyarihan ng Diyos, mabilis na malulutas ang ating mga problema. Kaya kapag nagtatagal ang mga paghihirap, iniisip natin kung kulang ang ating pananampalataya, o kung hindi kasama ang Diyos. May pambihirang karanasan si Pablo at nakakita ng kamangha-manghang mga gawa sa kanyang ministeryo. Gayunman, <mark>nanatili ang tinik sa laman na nagpapahirap sa kanya</mark>. Maaari bang lubos na makasama ang biyaya at kapangyarihan ng Panginoon sa buhay na may kahinaang hindi nalulutas?", "Sa naunang talata, nagsalita si Pablo tungkol sa mga pagdurusang tiniis niya sa pangangaral ng ebanghelyo at sa pagtakas sa Damasco sa tulong ng iba. Hindi niya itinago ang kanyang kahinaan; ipinagmalaki pa niya ito. Ngayon, una niyang binanggit ang pambihirang karanasan ng pagkadala sa langit, ngunit agad na lumipat ang kuwento sa tinik sa laman at sa biyaya ni Cristo. Ang nais ihayag ni Pablo ay <mark>ang kapangyarihan ng Panginoon na kumikilos sa pamamagitan ng kanyang kahinaan</mark>. Hindi mahuhusgahan ang ministeryo batay lamang sa kung gaano kapambihira ang karanasan ng isang tao; dapat din nating tingnan kung anong ebanghelyo ang kanyang ipinangangaral at kung paano siya naglilingkod sa mga tao. Si Pablo mismo ay nangailangan ng paghawak ng Diyos upang hindi siya magmataas. Tayo rin ay may mga kahinaan. Ngunit hindi ang mga ito ang mapagpasyang dahilan upang mahadlangan ang gawa ng Panginoon. Sa halip, sa mismong lugar na iyon ay lalo tayong makaaasa sa Panginoon at maihahayag ang Kanyang kapangyarihang humahawak sa atin. Tingnan natin ang tatlong bahagi."], "points": ["Dahil sa kahinaang nananatili sa akin, nagpapasya na ba ako na hindi ako kasama ng Panginoon?"]}, {"title": "Talata 1–6 · Nais na Hatulan sa Buhay at Turo, Hindi sa Pambihirang Karanasan", "paragraphs": ["Sa talata 1, sinabi ni Pablo, <mark>'Kailangan kong magpatuloy sa pagmamalaki. Bagama't walang mapapakinabangan dito, magpapatuloy ako sa mga pangitain at pahayag ng Panginoon.'</mark> Nag-iingat siya laban sa pagmamalaking gumagamit ng karanasan upang patunayan ang kahigitan. Sinuri ng ilan sa iglesya sa Corinto si Pablo batay sa kanyang mahinang impresyon at pananalita; nagsalita si Pablo tungkol sa pambihirang karanasan ngunit hindi tumahak sa landas ng pagtataas sa sarili. Sa talata 2–4, ang <mark>'isang tao kay Cristo'</mark> ay tumutukoy kay Pablo mismo — nililinaw ito ng talata 7 nang sabihin niyang binigyan siya ng tinik dahil sa mga pahayag na ito. Inilalarawan niya ang sarili bilang ikatlong tao, sadyang inilalayo ang sarili sa pagpupuri sa sarili. Nangyari ang karanasan labing-apat na taon bago niya isinulat ang liham. Nagsasalita ang mga tao noon tungkol sa maraming langit; ang 'ikatlong langit' at <mark>'paraiso'</mark> ay pinakanatural na basahin bilang paglalarawan sa pagkadala sa Diyos. Gayunman, inuulit niyang hindi niya alam kung nasa katawan ito o nasa labas ng katawan — 'alam ng Diyos.' Sinadya rin niyang huwag ihayag ang kanyang narinig, na tiyak na gustong marinig ng iba. Hindi natin kailangang punan ng imahinasyon ang hindi ipinaliwanag ni Pablo.", "Sa talata 5–6, kahit sa tunay na karanasan, huminto si Pablo sa pagmamalaki <mark>'upang walang sinumang mag-isip tungkol sa akin nang higit sa nakikita niya sa akin o naririnig mula sa akin.'</mark> Hinihiling niyang suriin nila ang buhay na nakita nila at ang turong narinig nila — kung anong ebanghelyo ang ipinangaral niya at kung paano niya tinrato ang mga tao. <mark>Hindi mapapalitan ng pambihirang karanasan ng isang tao ang pagkilala ng komunidad.</mark> Dapat nating sama-samang suriin kung karapat-dapat sa ebanghelyo ni Cristo ang turo at buhay na iyon. Pinipigilan ni Pablo kahit ang mga kuwentong magpapalaki sa kanya."], "points": ["Nahahayag ang espirituwal na pagkahinog hindi sa pagpapalaki sa aking sarili, kundi sa pagtulong sa mga tao na makita nang wasto si Cristo."]}, {"title": "Talata 7–8 · Ang Tinik sa Laman at Tatlong Pagsamo", "paragraphs": ["Sa talata 6, nag-ingat si Pablo laban sa labis na pagtataas sa kanya ng iba; ngayon sa talata 7, ipinahayag niya ang kamay ng Diyos na pumipigil sa kanyang pagtataas sa sarili: <mark>'Kaya upang hindi ako magmataas dahil sa napakadakilang mga pahayag, binigyan ako ng tinik sa laman, isang sugo ni Satanas upang pahirapan ako.'</mark> May mga nakauunawa sa tinik na ito bilang sakit o patuloy na pag-uusig, ngunit hindi inihahayag ng talata kung ano ito. Ang malinaw ay tunay na nagdusa si Pablo at nadama ang kanyang mga hangganan. Tinatawag niya itong sugo ni Satanas, ngunit ipinahayag niya ang layunin ng Diyos na ilayo siya sa pagmamataas. <mark>Hindi kayang ibagsak ng panggigipit ni Satanas ang mabuting layunin ng Diyos.</mark> Ngunit hindi natin ito dapat gamitin upang hatulan ang pagdurusa ng iba bilang parusa sa kapalaluan. Ipinapahayag ni Pablo ang biyayang natuklasan niya sa sarili niyang karanasan.", "Sa talata 8, <mark>'Tatlong beses akong nakiusap sa Panginoon tungkol dito, na alisin ito sa akin.'</mark> Si Pablo rin ay taimtim na nagnais na mawala ang sakit. Hindi niya inisip na nagiging mas mabuti ang pananampalataya habang lalong nagdurusa. Dinala niya sa Panginoon ang problemang hindi niya kayang lutasin. <mark>Maaari rin tayong manalangin, humihingi ng kagalingan at tulong.</mark>"], "points": ["Ang panalanging humihiling na mawala ang sakit ay hindi kakulangan ng pananampalataya; ito ay pananampalatayang ipinagkakatiwala sa Panginoon ang problemang hindi malutas."]}, {"title": "Talata 9–10 · 'Sapat sa Iyo ang Aking Biyaya'", "paragraphs": ["Sa talata 9, sinagot ng Panginoon si Pablo: <mark>'Sapat sa iyo ang Aking biyaya, sapagkat ang Aking kapangyarihan ay nagiging ganap sa kahinaan.'</mark> Hindi ito nangangahulugang hindi gaanong masakit ang tinik. Ibig sabihin, sapat ang biyayang humawak kay Pablo sa sakit at nagpangyaring maipangaral niya ang ebanghelyo at mapaglingkuran ang mga tao. Ang biyaya rin ay tulong ng Panginoon upang mamuhay ngayon. Ang 'nagiging ganap' ay hindi nangangahulugang hindi ganap ang Kanyang kapangyarihan noong una; ibig sabihin, lubos na kumikilos at nahahayag ang Kanyang kapangyarihan sa pamamagitan ng mahinang si Pablo. Kapag lumalaganap ang ebanghelyo at naitatayo ang mga iglesya sa pamamagitan ng mahinang si Pablo, lumilinaw kung sino ang nagsasakatuparan ng gawain. Ang mahalaga rito ay magkasama ang kahinaan at ang kapangyarihan ng Panginoon. <mark>Hindi nagsisimula ang kapangyarihan ng Panginoon pagkatapos lamang mawala ang lahat ng kahinaan.</mark> Hindi ibinahagi ni Pablo ang narinig niya sa paraiso — ngunit malinaw niyang ibinabahagi ang sagot na ito na natanggap sa gitna ng tinik. Itinutuon ng talata ang ating pansin hindi sa mga lihim ng langit, kundi sa biyayang humahawak sa atin ngayon.", "Kaya ipinagmamalaki ni Pablo ang kanyang kahinaan, <mark>'upang ang kapangyarihan ni Cristo ay manahan sa akin'</mark> — pariralang may dalang larawan ng toldang itinayo sa ibabaw niya. Kasama ni Cristo ang mahinang si Pablo at hinahawakan siya. Sa talata 10, pinalawak niya ang pagpapahayag na ito sa mga insulto, kahirapan, pag-uusig, at kapighatian: <mark>'Kaya alang-alang kay Cristo, kontento ako sa mga kahinaan … Sapagkat kapag ako'y mahina, saka ako malakas.'</mark> Ang mahalagang direksyon ay 'alang-alang kay Cristo' — kahit sa mga paghihirap na tiniis habang naglilingkod sa Kanya, nagagalak siya dahil kasama niya ang kapangyarihan ng Panginoon. Hindi ito salitang nagbibigay-katwiran sa ating kasalanan o pagpapabaya. Ang 'kapag ako'y mahina, saka ako malakas' ay pagpapahayag ng pamumuhay nang umaasa sa kapangyarihan ni Cristo kahit sa ating kakulangan. Kaya walang dahilan upang sadyang lumikha ng kahinaan o ihambing ang laki ng pagdurusa. Ang Isang humahawak sa atin ay si Cristo."], "points": ["Walang salitang nawala ang tinik — ngunit nagbago ang pamantayan ni Pablo sa pagtingin sa tinik."]}, {"title": "Talata 11–13 · Patunay ng Ministeryo na Personal na Naranasan ng Iglesya", "paragraphs": ["Sa talata 11, narinig ng mga taga-Corinto ang ebanghelyo sa pamamagitan ni Pablo at naitayo bilang iglesya; maaari sana nilang patotohanan ang katapatan ng kanyang ministeryo, ngunit kinailangan pa ni Pablo na ipagtanggol ang sarili. Sinabi niyang siya'y <mark>'hindi kailanman mababa sa mga napakadakilang apostol na ito,'</mark> habang ipinapahayag, <mark>'bagama't ako'y walang halaga.'</mark> Kinikilala niya ang bunga ng biyaya habang nagbibigay ng kaluwalhatian sa Diyos na nagsakatuparan nito. Sa talata 12, sinabi ni Pablo na <mark>'ang mga tanda ng tunay na apostol ay ginawa sa gitna ninyo nang may lubos na pagtitiis, sa mga tanda at kababalaghan at makapangyarihang gawa.'</mark> Ito'y mga kamangha-manghang gawang ginawa ng Diyos, patunay na naglingkod si Pablo bilang tunay na apostol — at kasama ng mga ito ay binanggit niya ang <mark>lubos na pagtitiis</mark>, hindi kinakaligtaan ang tiyagang ipinakita niya sa pangangaral at pag-aalaga sa mga mananampalataya sa gitna ng hirap. Ipinapakita ng tunay na ministeryo ang kapangyarihan ng Diyos kasama ng pagtitiis at pag-ibig. Dapat nating tingnan nang magkasama ang buhay at turo, pagtitiis at gawa ng Diyos; hindi ito mapagpapasyahan ng isang kamangha-manghang pangyayari lamang.", "Kapansin-pansin, ang kamangha-manghang mga gawa sa talata 12 at ang natitirang tinik sa talata 7–9 ay magkasamang umiral sa buhay ng iisang tao. Hindi ibinigay kay Pablo ang kapangyarihan ng Diyos bilang kapangyarihang baguhin ang bawat sitwasyon ayon sa gusto niya; si Pablo mismo ay nangangailangan ng biyaya araw-araw. Sa talata 13, tinanong ni Pablo kung paano sila tinrato nang mas masama kaysa sa ibang iglesya — maliban na hindi niya sila pinabigatan sa kanyang gastusin sa pamumuhay. Ang <mark>'Patawarin ninyo ako sa pagkakamaling ito!'</mark> ay balintuna, sadyang inilalantad ang sitwasyong kahit ang paglilingkod na ginawa nang may pag-ibig ay itinuring na mali. Tumanggap si Pablo ng tulong mula sa ibang iglesya at kinilala ang karapatan ng mga nangangaral ng ebanghelyo na suportahan. Kaya hindi ito nangangahulugang dapat tumanggi sa bayad ang lahat ng ministro; ang dapat nating makita ay <mark>ang pag-ibig ni Pablo na naghangad ng kabutihan ng mga taga-Corinto</mark>."], "points": ["Kung huhusgahan natin ang ministeryo batay lamang sa kung nalutas ang mga problema, maaari nating makaligtaan ang Panginoong tapat na kumikilos kahit sa kahinaan."]}, {"title": "Aplikasyon · Ang Biyaya ng Panginoon na Nahahayag sa Kahinaan", "paragraphs": ["Sa hardin ng Getsemani, nanalangin din si Jesus na lumampas ang saro ng pagdurusa. Ngunit <mark>ipinagkatiwala Niya ang Kanyang sarili sa kalooban ng Ama</mark> at nilakad ang landas ng krus. Sa krus, namatay ang Panginoon sa ating lugar, at sa kamatayang iyon ay iniligtas tayo ng Diyos at muling binuhay si Jesus. Sa susunod na kabanata, nagsalita rin si Pablo tungkol dito: <mark>'Sapagkat Siya'y ipinako sa kahinaan, ngunit nabubuhay sa kapangyarihan ng Diyos'</mark> (13:4).", "Ang Panginoong iyon ang humawak sa mahinang si Pablo. Habang nananatili ang tinik, patuloy pa ring nangaral si Pablo ng ebanghelyo at umibig sa mga mananampalataya. Inakay siya ng kapangyarihan ng Panginoon sa <mark>pag-ibig at pagsunod</mark>. Maaari rin tayong manalangin para sa kagalingan habang ginagampanan ang pag-ibig ngayon. Kapag kailangan natin ng tulong, maaari tayong mag-abot ng kamay; maaari nating alagaan ang ating kapwa hangga't kaya natin; at maaari nating piliin ang tapat na landas kahit sa hirap.", "Malinaw ang direksyong dapat nating tingnan: <mark>pag-asa kay Cristo na humahawak sa atin, at paglilingkod sa iba gamit ang biyayang natanggap natin</mark> — hindi pagmumukhang dakila, kundi paghahayag sa Panginoong kasama natin kung nasaan tayo. Huwag ipasyang hindi kasama ang Panginoon dahil lamang nananatili ang kahinaan. Ang mismong lugar na iyon ay maaaring maging lugar kung saan lalo kang umaasa sa Kanya.", "Anong kahinaan ang nananatili sa akin ngayon? Ngayon, sa kahinaang iyon, sa anong pagsunod at pag-ibig ko maihahayag ang biyaya ng Panginoong humahawak sa akin?"], "points": ["Sapat sa akin ang biyaya ng Panginoon. Kapag ako'y mahina, umaasa ako sa kapangyarihan ni Cristo."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Hindi ko ipinasyang hindi ako kasama ng Panginoon dahil lamang matagal nang nananatili ang paghihirap."}, {"key": "c2", "text": "Sinikap kong kilalanin ang ministeryo batay sa buhay at turo sa halip na sa pambihirang karanasan o panlabas na anyo."}, {"key": "c3", "text": "Hindi ko itinago ang aking kahinaan, kundi dinala ko ito sa Panginoon at tapat na nakiusap."}, {"key": "c4", "text": "Hindi ko madaling hinatulan ang pagdurusa ng iba bilang parusa sa kapalaluan o kakulangan ng pananampalataya."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Anong kahinaan ang nananatili sa akin ngayon, at paano ko hahawakan ang 'Sapat sa iyo ang Aking biyaya' sa lugar na iyon?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Tapat na Makiusap", "value": "Sabihin nang tapat sa Panginoon ang isang matagal nang kahinaan o problema at ipagkatiwala ito sa Kanya"}, {"key": "act2", "label": "Hawakan ang Biyaya", "value": "Tuwing mahirap, ulitin ang 'Sapat sa iyo ang Aking biyaya' at gampanan ang isang gawain para ngayon"}, {"key": "act3", "label": "Humingi ng Tulong", "value": "Kung may bagay na napakahirap pasanin nang mag-isa, iabot ang kamay sa mapagkakatiwalaang tao"}, {"key": "act4", "label": "Maglingkod sa Kahinaan", "value": "Kahit hindi maginhawa ang iyong kalagayan, alagaan ang isang tao hangga't kaya mo"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang 2 Corinto 12:9–10 at umasa sa kapangyarihan ni Cristo kapag ikaw ay mahina"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Panginoon, sa pagsasabing 'Sapat sa iyo ang Aking biyaya' kahit kung saan nananatili ang kahinaan, at sa paghawak sa akin sa kahinaan ng krus at kapangyarihan ng muling pagkabuhay."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa pagpapasyang iniwan Mo ako nang magtagal ang mga paghihirap, sa paghatol sa mga tao batay sa pambihirang karanasan at panlabas na anyo, at sa madaling paghatol sa pagdurusa ng iba."}, {"key": "p3", "tag": "Kahilingan", "text": "Tulungan Mo akong dalhin nang tapat sa Iyo ang aking kahinaan; kahit manatili ang tinik, hayaang manahan sa akin ang kapangyarihan ni Cristo, upang ngayon ay maihayag ko ang Iyong biyaya sa pagsunod at pag-ibig."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-11-16';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
