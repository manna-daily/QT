<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;

  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;

  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}

  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "11월 2일 월요일", "ref": "고린도후서 1장 12–22절", "headline": "계획이 바뀌면<br>마음도 달라진 걸까요?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 고린도후서 1:12-22", "s1heading": "오늘의 말씀", "verse": "\"하나님의 약속은 얼마든지 그리스도 안에서 예가 되니<br>그런즉 그로 말미암아 우리가 아멘 하여<br>하나님께 영광을 돌리게 되느니라\"", "verseRef": "고린도후서 1:20", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 계획은 달라져도 하나님은 신실하십니다", "paragraphs": ["우리는 누군가의 계획이 바뀌면 그 사람의 마음까지 달라졌다고 생각할 때가 있습니다. 오겠다고 했는데 오지 않으면 나를 중요하게 여기지 않는다고 느낍니다. 마음은 그대로여도 기다리는 사람에게는 서운한 일이 될 수 있기에 사정을 설명하고 양해를 구하는 일이 필요합니다. 오늘 말씀의 중심은 이것입니다. <mark>우리의 계획은 달라질 수 있지만 우리를 붙드시는 하나님은 신실하시며, 그 은혜를 받은 우리는 서로 신뢰할 수 있는 말과 행동으로 응답해야 합니다</mark>.", "고린도 교회에는 바울의 방문 계획이 바뀐 일을 두고 그가 말을 가볍게 하거나 자기 편의대로 행동한다는 의심이 남아 있었습니다. 지금처럼 곧바로 사정을 전하기도 어려웠습니다. 바울은 이 문제를 피하지 않고 자신의 행동을 설명하며, 성도들과 함께 믿는 <mark>신실하신 하나님</mark>을 바라보게 합니다."], "points": ["나는 관계 속에서 내 입장을 지키는 데만 마음을 쏟고 있습니까, 주님 앞에서 진실하게 말하며 서로를 세우려 합니까?"]}, {"title": "12–14절 · 숨은 의도 없이 진실하게 행했습니다", "paragraphs": ["바울은 자신이 성도들을 대할 때 <mark>\"육체의 지혜로 하지 아니하고 오직 하나님의 은혜로\"</mark>(12절) 행했다고 말합니다. 육체의 지혜는 자기 이익을 위해 사람을 움직이고 유리한 쪽으로 말을 바꾸는 계산입니다. 바울은 그 근거를 자신의 성품이 아니라 하나님의 은혜에 둡니다. 은혜는 죄를 용서할 뿐 아니라 <mark>사람을 진실하게 대하도록 우리를 변화시킵니다</mark>. 다만 바울은 \"양심이 깨끗하다\"는 말로 질문을 막지 않습니다. 판단하시는 분은 주님이라고 고백하며(고전 4:4), 성도들이 보아 온 자신의 삶도 돌아보게 합니다.", "바울은 <mark>\"너희가 읽고 아는 것 외에 우리가 다른 것을 쓰지 아니하노니\"</mark>(13절)라며, 겉으로 쓴 말과 속뜻이 다르지 않다고 말합니다. 부탁하면서 거절할 수 없게 부담을 주거나, 중요한 사실을 감추고 유리한 부분만 말하고 있지는 않습니까? 바울의 목표는 억울함을 푸는 데 있지 않고, <mark>주 예수의 날에 서로가 서로의 자랑이 되는 것</mark>입니다(14절)."], "points": ["'어떻게 하면 내가 옳다고 인정받을까'를 넘어, '주님 앞에서도 이 말과 행동이 진실하다고 말씀드릴 수 있는가'를 묻습니다."]}, {"title": "15–17절 · 계획은 바뀌었지만 변덕은 아니었습니다", "paragraphs": ["바울은 고린도를 두 번 방문해 성도들이 <mark>\"두 번 은혜를 얻게\"</mark>(15절) 하려 했습니다. 만남과 말씀으로 유익을 얻고, 바울을 유대로 보내는 사역에도 함께 참여하기를 바랐습니다. 바울은 일방적으로 주기만 하는 사람이 아니라 함께 은혜를 누리고 함께 복음을 섬기려 했습니다. 계획을 세울 때 우리도 내가 원하는 일만이 아니라 <mark>함께하는 사람의 유익</mark>도 생각해야 합니다.", "<mark>\"어찌 경솔히 하였으리요 … 예 예 하면서 아니라 아니라 하는 일이 내게 있겠느냐\"</mark>(17절). 바울은 일정이 바뀐 사실은 부인하지 않지만, 그것이 변덕이나 거짓에서 나왔다는 판단은 부정합니다. 지킬 마음 없이 약속하는 것과 진실하게 계획했지만 이유가 생겨 바꾸는 것은 다릅니다. 바울은 성도들을 아껴 다시 근심하게 하지 않으려고 방문을 미루었습니다(23절). 약속을 가볍게 하지 않고, 바뀌면 미리 알리고, 잘못은 사과하며, 상대의 계획이 바뀌었을 때는 <mark>마음부터 단정하기보다 이유를 들어야</mark> 합니다."], "points": ["신실함은 계획을 고수할 때뿐 아니라, 바꿀 때에도 상대의 유익을 살피고 책임 있게 설명하는 데서 드러납니다."]}, {"title": "18–20절 · 그리스도 안에서 하나님의 약속은 \"예\"가 됩니다", "paragraphs": ["<mark>\"하나님은 미쁘시니라\"</mark>(18절). 바울은 여행 일정 이야기에서 갑자기 예수님 이야기로 넘어갑니다. 바울을 믿을 수 없다고 여기면 그가 전한 복음까지 의심할 수 있기 때문입니다. 바울과 실루아노와 디모데가 전한 예수 그리스도는 <mark>\"예 하고 아니라 함이 되지 아니하였으니 그에게는 예만 되었느니라\"</mark>(19절). 구원을 약속하셨다가 변덕스럽게 거두시는 분이 아닙니다. 다만 오늘의 지도자가 이 말씀을 자기 판단이 모두 옳다는 근거로 삼아서는 안 됩니다. 바울은 권위로 질문을 막지 않고 설명했습니다.", "<mark>\"하나님의 약속은 얼마든지 그리스도 안에서 예가 되니 … 우리가 아멘 하여 하나님께 영광을 돌리게 되느니라\"</mark>(20절). 예수님의 오심과 십자가와 부활은 하나님이 약속을 지키셨다는 결정적인 증거입니다. 내가 원하는 모든 일이 이루어진다는 뜻이 아닙니다. 그리스도 안에서 이루신 약속을 참되다 믿고 나를 맡기는 것이 <mark>\"아멘\"</mark>입니다. 구원의 확신도 내 감정의 온도보다 예수님이 나를 위해 이루신 일에서 나옵니다."], "points": ["우리가 붙드는 것은 내 계획이 아니라, 그리스도 안에서 이미 '예'가 된 하나님의 약속입니다."]}, {"title": "21–22절 · 하나님께서 우리를 함께 세우시고 성령으로 보증하십니다", "paragraphs": ["<mark>\"우리를 너희와 함께 그리스도 안에서 굳건하게 하시고 우리에게 기름을 부으신 이는 하나님이시니\"</mark>(21절). 앞에서 '복음을 전한 우리'와 '들은 너희'가 구분되었다면, 이제 바울은 하나님께서 우리를 너희와 함께 세우신다고 말합니다. 직분은 달라도 하나님께서 붙드셔야 한다는 사실은 같습니다. 갈등 속에서도 기억하십시오. <mark>우리는 서로를 이기기 위해 부름받은 사람들이 아니라, 함께 그리스도 안에 굳게 서도록 부름받은 사람들입니다</mark>.", "하나님은 우리에게 <mark>\"인치시고 보증으로 우리 마음에 성령을 주셨\"</mark>습니다(22절). 인치심은 도장을 찍듯 우리를 자기 백성으로 삼으셨다는 뜻이고, 보증은 시작하신 구원을 반드시 완성하시겠다는 확실한 선물입니다. 여전히 연약하고 어려움이 남아 있어도 하나님의 약속이 실패한 것은 아닙니다. 성부께서 세우시고, 성자 안에서 약속을 이루시며, <mark>성령을 보증으로 주셨습니다</mark>."], "points": ["현재의 어려움이 하나님의 약속을 취소하지 못합니다."]}, {"title": "적용 · 옳다 옳다, 아니라 아니라", "paragraphs": ["우리의 계획은 달라질 수 있습니다. 그러나 그리스도 안에서 베푸신 하나님의 은혜는 우리가 서로를 진실하게 대하도록 이끕니다. 예수님은 <mark>\"오직 너희 말은 옳다 옳다, 아니라 아니라 하라\"</mark>(마 5:37)고 말씀하셨습니다. 신앙적인 말을 덧붙여야 믿을 수 있는 사람이 아니라, <mark>평소의 말과 행동에서 진실함이 드러나는 사람</mark>이 되어야 합니다.", "예수님은 아버지의 뜻에 순종하여 십자가를 지셨고, 하나님은 그분을 죽은 자 가운데서 살리셨습니다. 우리의 믿음은 그리스도 안에서 실제로 이루어진 이 구원에 근거합니다. 주님이 다시 오실 때를 알지 못하지만 그 약속을 믿고 기다리며, 기다리는 동안 <mark>오늘 맡겨진 관계에서 신실하게</mark> 살아갑니다. 하나님께서 우리를 함께 굳건하게 세우셨으니, 갈등 앞에서도 상대를 이기려 하기보다 함께 서는 길을 찾을 수 있습니다. 성령을 보증으로 주신 하나님이 우리 안에서 그 일을 이루어 가십니다.", "오늘 미뤄 둔 설명이 있다면 먼저 연락해 보십시오. 지키지 못한 약속이 있다면 사정을 설명하고 <mark>책임질 부분은 책임지십시오</mark>. 반대로 누군가의 계획이 바뀌었을 때 그 마음을 단정했다면, 먼저 그의 사정을 들어 보십시오.", "나는 오늘 관계 속에서 내 체면을 지키려 합니까, 아니면 신실하신 주님을 믿는 사람답게 진실하게 말하고 상대방을 세우려 합니까?"], "points": ["신실하신 주님을 믿는 사람답게, 오늘 내 말을 믿을 만한 말로 지킵니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "부탁하거나 설명할 때 중요한 사실을 감추고 유리한 부분만 말하지 않았는지 돌아봤다"}, {"key": "c2", "text": "약속을 가볍게 하지 않고, 바뀔 때는 미리 알리고 책임 있게 설명했는지 점검했다"}, {"key": "c3", "text": "누군가의 계획이 바뀌었을 때 마음부터 단정하지 않고 이유를 들어 보려 했다"}, {"key": "c4", "text": "내 감정보다 그리스도 안에서 '예'가 된 하나님의 약속에 '아멘'으로 응답했다"}], "s4heading": "묵상 한 줄", "memoHint": "오늘 미뤄 둔 설명이나 지키지 못한 약속, 혹은 내가 마음을 단정한 사람은 누구이며, 어떻게 응답하겠습니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "먼저 연락하기", "value": "미뤄 둔 설명이 있는 사람에게 먼저 연락해 사정을 진실하게 전하기"}, {"key": "act2", "label": "책임지기", "value": "지키지 못한 약속 하나를 사과하고, 책임질 부분을 구체적으로 정해 실천하기"}, {"key": "act3", "label": "이유 들어 보기", "value": "계획을 바꾼 사람의 마음을 단정했다면, 판단을 멈추고 그의 사정을 물어보기"}, {"key": "act4", "label": "말 지키기", "value": "오늘 하는 작은 약속 하나라도 '예'는 '예'로 끝까지 지키기"}, {"key": "act5", "label": "말씀 암송", "value": "고린도후서 1:20을 외우며 그리스도 안에서 이루어진 약속에 '아멘'으로 응답하기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "모든 약속을 그리스도 안에서 '예'가 되게 하시고, 우리를 함께 굳건하게 세우시며, 성령을 보증으로 주신 미쁘신 하나님께 감사합니다"}, {"key": "p2", "tag": "회개", "text": "유리한 쪽으로 말을 바꾸고, 약속을 가볍게 여기며, 다른 사람의 바뀐 계획을 두고 마음부터 단정했던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "제 말이 '옳다 옳다, 아니라 아니라'가 되게 하시고, 관계 속에서 체면보다 진실함을 택하며, 서로를 이기기보다 함께 세우게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "November 2, Monday", "ref": "2 Corinthians 1:12–22", "headline": "When Plans Change,<br>Has the Heart Changed Too?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · 2 Corinthians 1:12-22", "s1heading": "Today's Word", "verse": "\"For all the promises of God find their Yes in Him.<br>That is why it is through Him that we utter our Amen<br>to God for His glory.\"", "verseRef": "2 Corinthians 1:20", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · Our Plans May Change, but God Is Faithful", "paragraphs": ["When someone's plans change, we sometimes assume their heart has changed too. When someone says they'll come and then doesn't, we may feel they don't consider us important. Even when our heart hasn't changed, a postponed promise can disappoint the one waiting — so we need to explain our situation and ask for understanding. Today's passage shows a similar problem. Here is its center: <mark>our plans may change, but the God who holds us is faithful — and having received that grace, we must respond with words and actions others can trust.</mark>", "In the previous passage, Paul praised the God who rescued and comforted him in crisis, and asked the believers to join him in prayer. But to pray and give thanks together, trust between them is essential. In the Corinthian church, suspicion toward Paul still lingered. Over his changed visit plans, some seem to have thought he spoke lightly or acted for his own convenience. Back then, it wasn't possible to explain the situation instantly by phone or text. Paul doesn't avoid the issue. He explains his actions and points them to <mark>the faithful God</mark> they believe in together. We don't know every circumstance, and we can't control our own situations completely either. So when plans change and misunderstandings arise, by what standard should we speak and judge? Before today's Word, let's first look at ourselves: Am I pouring my heart only into defending my position, or am I trying to speak truthfully before the Lord and build each other up?"], "points": ["Am I focused only on defending my position, or on speaking truthfully before the Lord and building others up?"]}, {"title": "Verses 12–14 · Acting Sincerely, Without Hidden Motives", "paragraphs": ["In verse 12, Paul says his conscience testifies that in the world, and especially toward the Corinthians, he behaved <mark>'not by earthly wisdom but by the grace of God.'</mark> 'Earthly wisdom' here doesn't mean the ability to think or plan itself. It means the calculating mindset that moves people for one's own advantage and shifts words toward whatever side is favorable. Paul firmly says he didn't act that way; he treated the believers with holiness and sincerity before God. And he grounds this not in his fine character but in God's grace. Grace not only forgives sin; it <mark>transforms us to treat people truthfully</mark>. If we say we've received grace yet deceive and use people, we must seriously examine our lives. Of course, we shouldn't use 'my conscience is clear' to shut down every question. Paul himself confessed that a clear conscience doesn't make him righteous — it is the Lord who judges (1 Corinthians 4:4). Paul doesn't ask them merely to understand his heart; he invites them to consider the life they've seen him live.", "In verse 13, Paul says, <mark>'We are not writing to you anything other than what you read and understand.'</mark> His written words and inner intentions are not different. When suspicion enters a relationship, we keep looking for another meaning behind the other person's words. Even when they say something kind, we first wonder what they're trying to get. Paul explains that his letters are not double-speak; he had no hidden scheme to mock them. We too must reflect: When we ask someone for something, do we pressure them so they can't refuse? Do we hide important facts and say only the parts that favor us? Sincerity makes us examine not only what we said but the intentions we're hiding. In verse 14, Paul's goal doesn't end with clearing his name. He hopes that <mark>on the day of the Lord Jesus, they will be his boast and he theirs</mark> — not boasting of having a famous leader or many followers, but rejoicing together in what God has done in each other's lives. Paul looks beyond how he appears to people now, toward the truth that will be revealed before the Lord. Yet he doesn't avoid explaining himself now; because he will stand before the Lord on the last day, he explains truthfully today. Our question must deepen too: beyond 'How can I get others to admit I'm right?' we must ask, 'Can I tell the Lord that these words and actions are truthful?' Restoring a relationship goes beyond having my rightness acknowledged; it means recognizing again God's grace at work through one another."], "points": ["Beyond 'How can I prove I'm right?' I ask, 'Could I tell the Lord these words and actions are truthful?'"]}, {"title": "Verses 15–17 · The Plan Changed, but It Wasn't Fickleness", "paragraphs": ["In verses 15–16, Paul says he planned his visit with confidence in his relationship with the believers. In 1 Corinthians he had said he would pass through Macedonia and then come to Corinth to stay. But here he explains that he had intended to visit Corinth first, go on to Macedonia, return to Corinth, and then head to Judea. He planned to visit twice — so that they might <mark>'have a second experience of grace.'</mark> He hoped they would benefit from meeting him and hearing the Word, and also share in the ministry of sending him on to Judea. 'Sending on' here includes practical help needed for the journey. Paul wasn't someone who only gave to the believers one-sidedly; he wanted to enjoy grace together and serve the gospel together. When we make plans, we too must ask: Am I only interested in accomplishing what I want? Or am I also considering <mark>the good of those who share in the plan</mark>?", "In verse 17 Paul asks, <mark>'Was I vacillating when I wanted to do this? Do I make my plans according to the flesh, ready to say \"Yes, yes\" and \"No, no\" at the same time?'</mark> The answer is no. Paul doesn't deny that the schedule changed; he denies the judgment that the change came from fickleness or a false heart. Making a promise with no intention of keeping it is different from planning sincerely and then changing because a reason arose. In the following verses (1:23), Paul explains that he postponed his visit to spare them and not cause them sorrow again. The plan changed, but his purpose of building them up continued. Still, good intentions alone aren't enough — Paul explains his decision and talks to restore trust. Our faith shows itself in such everyday matters: not making promises lightly, letting people know in advance when a change is needed, and considering the difficulty it causes them. If we were at fault, we must admit it and apologize. And when someone else's plans change, rather than first concluding something about their heart, <mark>we need to hear their reasons</mark>."], "points": ["Faithfulness shows not only in sticking to plans, but in caring for others' good and explaining responsibly when plans must change."]}, {"title": "Verses 18–20 · In Christ, God's Promises Are 'Yes'", "paragraphs": ["In verse 18, Paul says, <mark>'As surely as God is faithful, our word to you has not been Yes and No.'</mark> 'Faithful' means trustworthy and reliable. Then in verse 19 he says that the Son of God, Jesus Christ, whom he, Silvanus, and Timothy proclaimed, <mark>'was not Yes and No, but in Him it is always Yes.'</mark> Why does Paul suddenly move from travel plans to Jesus? Because if they regard Paul as untrustworthy, they may come to doubt the gospel he preached too. Paul makes them look back at the gospel they received. The Jesus they proclaimed is not One who promises salvation and then fickly takes it back. Paul asks them to consider this matter in light of his life of proclaiming and serving that faithful Lord. Of course, today's leaders must never use this passage as grounds to claim all their judgments are right. Paul doesn't shut down questions with authority; he explains his actions.", "Verse 20: <mark>'For all the promises of God find their Yes in Him. That is why it is through Him that we utter our Amen to God for His glory.'</mark> God's promise of salvation has been fulfilled and confirmed in Jesus Christ. Jesus' coming, cross, and resurrection are the decisive proof that God kept His promise. So this verse does not mean that everything I want will come true. What we hold on to is God's promise accomplished in Christ. Our response to that promise is <mark>'Amen, amen, amen'</mark> — believing that what God has done is true and entrusting our situations and ourselves to Him. Assurance of salvation also comes from here: not from how warm my feelings are today, but from looking at what Jesus has accomplished for me."], "points": ["What I hold on to is not my plans, but God's promises that have already become 'Yes' in Christ."]}, {"title": "Verses 21–22 · God Establishes Us Together and Guarantees Us with the Spirit", "paragraphs": ["In verse 21, Paul says, <mark>'It is God who establishes us with you in Christ, and has anointed us.'</mark> Earlier, 'we' who preached the gospel and 'you' who heard it were distinguished. Now Paul confesses that God establishes us together with you in Christ. Paul stands by God's grace, and the Corinthian believers stand by the same grace. Roles may differ, but the fact that God must hold us up is the same. 'Anointed' can be understood as God setting us apart and preparing us to belong to Him and serve Him. Even in conflict we must remember this — and let me emphasize it again: <mark>church family members are not called to defeat one another. We are called to stand firm together in Christ.</mark>", "In verse 22, Paul says God <mark>'has also put His seal on us and given us His Spirit in our hearts as a guarantee.'</mark> A seal is the picture of stamping something: God has made us His own people. A guarantee is a gift that makes certain what is yet to come. By giving the Spirit, God has guaranteed that He will complete the salvation He began. This doesn't mean we received only part of the Spirit; it means the Spirit Himself is the gift guaranteeing the completion of salvation we will enjoy. We have already received grace, yet we are still weak and face difficulties. But we cannot conclude that God's promise has failed just because difficulties remain. God the Father establishes us, the promise is fulfilled in God the Son, Jesus, and <mark>the Holy Spirit is given as a guarantee</mark>. Our hope lies in this saving work of God. Present difficulties do not cancel God's promise. We enjoy the grace already given and wait for God to bring it to completion."], "points": ["Present difficulties cannot cancel God's promise."]}, {"title": "Application · Let Your Yes Be Yes and Your No Be No", "paragraphs": ["Our plans can change. But the grace God has given in Christ leads us to treat one another truthfully. In Matthew 5, Jesus says, <mark>'Let what you say be simply \"Yes\" or \"No\"; anything more than this comes from evil'</mark> (Matthew 5:37). This teaches that our everyday words must be trustworthy. We must not be people who need to add religious words to be believed, but people whose <mark>ordinary words and actions show sincerity</mark>.", "Jesus obeyed the Father's will and bore the cross, and God raised Him from the dead. Our faith rests on this salvation actually accomplished in Christ. We don't know when the Lord will come again, but we believe His promise and wait. And while we wait, we live <mark>faithfully in the relationships entrusted to us today</mark>.", "If there's an explanation you've put off, reach out first today. If there's a promise you couldn't keep, explain the situation and <mark>take responsibility for your part</mark>. And if you've drawn conclusions about someone's heart, hear their circumstances first.", "In my relationships today, am I trying to protect my face — or, as someone who believes in the faithful Lord, am I speaking truthfully and building the other person up?"], "points": ["As one who believes in the faithful Lord, I will keep my words trustworthy today."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether I hid important facts and said only what favored me when asking or explaining."}, {"key": "c2", "text": "I checked whether I avoid making promises lightly, and inform and explain responsibly when they change."}, {"key": "c3", "text": "When someone's plans changed, I tried to hear their reasons instead of judging their heart first."}, {"key": "c4", "text": "Rather than relying on my feelings, I answered 'Amen' to God's promises that are 'Yes' in Christ."}], "s4heading": "One-Line Reflection", "memoHint": "Is there an explanation I've put off, a promise I couldn't keep, or someone whose heart I've judged — and how will I respond today?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Reach Out First", "value": "Contact someone you owe an explanation and share your situation honestly"}, {"key": "act2", "label": "Take Responsibility", "value": "Apologize for one unkept promise and decide concretely what part you'll take responsibility for"}, {"key": "act3", "label": "Hear the Reason", "value": "If you've judged someone for changing plans, stop and ask about their circumstances"}, {"key": "act4", "label": "Keep My Word", "value": "Even for a small promise today, let your 'Yes' be 'Yes' to the end"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize 2 Corinthians 1:20 and answer 'Amen' to the promises fulfilled in Christ"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, faithful God, for making all Your promises 'Yes' in Christ, establishing us firmly together, and giving us the Spirit as a guarantee."}, {"key": "p2", "tag": "Repent", "text": "I repent of shifting my words to my advantage, treating promises lightly, and judging others' hearts when their plans changed."}, {"key": "p3", "tag": "Ask", "text": "Let my words be 'Yes, yes' and 'No, no'; help me choose truthfulness over saving face, and build others up rather than trying to win."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Nobyembre 2, Lunes", "ref": "2 Corinto 1:12–22", "headline": "Kapag Nagbago ang Plano,<br>Nagbago rin ba ang Puso?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · 2 Corinto 1:12-22", "s1heading": "Salita Ngayon", "verse": "\"Sapagkat ang lahat ng pangako ng Diyos ay 'Oo' sa Kanya.<br>Kaya sa pamamagitan Niya ay sinasabi natin ang 'Amen'<br>sa Diyos para sa Kanyang kaluwalhatian.\"", "verseRef": "2 Corinto 1:20", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Maaaring Magbago ang Ating Plano, ngunit Tapat ang Diyos", "paragraphs": ["Kapag nagbago ang plano ng isang tao, minsan iniisip nating nagbago rin ang kanyang puso. Kapag may nagsabing darating siya ngunit hindi dumating, maaari nating madama na hindi niya tayo itinuturing na mahalaga. Kahit hindi nagbago ang ating puso, maaaring makasama ng loob ng naghihintay ang ipinagpalibang pangako — kaya kailangan nating ipaliwanag ang ating kalagayan at humingi ng pang-unawa. Ipinapakita ng talata ngayon ang katulad na problema. Narito ang sentro nito: <mark>maaaring magbago ang ating mga plano, ngunit tapat ang Diyos na humahawak sa atin — at dahil natanggap natin ang biyayang iyon, dapat tayong tumugon sa mga salita at kilos na mapagkakatiwalaan ng iba.</mark>", "Sa naunang talata, pinuri ni Pablo ang Diyos na nagligtas at umaliw sa kanya sa krisis, at hiniling sa mga mananampalataya na samahan siya sa panalangin. Ngunit upang sama-samang manalangin at magpasalamat, mahalaga ang tiwala sa isa't isa. Sa iglesya sa Corinto, nananatili pa ang hinala kay Pablo. Dahil sa pagbabago ng kanyang plano ng pagdalaw, tila inisip ng ilan na basta-basta siyang nagsasalita o kumikilos para sa sariling kaginhawahan. Noon, hindi posibleng agad ipaliwanag ang kalagayan sa telepono o text. Hindi iniiwasan ni Pablo ang isyu. Ipinaliliwanag niya ang kanyang mga kilos at itinuturo sila sa <mark>tapat na Diyos</mark> na sama-sama nilang sinasampalatayanan. Hindi natin alam ang bawat kalagayan, at hindi rin natin lubos na makokontrol ang ating sariling sitwasyon. Kaya kapag nagbago ang plano at nagkaroon ng hindi pagkakaunawaan, sa anong pamantayan tayo dapat magsalita at humatol? Sa harap ng Salita ngayon, tingnan muna natin ang ating sarili: Ibinubuhos ko ba ang aking puso sa pagtatanggol lamang sa aking posisyon, o sinisikap kong magsalita nang totoo sa harap ng Panginoon at patibayin ang isa't isa?"], "points": ["Nakatuon lamang ba ako sa pagtatanggol sa aking posisyon, o sa pagsasalita nang totoo sa harap ng Panginoon at pagpapatibay sa iba?"]}, {"title": "Talata 12–14 · Kumilos nang Tapat, Walang Nakatagong Motibo", "paragraphs": ["Sa talata 12, sinasabi ni Pablo na pinatototohanan ng kanyang konsensya na sa mundo, at lalo na sa mga taga-Corinto, kumilos siya <mark>'hindi sa makalamang karunungan kundi sa biyaya ng Diyos.'</mark> Ang 'makalamang karunungan' dito ay hindi nangangahulugang kakayahang mag-isip o magplano mismo. Ito ang mapagkalkulang pag-iisip na nagpapakilos sa tao para sa sariling pakinabang at nagbabago ng salita patungo sa panig na kapaki-pakinabang. Matatag na sinasabi ni Pablo na hindi siya kumilos nang ganoon; tinrato niya ang mga mananampalataya nang may kabanalan at katapatan sa harap ng Diyos. At hindi niya ito isinasandig sa kanyang mabuting ugali kundi sa biyaya ng Diyos. Ang biyaya ay hindi lamang nagpapatawad ng kasalanan; <mark>binabago tayo nito upang tratuhin nang totoo ang mga tao</mark>. Kung sinasabi nating natanggap natin ang biyaya ngunit nanlilinlang at gumagamit tayo ng tao, dapat nating seryosong suriin ang ating buhay. Siyempre, hindi natin dapat gamitin ang 'malinis ang aking konsensya' upang patahimikin ang bawat tanong. Si Pablo mismo ay nagpahayag na hindi siya ginagawang matuwid ng malinis na konsensya — ang Panginoon ang humahatol (1 Corinto 4:4). Hindi lamang hinihiling ni Pablo na unawain nila ang kanyang puso; inaanyayahan niya silang pag-isipan ang buhay na nakita nilang ipinamuhay niya.", "Sa talata 13, sinasabi ni Pablo, <mark>'Wala kaming isinusulat sa inyo kundi ang inyong nababasa at nauunawaan.'</mark> Hindi magkaiba ang kanyang isinulat na salita at panloob na intensyon. Kapag pumasok ang hinala sa isang relasyon, patuloy nating hinahanap ang ibang kahulugan sa likod ng salita ng iba. Kahit mabait ang kanilang sinasabi, inuuna nating isipin kung ano ang gusto nilang makuha. Ipinaliliwanag ni Pablo na hindi dalawahang salita ang kanyang mga liham; wala siyang nakatagong balak na libakin sila. Dapat din nating pagnilayan: Kapag may hinihiling tayo sa iba, pinipilit ba natin sila upang hindi sila makatanggi? Itinatago ba natin ang mahahalagang katotohanan at sinasabi lamang ang mga bahaging pabor sa atin? Pinasusuri tayo ng katapatan hindi lamang sa ating sinabi kundi sa mga intensyong itinatago natin. Sa talata 14, hindi nagtatapos ang layunin ni Pablo sa paglilinis ng kanyang pangalan. Inaasahan niyang <mark>sa araw ng Panginoong Jesus, sila ang magiging kanyang ipinagmamalaki at siya naman ang sa kanila</mark> — hindi pagmamalaki sa pagkakaroon ng sikat na pinuno o maraming tagasunod, kundi sama-samang pagkagalak sa ginawa ng Diyos sa buhay ng isa't isa. Tumitingin si Pablo lampas sa kung paano siya nakikita ng tao ngayon, tungo sa katotohanang mahahayag sa harap ng Panginoon. Gayunman, hindi niya iniiwasan ang pagpapaliwanag ngayon; dahil haharap siya sa Panginoon sa huling araw, nagpapaliwanag siya nang totoo ngayon. Dapat ding lumalim ang ating tanong: lampas sa 'Paano ko mapapaamin sa iba na tama ako?' dapat nating itanong, 'Masasabi ko ba sa Panginoon na totoo ang mga salita at kilos na ito?' Ang pagpapanumbalik ng relasyon ay higit pa sa pagkilala sa aking katuwiran; ito ay muling pagkilala sa biyaya ng Diyos na kumikilos sa pamamagitan ng isa't isa."], "points": ["Lampas sa 'Paano ko mapatutunayang tama ako?' itinatanong ko, 'Masasabi ko ba sa Panginoon na totoo ang mga salita at kilos na ito?'"]}, {"title": "Talata 15–17 · Nagbago ang Plano, ngunit Hindi Ito Pabagu-bago", "paragraphs": ["Sa talata 15–16, sinasabi ni Pablo na pinlano niya ang kanyang pagdalaw nang may tiwala sa kanyang relasyon sa mga mananampalataya. Sa 1 Corinto, sinabi niyang dadaan siya sa Macedonia at saka pupunta sa Corinto upang manatili. Ngunit dito, ipinaliliwanag niyang balak sana niyang dalawin muna ang Corinto, magpatuloy sa Macedonia, bumalik sa Corinto, at saka tumungo sa Judea. Pinlano niyang dumalaw nang dalawang beses — upang sila'y <mark>'magkaroon ng ikalawang karanasan ng biyaya.'</mark> Inaasahan niyang makikinabang sila sa pakikipagkita sa kanya at sa pakikinig sa Salita, at makikibahagi rin sa ministeryo ng paghahatid sa kanya patungong Judea. Kasama sa 'paghahatid' dito ang praktikal na tulong na kailangan sa paglalakbay. Hindi si Pablo ang taong basta nagbibigay lamang nang isahang panig sa mga mananampalataya; nais niyang sama-samang tamasahin ang biyaya at sama-samang paglingkuran ang ebanghelyo. Kapag nagpaplano tayo, dapat din nating itanong: Interesado lamang ba ako sa pagtupad ng gusto ko? O isinasaalang-alang ko rin ang <mark>kabutihan ng mga kasama sa plano</mark>?", "Sa talata 17, nagtanong si Pablo, <mark>'Pabagu-bago ba ako nang gustuhin kong gawin ito? Nagpaplano ba ako ayon sa laman, handang magsabi ng \"Oo, oo\" at \"Hindi, hindi\" nang sabay?'</mark> Ang sagot ay hindi. Hindi itinatanggi ni Pablo na nagbago ang iskedyul; itinatanggi niya ang paghatol na nagmula ang pagbabago sa pagiging pabagu-bago o sa pusong mapanlinlang. Iba ang pangangako nang walang balak tuparin kaysa sa tapat na pagpaplano at saka pagbabago dahil may dumating na dahilan. Sa mga sumunod na talata (1:23), ipinaliwanag ni Pablo na ipinagpaliban niya ang pagdalaw upang hindi sila muling malungkot. Nagbago ang plano, ngunit nagpatuloy ang kanyang layuning patibayin sila. Gayunman, hindi sapat ang mabuting intensyon lamang — ipinaliliwanag ni Pablo ang kanyang pasya at nakikipag-usap upang ibalik ang tiwala. Nahahayag ang ating pananampalataya sa mga ganitong pang-araw-araw na bagay: hindi basta-basta nangangako, nagpapaalam nang maaga kapag kailangan ng pagbabago, at isinasaalang-alang ang hirap na idudulot nito sa iba. Kung tayo ang nagkamali, dapat nating aminin at humingi ng tawad. At kapag nagbago ang plano ng iba, sa halip na unahing magpasya tungkol sa kanilang puso, <mark>kailangan nating pakinggan ang kanilang dahilan</mark>."], "points": ["Nahahayag ang katapatan hindi lamang sa pagpapanatili ng plano, kundi sa pag-iisip sa kabutihan ng iba at responsableng pagpapaliwanag kapag kailangang magbago ang plano."]}, {"title": "Talata 18–20 · Kay Cristo, ang mga Pangako ng Diyos ay 'Oo'", "paragraphs": ["Sa talata 18, sinasabi ni Pablo, <mark>'Kung paanong tapat ang Diyos, ang aming salita sa inyo ay hindi \"Oo\" at \"Hindi.\"'</mark> Ang 'tapat' ay nangangahulugang mapagkakatiwalaan at maaasahan. Pagkatapos sa talata 19, sinasabi niyang ang Anak ng Diyos, si Jesu-Cristo, na ipinangaral niya, ni Silvano, at ni Timoteo, <mark>'ay hindi \"Oo\" at \"Hindi,\" kundi sa Kanya ay laging \"Oo.\"'</mark> Bakit biglang lumipat si Pablo mula sa plano ng paglalakbay tungo kay Jesus? Dahil kung ituturing nilang hindi mapagkakatiwalaan si Pablo, maaaring pagdudahan din nila ang ebanghelyong ipinangaral niya. Pinababalikan ni Pablo sa kanila ang ebanghelyong kanilang tinanggap. Ang Jesus na kanilang ipinangaral ay hindi ang Isang nangangako ng kaligtasan at saka pabagu-bagong binabawi ito. Hinihiling ni Pablo na pag-isipan nila ang bagay na ito sa liwanag ng kanyang buhay ng pagpapahayag at paglilingkod sa tapat na Panginoong iyon. Siyempre, hindi kailanman dapat gamitin ng mga pinuno ngayon ang talatang ito bilang batayan upang angkining tama ang lahat ng kanilang pasya. Hindi pinatatahimik ni Pablo ang mga tanong sa pamamagitan ng awtoridad; ipinaliliwanag niya ang kanyang mga kilos.", "Talata 20: <mark>'Sapagkat ang lahat ng pangako ng Diyos ay \"Oo\" sa Kanya. Kaya sa pamamagitan Niya ay sinasabi natin ang \"Amen\" sa Diyos para sa Kanyang kaluwalhatian.'</mark> Natupad at napagtibay kay Jesu-Cristo ang pangako ng Diyos ng kaligtasan. Ang pagdating, krus, at muling pagkabuhay ni Jesus ang mapagpasyang patunay na tinupad ng Diyos ang Kanyang pangako. Kaya hindi nangangahulugan ang talatang ito na matutupad ang lahat ng gusto ko. Ang hinahawakan natin ay ang pangako ng Diyos na natupad kay Cristo. Ang ating tugon sa pangakong iyon ay <mark>'Amen, amen, amen'</mark> — paniniwalang totoo ang ginawa ng Diyos at pagkakatiwala sa Kanya ng ating kalagayan at ng ating sarili. Dito rin nagmumula ang katiyakan ng kaligtasan: hindi sa kung gaano kainit ang aking damdamin ngayon, kundi sa pagtingin sa nagawa ni Jesus para sa akin."], "points": ["Ang hinahawakan ko ay hindi ang aking mga plano, kundi ang mga pangako ng Diyos na naging 'Oo' na kay Cristo."]}, {"title": "Talata 21–22 · Sama-sama Tayong Itinatatag ng Diyos at Ginagarantiyahan ng Espiritu", "paragraphs": ["Sa talata 21, sinasabi ni Pablo, <mark>'Ang Diyos ang nagpapatatag sa amin kasama ninyo kay Cristo, at nagpahid sa amin.'</mark> Kanina, ibinukod ang 'kami' na nangaral ng ebanghelyo at ang 'kayo' na nakarinig nito. Ngayon, ipinahayag ni Pablo na sama-sama tayong itinatatag ng Diyos kay Cristo. Nakatayo si Pablo sa biyaya ng Diyos, at nakatayo ang mga mananampalataya sa Corinto sa iisang biyaya. Maaaring magkaiba ang tungkulin, ngunit pareho ang katotohanang kailangan tayong alalayan ng Diyos. Ang 'pinahiran' ay maaaring unawain bilang pagbubukod at paghahanda sa atin ng Diyos upang maging Kanya at maglingkod sa Kanya. Kahit sa alitan, dapat natin itong alalahanin — at muli kong idiriin: <mark>ang mga kapatiran sa iglesya ay hindi tinawag upang talunin ang isa't isa. Tinawag tayo upang sama-samang tumayo nang matatag kay Cristo.</mark>", "Sa talata 22, sinasabi ni Pablo na ang Diyos ay <mark>'naglagay rin ng Kanyang tatak sa atin at ibinigay ang Kanyang Espiritu sa ating mga puso bilang garantiya.'</mark> Ang tatak ay larawan ng pagtatatak sa isang bagay: ginawa tayo ng Diyos na Kanyang sariling bayan. Ang garantiya ay kaloob na nagpapatiyak sa darating pa. Sa pagbibigay ng Espiritu, ginarantiyahan ng Diyos na tatapusin Niya ang kaligtasang Kanyang sinimulan. Hindi ito nangangahulugang bahagi lamang ng Espiritu ang natanggap natin; ibig sabihin, ang Espiritu Mismo ang kaloob na gumagarantiya sa kaganapan ng kaligtasang tatamasahin natin. Natanggap na natin ang biyaya, ngunit mahina pa rin tayo at nahaharap sa mga paghihirap. Ngunit hindi natin maipapasyang nabigo ang pangako ng Diyos dahil lamang may natitira pang paghihirap. Itinatatag tayo ng Diyos Ama, natutupad ang pangako sa Diyos Anak na si Jesus, at <mark>ibinigay ang Espiritu Santo bilang garantiya</mark>. Nasa gawaing ito ng pagliligtas ng Diyos ang ating pag-asa. Hindi kinakansela ng kasalukuyang paghihirap ang pangako ng Diyos. Tinatamasa natin ang biyayang naibigay na at hinihintay na lubusin ito ng Diyos."], "points": ["Hindi kayang kanselahin ng kasalukuyang paghihirap ang pangako ng Diyos."]}, {"title": "Aplikasyon · Ang Iyong 'Oo' ay Maging 'Oo' at ang 'Hindi' ay 'Hindi'", "paragraphs": ["Maaaring magbago ang ating mga plano. Ngunit inaakay tayo ng biyayang ibinigay ng Diyos kay Cristo na tratuhin nang totoo ang isa't isa. Sa Mateo 5, sinasabi ni Jesus, <mark>'Ang inyong sabihin ay \"Oo\" lamang o \"Hindi\"; anumang higit dito ay nagmumula sa masama'</mark> (Mateo 5:37). Itinuturo nito na dapat mapagkakatiwalaan ang ating pang-araw-araw na salita. Hindi tayo dapat maging mga taong kailangang magdagdag ng relihiyosong salita upang paniwalaan, kundi mga taong ang <mark>karaniwang salita at kilos ay nagpapakita ng katapatan</mark>.", "Sumunod si Jesus sa kalooban ng Ama at pinasan ang krus, at muli Siyang binuhay ng Diyos mula sa mga patay. Nakasalalay ang ating pananampalataya sa kaligtasang ito na tunay na natupad kay Cristo. Hindi natin alam kung kailan babalik ang Panginoon, ngunit pinaniniwalaan natin ang Kanyang pangako at naghihintay. At habang naghihintay, namumuhay tayo <mark>nang tapat sa mga relasyong ipinagkatiwala sa atin ngayon</mark>.", "Kung may paliwanag kang ipinagpaliban, ikaw muna ang makipag-ugnayan ngayon. Kung may pangakong hindi mo natupad, ipaliwanag ang kalagayan at <mark>panagutan ang iyong bahagi</mark>. At kung nagpasya ka na tungkol sa puso ng isang tao, pakinggan muna ang kanyang kalagayan.", "Sa aking mga relasyon ngayon, sinisikap ko bang protektahan ang aking dangal — o, bilang taong naniniwala sa tapat na Panginoon, nagsasalita ba ako nang totoo at pinatitibay ang iba?"], "points": ["Bilang taong naniniwala sa tapat na Panginoon, pananatilihin kong mapagkakatiwalaan ang aking mga salita ngayon."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung itinago ko ang mahahalagang katotohanan at sinabi lamang ang pabor sa akin nang humiling o magpaliwanag."}, {"key": "c2", "text": "Sinuri ko kung iniiwasan kong basta-basta mangako, at nagpapaalam at nagpapaliwanag nang responsable kapag nagbabago ito."}, {"key": "c3", "text": "Nang magbago ang plano ng iba, sinikap kong pakinggan ang kanilang dahilan sa halip na unahing hatulan ang kanilang puso."}, {"key": "c4", "text": "Sa halip na umasa sa aking damdamin, sumagot ako ng 'Amen' sa mga pangako ng Diyos na 'Oo' kay Cristo."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "May paliwanag ba akong ipinagpaliban, pangakong hindi natupad, o taong hinatulan ko ang puso — at paano ako tutugon ngayon?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Ikaw Muna ang Lumapit", "value": "Kontakin ang taong may utang kang paliwanag at ibahagi nang tapat ang iyong kalagayan"}, {"key": "act2", "label": "Managot", "value": "Humingi ng tawad sa isang pangakong hindi natupad at magpasya nang tiyak kung anong bahagi ang pananagutan mo"}, {"key": "act3", "label": "Pakinggan ang Dahilan", "value": "Kung hinatulan mo ang isang tao dahil nagbago ang plano niya, huminto at itanong ang kanyang kalagayan"}, {"key": "act4", "label": "Tuparin ang Salita", "value": "Kahit sa maliit na pangako ngayon, hayaang ang iyong 'Oo' ay maging 'Oo' hanggang sa wakas"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang 2 Corinto 1:20 at sumagot ng 'Amen' sa mga pangakong natupad kay Cristo"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, tapat na Diyos, sa paggawa sa lahat ng Iyong pangako na 'Oo' kay Cristo, sa matatag na pagtatatag sa amin nang sama-sama, at sa pagbibigay sa amin ng Espiritu bilang garantiya."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa pagbabago ng aking salita para sa sariling pakinabang, sa pagbabalewala sa mga pangako, at sa paghatol sa puso ng iba nang magbago ang kanilang plano."}, {"key": "p3", "tag": "Kahilingan", "text": "Hayaan Mong ang aking salita ay maging 'Oo, oo' at 'Hindi, hindi'; tulungan Mo akong piliin ang katapatan kaysa sa pagliligtas ng dangal, at patibayin ang iba sa halip na magsikap manalo."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-11-02';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
