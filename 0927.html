<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "9월 27일 주일", "ref": "사사기 12장 1–15절", "headline": "우리 안에<br>정말 생명이 있습니까", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 사사기 12:1-15", "s1heading": "오늘의 말씀", "verse": "\"그는 우리의 화평이신지라 둘로 하나를 만드사<br>원수 된 것 곧 중간에 막힌 담을 자기 육체로 허시고\"", "verseRef": "에베소서 2:14", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 외부의 적이 사라지자, 형제가 적이 되다", "paragraphs": ["앞선 본문에서 입다는 암몬과의 전쟁에서 승리했지만, 불필요한 서원 때문에 하나뿐인 딸을 잃었습니다. 전쟁에서는 이겼지만 가정에서는 비극을 맞았습니다. 그런데 오늘 본문에서는 그 비극이 가정을 넘어 이스라엘 공동체 전체로 번집니다. 외부의 적 암몬은 사라졌는데, 이제 내부의 형제가 적이 됩니다.", "눈여겨볼 점이 있습니다. 11장에서는 <mark>\"여호와의 영이 입다에게 임하시니\"</mark>, <mark>\"여호와께서 그들을 그의 손에 넘겨주시매\"</mark>라는 표현이 있었습니다. 그러나 12장 전체에는 하나님이 행하시는 장면이 한 번도 나오지 않습니다. 앞에는 하나님의 구원이 있었지만, 이제는 형제끼리 서로 죽이는 내전만 남았습니다."], "points": ["공동체의 가장 큰 위기는 외부의 적이 강해질 때만이 아닙니다. 형제가, 자매가, 식구가 적으로 보이기 시작하는 순간입니다."]}, {"title": "1–7절 · 요단 나루의 비극", "paragraphs": ["에브라임 사람들이 입다에게 와서 따집니다. \"왕이 암몬과 싸우러 갈 때 왜 우리를 불러 함께 가게 하지 않았느냐.\" 그리고 한마디를 더합니다. <mark>\"우리가 반드시 너와 네 집을 불사르리라\"</mark>. 단순한 불평이 아니라 위협이었습니다. 사사기 8장에서도 에브라임은 기드온에게 같은 항의를 했지만, 그때 기드온은 자기 공을 낮추고 에브라임을 높여 분노를 가라앉혔습니다. 그러나 딸을 잃은 입다는 물러서지 않았고, 서로의 자존심이 부딪치며 결국 전쟁이 됩니다.", "입다는 \"여호와께서 그들을 내 손에 넘겨주셨거늘\"이라고 말합니다. 하나님이 승리를 주셨다는 것은 알고 있었습니다. 그러나 그 신앙의 지식이 형제를 품는 성품으로 이어지지는 않았습니다. 갈등은 지파 전체의 모욕으로 번지고, 길르앗 사람들은 요단 나루를 장악한 뒤 도망치는 사람에게 <mark>\"쉽볼렛\"</mark>이라고 말해 보라고 합니다. 발음을 제대로 하지 못해 \"십볼렛\"이라 하면 에브라임 사람으로 드러나 죽임을 당했습니다. 그렇게 죽은 에브라임 사람이 사만 이천 명이었습니다.", "더 가슴 아픈 것은 장소입니다. 요단 나루는 사사기 3장에서 모압을, 7장에서 미디안을 막았던 곳입니다. 그런데 이제 같은 장소에서, 적에게 쓰던 전략으로 이스라엘이 이스라엘을 막고 죽입니다. 그리고 입다는 사사가 된 지 6년 만에 죽습니다. 이전 사사들에게 반복되던 <mark>\"그 땅이 평온하였더라\"</mark>는 말은 나오지 않습니다."], "points": ["하나님께 쓰임받았다는 것과 성품이 성숙하다는 것은 같은 말이 아닙니다. 갈등 자체보다, 갈등을 어떻게 다루느냐가 공동체의 방향을 결정합니다."]}, {"title": "8–15절 · 입산, 엘론, 압돈 — 그리고 반복되는 \"죽었더라\"", "paragraphs": ["이어서 세 명의 사사가 짧게 등장합니다. 입산에게는 아들 서른 명과 딸 서른 명이 있었고 7년을 다스렸습니다. 하나뿐인 딸을 잃은 입다의 황폐함 뒤에, 예순 명 자녀의 풍성함이 나란히 놓입니다. 스불론 사람 엘론은 10년을 다스렸는데, 전쟁도 큰 구원 사건도 기록되지 않습니다. 압돈에게는 아들 마흔 명과 손자 서른 명이 있었고, 그들 모두 나귀를 탔습니다. 번성과 부와 안정을 보여주는 모습입니다.", "그런데 12장 전체를 읽으면 한 단어가 계속 들립니다. <mark>죽었더라</mark>. 에브라임 사람들이 죽고, 입다가 죽고, 입산이 죽고, 엘론이 죽고, 압돈이 죽습니다. 창세기 5장에서 \"그리고 그가 죽었더라\"가 반복되는 것처럼 말입니다. 6년이든 10년이든, 자녀가 한 명이든 칠십 명이든, 인간 사사의 마지막은 결국 죽음이었습니다."], "points": ["평안과 번영이 있어도 죽음 자체를 이길 수는 없습니다. 이스라엘에게는 죽지 않는 구원자가 필요했습니다."]}, {"title": "적용 · 형제를 다시 형제로, 죽음을 다시 생명으로", "paragraphs": ["우리 삶도 그럴 수 있습니다. 밖에서는 열심히 싸웁니다. 직장에서 버티고, 가정과 자녀를 돌보고, 학교에서 자기 싸움을 하고, 자녀에게 짐이 되지 않으려 애씁니다. 그런데 정작 집에 돌아오면, 가장 가까운 가족이 가장 불편한 사람이 되어 있을 수 있습니다. 교회도 사역은 잘 돌아가는데 서로를 경쟁자나 적처럼 바라보며 그 힘을 서로 싸우는 데 쓰고 있지는 않습니까?", "그렇다면 더 큰 성공이 필요한 것이 아니라 복음이 다시 필요합니다. 십자가에서 예수님은 형제를 죽이지 않으셨습니다. 오히려 자신의 생명을 내어주셨습니다. <mark>\"그는 우리의 화평이신지라 둘로 하나를 만드사 원수 된 것을 십자가로 소멸하시고\"</mark>(에베소서 2장). 입다의 시대에는 형제가 적이 되었지만, 예수님의 십자가는 적이 된 사람을 다시 형제로 만듭니다.", "그리고 예수님은 죽으셨지만 죽음으로 끝나지 않으셨습니다. 부활하셨습니다. 죽음의 이야기를 생명의 이야기로 바꾸셨습니다. 겉으로 안정되어 있고, 교회가 돌아가고, 가정이 유지된다고 해서 반드시 영적으로 살아 있는 것은 아닙니다. 십자가의 가치가 우리의 관계를 다스리고, 부활의 소망이 우리의 삶을 움직일 때 비로소 우리 안에 생명이 있습니다."], "points": ["복음이 있는 곳에서는 형제가 다시 형제가 되고, 죽음이 있던 곳에 다시 생명이 시작됩니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "밖에서는 최선을 다하면서 정작 가족에게는 가장 불편한 사람이 되어 있지는 않은지 돌아봤다"}, {"key": "c2", "text": "교회나 모임 안에서 누군가를 형제·자매가 아니라 경쟁자나 적처럼 보고 있지는 않은지 점검했다"}, {"key": "c3", "text": "갈등이 생겼을 때 기드온처럼 나를 낮추기보다, 입다처럼 자존심을 앞세우고 있지는 않은지 돌아봤다"}, {"key": "c4", "text": "겉으로 유지되는 삶이 아니라, 십자가와 부활의 복음이 내 안에 실제 생명으로 살아 있는지 점검했다"}], "s4heading": "묵상 한 줄", "memoHint": "지금 내 가정이나 공동체에서 '형제가 적처럼' 느껴지는 관계가 있다면 누구입니까? 십자가는 그 관계를 어떻게 바꾸라고 말합니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "먼저 나를 낮추기", "value": "갈등 중인 사람에게 기드온처럼 상대를 먼저 인정하는 말 한마디 건네기"}, {"key": "act2", "label": "집에서 먼저 화평하기", "value": "오늘 가족 한 사람에게 고맙다·미안하다는 말을 먼저 하기"}, {"key": "act3", "label": "경쟁자를 형제로", "value": "교회나 모임에서 경쟁자처럼 느꼈던 사람을 위해 오늘 이름 불러 기도하기"}, {"key": "act4", "label": "날카로운 말 멈추기", "value": "상대를 규정하거나 모욕하는 말을 오늘 하루 의식적으로 멈추기"}, {"key": "act5", "label": "부활의 소망 붙들기", "value": "지치고 막힌 문제 하나를 놓고 부활하신 예수님께 소망을 두는 기도 드리기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "형제를 죽이지 않으시고 오히려 자신의 생명을 내어주셔서, 원수 된 우리를 다시 하나로 만드신 예수님, 감사합니다"}, {"key": "p2", "tag": "회개", "text": "밖에서는 잘 싸우면서 가장 가까운 가족과 형제자매에게 칼을 겨누었던 저의 말과 태도를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "십자가의 가치가 제 관계를 다스리고, 부활의 소망이 제 삶과 가정과 교회에 다시 생명을 불어넣게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "September 27, Lord's Day", "ref": "Judges 12:1–15", "headline": "Is There Truly<br>Life Within Us?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · Judges 12:1-15", "s1heading": "Today's Word", "verse": "\"For He Himself is our peace, who has made us both one<br>and has broken down in His flesh the dividing wall of hostility.\"", "verseRef": "Ephesians 2:14", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · When the Outside Enemy Disappears, Brothers Become Enemies", "paragraphs": ["In the previous passage, Jephthah won the war against Ammon but lost his only daughter because of an unnecessary vow. He won on the battlefield but met tragedy at home. Today, that tragedy spreads beyond his household to the whole community of Israel. The outside enemy, Ammon, is gone — and now brothers within become the enemy.", "Notice something. In chapter 11 we read, <mark>\"the Spirit of the LORD was upon Jephthah\"</mark> and <mark>\"the LORD gave them into his hand.\"</mark> But in all of chapter 12, there isn't a single scene of God acting. Before, there was God's deliverance; now, only a civil war of brothers killing brothers."], "points": ["A community's greatest crisis isn't only when an outside enemy grows strong — it's the moment brothers, sisters, and family members begin to look like enemies."]}, {"title": "Verses 1–7 · Tragedy at the Fords of the Jordan", "paragraphs": ["The men of Ephraim confront Jephthah: \"Why did you cross over to fight the Ammonites without calling us to go with you?\" Then they add, <mark>\"We will burn your house over you with fire.\"</mark> This wasn't a complaint — it was a threat. In Judges 8, Ephraim made the same protest to Gideon, but Gideon humbled himself and honored Ephraim, and their anger subsided. Jephthah, having just lost his daughter, didn't back down. Pride clashed with pride, and it became war.", "Jephthah says, \"the LORD gave them into my hand.\" He knew God had given the victory — but that knowledge of faith didn't flow into a character that could embrace his brothers. The conflict grows into insults against a whole tribe. The Gileadites seize the fords of the Jordan and make each fugitive say <mark>\"Shibboleth.\"</mark> Anyone who couldn't pronounce it and said \"Sibboleth\" was exposed as an Ephraimite and killed. Forty-two thousand Ephraimites died.", "What's even more heartbreaking is the place. The fords of the Jordan were where Israel had blocked Moab in chapter 3 and Midian in chapter 7. Now, at the same place, using tactics once used against enemies, Israel blocks and kills Israel. And Jephthah dies after judging for six years. The phrase repeated for earlier judges — <mark>\"and the land had rest\"</mark> — never appears."], "points": ["Being used by God is not the same as having a mature character. More than the conflict itself, how we handle conflict determines a community's direction."]}, {"title": "Verses 8–15 · Ibzan, Elon, Abdon — and the Repeated \"He Died\"", "paragraphs": ["Three more judges appear briefly. Ibzan had thirty sons and thirty daughters and judged for seven years — the abundance of sixty children set right beside the desolation of Jephthah, who lost his only daughter. Elon the Zebulunite judged for ten years, with no war or great deliverance recorded. Abdon had forty sons and thirty grandsons, all riding donkeys — a picture of prosperity, wealth, and stability.", "Yet reading all of chapter 12, one word keeps sounding: <mark>he died</mark>. The Ephraimites die, Jephthah dies, Ibzan dies, Elon dies, Abdon dies — like the repeated \"and he died\" of Genesis 5. Six years or ten, one child or seventy, the end of every human judge was death."], "points": ["Peace and prosperity still cannot defeat death itself. Israel needed a Deliverer who would not die."]}, {"title": "Application · Making Brothers Brothers Again, Turning Death into Life", "paragraphs": ["Our lives can be like this. We fight hard out there — enduring at work, caring for home and children, fighting our own battles at school, trying not to be a burden to our children. But when we come home, the people closest to us may have become the most uncomfortable. And in church, ministry may run well while we look at each other as rivals or enemies, spending our strength fighting one another.", "If so, what we need isn't greater success — we need the gospel again. On the cross, Jesus didn't kill His brothers; He gave up His own life. <mark>\"He Himself is our peace, who has made us both one... reconciling us to God through the cross, thereby killing the hostility\"</mark> (Ephesians 2). In Jephthah's day, brothers became enemies; the cross of Jesus makes enemies brothers again.", "And Jesus died — but His story didn't end in death. He rose again, turning a story of death into a story of life. Being outwardly stable, with church running and family holding together, doesn't necessarily mean being spiritually alive. There is life in us only when the value of the cross governs our relationships and the hope of the resurrection moves our lives."], "points": ["Where the gospel is, brothers become brothers again, and life begins again where there was death."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether, while giving my best outside, I've become the most difficult person for my own family."}, {"key": "c2", "text": "I checked whether I see someone at church or in my group as a rival or enemy rather than a brother or sister."}, {"key": "c3", "text": "I reflected on whether, in conflict, I put my pride first like Jephthah rather than humbling myself like Gideon."}, {"key": "c4", "text": "I checked whether the gospel of the cross and resurrection is truly alive in me — not just a life that's outwardly holding together."}], "s4heading": "One-Line Reflection", "memoHint": "Is there a relationship in your home or community where a brother or sister feels like an enemy right now? How does the cross call you to change that relationship?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Humble Myself First", "value": "Like Gideon, say one word acknowledging the other person first to someone you're in conflict with"}, {"key": "act2", "label": "Make Peace at Home First", "value": "Say 'thank you' or 'I'm sorry' first to one family member today"}, {"key": "act3", "label": "From Rival to Brother", "value": "Pray today by name for someone at church or in your group you've felt was a rival"}, {"key": "act4", "label": "Stop Sharp Words", "value": "Consciously refrain today from words that label or insult others"}, {"key": "act5", "label": "Hold onto Resurrection Hope", "value": "Bring one exhausting, stuck problem to the risen Jesus in prayer, placing your hope in Him"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Jesus, thank You for not killing Your brothers but giving up Your own life, making us who were enemies one again."}, {"key": "p2", "tag": "Repent", "text": "I repent of my words and attitudes that turned a sword toward my closest family and brothers and sisters, even as I fought hard out in the world."}, {"key": "p3", "tag": "Ask", "text": "Let the value of the cross govern my relationships, and the hope of the resurrection breathe life again into my life, my family, and my church."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Setyembre 27, Araw ng Panginoon", "ref": "Mga Hukom 12:1–15", "headline": "Mayroon Ba Talagang<br>Buhay sa Loob Natin?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Mga Hukom 12:1-15", "s1heading": "Salita Ngayon", "verse": "\"Sapagkat Siya mismo ang ating kapayapaan, na ginawang isa ang dalawa<br>at giniba sa Kanyang laman ang pader ng alitan na naghihiwalay.\"", "verseRef": "Efeso 2:14", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Nang Mawala ang Kaaway sa Labas, Naging Kaaway ang mga Kapatid", "paragraphs": ["Sa nakaraang bahagi, nanalo si Jefte sa digmaan laban sa Ammon ngunit nawala ang kanyang nag-iisang anak na babae dahil sa isang di-kailangang panata. Nagwagi siya sa larangan ng digmaan ngunit trahedya ang sinapit sa tahanan. Ngayon, kumalat ang trahedyang iyon lampas sa kanyang tahanan patungo sa buong komunidad ng Israel. Nawala na ang kaaway sa labas, ang Ammon — at ngayon ang mga kapatid sa loob ang naging kaaway.", "Pansinin ito. Sa kabanata 11, nabasa natin, <mark>\"dumating ang Espiritu ni Yahweh kay Jefte\"</mark> at <mark>\"ibinigay sila ni Yahweh sa kanyang kamay.\"</mark> Ngunit sa buong kabanata 12, walang kahit isang eksena ng Diyos na kumikilos. Noon, may pagliligtas ng Diyos; ngayon, digmaang sibil na lamang ng magkakapatid na nagpapatayan."], "points": ["Ang pinakamalaking krisis ng isang komunidad ay hindi lamang kapag lumalakas ang kaaway sa labas — kundi ang sandaling nagsisimulang magmukhang kaaway ang mga kapatid at kapamilya."]}, {"title": "Talata 1–7 · Trahedya sa mga Tawiran ng Jordan", "paragraphs": ["Hinarap ng mga lalaki ng Efraim si Jefte: \"Bakit ka tumawid upang lumaban sa mga Ammonita nang hindi kami tinatawag na sumama sa iyo?\" At idinagdag nila, <mark>\"Susunugin namin ang iyong bahay kasama mo.\"</mark> Hindi ito reklamo — isa itong banta. Sa Mga Hukom 8, ganito rin ang reklamo ng Efraim kay Gideon, ngunit nagpakumbaba si Gideon at pinarangalan ang Efraim, at humupa ang kanilang galit. Si Jefte, na kawawalan lamang ng anak, ay hindi umatras. Nagbanggaan ang pagmamataas, at naging digmaan ito.", "Sinabi ni Jefte, \"ibinigay sila ni Yahweh sa aking kamay.\" Alam niyang ang Diyos ang nagbigay ng tagumpay — ngunit hindi dumaloy ang kaalamang iyon ng pananampalataya sa isang pagkataong kayang yakapin ang kanyang mga kapatid. Lumaki ang alitan tungo sa pang-iinsulto sa buong lipi. Sinakop ng mga taga-Gilead ang mga tawiran ng Jordan at pinasabi sa bawat tumatakas ang <mark>\"Shibolet.\"</mark> Ang sinumang hindi makabigkas nito at nagsabing \"Sibolet\" ay nahayag bilang Efraimita at pinatay. Apatnapu't dalawang libong Efraimita ang namatay.", "Mas nakadudurog pa ng puso ang lugar. Ang mga tawiran ng Jordan ay kung saan hinarang ng Israel ang Moab sa kabanata 3 at ang Midian sa kabanata 7. Ngayon, sa parehong lugar, gamit ang mga taktikang dating ginagamit laban sa kaaway, hinaharang at pinapatay ng Israel ang Israel. At namatay si Jefte matapos mamuno nang anim na taon. Ang pariralang paulit-ulit sa mga naunang hukom — <mark>\"at namahinga ang lupain\"</mark> — ay hindi kailanman lumitaw."], "points": ["Ang pagiging ginamit ng Diyos ay hindi katulad ng pagkakaroon ng hinog na pagkatao. Higit pa sa alitan mismo, ang paraan ng paghawak natin dito ang nagtatakda ng direksyon ng komunidad."]}, {"title": "Talata 8–15 · Sina Ibzan, Elon, Abdon — at ang Paulit-ulit na \"Namatay\"", "paragraphs": ["Tatlo pang hukom ang maikling lumitaw. Si Ibzan ay may tatlumpung anak na lalaki at tatlumpung anak na babae at namuno nang pitong taon — ang kasaganaan ng animnapung anak ay inilagay sa tabi ng kapahamakan ni Jefte, na nawalan ng nag-iisang anak. Si Elon na Zebulunita ay namuno nang sampung taon, na walang naitalang digmaan o dakilang pagliligtas. Si Abdon ay may apatnapung anak na lalaki at tatlumpung apo, na lahat ay nakasakay sa asno — larawan ng kasaganaan, kayamanan, at katatagan.", "Ngunit sa pagbasa ng buong kabanata 12, isang salita ang patuloy na umaalingawngaw: <mark>namatay</mark>. Namatay ang mga Efraimita, namatay si Jefte, namatay si Ibzan, namatay si Elon, namatay si Abdon — tulad ng paulit-ulit na \"at siya'y namatay\" sa Genesis 5. Anim na taon man o sampu, isang anak man o pitumpu, ang wakas ng bawat taong hukom ay kamatayan."], "points": ["Hindi kayang talunin ng kapayapaan at kasaganaan ang kamatayan mismo. Kailangan ng Israel ang isang Tagapagligtas na hindi mamamatay."]}, {"title": "Aplikasyon · Ginagawang Kapatid Muli ang Kapatid, Ginagawang Buhay ang Kamatayan", "paragraphs": ["Maaaring ganito rin ang ating buhay. Masigasig tayong lumalaban sa labas — nagtitiis sa trabaho, nag-aalaga ng tahanan at mga anak, nakikipaglaban sa sariling hamon sa paaralan, nagsisikap na hindi maging pabigat sa mga anak. Ngunit pag-uwi natin, maaaring ang pinakamalalapit sa atin ang naging pinakamahirap pakitunguhan. At sa iglesia, maaaring maayos ang takbo ng ministeryo habang tinitingnan natin ang isa't isa bilang karibal o kaaway, ginugugol ang lakas sa pag-aaway sa isa't isa.", "Kung gayon, hindi mas malaking tagumpay ang kailangan natin — kailangan natin muli ang ebanghelyo. Sa krus, hindi pinatay ni Jesus ang Kanyang mga kapatid; ibinigay Niya ang sarili Niyang buhay. <mark>\"Siya mismo ang ating kapayapaan, na ginawang isa ang dalawa... pinagkasundo tayo sa Diyos sa pamamagitan ng krus, at pinatay ang alitan\"</mark> (Efeso 2). Noong panahon ni Jefte, naging kaaway ang magkakapatid; ginagawang magkakapatid muli ng krus ni Jesus ang magkakaaway.", "At namatay si Jesus — ngunit hindi nagtapos sa kamatayan ang Kanyang kwento. Muli Siyang nabuhay, ginawang kwento ng buhay ang kwento ng kamatayan. Ang pagiging matatag sa labas, na may iglesiang tumatakbo at pamilyang buo, ay hindi nangangahulugang buhay sa espiritu. May buhay lamang sa atin kapag ang halaga ng krus ang namamahala sa ating mga relasyon at ang pag-asa ng muling pagkabuhay ang nagpapakilos sa ating buhay."], "points": ["Kung saan naroon ang ebanghelyo, nagiging magkakapatid muli ang magkakapatid, at nagsisimula muli ang buhay kung saan dating naroon ang kamatayan."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung, habang ibinibigay ko ang aking pinakamahusay sa labas, naging pinakamahirap na tao na ako para sa sarili kong pamilya."}, {"key": "c2", "text": "Sinuri ko kung tinitingnan ko ang isang tao sa iglesia o grupo bilang karibal o kaaway sa halip na kapatid."}, {"key": "c3", "text": "Pinag-isipan ko kung, sa alitan, inuuna ko ang aking pagmamataas tulad ni Jefte sa halip na magpakumbaba tulad ni Gideon."}, {"key": "c4", "text": "Sinuri ko kung ang ebanghelyo ng krus at muling pagkabuhay ay tunay na buhay sa akin — hindi lamang buhay na mukhang buo sa labas."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "May relasyon ba sa iyong tahanan o komunidad kung saan parang kaaway ang isang kapatid ngayon? Paano ka tinatawag ng krus na baguhin ang relasyong iyon?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Magpakumbaba Muna", "value": "Tulad ni Gideon, magsabi ng isang salitang kumikilala muna sa kabila sa taong kaalitan mo"}, {"key": "act2", "label": "Makipagpayapaan Muna sa Tahanan", "value": "Magsabi muna ng 'salamat' o 'patawad' sa isang kapamilya ngayon"}, {"key": "act3", "label": "Mula Karibal Tungo sa Kapatid", "value": "Ipanalangin ngayon sa pangalan ang isang tao sa iglesia o grupo na naramdaman mong karibal"}, {"key": "act4", "label": "Itigil ang Matatalas na Salita", "value": "Sadyang pigilan ngayon ang mga salitang nagtatatak o nang-iinsulto sa iba"}, {"key": "act5", "label": "Kapitan ang Pag-asa ng Muling Pagkabuhay", "value": "Dalhin sa muling nabuhay na si Jesus sa panalangin ang isang nakakapagod at natigil na problema, at ilagak sa Kanya ang pag-asa"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Jesus, salamat sa hindi Mo pagpatay sa Iyong mga kapatid kundi pagbibigay ng sarili Mong buhay, na ginawang isa muli kaming dating magkakaaway."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa aking mga salita at saloobing tumutok ng espada sa aking pinakamalapit na pamilya at mga kapatid, habang masigasig akong lumalaban sa labas."}, {"key": "p3", "tag": "Kahilingan", "text": "Hayaang ang halaga ng krus ang mamahala sa aking mga relasyon, at ang pag-asa ng muling pagkabuhay ang muling magbigay-buhay sa aking buhay, pamilya, at iglesia."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-09-16';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
