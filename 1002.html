<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>만나 큐티</title>
<meta property="og:title" content="10/2(금) 큐티 · 사사기 16:1–14">

<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "10월 2일 금요일", "ref": "사사기 16장 1–14절", "headline": "\"나는 괜찮다\"는 생각이<br>가장 위험할 때", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 사사기 16:1-14", "s1heading": "오늘의 말씀", "verse": "\"시험에 들지 않게 깨어 기도하라<br>마음에는 원이로되 육신이 약하도다\"", "verseRef": "마태복음 26:41", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 은혜가 당연해질 때", "paragraphs": ["앞선 15장에서 삼손은 턱뼈 하나로 블레셋을 크게 무찔렀지만, 정작 심한 갈증 앞에서는 아무것도 할 수 없었습니다. 그는 처음으로 하나님께 부르짖었고, 하나님이 물을 내어 다시 살리셨습니다. 아무리 강한 사람도 하나님 없이는 살 수 없다는 사실을 배운 순간이었습니다. 그런데 16장에서 삼손은 안타깝게도 이전 모습으로 돌아갑니다. 14–15장에서 반복되던 <mark>\"여호와의 영이 삼손에게 강하게 임하니\"</mark>라는 표현이, 오늘 본문에는 한 번도 나오지 않습니다.", "오늘 본문의 핵심을 단순히 \"들릴라 같은 유혹을 조심하라\"로만 잡으면 충분하지 않습니다. 정말 놀라운 것은 삼손입니다. 들릴라는 거의 대놓고 \"어떻게 하면 당신을 묶어 제압할 수 있느냐\"고 묻고, 실제로 묶고, 세 번이나 \"블레셋 사람들이 당신에게 들이닥쳤다\"고 외칩니다. 그런데도 삼손은 그 자리를 떠나지 않습니다. 그의 문제는 위험을 볼 기회가 없었던 것이 아니라, <mark>위험을 보면서도 위험으로 받아들이지 않았다</mark>는 것이었습니다.", "14장에서 삼손은 비밀을 가진 사람이었습니다. 사자를 죽인 일, 꿀의 출처, 수수께끼의 답을 숨겼고, 그 비밀은 남보다 우위에 서는 힘이었습니다. 그런데 16장에서는 상황이 뒤집혀 <mark>삼손 자신이 수수께끼</mark>가 됩니다. \"이 사람의 힘은 어디서 나오는가?\" 비밀이 그의 힘이었다면, 이제 바로 그 비밀이 그의 약점이 되어 갑니다."], "points": ["하나님의 은혜를 오래 경험하다 보면, 은혜가 은혜로 느껴지지 않고 원래 내 것이었던 것처럼 착각할 수 있습니다."]}, {"title": "1–3절 · 가사의 성문을 뽑았지만", "paragraphs": ["16장은 14장과 아주 비슷하게 시작합니다. 14장에서 딤나로 내려가 한 여자를 보았듯, 이번에는 블레셋 땅 가사에 가서 한 기생을 봅니다. <mark>다시 눈으로 보고, 욕망을 품고, 행동하는</mark> 패턴입니다. 15장에서 자신의 한계를 경험하고 하나님께 부르짖었지만, 한 번의 영적 경험이 오래된 약점을 없애지는 않았습니다.", "가사 사람들은 밤새 성문에 매복하며 아침에 그를 죽이려 합니다. 그러나 삼손은 한밤중에 일어나 <mark>성 문짝과 두 문설주와 빗장까지 통째로 뽑아 어깨에 메고</mark> 헤브론 앞산 꼭대기까지 올라갑니다. 고대 도시의 성문은 방어와 안전의 상징이었으니, 블레셋에게는 엄청난 수치였습니다.", "그런데 여기에는 의미 있는 침묵이 있습니다. 사자를 찢을 때도, 아스글론에서 싸울 때도, 밧줄을 끊을 때도 \"여호와의 영이 임했다\"고 기록했지만, 가사의 성문을 뽑을 때는 그 설명이 빠져 있습니다. 그의 힘이 하나님과 무관했다는 뜻은 아닙니다. 그러나 16장은 묻습니다. 삼손은 하나님께 받은 능력을 얼마나 당연하게 여기고 있었는가?"], "points": ["한 번의 영적 승리가 반복되는 약점을 자동으로 없애 주지 않습니다. 어제 하나님이 나를 건져 주셨다는 사실이, 오늘 내가 위험을 선택해도 된다는 허락은 아닙니다."]}, {"title": "4–5절 · 사랑으로 위장된 배신 계약", "paragraphs": ["드디어 들릴라가 등장합니다. <mark>\"삼손이 소렉 골짜기의 들릴라라 이름하는 여인을 사랑하매\"</mark>. 딤나의 여인은 '보았고', 가사의 기생도 '보았지만', 들릴라는 '사랑했다'고 기록합니다. 삼손 이야기에서 그가 한 여인을 사랑했다고 직접 표현한 것은 처음입니다. 그만큼 마음이 더 깊이 들어갔습니다. 그런데 본문은 들릴라도 삼손을 사랑했다고 말하지 않습니다. 내가 누군가를 사랑한다는 것과 그 사람이 신뢰할 만하다는 것은 같지 않습니다.", "블레셋 방백들은 전략을 바꿉니다. 힘으로는 삼손을 이길 수 없다는 것을 알기에, 정면 대신 들릴라에게 접근합니다. 그의 큰 힘이 어디서 나오는지 알아내 결박하라며, 각각 <mark>은 천백 개</mark>씩을 주겠다고 약속합니다. 딤나의 아내는 협박을 받아 움직였지만, 들릴라는 돈을 받고 적극적으로 협력합니다. 블레셋은 삼손의 가장 강한 곳을 공격하지 않고, 가장 약한 곳으로 들어갑니다."], "points": ["감정이 강하다는 것이 관계가 안전하다는 증거는 아닙니다. 사람의 가장 큰 약점은 때로 자신이 가장 강하다고 생각하는 곳에 숨어 있습니다."]}, {"title": "6–14절 · 세 번의 시험, 경계선 가까이로", "paragraphs": ["들릴라는 묻습니다. <mark>\"당신의 큰 힘이 무엇으로 말미암아 생기며, 어떻게 하면 능히 당신을 결박하여 굴복하게 할 수 있을는지 내게 말하라\"</mark>. \"왜 그렇게 강하냐\"가 아니라 \"어떻게 해야 당신을 묶어 제압하느냐\"는, 매우 직접적인 질문입니다. 그런데도 삼손은 떠나지 않습니다. 위험에서 도망치지 않고, 위험과 게임을 시작합니다.", "첫째, 삼손은 \"마르지 않은 새 활줄 일곱으로 묶으면 약해진다\"고 말합니다. 들릴라는 정말로 묶고 외칩니다. \"삼손이여, 블레셋 사람들이 당신에게 들이닥쳤느니라!\" 삼손은 줄을 쉽게 끊고, <mark>\"그의 힘의 근원은 알아내지 못하니라\"</mark>. 둘째, \"새 밧줄로 묶으면 된다\"고 합니다. 그러나 15장에서 유다 사람들이 새 밧줄로 묶었을 때 쉽게 끊어졌던 것을 그 자신이 이미 압니다. 또 묶이고, 또 빠져나옵니다. 이런 일이 반복되면 무서운 생각이 생깁니다. \"봐, 이번에도 괜찮잖아.\"", "셋째가 가장 중요합니다. <mark>\"나의 머리털 일곱 가닥을 베틀의 날실에 섞어 짜면\"</mark>. 처음으로 머리카락이 등장합니다. 줄에서 밧줄로, 이제 머리카락으로 — 진짜 비밀에 점점 가까워집니다. 머리카락 자체가 마법의 근원은 아니지만, 그것은 삼손이 태중에서부터 하나님께 구별된 나실인이라는 표지였습니다. 이제 삼손은 자신의 구별됨과 연결된 그 머리카락마저 게임 안으로 끌어들입니다. 아직 무너지지는 않았습니다. 하지만 이미 무너짐의 문 바로 앞까지 와 있었습니다."], "points": ["죄는 대개 \"오늘 완전히 무너지자\"로 시작하지 않습니다. \"여기까지만, 이 정도는 괜찮아\"하며 경계를 조금씩 옮깁니다. 반복해서 빠져나왔다는 것이 그 위험이 안전하다는 증거는 아닙니다."]}, {"title": "적용 · 강함을 증명하지 말고, 깨어 기도하라", "paragraphs": ["겉으로 보면 삼손은 계속 승리합니다. 성문을 뽑았고, 첫 번째 결박도, 두 번째도, 세 번째도 빠져나옵니다. 그러나 본문을 아는 우리는 압니다. 그는 승리하고 있는 것이 아니라, 무너짐을 향해 조금씩 다가가고 있습니다. 모든 일이 잘된다고 해서 바른 방향으로 가고 있다는 뜻은 아닙니다. 능력이 나타난다고 성숙한 것도 아니고, 아직 문제가 터지지 않았다고 안전한 것도 아닙니다.", "그래서 예수님은 제자들에게 말씀하셨습니다. <mark>\"시험에 들지 않게 깨어 기도하라. 마음에는 원이로되 육신이 약하도다\"</mark>. 예수님은 우리에게 얼마나 강한지 증명하라고 하지 않으셨습니다. 인간은 자신의 약함보다 자신의 강함을 믿을 때 더 위험할 수 있기 때문입니다. 내가 계속 \"이 정도는 괜찮다\"고 말하는 영역은 무엇입니까? 반복해서 빠져나왔기에 안전하다고 착각하는 장소, 관계, 습관, 욕망이 있습니까? 경계선에 얼마나 가까이 갈 수 있는지 시험하지 마십시오. 지금 멈추십시오."], "points": ["믿음은 내가 얼마나 강한지 증명하는 삶이 아니라, 내가 하나님 없이는 살 수 없는 존재임을 알고 그분 가까이 머무는 삶입니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "'이 정도는 괜찮다'며 계속 가까이 가고 있는 경계선(장소·관계·습관·욕망)이 없는지 돌아봤다"}, {"key": "c2", "text": "하나님께 받은 능력이나 은혜를 원래 내 것처럼 당연하게 여기고 있지는 않은지 점검했다"}, {"key": "c3", "text": "내가 '이 부분만큼은 자신 있다'고 생각하는 곳이 오히려 가장 약한 곳은 아닌지 돌아봤다"}, {"key": "c4", "text": "반복해서 별일 없었다는 이유로 위험을 위험으로 느끼지 못하고 있지는 않은지 점검했다"}], "s4heading": "묵상 한 줄", "memoHint": "지금 내가 '이번에도 괜찮잖아'라고 말하며 머물고 있는 자리는 어디입니까? 오늘 그 자리에서 어떻게 떠나시겠습니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "경계선에서 물러서기", "value": "'이 정도는 괜찮다'던 습관이나 자리 하나를 오늘 구체적으로 끊거나 멀리하기"}, {"key": "act2", "label": "깨어 기도하기", "value": "하루 중 정해진 한 시간에 '시험에 들지 않게 해 주소서'라고 짧게라도 기도하기"}, {"key": "act3", "label": "강점 속 약점 점검", "value": "내가 가장 자신 있는 영역에서 숨은 위험이 무엇인지 하나 적어보기"}, {"key": "act4", "label": "은혜를 은혜로 고백하기", "value": "당연하게 여겼던 능력이나 환경 하나를 하나님께서 주신 은혜로 감사 고백하기"}, {"key": "act5", "label": "믿을 만한 사람에게 나누기", "value": "반복해서 넘어지는 영역을 신뢰할 만한 신앙의 동역자에게 정직하게 나누고 기도 부탁하기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "제가 넘어질 뻔한 자리에서 여러 번 건져 주신 은혜, 그리고 오늘도 저를 포기하지 않으시는 하나님께 감사합니다"}, {"key": "p2", "tag": "회개", "text": "반복해서 빠져나왔다는 이유로 '나는 괜찮다'며 경계선 가까이 머물렀던 저의 교만과 무감각을 회개합니다"}, {"key": "p3", "tag": "간구", "text": "제 강함을 증명하려 하지 않고, 하나님 없이는 살 수 없음을 알고 날마다 깨어 기도하며 주님 가까이 머물게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "October 2, Friday", "ref": "Judges 16:1–14", "headline": "When \"I'm Fine\"<br>Is the Most Dangerous Thought", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · Judges 16:1-14", "s1heading": "Today's Word", "verse": "\"Watch and pray that you may not enter into temptation.<br>The spirit indeed is willing, but the flesh is weak.\"", "verseRef": "Matthew 26:41", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · When Grace Becomes Taken for Granted", "paragraphs": ["In chapter 15, Samson crushed the Philistines with a single jawbone, yet was helpless before severe thirst. For the first time he cried out to God, and God brought out water and revived him. It was a moment that taught him that even the strongest person cannot live without God. But sadly, in chapter 16 Samson slips back into his old ways. The phrase repeated in chapters 14–15 — <mark>\"the Spirit of the LORD rushed upon Samson\"</mark> — doesn't appear even once in today's passage.", "If we reduce today's passage to \"beware of temptations like Delilah,\" we miss too much. What's truly astonishing is Samson. Delilah asks almost openly, \"How can you be bound and subdued?\" She actually binds him, and three times cries, \"The Philistines are upon you!\" Yet Samson doesn't leave. His problem wasn't that he had no chance to see the danger — it was that <mark>he saw the danger but didn't take it as danger</mark>.", "In chapter 14, Samson was the man with secrets — killing the lion, the source of the honey, the answer to the riddle — and those secrets gave him the upper hand. In chapter 16 the tables turn: <mark>Samson himself becomes the riddle</mark>. \"Where does this man's strength come from?\" If secrets were once his strength, now that very secret is becoming his weakness."], "points": ["When we experience God's grace for a long time, grace can stop feeling like grace, and we can mistake it for something that was always ours."]}, {"title": "Verses 1–3 · He Pulled Up Gaza's Gates — But", "paragraphs": ["Chapter 16 begins much like chapter 14. Just as he went down to Timnah and saw a woman, now he goes to Gaza in Philistine territory and sees a prostitute. It's the same pattern: <mark>see with the eyes, desire, act</mark>. In chapter 15 he experienced his limits and cried out to God — but one spiritual experience didn't erase an old weakness.", "The men of Gaza lie in wait at the city gate all night, planning to kill him at dawn. But Samson rises at midnight, <mark>pulls up the doors of the city gate, the two posts, and the bar, puts them on his shoulders</mark>, and carries them to the top of the hill facing Hebron. City gates in the ancient world symbolized defense and security — this was an enormous humiliation for the Philistines.", "But there's a meaningful silence here. When he tore the lion, fought at Ashkelon, and broke the ropes, Scripture said, \"the Spirit of the LORD came upon him.\" When he pulls up Gaza's gates, that explanation is missing. That doesn't mean his strength had nothing to do with God. But chapter 16 asks: how much was Samson taking the power God gave him for granted?"], "points": ["One spiritual victory doesn't automatically remove a recurring weakness. The fact that God rescued me yesterday is not permission to choose danger today."]}, {"title": "Verses 4–5 · A Betrayal Contract Disguised as Love", "paragraphs": ["At last Delilah appears: <mark>\"Samson loved a woman in the Valley of Sorek, whose name was Delilah.\"</mark> The woman of Timnah he 'saw'; the prostitute of Gaza he 'saw' — but Delilah he 'loved.' It's the first time Samson's story says directly that he loved a woman. His heart went in much deeper this time. But the text never says Delilah loved Samson. Loving someone is not the same as that person being trustworthy.", "The Philistine lords change strategy. Knowing they can't beat Samson by force, they approach Delilah instead of facing him head-on. Find out where his great strength comes from so we can bind him, they say — and each promises her <mark>eleven hundred pieces of silver</mark>. The wife at Timnah acted under threat, but Delilah takes money and cooperates eagerly. The Philistines don't attack Samson's strongest point; they go in through his weakest."], "points": ["Strong feelings aren't proof that a relationship is safe. Sometimes a person's greatest weakness hides right where they think they're strongest."]}, {"title": "Verses 6–14 · Three Tests, Ever Closer to the Line", "paragraphs": ["Delilah asks, <mark>\"Please tell me where your great strength lies, and how you might be bound, that one could subdue you.\"</mark> Not \"why are you so strong?\" but \"how can you be bound and overpowered?\" — an extremely direct question. Yet Samson doesn't leave. Instead of fleeing the danger, he starts a game with it.", "First, Samson says, \"If they bind me with seven fresh bowstrings that have not been dried, I'll become weak.\" Delilah actually binds him and cries, \"The Philistines are upon you, Samson!\" He snaps the strings easily — <mark>\"so the secret of his strength was not known.\"</mark> Second, he says, \"Bind me with new ropes.\" But he himself already knew from chapter 15 that new ropes snapped easily when the men of Judah used them. Bound again; escaped again. When this keeps happening, a frightening thought takes root: \"See? I'm fine this time too.\"", "The third is the most important: <mark>\"If you weave the seven locks of my head with the web.\"</mark> For the first time, his hair comes into it. From bowstrings to ropes, and now to his hair — he's getting closer and closer to the real secret. His hair itself wasn't a magic source, but it was the sign that Samson had been set apart to God as a Nazirite from the womb. Now he drags even the hair tied to his consecration into the game. He hasn't fallen yet. But he's already standing right at the door of collapse."], "points": ["Sin usually doesn't begin with \"Let's completely fall today.\" It moves the boundary little by little: \"Just this far — this much is fine.\" Escaping again and again is no proof that the danger is safe."]}, {"title": "Application · Don't Prove Your Strength — Watch and Pray", "paragraphs": ["On the surface, Samson keeps winning. He pulled up the gates, escaped the first binding, the second, and the third. But we who know the story know better: he isn't winning — he's edging closer and closer to collapse. Things going well doesn't mean we're heading in the right direction. Power appearing doesn't mean maturity, and the fact that nothing has blown up yet doesn't mean we're safe.", "That's why Jesus told His disciples, <mark>\"Watch and pray that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.\"</mark> Jesus never told us to prove how strong we are. People can be in more danger when they trust their strength than when they know their weakness. In what area do you keep saying \"this much is fine\"? Is there a place, relationship, habit, or desire you think is safe just because you've escaped it again and again? Don't test how close you can get to the line. Stop now."], "points": ["Faith is not a life of proving how strong I am, but a life of knowing I cannot live without God — and staying close to Him."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether there's a boundary line (a place, relationship, habit, or desire) I keep edging toward, saying 'this much is fine.'"}, {"key": "c2", "text": "I checked whether I'm taking the power or grace God gave me for granted, as if it were simply mine."}, {"key": "c3", "text": "I reflected on whether the area where I think 'I'm confident here' might actually be my weakest point."}, {"key": "c4", "text": "I checked whether, because nothing bad has happened so far, I've stopped recognizing danger as danger."}], "s4heading": "One-Line Reflection", "memoHint": "Where am I lingering right now, telling myself 'See, I'm fine this time too'? How will I leave that place today?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Step Back from the Line", "value": "Concretely cut off or distance yourself today from one habit or place you called 'fine'"}, {"key": "act2", "label": "Watch and Pray", "value": "At a set time today, pray even briefly: 'Keep me from entering into temptation'"}, {"key": "act3", "label": "Find the Weakness in Your Strength", "value": "Write down one hidden danger in the area where you feel most confident"}, {"key": "act4", "label": "Confess Grace as Grace", "value": "Thank God for one ability or circumstance you've taken for granted, confessing it as His grace"}, {"key": "act5", "label": "Share with Someone Trustworthy", "value": "Honestly share an area where you keep falling with a trusted fellow believer and ask for prayer"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "God, thank You for the grace that rescued me many times from places where I nearly fell, and for not giving up on me even today."}, {"key": "p2", "tag": "Repent", "text": "I repent of the pride and numbness that kept me lingering near the line, saying 'I'm fine' just because I'd escaped before."}, {"key": "p3", "tag": "Ask", "text": "Keep me from trying to prove my strength. Help me know I cannot live without You, and stay close to You, watching and praying every day."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Oktubre 2, Biyernes", "ref": "Mga Hukom 16:1–14", "headline": "Kapag ang \"Okay Lang Ako\"<br>ang Pinakamapanganib na Isipin", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Mga Hukom 16:1-14", "s1heading": "Salita Ngayon", "verse": "\"Magbantay kayo at manalangin upang hindi kayo matukso.<br>Handa ang espiritu, ngunit mahina ang laman.\"", "verseRef": "Mateo 26:41", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Kapag Naging Karaniwan na Lamang ang Biyaya", "paragraphs": ["Sa kabanata 15, dinurog ni Samson ang mga Filisteo gamit ang iisang panga, ngunit wala siyang nagawa sa harap ng matinding uhaw. Sa unang pagkakataon, dumaing siya sa Diyos, at nagpalabas ang Diyos ng tubig at binuhay siyang muli. Isang sandaling nagturo sa kanya na kahit ang pinakamalakas na tao ay hindi mabubuhay nang walang Diyos. Ngunit nakalulungkot, sa kabanata 16 bumalik si Samson sa dati niyang gawi. Ang pariralang paulit-ulit sa kabanata 14–15 — <mark>\"dumaluhong kay Samson ang Espiritu ni Yahweh\"</mark> — ay hindi man lamang lumitaw sa binasa natin ngayon.", "Kung gagawin lamang nating \"mag-ingat sa mga tukso tulad ni Delila\" ang binasa natin ngayon, marami tayong hindi makikita. Ang tunay na kamangha-mangha ay si Samson. Halos lantarang nagtanong si Delila, \"Paano ka maigagapos at masusupil?\" Talagang ginapos niya ito, at tatlong beses na sumigaw, \"Narito na sa iyo ang mga Filisteo!\" Ngunit hindi umalis si Samson. Ang kanyang problema ay hindi dahil wala siyang pagkakataong makita ang panganib — kundi <mark>nakita niya ang panganib ngunit hindi niya ito itinuring na panganib</mark>.", "Sa kabanata 14, si Samson ang taong may mga lihim — ang pagpatay sa leon, ang pinagmulan ng pulot, ang sagot sa bugtong — at ang mga lihim na iyon ang nagbigay sa kanya ng kalamangan. Sa kabanata 16, bumaligtad ang sitwasyon: <mark>si Samson mismo ang naging bugtong</mark>. \"Saan nanggagaling ang lakas ng taong ito?\" Kung ang mga lihim ang dati niyang lakas, ngayon ang mismong lihim na iyon ang nagiging kanyang kahinaan."], "points": ["Kapag matagal nating nararanasan ang biyaya ng Diyos, maaaring hindi na ito maramdaman bilang biyaya, at mapagkamalan nating dati na nating pag-aari."]}, {"title": "Talata 1–3 · Binunot Niya ang mga Pintuan ng Gaza — Ngunit", "paragraphs": ["Nagsimula ang kabanata 16 na halos katulad ng kabanata 14. Kung paanong bumaba siya sa Timna at nakakita ng isang babae, ngayon pumunta siya sa Gaza sa lupain ng Filisteo at nakakita ng isang babaeng bayaran. Parehong padron: <mark>nakita ng mata, ninasa, kumilos</mark>. Sa kabanata 15, naranasan niya ang kanyang hangganan at dumaing sa Diyos — ngunit hindi napawi ng isang espirituwal na karanasan ang lumang kahinaan.", "Nag-abang ang mga taga-Gaza buong gabi sa pintuan ng lungsod, binabalak siyang patayin pagsikat ng araw. Ngunit bumangon si Samson sa hatinggabi, <mark>binunot ang mga pinto ng pintuan ng lungsod, ang dalawang haligi, at ang trangka, ipinasan sa kanyang balikat</mark>, at dinala sa tuktok ng burol sa tapat ng Hebron. Sa sinaunang mundo, sumasagisag ang mga pintuan ng lungsod sa depensa at kaligtasan — isang napakalaking kahihiyan ito para sa mga Filisteo.", "Ngunit may makabuluhang katahimikan dito. Nang punitin niya ang leon, lumaban sa Ashkelon, at putulin ang mga lubid, sinabi ng Kasulatan, \"dumating sa kanya ang Espiritu ni Yahweh.\" Nang bunutin niya ang mga pintuan ng Gaza, wala ang paliwanag na iyon. Hindi ibig sabihing walang kinalaman sa Diyos ang kanyang lakas. Ngunit nagtatanong ang kabanata 16: gaano binabalewala ni Samson ang kapangyarihang ibinigay sa kanya ng Diyos?"], "points": ["Hindi kusang inaalis ng isang espirituwal na tagumpay ang paulit-ulit na kahinaan. Ang katotohanang iniligtas ako ng Diyos kahapon ay hindi pahintulot na piliin ang panganib ngayon."]}, {"title": "Talata 4–5 · Isang Kasunduan ng Pagtataksil na Nagkukunwaring Pag-ibig", "paragraphs": ["Sa wakas, lumitaw si Delila: <mark>\"Inibig ni Samson ang isang babae sa Lambak ng Sorek na nagngangalang Delila.\"</mark> Ang babae sa Timna ay kanyang 'nakita'; ang babaeng bayaran sa Gaza ay kanyang 'nakita' — ngunit si Delila ay kanyang 'inibig.' Ito ang unang pagkakataon na direktang sinabi ng kwento ni Samson na umibig siya sa isang babae. Mas lumalim ang kanyang puso ngayon. Ngunit hindi kailanman sinabi ng teksto na inibig ni Delila si Samson. Ang pag-ibig sa isang tao ay hindi katulad ng pagiging mapagkakatiwalaan ng taong iyon.", "Binago ng mga pinuno ng Filisteo ang kanilang taktika. Dahil alam nilang hindi nila matatalo si Samson sa lakas, nilapitan nila si Delila sa halip na harapin siya nang tuwiran. Alamin kung saan nanggagaling ang kanyang malaking lakas upang maigapos namin siya, sabi nila — at bawat isa ay nangakong magbibigay sa kanya ng <mark>isang libo't isang daang pirasong pilak</mark>. Kumilos ang asawa sa Timna dahil sa banta, ngunit tumanggap ng pera si Delila at masigasig na nakipagtulungan. Hindi sinalakay ng mga Filisteo ang pinakamalakas na bahagi ni Samson; pumasok sila sa pinakamahina."], "points": ["Ang matinding damdamin ay hindi patunay na ligtas ang isang relasyon. Kung minsan, ang pinakamalaking kahinaan ng tao ay nagtatago mismo kung saan niya iniisip na siya'y pinakamalakas."]}, {"title": "Talata 6–14 · Tatlong Pagsubok, Palapit Nang Palapit sa Hangganan", "paragraphs": ["Nagtanong si Delila, <mark>\"Pakisabi sa akin kung saan nanggagaling ang iyong malaking lakas, at kung paano ka maigagapos upang ikaw ay masupil.\"</mark> Hindi \"bakit ka napakalakas?\" kundi \"paano ka maigagapos at matatalo?\" — isang napakatuwirang tanong. Ngunit hindi umalis si Samson. Sa halip na tumakas sa panganib, nagsimula siya ng laro kasama nito.", "Una, sinabi ni Samson, \"Kung gagapusin nila ako ng pitong sariwang bagting ng pana na hindi pa natutuyo, hihina ako.\" Talagang ginapos siya ni Delila at sumigaw, \"Narito na sa iyo ang mga Filisteo, Samson!\" Madali niyang pinatid ang mga bagting — <mark>\"kaya't hindi nalaman ang lihim ng kanyang lakas.\"</mark> Ikalawa, sinabi niya, \"Igapos ninyo ako ng mga bagong lubid.\" Ngunit alam na niya mula sa kabanata 15 na madaling napatid ang mga bagong lubid nang gamitin ito ng mga taga-Juda. Muling ginapos; muling nakatakas. Kapag paulit-ulit ito, may nakatatakot na isip na umuugat: \"Kita mo? Okay lang ako ngayon din.\"", "Ang ikatlo ang pinakamahalaga: <mark>\"Kung hahabihin mo ang pitong tirintas ng aking buhok sa habihan.\"</mark> Sa unang pagkakataon, nasama ang kanyang buhok. Mula bagting ng pana tungo sa lubid, at ngayon sa kanyang buhok — palapit nang palapit siya sa tunay na lihim. Hindi mahiwagang pinagmumulan ang buhok mismo, ngunit ito ang tanda na itinalaga si Samson sa Diyos bilang Nazareo mula sa sinapupunan. Ngayon, kinaladkad niya pati ang buhok na nakatali sa kanyang pagkakatalaga sa laro. Hindi pa siya bumabagsak. Ngunit nakatayo na siya mismo sa pintuan ng pagbagsak."], "points": ["Karaniwang hindi nagsisimula ang kasalanan sa \"Bumagsak na tayo nang lubusan ngayon.\" Unti-unti nitong inililipat ang hangganan: \"Hanggang dito lang — okay lang ito.\" Ang paulit-ulit na pagtakas ay hindi patunay na ligtas ang panganib."]}, {"title": "Aplikasyon · Huwag Patunayan ang Iyong Lakas — Magbantay at Manalangin", "paragraphs": ["Sa panlabas, patuloy na nagwawagi si Samson. Binunot niya ang mga pintuan, nakatakas sa unang pagkakagapos, sa ikalawa, at sa ikatlo. Ngunit tayong nakaaalam ng kwento ay mas nakaaalam: hindi siya nagwawagi — palapit siya nang palapit sa pagbagsak. Ang pagiging maayos ng lahat ay hindi nangangahulugang tama ang ating direksyon. Ang paglitaw ng kapangyarihan ay hindi nangangahulugang hinog na, at ang katotohanang wala pang sumasabog ay hindi nangangahulugang ligtas tayo.", "Kaya sinabi ni Jesus sa Kanyang mga alagad, <mark>\"Magbantay kayo at manalangin upang hindi kayo matukso. Handa ang espiritu, ngunit mahina ang laman.\"</mark> Hindi tayo kailanman sinabihan ni Jesus na patunayan kung gaano tayo kalakas. Maaaring mas nasa panganib ang tao kapag nagtitiwala siya sa kanyang lakas kaysa kapag alam niya ang kanyang kahinaan. Sa anong bahagi ka patuloy na nagsasabing \"okay lang ito\"? May lugar ba, relasyon, ugali, o pagnanasa na inaakala mong ligtas dahil paulit-ulit kang nakatakas? Huwag subukin kung gaano ka kalapit sa hangganan. Huminto ka na ngayon."], "points": ["Ang pananampalataya ay hindi buhay ng pagpapatunay kung gaano ako kalakas, kundi buhay ng pagkaalam na hindi ako mabubuhay nang walang Diyos — at pananatiling malapit sa Kanya."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung may hangganan (lugar, relasyon, ugali, o pagnanasa) na patuloy kong nilalapitan, sinasabing 'okay lang ito.'"}, {"key": "c2", "text": "Sinuri ko kung binabalewala ko ang kapangyarihan o biyayang ibinigay sa akin ng Diyos, na parang akin lamang ito."}, {"key": "c3", "text": "Pinag-isipan ko kung ang bahaging iniisip kong 'kumpiyansa ako rito' ay maaaring siya mismong pinakamahina kong bahagi."}, {"key": "c4", "text": "Sinuri ko kung, dahil wala pang masamang nangyayari, tumigil na akong kilalanin ang panganib bilang panganib."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Saan ako nananatili ngayon, sinasabi sa sarili ko 'Kita mo, okay lang ako ngayon din'? Paano ako aalis sa lugar na iyon ngayon?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Umatras mula sa Hangganan", "value": "Tiyak na putulin o layuan ngayon ang isang ugali o lugar na tinawag mong 'okay lang'"}, {"key": "act2", "label": "Magbantay at Manalangin", "value": "Sa isang takdang oras ngayon, manalangin kahit sandali: 'Ilayo Mo ako sa tukso'"}, {"key": "act3", "label": "Hanapin ang Kahinaan sa Iyong Lakas", "value": "Isulat ang isang nakatagong panganib sa bahaging pinakakumpiyansa ka"}, {"key": "act4", "label": "Ipahayag ang Biyaya Bilang Biyaya", "value": "Pasalamatan ang Diyos sa isang kakayahan o kalagayang binalewala mo, ipinapahayag itong Kanyang biyaya"}, {"key": "act5", "label": "Ibahagi sa Mapagkakatiwalaang Tao", "value": "Tapat na ibahagi ang bahaging paulit-ulit kang bumabagsak sa isang mapagkakatiwalaang kapwa mananampalataya at humingi ng panalangin"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Diyos, salamat sa biyayang maraming beses akong iniligtas mula sa mga lugar na halos bumagsak ako, at sa hindi Mo pagsuko sa akin kahit ngayon."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa kapalaluan at pagkamanhid na nagpanatili sa akin malapit sa hangganan, sinasabing 'okay lang ako' dahil lamang nakatakas ako dati."}, {"key": "p3", "tag": "Kahilingan", "text": "Ilayo Mo ako sa pagsubok na patunayan ang aking lakas. Tulungan Mo akong malaman na hindi ako mabubuhay nang wala Ka, at manatiling malapit sa Iyo, nagbabantay at nananalangin araw-araw."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};

  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
