  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}

  section{margin-top:2rem}

  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}

  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}

  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}

  #actDetail{display:none;margin-top:.7rem}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "11월 27일 금요일", "ref": "이사야 40장 12–31절", "headline": "문제를 통해 하나님을 보는가,<br>하나님을 통해 문제를 보는가?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 이사야 40:12-31", "s1heading": "오늘의 말씀", "verse": "\"오직 여호와를 앙망하는 자는 새 힘을 얻으리니<br>독수리가 날개치며 올라감 같을 것이요<br>달음박질하여도 곤비하지 아니하겠고 걸어가도 피곤하지 아니하리로다\"", "verseRef": "이사야 40:31", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 내 문제의 크기로 하나님을 제한하고 있지는 않습니까", "paragraphs": ["이사야 40장 전반부는 한 가지 질문에 답했습니다. 죄로 인해 심판받게 된 유다 백성을 하나님께서는 여전히 구원하기 원하시는가? 대답은 '그렇다'입니다. 하나님은 자기 백성을 포기하지 않으시고 먼저 찾아와 위로하시겠다고 말씀하셨습니다. 이제 오늘 본문은 두 가지 질문에 답합니다. <mark>첫째, 하나님은 정말 우리를 구원하실 능력이 있으신가? 둘째, 그렇다면 왜 우리의 고통을 외면하시는 것처럼 보이는가?</mark>", "어린이 예배를 인도하다 보면 무엇을 물어보든 \"예수님!\"이라고 답하는 유치부 아이들을 종종 만납니다. 어쩌면 우리도 그렇지 않을까요? 교회를 오래 다니다 보면 성경에 관한 질문에는 대답을 잘합니다. 그런데 막상 <mark>내 힘으로 해결할 수 없는 문제를 만나면</mark> 달라집니다. '정말 하나님께서 내 형편을 알고 계실까? 왜 이렇게 오랫동안 아무런 변화가 없을까?' 이것은 바벨론 포로라는 절망적인 현실을 마주한 이스라엘의 질문이기도 했습니다.", "하나님은 위로와 구원을 약속하셨지만, 약속을 들었다고 현실이 즉시 달라지지는 않았습니다. 바로 그 현실 가운데 하나님은 백성에게 <mark>눈을 들어 자신이 창조하신 세상을 바라보라</mark>고 말씀하시며 질문하십니다. \"이 모든 것을 창조하고 다스리는 하나님이 어떤 분인지 기억하고 있느냐?\" 나는 하나님을 신뢰하며 내 문제를 바라보고 있습니까? 아니면 <mark>내 문제의 크기와 한계로 하나님을 제한하고</mark> 있습니까?"], "points": ["성경 질문에는 대답을 잘하면서, 정작 내 문제 앞에서는 하나님을 의심하고 있지 않습니까?"]}, {"title": "12–17절 · 비교할 수 없는 창조주 하나님", "paragraphs": ["<mark>\"누가 손바닥으로 바닷물을 헤아렸으며 뼘으로 하늘을 쟀으며 땅의 티끌을 되에 담아 보았으며 접시 저울로 산들을, 막대 저울로 언덕들을 달아 보았으랴\"</mark>(12절). 일상적인 측량의 모습으로 하나님의 위대하심을 설명합니다. 인간에게는 상상하기 어려운 일을 하나님은 손쉽게 다루십니다. 이스라엘에게 바벨론은 감당할 수 없는 거대한 나라였지만, 온 우주를 손안에 두시는 하나님께는 그렇지 않았습니다. <mark>내가 감당할 수 없다고 생각하는 문제가 하나님께도 감당할 수 없는 문제일까요?</mark>", "12절이 하나님의 능력을 강조했다면, 13–14절은 하나님의 지혜를 강조합니다. <mark>\"누가 여호와의 영을 지도하였으며 그의 모사가 되어 그를 가르쳤으랴\"</mark>. 당시 바벨론 신화에서는 신들이 다른 신들의 조언을 받았지만, 이스라엘의 하나님은 누구의 조언도 필요하지 않으십니다. <mark>우리가 하나님의 뜻을 이해하지 못한다는 것과 하나님께서 계획 없이 일하신다는 것은 전혀 다른 이야기입니다.</mark> 하나님은 우리가 이해하지 못하는 상황에서도 무엇이 옳은지 아십니다.", "<mark>\"보라 그에게는 열방이 통의 한 방울 물과 같고 저울의 작은 티끌 같으며\"</mark>(15절). 이스라엘의 생존을 좌우하던 앗수르와 바벨론도 하나님 앞에서는 저울에 영향을 주지 못하는 티끌입니다. 레바논의 모든 나무를 땔감으로, 모든 짐승을 번제로 드려도 하나님께 합당한 제사가 되기에 부족합니다(16절). 이것은 인간에게 가치가 없다는 뜻이 아니라 인간의 모든 능력과 권세가 하나님과 비교될 수 없다는 뜻입니다. 하나님은 포로 문제를 어떻게 해결하실지보다 <mark>그들이 믿는 하나님이 누구인지를 먼저 보여 주십니다</mark>. 믿음은 문제의 크기를 부정하는 것이 아니라 그 문제보다 크신 하나님을 바라보는 것입니다."], "points": ["문제의 크기로 하나님의 능력을 판단하고 있지는 않습니까?"]}, {"title": "18–20절 · 하나님과 비교할 수 없는 사람의 우상", "paragraphs": ["<mark>\"그런즉 너희가 하나님을 누구와 같다 하겠으며 무슨 형상을 그에게 비교하겠느냐\"</mark>(18절). 하나님은 세상을 만드신 창조주이시지만, 우상은 세상에 있는 재료로 사람이 만든 것입니다. 창조주와 피조물은 결코 같은 자리에 놓일 수 없습니다. 19절에서 사람들은 장인을 통해 우상을 만들고 금으로 입히며 은 사슬로 장식합니다. 여기에는 이사야의 날카로운 풍자가 담겨 있습니다. <mark>사람이 만들어야 존재할 수 있는 것이 어떻게 사람을 구원하는 신이 될 수 있겠습니까?</mark>", "20절에서는 썩지 않는 나무를 고르고 지혜로운 장인을 찾아 <mark>우상이 흔들리지 않도록 세우는</mark> 모습이 나옵니다. 참으로 역설적입니다. 사람을 지켜 주어야 할 신을 오히려 사람이 지켜 주고 있기 때문입니다. 하나님은 온 우주를 붙들고 계시지만, 우상은 자기 몸조차 스스로 세우지 못합니다.", "<mark>내가 붙들고 있는 것이 과연 나를 붙들어 줄 수 있는지</mark> 진지하게 돌아봐야 합니다. 오늘날 우리가 의지하는 돈과 지위, 능력과 인간관계가 그 자체로 악한 것은 아닙니다. 그러나 그것들이 내 삶의 안전과 미래를 궁극적으로 보장해 줄 것이라 생각한다면, 우리도 우상을 의지하는 것과 비슷합니다. 19–20절의 우상은 사람의 도움이 필요하지만, 29절의 하나님은 오히려 연약한 사람에게 힘을 주십니다."], "points": ["내가 붙들고 있는 돈, 지위, 관계가 나를 붙들어 줄 것이라 믿고 있지는 않습니까?"]}, {"title": "21–26절 · 하늘과 땅과 역사를 다스리시는 거룩하신 이", "paragraphs": ["<mark>\"너희가 알지 못하였느냐 너희가 듣지 못하였느냐 태초부터 너희에게 전하지 아니하였느냐 땅의 기초가 창조될 때부터 너희가 깨닫지 못하였느냐\"</mark>(21절). 네 가지 질문이 반복됩니다. 이 질문들은 새로운 지식을 주려는 것이 아니라 <mark>이미 알고 있는 하나님을 다시 기억하게</mark> 하려는 것입니다. 이스라엘은 창조의 하나님도, 출애굽의 하나님도 알고 있었습니다. 그러나 현실의 어려움 앞에서 그 지식이 신뢰로 이어지지 못했습니다. 하나님을 안다는 것과 실제로 하나님을 신뢰한다는 것을 구별해야 합니다.", "하나님은 <mark>\"땅 위 궁창에 앉으시나니\"</mark> 하늘을 차일같이 펴시고 천막같이 치십니다(22절). 귀인들을 폐하시며 세상의 사사들을 헛되게 하십니다(23절). 24절은 그들을 겨우 심기고 겨우 뿌리를 박은 식물에 비유합니다. 하나님이 입김을 부시면 말라 회오리바람에 불려 가는 초개 같습니다. 40:6–8의 풀과 꽃의 이미지를 떠올리게 합니다. <mark>아무리 강한 권력도 영원하지 않으며, 바벨론의 권세도 하나님의 통치 밖에 있지 않습니다.</mark>", "25절에서는 18절의 질문이 다시 나오는데, 이번에는 하나님께서 <mark>\"거룩하신 이\"</mark>로서 직접 물으십니다. 하나님의 거룩함은 모든 피조물과 구별되시고 성품과 판단에서 완전하심을 보여 줍니다. 그러므로 하나님을 우리의 제한된 경험과 판단 속에 가두어서는 안 됩니다. <mark>\"너희는 눈을 높이 들어 누가 이 모든 것을 창조하였나 보라 주께서는 수효대로 만상을 이끌어 내시고 그들의 모든 이름을 부르시나니… 하나도 빠짐이 없느니라\"</mark>(26절). 수많은 별의 이름까지 부르시는 하나님이 어떻게 자기 백성의 형편을 모르실 수 있겠습니까? 하나님의 위대하심은 우리의 작은 형편까지 돌보신다는 확신의 근거입니다."], "points": ["별들의 이름까지 부르시는 하나님이 내 형편도 아신다는 사실을 믿고 있습니까?"]}, {"title": "27–31절 · 낙심한 백성에게 새 힘을 주시는 하나님", "paragraphs": ["<mark>\"야곱아 어찌하여 네가 말하며 이스라엘아 네가 이르기를 내 길은 여호와께 숨겨졌으며 내 송사는 내 하나님에게서 벗어난다 하느냐\"</mark>(27절). 지금까지 하나님의 위대하심을 설명한 이유가 드러납니다. 이스라엘은 하나님께서 자기 길을 모르시고, 정당한 송사를 외면하신다고 불평합니다. 이 불평이 이방인이 아니라 <mark>하나님의 백성에게서 나왔다</mark>는 점이 중요합니다. 그들은 하나님을 알았지만 자신들이 겪는 고난을 통해 하나님을 판단하기 시작했습니다. 하나님은 그 고통을 가볍게 여기시는 것이 아니라, 고통 때문에 내린 잘못된 결론을 바로잡으려 하십니다.", "<mark>\"영원하신 하나님 여호와, 땅 끝까지 창조하신 이는 피곤하지 않으시며 곤비하지 않으시며 명철이 한이 없으시며\"</mark>(28절). 하나님의 능력은 시간이 지나도 소진되지 않고, 우리가 이해하는 범위 안에서만 일하시지도 않습니다. 그리고 지치지 않으시는 그 하나님이 <mark>\"피곤한 자에게는 능력을 주시며 무능한 자에게는 힘을 더하시나니\"</mark>(29절). 하나님은 무한하시고 우리는 유한하지만, 그 차이는 절망이 아니라 소망의 이유가 됩니다. 30절의 소년과 장정조차 피곤하고 넘어집니다. <mark>자신의 한계를 인정하는 것은 신앙의 실패가 아닙니다.</mark>", "<mark>\"오직 여호와를 앙망하는 자는 새 힘을 얻으리니 독수리가 날개치며 올라감 같을 것이요 달음박질하여도 곤비하지 아니하겠고 걸어가도 피곤하지 아니하리로다\"</mark>(31절). '앙망하다'의 히브리어 '카바'는 기다리다, 바라다, 소망하다라는 뜻입니다. 아무것도 하지 않고 시간을 보내는 것이 아니라 하나님의 능력과 지혜와 때를 신뢰하며 기다리는 믿음입니다. 특히 마지막에 <mark>'걸어가는' 모습</mark>이 나온다는 데 주목하십시오. 하나님의 힘은 극적인 순간만이 아니라 매일 반복되는 일상 속에서 한 걸음씩 걸어가는 데에도 필요합니다. 하나님의 위로는 기다림을 없애는 것이 아니라 <mark>기다릴 수 있는 힘</mark>을 줍니다."], "points": ["기다림이 즉시 끝나기만 바라기보다, 기다리는 동안 걸어갈 새 힘을 구하고 있습니까?"]}, {"title": "적용 · 문제보다 크신 하나님께 시선을 고정하십시오", "paragraphs": ["마가복음 4장에서 제자들은 예수님과 함께 배를 타고 가다 큰 광풍을 만났습니다. 자기 힘으로 해결할 수 없는 문제였는데, 예수님은 주무시고 계셨습니다. 제자들은 <mark>\"선생님이여 우리가 죽게 된 것을 돌보지 아니하시나이까\"</mark>(막 4:38)라고 묻습니다. 오늘 본문의 이스라엘과 너무나 비슷합니다. 이스라엘에게는 포로 생활이, 제자들에게는 생명을 위협하는 풍랑이 실제로 있었습니다. 그러나 그들은 <mark>자신이 처한 현실을 통해 하나님의 마음을 판단했습니다</mark>.", "예수님은 바람과 바다를 잔잔하게 하신 뒤 \"어찌하여 이렇게 무서워하느냐 너희가 어찌 믿음이 없느냐\"(막 4:40)고 물으셨습니다. <mark>예수님은 풍랑만 다루신 것이 아니라 제자들의 믿음도 다루셨습니다.</mark> 우리가 문제를 해결하지 못하는 것과 하나님께 해결할 능력이 없으신 것은 전혀 다른 이야기입니다. 하나님께서 우리가 원하는 때에 응답하지 않으시는 것과 우리를 사랑하지 않으시는 것도 전혀 다른 이야기입니다.", "예수님도 십자가를 앞두고 겟세마네에서 고통 가운데 기도하셨지만, 자신의 뜻보다 아버지의 뜻에 자신을 맡기셨습니다. 그리고 십자가의 죽음이 끝처럼 보였던 그 자리에서 하나님은 부활을 이루셨습니다. 십자가와 부활은 <mark>우리가 바라보는 현실이 하나님의 능력과 계획의 한계를 결정하지 못한다</mark>는 사실을 보여 줍니다. 예수님은 우리가 넘지 못하는 죽음의 한계를 넘으셨습니다.", "지금 내 힘으로 해결할 수 없는 문제 앞에 있습니까? 그 문제를 외면하거나 무시하라는 것이 아닙니다. 감당해야 할 책임은 성실하게 감당해야 합니다. 그러나 <mark>그 문제의 한계로 하나님까지 제한하지 마십시오</mark>. 하나님은 모든 고난의 이유를 즉시 설명해 주겠다고 하지 않으셨지만, 앙망하는 자에게 새 힘을 주겠다고 약속하셨습니다. 오늘 해결되지 않은 문제 하나를 하나님께 올려드리고, 그 가운데 내가 순종할 수 있는 한 걸음을 용기 있게 걸어가십시오. 믿음의 주요 온전하게 하시는 예수님을 바라보며(히 12:2), 문제보다 크신 하나님께 시선을 고정하시기 바랍니다."], "points": ["오늘 해결되지 않은 문제 하나를 하나님께 올려드리고, 그 가운데 순종할 한 걸음을 걸어가겠습니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "문제의 크기로 하나님의 능력을 판단하지 않고, 문제보다 크신 하나님을 바라보았다"}, {"key": "c2", "text": "돈, 지위, 사람을 궁극적인 안전으로 삼지 않았는지 돌아보았다"}, {"key": "c3", "text": "하나님의 뜻을 다 이해하지 못해도 그분을 신뢰하기로 했다"}, {"key": "c4", "text": "내 한계를 인정하고, 오늘 순종할 수 있는 한 걸음을 걸었다"}], "s4heading": "묵상 한 줄", "memoHint": "나는 지금 하나님을 바라보며 내 문제를 해석하고 있습니까, 아니면 내 문제를 바라보며 하나님을 해석하고 있습니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "문제 올려드리기", "value": "해결되지 않은 문제 하나를 적어 놓고 \"주님은 이 문제보다 크십니다\"라고 기도하기"}, {"key": "act2", "label": "하늘 바라보기", "value": "오늘 밤 잠시 하늘을 올려다보며 별들의 이름을 부르시는 하나님을 묵상하기"}, {"key": "act3", "label": "의지하는 것 점검", "value": "내가 궁극적으로 기대고 있는 것(돈·지위·관계)을 적어 보고 주님께 다시 맡기기"}, {"key": "act4", "label": "한 걸음 순종", "value": "문제 가운데서 오늘 내가 할 수 있는 순종의 한 걸음을 정하고 실천하기"}, {"key": "act5", "label": "말씀 암송", "value": "이사야 40:31을 외우며 기다리는 동안 새 힘을 구하기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "온 우주를 손안에 두시고 별들의 이름까지 부르시면서도, 피곤한 저에게 능력을 주시고 제 형편을 아시는 하나님께 감사드립니다."}, {"key": "p2", "tag": "회개", "text": "제 문제의 크기로 하나님을 제한하고, 돈과 지위와 사람을 궁극적인 안전으로 삼으며, 응답이 늦다고 하나님의 사랑을 의심했던 것을 회개합니다."}, {"key": "p3", "tag": "간구", "text": "주님을 앙망하며 기다릴 수 있는 새 힘을 주시고, 해결되지 않은 문제 가운데서도 오늘 순종할 한 걸음을 걸어가게 해 주십시오."}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "November 27, Friday", "ref": "Isaiah 40:12–31", "headline": "Do I See God Through My Problems,<br>or My Problems Through God?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · Isaiah 40:12-31", "s1heading": "Today's Word", "verse": "\"But they who wait for the LORD shall renew their strength;<br>they shall mount up with wings like eagles;<br>they shall run and not be weary; they shall walk and not faint.\"", "verseRef": "Isaiah 40:31", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · Am I Limiting God by the Size of My Problems?", "paragraphs": ["The first half of Isaiah 40 answered one question: does God still want to save the people of Judah, who were to be judged for their sin? The answer is yes. God would not give up on His people; He would come first and comfort them. Now today's passage answers two questions. <mark>First, does God truly have the power to save us? Second, if so, why does He seem to ignore our suffering?</mark>", "When leading children's worship, I often meet little ones who answer \"Jesus!\" no matter what is asked. Perhaps we are the same. After years of church, we're good at answering Bible questions. But <mark>when we face a problem we cannot solve on our own</mark>, things change: 'Does God really know my situation? Why has nothing changed for so long?' These were also the questions of Israel as they faced the hopeless reality of exile in Babylon.", "God had promised comfort and salvation, but hearing the promise did not immediately change their reality. In the midst of that reality, God tells His people to <mark>lift their eyes and look at the world He created</mark>, and He asks them, \"Do you remember what kind of God created and rules all this?\" Am I looking at my problems while trusting God? Or am I <mark>limiting God by the size and limits of my problems</mark>?"], "points": ["I answer Bible questions well, but am I doubting God when facing my own problems?"]}, {"title": "Verses 12–17 · The Incomparable Creator God", "paragraphs": ["<mark>\"Who has measured the waters in the hollow of his hand and marked off the heavens with a span, enclosed the dust of the earth in a measure and weighed the mountains in scales and the hills in a balance?\"</mark> (v.12). Using images of everyday measuring, the prophet describes God's greatness. What is unimaginable for humans, God handles with ease. To Israel, Babylon was an overwhelming empire, but not to the God who holds the universe in His hand. <mark>Is the problem I think I can't handle a problem God can't handle?</mark>", "If verse 12 emphasizes God's power, verses 13–14 emphasize His wisdom: <mark>\"Who has measured the Spirit of the LORD, or what man shows him his counsel?\"</mark> In Babylonian myths of the time, gods received advice from other gods, but Israel's God needs no one's counsel. <mark>Our not understanding God's will and God working without a plan are two entirely different things.</mark> God knows what is right even in situations we cannot understand.", "<mark>\"Behold, the nations are like a drop from a bucket, and are accounted as the dust on the scales\"</mark> (v.15). Even Assyria and Babylon, which determined Israel's survival, are like dust that doesn't affect the scales before God. Even if all of Lebanon's trees were firewood and all its beasts burnt offerings, it would not be enough for a fitting sacrifice to God (v.16). This doesn't mean humans have no worth; it means all human power and authority cannot compare with God. Rather than first explaining how He'll solve the exile, God <mark>first shows them who the God they believe in is</mark>. Faith is not denying the size of the problem, but looking to the God who is greater than the problem."], "points": ["Am I judging God's power by the size of my problems?"]}, {"title": "Verses 18–20 · Human Idols That Cannot Compare with God", "paragraphs": ["<mark>\"To whom then will you liken God, or what likeness compare with him?\"</mark> (v.18). God is the Creator who made the world, but idols are made by people from materials in the world. Creator and creature can never be placed on the same level. In verse 19, people have a craftsman cast an idol, overlay it with gold, and decorate it with silver chains. Isaiah's sharp satire is clear here: <mark>how can something that exists only if people make it be a god who saves people?</mark>", "In verse 20, someone chooses wood that will not rot and seeks a skillful craftsman to <mark>set up an idol that will not move</mark>. How ironic! The god that should protect people is instead being propped up by people. God holds up the whole universe, but an idol cannot even stand up on its own.", "We must seriously ask <mark>whether what we are holding on to can actually hold us up</mark>. The money, status, abilities, and relationships we rely on today are not evil in themselves. But if we think they will ultimately guarantee the security and future of our lives, we are much like those who trust in idols. The idols of verses 19–20 need human help, but the God of verse 29 gives strength to weak human beings."], "points": ["Do I believe the money, status, or relationships I hold will hold me up?"]}, {"title": "Verses 21–26 · The Holy One Who Rules Heaven, Earth, and History", "paragraphs": ["<mark>\"Do you not know? Do you not hear? Has it not been told you from the beginning? Have you not understood from the foundations of the earth?\"</mark> (v.21). Four questions are repeated. They are not meant to give new knowledge but to <mark>help them remember the God they already know</mark>. Israel knew the God of creation and the God of the exodus. But in the face of real hardship, that knowledge did not translate into trust. We must distinguish between knowing about God and actually trusting Him.", "<mark>\"It is he who sits above the circle of the earth\"</mark>, who stretches out the heavens like a curtain and spreads them like a tent (v.22). He brings princes to nothing and makes the rulers of the earth as emptiness (v.23). Verse 24 compares them to plants scarcely planted, scarcely sown, whose stem has scarcely taken root—when God blows on them, they wither and the tempest carries them off like stubble. This recalls the grass and flowers of 40:6–8. <mark>No power, however strong, lasts forever, and even Babylon's might is not outside God's rule.</mark>", "In verse 25 the question of verse 18 returns, but this time God Himself asks it as <mark>\"the Holy One.\"</mark> God's holiness shows that He is distinct from all creation and perfect in character and judgment. So we must not confine God within our limited experience and judgment. <mark>\"Lift up your eyes on high and see: who created these? He who brings out their host by number, calling them all by name… not one is missing\"</mark> (v.26). How could the God who calls countless stars by name not know the situation of His own people? God's greatness is the very ground of our confidence that He cares for even our small circumstances."], "points": ["Do I believe that the God who calls the stars by name also knows my situation?"]}, {"title": "Verses 27–31 · God Who Gives New Strength to a Discouraged People", "paragraphs": ["<mark>\"Why do you say, O Jacob, and speak, O Israel, 'My way is hidden from the LORD, and my right is disregarded by my God'?\"</mark> (v.27). Here the reason for describing God's greatness becomes clear. Israel complains that God does not know their way and ignores their just cause. It matters that this complaint came <mark>not from outsiders but from God's own people</mark>. They knew God, but they began to judge Him through the suffering they experienced. God does not take their pain lightly; He seeks to correct the wrong conclusions they drew because of it.", "<mark>\"The LORD is the everlasting God, the Creator of the ends of the earth. He does not faint or grow weary; his understanding is unsearchable\"</mark> (v.28). God's power is not used up over time, and He does not work only within the range we understand. And this God who never tires <mark>\"gives power to the faint, and to him who has no might he increases strength\"</mark> (v.29). God is infinite and we are finite, but that difference becomes a reason for hope, not despair. Even youths and young men in verse 30 grow tired and fall. <mark>Admitting our limits is not a failure of faith.</mark>", "<mark>\"But they who wait for the LORD shall renew their strength; they shall mount up with wings like eagles; they shall run and not be weary; they shall walk and not faint\"</mark> (v.31). The Hebrew word for 'wait,' <i>qavah</i>, means to wait, to look for, to hope. It is not passing time doing nothing, but a faith that waits while trusting God's power, wisdom, and timing. Notice especially that the final image is <mark>'walking'</mark>. God's strength is needed not only in dramatic moments but in taking one step at a time through the routine of daily life. God's comfort does not remove the waiting; it gives <mark>the strength to wait</mark>."], "points": ["Rather than just wanting the wait to end immediately, am I asking for new strength to walk while I wait?"]}, {"title": "Application · Fix Your Eyes on the God Who Is Greater Than Your Problems", "paragraphs": ["In Mark 4, the disciples were crossing the lake with Jesus when a great storm arose. It was a problem they could not solve on their own, and Jesus was asleep. The disciples asked, <mark>\"Teacher, do you not care that we are perishing?\"</mark> (Mark 4:38). This is so much like Israel in today's passage. Israel truly faced exile; the disciples truly faced a life-threatening storm. But they <mark>judged God's heart by the circumstances they were in</mark>.", "After calming the wind and the sea, Jesus asked, \"Why are you so afraid? Have you still no faith?\" (Mark 4:40). <mark>Jesus dealt not only with the storm but with the disciples' faith.</mark> Our inability to solve a problem and God's lacking power to solve it are two entirely different things. God not answering when we want and God not loving us are also two entirely different things.", "Jesus, too, prayed in anguish in Gethsemane before the cross, yet He entrusted Himself to the Father's will rather than His own. And at the place where death on the cross looked like the end, God brought about the resurrection. The cross and resurrection show that <mark>the reality we see does not determine the limits of God's power and plan</mark>. Jesus crossed the boundary of death that we cannot cross.", "Are you facing a problem you cannot solve on your own right now? This is not a call to ignore or dismiss it; we must faithfully carry the responsibilities that are ours. But <mark>do not limit God by the limits of your problem</mark>. God did not promise to explain the reason for every hardship immediately, but He did promise new strength to those who wait for Him. Today, lift one unresolved problem to God, and courageously take one step of obedience within it. Looking to Jesus, the founder and perfecter of our faith (Hebrews 12:2), fix your eyes on the God who is greater than your problems."], "points": ["Today I will lift one unresolved problem to God and take one step of obedience within it."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I did not judge God's power by the size of my problem, but looked to the God who is greater."}, {"key": "c2", "text": "I examined whether I had made money, status, or people my ultimate security."}, {"key": "c3", "text": "I chose to trust God even though I cannot fully understand His will."}, {"key": "c4", "text": "I admitted my limits and took one step of obedience today."}], "s4heading": "One-Line Reflection", "memoHint": "Am I interpreting my problems by looking at God, or interpreting God by looking at my problems?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Lift the Problem", "value": "Write down one unresolved problem and pray, \"Lord, You are greater than this problem\""}, {"key": "act2", "label": "Look Up", "value": "Tonight, look up at the sky for a moment and meditate on the God who calls the stars by name"}, {"key": "act3", "label": "Check Your Reliance", "value": "Write down what you ultimately lean on (money, status, relationships) and entrust it to the Lord again"}, {"key": "act4", "label": "One Step of Obedience", "value": "Decide on one step of obedience you can take within your problem today, and do it"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize Isaiah 40:31 and ask for new strength while you wait"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, God, who holds the universe in Your hand and calls the stars by name, yet gives power to me when I'm weary and knows my situation."}, {"key": "p2", "tag": "Repent", "text": "I repent of limiting You by the size of my problems, of making money, status, and people my ultimate security, and of doubting Your love when answers were slow."}, {"key": "p3", "tag": "Ask", "text": "Give me new strength to wait for You, and help me take one step of obedience today even in the midst of unresolved problems."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Nobyembre 27, Biyernes", "ref": "Isaias 40:12–31", "headline": "Nakikita Ko ba ang Diyos sa Pamamagitan ng Aking mga Problema,<br>o ang Aking mga Problema sa Pamamagitan ng Diyos?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Isaias 40:12-31", "s1heading": "Salita Ngayon", "verse": "\"Ngunit ang mga naghihintay sa PANGINOON ay magbabagong-lakas;<br>sila'y paiilanglang na may mga pakpak na gaya ng mga agila;<br>sila'y tatakbo at hindi mapapagod; sila'y lalakad at hindi manlulupaypay.\"", "verseRef": "Isaias 40:31", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Nililimitahan Ko ba ang Diyos Ayon sa Laki ng Aking mga Problema?", "paragraphs": ["Sinagot ng unang kalahati ng Isaias 40 ang isang tanong: nais pa rin bang iligtas ng Diyos ang bayan ng Juda, na hahatulan dahil sa kanilang kasalanan? Ang sagot ay oo. Hindi susuko ang Diyos sa Kanyang bayan; Siya ang unang darating at aaliw sa kanila. Ngayon, sinasagot ng talata ngayon ang dalawang tanong. <mark>Una, may kapangyarihan ba talaga ang Diyos na iligtas tayo? Ikalawa, kung gayon, bakit tila binabalewala Niya ang ating paghihirap?</mark>", "Kapag nangunguna ako sa pagsamba ng mga bata, madalas akong makakilala ng maliliit na sumasagot ng \"Jesus!\" anuman ang itanong. Marahil ganoon din tayo. Matapos ang maraming taon sa iglesya, magaling tayong sumagot sa mga tanong tungkol sa Biblia. Ngunit <mark>kapag humarap tayo sa problemang hindi natin kayang lutasin nang mag-isa</mark>, nagbabago ang lahat: 'Talaga bang alam ng Diyos ang aking kalagayan? Bakit napakatagal nang walang nagbabago?' Ito rin ang mga tanong ng Israel habang hinaharap nila ang desperadong realidad ng pagkabihag sa Babilonia.", "Nangako ang Diyos ng aliw at kaligtasan, ngunit ang pagkarinig sa pangako ay hindi agad nagpabago sa kanilang realidad. Sa gitna ng realidad na iyon, sinasabi ng Diyos sa Kanyang bayan na <mark>itaas ang kanilang mga mata at tingnan ang mundong nilikha Niya</mark>, at itinatanong Niya, \"Naaalala mo ba kung anong uri ng Diyos ang lumikha at namamahala sa lahat ng ito?\" Tinitingnan ko ba ang aking mga problema habang nagtitiwala sa Diyos? O <mark>nililimitahan ko ang Diyos ayon sa laki at hangganan ng aking mga problema</mark>?"], "points": ["Magaling akong sumagot sa mga tanong tungkol sa Biblia, ngunit nagdududa ba ako sa Diyos kapag humaharap sa sarili kong mga problema?"]}, {"title": "Talata 12–17 · Ang Walang Kapantay na Diyos na Manlilikha", "paragraphs": ["<mark>\"Sino ang sumukat ng tubig sa palad ng kanyang kamay at tumakda sa langit sa dangkal, naglagay ng alabok ng lupa sa takalan at tumimbang ng mga bundok sa timbangan at ng mga burol sa panimbang?\"</mark> (t.12). Gamit ang mga larawan ng karaniwang pagsukat, inilalarawan ng propeta ang kadakilaan ng Diyos. Ang hindi kayang isipin ng tao ay madaling hinahawakan ng Diyos. Sa Israel, ang Babilonia ay napakalaking imperyo, ngunit hindi sa Diyos na humahawak sa sansinukob sa Kanyang kamay. <mark>Ang problemang inaakala kong hindi ko kaya, hindi rin ba kaya ng Diyos?</mark>", "Kung binibigyang-diin ng talata 12 ang kapangyarihan ng Diyos, binibigyang-diin naman ng talata 13–14 ang Kanyang karunungan: <mark>\"Sino ang sumukat sa Espiritu ng PANGINOON, o sinong tao ang nagpakita sa Kanya ng payo?\"</mark> Sa mga mito ng Babilonia noon, tumatanggap ang mga diyos ng payo mula sa ibang diyos, ngunit ang Diyos ng Israel ay hindi nangangailangan ng payo ninuman. <mark>Ang hindi natin pagkaunawa sa kalooban ng Diyos at ang pagkilos ng Diyos nang walang plano ay dalawang ganap na magkaibang bagay.</mark> Alam ng Diyos kung ano ang tama kahit sa mga sitwasyong hindi natin nauunawaan.", "<mark>\"Narito, ang mga bansa ay gaya ng isang patak mula sa timba, at itinuturing na gaya ng alabok sa timbangan\"</mark> (t.15). Kahit ang Asiria at Babilonia, na nagtatakda ng kaligtasan ng Israel, ay gaya ng alabok na hindi nakaaapekto sa timbangan sa harap ng Diyos. Kahit gawing panggatong ang lahat ng puno ng Lebanon at handog na sinusunog ang lahat ng hayop nito, hindi pa rin ito sapat bilang karapat-dapat na handog sa Diyos (t.16). Hindi ito nangangahulugang walang halaga ang tao; nangangahulugan itong ang lahat ng kapangyarihan at awtoridad ng tao ay hindi maihahambing sa Diyos. Sa halip na unang ipaliwanag kung paano Niya lulutasin ang pagkabihag, <mark>unang ipinapakita ng Diyos kung sino ang Diyos na kanilang pinaniniwalaan</mark>. Ang pananampalataya ay hindi pagtanggi sa laki ng problema, kundi pagtingin sa Diyos na mas dakila kaysa sa problema."], "points": ["Hinahatulan ko ba ang kapangyarihan ng Diyos ayon sa laki ng aking mga problema?"]}, {"title": "Talata 18–20 · Mga Diyus-diyusan ng Tao na Hindi Maihahambing sa Diyos", "paragraphs": ["<mark>\"Kanino nga ninyo ihahambing ang Diyos, o anong larawan ang itutulad ninyo sa Kanya?\"</mark> (t.18). Ang Diyos ang Manlilikhang gumawa ng mundo, ngunit ang mga diyus-diyusan ay gawa ng tao mula sa mga materyales sa mundo. Ang Manlilikha at ang nilikha ay hindi kailanman mailalagay sa iisang antas. Sa talata 19, ipinahuhulma ng mga tao sa isang manggagawa ang diyus-diyusan, binabalutan ito ng ginto, at pinalalamutian ng mga kadenang pilak. Malinaw dito ang matalas na panunuya ni Isaias: <mark>paanong ang isang bagay na umiiral lamang kung gagawin ng tao ay magiging diyos na nagliligtas sa tao?</mark>", "Sa talata 20, may pumipili ng kahoy na hindi mabubulok at naghahanap ng mahusay na manggagawa upang <mark>itayo ang diyus-diyusang hindi gagalaw</mark>. Napakabalintuna! Ang diyos na dapat magtanggol sa tao ay itinatayo pa ng tao. Hinahawakan ng Diyos ang buong sansinukob, ngunit ang diyus-diyusan ay hindi man lang makatayo nang mag-isa.", "Dapat nating seryosong itanong <mark>kung ang hinahawakan natin ay talagang kayang humawak sa atin</mark>. Ang pera, posisyon, kakayahan, at mga relasyong inaasahan natin ngayon ay hindi masama sa kanilang sarili. Ngunit kung iniisip nating ang mga ito ang sa huli'y magtitiyak ng kaligtasan at kinabukasan ng ating buhay, katulad tayo ng mga nagtitiwala sa diyus-diyusan. Ang mga diyus-diyusan sa talata 19–20 ay nangangailangan ng tulong ng tao, ngunit ang Diyos sa talata 29 ay nagbibigay ng lakas sa mahihinang tao."], "points": ["Naniniwala ba akong ang pera, posisyon, o relasyong hawak ko ang hahawak sa akin?"]}, {"title": "Talata 21–26 · Ang Banal na Namamahala sa Langit, Lupa, at Kasaysayan", "paragraphs": ["<mark>\"Hindi ba ninyo alam? Hindi ba ninyo narinig? Hindi ba ito sinabi sa inyo mula pa sa simula? Hindi ba ninyo naunawaan mula pa sa mga saligan ng lupa?\"</mark> (t.21). Apat na tanong ang inuulit. Hindi ito upang magbigay ng bagong kaalaman kundi upang <mark>tulungan silang alalahanin ang Diyos na kilala na nila</mark>. Kilala ng Israel ang Diyos ng paglikha at ang Diyos ng exodo. Ngunit sa harap ng tunay na hirap, hindi naging pagtitiwala ang kaalamang iyon. Dapat nating ihiwalay ang pagkakilala tungkol sa Diyos at ang tunay na pagtitiwala sa Kanya.", "<mark>\"Siya ang nakaupo sa itaas ng bilog ng lupa\"</mark>, na naglaladlad sa langit na parang tabing at naglalatag nito na parang tolda (t.22). Ginagawa Niyang walang kabuluhan ang mga prinsipe at hungkag ang mga pinuno ng lupa (t.23). Inihahambing sila ng talata 24 sa mga halamang kasisimula pa lamang itanim, kahahasik pa lamang, na ang tangkay ay kauugat pa lamang—kapag hinipan sila ng Diyos, nalalanta sila at tinatangay ng ipu-ipo na parang dayami. Ipinaaalala nito ang damo at bulaklak ng 40:6–8. <mark>Walang kapangyarihang tumatagal magpakailanman, gaano man kalakas, at kahit ang kapangyarihan ng Babilonia ay hindi labas sa pamamahala ng Diyos.</mark>", "Sa talata 25, bumabalik ang tanong ng talata 18, ngunit sa pagkakataong ito ang Diyos Mismo ang nagtatanong bilang <mark>\"ang Banal.\"</mark> Ipinapakita ng kabanalan ng Diyos na naiiba Siya sa lahat ng nilikha at ganap sa pagkatao at paghatol. Kaya hindi natin dapat ikulong ang Diyos sa loob ng ating limitadong karanasan at paghatol. <mark>\"Itaas ninyo ang inyong mga mata at tingnan: sino ang lumikha ng mga ito? Siya na naglalabas ng kanilang hukbo ayon sa bilang, tinatawag silang lahat sa pangalan… walang isa mang nawawala\"</mark> (t.26). Paanong ang Diyos na tumatawag sa pangalan ng di-mabilang na bituin ay hindi makaaalam sa kalagayan ng Kanyang sariling bayan? Ang kadakilaan ng Diyos ang mismong batayan ng ating katiyakan na inaalagaan Niya kahit ang maliliit nating kalagayan."], "points": ["Naniniwala ba akong ang Diyos na tumatawag sa pangalan ng mga bituin ay nakaaalam din sa aking kalagayan?"]}, {"title": "Talata 27–31 · Ang Diyos na Nagbibigay ng Bagong Lakas sa Nanghihinang Bayan", "paragraphs": ["<mark>\"Bakit mo sinasabi, O Jacob, at ipinahahayag, O Israel, 'Ang aking daan ay nakatago sa PANGINOON, at ang aking karapatan ay binabalewala ng aking Diyos'?\"</mark> (t.27). Dito nagiging malinaw kung bakit inilalarawan ang kadakilaan ng Diyos. Nagrereklamo ang Israel na hindi alam ng Diyos ang kanilang daan at binabalewala Niya ang kanilang makatarungang usapin. Mahalaga na ang reklamong ito ay nagmula <mark>hindi sa mga taga-labas kundi sa sariling bayan ng Diyos</mark>. Kilala nila ang Diyos, ngunit nagsimula silang hatulan Siya batay sa paghihirap na kanilang dinanas. Hindi binabalewala ng Diyos ang kanilang sakit; nais Niyang itama ang maling konklusyong ginawa nila dahil dito.", "<mark>\"Ang PANGINOON ay ang walang hanggang Diyos, ang Manlilikha ng mga dulo ng lupa. Hindi Siya nanghihina o napapagod; ang Kanyang pang-unawa ay di-matarok\"</mark> (t.28). Hindi nauubos ang kapangyarihan ng Diyos sa paglipas ng panahon, at hindi lamang Siya kumikilos sa saklaw ng ating pang-unawa. At ang Diyos na hindi napapagod na ito ay <mark>\"nagbibigay ng kapangyarihan sa nanghihina, at sa walang lakas ay nagdaragdag Siya ng lakas\"</mark> (t.29). Walang hanggan ang Diyos at may hangganan tayo, ngunit ang pagkakaibang iyon ay nagiging dahilan ng pag-asa, hindi ng kawalang-pag-asa. Kahit ang mga kabataan at binata sa talata 30 ay napapagod at nabubuwal. <mark>Ang pag-amin sa ating mga hangganan ay hindi kabiguan ng pananampalataya.</mark>", "<mark>\"Ngunit ang mga naghihintay sa PANGINOON ay magbabagong-lakas; sila'y paiilanglang na may mga pakpak na gaya ng mga agila; sila'y tatakbo at hindi mapapagod; sila'y lalakad at hindi manlulupaypay\"</mark> (t.31). Ang salitang Hebreo para sa 'maghintay,' <i>qavah</i>, ay nangangahulugang maghintay, umasa, magkaroon ng pag-asa. Hindi ito pagpapalipas ng oras nang walang ginagawa, kundi pananampalatayang naghihintay habang nagtitiwala sa kapangyarihan, karunungan, at panahon ng Diyos. Pansinin lalo na na ang huling larawan ay <mark>'paglalakad'</mark>. Kailangan ang lakas ng Diyos hindi lamang sa madudulang sandali kundi sa paghakbang nang isa-isa sa paulit-ulit na araw-araw na buhay. Hindi inaalis ng aliw ng Diyos ang paghihintay; ibinibigay nito <mark>ang lakas upang maghintay</mark>."], "points": ["Sa halip na naisin lamang na agad matapos ang paghihintay, humihingi ba ako ng bagong lakas upang lumakad habang naghihintay?"]}, {"title": "Pagsasabuhay · Ituon ang Iyong Mata sa Diyos na Mas Dakila Kaysa sa Iyong mga Problema", "paragraphs": ["Sa Marcos 4, tumatawid ang mga alagad sa lawa kasama si Jesus nang dumating ang isang malakas na unos. Problema ito na hindi nila kayang lutasin nang mag-isa, at natutulog si Jesus. Nagtanong ang mga alagad, <mark>\"Guro, wala Ka bang pakialam na kami'y mapapahamak?\"</mark> (Marcos 4:38). Kahawig na kahawig ito ng Israel sa talata ngayon. Tunay na hinarap ng Israel ang pagkabihag; tunay na hinarap ng mga alagad ang unos na nagbabanta sa kanilang buhay. Ngunit <mark>hinatulan nila ang puso ng Diyos batay sa kalagayang kinaroroonan nila</mark>.", "Matapos patahimikin ang hangin at dagat, nagtanong si Jesus, \"Bakit kayo takot na takot? Wala pa rin ba kayong pananampalataya?\" (Marcos 4:40). <mark>Hindi lamang ang unos ang hinarap ni Jesus kundi pati ang pananampalataya ng mga alagad.</mark> Ang hindi natin kakayahang lutasin ang isang problema at ang kawalan ng Diyos ng kapangyarihang lutasin ito ay dalawang ganap na magkaibang bagay. Ang hindi pagsagot ng Diyos sa panahong gusto natin at ang hindi Niya pagmamahal sa atin ay dalawa ring ganap na magkaibang bagay.", "Si Jesus din ay nanalangin nang may matinding paghihirap sa Getsemani bago ang krus, ngunit ipinagkatiwala Niya ang sarili sa kalooban ng Ama kaysa sa sarili Niyang kalooban. At sa lugar kung saan tila wakas na ang kamatayan sa krus, isinakatuparan ng Diyos ang muling pagkabuhay. Ipinapakita ng krus at muling pagkabuhay na <mark>ang realidad na nakikita natin ay hindi nagtatakda ng hangganan ng kapangyarihan at plano ng Diyos</mark>. Nilampasan ni Jesus ang hangganan ng kamatayan na hindi natin kayang lampasan.", "Humaharap ka ba ngayon sa problemang hindi mo kayang lutasin nang mag-isa? Hindi ito panawagang balewalain o iwasan ito; dapat nating tapat na pasanin ang mga pananagutang atin. Ngunit <mark>huwag mong limitahan ang Diyos ayon sa hangganan ng iyong problema</mark>. Hindi nangako ang Diyos na agad ipaliliwanag ang dahilan ng bawat paghihirap, ngunit nangako Siya ng bagong lakas sa mga naghihintay sa Kanya. Ngayon, iakyat sa Diyos ang isang problemang hindi pa nalulutas, at buong-tapang na humakbang ng isang hakbang ng pagsunod sa gitna nito. Nakatingin kay Jesus, ang nagtatag at nagpapasakdal ng ating pananampalataya (Hebreo 12:2), ituon ang iyong mata sa Diyos na mas dakila kaysa sa iyong mga problema."], "points": ["Ngayon, iaakyat ko sa Diyos ang isang problemang hindi pa nalulutas at hahakbang ako ng isang hakbang ng pagsunod sa gitna nito."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Hindi ko hinatulan ang kapangyarihan ng Diyos ayon sa laki ng aking problema, kundi tumingin ako sa Diyos na mas dakila."}, {"key": "c2", "text": "Sinuri ko kung ginawa ko bang pangunahing kaligtasan ang pera, posisyon, o mga tao."}, {"key": "c3", "text": "Pinili kong magtiwala sa Diyos kahit hindi ko lubos na nauunawaan ang Kanyang kalooban."}, {"key": "c4", "text": "Inamin ko ang aking mga hangganan at humakbang ng isang hakbang ng pagsunod ngayon."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Binibigyang-kahulugan ko ba ang aking mga problema sa pagtingin sa Diyos, o ang Diyos sa pagtingin sa aking mga problema?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Iakyat ang Problema", "value": "Isulat ang isang problemang hindi pa nalulutas at manalangin, \"Panginoon, mas dakila Ka kaysa sa problemang ito\""}, {"key": "act2", "label": "Tumingala", "value": "Ngayong gabi, tumingala sandali sa langit at pagnilayan ang Diyos na tumatawag sa pangalan ng mga bituin"}, {"key": "act3", "label": "Suriin ang Sinasandalan", "value": "Isulat ang pinakaaasahan mo (pera, posisyon, relasyon) at muli itong ipagkatiwala sa Panginoon"}, {"key": "act4", "label": "Isang Hakbang ng Pagsunod", "value": "Magpasya ng isang hakbang ng pagsunod na magagawa mo sa gitna ng iyong problema ngayon, at gawin ito"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang Isaias 40:31 at humingi ng bagong lakas habang naghihintay"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Diyos, na humahawak sa sansinukob sa Iyong kamay at tumatawag sa pangalan ng mga bituin, ngunit nagbibigay ng kapangyarihan sa akin kapag ako'y pagod at nakaaalam sa aking kalagayan."}, {"key": "p2", "tag": "Pagsisisi", "text": "Pinagsisisihan ko ang paglilimita sa Iyo ayon sa laki ng aking mga problema, ang paggawa sa pera, posisyon, at tao bilang aking pangunahing kaligtasan, at ang pagdududa sa Iyong pag-ibig kapag mabagal ang sagot."}, {"key": "p3", "tag": "Kahilingan", "text": "Bigyan Mo ako ng bagong lakas upang maghintay sa Iyo, at tulungan Mo akong humakbang ng isang hakbang ng pagsunod ngayon kahit sa gitna ng mga problemang hindi pa nalulutas."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-11-27';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>
