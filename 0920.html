<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "9월 20일 주일", "ref": "사사기 9장 7–21절", "headline": "나에게 유리했던 선택,<br>하나님 앞에서도 옳습니까", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 사사기 9:7-21", "s1heading": "오늘의 말씀", "verse": "\"이제 너희가 아비멜렉을 왕으로 세웠으니<br>너희가 행한 것이 진실하고 의로우냐\"", "verseRef": "사사기 9:16", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 요담, 침묵하지 않다", "paragraphs": ["앞선 본문에서 아비멜렉은 어머니의 친척이 있는 세겜으로 가서, 자신이 왕이 되는 것이 세겜 사람들에게 더 유리하다고 설득했습니다. 세겜 사람들은 바알브릿 신전의 돈으로 그를 도왔고, 아비멜렉은 그 돈으로 사람을 사서 자기 형제 일흔 명을 죽이고 왕이 되었습니다. 그러나 막내 요담만은 숨어서 살아남았습니다. 오늘 본문의 주인공은 바로 그 요담입니다.", "요담은 그리심산 꼭대기에 올라가 세겜 사람들을 향해 목소리를 높입니다. 그리심산은 신명기 27장과 여호수아 8장에서 이스라엘이 하나님의 언약에 따른 축복을 선포했던 곳입니다. 그런데 지금 그 축복의 자리에서, 요담은 세겜 사람들의 죄를 드러내며 저주를 경고합니다."]}, {"title": "7–15절 · 나무들의 우화 — 유익을 주는 것과 위에 서려는 것은 다르다", "paragraphs": ["나무들이 자신들을 다스릴 왕을 세우려 합니다. 먼저 감람나무를 찾아가지만, 감람나무는 하나님과 사람을 영화롭게 하는 기름 생산을 버리고 나무들 위에 우쭐거릴 수 없다고 답합니다. 무화과나무도, 포도나무도 각각 자신의 달콤한 열매와 포도주를 만드는 일을 포기할 수 없다며 거절합니다. 이 나무들의 공통점은, 이미 자신의 자리에서 다른 존재에게 유익을 주고 있다는 것입니다. 왕이 되기를 거절한 것은 아무 일도 하지 않으려 함이 아니라, 이미 유익한 열매를 맺고 있었기 때문입니다.", "마침내 나무들은 가시나무를 찾아갑니다. 가시나무는 제안을 기꺼이 받아들이며, 거대한 나무들에게 자기 그늘 아래로 피하라고 말합니다. 작은 가시나무가 큰 나무들을 그늘로 덮을 수 있다는 것부터 이미 앞뒤가 맞지 않습니다. 게다가 가시나무는 앞선 나무들과 달리 내어줄 열매가 없습니다. 대신 이렇게 위협합니다. <mark>\"나를 왕으로 세우지 않으면 불이 나와 레바논의 백향목까지 불사를 것이다\"</mark>. 줄 수 있는 그늘은 의심스럽지만, 불의 위협만은 분명합니다.", "이 가시나무가 가리키는 인물은 아비멜렉입니다. 그는 자신이 왕이 되면 세겜 사람들에게 유리할 것이라 설득했지만, 그 과정에서 이미 자기 형제들을 죽였습니다. 다른 사람의 생명을 빼앗아 권력을 얻은 사람이, 이제 백성을 보호하겠다고 말하는 것입니다. 그런데 요담은 아비멜렉만 비판하지 않습니다. 가시나무를 왕으로 세운 것은 나무들 자신이었습니다 — 그를 왕으로 세운 세겜 사람들에게도 책임이 있다는 것입니다."], "points": ["사람들에게 유익을 주는 것과 사람들 위에 서려는 것은 다릅니다."]}, {"title": "16–21절 · 요담의 고발과 저주", "paragraphs": ["요담은 비유를 마치고 세겜 사람들에게 직접 묻습니다. <mark>\"너희가 아비멜렉을 왕으로 세운 일이 과연 진실하고 의로운 일이었느냐\"</mark>. 앞서 아비멜렉이 던진 질문은 \"무엇이 너희에게 더 유리하냐\"였습니다. 그러나 요담의 질문은 정반대입니다 — 그 선택이 정말 옳았느냐는 것입니다.", "요담은 아버지 기드온이 세겜 사람들을 위해 싸웠고, 자기 생명을 걸고 미디안의 손에서 그들을 구원했다고 말합니다. 그런데 세겜 사람들은 어떻게 응답했습니까? 기드온의 집을 공격해 그의 아들 일흔 명을 죽이고, 아비멜렉이 자신들의 형제라는 이유만으로 그를 왕으로 세웠습니다. 은혜를 베푼 사람에게 배신으로 응답한 것입니다.", "요담은 마지막으로 무서운 경고를 선언합니다. <mark>\"아비멜렉에게서 불이 나와 세겜과 밀로 사람들을 사르고, 세겜과 밀로 사람들에게서 불이 나와 아비멜렉을 사르게 될 것이다\"</mark>. 가시나무는 다른 나무들을 불태우겠다고 위협했지만, 이제 그 불은 양쪽을 향합니다. 서로에게 유리하다는 이유로 손을 잡았던 관계가, 결국 서로를 파괴하게 될 것이라는 경고입니다. 요담은 이 말을 마친 뒤 아비멜렉을 피해 브엘로 도망합니다."], "points": ["은혜를 기억한다는 것은 과거에 받은 것을 아는 데서 그치지 않습니다. 그 은혜가 오늘 나의 선택을 움직이게 하는 것입니다."]}, {"title": "적용 · 유리한 것과 옳은 것은 다릅니다", "paragraphs": ["이야기의 끝은 어떻게 됩니까? 아비멜렉의 왕권이 아니라 요담의 경고가 실현됩니다. 성경은 훗날 하나님께서 아비멜렉과 세겜 사람들이 행한 악을 갚으셨다고 기록합니다. 지금 권력을 가졌다는 사실이 옳다는 증거는 아닙니다. 지금 원하는 결과를 얻었다는 사실이, 그 선택이 하나님의 뜻이었다는 뜻도 아닙니다. 하나님은 그 선택에 이르는 과정까지 보십니다.", "고린도 교회도 다르지 않았습니다. 사람들은 바울에게, 아볼로에게 속했다며 나뉘었습니다. 바울은 누가 더 많은 지지를 받는지 따지지 않고, 다시 십자가를 바라보게 했습니다. <mark>\"그리스도께서 어찌 나뉘었느냐\"</mark>(고린도전서 1:13). 우리를 하나 되게 하는 것이 공동의 이익뿐이라면, 그 이익이 사라지는 순간 관계도 쉽게 무너집니다. 교회를 하나로 묶는 중심은 예수 그리스도와 그분의 복음이어야 합니다.", "아비멜렉은 왕이 되려고 형제들의 피를 흘렸습니다. 그러나 참된 왕 예수님은 자기 백성을 살리려고 자신의 생명을 내어주셨습니다. 은혜로 구원받은 우리는, 내 뜻을 이루기 위해 사람을 내 편으로 모으기보다 먼저 하나님의 뜻을 구해야 합니다. 내 주장이 옳다고 확신되더라도, 그 과정에서 누군가를 해치고 있지는 않은지 돌아봐야 합니다."], "points": ["나에게 유리한 사람과 손잡는 것보다 중요한 것은, 그 관계와 선택이 하나님 앞에서 진실하고 의로운가 하는 것입니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "내가 지금 함께하는 선택이나 관계가 '옳음'이 아니라 '서로의 이익'으로만 묶여 있지는 않은지 점검했다"}, {"key": "c2", "text": "내가 맡은 자리에서 인정받는 것보다, 다른 사람에게 어떤 유익을 주고 있는지를 먼저 생각했다"}, {"key": "c3", "text": "지금 원하는 결과를 얻었다는 사실만으로, 그 선택이 하나님 앞에서도 옳다고 단정하고 있지는 않은지 돌아봤다"}, {"key": "c4", "text": "내가 받은 은혜를 기억하며, 그 은혜가 오늘 내 선택에 실제로 영향을 주고 있는지 점검했다"}], "s4heading": "묵상 한 줄", "memoHint": "지금 내가 맺고 있는 관계나 함께하는 선택 중, '이익'이 아니라 '진실함과 의로움'으로 다시 점검해야 할 것이 있다면 무엇입니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "유익 주는 삶 살기", "value": "오늘 내가 맡은 자리에서 인정받기보다 누군가에게 유익을 주는 일 하나 하기"}, {"key": "act2", "label": "관계의 중심 점검하기", "value": "지금 함께하는 모임이나 관계의 중심이 이익인지 그리스도인지 하나 점검해보기"}, {"key": "act3", "label": "과정을 돌아보기", "value": "원하는 결과를 얻은 선택이라도, 그 과정이 정직했는지 하나 돌아보기"}, {"key": "act4", "label": "은혜를 기억하기", "value": "받은 은혜를 오늘 한 가지 구체적인 선택으로 표현해보기"}, {"key": "act5", "label": "십자가 앞에 서기", "value": "의견이 갈리는 문제 앞에서 누가 옳은가보다 그리스도를 먼저 떠올리기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "형제들을 위해 자기 생명을 내어주신 참된 왕 예수님, 그 십자가의 은혜를 오늘도 기억하게 하심을 감사합니다"}, {"key": "p2", "tag": "회개", "text": "무엇이 옳은가보다 무엇이 나에게 유리한가를 따라 사람과 손을 잡았던 순간들을 회개합니다"}, {"key": "p3", "tag": "간구", "text": "제가 맺는 관계와 제가 하는 선택이 이익이 아니라 진실함과 의로움으로 묶이게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "September 20, Sunday", "ref": "Judges 9:7–21", "headline": "Was My Advantageous Choice<br>Also Right Before God?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · Judges 9:7-21", "s1heading": "Today's Word", "verse": "\"Now therefore, if you have acted in good faith and integrity<br>in making Abimelech king...\"", "verseRef": "Judges 9:16", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · Jotham Refuses to Stay Silent", "paragraphs": ["In the previous passage, Abimelech went to Shechem, where his mother's relatives lived, and persuaded them that it would be more advantageous for them if he became king. The people of Shechem helped him with money from the temple of Baal-berith, and Abimelech used that money to hire men who killed his seventy brothers so he could become king. Only the youngest, Jotham, survived by hiding. He's the central figure of today's passage.", "Jotham climbs to the top of Mount Gerizim and raises his voice to the people of Shechem. Gerizim was where Israel once proclaimed the blessings of God's covenant, in Deuteronomy 27 and Joshua 8. But now, from that very place of blessing, Jotham exposes Shechem's sin and warns of a curse."]}, {"title": "Verses 7–15 · The Fable of the Trees — Giving Benefit Is Different from Ruling Over Others", "paragraphs": ["The trees set out to anoint a king for themselves. They go first to the olive tree, but it refuses, unwilling to give up producing oil that honors God and people just to sway over the other trees. The fig tree and the vine likewise refuse, unwilling to give up their sweet fruit and their wine. What these trees have in common is that they were already giving benefit to others from where they stood. Refusing to be king wasn't refusing to do anything — it was because they were already bearing useful fruit.", "Finally the trees come to the thornbush. The thornbush eagerly accepts, telling the great trees to come take refuge in its shade. It doesn't add up from the start — how could towering trees take shelter under a small thornbush? And unlike the earlier trees, the thornbush has no fruit to offer. Instead, it threatens: <mark>\"If you don't truly make me king, let fire come out and devour the cedars of Lebanon.\"</mark> The shade it offers is doubtful, but the threat of fire is clear.", "This thornbush represents Abimelech. He persuaded Shechem that it would benefit them if he became king — but in the process, he had already killed his own brothers. A man who seized power by taking others' lives now claims he'll protect the people. But Jotham doesn't criticize Abimelech alone. It was the trees themselves who made the thornbush king — the people of Shechem who made him king share the responsibility too."], "points": ["Giving benefit to others is different from wanting to rule over them."]}, {"title": "Verses 16–21 · Jotham's Accusation and Curse", "paragraphs": ["Having finished his fable, Jotham asks the people of Shechem directly: <mark>\"Have you acted in good faith and integrity in making Abimelech king?\"</mark> Earlier, Abimelech's question was \"which is more advantageous for you?\" Jotham's question is the exact opposite — was that choice actually right?", "Jotham reminds them that his father Gideon fought for them and risked his own life to deliver them from Midian. How did the people of Shechem respond? They attacked Gideon's house, killed his seventy sons, and made Abimelech king for no reason other than that he was their kinsman. They repaid grace with betrayal.", "Jotham finally declares a fearful warning: <mark>\"Let fire come out from Abimelech and devour the people of Shechem and Beth-millo, and let fire come out from the people of Shechem and Beth-millo and devour Abimelech.\"</mark> The thornbush had threatened to burn the other trees — now that fire turns both ways. A relationship joined by mutual advantage will, in the end, destroy both sides. Having said this, Jotham flees to Beer to escape Abimelech."], "points": ["Remembering grace isn't just knowing what you once received — it's letting that grace move your choices today."]}, {"title": "Application · What's Advantageous and What's Right Are Different Things", "paragraphs": ["How does the story end? It's not Abimelech's kingship but Jotham's warning that comes true. Scripture later records that God repaid the evil that Abimelech and the people of Shechem had done. Holding power now isn't proof of being right. Getting the outcome we wanted doesn't mean the choice was God's will. God sees all the way through to the process behind the choice.", "The Corinthian church was no different. People split into factions, saying they belonged to Paul or to Apollos. Paul didn't try to count up who had more supporters — he turned them back to the cross instead: <mark>\"Is Christ divided?\"</mark> (1 Corinthians 1:13). If the only thing that unites us is shared benefit, the relationship collapses the moment that benefit disappears. What must hold the church together is Jesus Christ and His gospel.", "Abimelech shed his brothers' blood to become king. But Jesus, the true King, gave up His own life to save His people. Having been saved by grace, we should seek God's will first, rather than gathering people to our own side to get our way. Even when we're convinced our own view is right, we need to examine whether, in pressing it, we're harming someone along the way."], "points": ["What matters more than joining hands with someone advantageous to me is whether that relationship and choice are true and right before God."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I checked whether a choice or relationship I'm part of right now is held together only by 'mutual benefit' rather than 'what's right.'"}, {"key": "c2", "text": "I thought first about what benefit I give others in my role, rather than how much recognition I'm getting."}, {"key": "c3", "text": "I reflected on whether I've assumed a choice must be right before God just because I got the outcome I wanted."}, {"key": "c4", "text": "I checked whether the grace I've received is actually shaping my choices today, not just something I remember happened."}], "s4heading": "One-Line Reflection", "memoHint": "Is there a relationship or a shared choice in your life right now that needs to be re-examined — not by 'benefit,' but by 'truth and righteousness'?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Live a Life That Gives Benefit", "value": "Do one thing today that benefits someone else, rather than seeking recognition in your role"}, {"key": "act2", "label": "Check the Center of a Relationship", "value": "Check whether a group or relationship you're part of is centered on benefit or on Christ"}, {"key": "act3", "label": "Examine the Process", "value": "Even for a choice that got the result you wanted, look back at whether the process was honest"}, {"key": "act4", "label": "Remember Grace Concretely", "value": "Express the grace you've received through one concrete choice today"}, {"key": "act5", "label": "Stand Before the Cross", "value": "In a disagreement today, think of Christ first rather than who's right"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Jesus, the true King who gave up Your own life for Your people — thank You for helping me remember the grace of the cross again today."}, {"key": "p2", "tag": "Repent", "text": "I repent of the times I joined hands with someone based on what's advantageous to me rather than what's right."}, {"key": "p3", "tag": "Ask", "text": "Let the relationships I form and the choices I make be held together by truth and righteousness, not by benefit."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Setyembre 20, Linggo", "ref": "Mga Hukom 9:7–21", "headline": "Ang Napiling Kapaki-pakinabang sa Akin,<br>Tama Ba Rin sa Harap ng Diyos?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Mga Hukom 9:7-21", "s1heading": "Salita Ngayon", "verse": "\"Ngayon kung kayo'y kumilos nang may katapatan at katuwiran<br>sa paggawa kay Abimelek na hari...\"", "verseRef": "Mga Hukom 9:16", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Hindi Tumahimik si Jotam", "paragraphs": ["Sa nakaraang bahagi, pumunta si Abimelek sa Shekem, kung saan nakatira ang mga kamag-anak ng kanyang ina, at hinikayat sila na mas kapaki-pakinabang para sa kanila kung siya ang magiging hari. Tinulungan siya ng mga tao sa Shekem gamit ang salapi mula sa templo ni Baal-berit, at ginamit ni Abimelek ang salaping ito upang umupa ng mga taong pumatay sa kanyang pitumpung kapatid, upang siya'y maging hari. Ang bunso lamang na si Jotam ang nakaligtas sa pagtatago. Siya ang pangunahing tauhan sa binasa natin ngayon.", "Umakyat si Jotam sa tuktok ng Bundok Gerizim at itinaas ang kanyang tinig sa mga tao ng Shekem. Ang Gerizim ay ang lugar kung saan ipinahayag noon ng Israel ang mga pagpapala ng tipan ng Diyos, sa Deuteronomio 27 at Josue 8. Ngunit ngayon, mula sa mismong lugar ng pagpapala, inilantad ni Jotam ang kasalanan ng Shekem at binalaan sila ng sumpa."]}, {"title": "Talata 7–15 · Ang Kuwento ng mga Punongkahoy — Iba ang Pagbigay ng Kapakinabangan sa Pamumuno", "paragraphs": ["Nagpasya ang mga punongkahoy na pumili ng hari para sa kanilang sarili. Una silang lumapit sa punong olibo, ngunit tumanggi ito, ayaw talikuran ang paggawa ng langis na nagbibigay karangalan sa Diyos at sa tao, kung ito lang ang para umiwas sa ibang mga punongkahoy. Ang punong igos at ang punong ubas ay tumanggi din, ayaw isuko ang kanilang matamis na bunga at ang kanilang alak. Ang pagkakatulad ng mga punongkahoy na ito ay nagbibigay na sila ng kapakinabangan sa iba mula sa kanilang kinatatayuan. Ang pagtanggi na maging hari ay hindi pagtanggi na gumawa ng anuman — ito ay dahil sila'y namumunga na ng kapaki-pakinabang.", "Sa huli, lumapit ang mga punongkahoy sa tinikan. Masayang tinanggap ito ng tinikan, sinasabi sa malalaking punongkahoy na sumilong sa kanyang lilim. Hindi na ito tama mula sa simula — paano makakasilong ang malalaking punongkahoy sa ilalim ng maliit na tinikan? At hindi tulad ng mga naunang punongkahoy, walang bungang ihahandog ang tinikan. Sa halip, nagbanta ito: <mark>\"Kung hindi ninyo talagang gagawing hari, hayaang lumabas ang apoy at lamunin ang mga sedar ng Lebanon.\"</mark> Duda ang lilim na ihahandog nito, ngunit malinaw ang banta ng apoy.", "Ang tinikan na ito ay kumakatawan kay Abimelek. Hinikayat niya ang Shekem na makikinabang sila kung siya'y magiging hari — ngunit sa proseso, napatay na niya ang sarili niyang mga kapatid. Ang taong nag-agaw ng kapangyarihan sa pagkuha ng buhay ng iba ay nagsasabi na ngayon na siya'y magpoprotekta sa mga tao. Ngunit hindi lamang si Abimelek ang pinuna ni Jotam. Ang mga punongkahoy mismo ang gumawang hari sa tinikan — ang mga tao ng Shekem na naghari kay Abimelek ay may pananagutan din."], "points": ["Iba ang pagbigay ng kapakinabangan sa iba sa pagnanais na mamuno sa kanila."]}, {"title": "Talata 16–21 · Ang Paratang at Sumpa ni Jotam", "paragraphs": ["Matapos ang kuwento, direktang tinanong ni Jotam ang mga tao ng Shekem: <mark>\"Kumilos ba kayo nang may katapatan at katuwiran sa paggawa kay Abimelek na hari?\"</mark> Ang tanong ni Abimelek noon ay \"alin ang mas kapaki-pakinabang para sa inyo?\" Ang tanong ni Jotam ay kabaligtaran — talaga bang tama ang piniling iyon?", "Ipinaalala ni Jotam na ang kanyang ama, si Gideon, ay lumaban para sa kanila at itinaya ang sariling buhay upang iligtas sila mula sa kamay ng Midian. Paano tumugon ang mga tao ng Shekem? Sinalakay nila ang tahanan ni Gideon, pinatay ang kanyang pitumpung anak, at ginawang hari si Abimelek dahil lamang siya'y kanilang kamag-anak. Ginantihan nila ng pagtataksil ang biyaya.", "Sa huli, ipinahayag ni Jotam ang isang kahindik-hindik na babala: <mark>\"Lumabas ang apoy mula kay Abimelek at lamunin ang mga tao ng Shekem at Bet-milo, at lumabas ang apoy mula sa mga tao ng Shekem at Bet-milo at lamunin si Abimelek.\"</mark> Nagbanta ang tinikan na sunugin ang ibang punongkahoy — ngayon, ang apoy na iyon ay tumutungo sa dalawang direksyon. Ang isang relasyong pinagbuklod ng pantay na kapakinabangan ay sa huli ay magwawasak sa dalawang panig. Pagkasabi nito, tumakas si Jotam patungong Beer upang iwasan si Abimelek."], "points": ["Ang pag-alala ng biyaya ay hindi lamang pag-alam ng natanggap noon — ito ay pagpapahintulot na ang biyaya iyon ang mag-udyok ng iyong mga pagpili ngayon."]}, {"title": "Aplikasyon · Iba ang Kapaki-pakinabang sa Tama", "paragraphs": ["Paano natapos ang kwento? Hindi ang paghahari ni Abimelek kundi ang babala ni Jotam ang natupad. Itinala ng Kasulatan sa hulihan na ginanti ng Diyos ang kasamaang ginawa ni Abimelek at ng mga tao ng Shekem. Ang pagtataglay ng kapangyarihan ngayon ay hindi patunay na tama. Ang makuha ang resultang ninanais ay hindi nangangahulugang kalooban ng Diyos ang pagpiling iyon. Nakikita ng Diyos ang buong proseso sa likod ng pagpili.", "Hindi naiba ang iglesia sa Corinto. Nagkabaha-bahagi ang mga tao, sinasabing kabilang sila kay Pablo o kay Apolos. Hindi sinubukan ni Pablo na bilangin kung sino ang mas maraming tagasuporta — sa halip, ibinalik niya sila sa krus: <mark>\"Nahati ba si Cristo?\"</mark> (1 Corinto 1:13). Kung ang tanging bagay na nagbubuklod sa atin ay ang magkasanib na kapakinabangan, gumuho ang relasyon sa sandaling mawala ang kapakinabangang iyon. Ang dapat magbuklod sa iglesia ay si Jesu-Cristo at ang Kanyang ebanghelyo.", "Nagpadanak si Abimelek ng dugo ng kanyang mga kapatid upang maging hari. Ngunit si Jesus, ang tunay na Hari, ay ibinigay ang sarili Niyang buhay upang iligtas ang Kanyang bayan. Bilang mga naligtas na sa biyaya, dapat nating hangarin muna ang kalooban ng Diyos, sa halip na tipunin ang mga tao sa ating panig upang makuha ang gusto natin. Kahit na naniniwala tayong tama ang ating paninindigan, kailangan nating suriin kung may nasasaktan tayo sa proseso ng ipinaglalaban ito."], "points": ["Higit na mahalaga kaysa sa pagsasanib-kamay sa isang taong kapaki-pakinabang sa akin ay kung ang relasyon at pagpiling iyon ay totoo at tama sa harap ng Diyos."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Sinuri ko kung ang isang pagpili o relasyon na kasangkot ako ngayon ay pinagbuklod lamang ng 'kapwa-kapakinabangan' sa halip na 'ano ang tama.'"}, {"key": "c2", "text": "Unang naisip ko kung anong kapakinabang ang ibinibigay ko sa iba sa aking tungkulin, sa halip na kung gaano ako kinikilala."}, {"key": "c3", "text": "Pinag-isipan ko kung inaakala kong tama na sa harap ng Diyos ang isang pagpili dahil lamang nakuha ko ang resultang gusto ko."}, {"key": "c4", "text": "Sinuri ko kung ang biyayang natanggap ko ay talagang humuhubog sa aking mga pagpili ngayon, hindi lamang isang bagay na naaalala kong nangyari."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "May relasyon ba o magkasanib na pagpili sa iyong buhay ngayon na dapat suriin muli — hindi sa 'kapakinabangan,' kundi sa 'katotohanan at katuwiran'?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Mamuhay ng Nagbibigay-Kapakinabangan", "value": "Gawin ang isang bagay ngayon na makikinabang sa iba, sa halip na maghangad ng pagkilala sa iyong tungkulin"}, {"key": "act2", "label": "Suriin ang Sentro ng Relasyon", "value": "Suriin kung ang isang grupo o relasyong kasangkot mo ay sentro sa kapakinabangan o kay Cristo"}, {"key": "act3", "label": "Suriin ang Proseso", "value": "Kahit sa isang pagpiling nakuha ang resultang ninanais, tingnan muli kung matapat ang proseso"}, {"key": "act4", "label": "Alalahanin ang Biyaya sa Tiyak na Paraan", "value": "Ipahayag ang natanggap mong biyaya sa isang tiyak na pagpili ngayon"}, {"key": "act5", "label": "Tumayo sa Harap ng Krus", "value": "Sa isang di-pagkakasundo ngayon, unahin munang isipin si Cristo sa halip na kung sino ang tama"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Jesus, ang tunay na Hari na ibinigay ang sarili Mong buhay para sa Iyong bayan — salamat sa pagtulong sa akin na maalala muli ang biyaya ng krus ngayon."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa mga sandaling nagsanib-kamay ako sa isang tao batay sa kapaki-pakinabang sa akin sa halip na batay sa tama."}, {"key": "p3", "tag": "Kahilingan", "text": "Hayaang ang mga relasyong binubuo ko at ang mga pagpiling gagawin ko ay pagbuklurin ng katotohanan at katuwiran, hindi ng kapakinabangan."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-09-16';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
