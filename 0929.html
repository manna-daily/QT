<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "9월 29일 화요일", "ref": "사사기 13장 15–25절", "headline": "하나님을 아는 것은<br>정보보다 예배입니다", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 사사기 13:15-25", "s1heading": "오늘의 말씀", "verse": "\"영생은 곧 유일하신 참 하나님과<br>그가 보내신 자 예수 그리스도를 아는 것이니이다\"", "verseRef": "요한복음 17:3", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 질문하던 사람이 엎드리다", "paragraphs": ["앞선 본문에서 삼손의 이야기가 시작되었습니다. 이스라엘은 40년 동안 블레셋의 압제를 받으면서도 아무도 부르짖지 않았습니다. 그러나 하나님은 먼저 구원을 준비하셨고, 아이를 낳을 수 없던 마노아의 아내에게 생명을 약속하셨습니다.", "오늘 본문에서 마노아는 계속 묻습니다. \"아이를 어떻게 길러야 합니까? 당신이 그 사람입니까? 당신의 이름은 무엇입니까?\" 그런데 하나님이 마지막에 주신 것은 더 많은 정보가 아니었습니다. <mark>하나님의 임재</mark>였습니다. 그리고 그 임재 앞에서, 질문하던 사람이 얼굴을 땅에 대고 엎드립니다."], "points": ["우리는 왜 하나님을 더 알고 싶어 합니까? 미래를 통제할 정보를 얻기 위해서입니까, 그분 앞에 더 깊이 엎드리기 위해서입니까?"]}, {"title": "15–18절 · 알아보지 못한 마노아, \"내 이름은 기묘자라\"", "paragraphs": ["마노아가 말합니다. \"당신은 우리에게 머물러서 우리가 당신을 위하여 염소 새끼 하나를 준비하게 하소서.\" 손님을 대접하려는 자연스러운 환대였습니다. 그런데 성경은 한 줄을 덧붙입니다. <mark>마노아는 그가 여호와의 사자인 줄 알지 못하였더라</mark>. 그는 아직 그를 선지자 정도로 이해하고 있었습니다. 사자는 말합니다. \"번제를 준비하려거든 마땅히 여호와께 드릴지니라.\" 마노아의 시선을 자신에게서 여호와께로 돌린 것입니다.", "마노아는 다시 이름을 묻습니다. 말씀이 이루어질 때 그를 존귀하게 하고 싶어서였습니다. 그러나 사자는 대답합니다. <mark>\"어찌하여 내 이름을 묻느냐, 내 이름은 기묘자라\"</mark>. 여기서 '기묘'는 단순히 신기하다는 뜻이 아니라 <mark>인간의 이해를 넘어선다</mark>는 뜻입니다. 시편 139편에서 하나님의 지식을 두고 \"너무 기이하니 내가 능히 미치지 못하나이다\"라고 할 때와 같은 어근입니다."], "points": ["우리는 하나님을 참되게 알 수 있지만, 완전히 다 알 수는 없습니다. 하나님은 순종에 필요한 것은 알려 주시지만 모든 것을 설명하시지는 않습니다."]}, {"title": "19–21절 · 불꽃과 함께 올라가신 여호와의 사자", "paragraphs": ["마노아가 염소 새끼와 소제물을 바위 위에서 여호와께 드립니다. 그때 놀라운 일이 일어납니다. 제단의 불꽃이 하늘로 올라갈 때, <mark>여호와의 사자가 그 불꽃을 타고 올라간 것</mark>입니다. 이제 마노아에게 더 이상 이름은 필요 없었습니다. 그가 누구인지 행동으로 드러났기 때문입니다. 18절에서 그의 이름이 '기묘'였고, 19절에서 그는 기묘한 일을 행하셨습니다.", "그 광경을 본 마노아와 아내는 <mark>얼굴을 땅에 대고 엎드립니다</mark>. 계속 질문하던 사람이, 이제 예배하는 사람이 되었습니다. 성경을 더 알고, 신학을 더 알고, 하나님에 대해 더 많이 설명하는 것의 마지막 목적은 더 많이 아는 사람이 되는 것이 아니라, 더 깊이 하나님 앞에 엎드리는 사람이 되는 것입니다."], "points": ["하나님을 아는 것의 목적은 정보를 소유하는 것이 아니라 하나님을 예배하는 것입니다."]}, {"title": "22–23절 · 같은 사건, 정반대의 해석", "paragraphs": ["마노아가 말합니다. <mark>\"우리가 하나님을 보았으니 반드시 죽으리로다\"</mark>. 거룩한 임재 앞에서의 두려움 자체는 성경에서 자연스러운 반응입니다. 문제는 두려워했다는 것이 아니라, 그 두려움 때문에 하나님이 이미 주신 약속을 잊어버렸다는 것입니다.", "그런데 아내는 전혀 다르게 생각합니다. 그녀는 세 가지를 말합니다. 하나님이 우리를 죽이려 하셨다면 <mark>번제를 받지 않으셨을 것이고, 이 모든 일을 보이지 않으셨을 것이며, 이런 말씀도 들려주지 않으셨을 것</mark>이라고. 논리는 단순합니다. 하나님이 우리에게 미래를 약속하셨는데 지금 우리를 죽이시겠느냐는 것입니다. 두 사람은 같은 사건을 보았지만 결론은 정반대였습니다. 마노아는 \"내가 본 것이 두렵다, 그러므로 죽을 것이다\"라고 했고, 아내는 \"하나님이 이미 말씀하셨다, 그러므로 죽지 않을 것이다\"라고 했습니다.", "우리는 자주 상황을 보고 하나님을 해석합니다. \"지금 힘드니 하나님이 나를 버리신 것 같다.\" \"길이 보이지 않으니 약속도 이루어지지 않을 것 같다.\" 그러나 믿음은 반대로 묻습니다. \"하나님이 이미 무엇을 말씀하셨는가?\""], "points": ["상황이 약속을 해석하는 것이 아니라, 말씀이 상황을 해석하게 해야 합니다. 믿음은 현재의 감정보다 하나님의 약속을 더 신뢰하는 것입니다."]}, {"title": "24–25절 · 말씀이 현실이 되다", "paragraphs": ["24절은 아주 담담합니다. <mark>\"그 여인이 아들을 낳으매 그의 이름을 삼손이라 하니라\"</mark>. 앞에서 불꽃과 함께 사자가 하늘로 올라가는 엄청난 일이 있었지만, 이 이야기 전체에서 정말 중요한 기적은 아이를 낳을 수 없던 여인이 아이를 낳았다는 것입니다. 그 생명이 이스라엘 구원의 시작이었기 때문입니다. 하나님이 하시는 가장 중요한 일이 늘 가장 화려해 보이는 것은 아닙니다.", "\"그 아이가 자라매 여호와께서 그에게 복을 주시더니\". 삼손은 태어나기 전부터 선택되었고, 나실인으로 구별되었고, 기적적으로 태어났고, 복을 받았습니다. 그러나 앞으로 보게 될 그의 삶은 늘 성숙하지는 않았습니다. <mark>은사는 성품이 아닙니다</mark>. 큰 은혜를 받았다고 자동으로 성숙한 사람이 되는 것은 아닙니다.", "25절은 말합니다. <mark>\"여호와의 영이 그를 움직이기 시작하셨더라\"</mark>. 조용히 인도하셨다기보다 그의 내면을 뒤흔들고 자극하기 시작하셨다는 강한 표현입니다. 아직 삼손은 아무것도 하지 않았고, 블레셋의 지배도 그대로였습니다. 밖에서 보기엔 아무것도 변하지 않았지만, 하나님은 이미 움직이고 계셨습니다. 5절 \"구원하기 시작하리라\"와 25절 \"움직이기 시작하셨더라\" — 삼손 이야기는 '시작'이라는 말과 함께 갑니다."], "points": ["아직 결과가 보이지 않아도, 하나님이 움직이기 시작하셨다면 하나님의 일은 이미 시작된 것입니다."]}, {"title": "적용 · 모든 답이 아니라, 임재와 약속 앞에 엎드리기", "paragraphs": ["우리도 이해되지 않는 일이 많습니다. 자녀의 미래도, 우리 가정이 어떻게 될지도, 노후의 삶도, 교회의 미래도 다 알 수 없습니다. 하나님이 왜 지금 이런 방식으로 일하시는지 이해하지 못할 때가 많습니다. 그러나 우리가 하나님의 모든 방법을 이해하지 못해도, 하나님은 약속하신 일을 계속 이루어 가십니다. 믿음은 모든 질문에 답을 얻은 뒤에 믿는 것이 아니라, 충분히 말씀하신 하나님을 신뢰하고 이해되지 않는 부분은 맡기며 그분 앞에 엎드리는 것입니다.", "예수님은 말씀하셨습니다. <mark>\"영생은 곧 유일하신 참 하나님과 그가 보내신 자 예수 그리스도를 아는 것이니이다\"</mark>. 하나님을 안다는 것은 정보를 많이 가진다는 뜻만이 아닙니다. 예수님을 믿고, 그분의 말씀을 신뢰하고, 그분 앞에 내 삶을 맡기는 것입니다. 그리고 삼손은 구원을 시작했을 뿐이지만, 예수님은 십자가에서 <mark>\"다 이루었다\"</mark>고 말씀하셨습니다. 우리의 구원은 삼손이 아니라, 구원을 완성하신 예수 그리스도께 달려 있습니다."], "points": ["모든 것을 이해하려 붙잡기보다, 이미 분명히 말씀하신 것을 붙드십시오. 두려움이 올라올 때 상황보다 약속을 먼저 기억하고, 이해되지 않는 하나님의 방법 앞에서도 예배하십시오."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "하나님을 더 알고 싶은 이유가 미래를 통제하기 위해서인지, 그분을 더 깊이 예배하기 위해서인지 돌아봤다"}, {"key": "c2", "text": "힘든 상황 때문에 하나님이 이미 주신 약속을 잊고 두려움에 사로잡혀 있지는 않은지 점검했다"}, {"key": "c3", "text": "이해되지 않는 하나님의 방법 앞에서 따지기보다 맡기고 엎드리고 있는지 돌아봤다"}, {"key": "c4", "text": "받은 은사나 은혜를 성숙과 혼동하지 않고, 성품의 변화를 위해 기도하고 있는지 점검했다"}], "s4heading": "묵상 한 줄", "memoHint": "지금 내 상황이 하나님의 약속을 해석하고 있습니까, 하나님의 말씀이 내 상황을 해석하고 있습니까? 오늘 붙들어야 할 약속의 말씀은 무엇입니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "질문 대신 예배", "value": "오늘 기도 시간에 질문과 요청을 잠시 멈추고, 하나님이 어떤 분이신지 고백하며 찬양하기"}, {"key": "act2", "label": "약속의 말씀 붙들기", "value": "두려운 상황 하나를 놓고, 하나님이 이미 주신 약속의 말씀 한 구절을 적어 붙들기"}, {"key": "act3", "label": "말씀으로 상황 해석하기", "value": "'하나님이 나를 버리셨나' 싶은 일 앞에서 '하나님이 이미 무엇을 말씀하셨는가'를 먼저 묻기"}, {"key": "act4", "label": "믿음의 말로 격려하기", "value": "마노아의 아내처럼, 두려워하는 가족이나 이웃에게 하나님의 약속으로 격려의 말 건네기"}, {"key": "act5", "label": "작은 시작 감사하기", "value": "아직 결과는 보이지 않지만 하나님이 시작하신 일 하나를 떠올리고 감사드리기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "제가 다 이해하지 못해도 약속하신 구원을 계속 이루어 가시고, 십자가에서 다 이루신 예수님을 보내주신 하나님, 감사합니다"}, {"key": "p2", "tag": "회개", "text": "하나님을 예배하기보다 미래를 통제할 정보만 구하고, 상황에 흔들려 이미 주신 약속을 잊었던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "질문하는 자리에서 엎드리는 자리로 나아가게 하시고, 두려움보다 말씀을 먼저 붙드는 믿음을 주소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "September 29, Tuesday", "ref": "Judges 13:15–25", "headline": "Knowing God Is<br>More Worship Than Information", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · Judges 13:15-25", "s1heading": "Today's Word", "verse": "\"And this is eternal life, that they know You, the only true God,<br>and Jesus Christ whom You have sent.\"", "verseRef": "John 17:3", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · The One Who Kept Asking Falls Down", "paragraphs": ["In the previous passage, Samson's story began. Israel lived under Philistine oppression for forty years, yet no one cried out. But God prepared salvation first, promising life to Manoah's wife, who could not bear children.", "In today's passage, Manoah keeps asking: \"How should we raise the child? Are you the man? What is your name?\" But what God finally gave wasn't more information — it was <mark>His presence</mark>. And before that presence, the man who kept asking falls with his face to the ground."], "points": ["Why do we want to know God more? To gain information that lets us control the future — or to bow more deeply before Him?"]}, {"title": "Verses 15–18 · Manoah Didn't Recognize Him — \"My Name Is Wonderful\"", "paragraphs": ["Manoah says, \"Please let us detain you and prepare a young goat for you.\" It was natural hospitality toward a guest. But Scripture adds a line: <mark>Manoah did not know that he was the angel of the LORD.</mark> He still thought of him as something like a prophet. The angel replies, \"If you prepare a burnt offering, offer it to the LORD.\" He turned Manoah's gaze away from himself and toward the LORD.", "Manoah asks his name again, wanting to honor him when the word came true. But the angel answers, <mark>\"Why do you ask my name, seeing it is wonderful?\"</mark> \"Wonderful\" here doesn't just mean amazing — it means <mark>beyond human understanding</mark>. It shares a root with Psalm 139, where David says of God's knowledge, \"Such knowledge is too wonderful for me; it is high; I cannot attain it.\""], "points": ["We can truly know God, but we can never know Him completely. God tells us what we need in order to obey, but He doesn't explain everything."]}, {"title": "Verses 19–21 · The Angel of the LORD Ascends in the Flame", "paragraphs": ["Manoah offers the young goat and the grain offering on the rock to the LORD. Then something astonishing happens. As the flame rises from the altar toward heaven, <mark>the angel of the LORD ascends in the flame</mark>. Now Manoah no longer needs a name — who he was had been revealed through what he did. In verse 18 his name was \"wonderful\"; in verse 19 he did a wonderful thing.", "Seeing this, Manoah and his wife <mark>fall on their faces to the ground</mark>. The man who kept asking questions has become a worshiper. The ultimate purpose of knowing more Scripture, more theology, more about God isn't to become someone who knows more — it's to become someone who bows more deeply before Him."], "points": ["The purpose of knowing God is not to possess information, but to worship God."]}, {"title": "Verses 22–23 · The Same Event, Opposite Interpretations", "paragraphs": ["Manoah says, <mark>\"We shall surely die, for we have seen God.\"</mark> Fear before God's holy presence is a natural response in Scripture. The problem wasn't that he was afraid — it was that his fear made him forget the promise God had already given.", "But his wife thinks very differently. She makes three points: if the LORD had meant to kill us, <mark>He would not have accepted our offering, would not have shown us all these things, and would not have told us such things</mark>. Her logic is simple: God has promised us a future — would He kill us now? They saw the same event, but reached opposite conclusions. Manoah said, \"What I saw is frightening, so we'll die.\" His wife said, \"God has already spoken, so we won't die.\"", "We often interpret God by our circumstances: \"It's hard right now, so God must have abandoned me.\" \"I can't see a way forward, so the promise won't come true.\" But faith asks the opposite question: \"What has God already said?\""], "points": ["It's not our circumstances that should interpret the promise — the Word should interpret our circumstances. Faith trusts God's promise more than present feelings."]}, {"title": "Verses 24–25 · The Word Becomes Reality", "paragraphs": ["Verse 24 is very understated: <mark>\"And the woman bore a son and called his name Samson.\"</mark> There had just been an astonishing scene of the angel rising in the flame, but the truly important miracle of the whole story is that a woman who couldn't bear children gave birth — because that life was the beginning of Israel's salvation. The most important things God does aren't always the most spectacular.", "\"And the young man grew, and the LORD blessed him.\" Samson was chosen before birth, set apart as a Nazirite, born miraculously, and blessed. But as we'll see, his life wasn't always mature. <mark>Gifts are not character.</mark> Receiving great grace doesn't automatically make someone mature.", "Verse 25 says, <mark>\"And the Spirit of the LORD began to stir him.\"</mark> Not just quiet guidance — a strong image of stirring and moving him from within. Samson hadn't done anything yet, and Philistine rule was still in place. From the outside, nothing had changed — but God was already moving. Verse 5: \"he shall begin to save\"; verse 25: \"began to stir him\" — Samson's story walks hand in hand with the word \"begin.\""], "points": ["Even if results aren't visible yet, if God has begun to move, His work has already begun."]}, {"title": "Application · Bowing Before His Presence and Promise, Not All the Answers", "paragraphs": ["We too face so much we don't understand. We can't know our children's future, what will happen to our family, our later years, or our church's future. We often don't understand why God is working the way He is right now. But even when we don't understand all His ways, God keeps fulfilling what He has promised. Faith isn't believing after every question is answered — it's trusting the God who has spoken enough, entrusting what we don't understand to Him, and bowing before Him.", "Jesus said, <mark>\"This is eternal life, that they know You, the only true God, and Jesus Christ whom You have sent.\"</mark> Knowing God isn't only about having a lot of information. It means believing in Jesus, trusting His Word, and entrusting my life to Him. Samson only began the salvation — but Jesus said on the cross, <mark>\"It is finished.\"</mark> Our salvation depends not on Samson, but on Jesus Christ, who completed it."], "points": ["Rather than grasping to understand everything, hold onto what God has already clearly said. When fear rises, remember the promise before the circumstances — and worship even before God's ways you don't understand."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether I want to know God more in order to control the future, or to worship Him more deeply."}, {"key": "c2", "text": "I checked whether hard circumstances have made me forget the promises God has already given, leaving me gripped by fear."}, {"key": "c3", "text": "I reflected on whether I entrust and bow before God's ways I don't understand, rather than arguing with them."}, {"key": "c4", "text": "I checked whether I'm not confusing gifts or grace received with maturity, and am praying for real change in character."}], "s4heading": "One-Line Reflection", "memoHint": "Are my circumstances interpreting God's promise, or is God's Word interpreting my circumstances? What promise do I need to hold onto today?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Worship Instead of Questions", "value": "In today's prayer time, pause your questions and requests, and praise God by confessing who He is"}, {"key": "act2", "label": "Hold onto a Promise", "value": "For one situation that frightens you, write down one verse of promise God has already given and hold onto it"}, {"key": "act3", "label": "Let the Word Interpret", "value": "When something makes you wonder 'Has God abandoned me?', first ask 'What has God already said?'"}, {"key": "act4", "label": "Encourage with Words of Faith", "value": "Like Manoah's wife, encourage a fearful family member or neighbor with God's promises"}, {"key": "act5", "label": "Give Thanks for Small Beginnings", "value": "Recall one thing God has begun, even if the results aren't visible yet, and give thanks"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "God, thank You for continuing to fulfill the salvation You promised even when I don't understand, and for sending Jesus, who finished it on the cross."}, {"key": "p2", "tag": "Repent", "text": "I repent of seeking only information to control the future instead of worshiping You, and of forgetting Your promises when shaken by circumstances."}, {"key": "p3", "tag": "Ask", "text": "Move me from the place of questioning to the place of bowing down, and give me faith that holds onto Your Word before my fears."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Setyembre 29, Martes", "ref": "Mga Hukom 13:15–25", "headline": "Ang Pagkilala sa Diyos ay<br>Higit na Pagsamba Kaysa Impormasyon", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Mga Hukom 13:15-25", "s1heading": "Salita Ngayon", "verse": "\"At ito ang buhay na walang hanggan: na makilala nila Ikaw, ang tanging tunay na Diyos,<br>at si Jesu-Cristo na Iyong isinugo.\"", "verseRef": "Juan 17:3", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Ang Taong Patuloy na Nagtatanong ay Nagpatirapa", "paragraphs": ["Sa nakaraang bahagi, nagsimula ang kwento ni Samson. Namuhay ang Israel sa ilalim ng pang-aapi ng Filisteo sa loob ng apatnapung taon, ngunit walang dumaing. Ngunit ang Diyos ang unang naghanda ng pagliligtas, nangangako ng buhay sa asawa ni Manoa na hindi magkaanak.", "Sa binasa natin ngayon, patuloy na nagtatanong si Manoa: \"Paano namin palalakihin ang bata? Ikaw ba ang lalaking iyon? Ano ang iyong pangalan?\" Ngunit ang sa huli ay ibinigay ng Diyos ay hindi mas maraming impormasyon — kundi <mark>ang Kanyang presensya</mark>. At sa harap ng presensyang iyon, ang taong patuloy na nagtatanong ay nagpatirapa sa lupa."], "points": ["Bakit nais nating makilala pa ang Diyos? Upang makakuha ng impormasyon para makontrol ang hinaharap — o upang lalong magpatirapa sa harap Niya?"]}, {"title": "Talata 15–18 · Hindi Siya Nakilala ni Manoa — \"Ang Aking Pangalan ay Kahanga-hanga\"", "paragraphs": ["Sinabi ni Manoa, \"Pakiusap, manatili ka at maghahanda kami ng batang kambing para sa iyo.\" Ito'y likas na pagkamapagpatuloy sa isang panauhin. Ngunit nagdagdag ang Kasulatan ng isang linya: <mark>Hindi alam ni Manoa na siya ang anghel ni Yahweh.</mark> Akala pa rin niya'y isang propeta ito. Sumagot ang anghel, \"Kung maghahanda ka ng handog na susunugin, ialay mo ito kay Yahweh.\" Inilayo niya ang tingin ni Manoa mula sa kanya patungo kay Yahweh.", "Muling tinanong ni Manoa ang kanyang pangalan, nais siyang parangalan kapag natupad ang salita. Ngunit sumagot ang anghel, <mark>\"Bakit mo itinatanong ang aking pangalan, gayong ito'y kahanga-hanga?\"</mark> Ang \"kahanga-hanga\" dito ay hindi lamang nangangahulugang kamangha-mangha — nangangahulugan itong <mark>lampas sa pang-unawa ng tao</mark>. Kapareho ito ng ugat ng salita sa Awit 139, kung saan sinabi ni David tungkol sa kaalaman ng Diyos, \"Ang ganitong kaalaman ay lubhang kahanga-hanga para sa akin; hindi ko ito maabot.\""], "points": ["Tunay nating makikilala ang Diyos, ngunit hindi natin Siya lubos na makikilala. Sinasabi sa atin ng Diyos ang kailangan natin upang sumunod, ngunit hindi Niya ipinaliliwanag ang lahat."]}, {"title": "Talata 19–21 · Umakyat ang Anghel ni Yahweh sa Liyab", "paragraphs": ["Inialay ni Manoa ang batang kambing at ang handog na butil sa bato kay Yahweh. Pagkatapos ay may kamangha-manghang nangyari. Habang umaakyat ang liyab mula sa altar patungo sa langit, <mark>umakyat ang anghel ni Yahweh sa liyab</mark>. Ngayon, hindi na kailangan ni Manoa ang pangalan — nahayag kung sino siya sa pamamagitan ng kanyang ginawa. Sa talata 18, ang pangalan niya ay \"kahanga-hanga\"; sa talata 19, gumawa siya ng kahanga-hangang bagay.", "Nang makita ito, <mark>nagpatirapa sa lupa</mark> si Manoa at ang kanyang asawa. Ang taong patuloy na nagtatanong ay naging isang sumasamba. Ang huling layunin ng pagkaalam ng higit pang Kasulatan, higit pang teolohiya, higit pa tungkol sa Diyos ay hindi upang maging taong mas maraming alam — kundi upang maging taong mas malalim na nagpapatirapa sa harap Niya."], "points": ["Ang layunin ng pagkilala sa Diyos ay hindi ang pag-aari ng impormasyon, kundi ang pagsamba sa Diyos."]}, {"title": "Talata 22–23 · Parehong Pangyayari, Magkasalungat na Pag-unawa", "paragraphs": ["Sinabi ni Manoa, <mark>\"Tiyak na mamamatay tayo, sapagkat nakita natin ang Diyos.\"</mark> Ang takot sa harap ng banal na presensya ng Diyos ay likas na tugon sa Kasulatan. Ang problema ay hindi ang pagkatakot niya — kundi ang pagkalimot niya sa pangakong naibigay na ng Diyos dahil sa takot na iyon.", "Ngunit iba ang pag-iisip ng kanyang asawa. Nagbigay siya ng tatlong punto: kung balak tayong patayin ni Yahweh, <mark>hindi Niya tatanggapin ang ating handog, hindi Niya ipapakita sa atin ang lahat ng ito, at hindi Niya sasabihin sa atin ang mga bagay na ito</mark>. Simple ang kanyang lohika: nangako ang Diyos sa atin ng kinabukasan — papatayin ba Niya tayo ngayon? Iisang pangyayari ang kanilang nakita, ngunit magkasalungat ang kanilang konklusyon. Sinabi ni Manoa, \"Nakakatakot ang nakita ko, kaya mamamatay tayo.\" Sinabi ng kanyang asawa, \"Nagsalita na ang Diyos, kaya hindi tayo mamamatay.\"", "Madalas nating inuunawa ang Diyos batay sa ating kalagayan: \"Mahirap ngayon, kaya siguro iniwan na ako ng Diyos.\" \"Hindi ko makita ang daan, kaya hindi matutupad ang pangako.\" Ngunit ang pananampalataya ay nagtatanong ng kabaligtaran: \"Ano na ang sinabi ng Diyos?\""], "points": ["Hindi ang ating kalagayan ang dapat magpaliwanag sa pangako — ang Salita ang dapat magpaliwanag sa ating kalagayan. Ang pananampalataya ay mas nagtitiwala sa pangako ng Diyos kaysa sa kasalukuyang damdamin."]}, {"title": "Talata 24–25 · Ang Salita ay Naging Katotohanan", "paragraphs": ["Napakapayak ng talata 24: <mark>\"At nanganak ang babae ng isang lalaki at pinangalanan siyang Samson.\"</mark> Kakatapos lamang ng kamangha-manghang eksena ng anghel na umakyat sa liyab, ngunit ang tunay na mahalagang himala sa buong kwento ay ang pagkakaroon ng anak ng babaeng hindi magkaanak — dahil ang buhay na iyon ang simula ng pagliligtas sa Israel. Ang pinakamahalagang ginagawa ng Diyos ay hindi laging ang pinakakahanga-hanga sa paningin.", "\"At lumaki ang bata, at pinagpala siya ni Yahweh.\" Si Samson ay pinili bago isilang, itinalaga bilang Nazareo, isinilang sa himala, at pinagpala. Ngunit gaya ng makikita natin, ang kanyang buhay ay hindi laging hinog. <mark>Ang kaloob ay hindi pagkatao.</mark> Ang pagtanggap ng dakilang biyaya ay hindi kusang nagpapahinog sa isang tao.", "Sinasabi ng talata 25, <mark>\"At nagsimulang kumilos ang Espiritu ni Yahweh sa kanya.\"</mark> Hindi lamang tahimik na paggabay — isang malakas na larawan ng paggising at pagpapakilos sa kanya mula sa loob. Wala pang ginagawa si Samson, at nananatili pa ang pamamahala ng Filisteo. Sa labas, walang nagbago — ngunit kumikilos na ang Diyos. Talata 5: \"siya'y magsisimulang magligtas\"; talata 25: \"nagsimulang kumilos sa kanya\" — ang kwento ni Samson ay kasabay na naglalakad sa salitang \"simula.\""], "points": ["Kahit hindi pa nakikita ang mga resulta, kung nagsimula nang kumilos ang Diyos, nagsimula na ang Kanyang gawain."]}, {"title": "Aplikasyon · Pagpapatirapa sa Harap ng Kanyang Presensya at Pangako, Hindi ng Lahat ng Sagot", "paragraphs": ["Marami rin tayong hindi nauunawaan. Hindi natin alam ang kinabukasan ng ating mga anak, kung ano ang mangyayari sa ating pamilya, sa ating pagtanda, o sa kinabukasan ng ating iglesia. Madalas nating hindi maunawaan kung bakit ganito kumilos ang Diyos ngayon. Ngunit kahit hindi natin nauunawaan ang lahat ng Kanyang pamamaraan, patuloy na tinutupad ng Diyos ang Kanyang ipinangako. Ang pananampalataya ay hindi paniniwala matapos masagot ang bawat tanong — ito ay pagtitiwala sa Diyos na sapat nang nagsalita, pagpapaubaya sa Kanya ng hindi natin nauunawaan, at pagpapatirapa sa harap Niya.", "Sinabi ni Jesus, <mark>\"Ito ang buhay na walang hanggan: na makilala nila Ikaw, ang tanging tunay na Diyos, at si Jesu-Cristo na Iyong isinugo.\"</mark> Ang pagkilala sa Diyos ay hindi lamang pagkakaroon ng maraming impormasyon. Ito ay paniniwala kay Jesus, pagtitiwala sa Kanyang Salita, at pagpapaubaya ng aking buhay sa Kanya. Sinimulan lamang ni Samson ang pagliligtas — ngunit sinabi ni Jesus sa krus, <mark>\"Naganap na.\"</mark> Ang ating kaligtasan ay hindi nakasalalay kay Samson, kundi kay Jesu-Cristo, na tumapos nito."], "points": ["Sa halip na kumapit upang maunawaan ang lahat, kapitan ang malinaw nang sinabi ng Diyos. Kapag umaahon ang takot, alalahanin muna ang pangako bago ang kalagayan — at sumamba kahit sa harap ng mga pamamaraan ng Diyos na hindi mo nauunawaan."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung nais kong higit na makilala ang Diyos upang makontrol ang hinaharap, o upang lalong sambahin Siya."}, {"key": "c2", "text": "Sinuri ko kung ang mahihirap na kalagayan ay nagpalimot sa akin sa mga pangakong naibigay na ng Diyos, kaya't ako'y nababalot ng takot."}, {"key": "c3", "text": "Pinag-isipan ko kung ipinapaubaya ko at nagpapatirapa ako sa harap ng mga pamamaraan ng Diyos na hindi ko nauunawaan, sa halip na makipagtalo."}, {"key": "c4", "text": "Sinuri ko kung hindi ko ipinagkakamali ang mga kaloob o biyayang natanggap sa kahinugan, at nananalangin ako para sa tunay na pagbabago ng pagkatao."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Ang aking kalagayan ba ang nagpapaliwanag sa pangako ng Diyos, o ang Salita ng Diyos ang nagpapaliwanag sa aking kalagayan? Anong pangako ang dapat kong kapitan ngayon?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Pagsamba sa Halip na Tanong", "value": "Sa oras ng panalangin ngayon, ihinto muna ang mga tanong at hiling, at purihin ang Diyos sa pagpapahayag kung sino Siya"}, {"key": "act2", "label": "Kapitan ang Isang Pangako", "value": "Para sa isang kalagayang nakakatakot sa iyo, isulat ang isang talata ng pangakong naibigay na ng Diyos at kapitan ito"}, {"key": "act3", "label": "Hayaang ang Salita ang Magpaliwanag", "value": "Kapag may nagpapaisip sa iyo ng 'Iniwan na ba ako ng Diyos?', itanong muna 'Ano na ang sinabi ng Diyos?'"}, {"key": "act4", "label": "Magpalakas-loob sa Salita ng Pananampalataya", "value": "Tulad ng asawa ni Manoa, palakasin ang loob ng isang natatakot na kapamilya o kapitbahay sa pamamagitan ng mga pangako ng Diyos"}, {"key": "act5", "label": "Magpasalamat sa Maliliit na Simula", "value": "Alalahanin ang isang bagay na sinimulan ng Diyos, kahit hindi pa nakikita ang resulta, at magpasalamat"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Diyos, salamat sa patuloy Mong pagtupad sa ipinangakong kaligtasan kahit hindi ko nauunawaan, at sa pagsugo kay Jesus, na tumapos nito sa krus."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa paghahanap lamang ng impormasyon upang makontrol ang hinaharap sa halip na sambahin Ka, at sa paglimot sa Iyong mga pangako kapag natitinag ng kalagayan."}, {"key": "p3", "tag": "Kahilingan", "text": "Ilipat Mo ako mula sa lugar ng pagtatanong tungo sa lugar ng pagpapatirapa, at bigyan Mo ako ng pananampalatayang kumakapit sa Iyong Salita bago ang aking mga takot."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};

function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
