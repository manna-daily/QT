<head>

<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "11월 1일 주일", "ref": "고린도후서 1장 1–11절", "headline": "하나님께 받은 위로,<br>누구에게 전하고 있습니까?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 고린도후서 1:1-11", "s1heading": "오늘의 말씀", "verse": "\"우리의 모든 환난 중에서 우리를 위로하사<br>우리로 하여금 하나님께 받는 위로로써<br>모든 환난 중에 있는 자들을 능히 위로하게 하시는 이시로다\"", "verseRef": "고린도후서 1:4", "s2heading": "5분 요약", "cards": [{"title": "고린도후서 배경 · 눈물과 회개를 지나 다시 쓰는 편지", "paragraphs": ["바울은 고린도에서 1년 6개월 동안 말씀을 가르치며 교회를 세웠고, 성도들을 복음으로 낳은 자녀처럼 여겼습니다. 부와 지위와 말솜씨를 중시하던 도시의 가치관이 교회에 들어와 분열이 생겼고, 후서에서는 바울마저 <mark>\"편지는 힘 있지만 만나 보면 약하고 말도 시원찮다\"</mark>(10장)고 평가받습니다. 바울이 보낸 편지는 최소 네 통입니다. 전서 이전 편지(고전 5:9), 고린도전서, <mark>눈물의 편지</mark>, 그리고 고린도후서입니다(주후 55–56년경).", "전서 이후 바울은 근심을 남긴 아픈 방문을 했고, 이어 눈물로 편지를 썼습니다. 그 책망은 성도들의 <mark>회개</mark>로 이어져 바울에게 큰 위로가 되었습니다. 전서가 십자가의 도가 하나님의 능력이라고 가르쳤다면, 후서는 그 능력이 <mark>질그릇 같은 바울의 연약한 삶</mark> 속에서 어떻게 나타나는지 보여 줍니다. 그러니 이 편지를 읽을 때는 누가 더 강해 보이는가보다, 누구의 삶에서 십자가에 달리시고 부활하신 예수님이 드러나는가를 물어야 합니다."], "points": ["바울이 말하는 약함은 죄나 무책임의 핑계가 아니라, 자기 힘을 의지할 수 없는 자리에서도 주님을 의지하는 충성입니다."]}, {"title": "들어가며 · 사도에게도 살 소망이 끊어진 시간이 있었습니다", "paragraphs": ["어려움을 만나면 우리는 \"하나님을 믿는데 왜 이렇게 힘들까? 내 믿음이 부족한 걸까?\" 하고 생각합니다. 그런데 오늘 본문에서 사도 바울도 감당하기 어려운 고난 속에 <mark>살 소망까지 끊어졌다</mark>고 고백합니다. 부활하신 예수님께 부름받은 사도에게도 그런 시간이 있었습니다.", "그 바울이 하나님을 <mark>\"모든 위로의 하나님\"</mark>이라고 찬송합니다. 3–7절에는 '위로'라는 말이 열 번이나 반복됩니다. 하나님은 고난 중에 우리를 붙드시고, <mark>받은 위로로 다른 사람을 세우게</mark> 하십니다. 오늘은 내게 넘친 위로와 내가 흘려보내야 할 위로를 함께 살펴봅니다."], "points": ["나는 힘들 때 누구를 의지하며, 하나님께 받은 위로는 지금 누구에게 전해지고 있습니까?"]}, {"title": "1–2절 · 정체성: 우리는 하나님께 속한 사람들입니다", "paragraphs": ["바울은 자신이 <mark>\"하나님의 뜻으로 말미암아\"</mark> 그리스도 예수의 사도가 되었다고 밝힙니다. 그의 사명은 야망이나 인기에서 시작되지 않았습니다. 그리고 갈등과 문제가 많던 고린도 교회를 <mark>\"하나님의 교회\"</mark>라고 부릅니다. 성도는 뛰어난 몇 사람이 아니라 하나님께 속하도록 구별된 사람들입니다. 일이 잘 풀리면 사랑받는 것 같고 꼬이면 버림받은 것 같아도, 먼저 기억하십시오. <mark>우리는 그리스도 안에서 하나님께 속한 사람들입니다</mark>.", "바울은 <mark>은혜와 평강</mark>을 빕니다. 은혜는 잘해서 받아 내는 보상이 아니라 그리스도 안에서 거저 주신 사랑이고, 평강은 그 은혜로 하나님과 화평하게 된 사람이 누리는 평안입니다. 나도 은혜가 필요한 사람이고, 내가 미워하는 그 사람도 같은 은혜로 살아간다는 사실을 기억할 때 서로를 향한 말과 태도가 달라집니다."], "points": ["공동체를 세우는 첫 질문은 '누가 내 편인가'보다 '우리는 누구에게 속한 사람들인가'입니다."]}, {"title": "3–4절 · 위로: 하나님께 받은 위로로 위로합니다", "paragraphs": ["바울은 고난을 설명하기 전에 먼저 하나님을 <mark>\"자비의 아버지시요 모든 위로의 하나님\"</mark>이라고 찬송합니다. 고난을 바라볼 기준을 하나님의 성품에 두는 것입니다. 위로(파라클레시스)는 슬픔을 달래는 것과 함께 <mark>환난을 견디도록 붙들고 격려하는 도움</mark>입니다. 하나님은 때로 위기에서 건지시고, 때로 고난이 계속되는 가운데 믿음을 놓지 않도록 붙드십니다. 상황이 달라지지 않았다고 위로가 없었던 것은 아닙니다.", "하나님은 바울을 위로하시고, <mark>\"하나님께 받는 위로로써\"</mark> 환난 중에 있는 자들을 위로하게 하십니다. 고생을 많이 했다고 좋은 위로자가 되는 것은 아닙니다. \"나는 더 힘들었는데 너는 왜 그것도 못 견디니\"라고 말할 수도 있습니다. 누군가를 위로할 때는 내 경험부터 길게 말하기보다 <mark>그 사람의 이야기를 먼저 들어 주십시오</mark>. 그 사람이 겪는 아픔은 그 사람에게 가장 아픈 것입니다."], "points": ["위로에는 흘려보내야 할 목적이 있습니다. 하나님이 내 곁을 지켜 주셨듯 나도 그 사람 곁에 머뭅니다."]}, {"title": "5–7절 · 넘치는 고난, 넘치는 위로가 서로를 세웁니다", "paragraphs": ["<mark>\"그리스도의 고난이 우리에게 넘친 것 같이 우리가 받는 위로도 그리스도로 말미암아 넘치는도다\"</mark>(5절). 바울은 복음을 전하며 거절과 박해를 겪었습니다. 예수님의 속죄가 부족해 보충한다는 뜻이 아니라, 그분을 섬기는 길에서 고난에 참여한 것입니다. 그러나 넘친 것은 고난만이 아니었습니다. 우리도 고난만 보지 말고 <mark>그리스도 안에서 나를 붙드시는 은혜</mark>를 함께 보아야 합니다.", "바울은 \"내가 얼마나 힘들었는지 알아 달라\"에서 멈추지 않습니다. 자신의 환난도 위로도 <mark>\"너희가 위로를 받게 하려는 것\"</mark>(6절)이라고 말합니다. 그 위로가 성도들 안에서 고난을 견디는 인내로 나타납니다. 그래서 바울은 성도들을 향한 소망이 견고하다고 말합니다. 하나님께서 자신을 붙드신 것처럼 그들도 붙드실 것을 믿기 때문입니다."], "points": ["내게 넘친 위로는 다른 사람의 믿음을 붙드는 섬김으로 흘러가야 합니다."]}, {"title": "8–11절 · 의지: 죽은 자를 살리시는 하나님만 의뢰합니다", "paragraphs": ["바울은 아시아에서 <mark>\"힘에 겹도록 심한 고난을 당하여 살 소망까지 끊어지고\"</mark>(8절)라고 고백합니다. 사도도 언제나 강하지는 않았고, 그는 그 사실을 숨기지 않습니다. 그러니 고난받는 사람에게 \"믿음이 있으면 이 정도는 견뎌야지\"라고 쉽게 말해서는 안 됩니다. 바울은 그 경험이 <mark>\"자기를 의뢰하지 말고 오직 죽은 자를 다시 살리시는 하나님만 의뢰하게\"</mark>(9절) 하셨다고 고백합니다. 위로받았다는 것은 다시 혼자 해낼 수 있게 되었다는 뜻이 아니라, 누구를 의지해야 하는지 더 분명히 알게 되었다는 뜻입니다. 다만 이 고백을 남에게 \"당신이 교만해서 고난받는 것\"이라고 적용해서는 안 됩니다.", "바울은 하나님이 <mark>건지셨고, 건지시리라</mark>고 소망하며, 성도들에게 <mark>\"기도로 우리를 도우라\"</mark>(11절)고 부탁합니다. 하나님은 성도들의 기도를 통해서도 일하십니다. 갈등이 있던 관계가 서로 평가하는 데 머물지 않고 함께 하나님을 의지하는 관계로 나아갑니다. 3절의 찬송이 11절에서 많은 사람의 감사로 이어집니다."], "points": ["교회에는 도움만 주는 사람도, 받기만 하는 사람도 없습니다. 모두가 은혜를 받으며 서로를 돕습니다."]}, {"title": "적용 · 내게 넘친 위로, 내가 흘려보낼 위로", "paragraphs": ["오늘 말씀의 중심은 <mark>내게 넘친 위로, 내가 흘려보내야 할 위로</mark>입니다. 하나님은 고난을 없애 주시기도 하지만, 고난 한가운데서 우리를 붙드시고 견디게 하십니다. 오늘 눈물 가운데서도 하루를 살아갈 힘을 얻었다면, 누군가의 도움으로 다시 하나님을 바라보게 되었다면, 거기에 하나님의 위로가 있습니다. 그리고 그 위로의 근거는 우리의 형편이 아니라, <mark>그리스도 안에서 우리가 하나님께 속한 사람들</mark>이라는 사실입니다.", "그 위로는 내 안에서 멈추지 않아야 합니다. 지금 어려움을 겪는 한 사람을 떠올려 보십시오. 조언이나 내 경험담보다 <mark>먼저 그 사람의 이야기를 충분히 들어 주십시오</mark>. \"믿음이 있으면 견뎌야지\"라는 말 대신 \"많이 힘들었겠다\"라는 말로 곁에 머물러 주십시오. 짧은 안부 문자, 함께하는 식사, 구체적인 기도 한 줄이 하나님께 받은 위로를 흘려보내는 통로가 될 수 있습니다.", "그리고 나도 도움이 필요하다면 숨기지 마십시오. 바울처럼 <mark>\"기도로 나를 도와 달라\"</mark>고 부탁하는 것도 하나님을 의지하는 겸손입니다. 감당하기 어렵다는 사실을 인정하고, 죽은 자를 다시 살리시는 하나님께 삶을 맡기십시오. 예수님을 죽음에서 일으키신 그 하나님이 우리를 건지셨고, 지금도 건지시며, 앞으로도 건지실 것입니다. 서로를 평가하던 관계도 함께 기도하며 감사하는 관계로 바뀔 수 있습니다.", "오늘 하나님께 받은 위로를, 누구에게 어떤 행동으로 전하시겠습니까?"], "points": ["모든 위로의 하나님께 받은 위로를, 오늘 한 사람에게 흘려보냅니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "어려운 상황으로 내 가치와 하나님의 사랑을 판단하지 않고, 하나님께 속한 사람임을 기억했다"}, {"key": "c2", "text": "상황이 그대로여도 나를 붙드신 하나님의 위로를 찾아보았다"}, {"key": "c3", "text": "누군가를 위로할 때 내 경험부터 말하기보다 먼저 들어 주었는지 돌아봤다"}, {"key": "c4", "text": "도움이 필요할 때 숨기지 않고 기도를 부탁할 수 있는 겸손이 있는지 점검했다"}], "s4heading": "묵상 한 줄", "memoHint": "최근 하나님께 받은 위로는 무엇이며, 그 위로를 오늘 누구에게 어떻게 흘려보내겠습니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "위로 기억하기", "value": "최근 고난 속에서 나를 붙들어 준 하나님의 위로 하나를 적고 감사하기"}, {"key": "act2", "label": "먼저 들어 주기", "value": "어려움 중에 있는 한 사람에게 연락해 조언보다 이야기를 충분히 들어 주기"}, {"key": "act3", "label": "위로 흘려보내기", "value": "안부 문자, 함께하는 식사, 구체적인 기도 한 줄로 받은 위로를 전하기"}, {"key": "act4", "label": "기도 부탁하기", "value": "혼자 끌어안고 있던 어려움을 믿을 만한 사람에게 나누고 기도를 부탁하기"}, {"key": "act5", "label": "말씀 암송", "value": "고린도후서 1:4을 외우며 받은 위로가 흘러갈 곳을 생각하기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "자비의 아버지, 모든 위로의 하나님께서 환난 중에 저를 붙드시고, 죽은 자를 살리시는 능력으로 건지셨고 또 건지실 것을 감사합니다"}, {"key": "p2", "tag": "회개", "text": "상황으로 하나님의 사랑을 판단하고, 받은 위로를 내 안에만 두며, 고난받는 사람에게 섣불리 말했던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "제 자신이 아니라 주님만 의뢰하게 하시고, 하나님께 받은 위로로 환난 중에 있는 사람을 위로하며, 서로 기도로 돕는 공동체가 되게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "November 1, Lord's Day", "ref": "2 Corinthians 1:1–11", "headline": "The Comfort I Received from God —<br>Whom Am I Passing It On To?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · 2 Corinthians 1:1-11", "s1heading": "Today's Word", "verse": "\"[He] comforts us in all our affliction,<br>so that we may be able to comfort those who are in any affliction,<br>with the comfort with which we ourselves are comforted by God.\"", "verseRef": "2 Corinthians 1:4", "s2heading": "5-Minute Summary", "cards": [{"title": "Background to 2 Corinthians · A Letter Written After Tears and Repentance", "paragraphs": ["Before entering 2 Corinthians, let's briefly look at its relationship to 1 Corinthians. First, Paul and the Corinthian church were like a family bound by the gospel. Paul taught the Word in Corinth for a year and six months and planted the church, so he regarded the believers as children he had fathered through the gospel. Corinth's problems came to him like the problems of beloved children. Corinth was a city of commerce and travel that prized wealth, status, and eloquence, and those values entered the church. Believers compared leaders and gifts, boasted about themselves, and division followed. In 2 Corinthians they even judge Paul by this standard: <mark>'His letters are weighty and strong, but his bodily presence is weak, and his speech of no account'</mark> (ch. 10). Both letters carry Paul's heart to reteach, through the gospel of the cross, believers who were viewing the church by the world's standards. Second, Paul sent more than two letters, and time passed between them. In 1 Corinthians 5:9 he mentions an earlier letter, and in 2 Corinthians he recalls a letter written with many tears. So we know of at least four: an earlier letter (urging them not to associate with the sexually immoral), 1 Corinthians, <mark>the 'tearful' or 'severe' letter</mark>, and 2 Corinthians. A common view places 1 Corinthians around AD 55 in Ephesus and 2 Corinthians around AD 55–56 in Macedonia, roughly a year apart.", "Third, between the two letters came a painful visit, tears, and news of repentance. Sending 1 Corinthians didn't solve everything. Paul visited Corinth again, but that visit left great sorrow (see chs. 2 and 13). Instead of another sorrowful visit, he wrote a letter with tears — urging the church to correct its wrongs while explaining that he wrote out of deep love. That letter was likely delivered by Titus. What matters is that the rebuke led to <mark>repentance</mark>, and the news of it greatly comforted Paul. The comfort in 2 Corinthians is God's comfort experienced amid real pain and restored relationships. Fourth, the gospel of the cross taught in 1 Corinthians is displayed through Paul's life in 2 Corinthians. Much of the letter explains and defends Paul's ministry, because distrust of Paul was tied to rejecting the gospel he preached — he warns against accepting 'another Jesus' and 'a different gospel.' In 1 Corinthians he taught that the word of the cross is the power of God; in 2 Corinthians he shows how that power appears in his weak life. He is like <mark>a fragile clay jar</mark>, yet holds a treasure, so that the power at work through him is shown to belong to God. Paul's 'weakness' is not an excuse for sin or irresponsibility; it is a faithful life that relies on the Lord where it cannot rely on its own strength. Fifth, the letter's purpose is to rebuild the church in the gospel. Paul rejoiced at the repentance, but not every problem was solved — false teaching, sin, and distrust of Paul remained. So warm comfort and stern rebuke appear in the same letter. As we read it, we should ask not who looks stronger, but in whose teaching and life the crucified and risen Jesus is revealed."], "points": ["Paul's weakness is not an excuse for sin, but faithfulness that relies on the Lord where it cannot rely on its own strength."]}, {"title": "Introduction · Even an Apostle Despaired of Life", "paragraphs": ["When we face hardship, we often think, 'I believe in God — why is this so hard? Is my faith lacking?' Yet in today's passage the apostle Paul confesses that he was burdened beyond his strength and <mark>despaired even of life</mark>. Even an apostle called by the risen Jesus had such a season.", "And that same Paul praises God as <mark>'the God of all comfort.'</mark> In verses 3–7, the word 'comfort' appears ten times. What was the comfort he experienced? God holds us in suffering and <mark>enables us to strengthen others with the comfort we have received</mark>. Today we will look together at the comfort that overflows to me and the comfort I must pass on. When things are hard, whom do you rely on? And to whom is the comfort you've received from God being passed on now? Let's look at three keywords."], "points": ["Whom do I rely on when things are hard — and to whom is God's comfort flowing through me now?"]}, {"title": "Verses 1–2 · Identity: We Belong to God", "paragraphs": ["At the start of the letter, Paul declares that he became an apostle of Christ Jesus <mark>'by the will of God.'</mark> An apostle is one sent by Christ to proclaim His Word. Paul's mission did not begin with his ambition or people's popularity; God called and sent him. Paul, together with his co-worker Timothy, greets the church in Corinth and the saints in all Achaia. Notice the phrase <mark>'the church of God.'</mark> The Corinthian church had so many conflicts and problems, and there was pain in its relationship with Paul. Yet Paul calls them the church of God. He begins the letter from the fact that they belong to God. 'Saints' doesn't refer to a few outstanding people; it means those set apart to belong to God. Having received that grace, they must now live as people who belong to Him. When we face difficulties, it's easy to judge our worth by our circumstances. When things go well, we feel loved by God; when things tangle, we feel abandoned. But first remember: <mark>you and I belong to God in Christ.</mark>", "In verse 2, Paul wishes them <mark>grace and peace</mark> from God our Father and the Lord Jesus Christ. Grace is not a reward we earn by doing well; it is love God has given freely, at no cost, in Christ. Peace is the well-being enjoyed by those reconciled to God through that grace. A church in conflict needs exactly this. We must remember that I too am a person who needs grace — and the person I dislike, the person I resent, also lives by the same grace. Only then can our words and attitudes toward each other change."], "points": ["The first question that builds community is not 'Who is on my side?' but 'To whom do we belong?'"]}, {"title": "Verses 3–4 · Comfort: We Comfort with the Comfort God Gives", "paragraphs": ["In verse 3, Paul praises God as <mark>'the Father of mercies and God of all comfort.'</mark> Look at the order: Paul explains how hard things were in verse 8, but before that, in verse 3, he declares who God is. He sets the standard for viewing his suffering before God's character. God is not One who watches His suffering children indifferently; He is a spiritual Father who has compassion and actually cares for them. The Greek word for comfort, <i>paraklēsis</i>, here means not only soothing sorrow but <mark>help that holds us and encourages us to endure affliction</mark>. Sometimes God rescues us from crisis. Sometimes He holds us so we don't let go of faith while the suffering continues. So we cannot conclude there was no comfort from God just because our situation hasn't changed yet. If you found strength to live another day through tears, or turned to God again through someone's help, you can find God's comfort there too.", "In verse 4, we must distinguish 'we' and 'you' — this is very important. In this section, the 'we' who suffer and are comforted refers first to Paul himself or the ministers around him; the 'you' in verse 6 are the Corinthian believers. Paul is explaining how the comfort given to him flows to the believers. God comforts Paul in all his affliction, and with that comfort enables Paul to comfort those in any affliction. Comfort has a purpose: it is meant to flow on. Importantly, simply having suffered a lot doesn't make someone a good comforter. Suffering can wound the heart further; we might say, 'I had it worse — why can't you even handle that?' Paul says we comfort <mark>'with the comfort with which we ourselves are comforted by God'</mark> — comforting others with the mercy of the God who had pity on us. So when you comfort someone, rather than talking at length about your own experience, <mark>listen to their story first</mark>. Even if you've been through something similar, you don't know all their pain. The pain I've experienced feels like the greatest pain to me — and so the pain that person is experiencing is the most painful thing for them. Just as God has stayed by your side and mine, we must be able to stay by theirs."], "points": ["Comfort has a purpose — to flow on. As God stayed by my side, I stay by theirs."]}, {"title": "Verses 5–7 · Overflowing Suffering and Overflowing Comfort Build One Another Up", "paragraphs": ["Verse 5: <mark>'For as we share abundantly in Christ's sufferings, so through Christ we share abundantly in comfort too.'</mark> Preaching the crucified Jesus, Paul experienced rejection and persecution. Belonging to Christ and serving Him, he shared in suffering. This doesn't mean Jesus' atonement was lacking and Paul was making up for it. Jesus accomplished salvation; Paul suffered in the process of proclaiming that gospel — this was his cross. But what overflowed in Paul's life was not only suffering. He confesses that comfort through Christ overflowed too. There was affliction pressing him down, and at the same time the Lord who held him. We too must not look only at our suffering but also at <mark>the grace of God who holds us in Christ</mark>.", "In verse 6, the relationship between 'we' and 'you' becomes clearer. Paul says that if we are afflicted, it is for your comfort and salvation; and if we are comforted, it is for your comfort. Because Paul endured suffering to preach the gospel, the believers heard the word of salvation. And because he passes on the comfort he received from God, the believers are built up in faith. Paul doesn't stop at 'Please understand how hard it was for me.' He explains how his affliction and comfort benefit the believers. What is that benefit? <mark>They become able to endure the same sufferings.</mark> Comfort shows itself as the endurance of faith. 'Sharing in the same sufferings' doesn't mean everyone experiences the identical event; it means that on the path of belonging to Christ, we share both suffering and God's comfort. So Paul says his hope for them is unshaken, because he believes God will hold them just as He held him."], "points": ["The comfort that overflows to me must flow on as service that holds up others' faith."]}, {"title": "Verses 8–11 · Reliance: Trusting Only the God Who Raises the Dead", "paragraphs": ["In verse 8 Paul speaks of the affliction he experienced in Asia — a Roman province that included Ephesus. We can't determine from the text exactly what happened, but how severe it was is clear: <mark>'we were so utterly burdened beyond our strength that we despaired of life itself.'</mark> Apostles weren't always strong. Paul admitted his limits, and he didn't hide it from the believers. So we must never casually tell a suffering person, 'If you have faith, you should be able to handle this.' Faith isn't pretending it isn't hard. It is admitting it's too much and asking God for help. Verse 9: <mark>'Indeed, we felt that we had received the sentence of death. But that was to make us rely not on ourselves but on God who raises the dead.'</mark> Paul was so desperate he felt there was no escape from death. Yet looking back, he confesses that God made him rely not on himself but on the God who raises the dead. This is a key turning point in the passage: the comfort of verses 3–7 becomes concrete as trust in God. Being comforted by God doesn't mean we can now do everything on our own again; it means we see more clearly whom we must rely on. Paul looks especially to the God who raises the dead — who can give life even where human possibility ends, the God who raised Jesus from death — and entrusts his life to Him. To whom are you entrusting your life? But we must not apply this confession carelessly to others. There is no basis for saying, 'You're suffering because you were proud.' Paul is confessing God's purpose as he experienced it; we should first examine what we ourselves rely on.", "In verses 10–11, Paul places his hope in the God who rescued him in the past, for the future too: <mark>'He delivered us… and He will deliver us.'</mark> He doesn't say there will be no more difficulty; he says he will keep needing God's rescue. And he asks the believers to help him by praying. Why does Paul, who relies on God, ask people for help? Because God works through the prayers of His people too. A life that relies on God must also have the humility to receive one another's help. Earlier, the comfort Paul received flowed to the believers; now the believers' prayers help Paul. He is both one who gives comfort and one who needs prayer. The 'blessing granted' here, in context, is the gracious gift of God's rescue and help. Many pray, experience that grace, and give thanks to God together. There had been conflict between Paul and the believers, yet he shares his hardship and asks for prayer. A relationship that had stalled at evaluating each other can move toward relying on God together. Paul's praise that began in verse 3 leads to the thanksgiving of many in verse 11."], "points": ["In the church, no one only gives help and no one only receives it; all receive grace and help one another."]}, {"title": "Application · Comfort That Overflows to Me, Comfort I Must Pass On", "paragraphs": ["The center of today's Word is <mark>the comfort that overflows to me and the comfort I must pass on</mark>. Sometimes God removes suffering, but He also holds us in the middle of it and helps us endure. If today you found strength to live through tears, or turned to God again through someone's help, God's comfort is there.", "That comfort must not stop inside me. Think of one person going through difficulty right now. Before advice or your own story, <mark>listen fully to theirs first</mark>. A short check-in message, a shared meal, one specific line of prayer can become channels for the comfort you received from God.", "And if you need help yourself, don't hide it. Like Paul, asking <mark>'Help me by your prayers'</mark> is also the humility of relying on God. Admit that it's more than you can bear, and entrust your life to the God who raises the dead.", "To whom, and through what action, will you pass on the comfort you've received from God today?"], "points": ["Today I pass on to one person the comfort I received from the God of all comfort."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I didn't judge my worth or God's love by hard circumstances, but remembered that I belong to God."}, {"key": "c2", "text": "Even though my situation hasn't changed, I looked for God's comfort that has held me."}, {"key": "c3", "text": "I reflected on whether I listened first, rather than starting with my own experience, when comforting someone."}, {"key": "c4", "text": "I checked whether I have the humility to ask for prayer rather than hide when I need help."}], "s4heading": "One-Line Reflection", "memoHint": "What comfort have I recently received from God, and to whom, and how, will I pass it on today?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Remember Comfort", "value": "Write down one comfort from God that held you in recent hardship, and give thanks"}, {"key": "act2", "label": "Listen First", "value": "Reach out to someone in difficulty and listen fully to their story rather than giving advice"}, {"key": "act3", "label": "Pass It On", "value": "Pass on comfort through a check-in message, a shared meal, or one specific line of prayer"}, {"key": "act4", "label": "Ask for Prayer", "value": "Share a burden you've been carrying alone with a trustworthy person and ask them to pray"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize 2 Corinthians 1:4 and think about where the comfort you received should flow"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, Father of mercies and God of all comfort, for holding me in affliction and for delivering me — and promising to deliver me — by the power that raises the dead."}, {"key": "p2", "tag": "Repent", "text": "I repent of judging Your love by my circumstances, keeping Your comfort to myself, and speaking carelessly to those who suffer."}, {"key": "p3", "tag": "Ask", "text": "Help me rely not on myself but on You alone, comfort those in affliction with the comfort I receive from You, and be part of a community that helps one another through prayer."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Nobyembre 1, Araw ng Panginoon", "ref": "2 Corinto 1:1–11", "headline": "Ang Aliw na Natanggap Ko sa Diyos —<br>Kanino Ko Ito Ipinapasa?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · 2 Corinto 1:1-11", "s1heading": "Salita Ngayon", "verse": "\"Inaaliw Niya tayo sa lahat ng ating kapighatian,<br>upang maaliw natin ang mga nasa anumang kapighatian<br>sa pamamagitan ng aliw na tinanggap natin mula sa Diyos.\"", "verseRef": "2 Corinto 1:4", "s2heading": "5 Minutong Buod", "cards": [{"title": "Konteksto ng 2 Corinto · Isang Liham na Isinulat Matapos ang Luha at Pagsisisi", "paragraphs": ["Bago pumasok sa 2 Corinto, tingnan muna natin nang maikli ang kaugnayan nito sa 1 Corinto. Una, si Pablo at ang iglesya sa Corinto ay parang pamilyang pinag-isa ng ebanghelyo. Nagturo si Pablo ng Salita sa Corinto sa loob ng isang taon at anim na buwan at itinatag ang iglesya, kaya itinuring niya ang mga mananampalataya na parang mga anak na isinilang niya sa pamamagitan ng ebanghelyo. Dumating sa kanya ang mga problema ng Corinto na parang problema ng minamahal na mga anak. Ang Corinto ay lungsod ng kalakalan at paglalakbay na nagpapahalaga sa yaman, katayuan, at husay magsalita, at pumasok ang mga pagpapahalagang iyon sa iglesya. Inihambing ng mga mananampalataya ang mga pinuno at kaloob, nagmalaki sa sarili, at sumunod ang pagkakahati. Sa 2 Corinto, hinusgahan pa nila si Pablo sa pamantayang ito: <mark>'Mabigat at malakas ang kanyang mga liham, ngunit mahina ang kanyang presensya at walang halaga ang kanyang pananalita'</mark> (kab. 10). Dala ng dalawang liham ang puso ni Pablo na turuang muli, sa pamamagitan ng ebanghelyo ng krus, ang mga mananampalatayang tumitingin sa iglesya ayon sa pamantayan ng mundo. Ikalawa, higit sa dalawang liham ang ipinadala ni Pablo, at may panahong lumipas sa pagitan nila. Sa 1 Corinto 5:9, binanggit niya ang naunang liham, at sa 2 Corinto ay binalikan niya ang liham na isinulat nang may maraming luha. Kaya alam natin ang hindi bababa sa apat: isang naunang liham (na nagpapayong huwag makisama sa mga imoral), ang 1 Corinto, <mark>ang 'liham ng luha' o 'mahigpit na liham'</mark>, at ang 2 Corinto. Karaniwang pananaw na isinulat ang 1 Corinto noong mga AD 55 sa Efeso at ang 2 Corinto noong mga AD 55–56 sa Macedonia, mga isang taon ang pagitan.", "Ikatlo, sa pagitan ng dalawang liham ay may masakit na pagdalaw, luha, at balita ng pagsisisi. Hindi nalutas ang lahat sa pagpapadala ng 1 Corinto. Dumalaw muli si Pablo sa Corinto, ngunit nag-iwan ng malaking kalungkutan ang pagdalaw na iyon (tingnan ang kab. 2 at 13). Sa halip na isa pang malungkot na pagdalaw, sumulat siya ng liham nang may luha — hinihimok ang iglesya na itama ang mga mali habang ipinaliliwanag na sumulat siya dahil sa malalim na pag-ibig. Malamang na si Tito ang naghatid ng liham na iyon. Ang mahalaga ay humantong ang pagsaway sa <mark>pagsisisi</mark>, at lubos na naaliw si Pablo sa balitang iyon. Ang aliw sa 2 Corinto ay aliw ng Diyos na naranasan sa gitna ng tunay na sakit at naibalik na relasyon. Ikaapat, ang ebanghelyo ng krus na itinuro sa 1 Corinto ay ipinapakita sa buhay ni Pablo sa 2 Corinto. Malaking bahagi ng liham ang nagpapaliwanag at nagtatanggol sa ministeryo ni Pablo, dahil ang kawalan ng tiwala kay Pablo ay kaugnay ng pagtanggi sa ebanghelyong ipinangaral niya — nagbabala siya laban sa pagtanggap ng 'ibang Jesus' at 'ibang ebanghelyo.' Sa 1 Corinto, itinuro niyang ang salita ng krus ay kapangyarihan ng Diyos; sa 2 Corinto, ipinapakita niya kung paano lumilitaw ang kapangyarihang iyon sa kanyang mahinang buhay. Siya ay tulad ng <mark>marupok na sisidlang luwad</mark>, ngunit may taglay na kayamanan, upang maipakitang sa Diyos ang kapangyarihang kumikilos sa kanya. Ang 'kahinaan' ni Pablo ay hindi dahilan para sa kasalanan o pagpapabaya; ito ay tapat na buhay na umaasa sa Panginoon kung saan hindi ito makaaasa sa sariling lakas. Ikalima, ang layunin ng liham ay itayong muli ang iglesya sa ebanghelyo. Nagalak si Pablo sa pagsisisi, ngunit hindi nalutas ang bawat problema — nanatili ang maling turo, kasalanan, at kawalan ng tiwala kay Pablo. Kaya magkasamang lumilitaw sa iisang liham ang mainit na aliw at mahigpit na pagsaway. Habang binabasa natin ito, dapat nating itanong hindi kung sino ang mukhang mas malakas, kundi sa kaninong turo at buhay nahahayag ang ipinako at muling nabuhay na si Jesus."], "points": ["Ang kahinaan ni Pablo ay hindi dahilan para sa kasalanan, kundi katapatang umaasa sa Panginoon kung saan hindi ito makaaasa sa sariling lakas."]}, {"title": "Panimula · Kahit ang Isang Apostol ay Nawalan ng Pag-asang Mabuhay", "paragraphs": ["Kapag nahaharap tayo sa hirap, madalas nating isipin, 'Naniniwala ako sa Diyos — bakit napakahirap nito? Kulang ba ang aking pananampalataya?' Ngunit sa talata ngayon, ipinahayag ni apostol Pablo na siya'y nabigatan nang lampas sa kanyang lakas at <mark>nawalan pa ng pag-asang mabuhay</mark>. Kahit ang apostol na tinawag ng muling nabuhay na si Jesus ay nagkaroon ng ganoong panahon.", "At ang Pablo ring iyon ang pumupuri sa Diyos bilang <mark>'ang Diyos ng lahat ng kaaliwan.'</mark> Sa talata 3–7, sampung beses lumitaw ang salitang 'aliw.' Ano ang aliw na kanyang naranasan? Hinahawakan tayo ng Diyos sa pagdurusa at <mark>pinapangyaring palakasin natin ang iba sa aliw na ating natanggap</mark>. Ngayon, sama-sama nating titingnan ang aliw na umaapaw sa akin at ang aliw na dapat kong ipasa. Kapag mahirap, kanino ka umaasa? At kanino ipinapasa ngayon ang aliw na natanggap mo sa Diyos? Tingnan natin ang tatlong susing salita."], "points": ["Kanino ako umaasa kapag mahirap — at kanino dumadaloy ngayon sa pamamagitan ko ang aliw ng Diyos?"]}, {"title": "Talata 1–2 · Pagkakakilanlan: Tayo ay Pag-aari ng Diyos", "paragraphs": ["Sa simula ng liham, ipinahayag ni Pablo na siya'y naging apostol ni Cristo Jesus <mark>'sa kalooban ng Diyos.'</mark> Ang apostol ay isinugo ni Cristo upang ipahayag ang Kanyang Salita. Hindi nagsimula ang misyon ni Pablo sa kanyang ambisyon o sa kasikatan sa tao; tinawag at isinugo siya ng Diyos. Kasama ang kanyang kamanggagawang si Timoteo, binati ni Pablo ang iglesya sa Corinto at ang mga banal sa buong Acaya. Pansinin ang pariralang <mark>'ang iglesya ng Diyos.'</mark> Napakaraming alitan at problema sa iglesya sa Corinto, at may sakit sa relasyon nito kay Pablo. Gayunman, tinawag sila ni Pablo na iglesya ng Diyos. Sinimulan niya ang liham mula sa katotohanang sila'y pag-aari ng Diyos. Ang 'mga banal' ay hindi tumutukoy sa iilang natatanging tao; ibig sabihin nito ay mga ibinukod upang maging pag-aari ng Diyos. Dahil natanggap nila ang biyayang iyon, dapat na silang mamuhay bilang mga taong pag-aari Niya. Kapag nahaharap tayo sa mga paghihirap, madaling hatulan ang ating halaga batay sa ating kalagayan. Kapag maayos ang takbo, pakiramdam natin ay iniibig tayo ng Diyos; kapag nagkakagulo, pakiramdam natin ay pinabayaan tayo. Ngunit alalahanin muna: <mark>ikaw at ako ay pag-aari ng Diyos kay Cristo.</mark>", "Sa talata 2, hinihiling ni Pablo para sa kanila ang <mark>biyaya at kapayapaan</mark> mula sa Diyos na ating Ama at sa Panginoong Jesu-Cristo. Ang biyaya ay hindi gantimpalang nakakamit natin sa paggawa nang mabuti; ito ay pag-ibig na libreng ibinigay ng Diyos kay Cristo. Ang kapayapaan ay ang kaginhawahang tinatamasa ng mga nakipagkasundo sa Diyos sa pamamagitan ng biyayang iyon. Ito mismo ang kailangan ng iglesyang may alitan. Dapat nating alalahanin na ako rin ay taong nangangailangan ng biyaya — at ang taong ayaw ko, ang taong kinasasamaan ko ng loob, ay namumuhay rin sa iisang biyaya. Saka lamang magbabago ang ating mga salita at saloobin sa isa't isa."], "points": ["Ang unang tanong na nagtatayo ng komunidad ay hindi 'Sino ang kakampi ko?' kundi 'Kanino tayo nabibilang?'"]}, {"title": "Talata 3–4 · Aliw: Umaaliw Tayo sa Aliw na Ibinibigay ng Diyos", "paragraphs": ["Sa talata 3, pinupuri ni Pablo ang Diyos bilang <mark>'Ama ng mga kahabagan at Diyos ng lahat ng kaaliwan.'</mark> Tingnan ang pagkakasunod: ipinaliliwanag ni Pablo kung gaano kahirap ang mga bagay sa talata 8, ngunit bago iyon, sa talata 3, ipinahayag niya kung sino ang Diyos. Inilalagay niya ang pamantayan ng pagtingin sa kanyang pagdurusa sa harap ng katangian ng Diyos. Hindi ang Diyos ang Isang walang pakialam na nanonood sa Kanyang mga anak na nagdurusa; Siya ay espirituwal na Amang nahahabag at tunay na nag-aalaga sa kanila. Ang salitang Griyego para sa aliw, <i>paraklēsis</i>, ay nangangahulugan dito hindi lamang ng pagpapagaan ng dalamhati kundi ng <mark>tulong na humahawak at nagpapalakas-loob sa atin upang tiisin ang kapighatian</mark>. Minsan, iniligtas tayo ng Diyos mula sa krisis. Minsan, hinahawakan Niya tayo upang hindi natin bitawan ang pananampalataya habang nagpapatuloy ang pagdurusa. Kaya hindi natin maipapasyang walang aliw mula sa Diyos dahil lamang hindi pa nagbabago ang ating kalagayan. Kung nakatagpo ka ng lakas na mabuhay ng isa pang araw sa gitna ng luha, o muling tumingin sa Diyos sa tulong ng iba, matatagpuan mo rin doon ang aliw ng Diyos.", "Sa talata 4, dapat nating ibukod ang 'kami' at 'kayo' — napakahalaga nito. Sa bahaging ito, ang 'kami' na nagdurusa at inaaliw ay tumutukoy muna kay Pablo mismo o sa mga ministrong kasama niya; ang 'kayo' sa talata 6 ay ang mga mananampalataya sa Corinto. Ipinaliliwanag ni Pablo kung paano dumadaloy sa mga mananampalataya ang aliw na ibinigay sa kanya. Inaaliw ng Diyos si Pablo sa lahat ng kanyang kapighatian, at sa aliw na iyon ay pinapangyari Niyang maaliw ni Pablo ang mga nasa anumang kapighatian. May layunin ang aliw: dapat itong dumaloy. Mahalaga, hindi ginagawang mabuting mang-aaliw ng isang tao ang basta pagdanas ng maraming pagdurusa. Maaaring lalong masugatan ng pagdurusa ang puso; maaari nating sabihing, 'Mas mahirap ang sa akin — bakit hindi mo kayang tiisin iyan?' Sinasabi ni Pablo na umaaliw tayo <mark>'sa pamamagitan ng aliw na tinanggap natin mula sa Diyos'</mark> — inaaliw ang iba sa awa ng Diyos na nahabag sa atin. Kaya kapag umaaliw ka sa isang tao, sa halip na magsalita nang mahaba tungkol sa sarili mong karanasan, <mark>pakinggan muna ang kanyang kuwento</mark>. Kahit nakaranas ka ng katulad, hindi mo alam ang lahat ng kanyang sakit. Ang sakit na naranasan ko ang pakiramdam ko'y pinakamalaking sakit — kaya ang sakit na nararanasan ng taong iyon ang pinakamasakit para sa kanya. Kung paanong nanatili ang Diyos sa tabi mo at sa akin, dapat din tayong makapanatili sa tabi nila."], "points": ["May layunin ang aliw — ang dumaloy. Kung paanong nanatili ang Diyos sa tabi ko, mananatili rin ako sa tabi nila."]}, {"title": "Talata 5–7 · Umaapaw na Pagdurusa at Umaapaw na Aliw ay Nagpapatibay sa Isa't Isa", "paragraphs": ["Talata 5: <mark>'Sapagkat kung paanong sagana tayong nakikibahagi sa mga pagdurusa ni Cristo, gayundin sa pamamagitan ni Cristo ay sagana tayong nakikibahagi sa aliw.'</mark> Sa pangangaral ng ipinakong si Jesus, naranasan ni Pablo ang pagtanggi at pag-uusig. Bilang pag-aari ni Cristo at naglilingkod sa Kanya, nakibahagi siya sa pagdurusa. Hindi ito nangangahulugang kulang ang pagtubos ni Jesus at pinupunan ito ni Pablo. Si Jesus ang nagsakatuparan ng kaligtasan; nagdusa si Pablo sa proseso ng pagpapahayag ng ebanghelyong iyon — iyon ang kanyang krus. Ngunit hindi lamang pagdurusa ang umapaw sa buhay ni Pablo. Ipinahayag niyang umapaw din ang aliw sa pamamagitan ni Cristo. May kapighatiang dumadagan sa kanya, at kasabay nito ay ang Panginoong humahawak sa kanya. Hindi rin natin dapat tingnan lamang ang ating pagdurusa kundi pati <mark>ang biyaya ng Diyos na humahawak sa atin kay Cristo</mark>.", "Sa talata 6, lalong lumilinaw ang ugnayan ng 'kami' at 'kayo.' Sinasabi ni Pablo na kung kami ay pinahihirapan, ito ay para sa inyong aliw at kaligtasan; at kung kami ay inaaliw, ito ay para sa inyong aliw. Dahil tiniis ni Pablo ang pagdurusa upang ipangaral ang ebanghelyo, narinig ng mga mananampalataya ang salita ng kaligtasan. At dahil ipinapasa niya ang aliw na natanggap niya sa Diyos, napatitibay ang mga mananampalataya sa pananampalataya. Hindi humihinto si Pablo sa 'Unawain ninyo kung gaano kahirap para sa akin.' Ipinaliliwanag niya kung paano nakikinabang ang mga mananampalataya sa kanyang kapighatian at aliw. Ano ang pakinabang na iyon? <mark>Nagiging kaya nilang tiisin ang parehong mga pagdurusa.</mark> Nahahayag ang aliw bilang pagtitiis ng pananampalataya. Ang 'pakikibahagi sa parehong mga pagdurusa' ay hindi nangangahulugang pare-parehong pangyayari ang nararanasan ng lahat; ibig sabihin, sa landas ng pagiging pag-aari ni Cristo, pinagsasaluhan natin kapwa ang pagdurusa at ang aliw ng Diyos. Kaya sinasabi ni Pablo na matatag ang kanyang pag-asa para sa kanila, sapagkat naniniwala siyang hahawakan sila ng Diyos gaya ng paghawak Niya sa kanya."], "points": ["Ang aliw na umaapaw sa akin ay dapat dumaloy bilang paglilingkod na umaalalay sa pananampalataya ng iba."]}, {"title": "Talata 8–11 · Pag-asa: Nagtitiwala Lamang sa Diyos na Bumubuhay sa mga Patay", "paragraphs": ["Sa talata 8, nagsasalita si Pablo tungkol sa kapighatiang naranasan niya sa Asia — isang lalawigan ng Roma na kinabibilangan ng Efeso. Hindi natin matitiyak mula sa talata kung ano mismo ang nangyari, ngunit malinaw kung gaano ito kabigat: <mark>'lubha kaming nabigatan nang lampas sa aming lakas kaya nawalan kami ng pag-asang mabuhay.'</mark> Hindi laging malakas ang mga apostol. Inamin ni Pablo ang kanyang mga limitasyon, at hindi niya ito itinago sa mga mananampalataya. Kaya hindi natin dapat kailanman basta sabihin sa nagdurusa, 'Kung may pananampalataya ka, dapat kaya mo ito.' Ang pananampalataya ay hindi pagkukunwaring hindi ito mahirap. Ito ay pag-amin na sobra na ito at paghingi ng tulong sa Diyos. Talata 9: <mark>'Sa katunayan, nadama naming natanggap namin ang hatol ng kamatayan. Ngunit iyon ay upang hindi kami umasa sa aming sarili kundi sa Diyos na bumubuhay sa mga patay.'</mark> Labis na desperado si Pablo kaya nadama niyang walang matatakasan ang kamatayan. Gayunman, sa pagbabalik-tanaw, ipinahayag niyang pinapangyari ng Diyos na hindi siya umasa sa sarili kundi sa Diyos na bumubuhay sa mga patay. Ito ang mahalagang pagbabago sa talata: ang aliw sa talata 3–7 ay nagiging kongkreto bilang pagtitiwala sa Diyos. Ang pagiging inaliw ng Diyos ay hindi nangangahulugang kaya na nating gawin muli ang lahat nang mag-isa; ibig sabihin, mas malinaw na nating nakikita kung kanino tayo dapat umasa. Tumitingin si Pablo lalo na sa Diyos na bumubuhay sa mga patay — na makapagbibigay ng buhay kahit kung saan nagtatapos ang kakayahan ng tao, ang Diyos na bumuhay kay Jesus mula sa kamatayan — at ipinagkatiwala sa Kanya ang kanyang buhay. Kanino mo ipinagkakatiwala ang iyong buhay? Ngunit hindi natin dapat ilapat nang pabaya ang pagpapahayag na ito sa iba. Walang batayan upang sabihing, 'Nagdurusa ka dahil mapagmataas ka.' Ipinapahayag ni Pablo ang layunin ng Diyos ayon sa kanyang naranasan; dapat muna nating suriin kung saan tayo mismo umaasa.", "Sa talata 10–11, inilalagay ni Pablo ang kanyang pag-asa sa Diyos na nagligtas sa kanya noon, para rin sa hinaharap: <mark>'Iniligtas Niya kami… at ililigtas Niya kami.'</mark> Hindi niya sinasabing wala nang hirap; sinasabi niyang patuloy niyang kakailanganin ang pagliligtas ng Diyos. At hiniling niya sa mga mananampalataya na tulungan siya sa pananalangin. Bakit humihingi ng tulong sa tao si Pablo na umaasa sa Diyos? Dahil kumikilos din ang Diyos sa pamamagitan ng mga panalangin ng Kanyang bayan. Ang buhay na umaasa sa Diyos ay dapat ding may kababaang-loob na tumanggap ng tulong ng isa't isa. Kanina, dumaloy sa mga mananampalataya ang aliw na natanggap ni Pablo; ngayon, ang mga panalangin ng mga mananampalataya ang tumutulong kay Pablo. Siya ay kapwa nagbibigay ng aliw at nangangailangan ng panalangin. Ang 'pagpapalang ipinagkaloob' dito, ayon sa konteksto, ay ang mapagbiyayang kaloob ng pagliligtas at tulong ng Diyos. Marami ang nananalangin, nakararanas ng biyayang iyon, at sama-samang nagpapasalamat sa Diyos. May alitan sa pagitan ni Pablo at ng mga mananampalataya, ngunit ibinahagi niya ang kanyang hirap at humingi ng panalangin. Ang relasyong natigil sa paghuhusga sa isa't isa ay maaaring sumulong tungo sa sama-samang pag-asa sa Diyos. Ang papuri ni Pablo na nagsimula sa talata 3 ay humahantong sa pasasalamat ng marami sa talata 11."], "points": ["Sa iglesya, walang tanging nagbibigay lamang ng tulong at walang tanging tumatanggap lamang; lahat ay tumatanggap ng biyaya at tumutulong sa isa't isa."]}, {"title": "Aplikasyon · Aliw na Umaapaw sa Akin, Aliw na Dapat Kong Ipasa", "paragraphs": ["Ang sentro ng Salita ngayon ay <mark>ang aliw na umaapaw sa akin at ang aliw na dapat kong ipasa</mark>. Minsan, inaalis ng Diyos ang pagdurusa, ngunit hinahawakan din Niya tayo sa gitna nito at tinutulungang magtiis. Kung ngayon ay nakatagpo ka ng lakas na mabuhay sa gitna ng luha, o muling tumingin sa Diyos sa tulong ng iba, naroon ang aliw ng Diyos.", "Hindi dapat huminto sa loob ko ang aliw na iyon. Mag-isip ng isang taong dumaraan sa hirap ngayon. Bago magpayo o magkuwento ng sarili mong karanasan, <mark>pakinggan muna nang buo ang kanyang kuwento</mark>. Ang maikling mensahe ng pangungumusta, ang sabay na pagkain, ang isang tiyak na linya ng panalangin ay maaaring maging daluyan ng aliw na natanggap mo sa Diyos.", "At kung ikaw mismo ay nangangailangan ng tulong, huwag itong itago. Tulad ni Pablo, ang paghiling na <mark>'Tulungan ninyo ako sa inyong mga panalangin'</mark> ay kababaang-loob din ng pag-asa sa Diyos. Aminin na higit ito sa kaya mong pasanin, at ipagkatiwala ang iyong buhay sa Diyos na bumubuhay sa mga patay.", "Kanino, at sa anong kilos, mo ipapasa ngayon ang aliw na natanggap mo sa Diyos?"], "points": ["Ngayon, ipapasa ko sa isang tao ang aliw na natanggap ko mula sa Diyos ng lahat ng kaaliwan."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Hindi ko hinusgahan ang aking halaga o ang pag-ibig ng Diyos batay sa mahirap na kalagayan, kundi inalala kong pag-aari ako ng Diyos."}, {"key": "c2", "text": "Kahit hindi nagbabago ang aking kalagayan, hinanap ko ang aliw ng Diyos na humawak sa akin."}, {"key": "c3", "text": "Pinag-isipan ko kung nakinig muna ako, sa halip na magsimula sa sarili kong karanasan, nang umaliw ako sa iba."}, {"key": "c4", "text": "Sinuri ko kung may kababaang-loob akong humingi ng panalangin sa halip na magtago kapag kailangan ko ng tulong."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Anong aliw ang kamakailan kong natanggap sa Diyos, at kanino at paano ko ito ipapasa ngayon?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Alalahanin ang Aliw", "value": "Isulat ang isang aliw mula sa Diyos na humawak sa iyo sa kamakailang hirap, at magpasalamat"}, {"key": "act2", "label": "Makinig Muna", "value": "Kontakin ang isang taong nasa hirap at pakinggan nang buo ang kanyang kuwento sa halip na magpayo"}, {"key": "act3", "label": "Ipasa Ito", "value": "Ipasa ang aliw sa pamamagitan ng mensahe ng pangungumusta, sabay na pagkain, o isang tiyak na linya ng panalangin"}, {"key": "act4", "label": "Humingi ng Panalangin", "value": "Ibahagi sa mapagkakatiwalaang tao ang pasaning mag-isa mong dinadala at hilingin na ipanalangin ka"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang 2 Corinto 1:4 at pag-isipan kung saan dapat dumaloy ang aliw na natanggap mo"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Ama ng mga kahabagan at Diyos ng lahat ng kaaliwan, sa paghawak sa akin sa kapighatian at sa pagliligtas sa akin — at pangakong ililigtas ako — sa kapangyarihang bumubuhay sa mga patay."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa paghuhusga sa Iyong pag-ibig batay sa aking kalagayan, sa pagsasarili ng Iyong aliw, at sa pabayang pagsasalita sa mga nagdurusa."}, {"key": "p3", "tag": "Kahilingan", "text": "Tulungan Mo akong umasa hindi sa aking sarili kundi sa Iyo lamang, aliwin ang mga nasa kapighatian sa aliw na natatanggap ko mula sa Iyo, at maging bahagi ng komunidad na nagtutulungan sa panalangin."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-11-01';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
