<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>만나 큐티</title>
<meta property="og:title" content="10/18(주일) 큐티 · 야고보서 2:1–13">
<meta property="og:description" content="나는 무엇을 보고 사람을 대합니까?">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<div class="top">

      <button data-lang="ko">한국어</button><button data-lang="en">English</button><button data-lang="tl">Tagalog</button>
    </span>
    <span class="fs"><span id="fontLabel">글자</span> <button data-f="f1"><b>가</b></button><button data-f="" class="on"><b>가</b></button><button data-f="f3"><b>가</b></button></span>
  </div>
</div>

<header>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "10월 18일 주일", "ref": "야고보서 2장 1–13절", "headline": "나는 무엇을 보고<br>사람을 대합니까?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 야고보서 2:1-13", "s1heading": "오늘의 말씀", "verse": "\"내 형제들아 영광의 주 곧 우리 주 예수 그리스도를<br>믿는 믿음을 너희가 가졌으니<br>사람을 차별하여 대하지 말라\"", "verseRef": "야고보서 2:1", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 말씀을 행하는가, 세상의 기준을 따르는가", "paragraphs": ["앞에서 야고보는 참된 경건이 혀를 다스리고 어려운 이웃을 돌보며 세상 가치에 물들지 않는 삶으로 드러난다고 했습니다. 오늘 본문은 그 가르침을 공동체 안의 한 장면으로 가져옵니다. 부유해 보이는 사람과 가난한 사람이 모임에 들어왔는데, 성도들이 두 사람을 다르게 대합니다. 차려입은 사람을 친절하게 맞은 것이 문제가 아니라, <mark>가난한 사람에게 마땅히 주어야 할 존중을 주지 않은 것</mark>이 문제입니다.", "처음엔 무심하다가 그 사람의 직업이나 형편을 알고 난 뒤 태도가 달라진 적은 없습니까? 그때 달라진 것은 그 사람이 아니라 <mark>그를 바라보는 내 평가</mark>입니다. 예수님을 믿는다는 것은 사람을 바라보는 눈도 주님께 배우는 것입니다."], "points": ["나는 사람에게서 무엇을 보고 있으며, 그 때문에 누구를 가까이하고 누구를 지나치고 있습니까?"]}, {"title": "1–4절 · 영광의 주님을 믿는 사람은 외모로 차별하지 않습니다", "paragraphs": ["야고보는 차별을 말하기 전에 먼저 우리가 누구를 믿는지 말합니다. <mark>\"영광의 주 곧 우리 주 예수 그리스도\"</mark>입니다. 그분을 주님으로 고백하면 사람을 대하는 기준도 그분의 다스림을 받아야 합니다. 금가락지와 아름다운 옷을 입은 사람에게는 \"좋은 자리에 앉으소서\", 남루한 옷을 입은 가난한 사람에게는 \"거기 서 있든지 내 발등상 아래에 앉으라\". 입으로 고백하는 주님과 생활에서 높이는 기준이 달랐던 것입니다.", "야고보는 이것을 <mark>\"악한 생각으로 판단하는 자\"</mark>가 된 것이라고 책망합니다. 그 사람의 삶과 믿음과 어려움을 듣기도 전에 옷차림만 보고 대우를 정했기 때문입니다. 교회에서도 \"이분은 우리에게 도움이 되겠다\"는 생각이 앞서면, 어느새 사람을 사랑할 대상이 아니라 사역에 필요한 자원으로 보게 됩니다."], "points": ["'이 사람이 우리에게 무엇을 해 줄 수 있을까?'보다 '우리가 이 사람을 어떻게 사랑할까?'를 물어야 합니다."]}, {"title": "5–7절 · 하나님이 귀하게 여기시는 가난한 사람을 업신여기지 말라", "paragraphs": ["<mark>\"하나님이 세상에 대하여는 가난한 자를 택하사 믿음에 부요하게 하시고 … 약속하신 나라를 상속으로 받게 하지 아니하셨느냐\"</mark>. 가난하면 자동으로 구원받는다는 뜻은 아니지만, 세상이 낮게 평가하는 사람에게도 하나님은 자신의 나라를 약속하십니다. 그런데 성도들은 <mark>\"도리어 가난한 자를 업신여겼도다\"</mark>. 하나님이 상속자로 삼으신 사람을 낮추었습니다. 도움을 주면서 그 사람의 말을 무시하거나 도움받는 일을 부끄럽게 만든다면, 우리의 긍휼을 다시 살펴야 합니다.", "야고보는 성도들을 억압하고 법정으로 끌고 가는 부자들을 언급합니다. 모든 부자가 악하다는 뜻이 아니라, 자신들을 괴롭히는 사람의 지위에는 고개를 숙이면서 비슷한 형편의 가난한 사람은 낮추는 모순을 지적하는 것입니다. 영향력이 크고 재정적으로 많이 돕는다는 이유로 <mark>그 사람의 거친 말이나 부당한 행동을 가볍게 넘기고 있지는 않습니까?</mark>"], "points": ["필요를 돕는 일과 존엄을 존중하는 일은 함께 가야 합니다. 하나님이 귀하게 여기시는 사람을 우리도 귀하게 대해야 합니다."]}, {"title": "8–13절 · 이웃 사랑의 법대로 말하고 행하며 긍휼을 베풀라", "paragraphs": ["<mark>\"네 이웃 사랑하기를 네 몸과 같이 하라\"</mark>는 최고의 법입니다. 여기서 이웃은 말이 잘 통하고 내게 도움이 되는 사람으로 제한되지 않습니다. 바로 그 남루한 옷을 입고 들어온 사람이 사랑해야 할 이웃입니다. 그래서 <mark>\"사람을 차별하여 대하면 죄를 짓는 것\"</mark>입니다. 더 친한 사람은 있을 수 있지만, 친밀함의 차이가 누군가를 낮추어 대할 권리를 주지는 않습니다. 간음하지 말라 하신 하나님이 살인하지 말라고도 하셨듯, 내가 중요하게 여기는 명령만 지키고 이웃 사랑은 가볍게 여길 수 없습니다.", "4절에서 우리는 사람의 가치를 정하는 재판관처럼 행동했지만, 12절은 <mark>우리 자신도 심판받을 사람</mark>임을 일깨웁니다. 우리는 이웃의 가치를 결정하는 사람이 아니라, 그 이웃을 어떻게 대했는지 하나님께 대답할 사람입니다. <mark>\"긍휼을 행하지 아니하는 자에게는 긍휼 없는 심판이 있으리라 긍휼은 심판을 이기고 자랑하느니라\"</mark>. 긍휼을 베풀어 구원을 사는 것이 아니라, 긍휼을 받은 믿음이 다른 사람을 향한 긍휼로 나타나는 것입니다."], "points": ["열심히 하는 신앙생활을 내세워 고치지 않고 있는 태도는 무엇입니까? 하나님의 긍휼을 바라는 사람은 외면하던 이웃에게도 긍휼을 베풀도록 부름받았습니다."]}, {"title": "적용 · 주님의 눈으로 사람을 보고, 곁자리를 내어 주십시오", "paragraphs": ["오늘 본문의 사람들은 금가락지와 화려한 옷을 보고 그 사람이 앉을 자리를 정했습니다. 야고보는 그들의 시선을 먼저 <mark>영광의 주 예수 그리스도께로</mark> 돌립니다. 예수님은 사람들이 잠잠하라고 꾸짖던 맹인 바디매오의 부르짖음 앞에서 걸음을 멈추셨습니다. 또한 부유한 세리장 삭개오의 집에도 들어가셨는데, 그의 부를 높여 주기 위해서가 아니라 잃어버린 사람을 구원하시기 위해서였습니다. 주님을 만난 삭개오는 재산을 가난한 이웃과 나누고 부당하게 빼앗은 것을 갚겠다고 했습니다.", "<mark>주님은 가난한 사람을 지나치지 않으셨고, 부유한 사람의 죄에도 침묵하지 않으셨습니다</mark>. 사람을 사랑하시며 회복의 길로 이끄셨습니다. 그 주님이 십자가에서 우리 죄를 담당하시고 부활하셨습니다. 우리가 주님께 받아들여진 것도 가진 것이 많거나 쓸모 있는 사람이어서가 아니라 주님의 긍휼 때문입니다.", "오늘 교회도 사람의 수와 재정과 영향력을 중요하게 여기다 보면 정작 한 사람의 생명을 놓칠 수 있습니다. 교회가 성장하기를 바라면서도 누군가는 그 안에서 <mark>'나는 중요하지 않은 사람'</mark>이라고 느끼게 할 수 있습니다. 공동체에는 함께 지내기 어려운 사람도 있습니다. 필요한 권면과 경계는 세워야 하지만, 그를 무가치한 사람으로 단정하고 밀어내서는 안 됩니다. 우리 역시 하나님의 오래 참으심과 긍휼이 필요한 사람들이기 때문입니다.", "그래서 이번 주에는 한 사람에게 구체적으로 다가가면 좋겠습니다. 늘 인사하던 사람만 만나지 말고 <mark>혼자 있는 분에게 먼저 말을 걸어 보십시오</mark>. 거리를 두기로 작정한 분에게 먼저 가볍게 인사를 건네 보십시오. 도움이 필요한 분이 있다면 공개적으로 부담을 주기보다 조용히 형편을 묻고 감당할 수 있는 도움을 나누십시오. 지위 때문에 다르게 대했던 일이 떠오른다면 그 관계에서도 태도를 바꾸십시오. 회개는 사람을 대하는 방식에서도 드러나야 합니다."], "points": ["주님이 긍휼로 나를 받아 주셨다면, 나는 이번 주 누구에게 나의 곁자리를 내어 주겠습니까?"]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "상대의 직업이나 형편을 알고 난 뒤 내 태도가 달라진 적은 없는지 돌아봤다"}, {"key": "c2", "text": "교회나 일터에서 사람을 '사랑할 대상'이 아니라 '도움이 될 자원'으로 보고 있지 않은지 점검했다"}, {"key": "c3", "text": "영향력 있는 사람의 잘못은 가볍게 넘기고, 약한 사람의 말은 쉽게 흘려듣고 있지 않은지 돌아봤다"}, {"key": "c4", "text": "내가 거리를 두거나 무가치하다고 단정해 버린 사람이 있는지 하나님 앞에서 점검했다"}], "s4heading": "묵상 한 줄", "memoHint": "이번 주 내가 곁자리를 내어 주어야 할, 그동안 지나쳤던 한 사람은 누구입니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "혼자 있는 분께", "value": "교회나 모임에서 혼자 있는 분에게 먼저 다가가 말을 걸고 이름을 기억하기"}, {"key": "act2", "label": "먼저 인사", "value": "내가 거리를 두기로 마음먹었던 한 사람에게 먼저 가볍게 인사 건네기"}, {"key": "act3", "label": "조용한 긍휼", "value": "도움이 필요한 분의 형편을 조용히 묻고, 부담 주지 않는 방식으로 할 수 있는 도움 나누기"}, {"key": "act4", "label": "태도 바꾸기", "value": "지위나 형편 때문에 다르게 대했던 관계 하나를 떠올리고 오늘 그 사람을 존중으로 대하기"}, {"key": "act5", "label": "말씀 암송", "value": "야고보서 2:1을 외우며 영광의 주님을 믿는 눈으로 사람을 바라보기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "가진 것이나 쓸모 때문이 아니라 오직 긍휼로 우리를 받아 주시고, 십자가에서 우리 죄를 담당하신 영광의 주 예수님께 감사합니다"}, {"key": "p2", "tag": "회개", "text": "영광의 주님을 믿는다 고백하면서도 옷차림과 지위로 사람을 판단하고, 도움이 될 사람만 가까이하며 약한 이웃을 지나쳤던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "주님의 눈으로 사람을 보게 하시고, 이번 주 혼자 있는 이에게 다가가 곁자리를 내어 주며, 긍휼로 심판을 이기는 삶을 살게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "October 18, Lord's Day", "ref": "James 2:1–13", "headline": "What Do I See<br>When I Treat People?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · James 2:1-13", "s1heading": "Today's Word", "verse": "\"My brothers, show no partiality<br>as you hold the faith in our Lord Jesus Christ,<br>the Lord of glory.\"", "verseRef": "James 2:1", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · Are We Doing the Word, or Following the World's Standards?", "paragraphs": ["In the previous passage, James urged us not merely to hear the Word but to do it. True religion, he said, shows itself in bridling the tongue, caring for neighbors in need, and staying unstained by the world's values. Today's passage brings that teaching into a single scene within the community. A rich-looking person and a poor person enter the gathering, and the believers treat them differently. A community taught to care for struggling neighbors was looking down on the poor person who had come among them. Warmly welcoming the well-dressed person isn't the problem. <mark>The problem is failing to give the poor person the respect he was due.</mark>", "Through this, James asks: Are you doing the Word — or following the world's standards even inside the church? We should reflect too. Have you ever treated someone indifferently at first, and then changed your attitude after learning their job or situation? Or do you easily brush off the words of someone who seems unlikely to benefit you? <mark>It isn't the person who changed — it's my evaluation of them.</mark> Believing in Jesus means learning from the Lord how to see people, too. Like Jesus, who approached those others passed by, we must look at the neighbors before us anew, with His eyes and His heart."], "points": ["What am I seeing in people — and because of it, whom do I draw near to and whom do I pass by?"]}, {"title": "Verses 1–4 · Those Who Believe in the Lord of Glory Don't Show Favoritism by Appearance", "paragraphs": ["In verse 1, before addressing favoritism, James first speaks of whom we believe in: <mark>\"our Lord Jesus Christ, the Lord of glory.\"</mark> The command not to show partiality starts from faith in Jesus. If we confess Him as Lord, our standard for treating people must also come under His rule. 'Appearance' here means more than facial features; in what follows, clothing and jewelry — and the wealth and social status they reveal — are the issue. The believers confessed faith in the Lord of glory, yet in practice their hearts were captured by those who looked rich. The Lord they confessed with their lips and the standard they honored in life were different. Faith in Christ and how we treat our neighbors cannot be separated.", "In verses 2–3, two people enter the same meeting. One wears a gold ring and fine clothing; the other is poor, in shabby clothes. The believers pay attention to the well-dressed man and say, <mark>\"You sit here in a good place,\"</mark> but tell the poor man, <mark>\"You stand over there,\" or \"Sit down at my feet.\"</mark> Favoritism doesn't only show up as distant, large-scale problems. It shows in whom we notice, what tone we use, and where we seat people. Picture it in daily life: you greet a newcomer briefly and are about to turn away when someone mentions that he runs a large company or is well known — and suddenly you want to talk longer. Or someone comes in financial need, and your first thought is, 'I'm busy.' It's not that you necessarily acted this way, but let's examine where our hearts move. To whose visit do we react strongly, and to whose presence are we indifferent? What a church admires shows what it values.", "In verse 4 James rebukes this as becoming <mark>\"judges with evil thoughts.\"</mark> Before hearing how either person had lived, what they believed, or what they were struggling with, the believers decided how to treat them by their clothes alone. In church, too, we may think, 'This person would be helpful to us.' But when that thought comes first, we can start viewing people as resources for ministry rather than people to love. Ministry leaders and those who serve newcomers especially should examine themselves. Discerning gifts and responsibilities for particular roles is necessary — but there's a respect owed to every person regardless of role, and it must not vary by wealth, status, or ability. Where I give my attention and offer my seat reveals the standard of my faith."], "points": ["Rather than asking, 'What can this person do for us?' we must ask, 'How can we love this person?'"]}, {"title": "Verses 5–7 · Don't Dishonor the Poor Whom God Honors", "paragraphs": ["In verse 5, James directs believers to God's choice: <mark>\"Has not God chosen those who are poor in the world to be rich in faith and heirs of the kingdom, which He has promised to those who love Him?\"</mark> Those the world ignores for having little are heirs of God's kingdom. One's economic situation doesn't explain everything about a person. Of course, this doesn't mean the poor are automatically saved and the rich excluded; the text speaks of the promise given to those who love God. But the challenge is clear: God promises His kingdom even to those the world rates low. That's why the church must not simply adopt the world's evaluations. A community that believes in God's kingdom must see people by a different standard.", "Yet verse 6 says, <mark>\"But you have dishonored the poor man.\"</mark> God made him an heir of the kingdom, but the believers lowered him. They proclaimed God's promise but didn't give the respect fitting that promise within their community. This applies to helping the poor and to relief work on the mission field. If we give material help while ignoring a person's voice or making them ashamed to receive help, we must examine our attitude. Compassion doesn't stop at pity that keeps someone in a low place; meeting needs and honoring dignity must go together. Also, having experienced hardship doesn't automatically make us understand others. Someone who was once looked down on may, once things improve, look down on others. Our own wounds lead to compassion only when they come under the Word's rule.", "In verses 6–7, James mentions the rich who oppress believers and drag them into court. He isn't saying all rich people are evil; he's addressing the conduct of wealthy people who were oppressing the believers then. Even while suffering that oppression, the believers still prized wealth itself — bowing to the status of those who tormented them while lowering the poor in situations like their own. The church today must examine itself too: Because someone has great influence or gives a lot financially, do we take their harsh words or unjust behavior lightly? We must love the rich as well. But we must not, in the name of love, cover their wrongs or ignore the pain of the weak to keep them. We are people called by the name of Jesus; how we protect our community must be worthy of that name."], "points": ["When we honor those God honors, our confession of faith in God's kingdom becomes the life of our community."]}, {"title": "Verses 8–13 · Speak and Act by the Law of Love, and Show Mercy", "paragraphs": ["In verses 8–9 James sets out the command: <mark>\"You shall love your neighbor as yourself\"</mark> — the royal law Jesus also emphasized. Just as I want to be respected, respect them; just as I hope someone will notice my hardship, notice theirs. A neighbor isn't limited to people I get along with or who benefit me. In this text, the very person who came in wearing shabby clothes is the neighbor to be loved. So James says plainly: <mark>\"If you show partiality, you are committing sin.\"</mark> It can't be dismissed as a matter of personality or taste. Everyone has closer friends, but differences in closeness give no right to treat others as lesser. Even those who disagree with us deserve respect, and even when correcting wrong behavior, we must not strip a person of their dignity.", "Verse 10 says that whoever keeps the whole law but fails in one point has become guilty of all of it. This doesn't mean every sin has the same consequences or weight. Verse 11 explains: the God who said, 'Do not commit adultery,' also said, 'Do not murder.' Behind each command stands the same God. So I can't obey the commands I consider important and treat the command to love my neighbor lightly. We mustn't think of our faith like adding up points. Faithful worship attendance, service, and giving don't make it acceptable to despise someone. God speaks not only to the areas where we do well, but also to the relationships where we keep refusing to obey. 'What attitude are you refusing to change while pointing to how hard you work at your faith?'", "Verse 12 says, <mark>\"So speak and so act as those who are to be judged under the law of liberty.\"</mark> In verse 4 we acted like judges deciding people's worth; in verse 12 we realize that we ourselves will be judged before God. Remember this shift: we're not the ones who determine our neighbor's final worth; we're the ones who will answer to God for how we treated that neighbor. So the final judgment isn't just information about the distant future — it connects to whose words we listen to fully today, to whom we offer a seat, whose hardship we respond to. Verse 13 warns, <mark>\"For judgment is without mercy to one who has shown no mercy. Mercy triumphs over judgment.\"</mark> Mercy here goes beyond feeling sorry; it means honoring those we once looked down on, noticing their needs, and actually helping. We don't buy salvation by showing mercy — our hope is in the God who has mercy on us. But faith that receives that mercy must show itself in mercy toward others."], "points": ["Communities include people who are hard to be with. Necessary counsel and boundaries must be set, but we must not write someone off as worthless — we ourselves need God's patience and mercy."]}, {"title": "Application · See People with the Lord's Eyes, and Offer the Seat Beside You", "paragraphs": ["We began by asking: What do I see in people? The people in today's passage saw a gold ring and fine clothes, and decided where that person would sit. James first turns their gaze to <mark>the Lord of glory, Jesus Christ</mark>. Jesus stopped at the cry of blind Bartimaeus, whom the crowd rebuked and told to be quiet. He also entered the house of Zacchaeus, a rich chief tax collector — not to honor his wealth, but to save the lost. Having met the Lord, Zacchaeus said he would give to the poor and repay what he had unjustly taken.", "<mark>The Lord did not pass by the poor, nor was He silent about the sins of the rich.</mark> He loved people and led them on the path of restoration. That Lord bore our sins on the cross and rose again. We were accepted by Him not because we had much or were useful, but because of His mercy.", "The church today, too, can focus so much on numbers, finances, and influence that it loses sight of one person's life. We can want the church to grow while someone within it feels, <mark>'I don't matter here.'</mark> There will be people in community who are hard to be with — necessary counsel and boundaries must be set — but we must not judge them worthless and push them away, because we too need God's long-suffering and mercy.", "So this week, let's approach one person concretely. Don't only meet the people you always greet — <mark>speak first to someone who is alone</mark>. Offer a light greeting first to someone you'd decided to keep at a distance. If someone needs help, rather than putting them on the spot publicly, quietly ask about their situation and share what help you can. And if you recall treating someone differently because of status, change your attitude in that relationship. Repentance must show in how we treat people, too."], "points": ["If the Lord received me in mercy, to whom will I offer the seat beside me this week?"]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether my attitude has changed after learning someone's job or situation."}, {"key": "c2", "text": "I checked whether, at church or work, I see people as 'useful resources' rather than 'people to love.'"}, {"key": "c3", "text": "I reflected on whether I take influential people's wrongs lightly while easily brushing off the words of the weak."}, {"key": "c4", "text": "Before God, I checked whether there's someone I've kept at a distance or written off as worthless."}], "s4heading": "One-Line Reflection", "memoHint": "Who is one person I've passed by, to whom I should offer the seat beside me this week?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "To Someone Alone", "value": "At church or a gathering, approach someone who is alone, start a conversation, and remember their name"}, {"key": "act2", "label": "Greet First", "value": "Offer a light greeting first to someone you'd decided to keep at a distance"}, {"key": "act3", "label": "Quiet Mercy", "value": "Quietly ask about the situation of someone in need and share what help you can, without putting them on the spot"}, {"key": "act4", "label": "Change Your Attitude", "value": "Recall a relationship where you treated someone differently because of status, and treat them with respect today"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize James 2:1 and look at people with eyes of faith in the Lord of glory"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, Jesus, Lord of glory, for receiving us not because of what we have or how useful we are, but by mercy alone, and for bearing our sins on the cross."}, {"key": "p2", "tag": "Repent", "text": "I repent that while confessing faith in the Lord of glory, I judged people by appearance and status, drew near only to those who could help me, and passed by vulnerable neighbors."}, {"key": "p3", "tag": "Ask", "text": "Let me see people with Your eyes. This week, help me approach someone who is alone and offer the seat beside me, living a life in which mercy triumphs over judgment."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Oktubre 18, Araw ng Panginoon", "ref": "Santiago 2:1–13", "headline": "Ano ang Tinitingnan Ko<br>sa Pagtrato sa Tao?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Santiago 2:1-13", "s1heading": "Salita Ngayon", "verse": "\"Mga kapatid, huwag kayong magtangi ng tao<br>habang taglay ninyo ang pananampalataya<br>sa ating Panginoong Jesu-Cristo, ang Panginoon ng kaluwalhatian.\"", "verseRef": "Santiago 2:1", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Ginagawa Ba Natin ang Salita, o Sinusunod ang Pamantayan ng Mundo?", "paragraphs": ["Sa nakaraang bahagi, pinayuhan tayo ni Santiago na huwag lamang makinig sa Salita kundi gawin ito. Sinabi niyang ang tunay na relihiyon ay nakikita sa pagpigil sa dila, pag-aalaga sa nangangailangang kapwa, at pag-iingat na hindi madungisan ng pinahahalagahan ng mundo. Dinadala ng talata ngayon ang turong iyon sa isang eksena sa loob ng komunidad. Pumasok sa pagtitipon ang isang mukhang mayaman at isang mahirap, at magkaiba ang pagtrato sa kanila ng mga mananampalataya. Ang komunidad na tinuruang mag-alaga sa nahihirapang kapwa ay humahamak sa mahirap na pumasok sa gitna nila. Hindi problema ang mainit na pagtanggap sa taong maganda ang kasuotan. <mark>Ang problema ay ang hindi pagbibigay ng nararapat na paggalang sa mahirap.</mark>", "Sa pamamagitan nito, nagtatanong si Santiago: Ginagawa ba ninyo ang Salita — o sinusunod pa rin ang pamantayan ng mundo kahit sa loob ng iglesia? Dapat din tayong magnilay. Nakapagwalang-bahala ka na ba sa isang tao sa una, at pagkatapos ay nagbago ang iyong pakikitungo nang malaman mo ang kanyang trabaho o kalagayan? O madali mo bang binabalewala ang salita ng taong mukhang walang pakinabang sa iyo? <mark>Hindi ang tao ang nagbago — ang aking pagtatasa sa kanya.</mark> Ang paniniwala kay Jesus ay pag-aaral din mula sa Panginoon kung paano tumingin sa tao. Tulad ni Jesus na lumapit sa mga nilalampasan ng iba, dapat nating tingnang muli ang kapwang nasa harap natin, taglay ang Kanyang mata at puso."], "points": ["Ano ang nakikita ko sa tao — at dahil dito, sino ang nilalapitan ko at sino ang nilalampasan ko?"]}, {"title": "Talata 1–4 · Ang Naniniwala sa Panginoon ng Kaluwalhatian ay Hindi Nagtatangi Ayon sa Panlabas na Anyo", "paragraphs": ["Sa talata 1, bago talakayin ang pagtatangi, inuuna ni Santiago kung sino ang ating pinaniniwalaan: <mark>\"ang ating Panginoong Jesu-Cristo, ang Panginoon ng kaluwalhatian.\"</mark> Ang utos na huwag magtangi ay nagsisimula sa pananampalataya kay Jesus. Kung ipinapahayag natin Siya bilang Panginoon, dapat ding pumailalim sa Kanyang paghahari ang ating pamantayan sa pagtrato sa tao. Ang 'panlabas na anyo' dito ay higit pa sa itsura ng mukha; sa mga susunod na talata, ang kasuotan at alahas — at ang kayamanan at katayuang ipinapakita nito — ang isyu. Ipinapahayag ng mga mananampalataya ang pananampalataya sa Panginoon ng kaluwalhatian, ngunit sa gawa ay nabihag ang kanilang puso ng mga mukhang mayaman. Magkaiba ang Panginoong ipinapahayag ng kanilang labi at ang pamantayang pinararangalan nila sa buhay. Hindi mapaghihiwalay ang pananampalataya kay Cristo at ang pagtrato natin sa kapwa.", "Sa talata 2–3, dalawang tao ang pumasok sa iisang pulong. Ang isa ay may gintong singsing at magandang kasuotan; ang isa ay mahirap at gusgusin ang damit. Pinansin ng mga mananampalataya ang lalaking maganda ang suot at sinabing, <mark>\"Maupo ka rito sa magandang upuan,\"</mark> ngunit sinabi sa mahirap, <mark>\"Tumayo ka riyan,\" o \"Maupo ka sa paanan ko.\"</mark> Hindi lamang lumilitaw ang pagtatangi bilang malalaking problema sa malayo. Nakikita ito sa kung sino ang pinapansin natin, anong tono ang ginagamit natin, at saan natin pinauupo ang tao. Isipin ito sa araw-araw: maikli mong binati ang isang bagong dalo at aalis na sana nang may magsabing nagpapatakbo siya ng malaking kumpanya o kilala siya — at bigla mong gustong makipag-usap nang mas matagal. O may dumating na nangangailangan sa pananalapi, at ang una mong naisip ay, 'Abala ako.' Hindi naman sinasabing tiyak na ganito ang ginawa mo, ngunit suriin natin kung saan kumikilos ang ating puso. Sa pagdalaw ng sino tayo masigla, at sa presensya ng sino tayo walang pakialam? Ang hinahangaan ng iglesia ay nagpapakita kung ano ang pinahahalagahan nito.", "Sa talata 4, sinaway ito ni Santiago bilang pagiging <mark>\"mga hukom na may masamang pag-iisip.\"</mark> Bago marinig kung paano namuhay ang bawat isa, ano ang kanilang pinaniniwalaan, o ano ang kanilang pinagdaraanan, ipinasya na ng mga mananampalataya ang pagtrato sa kanila batay lamang sa kasuotan. Sa iglesia rin, maaari nating isipin, 'Makatutulong sa atin ang taong ito.' Ngunit kapag iyon ang nauuna, maaari nating simulang tingnan ang tao bilang mapagkukunan para sa ministeryo sa halip na taong iibigin. Lalo nang dapat suriin ang sarili ng mga pinuno ng ministeryo at mga naglilingkod sa mga bagong dalo. Kailangan ang pagkilala sa mga kaloob at pananagutan para sa partikular na tungkulin — ngunit may paggalang na nararapat sa bawat tao anuman ang tungkulin, at hindi ito dapat magbago ayon sa kayamanan, katayuan, o kakayahan. Ang pinag-uukulan ko ng pansin at binibigyan ng upuan ay naghahayag ng pamantayan ng aking pananampalataya."], "points": ["Sa halip na itanong, 'Ano ang magagawa ng taong ito para sa atin?' dapat nating itanong, 'Paano natin iibigin ang taong ito?'"]}, {"title": "Talata 5–7 · Huwag Hamakin ang Dukhang Pinararangalan ng Diyos", "paragraphs": ["Sa talata 5, itinuturo ni Santiago ang mga mananampalataya sa pagpili ng Diyos: <mark>\"Hindi ba pinili ng Diyos ang mga dukha sa sanlibutan upang maging mayaman sa pananampalataya at tagapagmana ng kaharian, na Kanyang ipinangako sa mga umiibig sa Kanya?\"</mark> Ang mga binabalewala ng mundo dahil kaunti ang pag-aari ay tagapagmana ng kaharian ng Diyos. Hindi naipapaliwanag ng kalagayang pang-ekonomiya ang lahat tungkol sa isang tao. Siyempre, hindi ito nangangahulugang awtomatikong ligtas ang dukha at hindi kasama ang mayaman; ang teksto ay tungkol sa pangakong ibinigay sa mga umiibig sa Diyos. Ngunit malinaw ang hamon: ipinapangako ng Diyos ang Kanyang kaharian maging sa mga mababa ang pagtingin ng mundo. Kaya hindi dapat basta tanggapin ng iglesia ang pagtatasa ng mundo. Ang komunidad na naniniwala sa kaharian ng Diyos ay dapat tumingin sa tao ayon sa ibang pamantayan.", "Ngunit sinasabi ng talata 6, <mark>\"Ngunit hinamak ninyo ang dukha.\"</mark> Ginawa siya ng Diyos na tagapagmana ng kaharian, ngunit ibinaba siya ng mga mananampalataya. Ipinahayag nila ang pangako ng Diyos ngunit hindi nagbigay ng paggalang na angkop sa pangakong iyon sa loob ng kanilang komunidad. Naaangkop ito sa pagtulong sa dukha at sa gawaing pagtulong sa larangan ng misyon. Kung nagbibigay tayo ng materyal na tulong habang binabalewala ang tinig ng tao o pinahihiya siya sa pagtanggap ng tulong, dapat nating suriin ang ating saloobin. Ang habag ay hindi humihinto sa awang nagpapanatili sa tao sa mababang lugar; magkasamang lumalakad ang pagtugon sa pangangailangan at paggalang sa dignidad. Gayundin, ang pagdaan sa hirap ay hindi awtomatikong nagpapaunawa sa atin sa iba. Ang taong minsang hinamak ay maaaring, kapag umayos na ang buhay, humamak din ng iba. Nagiging habag lamang ang ating mga sugat kapag pumailalim ang mga ito sa paghahari ng Salita.", "Sa talata 6–7, binanggit ni Santiago ang mga mayamang umaapi sa mga mananampalataya at kinakaladkad sila sa hukuman. Hindi niya sinasabing masama ang lahat ng mayaman; tinutukoy niya ang ugali ng mga mayamang umaapi sa mga mananampalataya noon. Kahit dumaranas ng pang-aapi, pinahahalagahan pa rin ng mga mananampalataya ang kayamanan mismo — yumuyuko sa katayuan ng mga nagpapahirap sa kanila habang ibinababa ang mga dukhang katulad nila ang kalagayan. Dapat ding suriin ng iglesia ngayon ang sarili: Dahil may malaking impluwensya o malaki ang naibibigay ng isang tao, binabalewala ba natin ang kanyang masasakit na salita o di-makatarungang kilos? Dapat din nating ibigin ang mayaman. Ngunit hindi natin dapat, sa pangalan ng pag-ibig, takpan ang kanyang mali o balewalain ang sakit ng mahihina upang mapanatili siya. Tayo ay mga taong tinatawag sa pangalan ni Jesus; ang paraan ng pag-iingat natin sa komunidad ay dapat karapat-dapat sa pangalang iyon."], "points": ["Kapag pinararangalan natin ang pinararangalan ng Diyos, nagiging buhay ng ating komunidad ang ating pagpapahayag ng pananampalataya sa kaharian ng Diyos."]}, {"title": "Talata 8–13 · Magsalita at Kumilos Ayon sa Batas ng Pag-ibig, at Magpakita ng Habag", "paragraphs": ["Sa talata 8–9, inilahad ni Santiago ang utos: <mark>\"Ibigin mo ang iyong kapwa gaya ng iyong sarili\"</mark> — ang maharlikang batas na binigyang-diin din ni Jesus. Kung paanong gusto kong igalang, igalang din siya; kung paanong umaasa akong may papansin sa aking paghihirap, pansinin din ang kanyang paghihirap. Ang kapwa ay hindi limitado sa mga kasundo ko o may pakinabang sa akin. Sa tekstong ito, ang mismong taong pumasok na gusgusin ang damit ang kapwang dapat ibigin. Kaya malinaw na sinasabi ni Santiago: <mark>\"Kung nagtatangi kayo, nagkakasala kayo.\"</mark> Hindi ito basta maipapasa bilang usapin ng ugali o panlasa. Lahat ay may mas malapit na kaibigan, ngunit ang pagkakaiba ng pagiging malapit ay hindi nagbibigay ng karapatang tratuhing mas mababa ang iba. Kahit ang hindi natin kasang-ayon ay karapat-dapat igalang, at kahit sa pagtutuwid ng maling kilos, hindi natin dapat alisan ng dignidad ang tao.", "Sinasabi ng talata 10 na ang tumutupad sa buong kautusan ngunit nabigo sa isang punto ay nagkasala sa lahat. Hindi ito nangangahulugang pareho ang bunga o bigat ng bawat kasalanan. Ipinaliliwanag ng talata 11: ang Diyos na nagsabing, 'Huwag kang mangangalunya,' ay nagsabi ring, 'Huwag kang papatay.' Sa likod ng bawat utos ay ang iisang Diyos. Kaya hindi ko maaaring sundin ang mga utos na itinuturing kong mahalaga at balewalain ang utos na ibigin ang kapwa. Hindi natin dapat isipin ang ating pananampalataya na parang pagdaragdag ng puntos. Ang tapat na pagdalo sa pagsamba, paglilingkod, at pagbibigay ay hindi nagpapahintulot na humamak ng sinuman. Nagsasalita ang Diyos hindi lamang sa mga bahaging magaling tayo, kundi pati sa mga relasyong patuloy nating tinatanggihang sumunod. 'Anong saloobin ang tumatanggi kang baguhin habang ipinagmamalaki ang sipag mo sa pananampalataya?'", "Sinasabi ng talata 12, <mark>\"Kaya magsalita at kumilos kayo bilang mga hahatulan sa ilalim ng batas ng kalayaan.\"</mark> Sa talata 4, kumilos tayo na parang mga hukom na nagpapasya ng halaga ng tao; sa talata 12, napagtatanto nating tayo mismo ay hahatulan sa harap ng Diyos. Tandaan ang pagbabagong ito: hindi tayo ang nagtatakda ng pinal na halaga ng ating kapwa; tayo ang mananagot sa Diyos kung paano natin tinrato ang kapwang iyon. Kaya ang huling paghatol ay hindi lamang impormasyon tungkol sa malayong hinaharap — nakaugnay ito sa kung kaninong salita ang pinakikinggan natin nang buo ngayon, kanino tayo nag-aalok ng upuan, kaninong paghihirap ang tinutugunan natin. Nagbababala ang talata 13, <mark>\"Sapagkat ang paghatol ay walang habag sa hindi nagpakita ng habag. Ang habag ay nagtatagumpay laban sa paghatol.\"</mark> Ang habag dito ay higit pa sa pagkaawa; ito ay paggalang sa mga minsang hinamak natin, pagpansin sa kanilang pangangailangan, at tunay na pagtulong. Hindi natin binibili ang kaligtasan sa pagpapakita ng habag — ang ating pag-asa ay nasa Diyos na nahahabag sa atin. Ngunit ang pananampalatayang tumatanggap ng habag na iyon ay dapat makita sa habag sa iba."], "points": ["May mga taong mahirap pakisamahan sa komunidad. Dapat magtakda ng kinakailangang payo at hangganan, ngunit hindi natin dapat ituring na walang halaga ang sinuman — tayo rin ay nangangailangan ng pagtitiyaga at habag ng Diyos."]}, {"title": "Aplikasyon · Tingnan ang Tao sa Mata ng Panginoon, at Ialok ang Upuan sa Iyong Tabi", "paragraphs": ["Nagsimula tayo sa tanong: Ano ang nakikita ko sa tao? Nakita ng mga tao sa talata ngayon ang gintong singsing at magandang kasuotan, at ipinasya kung saan uupo ang taong iyon. Unang ibinaling ni Santiago ang kanilang tingin sa <mark>Panginoon ng kaluwalhatian, si Jesu-Cristo</mark>. Huminto si Jesus sa sigaw ng bulag na si Bartimeo, na sinaway ng karamihan at pinatahimik. Pumasok din Siya sa bahay ni Zaqueo, isang mayamang punong maniningil ng buwis — hindi upang parangalan ang kanyang yaman, kundi upang iligtas ang nawawala. Nang makilala ang Panginoon, sinabi ni Zaqueo na magbibigay siya sa dukha at babayaran ang di-makatarungang kinuha niya.", "<mark>Hindi nilampasan ng Panginoon ang dukha, ni nanahimik tungkol sa kasalanan ng mayaman.</mark> Inibig Niya ang tao at inakay sila sa landas ng pagpapanumbalik. Ang Panginoong iyon ang nagpasan ng ating mga kasalanan sa krus at muling nabuhay. Tinanggap tayo ng Panginoon hindi dahil marami tayong pag-aari o kapaki-pakinabang tayo, kundi dahil sa Kanyang habag.", "Ang iglesia ngayon ay maaari ring masyadong magtuon sa bilang, pananalapi, at impluwensya na nakaliligtaan nito ang buhay ng isang tao. Maaari nating naising lumago ang iglesia habang may isang nakadarama sa loob nito na, <mark>'Hindi ako mahalaga rito.'</mark> Magkakaroon ng mga taong mahirap pakisamahan sa komunidad — dapat magtakda ng kinakailangang payo at hangganan — ngunit hindi natin sila dapat hatulang walang halaga at itulak palayo, sapagkat tayo rin ay nangangailangan ng pagtitiyaga at habag ng Diyos.", "Kaya ngayong linggo, lumapit tayo nang kongkreto sa isang tao. Huwag lamang makipagkita sa mga lagi mong binabati — <mark>unang kausapin ang isang nag-iisa</mark>. Unang bumati nang magaan sa taong ipinasya mong panatilihin sa malayo. Kung may nangangailangan ng tulong, sa halip na ilagay sila sa alanganin sa publiko, tahimik na itanong ang kanilang kalagayan at ibahagi ang tulong na kaya mo. At kung maaalala mong naiba ang pagtrato mo sa isang tao dahil sa katayuan, baguhin ang iyong saloobin sa relasyong iyon. Dapat ding makita ang pagsisisi sa paraan ng pagtrato natin sa tao."], "points": ["Kung tinanggap ako ng Panginoon sa habag, kanino ko iaalok ang upuan sa aking tabi ngayong linggo?"]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung nagbago ang aking saloobin matapos malaman ang trabaho o kalagayan ng isang tao."}, {"key": "c2", "text": "Sinuri ko kung, sa iglesia o trabaho, tinitingnan ko ang tao bilang 'kapaki-pakinabang na mapagkukunan' sa halip na 'taong iibigin.'"}, {"key": "c3", "text": "Pinag-isipan ko kung binabalewala ko ang mali ng maimpluwensyang tao habang madaling binabalewala ang salita ng mahihina."}, {"key": "c4", "text": "Sa harap ng Diyos, sinuri ko kung may taong pinanatili ko sa malayo o itinuring na walang halaga."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Sino ang isang taong nilampasan ko, na dapat kong alukin ng upuan sa aking tabi ngayong linggo?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Sa Taong Nag-iisa", "value": "Sa iglesia o pagtitipon, lapitan ang isang nag-iisa, makipag-usap, at tandaan ang kanyang pangalan"}, {"key": "act2", "label": "Unang Bumati", "value": "Unang bumati nang magaan sa taong ipinasya mong panatilihin sa malayo"}, {"key": "act3", "label": "Tahimik na Habag", "value": "Tahimik na itanong ang kalagayan ng nangangailangan at ibahagi ang kayang tulong nang hindi siya inilalagay sa alanganin"}, {"key": "act4", "label": "Baguhin ang Saloobin", "value": "Alalahanin ang isang relasyong naiba ang pagtrato mo dahil sa katayuan, at tratuhin siya nang may paggalang ngayon"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang Santiago 2:1 at tingnan ang tao nang may mata ng pananampalataya sa Panginoon ng kaluwalhatian"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Jesus, Panginoon ng kaluwalhatian, sa pagtanggap Mo sa amin hindi dahil sa aming pag-aari o pakinabang, kundi dahil lamang sa habag, at sa pagpasan Mo ng aming mga kasalanan sa krus."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako na habang ipinapahayag ang pananampalataya sa Panginoon ng kaluwalhatian, hinatulan ko ang tao ayon sa anyo at katayuan, lumapit lamang sa mga makatutulong sa akin, at nilampasan ang mahihinang kapwa."}, {"key": "p3", "tag": "Kahilingan", "text": "Hayaan Mong tingnan ko ang tao sa Iyong mata. Ngayong linggo, tulungan Mo akong lumapit sa isang nag-iisa at ialok ang upuan sa aking tabi, at mamuhay nang ang habag ay nagtatagumpay laban sa paghatol."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-10-18';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
