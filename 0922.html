<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "9월 22일 화요일", "ref": "사사기 9장 46–57절", "headline": "내가 의지하는 것은<br>진정한 피난처입니까", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 사사기 9:46-57", "s1heading": "오늘의 말씀", "verse": "\"하나님은 우리의 피난처시요 힘이시니<br>환난 중에 만날 큰 도움이시라\"", "verseRef": "시편 46:1", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 46–49절 · 거짓 피난처, 불타버린 망대", "paragraphs": ["오늘 본문은 기드온의 아들 아비멜렉에 관한 긴 이야기의 마지막 장면입니다. 그는 왕이 되려고 형제 일흔 명을 한 바위 위에서 죽였고, 세겜 사람들은 자신들에게 유리하다는 이유로 그를 왕으로 세웠습니다. 그러나 3년 뒤 하나님이 그 관계를 무너뜨리셨고, 아비멜렉은 결국 자신을 왕으로 세웠던 세겜을 공격해 파괴했습니다.", "그런데 아직 살아남은 사람들이 있었습니다. 세겜 망대의 사람들은 아비멜렉의 공격 소식을 듣고 에브릿 신전 보루로 피합니다. 견고한 요새 안으로 들어가면 안전할 것이라 기대했을 것입니다. 그러나 아비멜렉은 나뭇가지를 베어 그 보루에 쌓고 불을 지릅니다. 그 결과 약 천 명이 죽습니다. 피난처라 믿었던 곳이 오히려 죽음의 장소가 되었습니다."], "points": ["요담의 우화 속 가시나무는 자기 그늘 아래로 피하라 말했지만, 그 가시나무에서 나온 불이 결국 나무들을 삼켰습니다. 자신들을 지켜줄 것이라 믿었던 왕이, 이제 그들을 불태우고 있었습니다."]}, {"title": "50–55절 · 모든 것을 통제하려던 사람도 자기 생명은 지키지 못하다", "paragraphs": ["아비멜렉은 이번엔 데베스로 향합니다. 그 성읍에도 견고한 망대가 있었고, 사람들은 그 안으로 피해 문을 잠그고 지붕 위로 올라갑니다. 아비멜렉은 세겜에서 성공했던 방법 그대로, 망대의 문을 불사르려고 가까이 다가갑니다. 그런데 이번엔 전혀 예상하지 못한 일이 일어납니다. 망대 위에 있던 한 여인이 맷돌 위짝을 그의 머리 위로 던진 것입니다. 그 돌에 맞은 아비멜렉은 치명상을 입습니다.", "여기서 아비멜렉의 시작과 끝을 나란히 놓아 보십시오. 왕이 되려고 형제 일흔 명을 한 바위 위에서 죽였던 사람이, 이제 이름 없는 한 여인이 던진 돌에 쓰러집니다. 그는 죽어가는 순간에도 자신이 어떻게 기억될지를 염려하며, 무기를 든 청년에게 자신을 칼로 죽이라고 명령합니다. 여인에게 죽었다는 말을 듣고 싶지 않았기 때문입니다. 그러나 성경은 그가 감추려 했던 사실까지 그대로 기록합니다. 모든 것을 자기 뜻대로 통제하려 했던 그도, 자신의 마지막만큼은 통제할 수 없었습니다."], "points": ["자신의 생명조차 온전히 지킬 수 없는 사람은, 자기 자신을 궁극적인 피난처로 삼을 수 없습니다."]}, {"title": "56–57절 · 이야기의 결말을 결정하신 분은 하나님이십니다", "paragraphs": ["사람의 눈으로 보면, 배신과 전쟁과 우연이 뒤엉킨 사건처럼 보입니다. 그러나 성경은 이렇게 선언합니다. <mark>\"하나님이 아비멜렉이 그의 아버지에게 행한 악, 곧 그의 형제 칠십 인을 죽인 죄를 갚으셨고, 세겜 사람들의 모든 악도 그들의 머리로 돌아가게 하셨다\"</mark>. 아비멜렉의 죽음은 단순한 전쟁 사고가 아니라, 하나님께서 그가 행한 악의 책임을 물으신 사건이었습니다. 그리고 요담이 선포했던 저주가 그대로 이루어졌습니다.", "아비멜렉은 형제를 죽이고 왕이 되는 데 성공했고, 3년을 통치했으며, 반란을 진압하고 두 성읍을 점령했습니다. 겉으로 보면 계속 이기는 사람처럼 보였습니다. 그러나 악이 성공하는 것처럼 보인다는 사실이, 하나님이 그 악을 허락하셨다는 뜻은 아닙니다. 아비멜렉은 자기 힘으로 왕이 될 수 있었지만, 자기 삶에 대한 마지막 판단까지 내릴 수는 없었습니다."], "points": ["내가 모든 것을 통제하는 것처럼 보여도, 내 삶의 마지막 판단은 하나님께 있습니다."]}, {"title": "적용 · 진정한 피난처는 누구입니까", "paragraphs": ["오늘 우리는 무엇을 피난처로 삼고 살아갑니까? 돈이 있으면 안전하다고 생각합니까? 내 편이 많으면 나를 지킬 수 있다고 믿습니까? 내가 모든 상황을 통제할 수 있다면 괜찮을 것이라 여깁니까? 물론 돈도, 사람들의 도움도, 위험을 대비하는 지혜도 필요합니다. 그러나 그것들이 우리의 궁극적인 피난처가 될 수는 없습니다.", "시편 기자는 이렇게 고백합니다. <mark>\"하나님은 우리의 피난처시요 힘이시니 환난 중에 만날 큰 도움이시라\"</mark>(시편 46:1). 아비멜렉은 자신의 권력을 지키려고 형제들의 피를 흘렸지만, 예수님은 자기 백성을 살리려고 자신의 생명을 내어주셨습니다. 참된 피난처는 다른 사람을 희생시켜 자신을 지키는 왕이 아니라, 자신을 내어주어 우리를 살리신 예수 그리스도이십니다."], "points": ["우리가 붙들어야 할 것은 무너질 수밖에 없는 세상의 그늘이 아니라, 우리를 위해 생명을 내어주시고 끝까지 붙들어 주시는 예수 그리스도입니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "내가 안전을 위해 가장 먼저 의지하는 것이 재물·지위·사람인지, 하나님인지 하나 점검했다"}, {"key": "c2", "text": "위험이나 어려움 앞에서 하나님보다 내 힘과 계획을 더 신뢰하고 있지는 않은지 돌아봤다"}, {"key": "c3", "text": "내가 모든 상황을 통제할 수 있다는 착각으로 살아가고 있지는 않은지 점검했다"}, {"key": "c4", "text": "나를 위해 생명을 내어주신 예수님이 내 삶의 진정한 피난처이심을 오늘 다시 기억했다"}], "s4heading": "묵상 한 줄", "memoHint": "지금 내가 하나님보다 더 의지하고 있는, 무너질 수 있는 '피난처'가 있다면 무엇입니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "진짜 피난처 점검하기", "value": "안전을 위해 가장 먼저 의지하는 것이 무엇인지 하나 적어보고 하나님 앞에 내놓기"}, {"key": "act2", "label": "통제하려던 것 내려놓기", "value": "내 힘으로 붙들고 통제하려 했던 일 하나를 오늘 하나님께 맡기기"}, {"key": "act3", "label": "시편 46편 붙들기", "value": "오늘 하루 시편 46:1 말씀을 한 번 소리 내어 읽고 마음에 새기기"}, {"key": "act4", "label": "십자가 은혜 기억하기", "value": "나를 위해 생명을 내어주신 예수님께 오늘 한 문장으로 감사드리기"}, {"key": "act5", "label": "염려 내려놓기", "value": "지금 붙들고 있는 두려움이나 염려 하나를 기도로 하나님께 맡기기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "무너질 세상의 그늘이 아니라 참된 피난처가 되어 주시는 예수님, 저를 위해 생명을 내어주신 은혜를 감사합니다"}, {"key": "p2", "tag": "회개", "text": "재물과 사람과 제 능력을 하나님보다 더 의지했던 순간들을 회개합니다"}, {"key": "p3", "tag": "간구", "text": "제가 흔들릴 때마다 세상의 그늘이 아니라 주님께로 먼저 피하게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "September 22, Tuesday", "ref": "Judges 9:46–57", "headline": "Is What I Rely On<br>a True Refuge?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · Judges 9:46-57", "s1heading": "Today's Word", "verse": "\"God is our refuge and strength,<br>a very present help in trouble.\"", "verseRef": "Psalm 46:1", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · Verses 46–49 · A False Refuge, a Tower Burned Down", "paragraphs": ["Today's passage is the final scene in the long story of Gideon's son Abimelech. He killed his seventy brothers on a single stone to become king, and the people of Shechem, for their own advantage, made him king. But three years later, God brought that relationship down, and Abimelech ended up attacking and destroying the very city of Shechem that had made him king.", "Yet some people survived. The people in the tower of Shechem, hearing of Abimelech's attack, fled into the stronghold of the temple of El-berith. They must have expected safety inside such a fortified place. But Abimelech cut branches, piled them against the stronghold, and set it on fire. About a thousand people died as a result. The place they trusted as a refuge became instead a place of death."], "points": ["In Jotham's fable, the thornbush told the trees to take refuge in its shade — but the fire that came out of that same thornbush ended up consuming them. The king they trusted to protect them was now the one burning them."]}, {"title": "Verses 50–55 · Even a Man Who Tried to Control Everything Couldn't Save His Own Life", "paragraphs": ["Abimelech then heads to Thebez. That city too had a strong tower, and the people flee inside, locking the door and climbing to the roof. Using the same method that had worked at Shechem, Abimelech approaches to set fire to the tower's entrance. But this time, something completely unexpected happens. A woman on top of the tower drops an upper millstone on his head, and the blow gives him a fatal wound.", "Set the beginning and end of Abimelech's story side by side. The man who killed seventy brothers on a single stone to become king is now struck down by a stone thrown by one unnamed woman. Even as he's dying, he worries about how he'll be remembered — he calls his armor-bearer and orders him to run him through with a sword, so people won't say he was killed by a woman. But Scripture records the very fact he tried to hide. The man who tried to control everything by his own will couldn't even control his own end."], "points": ["Someone who cannot even fully protect his own life cannot make himself his own ultimate refuge."]}, {"title": "Verses 56–57 · God Is the One Who Determines How the Story Ends", "paragraphs": ["From a human point of view, this looks like a tangle of betrayal, war, and chance. But Scripture declares plainly: <mark>\"God returned the evil that Abimelech had done to his father in killing his seventy brothers, and God also made all the evil of the men of Shechem return on their heads.\"</mark> Abimelech's death wasn't merely a war accident — God was holding him responsible for the evil he had done. And Jotham's curse was fulfilled exactly as spoken.", "Abimelech succeeded in becoming king by killing his brothers. He ruled for three years, put down rebellions, and captured two cities. On the surface, he looked like someone who kept winning. But the fact that evil looks successful doesn't mean God approved of it. Abimelech could become king by his own strength — but he could not have the final say over his own life."], "points": ["Even when I seem to control everything, the final judgment on my life belongs to God."]}, {"title": "Application · Who Is My True Refuge?", "paragraphs": ["What do we treat as our refuge today? Do we think money makes us safe? That having many people on our side will protect us? That we're fine as long as we can control every situation? Money, other people's help, and wise preparation for danger are all necessary. But none of them can be our ultimate refuge.", "The psalmist confesses, <mark>\"God is our refuge and strength, a very present help in trouble\"</mark> (Psalm 46:1). Abimelech shed his brothers' blood to protect his own power, but Jesus gave up His own life to save His people. A true refuge is not a king who protects himself by sacrificing others, but Jesus Christ, who gave Himself up to save us."], "points": ["What we need to hold onto isn't a worldly shade destined to collapse, but Jesus Christ, who gave His life for us and holds onto us to the very end."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I checked whether what I rely on first for safety is wealth, status, or people — or God."}, {"key": "c2", "text": "I reflected on whether, facing danger or difficulty, I trust my own strength and plans more than God."}, {"key": "c3", "text": "I checked whether I've been living under the illusion that I can control every situation."}, {"key": "c4", "text": "I remembered again today that Jesus, who gave His life for me, is the true refuge of my life."}], "s4heading": "One-Line Reflection", "memoHint": "Is there a 'refuge' you rely on more than God right now — one that could collapse?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Check My Real Refuge", "value": "Write down what you rely on first for safety, and bring it before God today"}, {"key": "act2", "label": "Let Go of What You're Trying to Control", "value": "Hand over to God one thing you've been trying to control by your own strength"}, {"key": "act3", "label": "Hold on to Psalm 46", "value": "Read Psalm 46:1 aloud once today and let it settle in your heart"}, {"key": "act4", "label": "Remember the Grace of the Cross", "value": "Thank Jesus in one sentence today for giving His life for you"}, {"key": "act5", "label": "Release a Worry", "value": "Hand over one fear or worry you're holding onto in prayer today"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Jesus, my true refuge instead of the world's collapsing shade — thank You for giving Your life for me."}, {"key": "p2", "tag": "Repent", "text": "I repent of the moments I relied on wealth, people, and my own ability more than God."}, {"key": "p3", "tag": "Ask", "text": "Whenever I'm shaken, let me flee first to You, not to the world's shade."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Setyembre 22, Martes", "ref": "Mga Hukom 9:46–57", "headline": "Ang Aking Kinukupkupan,<br>Tunay Ba Itong Kanlungan?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Mga Hukom 9:46-57", "s1heading": "Salita Ngayon", "verse": "\"Ang Diyos ay ating kanlungan at lakas,<br>laging kasama sa panahon ng kaguluhan.\"", "verseRef": "Awit 46:1", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Talata 46–49 · Isang Huwad na Kanlungan, Isang Nasunog na Tore", "paragraphs": ["Ang binasa natin ngayon ay ang huling eksena sa mahabang kwento ni Abimelek, anak ni Gideon. Pinatay niya ang pitumpung kapatid sa iisang bato upang maging hari, at ginawa siyang hari ng mga tao ng Shekem dahil sa sarili nilang kapakinabangan. Ngunit pagkalipas ng tatlong taon, giniba ng Diyos ang relasyong iyon, at sa huli sinalakay at winasak ni Abimelek ang mismong Shekem na naghari sa kanya.", "Ngunit may mga nakaligtas pa. Ang mga tao sa tore ng Shekem, nang marinig ang pagsalakay ni Abimelek, tumakas sa kuta ng templo ni El-berit. Inaasahan nila marahil na ligtas sila sa isang matibay na lugar na iyon. Ngunit pumutol si Abimelek ng mga sanga, ibinunton sa kuta, at sinunog ito. Halos isang libong tao ang namatay. Ang lugar na iniwasan nilang kanlungan ay naging lugar ng kamatayan."], "points": ["Sa kwento ni Jotam, sinabi ng tinikan sa mga punongkahoy na sumilong sa kanyang lilim — ngunit ang apoy na lumabas sa mismong tinikan ang siyang lumamon sa kanila. Ang haring inaasahan nilang magpoprotekta ay siya mismong sumunog sa kanila."]}, {"title": "Talata 50–55 · Kahit ang Taong Naghangad na Kontrolin ang Lahat ay Hindi Naisalba ang Sariling Buhay", "paragraphs": ["Pumunta naman si Abimelek sa Tebez. Sa lungsod na iyon ay may matibay ding tore, at tumakas doon ang mga tao, ikinandado ang pinto at umakyat sa bubong. Gamit ang parehong pamamaraang nagtagumpay sa Shekem, lumapit si Abimelek upang sunugin ang pintuan ng tore. Ngunit sa pagkakataong ito, may ganap na hindi inaasahang nangyari. Isang babae sa taas ng tore ang naghulog ng ibabang bato ng gilingan sa kanyang ulo, at ang tama nito ay nagdulot sa kanya ng malubhang sugat.", "Ilagay mo sa tabi-tabi ang simula at wakas ng kwento ni Abimelek. Ang taong pumatay ng pitumpung kapatid sa iisang bato upang maging hari ay ngayon binagsak ng isang batong inihagis ng isang di-kilalang babae. Kahit sa oras ng kanyang pagkamatay, nag-alala pa rin siya kung paano siya maaalala — tinawag niya ang kanyang tagadala ng sandata at inutusang saksakin siya ng espada, upang hindi masabing isang babae ang pumatay sa kanya. Ngunit itinala pa rin ng Kasulatan ang mismong bagay na tinangka niyang itago. Ang taong nagtangkang kontrolin ang lahat ayon sa sariling kalooban ay hindi man lamang nakontrol ang sarili niyang wakas."], "points": ["Ang isang taong hindi man lamang lubos na maprotektahan ang sariling buhay ay hindi maaaring gawin ang sarili niyang huling kanlungan."]}, {"title": "Talata 56–57 · Ang Diyos ang Nagpasya Kung Paano Magtatapos ang Kwento", "paragraphs": ["Sa paningin ng tao, mukhang isang magulong sanhi ng pagtataksil, digmaan, at pagkakataon lamang ito. Ngunit malinaw na ipinahayag ng Kasulatan: <mark>\"Ganti ng Diyos kay Abimelek sa masamang ginawa niya sa kanyang ama sa pagpatay sa kanyang pitumpung kapatid, at pinasagot din ng Diyos sa mga tao ng Shekem ang lahat ng kanilang kasamaan.\"</mark> Ang kamatayan ni Abimelek ay hindi lamang isang aksidente ng digmaan — pinananagot siya ng Diyos sa kasamaang kanyang ginawa. At ganap na natupad ang sumpang ipinahayag ni Jotam.", "Nagtagumpay si Abimelek sa pagpatay ng kanyang mga kapatid upang maging hari. Namuno siya ng tatlong taon, sinupil ang mga paghihimagsik, at sinakop ang dalawang lungsod. Sa panlabas, mukha siyang isang taong palaging nagwawagi. Ngunit ang katunayang mukhang matagumpay ang kasamaan ay hindi nangangahulugang pinahintulutan ito ng Diyos. Nakayanan ni Abimelek na maging hari sa sariling lakas — ngunit hindi niya nakayanang magpasya sa huling kapalaran ng kanyang buhay."], "points": ["Kahit mukha akong kumokontrol sa lahat, nasa Diyos ang huling hatol sa aking buhay."]}, {"title": "Aplikasyon · Sino ang Aking Tunay na Kanlungan?", "paragraphs": ["Ano ang itinuturing nating kanlungan ngayon? Iniisip ba natin na ligtas tayo kung may salapi? Na maprotektahan tayo kung maraming kakampi? Na okay lang tayo kung makokontrol natin ang bawat sitwasyon? Kailangan natin ang salapi, ang tulong ng ibang tao, at ang karunungang maghanda sa panganib. Ngunit wala sa mga ito ang maaaring maging ating huling kanlungan.", "Nagpahayag ang mang-aawit, <mark>\"Ang Diyos ay ating kanlungan at lakas, laging kasama sa panahon ng kaguluhan\"</mark> (Awit 46:1). Nagpadanak ng dugo ng kanyang mga kapatid si Abimelek upang protektahan ang sariling kapangyarihan, ngunit ibinigay ni Jesus ang sarili Niyang buhay upang iligtas ang Kanyang bayan. Ang tunay na kanlungan ay hindi isang haring nagpoprotekta sa sarili sa pamamagitan ng pag-aalay ng iba, kundi si Jesu-Cristo, na ibinigay ang Kanyang sarili upang iligtas tayo."], "points": ["Ang dapat nating kapitan ay hindi ang lilim ng mundong tiyak na gugumuho, kundi si Jesu-Cristo, na nagbigay ng Kanyang buhay para sa atin at humahawak sa atin hanggang sa katapusan."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Sinuri ko kung ang unang kinukuha ko para sa kaligtasan ay kayamanan, katayuan, o tao — o ang Diyos."}, {"key": "c2", "text": "Pinag-isipan ko kung sa harap ng panganib o kahirapan, mas pinagkakatiwalaan ko ang sarili kong lakas at plano kaysa sa Diyos."}, {"key": "c3", "text": "Sinuri ko kung namumuhay ako sa maling akala na makokontrol ko ang bawat sitwasyon."}, {"key": "c4", "text": "Muli kong naalala ngayon na si Jesus, na nagbigay ng Kanyang buhay para sa akin, ang tunay na kanlungan ng aking buhay."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "May 'kanlungan' ba na kapit mo ngayon nang higit sa Diyos — na maaaring gumuho?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Suriin ang Tunay Kong Kanlungan", "value": "Isulat kung ano ang unang kinukuha mo para sa kaligtasan, at dalhin ito sa Diyos ngayon"}, {"key": "act2", "label": "Bitawan ang Sinusubukan Mong Kontrolin", "value": "Ibigay sa Diyos ang isang bagay na sinusubukan mong kontrolin sa sarili mong lakas"}, {"key": "act3", "label": "Kapitan ang Awit 46", "value": "Basahin nang malakas ang Awit 46:1 ngayon at hayaang manatili ito sa iyong puso"}, {"key": "act4", "label": "Alalahanin ang Biyaya ng Krus", "value": "Pasalamatan si Jesus sa isang pangungusap ngayon dahil sa pagbibigay ng Kanyang buhay para sa iyo"}, {"key": "act5", "label": "Bitawan ang Pag-aalala", "value": "Ibigay sa Diyos sa panalangin ang isang takot o pag-aalalang kinakapitan mo ngayon"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Jesus, ang aking tunay na kanlungan sa halip na ang tiyak na gugumuhong lilim ng mundo — salamat sa pagbibigay ng Iyong buhay para sa akin."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa mga sandaling mas pinagkatiwalaan ko ang kayamanan, tao, at sariling kakayahan kaysa sa Diyos."}, {"key": "p3", "tag": "Kahilingan", "text": "Sa tuwing ako'y natitinag, hayaang tumakbo muna ako sa Iyo, hindi sa lilim ng mundo."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-09-16';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
