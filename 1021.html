<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>만나 큐티</title>
<meta property="og:title" content="10/21(수) 큐티 · 야고보서 3:13–18">
<meta property="og:description" content="옳은 말을 한다고 지혜로운 걸까요?">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

      <button data-lang="ko">한국어</button><button data-lang="en">English</button><button data-lang="tl">Tagalog</button>

    <span class="fs"><span id="fontLabel">글자</span> <button data-f="f1"><b>가</b></button><button data-f="" class="on"><b>가</b></button><button data-f="f3"><b>가</b></button></span>

</div>

<header>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "10월 21일 수요일", "ref": "야고보서 3장 13–18절", "headline": "옳은 말을 한다고<br>지혜로운 걸까요?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 야고보서 3:13-18", "s1heading": "오늘의 말씀", "verse": "\"오직 위로부터 난 지혜는 첫째 성결하고<br>다음에 화평하고 관용하고 양순하며<br>긍휼과 선한 열매가 가득하고<br>편견과 거짓이 없나니\"", "verseRef": "야고보서 3:17", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 말과 행동을 만드는 마음, 그리고 지혜", "paragraphs": ["1장은 시험 속에서 하나님께 지혜를 구하고 말씀을 행하라고, 2장은 차별하지 말고 이웃 사랑으로 믿음을 보이라고, 3장 앞부분은 작은 혀가 얼마나 큰 영향을 미치는지 말했습니다. 오늘은 <mark>그 말과 행동을 만들어 내는 마음과 지혜</mark>의 문제로 들어갑니다. 성경이 말하는 지혜는 단지 현명하게 선택하는 능력이 아니라, <mark>하나님을 경외하며 그분의 뜻을 따라 사는 것</mark>입니다. 믿는 사람이 모든 것을 다 이해하는 것은 아니지만, 모르는 것이 많아도 하나님을 신뢰하며 살아갈 수 있습니다.", "그렇다면 내가 하나님의 지혜로 살고 있는지 어떻게 알 수 있을까요? 오늘은 세 가지를 살펴봅니다. <mark>동기, 태도, 그리고 열매</mark>입니다. 왜 그 일을 하는지, 어떤 태도로 하는지, 그 일이 사람과 공동체에 무엇을 남기는지 돌아보는 것입니다. 다른 사람보다 나 자신을 먼저 말씀 앞에 세워 보십시오."], "points": ["나는 옳은 말을 하고 있다는 사실만으로 지혜롭다고 여기고 있지는 않습니까?"]}, {"title": "13절 · 참된 지혜는 온유함으로 행하는 선한 삶에서 드러납니다", "paragraphs": ["<mark>\"너희 중에 지혜와 총명이 있는 자가 누구냐 그는 선행으로 말미암아 지혜의 온유함으로 그 행함을 보일지니라\"</mark>. 많이 알고 정확하게 설명하는 능력은 귀하지만, 그 지식이 내 선택과 관계를 어떻게 바꾸고 있는지 물어야 합니다. 말씀을 잘 설명하면서 가족에게 함부로 말한다면, 내가 전하는 말씀이 내 삶에 적용되고 있는지 돌아봐야 합니다.", "어려운 사람을 도우면서 상대를 무시할 수도 있고, 바른 것을 가르치면서 듣는 사람을 부끄럽게 만들 수도 있습니다. 그래서 <mark>선한 일을 했다는 사실과 함께 어떤 마음과 태도로 했는지</mark>도 살펴야 합니다. 온유한 사람은 하나님 앞에서 자신의 한계를 알고 사람을 존중합니다. 그 태도는 특히 <mark>내 생각이 거절될 때</mark> 드러납니다."], "points": ["반대 의견을 들었을 때 상대를 무시하지 않고, 내가 놓친 것이 있는지 돌아볼 수 있습니까?"]}, {"title": "14–16절 · 시기와 이기적인 욕망에서 나온 지혜는 혼란을 만듭니다", "paragraphs": ["<mark>\"너희 마음 속에 독한 시기와 다툼이 있으면 자랑하지 말라 진리를 거슬러 거짓말하지 말라\"</mark>. 다른 사람이 인정받는 것을 견디기 어렵고, 내 의견이 받아들여지지 않으면 상대를 경쟁자로 여기는 마음입니다. \"교회를 위해서 하는 말\"이라 해도, 다른 사람의 좋은 제안이 선택되었을 때 마음이 불편하다면 동기를 돌아봐야 합니다. <mark>일이 잘되기를 바랐습니까, 아니면 그 일을 잘되게 한 사람으로 내가 인정받기를 원했습니까?</mark>", "야고보는 그런 지혜를 <mark>\"땅 위의 것이요 정욕의 것이요 귀신의 것\"</mark>이라고까지 말합니다. 세상의 모든 지식이 악하다는 뜻이 아니라, 이기심으로 사람을 움직이면서 그것을 하나님의 지혜라 부르지 말라는 경고입니다. <mark>\"시기와 다툼이 있는 곳에는 혼란과 모든 악한 일이 있음이라\"</mark>. 내 뜻을 이루는 것이 가장 중요해지면 다른 사람의 말을 왜곡하고 사람들을 내 편과 반대편으로 나누게 됩니다."], "points": ["갈등이 있다는 이유만으로 누군가를 정죄해서는 안 됩니다. 살펴야 할 것은 그 갈등을 이끄는 마음입니다. 하나님을 위한 열심입니까, 내 뜻을 이루려는 욕심입니까?"]}, {"title": "17–18절 · 위로부터 난 지혜는 화평으로 심어 의의 열매를 거둡니다", "paragraphs": ["위로부터 난 지혜는 <mark>첫째 성결합니다</mark>. 하나님을 섬기는 마음에 내 이익과 거짓을 섞지 않는 것입니다. 이어서 <mark>화평하고 관용하고 양순합니다</mark>. 자기 권리만 고집하지 않고 다른 사람의 입장을 헤아리며, 바른 권면을 받아들일 줄 압니다. 지혜로운 사람은 가르칠 줄 알면서 동시에 배울 줄도 아는 사람입니다. 또 <mark>긍휼과 선한 열매가 가득하고 편견과 거짓이 없어</mark>, 내 편이라고 봐주거나 상대에 따라 말을 바꾸지 않습니다. 이 특징들은 함께 나타나야 합니다. 화평을 위해 잘못을 덮어서도 안 되고, 진실을 말한다며 모욕과 조롱을 정당화해서도 안 됩니다.", "<mark>\"화평하게 하는 자들은 화평으로 심어 의의 열매를 거두느니라\"</mark>. 상대를 무너뜨리는 말로 화평을 만들 수는 없습니다. 앞 본문에서는 작은 혀가 불을 놓았는데, 오늘은 화평하게 하는 사람이 씨를 심습니다. 불은 빠르게 번지지만 씨앗이 자라는 데는 시간이 걸립니다. 한 번의 대화로 해결되지 않아도 정직하게 듣고, 설명하고, 사과하는 일을 계속하는 것입니다. 우리는 심고 물을 주는 자이고, 자라게 하시는 분은 하나님이십니다."], "points": ["좋은 열매를 바란다면, 오늘 내가 어떤 말과 행동을 심고 있는지 돌아보아야 합니다."]}, {"title": "적용 · 동기는 바뀌고, 태도는 부드러워지고, 화평의 열매가 맺히도록", "paragraphs": ["오늘 우리는 동기와 태도와 열매를 살펴보았습니다. 하나님께 받은 지혜는 <mark>온유한 행동과 긍휼로 드러나고, 화평 가운데 의로운 삶을 자라게 합니다</mark>. 이 지혜를 가장 분명하게 보여 주신 분이 예수님입니다. 주님은 <mark>\"나는 마음이 온유하고 겸손하니 나의 멍에를 메고 내게 배우라\"</mark>고 하셨습니다. 그리고 우리를 살리시려고 기꺼이 십자가를 지셨고, 우리의 죄를 짊어지셔서 하나님과 화목할 길을 열어 주셨습니다.", "사도 바울도 고린도전서 4장에서 모욕을 당하면 축복하고, 박해를 받으면 참고, 비방을 받으면 권면하는 삶을 말한 뒤 \"나를 본받는 자가 되라\"고 했습니다. <mark>복음을 아는 지혜가 사람을 대하는 태도로 나타난 것</mark>입니다.", "우리도 그 은혜를 받았습니다. 그래서 잘못을 인정할 수 있고, 내 생각을 고칠 수 있으며, 먼저 사과할 수 있습니다. 부활하신 주님을 믿기에 관계의 회복을 바라볼 수 있고, 다시 오실 주님이 모든 것을 바로잡으실 것을 믿기에 <mark>오늘의 순종을 포기하지 않을 수 있습니다</mark>.", "오늘 가까운 한 사람에게 그 지혜를 실천해 보십시오. <mark>내 말을 하기 전에 끝까지 들어 주고, 잘못된 말은 인정하고, 도움이 필요한 곳에 손을 내미십시오</mark>. 예수님께 받은 은혜가 우리의 동기를 바꾸고, 태도를 부드럽게 하며, 가정과 교회에 화평의 열매를 맺게 하시기를 바랍니다."], "points": ["지혜로운 사람은 옳은 말을 하는 사람이기 전에, 온유함으로 옳게 사는 사람입니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "내가 하는 선한 일과 바른 말이 어떤 태도로 전해지고 있는지 돌아봤다"}, {"key": "c2", "text": "내 의견이 거절되거나 다른 사람이 인정받을 때 마음이 어떻게 반응하는지 점검했다"}, {"key": "c3", "text": "'교회를 위해서'라는 말 뒤에 인정받고 싶은 욕망이 숨어 있지 않은지 돌아봤다"}, {"key": "c4", "text": "화평을 위해 잘못을 덮거나, 진실을 말한다며 상대를 깎아내리고 있지 않은지 점검했다"}], "s4heading": "묵상 한 줄", "memoHint": "요즘 내가 '옳다'고 주장하는 일에서, 바꾸어야 할 나의 동기나 태도는 무엇입니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "끝까지 듣기", "value": "의견이 다른 사람의 말을 끊지 않고 끝까지 듣고, 내가 놓친 것이 무엇인지 찾아보기"}, {"key": "act2", "label": "동기 점검", "value": "오늘 하려는 일 하나를 놓고 '일이 잘되기를 원하나, 내가 인정받기를 원하나?' 물어보기"}, {"key": "act3", "label": "기꺼이 축하", "value": "내 제안 대신 선택된 다른 사람의 아이디어를 진심으로 인정하고 축하하기"}, {"key": "act4", "label": "화평의 씨앗", "value": "관계가 어긋난 한 사람에게 정직하고 부드러운 말 한마디나 사과를 먼저 건네기"}, {"key": "act5", "label": "말씀 암송", "value": "야고보서 3:17을 외우며 오늘 내 말과 행동을 위로부터 난 지혜에 비추어 보기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "마음이 온유하고 겸손하신 예수님이 십자가를 지셔서 우리를 하나님과 화목하게 하시고, 위로부터 난 지혜를 주시니 감사합니다"}, {"key": "p2", "tag": "회개", "text": "옳은 말을 한다는 이유로 사람을 무시하고, 섬김 속에 인정받고 싶은 욕망과 시기를 숨기며, 내 편과 네 편을 나누었던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "성결하고 화평하며 관용하고 양순한 위로부터 난 지혜를 주셔서, 가르칠 줄도 배울 줄도 알며, 가정과 교회에 화평의 씨를 심어 의의 열매를 거두게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "October 21, Wednesday", "ref": "James 3:13–18", "headline": "Does Saying the Right Thing<br>Make Me Wise?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · James 3:13-18", "s1heading": "Today's Word", "verse": "\"But the wisdom from above is first pure,<br>then peaceable, gentle, open to reason,<br>full of mercy and good fruits,<br>impartial and sincere.\"", "verseRef": "James 3:17", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · The Heart Behind Words and Actions — and Wisdom", "paragraphs": ["James 1 urged us to ask God for wisdom in trials and to do the Word we hear. Chapter 2 told us not to show partiality but to show our faith through loving our neighbors. Earlier in chapter 3, we saw how greatly the small tongue affects people's lives and communities. Today we go into <mark>the heart and the wisdom that produce those words and actions</mark>. We usually call wisdom the ability to choose wisely from experience. We do need wisdom to live healthily and solve difficulties well. But Scripture turns our attention to God. <mark>Knowing God and living according to His will</mark> — that is the wisdom Scripture and Jesus speak of. Proverbs says the fear of the LORD is the beginning of wisdom: acknowledging God as God and listening to His Word. Psalm 1 calls blessed the one who delights in and meditates on that Word. That doesn't mean believers understand everything. Ecclesiastes shows life's vanity and urges us to fear God; Job couldn't explain all his suffering, yet came to know God more deeply. We too still don't know much, but we can live trusting God.", "So how can I tell whether I'm living by God's wisdom? Today we'll look at three things: <mark>motive, attitude, and fruit</mark> — why I do something, with what attitude I do it, and what it leaves behind in people and the community. Rather than picturing others first, place yourself before the Word."], "points": ["Am I considering myself wise simply because I'm saying the right things?"]}, {"title": "Verse 13 · True Wisdom Shows in a Good Life Lived with Meekness", "paragraphs": ["In the first half of verse 13, James asks who is wise and tells them to show it by good conduct: <mark>\"Who is wise and understanding among you? By his good conduct let him show his works in the meekness of wisdom.\"</mark> The ability to know much and explain precisely is precious. But we must also ask how that knowledge is changing our choices and relationships. If we explain the Word well but speak carelessly to our family, we must ask whether the Word we deliver is being applied to our own lives.", "In the second half, James says to show our works in the meekness of wisdom. We can help someone in need while looking down on them. We can teach what's right while shaming the hearer. So along with the fact that we did good, <mark>we must examine with what heart and attitude we did it</mark>. The meek know their limits before God and respect people. That attitude shows especially <mark>when my ideas are rejected</mark>. Hearing opposing views, the meek don't dismiss the other person but can ask whether they've missed something. Even when we argue for what's right, we must examine our heart and attitude before the Word."], "points": ["When I hear an opposing view, can I keep from dismissing the other person and ask whether I've missed something?"]}, {"title": "Verses 14–16 · Wisdom Born of Envy and Selfish Ambition Creates Disorder", "paragraphs": ["In verse 14 James tells us to examine our hearts for <mark>\"bitter jealousy and selfish ambition\"</mark>: finding it hard to bear when others are recognized, and treating someone as a rival when my opinion isn't accepted. 'Selfish ambition' here includes the desire to put forward my own interests and position — not merely having a different opinion. We may say, 'I'm saying this for the church.' But if we feel uncomfortable when someone else's good proposal is chosen, we need to examine our motives. <mark>Did you want the work to go well — or did you want to be recognized as the one who made it go well?</mark> Sometimes when we talk about church problems, we're less interested in solving them than in showing that we understand them better than anyone. Even in our church zeal, a desire for recognition may be hiding.", "In verse 15 James goes so far as to call such wisdom <mark>\"earthly, unspiritual, demonic.\"</mark> It follows immediate gain rather than God's will, makes my desire the standard of judgment, and ultimately harms the community God loves. This doesn't mean all worldly knowledge is evil; it's a warning not to call it God's wisdom when we move people by selfishness. Verse 16: <mark>\"For where jealousy and selfish ambition exist, there will be disorder and every vile practice.\"</mark> When getting my way becomes most important, I may twist others' words or divide people into my side and the other side. Greed that started in my heart breaks down the community's trust. Of course, conflict can arise even in the process of correcting wrong, so we must not condemn someone merely because there's conflict. What we must examine is the heart and behavior driving that conflict."], "points": ["Honestly examine: is this zeal for God, or desire to get my own way?"]}, {"title": "Verses 17–18 · Wisdom from Above Sows in Peace and Reaps Righteousness", "paragraphs": ["Verse 17: the wisdom God gives is <mark>first pure</mark> — not mixing self-interest and falsehood into a heart that serves God. Then it is <mark>peaceable and gentle</mark>: seeking peace, not insisting only on its own rights, and considering others' backgrounds, situations, and perspectives. <mark>'Open to reason'</mark> means able to listen to others and accept right counsel — in other words, humility. If my thinking is wrong, I can change it. A wise person knows how to teach and also how to learn. It is <mark>full of mercy and good fruits</mark>: a heart that grieves for those in need turns into actual service and help with our hands. And it is <mark>impartial and sincere</mark>: it doesn't go easy on people because they're on my side, or change its words depending on who it's talking to. These traits must appear together. We must not cover up wrongs for the sake of peace; nor can we justify insult and mockery in the name of telling the truth. Sometimes we must speak truth for the sake of peace, and when we speak truth we must also seek peace.", "Verse 18: <mark>\"And a harvest of righteousness is sown in peace by those who make peace.\"</mark> The fruit of righteousness is the right life God delights in — speaking honestly, treating people fairly, helping neighbors in need. If we want to restore a relationship, truth and mercy must be present in the process too. We can't make peace with words that tear the other person down; we must have the needed conversations while helping each other admit wrongs and find the right way. In the previous passage, the small tongue set a fire; today, peacemakers sow seed. Fire spreads quickly, but seeds take time to grow. Apply that to our relationships: even if one conversation doesn't resolve things, keep listening honestly, explaining, and apologizing. We plant and water; only God gives the growth. Be faithful stewards."], "points": ["If you hope for good fruit, examine what words and actions you're sowing today."]}, {"title": "Application · Motives Changed, Attitudes Softened, Fruit of Peace Growing", "paragraphs": ["Today we've looked at motive, attitude, and fruit. The wisdom received from God must show itself <mark>in meek actions and mercy, and grow a righteous life in peace</mark>. The One who shows this wisdom most clearly is Jesus. He said, <mark>\"Take My yoke upon you, and learn from Me, for I am gentle and lowly in heart.\"</mark> And to save us, He willingly bore the cross, carrying our sins and opening the way of reconciliation with God.", "In 1 Corinthians 4, the apostle Paul describes a life in which, when reviled, we bless; when persecuted, we endure; when slandered, we entreat — and then says, \"Be imitators of me.\" <mark>The wisdom of knowing the gospel showed itself in how he treated people.</mark>", "We too have received that grace. So we can admit our wrongs, change our thinking, and apologize first. Because we believe in the risen Lord, we can look toward the restoration of relationships; and because we believe the returning Lord will set all things right, <mark>we need not give up today's obedience</mark>.", "Today, put that wisdom into practice with one person close to you. <mark>Before saying your piece, listen to the end; acknowledge words that were wrong; and reach out your hand where help is needed.</mark> May the grace we've received from Jesus change our motives, soften our attitudes, and bear the fruit of peace in our homes and churches."], "points": ["A wise person is not first one who says the right things, but one who lives rightly with meekness."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on the attitude with which my good deeds and right words are being delivered."}, {"key": "c2", "text": "I checked how my heart reacts when my opinion is rejected or someone else is recognized."}, {"key": "c3", "text": "I reflected on whether a desire for recognition is hiding behind 'it's for the church.'"}, {"key": "c4", "text": "I checked whether I'm covering up wrongs for the sake of peace, or tearing others down in the name of truth."}], "s4heading": "One-Line Reflection", "memoHint": "In something I'm insisting is 'right' these days, what motive or attitude of mine needs to change?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Listen to the End", "value": "Listen to someone with a different opinion without interrupting, and look for what you may have missed"}, {"key": "act2", "label": "Check Your Motive", "value": "For one task today, ask: 'Do I want this to go well — or do I want to be recognized?'"}, {"key": "act3", "label": "Celebrate Gladly", "value": "Sincerely acknowledge and celebrate someone else's idea that was chosen instead of yours"}, {"key": "act4", "label": "Seeds of Peace", "value": "Be the first to offer an honest, gentle word or apology to someone your relationship has drifted from"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize James 3:17 and measure today's words and actions against the wisdom from above"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You that Jesus, gentle and lowly in heart, bore the cross to reconcile us to God and gives us the wisdom from above."}, {"key": "p2", "tag": "Repent", "text": "I repent of dismissing people because I was saying the right thing, of hiding envy and a desire for recognition within my service, and of dividing people into my side and theirs."}, {"key": "p3", "tag": "Ask", "text": "Give me the wisdom from above — pure, peaceable, gentle, and open to reason — so that I know how to teach and to learn, and sow seeds of peace in my home and church to reap a harvest of righteousness."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Oktubre 21, Miyerkules", "ref": "Santiago 3:13–18", "headline": "Ang Pagsasabi Ba ng Tama<br>ay Nagpaparunong sa Akin?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Santiago 3:13-18", "s1heading": "Salita Ngayon", "verse": "\"Ngunit ang karunungang mula sa itaas ay una sa lahat dalisay,<br>pagkatapos ay mapayapa, mahinahon, bukas sa katwiran,<br>puno ng habag at mabubuting bunga,<br>walang pagtatangi at walang pagkukunwari.\"", "verseRef": "Santiago 3:17", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Ang Pusong Nasa Likod ng Salita at Gawa — at ang Karunungan", "paragraphs": ["Hinimok tayo ng Santiago 1 na humingi ng karunungan sa Diyos sa pagsubok at gawin ang Salitang naririnig. Sinabi ng kabanata 2 na huwag magtangi kundi ipakita ang pananampalataya sa pag-ibig sa kapwa. Sa unang bahagi ng kabanata 3, nakita natin kung gaano kalaki ang epekto ng maliit na dila sa buhay at komunidad. Ngayon ay papasok tayo sa <mark>puso at karunungang nagbubunga ng mga salita at gawang iyon</mark>. Karaniwan nating tinatawag na karunungan ang kakayahang pumili nang matalino mula sa karanasan. Kailangan nga natin ang karunungan upang mamuhay nang malusog at lutasin nang mahusay ang paghihirap. Ngunit ibinabaling ng Kasulatan ang ating pansin sa Diyos. <mark>Ang pagkilala sa Diyos at pamumuhay ayon sa Kanyang kalooban</mark> — iyan ang karunungang sinasabi ng Kasulatan at ni Jesus. Sinasabi ng Kawikaan na ang takot kay Yahweh ang pasimula ng karunungan: pagkilala sa Diyos bilang Diyos at pakikinig sa Kanyang Salita. Tinatawag ng Awit 1 na mapalad ang nagagalak at nagbubulay-bulay sa Salitang iyon. Hindi ito nangangahulugang nauunawaan ng mananampalataya ang lahat. Ipinapakita ng Mangangaral ang kawalang-kabuluhan ng buhay at hinihimok tayong matakot sa Diyos; hindi naipaliwanag ni Job ang lahat ng kanyang pagdurusa, ngunit lalo niyang nakilala ang Diyos. Marami pa rin tayong hindi alam, ngunit maaari tayong mamuhay nang nagtitiwala sa Diyos.", "Kung gayon, paano ko malalaman kung namumuhay ako sa karunungan ng Diyos? Ngayon ay titingnan natin ang tatlong bagay: <mark>motibo, saloobin, at bunga</mark> — kung bakit ko ginagawa ang isang bagay, sa anong saloobin ko ito ginagawa, at ano ang iniiwan nito sa tao at komunidad. Sa halip na isipin muna ang iba, ilagay ang iyong sarili sa harap ng Salita."], "points": ["Itinuturing ko ba ang aking sarili na marunong dahil lamang nagsasabi ako ng tama?"]}, {"title": "Talata 13 · Nakikita ang Tunay na Karunungan sa Mabuting Buhay na Isinasabuhay nang may Kaamuan", "paragraphs": ["Sa unang bahagi ng talata 13, itinanong ni Santiago kung sino ang marunong at sinabing ipakita ito sa mabuting asal: <mark>\"Sino sa inyo ang marunong at may unawa? Ipakita niya sa kanyang mabuting asal ang kanyang mga gawa sa kaamuan ng karunungan.\"</mark> Mahalaga ang kakayahang makaalam ng marami at magpaliwanag nang tumpak. Ngunit dapat din nating itanong kung paano binabago ng kaalamang iyon ang ating mga pasya at relasyon. Kung mahusay nating ipinaliliwanag ang Salita ngunit padalos-dalos tayong nagsasalita sa ating pamilya, dapat nating itanong kung inilalapat ba sa sarili nating buhay ang Salitang inihahatid natin.", "Sa ikalawang bahagi, sinasabi ni Santiago na ipakita ang ating mga gawa sa kaamuan ng karunungan. Maaari tayong tumulong sa nangangailangan habang hinahamak siya. Maaari tayong magturo ng tama habang pinahihiya ang nakikinig. Kaya kasama ng katotohanang gumawa tayo ng mabuti, <mark>dapat nating suriin kung sa anong puso at saloobin natin ito ginawa</mark>. Alam ng maamo ang kanyang hangganan sa harap ng Diyos at iginagalang ang tao. Lalo itong nakikita <mark>kapag tinatanggihan ang aking mga ideya</mark>. Sa pagdinig ng salungat na pananaw, hindi binabalewala ng maamo ang kabila kundi naitatanong kung may nakaligtaan siya. Kahit sa pagtatanggol sa tama, dapat nating suriin ang ating puso at saloobin sa harap ng Salita."], "points": ["Kapag nakarinig ako ng salungat na pananaw, kaya ko bang hindi balewalain ang kabila at itanong kung may nakaligtaan ako?"]}, {"title": "Talata 14–16 · Lumilikha ng Kaguluhan ang Karunungang Mula sa Inggit at Makasariling Ambisyon", "paragraphs": ["Sa talata 14, sinasabi ni Santiago na suriin ang ating puso para sa <mark>\"mapait na inggit at makasariling ambisyon\"</mark>: hirap tiisin kapag kinikilala ang iba, at itinuturing na karibal ang isang tao kapag hindi tinanggap ang aking opinyon. Kasama sa 'makasariling ambisyon' dito ang pagnanais na iuna ang sariling interes at posisyon — hindi lamang pagkakaroon ng ibang opinyon. Maaari nating sabihin, 'Para sa iglesia ang sinasabi ko.' Ngunit kung hindi tayo komportable kapag napili ang mabuting panukala ng iba, kailangan nating suriin ang ating motibo. <mark>Nais mo bang maging maayos ang gawain — o nais mong kilalanin bilang siyang nagpaayos nito?</mark> Minsan, kapag pinag-uusapan natin ang problema ng iglesia, mas interesado tayong ipakitang mas nauunawaan natin ito kaysa sinuman kaysa sa lutasin ito. Kahit sa ating sigasig sa iglesia, maaaring nakatago ang pagnanasang kilalanin.", "Sa talata 15, tinawag pa ni Santiago ang gayong karunungan na <mark>\"makalupa, hindi espirituwal, at mula sa demonyo.\"</mark> Sinusunod nito ang agarang pakinabang sa halip na kalooban ng Diyos, ginagawang pamantayan ng paghatol ang aking pagnanasa, at sa huli ay sinasaktan ang komunidad na iniibig ng Diyos. Hindi ito nangangahulugang masama ang lahat ng kaalaman ng mundo; babala ito na huwag tawaging karunungan ng Diyos ang pagpapakilos sa tao sa pamamagitan ng pagkamakasarili. Talata 16: <mark>\"Sapagkat kung saan may inggit at makasariling ambisyon, naroon ang kaguluhan at bawat masamang gawa.\"</mark> Kapag naging pinakamahalaga ang pagtupad sa aking kalooban, maaari kong baluktutin ang salita ng iba o hatiin ang tao sa aking panig at sa kabilang panig. Sinisira ng kasakimang nagsimula sa aking puso ang tiwala ng komunidad. Siyempre, maaaring magkaroon ng alitan kahit sa proseso ng pagtutuwid ng mali, kaya hindi natin dapat hatulan ang sinuman dahil lamang may alitan. Ang dapat nating suriin ay ang puso at asal na nagpapatakbo sa alitang iyon."], "points": ["Tapat na suriin: ito ba'y sigasig para sa Diyos, o pagnanasang masunod ang sarili kong kalooban?"]}, {"title": "Talata 17–18 · Ang Karunungang Mula sa Itaas ay Naghahasik sa Kapayapaan at Umaani ng Katuwiran", "paragraphs": ["Talata 17: ang karunungang ibinibigay ng Diyos ay <mark>una sa lahat dalisay</mark> — hindi hinahaluan ng sariling interes at kasinungalingan ang pusong naglilingkod sa Diyos. Pagkatapos ay <mark>mapayapa at mahinahon</mark>: naghahangad ng kapayapaan, hindi lamang ipinipilit ang sariling karapatan, at isinasaalang-alang ang pinagmulan, kalagayan, at pananaw ng iba. Ang <mark>'bukas sa katwiran'</mark> ay nangangahulugang kayang makinig sa iba at tumanggap ng tamang payo — sa madaling salita, kababaang-loob. Kung mali ang aking iniisip, kaya ko itong baguhin. Ang marunong ay marunong magturo at marunong ding matuto. Ito ay <mark>puno ng habag at mabubuting bunga</mark>: ang pusong nalulungkot para sa nangangailangan ay nagiging tunay na paglilingkod at tulong ng ating mga kamay. At ito ay <mark>walang pagtatangi at walang pagkukunwari</mark>: hindi pinagbibigyan ang tao dahil kakampi ko siya, o binabago ang salita depende sa kausap. Dapat magkasamang lumitaw ang mga katangiang ito. Hindi natin dapat takpan ang mali alang-alang sa kapayapaan; ni hindi natin mabibigyang-katwiran ang insulto at panunuya sa pangalan ng pagsasabi ng totoo. Minsan dapat nating sabihin ang totoo alang-alang sa kapayapaan, at kapag sinasabi natin ang totoo ay dapat din nating hanapin ang kapayapaan.", "Talata 18: <mark>\"At ang ani ng katuwiran ay inihahasik sa kapayapaan ng mga gumagawa ng kapayapaan.\"</mark> Ang bunga ng katuwiran ay ang tamang buhay na kinalulugdan ng Diyos — tapat na pagsasalita, makatarungang pagtrato sa tao, pagtulong sa nangangailangang kapwa. Kung nais nating ibalik ang isang relasyon, dapat may katotohanan at habag din sa proseso. Hindi tayo makagagawa ng kapayapaan gamit ang mga salitang nagpapabagsak sa kabila; dapat nating gawin ang kinakailangang usapan habang tinutulungan ang isa't isa na umamin ng mali at hanapin ang tamang daan. Sa nakaraang bahagi, nagsindi ng apoy ang maliit na dila; ngayon, naghahasik ng binhi ang mga gumagawa ng kapayapaan. Mabilis kumalat ang apoy, ngunit nangangailangan ng panahon ang paglago ng binhi. Ilapat iyan sa ating mga relasyon: kahit hindi malutas ng isang usapan, patuloy na makinig nang tapat, magpaliwanag, at humingi ng tawad. Tayo ang nagtatanim at nagdidilig; ang Diyos lamang ang nagpapalago. Maging tapat na katiwala."], "points": ["Kung umaasa ka ng mabuting bunga, suriin kung anong mga salita at gawa ang inihahasik mo ngayon."]}, {"title": "Aplikasyon · Nagbabagong Motibo, Lumalambot na Saloobin, Lumalagong Bunga ng Kapayapaan", "paragraphs": ["Ngayon ay tiningnan natin ang motibo, saloobin, at bunga. Ang karunungang tinanggap mula sa Diyos ay dapat makita <mark>sa maamong gawa at habag, at magpalago ng matuwid na buhay sa kapayapaan</mark>. Ang pinakamalinaw na nagpakita ng karunungang ito ay si Jesus. Sinabi Niya, <mark>\"Pasanin ninyo ang Aking pamatok at matuto kayo sa Akin, sapagkat Ako'y maamo at mapagpakumbabang puso.\"</mark> At upang iligtas tayo, kusang-loob Niyang pinasan ang krus, dala ang ating mga kasalanan at binuksan ang daan ng pakikipagkasundo sa Diyos.", "Sa 1 Corinto 4, inilarawan ni apostol Pablo ang buhay na, kapag nilalait, nagpapala; kapag inuusig, nagtitiis; kapag sinisiraan, nakikiusap — at pagkatapos ay sinabi, \"Tularan ninyo ako.\" <mark>Nakita ang karunungan ng pagkakilala sa ebanghelyo sa paraan ng kanyang pagtrato sa tao.</mark>", "Tinanggap din natin ang biyayang iyon. Kaya maaari nating aminin ang ating mga mali, baguhin ang ating iniisip, at maunang humingi ng tawad. Dahil naniniwala tayo sa muling nabuhay na Panginoon, maaari tayong tumingin sa pagpapanumbalik ng relasyon; at dahil naniniwala tayong itutuwid ng babalik na Panginoon ang lahat, <mark>hindi natin kailangang isuko ang pagsunod ngayon</mark>.", "Ngayon, isagawa ang karunungang iyon sa isang taong malapit sa iyo. <mark>Bago sabihin ang iyong panig, makinig hanggang dulo; aminin ang mga salitang mali; at iabot ang iyong kamay kung saan kailangan ang tulong.</mark> Nawa'y baguhin ng biyayang tinanggap natin kay Jesus ang ating mga motibo, palambutin ang ating saloobin, at mamunga ng kapayapaan sa ating mga tahanan at iglesia."], "points": ["Ang marunong ay hindi muna ang nagsasabi ng tama, kundi ang namumuhay nang tama nang may kaamuan."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko ang saloobin kung paano naihahatid ang aking mabubuting gawa at tamang salita."}, {"key": "c2", "text": "Sinuri ko kung paano tumutugon ang aking puso kapag tinanggihan ang aking opinyon o kinilala ang iba."}, {"key": "c3", "text": "Pinag-isipan ko kung may nakatagong pagnanasang kilalanin sa likod ng 'para sa iglesia ito.'"}, {"key": "c4", "text": "Sinuri ko kung tinatakpan ko ang mali alang-alang sa kapayapaan, o pinababagsak ang iba sa pangalan ng katotohanan."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Sa isang bagay na ipinipilit kong 'tama' nitong mga araw, anong motibo o saloobin ko ang kailangang magbago?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Makinig Hanggang Dulo", "value": "Makinig sa taong iba ang opinyon nang hindi sumasabad, at hanapin ang maaaring nakaligtaan mo"}, {"key": "act2", "label": "Suriin ang Motibo", "value": "Para sa isang gawain ngayon, itanong: 'Nais ko bang maging maayos ito — o nais kong kilalanin?'"}, {"key": "act3", "label": "Masayang Ipagdiwang", "value": "Taos-pusong kilalanin at ipagdiwang ang ideya ng iba na napili sa halip na sa iyo"}, {"key": "act4", "label": "Binhi ng Kapayapaan", "value": "Unang mag-alok ng tapat at mahinahong salita o paghingi ng tawad sa taong lumayo ang relasyon sa iyo"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang Santiago 3:17 at sukatin ang iyong mga salita at gawa ngayon sa karunungang mula sa itaas"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat na si Jesus, na maamo at mapagpakumbabang puso, ay nagpasan ng krus upang ipagkasundo kami sa Diyos at bigyan kami ng karunungang mula sa itaas."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa pagbalewala sa tao dahil tama naman ang sinasabi ko, sa pagtatago ng inggit at pagnanasang kilalanin sa aking paglilingkod, at sa paghahati ng tao sa aking panig at sa kanila."}, {"key": "p3", "tag": "Kahilingan", "text": "Bigyan Mo ako ng karunungang mula sa itaas — dalisay, mapayapa, mahinahon, at bukas sa katwiran — upang marunong akong magturo at matuto, at maghasik ng binhi ng kapayapaan sa aking tahanan at iglesia upang umani ng katuwiran."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};

const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
