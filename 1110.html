<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "11월 10일 화요일", "ref": "고린도후서 8장 1–15절", "headline": "여유가 있어야<br>나눌 수 있을까요?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 고린도후서 8:1-15", "s1heading": "오늘의 말씀", "verse": "\"우리 주 예수 그리스도의 은혜를 너희가 알거니와<br>부요하신 이로서 너희를 위하여 가난하게 되심은<br>그의 가난함으로 말미암아 너희를 부요하게 하려 하심이라\"", "verseRef": "고린도후서 8:9", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 나눔의 출발점은 어디에 있습니까", "paragraphs": ["나눔을 생각하면 우리는 먼저 형편을 살핍니다. 지금 여유가 있는지, 돕고 나면 내 생활은 괜찮은지 계산합니다. 형편을 살피는 일은 필요하고, 바울도 이를 무시하지 않습니다. 그러나 바울은 한 가지를 더 기억하게 합니다. <mark>우리가 그리스도께 무엇을 받았는가</mark>입니다. 부자가 되어야만 나눌 수 있는 것이 아닙니다. 그리스도 안에서 받은 은혜가 풍성하기에 나눌 수 있습니다. <mark>나눔의 분량은 형편을 살피되, 나눔의 출발점은 그리스도의 은혜에 두는 것</mark>입니다.", "앞에서 바울은 고린도 성도들이 돌이킨 것을 기뻐했습니다. 이제 회복된 관계를 바탕으로 어려운 다른 성도들을 함께 섬기자고 권면합니다. 바울을 향해 다시 열린 마음이 멀리 있는 성도들을 향해서도 열리기를 바라는 것입니다. 이를 위해 바울은 가난과 환난 가운데서도 기쁨으로 넉넉히 나눈 <mark>마게도냐 교회</mark>를 소개합니다."], "points": ["나는 여유가 생길 날만 기다리고 있습니까, 이미 받은 그리스도의 은혜로 오늘 누군가의 필요를 돌보고 있습니까?"]}, {"title": "1–5절 · 가난 중에도 넘친 마게도냐 교회의 나눔", "paragraphs": ["이 연보는 예루살렘 성도 중 가난한 사람들을 돕기 위한 것이었습니다(롬 15:26). 바울은 빌립보와 데살로니가가 있는 마게도냐 교회들의 소식을 전하며 먼저 <mark>\"하나님께서 마게도냐 교회들에게 주신 은혜\"</mark>(1절)를 강조합니다. 그들의 형편은 넉넉하지 않았습니다. <mark>\"환난의 많은 시련 가운데서 그들의 넘치는 기쁨과 극심한 가난이 그들의 풍성한 연보를 넘치도록 하게 하였느니라\"</mark>(2절). 은혜를 받았다고 가난이 사라진 것은 아니지만, 그 가운데 기쁨이 있었고 다른 사람을 돕는 넉넉함이 나타났습니다.", "그들은 억지로가 아니라 <mark>자원하여</mark>, 오히려 섬기는 일에 참여하게 해 달라고 간절히 구했습니다(3–4절). 다만 \"힘에 지나도록\"이라는 말을 모든 사람에게 똑같이 요구해서는 안 됩니다. 본받을 것은 무리하는 모습이 아니라 <mark>은혜로 열린 마음</mark>입니다. 그 중심은 5절에 있습니다. <mark>\"그들이 먼저 자신을 주께 드리고\"</mark>. 내 삶이 주님께 속했다는 고백이 재물을 쓰는 방식에도 나타난 것입니다."], "points": ["그들의 풍성함은 금액이 아니라, 받은 은혜의 기쁨이 다른 성도의 아픔을 돌보는 넉넉함으로 드러난 것입니다."]}, {"title": "6–9절 · 그리스도의 가난함이 우리를 부요하게 하셨습니다", "paragraphs": ["바울은 디도에게 고린도 교회가 이미 시작한 연보를 마무리하도록 도와 달라고 부탁합니다. 회개의 소식을 전했던 디도가 이제 나눔의 사역도 돕습니다. 고린도 성도들은 믿음과 말과 지식, 간절함과 사랑이 풍성했습니다. 바울은 그 풍성함이 <mark>다른 성도들의 필요를 돌보는 일에도</mark> 나타나기를 바랍니다. 그러나 강요하지 않고, 다른 교회의 은혜를 보여 주며 진실한 사랑으로 참여하도록 권합니다(8절). 핵심은 금액의 경쟁이 아닙니다.", "가장 깊은 근거는 9절입니다. <mark>\"부요하신 이로서 너희를 위하여 가난하게 되심은 그의 가난함으로 말미암아 너희를 부요하게 하려 하심이라\"</mark>. 이것은 재산의 많고 적음이 아니라, 영광을 누리시던 하나님의 아들이 사람이 되시고 십자가에서 자신을 내어 주신 일을 가리킵니다. 그분을 통해 우리는 용서와 화목, 성령과 새 생명, 부활의 소망을 받았습니다. 우리의 나눔은 구원의 값을 치르는 일이 아니라 <mark>받은 은혜에 대한 응답</mark>입니다."], "points": ["나눔의 출발점을 재산에만 두면 늘 부족하지만, 그리스도의 은혜를 기억하면 지금 가진 것으로도 돌볼 길이 보입니다."]}, {"title": "10–12절 · 원하던 나눔을 형편에 맞게 끝까지 실천합니다", "paragraphs": ["고린도 성도들은 지난해부터 이 연보를 원했고 실제로 시작도 했습니다. 바울은 그 처음 마음을 인정하며 <mark>이제 마무리하라</mark>고 권면합니다(10–11절). 우리도 누군가를 돕고 싶다가 바쁘다는 이유로 미룰 때가 많습니다. 나눔의 목적은 <mark>도움이 실제로 필요한 사람에게 전달될 때</mark> 완성됩니다. 처음의 좋은 뜻이 오늘의 행동으로 이어져야 합니다.", "<mark>\"할 마음만 있으면 있는 대로 받으실 터이요 없는 것을 받지 아니하시리라\"</mark>(12절). 하나님은 없는 것을 기준으로 요구하지 않으십니다. 다른 사람과 같은 액수를 내지 못한다고 사랑이 작은 것은 아닙니다. 그러나 마음만 있으면 아무것도 하지 않아도 된다는 뜻도 아닙니다. 바울은 <mark>기꺼이 하는 마음, 실제 행동, 각 사람의 형편</mark>을 함께 봅니다. 더 넉넉해질 미래만 기다리지 말고 오늘 가능한 나눔을 시작해 보십시오."], "points": ["그리스도의 은혜는 형편을 무시하게 하지 않고, 그 형편 안에서 사랑을 실천하도록 마음을 움직입니다."]}, {"title": "13–15절 · 서로의 부족함을 채워 균등하게 합니다", "paragraphs": ["바울은 예루살렘 성도들을 돕느라 고린도 성도들을 궁핍하게 하려는 것이 아니라고 말합니다. 그가 말하는 것은 <mark>\"균등\"</mark>입니다. 모든 사람의 재산을 똑같이 만드는 것보다, <mark>누구도 생활에 필요한 것이 부족해 고통받지 않도록 서로 돌보는 것</mark>에 초점이 있습니다. 지금 고린도의 넉넉함이 예루살렘의 부족함을 채우고, 후에는 그들의 넉넉함이 고린도의 부족함을 채울 수 있습니다(14절). 나중에 돌려받으려는 것이 아니라, 같은 주님께 속했기에 서로의 필요를 자신의 일처럼 돌보는 것입니다.", "바울은 출애굽기 16장의 만나 이야기를 가져옵니다. <mark>\"많이 거둔 자도 남지 아니하였고 적게 거둔 자도 모자라지 아니하였느니라\"</mark>(15절). 광야에서 하나님의 공급으로 백성의 필요가 채워졌듯, 이제 성도들은 자원하는 나눔으로 서로의 부족함을 채웁니다. 또한 이 은혜의 사역에는 하나님 앞과 사람 앞에서 신뢰할 수 있는 <mark>정직한 관리</mark>도 따라야 합니다(8장 후반)."], "points": ["도움을 주는 사람과 받는 사람은 고정되어 있지 않습니다. 우리 모두 은혜를 받은 사람이며 서로의 필요를 채웁니다."]}, {"title": "적용 · 오늘 가진 것으로 사랑을 나눕니다", "paragraphs": ["오늘 말씀은 나눔이 어디에서 시작되는지 묻습니다. 그 시작은 <mark>자신을 내어 주신 그리스도의 은혜</mark>입니다. 예수님은 우리를 살리시려고 사람이 되셨고 섬기셨으며 십자가에서 생명을 내어 주셨습니다. 그분의 죽음과 부활을 통해 우리는 용서와 새 생명의 풍성함을 받았습니다.", "예수님은 누가복음 12장에서 <mark>\"아버지께서 그 나라를 너희에게 주시기를 기뻐하시느니라\"</mark>(32절)고 말씀하신 뒤, 소유를 나누는 삶으로 이끄셨습니다. 하나님께 받은 선물을 기억하며 이웃을 돌보도록 부르신 것입니다. 다른 사람을 돕는 일은 주님께 받은 은혜를 나누는 일입니다. 회복된 사랑은 가까운 관계를 넘어 멀리 있는 사람의 어려움까지 함께 짊어집니다.", "오늘 <mark>한 사람의 필요를 구체적으로</mark> 살펴보십시오. 그리고 형편에 맞게 도울 수 있는 한 가지를 정해 실천하십시오. 필요한 물품을 마련하거나, 작은 금액을 보내거나, 신뢰할 수 있는 구제 사역에 함께할 수 있습니다. 그 일에 동참하며 기억하십시오. <mark>내가 무언가를 내어 주기 전에, 그리스도께서 먼저 나를 위해 자신을 내어 주셨습니다</mark>.", "나는 여유가 생겨야 나눌 수 있다고만 생각합니까, 아니면 그리스도께 받은 은혜가 풍성하기에 오늘 가진 것으로 사랑을 나누고 있습니까?"], "points": ["그리스도께서 먼저 자신을 내어 주셨기에, 오늘 가진 것으로 한 사람의 필요를 돌봅니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "나눔을 '여유가 생기면'으로 미루고 있지 않은지 돌아봤다"}, {"key": "c2", "text": "나눔의 출발점을 내 재산이 아니라 그리스도께 받은 은혜에 두었다"}, {"key": "c3", "text": "돕고 싶었던 마음이 행동으로 이어지지 않은 채 멈춰 있지 않은지 점검했다"}, {"key": "c4", "text": "가까운 사람을 넘어 멀리 있는 이웃의 필요에도 마음을 열었다"}], "s4heading": "묵상 한 줄", "memoHint": "그리스도께 받은 은혜를 기억할 때, 오늘 내 형편 안에서 돌볼 수 있는 한 사람의 필요는 무엇입니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "한 사람 살피기", "value": "주변에서 도움이 필요한 한 사람의 필요를 구체적으로 적어 보기"}, {"key": "act2", "label": "형편대로 나누기", "value": "내 형편에 맞는 작은 금액이나 필요한 물품으로 오늘 실제로 돕기"}, {"key": "act3", "label": "미뤄 둔 마음 실천", "value": "돕겠다고 생각만 하고 미뤘던 일 하나를 오늘 마무리하기"}, {"key": "act4", "label": "함께 섬기기", "value": "신뢰할 수 있는 구제 사역이나 교회의 나눔에 동참하기"}, {"key": "act5", "label": "말씀 암송", "value": "고린도후서 8:9을 외우며 나를 위해 가난하게 되신 주님을 기억하기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "부요하신 주님께서 저를 위해 가난하게 되셔서 용서와 새 생명, 부활의 소망으로 저를 부요하게 하신 은혜에 감사합니다"}, {"key": "p2", "tag": "회개", "text": "나눔을 늘 여유가 생길 때로 미루고, 돕고 싶은 마음을 행동으로 옮기지 않으며, 가까운 사람만 돌보았던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "먼저 저 자신을 주님께 드리게 하시고, 받은 은혜의 기쁨으로 형편 안에서 기꺼이 나누며, 서로의 부족함을 채우는 공동체가 되게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "November 10, Tuesday", "ref": "2 Corinthians 8:1–15", "headline": "Do I Need to Have Plenty<br>Before I Can Share?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · 2 Corinthians 8:1-15", "s1heading": "Today's Word", "verse": "\"For you know the grace of our Lord Jesus Christ,<br>that though He was rich, yet for your sake He became poor,<br>so that you by His poverty might become rich.\"", "verseRef": "2 Corinthians 8:9", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · Where Does Sharing Begin?", "paragraphs": ["When we think of sharing, we first check our circumstances. We calculate how much financial room we have and whether we'll be okay after helping someone else. Checking our circumstances is necessary, and Paul doesn't dismiss it. But Paul reminds us of one more thing: <mark>what we have received from Christ</mark>. The power that starts sharing is Christ's grace. Those who richly enjoy that grace — in other words, those who have grasped how abundant it is — come to care for others' needs. We don't have to become rich before we can share. Because the grace we've received in Christ is abundant, we can share. <mark>We consider our circumstances for the amount, but we root the starting point of sharing in Christ's grace.</mark>", "In the previous passage, Paul rejoiced that the Corinthians admitted their wrong and turned back. Now, on the basis of that restored relationship, he urges them to serve other believers in need together. He hopes the hearts that reopened toward Paul will also open toward believers far away. To this end, Paul introduces <mark>the churches of Macedonia</mark>. They were poor and went through affliction, yet among them were joy and generous sharing. Let's examine our own lives too: Am I just waiting for the day I'll have extra? Or, because of the grace of Christ I've already received, am I caring for someone's need today? Let's look at three movements."], "points": ["Am I waiting for the day I'll have extra, or caring for someone's need today because of the grace I've already received?"]}, {"title": "Verses 1–5 · The Overflowing Generosity of the Macedonian Churches in Poverty", "paragraphs": ["First we should know whom this offering was for. According to Romans 15, it was a collection for the poor among the believers in Jerusalem, and the Corinthian church was already taking part. Acts 11 records that when a great famine came, the Antioch church sent relief to the believers in Judea through Barnabas and Saul — but that was an earlier relief, and we can't definitively attribute this collection to that famine or a specific disaster. In verse 1, the region of Macedonia appears — home to Philippi and Thessalonica. As Paul shares news of these churches' giving, he first emphasizes <mark>'the grace of God that has been given among the churches of Macedonia.'</mark> Yet in verse 2 we see their circumstances weren't comfortable: <mark>'for in a severe test of affliction, their abundance of joy and their extreme poverty have overflowed in a wealth of generosity on their part.'</mark> Receiving grace didn't make their poverty disappear. Yet joy was there, and a generosity that helped others appeared. Their abundance can't be explained by the amount alone; the joy of grace received from God showed itself as generosity caring for other believers' pain.", "Verses 3–4 emphasize that they gave <mark>voluntarily</mark>. No one forced them; rather, they earnestly begged to take part in serving other believers. But we must not demand of everyone what is said here — that they gave 'beyond their means.' Later Paul explains to the Corinthians that they should give according to what they have. What we should imitate is not overextending ourselves, but <mark>a heart opened by grace</mark>. Verse 5 shows the center of that heart: <mark>'they gave themselves first to the Lord.'</mark> The confession that their lives belonged to the Lord appeared in how they used their possessions too. Their cooperation with Paul and his co-workers was also participation in service according to the Lord's will."], "points": ["Their abundance wasn't about the amount, but the joy of grace showing itself in generosity toward others' pain."]}, {"title": "Verses 6–9 · Christ's Poverty Has Made Us Rich", "paragraphs": ["In verses 6–8, Paul asks Titus to help the Corinthian church complete the collection it had already begun. Titus, who brought the news of the believers' repentance in the previous passage, now helps with the ministry of sharing too. The Corinthians excelled in faith, speech, knowledge, earnestness, and love, and Paul hopes that abundance will also appear in <mark>caring for other believers' needs</mark>. Paul doesn't try to accomplish this by coercion. He shows the grace that appeared in other churches and invites them to take part with genuine love. The point is not competition over amounts, but received grace showing itself as love.", "Now verse 9 gives the deepest foundation: <mark>'For you know the grace of our Lord Jesus Christ, that though He was rich, yet for your sake He became poor, so that you by His poverty might become rich.'</mark> Christ's riches and poverty don't simply refer to the amount of possessions — let me emphasize that again. They point to the Son of God, who enjoyed glory, becoming human for us and finally giving Himself on the cross. Through Him we were forgiven and reconciled to God; we received the Spirit, new life, and the hope of resurrection. This is the abundance of salvation Christ has given us. What we share is never payment for salvation; it is <mark>a response to the grace we received</mark> from the Lord who gave Himself."], "points": ["If sharing starts from my wealth, it always feels insufficient; remembering Christ's grace, I see ways to care with what I have now."]}, {"title": "Verses 10–12 · Completing the Sharing You Desired, According to Your Means", "paragraphs": ["In verses 10–11, the Corinthians had wanted to take part in this collection since the previous year and had actually begun. Paul acknowledges their initial heart and beginning, and now urges them to <mark>finish it</mark>. We too sometimes want to help someone, but the desire soon fades. The purpose of sharing is completed when <mark>help actually reaches the person in need</mark>. Paul wants their good intentions from the start to carry into action now. We often hear of someone's hardship and think, 'I'll help,' yet postpone it because we're busy. Decide what you can do, and put it into practice.", "In verse 12, while urging them to complete their giving, Paul also considers their circumstances: <mark>'For if the readiness is there, it is acceptable according to what a person has, not according to what he does not have.'</mark> God doesn't demand based on what someone lacks; He receives love that gladly shares according to what one has. Not being able to give the same amount as others doesn't mean our love is small. But neither does it mean that as long as we have the heart, we don't need to do anything. Paul looks at <mark>a willing heart, actual action, and each person's circumstances</mark> together. Christ's grace doesn't make us ignore our circumstances; it moves our hearts to practice love within them. Don't just wait for a more comfortable future — start the sharing that's possible today. Even a small amount can be needed strength for a neighbor."], "points": ["Christ's grace doesn't make us ignore our circumstances; it moves us to practice love within them."]}, {"title": "Verses 13–15 · Supplying One Another's Needs for Fairness", "paragraphs": ["In verses 13–14, Paul explains that in relieving the Jerusalem believers' hardship, he doesn't intend to make the Corinthians newly impoverished. What he speaks of is <mark>'fairness.'</mark> This fairness focuses less on making everyone's total wealth equal and more on <mark>caring for one another so that no one suffers from lacking what they need to live</mark>. The Corinthians' present abundance can supply Jerusalem's need, and later Jerusalem's abundance can supply theirs. The community of faith is a relationship of helping one another according to need. This doesn't mean giving now in order to be repaid later. Because we belong to the same Lord, we care for one another's needs as our own. Restored love goes beyond close relationships; it had to widen into a love that carries the hardships of believers far away.", "In verse 15, Paul brings in the manna story from Exodus 16: <mark>'Whoever gathered much had nothing left over, and whoever gathered little had no lack.'</mark> In the wilderness God gave His people food, and everyone had enough. What Paul holds on to is that the people's needs were met by God's provision. Now believers supply one another's lack through voluntary sharing. Faith that God provides leads us to participate, because we can use what God has entrusted to us to meet someone's need. This ministry of grace must also be accompanied by <mark>honest management</mark>. In the latter part of chapter 8, Paul says the collection must be handled in a way that's trustworthy not only before God but also before people. Willing generosity and responsible management go together."], "points": ["Givers and receivers aren't fixed. We have all received grace, and we meet one another's needs as circumstances allow."]}, {"title": "Application · Sharing Love Today with What I Have", "paragraphs": ["Today's Word asks where sharing begins. It begins with <mark>the grace of Christ, who gave Himself</mark>. To give us life, Jesus became human, served, and gave His life on the cross. Through His death and resurrection, we have received the abundance of forgiveness and new life.", "In Luke 12, after saying, <mark>'It is your Father's good pleasure to give you the kingdom'</mark> (v. 32), Jesus led His followers into a life of sharing their possessions. He called us to remember the gifts we've received from God and care for our neighbors. Helping others is sharing the grace we've received from the Lord.", "Today, look <mark>specifically at one person's need</mark>. Then decide on one way you can help according to your circumstances and do it: providing a needed item, sending a small amount, or joining a trustworthy relief ministry. As you take part, remember: <mark>before I give anything, Christ first gave Himself for me.</mark>", "Do I think I can only share once I have extra — or, because the grace I've received from Christ is abundant, am I sharing love today with what I have?"], "points": ["Because Christ first gave Himself, I care for one person's need today with what I have."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether I'm postponing sharing 'until I have extra.'"}, {"key": "c2", "text": "I rooted the starting point of sharing not in my wealth but in the grace I've received from Christ."}, {"key": "c3", "text": "I checked whether my desire to help has stalled without turning into action."}, {"key": "c4", "text": "I opened my heart not only to those close to me but also to the needs of neighbors far away."}], "s4heading": "One-Line Reflection", "memoHint": "Remembering the grace I've received from Christ, whose need can I care for today within my circumstances?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Notice One Person", "value": "Write down specifically the need of one person around you who needs help"}, {"key": "act2", "label": "Give as I Can", "value": "Actually help today with a small amount or a needed item that fits your circumstances"}, {"key": "act3", "label": "Act on Good Intentions", "value": "Complete today one thing you meant to help with but kept postponing"}, {"key": "act4", "label": "Serve Together", "value": "Join a trustworthy relief ministry or your church's sharing effort"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize 2 Corinthians 8:9 and remember the Lord who became poor for you"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, Lord, for becoming poor for my sake though You were rich, making me rich with forgiveness, new life, and the hope of resurrection."}, {"key": "p2", "tag": "Repent", "text": "I repent of always postponing sharing until I have extra, not turning my desire to help into action, and caring only for those close to me."}, {"key": "p3", "tag": "Ask", "text": "Help me give myself first to You, share gladly within my circumstances out of the joy of grace, and be part of a community that supplies one another's needs."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Nobyembre 10, Martes", "ref": "2 Corinto 8:1–15", "headline": "Kailangan Ko bang Maging Sagana<br>Bago Ako Makapagbahagi?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · 2 Corinto 8:1-15", "s1heading": "Salita Ngayon", "verse": "\"Sapagkat alam ninyo ang biyaya ng ating Panginoong Jesu-Cristo,<br>na bagama't Siya'y mayaman, alang-alang sa inyo ay naging dukha,<br>upang kayo sa Kanyang kadukhaan ay maging mayaman.\"", "verseRef": "2 Corinto 8:9", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Saan Nagsisimula ang Pagbabahagi?", "paragraphs": ["Kapag iniisip natin ang pagbabahagi, inuuna nating tingnan ang ating kalagayan. Kinukuwenta natin kung gaano kaluwag ang ating pananalapi at kung magiging maayos pa tayo matapos tumulong sa iba. Kailangan ang pagsusuri sa ating kalagayan, at hindi ito binabalewala ni Pablo. Ngunit ipinaaalala ni Pablo ang isa pang bagay: <mark>kung ano ang natanggap natin mula kay Cristo</mark>. Ang kapangyarihang nagpapasimula ng pagbabahagi ay ang biyaya ni Cristo. Ang mga lubos na nagtatamasa ng biyayang iyon — sa madaling salita, ang mga nakaunawa kung gaano ito kasagana — ay nag-aalaga sa pangangailangan ng iba. Hindi natin kailangang yumaman muna bago makapagbahagi. Dahil sagana ang biyayang natanggap natin kay Cristo, makapagbabahagi tayo. <mark>Isinasaalang-alang natin ang ating kalagayan para sa halaga, ngunit inuugat natin ang simula ng pagbabahagi sa biyaya ni Cristo.</mark>", "Sa naunang talata, nagalak si Pablo na inamin ng mga taga-Corinto ang kanilang mali at tumalikod. Ngayon, batay sa naibalik na relasyong iyon, hinihimok niya silang sama-samang paglingkuran ang ibang mananampalatayang nangangailangan. Inaasahan niyang ang mga pusong muling nabuksan kay Pablo ay mabubuksan din sa mga mananampalatayang nasa malayo. Para rito, ipinakilala ni Pablo ang <mark>mga iglesya sa Macedonia</mark>. Dukha sila at dumaan sa kapighatian, ngunit nasa kanila ang kagalakan at masaganang pagbabahagi. Suriin din natin ang ating sariling buhay: Naghihintay lamang ba ako sa araw na magkakaroon ako ng sobra? O, dahil sa biyaya ni Cristo na natanggap ko na, inaalagaan ko ba ngayon ang pangangailangan ng iba? Tingnan natin ang tatlong bahagi."], "points": ["Naghihintay ba ako sa araw na magkakaroon ako ng sobra, o inaalagaan ko ngayon ang pangangailangan ng iba dahil sa biyayang natanggap ko na?"]}, {"title": "Talata 1–5 · Ang Umaapaw na Kagandahang-loob ng mga Iglesya sa Macedonia sa Gitna ng Kahirapan", "paragraphs": ["Una, dapat nating malaman kung para kanino ang abuloy na ito. Ayon sa Roma 15, ito ay pangongolekta para sa mga dukha sa mga mananampalataya sa Jerusalem, at nakikibahagi na rito ang iglesya sa Corinto. Itinala ng Gawa 11 na nang dumating ang malaking taggutom, nagpadala ang iglesya sa Antioquia ng tulong sa mga mananampalataya sa Judea sa pamamagitan nina Bernabe at Saulo — ngunit iyon ay naunang tulong, at hindi natin tiyak na maiuugnay ang koleksyong ito sa taggutom na iyon o sa isang tiyak na sakuna. Sa talata 1, lumilitaw ang rehiyon ng Macedonia — kinaroroonan ng Filipos at Tesalonica. Habang ibinabalita ni Pablo ang pagbibigay ng mga iglesyang ito, una niyang idinidiin ang <mark>'biyaya ng Diyos na ibinigay sa mga iglesya sa Macedonia.'</mark> Gayunman, sa talata 2 ay nakikita nating hindi maginhawa ang kanilang kalagayan: <mark>'sapagkat sa matinding pagsubok ng kapighatian, ang kanilang masaganang kagalakan at matinding kahirapan ay umapaw sa kayamanan ng kagandahang-loob sa kanilang bahagi.'</mark> Hindi nawala ang kanilang kahirapan dahil tumanggap sila ng biyaya. Gayunman, naroon ang kagalakan, at lumitaw ang kagandahang-loob na tumutulong sa iba. Hindi maipaliliwanag ng halaga lamang ang kanilang kasaganaan; ang kagalakan ng biyayang natanggap mula sa Diyos ay nahayag bilang kagandahang-loob na nag-aalaga sa sakit ng ibang mananampalataya.", "Idinidiin ng talata 3–4 na nagbigay sila <mark>nang kusang-loob</mark>. Walang pumilit sa kanila; sa halip, taimtim silang nakiusap na makibahagi sa paglilingkod sa ibang mananampalataya. Ngunit hindi natin dapat hingin sa lahat ang sinabi rito — na nagbigay sila 'nang higit sa kanilang kaya.' Sa bandang huli, ipinaliwanag ni Pablo sa mga taga-Corinto na dapat silang magbigay ayon sa kung ano ang mayroon sila. Ang dapat nating tularan ay hindi ang pagpapakalabis, kundi <mark>ang pusong binuksan ng biyaya</mark>. Ipinapakita ng talata 5 ang sentro ng pusong iyon: <mark>'ibinigay muna nila ang kanilang sarili sa Panginoon.'</mark> Ang pagpapahayag na ang kanilang buhay ay pag-aari ng Panginoon ay lumitaw din sa paraan ng kanilang paggamit ng ari-arian. Ang kanilang pakikipagtulungan kay Pablo at sa kanyang mga kamanggagawa ay pakikibahagi rin sa paglilingkod ayon sa kalooban ng Panginoon."], "points": ["Ang kanilang kasaganaan ay hindi tungkol sa halaga, kundi ang kagalakan ng biyaya na nahayag sa kagandahang-loob sa sakit ng iba."]}, {"title": "Talata 6–9 · Ang Kadukhaan ni Cristo ang Nagpayaman sa Atin", "paragraphs": ["Sa talata 6–8, hiniling ni Pablo kay Tito na tulungan ang iglesya sa Corinto na tapusin ang koleksyong nasimulan na nito. Si Tito, na nagdala ng balita ng pagsisisi ng mga mananampalataya sa naunang talata, ay tumutulong na ngayon sa ministeryo ng pagbabahagi. Nangunguna ang mga taga-Corinto sa pananampalataya, pananalita, kaalaman, kasigasigan, at pag-ibig, at inaasahan ni Pablo na lilitaw din ang kasaganaang iyon sa <mark>pag-aalaga sa pangangailangan ng ibang mananampalataya</mark>. Hindi sinisikap ni Pablo na makamit ito sa pamamagitan ng pamimilit. Ipinapakita niya ang biyayang lumitaw sa ibang iglesya at inaanyayahan silang makibahagi nang may tunay na pag-ibig. Ang punto ay hindi ang paligsahan sa halaga, kundi ang natanggap na biyayang nahahayag bilang pag-ibig.", "Ngayon, ibinibigay ng talata 9 ang pinakamalalim na pundasyon: <mark>'Sapagkat alam ninyo ang biyaya ng ating Panginoong Jesu-Cristo, na bagama't Siya'y mayaman, alang-alang sa inyo ay naging dukha, upang kayo sa Kanyang kadukhaan ay maging mayaman.'</mark> Ang kayamanan at kadukhaan ni Cristo ay hindi basta tumutukoy sa dami ng ari-arian — muli ko itong idiriin. Tumuturo ang mga ito sa Anak ng Diyos, na nagtatamasa ng kaluwalhatian, na naging tao para sa atin at sa wakas ay ibinigay ang Kanyang sarili sa krus. Sa pamamagitan Niya, pinatawad tayo at nakipagkasundo sa Diyos; tinanggap natin ang Espiritu, bagong buhay, at pag-asa ng muling pagkabuhay. Ito ang kasaganaan ng kaligtasang ibinigay sa atin ni Cristo. Ang ibinabahagi natin ay hindi kailanman bayad para sa kaligtasan; ito ay <mark>tugon sa biyayang natanggap natin</mark> mula sa Panginoong nagbigay ng Kanyang sarili."], "points": ["Kung sa aking yaman nagsisimula ang pagbabahagi, laging mukhang kulang; sa pag-alala sa biyaya ni Cristo, nakikita ko ang mga paraan upang mag-alaga gamit ang mayroon ako ngayon."]}, {"title": "Talata 10–12 · Tapusin ang Pagbabahaging Ninais Mo, Ayon sa Iyong Kakayahan", "paragraphs": ["Sa talata 10–11, nais nang makibahagi ng mga taga-Corinto sa koleksyong ito mula pa noong nakaraang taon at nasimulan na nila ito. Kinikilala ni Pablo ang kanilang unang puso at pagsisimula, at hinihimok sila ngayon na <mark>tapusin ito</mark>. Tayo rin, minsan ay gusto nating tumulong sa iba, ngunit agad na kumukupas ang pagnanais. Natutupad ang layunin ng pagbabahagi kapag <mark>tunay na umabot ang tulong sa taong nangangailangan</mark>. Nais ni Pablo na ang kanilang mabuting intensyon mula sa simula ay humantong sa kilos ngayon. Madalas nating marinig ang hirap ng iba at isiping, 'Tutulong ako,' ngunit ipinagpapaliban natin ito dahil abala tayo. Magpasya kung ano ang kaya mong gawin, at isagawa ito.", "Sa talata 12, habang hinihimok silang tapusin ang kanilang pagbibigay, isinasaalang-alang din ni Pablo ang kanilang kalagayan: <mark>'Sapagkat kung naroon ang pagkukusa, ito'y katanggap-tanggap ayon sa kung ano ang mayroon ang isang tao, hindi ayon sa wala sa kanya.'</mark> Hindi humihingi ang Diyos batay sa kakulangan ng isang tao; tinatanggap Niya ang pag-ibig na masayang nagbabahagi ayon sa kung ano ang mayroon. Ang hindi makapagbigay ng parehong halaga ng iba ay hindi nangangahulugang maliit ang ating pag-ibig. Ngunit hindi rin ito nangangahulugang hangga't may puso tayo, hindi na natin kailangang gumawa ng anuman. Sama-samang tinitingnan ni Pablo ang <mark>kusang-loob na puso, tunay na kilos, at kalagayan ng bawat tao</mark>. Hindi tayo pinababalewala ng biyaya ni Cristo sa ating kalagayan; inaantig nito ang ating puso na isagawa ang pag-ibig sa loob ng kalagayang iyon. Huwag lamang hintayin ang mas maginhawang hinaharap — simulan ang pagbabahaging posible ngayon. Kahit ang maliit na halaga ay maaaring maging kinakailangang lakas para sa kapwa."], "points": ["Hindi tayo pinababalewala ng biyaya ni Cristo sa ating kalagayan; inaantig tayo nitong isagawa ang pag-ibig sa loob nito."]}, {"title": "Talata 13–15 · Pagpupuno sa Pangangailangan ng Isa't Isa para sa Pagkakapantay", "paragraphs": ["Sa talata 13–14, ipinaliwanag ni Pablo na sa pagpapagaan ng hirap ng mga mananampalataya sa Jerusalem, hindi niya balak na gawing bagong dukha ang mga taga-Corinto. Ang sinasabi niya ay <mark>'pagkakapantay.'</mark> Ang pagkakapantay na ito ay hindi gaanong nakatuon sa paggawang magkapareho ng kabuuang yaman ng lahat, kundi sa <mark>pag-aalaga sa isa't isa upang walang sinumang magdusa dahil sa kakulangan ng kailangan niya upang mabuhay</mark>. Ang kasalukuyang kasaganaan ng mga taga-Corinto ay makapupuno sa pangangailangan ng Jerusalem, at sa ibang panahon ay makapupuno naman ang kasaganaan ng Jerusalem sa kanila. Ang komunidad ng pananampalataya ay relasyon ng pagtutulungan ayon sa pangangailangan. Hindi ito nangangahulugang magbigay ngayon upang mabayaran sa ibang panahon. Dahil iisang Panginoon ang pinagkakabilangan natin, inaalagaan natin ang pangangailangan ng isa't isa na parang sa atin. Ang naibalik na pag-ibig ay lumalampas sa malalapit na relasyon; dapat itong lumawak tungo sa pag-ibig na nagpapasan ng hirap ng mga mananampalatayang nasa malayo.", "Sa talata 15, dinala ni Pablo ang kuwento ng manna mula sa Exodo 16: <mark>'Ang nakaipon ng marami ay walang labis, at ang nakaipon ng kaunti ay walang kulang.'</mark> Sa ilang, binigyan ng Diyos ng pagkain ang Kanyang bayan, at sapat ang lahat. Ang hinahawakan ni Pablo ay natugunan ang pangangailangan ng bayan sa pamamagitan ng probisyon ng Diyos. Ngayon, pinupunan ng mga mananampalataya ang kakulangan ng isa't isa sa pamamagitan ng kusang-loob na pagbabahagi. Ang pananampalatayang naglalaan ang Diyos ay umaakay sa ating makibahagi, sapagkat magagamit natin ang ipinagkatiwala sa atin ng Diyos upang punan ang pangangailangan ng iba. Ang ministeryong ito ng biyaya ay dapat ding samahan ng <mark>tapat na pamamahala</mark>. Sa huling bahagi ng kabanata 8, sinasabi ni Pablo na dapat hawakan ang koleksyon sa paraang mapagkakatiwalaan hindi lamang sa harap ng Diyos kundi pati sa harap ng tao. Magkasama ang kusang-loob na kagandahang-loob at responsableng pamamahala."], "points": ["Hindi permanente ang nagbibigay at tumatanggap. Lahat tayo ay tumanggap ng biyaya, at pinupunan natin ang pangangailangan ng isa't isa ayon sa kalagayan."]}, {"title": "Aplikasyon · Pagbabahagi ng Pag-ibig Ngayon Gamit ang Mayroon Ako", "paragraphs": ["Itinatanong ng Salita ngayon kung saan nagsisimula ang pagbabahagi. Nagsisimula ito sa <mark>biyaya ni Cristo, na nagbigay ng Kanyang sarili</mark>. Upang bigyan tayo ng buhay, naging tao si Jesus, naglingkod, at ibinigay ang Kanyang buhay sa krus. Sa Kanyang kamatayan at muling pagkabuhay, tinanggap natin ang kasaganaan ng kapatawaran at bagong buhay.", "Sa Lucas 12, matapos sabihing, <mark>'Kinalulugdan ng inyong Ama na ibigay sa inyo ang kaharian'</mark> (t. 32), inakay ni Jesus ang Kanyang mga tagasunod sa buhay ng pagbabahagi ng kanilang ari-arian. Tinawag Niya tayong alalahanin ang mga kaloob na natanggap natin sa Diyos at alagaan ang ating kapwa. Ang pagtulong sa iba ay pagbabahagi ng biyayang natanggap natin mula sa Panginoon.", "Ngayon, tingnan <mark>nang tiyak ang pangangailangan ng isang tao</mark>. Pagkatapos, magpasya sa isang paraan kung paano ka makatutulong ayon sa iyong kalagayan at gawin ito: magbigay ng kinakailangang bagay, magpadala ng maliit na halaga, o makibahagi sa mapagkakatiwalaang ministeryo ng pagtulong. Habang nakikibahagi, alalahanin: <mark>bago ako magbigay ng anuman, si Cristo ang unang nagbigay ng Kanyang sarili para sa akin.</mark>", "Iniisip ko bang makapagbabahagi lamang ako kapag may sobra na ako — o, dahil sagana ang biyayang natanggap ko mula kay Cristo, nagbabahagi ba ako ng pag-ibig ngayon gamit ang mayroon ako?"], "points": ["Dahil si Cristo ang unang nagbigay ng Kanyang sarili, inaalagaan ko ngayon ang pangangailangan ng isang tao gamit ang mayroon ako."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung ipinagpapaliban ko ang pagbabahagi 'hanggang magkaroon ako ng sobra.'"}, {"key": "c2", "text": "Inugat ko ang simula ng pagbabahagi hindi sa aking yaman kundi sa biyayang natanggap ko mula kay Cristo."}, {"key": "c3", "text": "Sinuri ko kung huminto ang aking pagnanais na tumulong nang hindi nagiging kilos."}, {"key": "c4", "text": "Binuksan ko ang aking puso hindi lamang sa malalapit sa akin kundi pati sa pangangailangan ng kapwang nasa malayo."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Sa pag-alala sa biyayang natanggap ko mula kay Cristo, kaninong pangangailangan ang maaalagaan ko ngayon sa loob ng aking kalagayan?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Pansinin ang Isang Tao", "value": "Isulat nang tiyak ang pangangailangan ng isang taong nasa paligid mo na nangangailangan ng tulong"}, {"key": "act2", "label": "Magbigay Ayon sa Kaya", "value": "Tunay na tumulong ngayon gamit ang maliit na halaga o kinakailangang bagay na angkop sa iyong kalagayan"}, {"key": "act3", "label": "Isagawa ang Mabuting Intensyon", "value": "Tapusin ngayon ang isang bagay na balak mong tulungan ngunit patuloy mong ipinagpapaliban"}, {"key": "act4", "label": "Sama-samang Maglingkod", "value": "Makibahagi sa mapagkakatiwalaang ministeryo ng pagtulong o sa pagbabahagi ng iyong iglesya"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang 2 Corinto 8:9 at alalahanin ang Panginoong naging dukha para sa iyo"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Panginoon, sa pagiging dukha alang-alang sa akin bagama't Ikaw ay mayaman, at sa pagpapayaman sa akin ng kapatawaran, bagong buhay, at pag-asa ng muling pagkabuhay."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa laging pagpapaliban ng pagbabahagi hanggang magkaroon ako ng sobra, sa hindi paggawang kilos ng aking pagnanais na tumulong, at sa pag-aalaga lamang sa malalapit sa akin."}, {"key": "p3", "tag": "Kahilingan", "text": "Tulungan Mo akong ibigay muna ang aking sarili sa Iyo, masayang magbahagi sa loob ng aking kalagayan mula sa kagalakan ng biyaya, at maging bahagi ng komunidad na pumupuno sa pangangailangan ng isa't isa."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-11-10';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
