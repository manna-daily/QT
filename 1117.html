<head>

<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "11월 17일 화요일", "ref": "고린도후서 12장 14–21절", "headline": "오해받고 지칠 때,<br>어떻게 사랑해야 할까요?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 고린도후서 12:14-21", "s1heading": "오늘의 말씀", "verse": "\"내가 너희 영혼을 위하여 크게 기뻐하므로<br>재물을 사용하고 또 내 자신까지도 내어 주리니<br>너희를 더욱 사랑할수록 나는 사랑을 덜 받겠느냐\"", "verseRef": "고린도후서 12:15", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 오해 속에서도 해명에서 멈추지 않는 사랑", "paragraphs": ["진심으로 섬겼는데 오해를 받으면 마음이 크게 흔들립니다. 내가 얼마나 애썼는지 알아주기를 바라고, 억울함이 풀릴 때까지 설명하고 싶어집니다. 그러다 지치면 '이제 더는 마음 쓰지 않겠다'며 관계에서 한 걸음 물러서기도 합니다. 바울도 고린도 교회 앞에서 그런 자리에 서 있었습니다. 그는 교회를 세우고 오랫동안 돌보았지만, 일부 사람들은 <mark>그의 진심과 동기를 의심하며 그를 깎아내렸습니다</mark>.", "그런데 오늘 본문에서 바울은 자기 억울함을 해명하는 데서 멈추지 않습니다. 그의 관심은 내가 옳았다는 인정을 받는 데 있지 않고, <mark>고린도 성도들이 그리스도 안에서 다시 세워지는 것</mark>에 있었습니다. 그래서 그는 자신을 향한 의혹에 답하면서도, 교회 안에 남아 있는 다툼과 회개하지 않은 죄를 분명히 짚습니다. 오해받고 지친 자리에서도 끝까지 상대의 회복을 구하는 사랑이 무엇인지, 오늘 말씀을 통해 함께 살펴봅니다."], "points": ["최근 오해받은 일 때문에, 그 사람을 향한 사랑을 거두어들이고 있지는 않습니까?"]}, {"title": "14–15절 · 너희의 재물이 아니요 오직 너희니라", "paragraphs": ["바울은 세 번째 고린도 방문을 준비하며 <mark>\"너희에게 폐를 끼치지 아니하리라\"</mark>(14절)고 말합니다. 이번에도 생활비를 요구하지 않겠다는 뜻입니다. 그리고 그 이유를 이렇게 밝힙니다. <mark>\"내가 구하는 것은 너희의 재물이 아니요 오직 너희니라\"</mark>. 그는 부모와 자녀의 관계에 빗대어, 어린 자녀가 부모를 위해 재물을 모으는 것이 아니라 부모가 자녀를 위해 모으는 것처럼, 자신도 복음으로 낳은 고린도 성도들을 위해 기꺼이 수고하겠다고 말합니다.", "바울은 더 나아가 <mark>\"너희 영혼을 위하여 크게 기뻐하므로 재물을 사용하고 또 내 자신까지도 내어 주리니\"</mark>(15절)라고 고백합니다. 억지로 하는 희생이 아니라 기쁨으로 드리는 헌신입니다. 이어지는 <mark>\"너희를 더욱 사랑할수록 나는 사랑을 덜 받겠느냐\"</mark>는 질문에는 서운함이 묻어 있습니다. 그러나 바울은 사랑을 덜 받는다고 해서 사랑을 거두지 않습니다. 돌려받는 만큼만 주는 사랑이 아니라, 상대가 몰라주어도 계속 주는 사랑입니다."], "points": ["나는 사람을 섬길 때 그 사람 자체를 구합니까, 아니면 그에게서 돌려받을 것을 구합니까?"]}, {"title": "16–18절 · 의혹 앞에서 드러나는 정직한 섬김", "paragraphs": ["그러나 어떤 이들은 바울이 직접 짐을 지우지는 않았어도 <mark>\"교활한 자가 되어 너희를 속임수로 취하였다\"</mark>(16절)고 말했습니다. 겉으로는 생활비를 받지 않으면서, 동역자들을 통해 예루살렘 성도를 위한 연보를 걷어 뒤로 이득을 챙긴다는 의혹이었습니다. 바울의 선한 의도가 오히려 의심의 근거가 된 것입니다. 바울은 이 의혹을 같은 방식으로 되받아치지 않고, 성도들이 직접 확인할 수 있는 사실을 묻습니다.", "<mark>\"내가 너희에게 보낸 자 중에 누구로 너희의 이득을 취하더냐\"</mark>(17절). 그는 디도와 한 형제를 보냈고, 그들이 고린도 교회에서 어떻게 행했는지 성도들이 이미 보았습니다. <mark>\"우리가 동일한 성령으로 행하지 아니하더냐 동일한 보조로 하지 아니하더냐\"</mark>(18절). 바울은 개인의 생활비와 구제 연보를 분명히 구분했고, 동역자들도 같은 마음과 같은 방식으로 섬겼습니다. 오해를 완전히 막을 수는 없어도, <mark>확인 가능한 정직함</mark>은 섬김을 지키는 울타리가 됩니다."], "points": ["내 섬김에서 오해가 생길 수 있는 부분을 미리 투명하고 정직하게 하고 있습니까?"]}, {"title": "19–20절 · 자기 변명이 아니라 너희의 덕을 세우기 위함", "paragraphs": ["바울은 <mark>\"너희는 이 때까지 우리가 자기 변명을 하는 줄로 생각하는구나\"</mark>(19절)라고 말합니다. 지금까지의 설명이 자기 체면을 지키려는 해명처럼 들릴 수 있다는 것을 알았습니다. 그러나 그는 <mark>\"그리스도 안에서 하나님 앞에서\"</mark> 말한다고 밝히며, 그 목적을 이렇게 정리합니다. <mark>\"사랑하는 자들아 이 모든 것은 너희의 덕을 세우기 위함이니라\"</mark>. 상처받은 사람을 여전히 '사랑하는 자들'이라 부르며, 관계의 목적을 회복과 성장에 둡니다.", "그래서 바울은 해명에서 멈추지 않고 공동체의 실제 문제를 짚습니다. 그는 다시 만났을 때 서로가 원하지 않는 모습으로 보게 될까 두려워하며, <mark>다툼과 시기와 분냄과 당 짓는 것과 비방과 수군거림과 거만함과 혼란</mark>(20절)이 있을까 염려합니다. 모두 관계를 무너뜨리고 교회를 나누는 죄들입니다. 바울을 향한 의심도 이런 분위기 속에서 자라났을 것입니다. 바울은 자기를 지키는 것보다 교회가 건강해지는 것을 더 중요하게 여겼습니다."], "points": ["내 말과 행동의 목적은 나를 변호하는 데 있습니까, 상대와 공동체를 세우는 데 있습니까?"]}, {"title": "21절 · 회개하지 않음을 슬퍼하는 마음", "paragraphs": ["바울은 또 하나를 두려워합니다. 다시 갈 때 <mark>\"내 하나님이 나를 너희 앞에서 낮추실까\"</mark>(21절), 그리고 전에 죄를 지은 여러 사람이 <mark>더러움과 음란함과 호색함을 회개하지 아니함</mark> 때문에 슬퍼하게 될까 하는 것입니다. 바울이 염려한 것은 몇 번 넘어진 연약함이 아니라, 죄를 알고도 돌이키지 않고 그대로 머무는 상태였습니다. 그는 이것을 자기 사역의 실패처럼 여기며 하나님 앞에서 낮아질 일로 받아들였습니다.", "여기서 바울의 반응은 분노나 정죄가 아니라 <mark>슬픔</mark>입니다. 자기를 오해하고 비난한 사람들이었지만, 그는 그들을 꺾어 이기려 하지 않고 그들이 돌이켜 회복되기를 바랐습니다. 사랑은 죄를 모른 척하지 않습니다. 그렇다고 상처를 앞세워 상대를 몰아붙이지도 않습니다. 바울은 <mark>분명하게 권면하되 회복을 바라는 마음으로</mark> 다가갑니다. 오해받은 자리에서도 이런 사랑이 가능한 것은 그리스도의 사랑이 그를 붙들고 있었기 때문입니다."], "points": ["누군가의 잘못 앞에서 나는 정죄로 꺾으려 합니까, 슬퍼하며 회복을 구합니까?"]}, {"title": "적용 · 끝까지 회복을 구하시는 주님의 사랑", "paragraphs": ["예수님을 세 번이나 부인했던 베드로를, 부활하신 주님은 디베랴 바닷가에서 다시 찾아오셨습니다. 주님은 그의 실패를 하나하나 따지지 않으시고 <mark>\"네가 나를 사랑하느냐\"</mark>고 세 번 물으신 뒤 <mark>\"내 양을 먹이라\"</mark>고 맡기셨습니다(요 21:15–17). 배신당한 쪽에서 먼저 다가가 무너진 사람을 다시 세우신 것입니다. 주님의 사랑은 상처를 확인하는 데서 멈추지 않고 회복으로 나아갔습니다.", "바울도 그 사랑을 받은 사람이었습니다. 그래서 오해받고 서운한 자리에서도 고린도 성도들을 '사랑하는 자들'이라 부르며, 재물과 자기 자신까지 내어 주겠다고 고백할 수 있었습니다. 그의 사랑은 내가 얼마나 인정받는지에 달려 있지 않았습니다. <mark>먼저 사랑받은 사람이기에, 덜 사랑받는 것 같아도 계속 사랑할 수 있었던 것</mark>입니다.", "우리도 관계 속에서 오해받고 지칠 때가 있습니다. 그럴 때 내가 옳았다는 인정을 받는 데 마음이 묶이면, 관계를 회복하기보다 이기는 데 힘을 쓰게 됩니다. 반대로 불편함을 피하고 싶어 해야 할 권면을 미루기도 하고, 받은 상처 때문에 상대를 꺾으려 하기도 합니다. 그러나 주님이 원하시는 것은 <mark>상대가 그리스도 안에서 세워지도록 진실하게 섬기는 사랑</mark>입니다.", "오늘 나는 누구를 위해 섬기고 있습니까? 그 사람의 회복을 바라고 있습니까, 아니면 내 수고를 알아주기만을 기다리고 있습니까? 오해받은 일이 있다면, 억울함을 내려놓고 주님 앞에서 그 사람을 위해 기도하는 것부터 시작해 보십시오. 주님이 나를 다시 세우셨듯이, 나도 그 사람을 향해 한 걸음 다가갈 수 있습니다."], "points": ["주님이 끝까지 나를 사랑하셨듯이, 오해받는 자리에서도 상대의 회복을 구하며 사랑하겠습니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "오해받은 일 때문에 그 사람을 향한 사랑과 섬김을 거두지 않았다"}, {"key": "c2", "text": "섬김에서 오해가 생길 수 있는 부분을 정직하고 투명하게 하려 했다"}, {"key": "c3", "text": "내가 옳았다는 인정보다 상대와 공동체가 세워지는 것을 더 구했다"}, {"key": "c4", "text": "필요한 권면을 피하지 않되, 상처 때문에 상대를 꺾으려 하지 않았다"}], "s4heading": "묵상 한 줄", "memoHint": "오해받아 지친 관계 속에서, 오늘 나는 그 사람의 회복을 위해 무엇을 할 수 있겠습니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "오해한 사람 위해 기도", "value": "나를 오해한 사람 한 명을 떠올리며 억울함을 내려놓고 그의 회복을 위해 기도하기"}, {"key": "act2", "label": "투명하게 섬기기", "value": "맡은 일이나 재정에서 오해가 생길 수 있는 부분을 미리 정직하게 나누고 정리하기"}, {"key": "act3", "label": "세우는 말 하기", "value": "비방이나 수군거림에 끼지 않고, 그 자리에서 상대를 세우는 말 한마디 건네기"}, {"key": "act4", "label": "사랑으로 권면하기", "value": "미뤄 둔 권면이 있다면 정죄가 아닌 회복을 바라는 마음으로 조심스럽게 전하기"}, {"key": "act5", "label": "말씀 암송", "value": "고린도후서 12:15를 외우며 돌려받지 못해도 계속 사랑하기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "넘어진 베드로를 다시 찾아오셨듯이, 연약하고 실패한 저를 따지지 않으시고 먼저 사랑하며 다시 세우시는 주님께 감사드립니다."}, {"key": "p2", "tag": "회개", "text": "오해받으면 사랑을 거두고, 내가 옳았다는 인정에 매달리며, 필요한 권면은 피하거나 상처 때문에 상대를 꺾으려 했던 저를 용서해 주십시오."}, {"key": "p3", "tag": "간구", "text": "덜 사랑받는 것 같아도 계속 사랑하게 하시고, 정직하게 섬기며, 제 말과 행동이 상대와 공동체를 세우는 데 쓰이게 해 주십시오."}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "November 17, Tuesday", "ref": "2 Corinthians 12:14–21", "headline": "When Misunderstood and Weary,<br>How Should We Love?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · 2 Corinthians 12:14-21", "s1heading": "Today's Word", "verse": "\"I will most gladly spend and be spent for your souls.<br>If I love you more,<br>am I to be loved less?\"", "verseRef": "2 Corinthians 12:15", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · A Love That Does Not Stop at Self-Defense", "paragraphs": ["When we serve sincerely and are still misunderstood, our hearts are shaken. We want people to recognize how hard we tried, and we feel the urge to keep explaining until our name is cleared. And when we grow tired, we may step back from the relationship, telling ourselves, 'I won't bother caring anymore.'", "Paul stood in exactly that place before the Corinthian church. He had planted the church and cared for it for a long time, yet some people <mark>doubted his sincerity and motives and belittled him</mark>. They questioned whether his refusal of financial support was genuine, and even suggested he was secretly taking advantage of them.", "But in today's passage, Paul does not stop at defending himself. His concern was not to be acknowledged as right, but for <mark>the Corinthian believers to be built up again in Christ</mark>. So while answering the suspicions against him, he also clearly names the quarreling and unrepented sin still present in the church. Through today's Word, we look together at what it means to keep seeking another's restoration, even when we are misunderstood and worn out."], "points": ["Because of a recent misunderstanding, am I withdrawing my love from that person?"]}, {"title": "Verses 14–15 · Not What Is Yours, but You", "paragraphs": ["As Paul prepares for his third visit to Corinth, he says, <mark>\"I will not be a burden\"</mark> (v.14). Once again, he will not ask them for financial support. And he explains why: <mark>\"For I seek not what is yours but you.\"</mark> What Paul wanted was not their money, but the people themselves—their faith, their growth, their hearts turned toward Christ.", "He uses the picture of parents and children: <mark>\"Children are not obligated to save up for their parents, but parents for their children.\"</mark> Paul saw the Corinthians as children he had brought to birth through the gospel. Just as parents willingly work and save for their children without expecting repayment, he was ready to labor for them.", "Then he goes further: <mark>\"I will most gladly spend and be spent for your souls\"</mark> (v.15). This is not grudging sacrifice but joyful devotion—he would spend not only his resources but his very self. The question that follows, <mark>\"If I love you more, am I to be loved less?\"</mark>, carries a note of hurt. Yet Paul does not withdraw his love because he receives less in return. His is not a love that gives only as much as it gets back, but a love that keeps giving even when it goes unrecognized."], "points": ["When I serve others, am I seeking the person themselves, or what I can get back from them?"]}, {"title": "Verses 16–18 · Honest Service in the Face of Suspicion", "paragraphs": ["Some people were saying that even though Paul had not burdened them directly, <mark>\"I was crafty, you say, and got the better of you by deceit\"</mark> (v.16). The accusation was that while openly refusing support, Paul was secretly profiting through his co-workers by collecting the offering for the believers in Jerusalem. His good intentions had become grounds for suspicion.", "Paul does not answer this slander in kind. Instead, he asks questions the believers could verify for themselves: <mark>\"Did I take advantage of you through any of those whom I sent to you?\"</mark> (v.17). He had sent Titus along with another brother, and the Corinthians had seen firsthand how they conducted themselves. <mark>\"Did Titus take advantage of you? Did we not act in the same spirit? Did we not take the same steps?\"</mark> (v.18).", "Paul had clearly separated his personal living expenses from the relief offering, and his co-workers served with the same heart and in the same way. We cannot prevent every misunderstanding, but <mark>verifiable honesty</mark> becomes a fence that protects our service. Transparency is not a sign of distrust; it is a way of loving others well by giving them no reason to stumble."], "points": ["Am I being honest and transparent ahead of time in areas of my service where misunderstanding could arise?"]}, {"title": "Verses 19–20 · Not Self-Defense, but for Your Upbuilding", "paragraphs": ["Paul says, <mark>\"Have you been thinking all along that we have been defending ourselves to you?\"</mark> (v.19). He knew his explanations could sound like an attempt to protect his own reputation. But he makes clear that he speaks <mark>\"in the sight of God… in Christ\"</mark>, and states his purpose plainly: <mark>\"and all for your upbuilding, beloved.\"</mark> He still calls those who had hurt him 'beloved,' and he sets the goal of the relationship on their restoration and growth.", "So Paul does not stop at explaining himself; he names the community's real problems. He fears that when they meet again, they may each find the other not as they wished. He worries there may be <mark>\"quarreling, jealousy, anger, hostility, slander, gossip, conceit, and disorder\"</mark> (v.20). These are all sins that tear relationships apart and divide the church.", "The suspicion toward Paul had likely grown in exactly this kind of atmosphere. Yet Paul cared more about the church becoming healthy than about protecting himself. Love that builds up is willing to speak about what is truly wrong, not to win an argument, but because it wants the other person and the whole community to flourish."], "points": ["Is the purpose of my words and actions to defend myself, or to build up others and the community?"]}, {"title": "Verse 21 · Grieving Over Unrepentance", "paragraphs": ["Paul fears one more thing: that when he comes again, <mark>\"my God may humble me before you\"</mark> (v.21), and that he may have to mourn over many who sinned earlier and <mark>\"have not repented of the impurity, sexual immorality, and sensuality that they have practiced.\"</mark> What Paul was concerned about was not the weakness of having stumbled a few times, but the state of knowing one's sin and still refusing to turn from it. He took this as something that would humble him before God, as if it were a failure of his own ministry.", "Here, Paul's response is not anger or condemnation but <mark>grief</mark>. These were people who had misunderstood and criticized him, yet he did not try to crush them to win; he longed for them to turn back and be restored. Love does not pretend sin is not there. But neither does it use its own wounds as a weapon to corner others.", "Paul approached them by <mark>exhorting clearly, yet with a heart that longed for restoration</mark>. That such love was possible even in a place of misunderstanding was because the love of Christ was holding him."], "points": ["When faced with someone's wrongdoing, do I try to crush them with condemnation, or do I grieve and seek their restoration?"]}, {"title": "Application · The Lord's Love That Seeks Restoration to the End", "paragraphs": ["Peter had denied Jesus three times, yet the risen Lord came to find him again by the Sea of Tiberias. The Lord did not go through his failures one by one. Instead, He asked three times, <mark>\"Do you love me?\"</mark> and then entrusted him with the charge, <mark>\"Feed my sheep\"</mark> (John 21:15–17). The one who had been betrayed approached first and raised up the one who had fallen. The Lord's love did not stop at confirming the wound; it moved toward restoration.", "Paul, too, was someone who had received that love. That is why, even when misunderstood and hurt, he could call the Corinthians 'beloved' and confess that he would spend his resources and even himself for them. His love did not depend on how much he was appreciated. <mark>Because he had first been loved, he could keep loving even when he seemed to be loved less.</mark>", "We, too, are sometimes misunderstood and worn out in our relationships. When our hearts are bound to being acknowledged as right, we spend our energy winning rather than restoring. Or, wanting to avoid discomfort, we put off a word of correction that needs to be spoken. Or, because of our wounds, we try to bring the other person down. But what the Lord desires is <mark>a love that serves truthfully so that the other person may be built up in Christ</mark>.", "Whom am I serving today? Am I longing for that person's restoration, or simply waiting for my efforts to be recognized? If you have been misunderstood, begin by laying down your sense of injustice and praying for that person before the Lord. Just as the Lord raised you up again, you too can take one step toward them."], "points": ["As the Lord loved me to the end, I will love others and seek their restoration, even when I am misunderstood."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I did not withdraw my love and service from someone because I was misunderstood."}, {"key": "c2", "text": "I tried to be honest and transparent in areas of my service where misunderstanding could arise."}, {"key": "c3", "text": "I sought the upbuilding of others and the community more than being acknowledged as right."}, {"key": "c4", "text": "I did not avoid necessary correction, yet I did not try to crush the other person because of my hurt."}], "s4heading": "One-Line Reflection", "memoHint": "In a relationship where I feel misunderstood and weary, what can I do today for that person's restoration?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Pray for Them", "value": "Think of one person who misunderstood you, lay down your sense of injustice, and pray for their restoration"}, {"key": "act2", "label": "Serve Transparently", "value": "In your responsibilities or finances, share and clarify ahead of time any area where misunderstanding could arise"}, {"key": "act3", "label": "Speak to Build Up", "value": "Refuse to join in slander or gossip, and offer one word that builds the other person up"}, {"key": "act4", "label": "Exhort in Love", "value": "If you have put off a needed word of correction, share it carefully with a heart for restoration, not condemnation"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize 2 Corinthians 12:15 and keep loving even when love is not returned"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, Lord, that just as You came to find Peter after he fell, You do not tally up my weakness and failure but love me first and raise me up again."}, {"key": "p2", "tag": "Repent", "text": "Forgive me for withdrawing my love when misunderstood, for clinging to being acknowledged as right, and for avoiding needed correction or trying to bring others down because of my hurt."}, {"key": "p3", "tag": "Ask", "text": "Help me keep loving even when I seem to be loved less, to serve with honesty, and to let my words and actions build up others and the community."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Nobyembre 17, Martes", "ref": "2 Corinto 12:14–21", "headline": "Kapag Hindi Naunawaan at Pagod Na,<br>Paano Tayo Dapat Magmahal?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · 2 Corinto 12:14-21", "s1heading": "Salita Ngayon", "verse": "\"Buong galak kong gugugulin ang aking ari-arian,<br>pati ang aking sarili, alang-alang sa inyong mga kaluluwa.<br>Kung lalo ko kayong minamahal, lalo ba akong hindi ninyo mamahalin?\"", "verseRef": "2 Corinto 12:15", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Pag-ibig na Hindi Humihinto sa Pagtatanggol sa Sarili", "paragraphs": ["Kapag taos-puso tayong naglingkod pero hindi pa rin naunawaan, lubhang nayayanig ang ating puso. Gusto nating kilalanin ng iba kung gaano tayo nagsikap, at nais nating patuloy na magpaliwanag hanggang malinis ang ating pangalan. At kapag napagod na, maaaring umatras tayo sa relasyon at sabihin sa sarili, 'Hindi na ako mag-aabala pang magmalasakit.'", "Ganito mismo ang kalagayan ni Pablo sa harap ng iglesya sa Corinto. Itinatag niya ang iglesya at matagal niya itong inalagaan, ngunit may ilang tao na <mark>nagduda sa kanyang katapatan at motibo at minaliit siya</mark>. Pinagdudahan nila kung tapat ba ang hindi niya pagtanggap ng suporta, at ipinahiwatig pa na lihim niya silang pinagsasamantalahan.", "Ngunit sa talata ngayon, hindi humihinto si Pablo sa pagtatanggol sa sarili. Ang kanyang malasakit ay hindi ang makilalang tama siya, kundi ang <mark>muling maitayo kay Cristo ang mga mananampalataya sa Corinto</mark>. Kaya habang sinasagot niya ang mga hinala laban sa kanya, malinaw din niyang binabanggit ang pag-aaway at ang kasalanang hindi pa pinagsisisihan sa iglesya. Sa Salita ngayon, sama-sama nating titingnan kung ano ang ibig sabihin ng patuloy na paghahangad sa panunumbalik ng iba, kahit hindi tayo naunawaan at pagod na."], "points": ["Dahil sa isang kamakailang hindi pagkakaunawaan, binabawi ko ba ang aking pag-ibig sa taong iyon?"]}, {"title": "Talata 14–15 · Hindi ang Inyong Ari-arian, Kundi Kayo", "paragraphs": ["Habang naghahanda si Pablo para sa kanyang ikatlong pagdalaw sa Corinto, sinabi niya, <mark>\"hindi ako magiging pabigat sa inyo\"</mark> (t.14). Muli, hindi siya hihingi ng suportang pinansyal. At ipinaliwanag niya kung bakit: <mark>\"sapagkat hindi ang inyong ari-arian ang hinahanap ko, kundi kayo.\"</mark> Ang nais ni Pablo ay hindi ang kanilang pera, kundi ang mga tao mismo—ang kanilang pananampalataya, paglago, at pusong nakabaling kay Cristo.", "Ginamit niya ang larawan ng magulang at anak: <mark>hindi ang mga anak ang nag-iipon para sa mga magulang, kundi ang mga magulang para sa mga anak</mark>. Itinuring ni Pablo ang mga taga-Corinto na mga anak na isinilang niya sa pamamagitan ng ebanghelyo. Gaya ng mga magulang na kusang nagtatrabaho at nag-iipon para sa kanilang mga anak nang hindi umaasa ng kapalit, handa siyang magpagal para sa kanila.", "Higit pa rito, sinabi niya: <mark>\"Buong galak kong gugugulin ang aking ari-arian, pati ang aking sarili, alang-alang sa inyong mga kaluluwa\"</mark> (t.15). Hindi ito sapilitang sakripisyo kundi masayang pag-aalay. Ang kasunod na tanong, <mark>\"Kung lalo ko kayong minamahal, lalo ba akong hindi ninyo mamahalin?\"</mark>, ay may bahid ng sakit ng loob. Gayunman, hindi binawi ni Pablo ang kanyang pag-ibig dahil mas kaunti ang natatanggap niya. Ang kanyang pag-ibig ay hindi nagbibigay lamang ayon sa natatanggap pabalik, kundi patuloy na nagbibigay kahit hindi kinikilala."], "points": ["Kapag naglilingkod ako, ang tao mismo ba ang hinahanap ko, o ang maibabalik niya sa akin?"]}, {"title": "Talata 16–18 · Tapat na Paglilingkod sa Harap ng Hinala", "paragraphs": ["May ilang nagsasabi na kahit hindi direktang nagpabigat si Pablo, <mark>\"tuso raw ako at nilinlang ko kayo sa pamamagitan ng daya\"</mark> (t.16). Ang paratang ay habang hayagang tumatanggi siya sa suporta, lihim daw siyang kumikita sa pamamagitan ng kanyang mga kamanggagawa sa pangongolekta ng handog para sa mga mananampalataya sa Jerusalem. Ang kanyang mabuting layunin ay naging dahilan pa ng hinala.", "Hindi gumanti si Pablo sa paninirang ito sa parehong paraan. Sa halip, nagtanong siya ng mga bagay na maaaring patunayan mismo ng mga mananampalataya: <mark>\"Pinagsamantalahan ko ba kayo sa pamamagitan ng sinuman sa mga isinugo ko sa inyo?\"</mark> (t.17). Isinugo niya si Tito kasama ang isa pang kapatid, at nakita mismo ng mga taga-Corinto kung paano sila kumilos. <mark>\"Pinagsamantalahan ba kayo ni Tito? Hindi ba't lumakad kami sa iisang Espiritu? Hindi ba't sa iisang yapak?\"</mark> (t.18).", "Malinaw na pinaghiwalay ni Pablo ang kanyang personal na gastusin at ang handog na tulong, at naglingkod ang kanyang mga kamanggagawa nang may parehong puso at paraan. Hindi natin mapipigilan ang bawat hindi pagkakaunawaan, ngunit ang <mark>katapatang maaaring patunayan</mark> ay nagiging bakod na nag-iingat sa ating paglilingkod. Ang pagiging bukas ay hindi tanda ng kawalan ng tiwala; ito ay paraan ng mabuting pagmamahal sa iba."], "points": ["Tapat at bukas ba ako nang maaga sa mga bahagi ng aking paglilingkod kung saan maaaring magkaroon ng hindi pagkakaunawaan?"]}, {"title": "Talata 19–20 · Hindi Pagtatanggol sa Sarili, Kundi Para sa Inyong Ikatitibay", "paragraphs": ["Sinabi ni Pablo, <mark>\"Inaakala ba ninyo hanggang ngayon na ipinagtatanggol lamang namin ang aming sarili sa inyo?\"</mark> (t.19). Alam niyang maaaring marinig ang kanyang mga paliwanag na parang pagtatanggol sa sariling dangal. Ngunit nilinaw niyang nagsasalita siya <mark>\"sa harapan ng Diyos, kay Cristo\"</mark>, at malinaw niyang sinabi ang layunin: <mark>\"Mga minamahal, ang lahat ng ito ay para sa inyong ikatitibay.\"</mark> Tinatawag pa rin niyang 'minamahal' ang mga nakasakit sa kanya, at inilalagay niya ang layunin ng relasyon sa kanilang panunumbalik at paglago.", "Kaya hindi humihinto si Pablo sa pagpapaliwanag; binabanggit niya ang tunay na mga suliranin ng komunidad. Natatakot siyang sa muli nilang pagkikita, makita nila ang isa't isa nang hindi gaya ng kanilang nais. Nag-aalala siyang baka mayroong <mark>\"pag-aaway, inggit, galit, pagkakampi-kampi, paninirang-puri, tsismisan, kapalaluan, at kaguluhan\"</mark> (t.20). Lahat ng ito ay mga kasalanang sumisira sa relasyon at naghahati sa iglesya.", "Malamang na sa ganitong kapaligiran din lumago ang hinala laban kay Pablo. Gayunman, mas pinahalagahan ni Pablo ang paglusog ng iglesya kaysa sa pagtatanggol sa sarili. Ang pag-ibig na nagpapatibay ay handang magsalita tungkol sa tunay na mali, hindi para manalo sa pagtatalo, kundi dahil nais nitong umunlad ang kapwa at ang buong komunidad."], "points": ["Ang layunin ba ng aking mga salita at gawa ay ipagtanggol ang sarili, o patibayin ang kapwa at ang komunidad?"]}, {"title": "Talata 21 · Pagdadalamhati sa Hindi Pagsisisi", "paragraphs": ["May isa pang kinatatakutan si Pablo: na sa muli niyang pagdating, <mark>\"baka ibaba ako ng aking Diyos sa harap ninyo\"</mark> (t.21), at baka kailangan niyang managhoy dahil sa marami na nagkasala noon at <mark>\"hindi nagsisi sa karumihan, sekswal na imoralidad, at kahalayang kanilang ginawa.\"</mark> Ang inaalala ni Pablo ay hindi ang kahinaan ng ilang beses na pagkatisod, kundi ang kalagayang alam ang kasalanan ngunit ayaw pa ring tumalikod dito. Itinuring niya ito na parang kabiguan ng sarili niyang ministeryo na magpapababa sa kanya sa harap ng Diyos.", "Dito, ang tugon ni Pablo ay hindi galit o paghatol kundi <mark>pagdadalamhati</mark>. Sila ang mga hindi nakaunawa at pumuna sa kanya, ngunit hindi niya sinikap na durugin sila para manalo; hinangad niyang bumalik sila at manumbalik. Hindi nagkukunwari ang pag-ibig na walang kasalanan. Ngunit hindi rin nito ginagamit ang sariling sugat bilang sandata para sukulin ang iba.", "Lumapit si Pablo sa kanila na <mark>malinaw na nagpapayo, ngunit may pusong naghahangad ng panunumbalik</mark>. Naging posible ang ganitong pag-ibig kahit sa lugar ng hindi pagkakaunawaan dahil hinahawakan siya ng pag-ibig ni Cristo."], "points": ["Sa harap ng pagkakamali ng iba, sinisikap ko bang durugin sila sa paghatol, o nagdadalamhati ako at hinahangad ang kanilang panunumbalik?"]}, {"title": "Pagsasabuhay · Pag-ibig ng Panginoon na Naghahangad ng Panunumbalik Hanggang sa Wakas", "paragraphs": ["Tatlong beses na ikinaila ni Pedro si Jesus, ngunit muli siyang hinanap ng muling nabuhay na Panginoon sa tabi ng Dagat ng Tiberias. Hindi isa-isang inungkat ng Panginoon ang kanyang mga kabiguan. Sa halip, tatlong beses Niyang tinanong, <mark>\"Mahal mo ba Ako?\"</mark> at saka ipinagkatiwala sa kanya, <mark>\"Pakanin mo ang Aking mga tupa\"</mark> (Juan 21:15–17). Ang Siyang ipinagkanulo ang unang lumapit at nagbangon sa nadapa. Hindi huminto ang pag-ibig ng Panginoon sa pagkumpirma ng sugat; sumulong ito tungo sa panunumbalik.", "Si Pablo rin ay isang taong tumanggap ng pag-ibig na iyon. Kaya kahit hindi naunawaan at nasaktan, natawag pa rin niyang 'minamahal' ang mga taga-Corinto at naipahayag na gugugulin niya ang kanyang ari-arian at pati ang sarili para sa kanila. Ang kanyang pag-ibig ay hindi nakadepende sa kung gaano siya pinahahalagahan. <mark>Dahil siya muna ang inibig, patuloy siyang nakapagmahal kahit tila mas kaunti ang pagmamahal na natatanggap niya.</mark>", "Tayo rin ay minsang hindi naunawaan at napapagod sa ating mga relasyon. Kapag nakatali ang ating puso sa pagkilalang tama tayo, ginugugol natin ang lakas sa pagkapanalo sa halip na sa panunumbalik. O kaya, dahil ayaw natin ng hindi komportableng sitwasyon, ipinagpapaliban natin ang payong kailangang sabihin. O dahil sa ating sugat, sinisikap nating ibagsak ang kapwa. Ngunit ang nais ng Panginoon ay <mark>pag-ibig na tapat na naglilingkod upang maitayo kay Cristo ang kapwa</mark>.", "Para kanino ako naglilingkod ngayon? Hinahangad ko ba ang panunumbalik ng taong iyon, o naghihintay lamang akong makilala ang aking pagsisikap? Kung ikaw ay hindi naunawaan, magsimula sa pagbaba ng iyong sama ng loob at pananalangin para sa taong iyon sa harap ng Panginoon. Kung paanong ibinangon ka muli ng Panginoon, maaari ka ring humakbang nang isang hakbang palapit sa kanila."], "points": ["Gaya ng pag-ibig ng Panginoon sa akin hanggang sa wakas, mamahalin ko ang iba at hahangarin ang kanilang panunumbalik, kahit hindi ako maunawaan."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Hindi ko binawi ang aking pag-ibig at paglilingkod sa isang tao dahil hindi ako naunawaan."}, {"key": "c2", "text": "Sinikap kong maging tapat at bukas sa mga bahagi ng aking paglilingkod kung saan maaaring magkaroon ng hindi pagkakaunawaan."}, {"key": "c3", "text": "Mas hinangad ko ang ikatitibay ng kapwa at ng komunidad kaysa sa makilalang tama ako."}, {"key": "c4", "text": "Hindi ko iniwasan ang kinakailangang payo, ngunit hindi ko rin sinikap na durugin ang kapwa dahil sa aking sugat."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Sa isang relasyon kung saan pakiramdam ko'y hindi ako naunawaan at pagod na, ano ang magagawa ko ngayon para sa panunumbalik ng taong iyon?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Ipanalangin Sila", "value": "Isipin ang isang taong hindi nakaunawa sa iyo, ibaba ang sama ng loob, at ipanalangin ang kanyang panunumbalik"}, {"key": "act2", "label": "Maglingkod nang Bukas", "value": "Sa iyong mga tungkulin o pananalapi, ibahagi at linawin nang maaga ang anumang bahaging maaaring pagmulan ng hindi pagkakaunawaan"}, {"key": "act3", "label": "Magsalita para Magpatibay", "value": "Huwag sumali sa paninirang-puri o tsismisan, at magbigay ng isang salitang nagpapatibay sa kapwa"}, {"key": "act4", "label": "Magpayo nang may Pag-ibig", "value": "Kung may ipinagpaliban kang payo, ibahagi ito nang maingat na may pusong naghahangad ng panunumbalik, hindi paghatol"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang 2 Corinto 12:15 at patuloy na magmahal kahit hindi nasusuklian ang pag-ibig"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Panginoon, na gaya ng muli Mong paghahanap kay Pedro matapos siyang madapa, hindi Mo binibilang ang aking kahinaan at kabiguan kundi inuuna Mo akong ibigin at muling ibangon."}, {"key": "p2", "tag": "Pagsisisi", "text": "Patawarin Mo ako sa pagbawi ng aking pag-ibig kapag hindi naunawaan, sa pagkapit sa pagkilalang tama ako, at sa pag-iwas sa kinakailangang payo o pagsisikap na ibagsak ang iba dahil sa aking sugat."}, {"key": "p3", "tag": "Kahilingan", "text": "Tulungan Mo akong patuloy na magmahal kahit tila mas kaunti ang pagmamahal na natatanggap ko, maglingkod nang may katapatan, at gamitin ang aking mga salita at gawa upang patibayin ang kapwa at ang komunidad."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-11-17';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
