<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "11월 8일 주일", "ref": "고린도후서 6장 1절–7장 1절", "headline": "받은 은혜가<br>내 삶을 바꾸고 있습니까?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 고린도후서 6:1-7:1", "s1heading": "오늘의 말씀", "verse": "\"우리가 하나님과 함께 일하는 자로서 너희를 권하노니<br>하나님의 은혜를 헛되이 받지 말라 …<br>보라 지금은 은혜 받을 만한 때요 보라 지금은 구원의 날이로다\"", "verseRef": "고린도후서 6:1–2", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 은혜 받았다는 고백이 일상으로 이어질 때", "paragraphs": ["우리는 예배를 마친 뒤 \"은혜 받았다\"는 말을 자주 합니다. 그런데 일상에서는 익숙한 생각과 생활 방식을 그대로 붙들 때가 있습니다. 하나님께 감사하면서도 사람을 대하는 태도는 달라지지 않고, 중요한 선택 앞에서는 내 이익과 편안함을 먼저 따집니다. 오늘 바울은 받은 은혜가 삶에서 어떻게 드러나야 하는지 보여 줍니다. <mark>하나님께 받은 은혜는 고난을 대하는 태도와 사람을 향한 마음, 하나님께 대한 충성을 바꾸어야 합니다</mark>.", "바울은 3장에서 성령의 변화시키는 사역을, 4장에서 연약한 사람을 통해 드러나는 하나님의 능력을, 5장에서 그리스도 안에서 하나님과 화목하게 된 은혜를 말했습니다. 그러나 바울과 고린도 교회 사이에는 여전히 의심과 갈등이 있었습니다. 그래서 오늘 본문은 <mark>바울의 사역, 교회와의 관계, 공동체의 거룩한 삶</mark>을 함께 다룹니다."], "points": ["내가 받은 은혜는 지금 나의 태도와 관계와 선택을 어떻게 바꾸고 있습니까?"]}, {"title": "6:1–2 · 은혜에 대한 응답: 지금은 구원의 날입니다", "paragraphs": ["<mark>\"우리가 하나님과 함께 일하는 자로서 너희를 권하노니 하나님의 은혜를 헛되이 받지 말라\"</mark>(1절). 성도들이 받은 은혜는 그리스도를 통해 하나님과 화목하게 된 은혜입니다. 은혜를 헛되이 받는다는 것은 <mark>은혜를 고백하면서도 그 복음을 거스르는 방향으로 살아가는 것</mark>입니다. 하나님과 화목했다고 하면서 여전히 다른 것을 주인으로 섬기고, 그리스도께서 바꾸신 삶의 목적을 외면하는 것입니다. 바울은 교회 일을 더 하라는 말로 끝내지 않고, 복음을 진실하게 믿고 삶을 그 은혜에 맡기라고 요청합니다.", "바울은 이사야 49장 8절을 인용해 <mark>\"보라 지금은 은혜 받을 만한 때요 보라 지금은 구원의 날이로다\"</mark>(2절)라고 선포합니다. 포로 된 백성을 회복하시겠다는 약속이 그리스도의 죽음과 부활로 이루어지고 있습니다. 그러니 은혜를 듣는 사람도 <mark>지금</mark> 응답해야 합니다. 혹시 회개와 순종을 계속 나중으로 미루고 있지는 않습니까?"], "points": ["은혜를 소중히 여긴다는 것은 감동했던 순간을 기억하며, 오늘 하루의 선택도 그 은혜에 맡기는 것입니다."]}, {"title": "6:3–10 · 고난 속에서의 반응: 하나님의 일꾼으로 견딥니다", "paragraphs": ["바울은 <mark>\"이 직분이 비방을 받지 않게 하려고\"</mark>(3절) 힘썼습니다. 자신의 부정직함이나 이기적인 행동이 복음을 가리지 않도록 한 것입니다. 전하는 복음과 사는 모습이 함께 가야 합니다. 이어서 바울은 환난과 궁핍, 매 맞음과 갇힘, 난동, 수고와 잠 못 이룸과 굶주림을 나열하는데, 이 목록을 이끄는 말은 <mark>\"많이 견디는 것\"</mark>입니다. 고생을 자랑하는 것이 아니라 그 속에서 사역을 어떻게 감당했는지 보여 줍니다. 그래서 깨끗함과 지식, 오래 참음과 자비, 성령과 거짓이 없는 사랑이 함께 등장합니다(6절). 고생을 많이 했다고 저절로 사람을 사랑하게 되지는 않습니다. <mark>고난 속에서 어떤 사람으로 살아가느냐</mark>가 중요합니다.", "바울은 영광과 욕됨, 칭찬과 비방을 함께 받았지만 사람들의 평가가 그의 사역을 최종적으로 결정하지 못했습니다. <mark>\"근심하는 자 같으나 항상 기뻐하고 가난한 자 같으나 많은 사람을 부요하게 하고 아무것도 없는 자 같으나 모든 것을 가진 자로다\"</mark>(10절). 슬픔과 가난도 실제였지만, 주님 안의 기쁨과 은혜도 실제였습니다. 고통이 삶의 전부가 아니었기에 기뻐할 수 있었습니다."], "points": ["받은 은혜는 어려움 속에서 사람을 어떻게 대하는지에서 분명하게 드러납니다."]}, {"title": "6:11–13 · 사랑으로 넓어진 마음: 너희도 마음을 넓히라", "paragraphs": ["<mark>\"고린도인들이여 너희를 향하여 우리의 입이 열리고 우리의 마음이 넓어졌으니\"</mark>(11절). 바울은 성도들의 잘못을 책망하면서도 사랑과 받아들임을 거두지 않습니다. 그들의 믿음을 소중히 여기기에 필요한 말을 솔직하게 전했습니다. 성도들은 여전히 바울을 의심하고 멀리했지만, 바울은 관계의 어려움이 자신의 사랑이 부족해서가 아니라 <mark>그들의 마음이 닫혀 있기 때문</mark>이라고 말합니다.", "<mark>\"내가 자녀에게 말하듯 하노니 보답하는 것으로 너희도 마음을 넓히라\"</mark>(13절). 어린아이 취급이 아니라, 복음으로 함께 걸어온 아버지와 자녀의 관계를 기억하게 하는 말입니다. 이것을 오늘의 지도자에게 무조건 복종하라는 뜻으로 옮겨서는 안 됩니다. 말씀에 맞는 권면인지 살피되, 내 마음이 불편하다는 이유로 진실한 말씀까지 밀어내지는 말아야 합니다."], "points": ["마음을 연다는 것은 듣기 좋은 말을 넘어, 나를 바로 세우는 진실한 권면에도 자리를 내어 주는 것입니다."]}, {"title": "6:14–7:1 · 하나님께 속한 백성: 거룩함을 온전히 이룹니다", "paragraphs": ["마음을 넓히라는 말씀 뒤에 <mark>\"너희는 믿지 않는 자와 멍에를 함께 메지 말라\"</mark>(14절)는 명령이 이어집니다. 사람을 사랑하는 것과 그 사람이 하는 모든 일에 함께 참여하는 것은 분별해야 하기 때문입니다. 당시 고린도에는 여러 신전이 있었고, 예수님을 믿은 뒤에도 우상 숭배와 관련된 생활을 유지하려는 유혹이 있었습니다. 바울은 의와 불법, 빛과 어둠, 그리스도와 벨리알(사탄), 하나님의 성전과 우상을 대조합니다. 그렇다고 세상 사람들과 모든 관계를 끊으라는 말은 아닙니다(고전 5:10; 7:12–13). 분별할 질문은 이것입니다. <mark>이 관계와 참여가 나로 하여금 하나님께 대한 충성을 저버리게 합니까?</mark>", "<mark>\"우리는 살아 계신 하나님의 성전이라\"</mark>(16절). 하나님은 멀리서 명령만 하시는 분이 아니라 우리 가운데 거하시고 <mark>\"너희에게 아버지가 되고\"</mark>(18절) 우리를 맞아 주십니다. 거룩함은 그 관계에서 출발합니다. 그래서 바울은 자신도 포함하여 <mark>\"육과 영의 온갖 더러운 것에서 자신을 깨끗하게 하자\"</mark>(7:1)고 말합니다. 겉으로 드러나는 행동뿐 아니라 생각과 욕망, 숨은 동기까지 하나님 앞에서 살핍니다."], "points": ["하나님과의 관계가 소중할수록, 내려놓아야 할 것도 분명해집니다."]}, {"title": "적용 · 이미 받은 은혜에 오늘 응답합니다", "paragraphs": ["예수님께서 삭개오를 찾아오신 장면을 기억해 보십시오. 사람들은 죄인의 집에 들어간다고 수군거렸지만 예수님은 그를 찾아가 함께하셨습니다. 그 만남에서 삭개오는 <mark>\"소유의 절반을 가난한 자들에게 주겠사오며 만일 누구의 것을 속여 빼앗은 일이 있으면 네 갑절이나 갚겠나이다\"</mark>(눅 19:8)라고 말합니다. 먼저 주님이 찾아오셨고, 그 은혜에 대한 응답이 돈을 다루는 손과 이웃을 책임지는 행동으로 이어졌습니다. 삭개오에게 은혜는 그날의 감동에서 끝나지 않았습니다.", "우리 주님은 죄인을 찾아오셨고, 십자가에서 죄를 담당하셨으며, 다시 살아나셔서 하나님과 화목한 삶의 길을 여셨습니다. <mark>우리를 받아 주신 이 은혜가 오늘 순종할 이유이며 힘</mark>입니다. 바울이 말했듯 지금이 은혜 받을 만한 때이니, 감동을 나중으로 미루지 말고 오늘의 작은 선택으로 응답하십시오.", "오늘 작은 응답 하나를 시작해 보십시오. 삶의 어려움 때문에 거칠어진 말투를 멈추고, 닫아 두었던 마음을 조금 열어 진실한 권면을 들으며, <mark>하나님께 대한 충성을 흐리게 하는 참여에서 한 걸음 물러서십시오</mark>. 그렇게 순종해서 하나님의 사랑을 얻는 것이 아닙니다. 이미 받은 사랑이 소중하기에 그 은혜에 응답하는 것입니다.", "오늘 어떤 말과 관계와 선택을 바꾸어 이미 받은 은혜에 응답하시겠습니까?"], "points": ["지금이 은혜 받을 만한 때입니다. 미루지 않고 오늘 한 가지로 응답합니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "'은혜 받았다'는 고백이 오늘의 태도와 선택으로 이어지고 있는지 돌아봤다"}, {"key": "c2", "text": "회개와 순종을 '나중에'라며 미루고 있는 일이 없는지 점검했다"}, {"key": "c3", "text": "어려움을 이유로 다른 사람에게 거칠게 대하지 않았는지 돌아봤다"}, {"key": "c4", "text": "하나님께 대한 충성을 흐리게 하는 관계나 참여가 없는지 분별했다"}], "s4heading": "묵상 한 줄", "memoHint": "이미 받은 은혜에 응답하기 위해 오늘 바꾸어야 할 말이나 관계, 선택 한 가지는 무엇입니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "미루지 않기", "value": "계속 나중으로 미뤄 온 회개나 순종 한 가지를 오늘 실천하기"}, {"key": "act2", "label": "말투 바꾸기", "value": "힘들다는 이유로 거칠어진 말투를 멈추고 오래 참음과 친절로 말하기"}, {"key": "act3", "label": "마음 넓히기", "value": "불편해서 밀어냈던 진실한 권면이나 말씀에 다시 귀 기울이기"}, {"key": "act4", "label": "한 걸음 물러서기", "value": "하나님께 대한 충성을 흐리게 하는 참여나 습관에서 한 걸음 물러서기"}, {"key": "act5", "label": "말씀 암송", "value": "고린도후서 6:1–2을 외우며 '지금이 은혜 받을 만한 때'임을 기억하기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "그리스도 안에서 저를 화목하게 하시고, 우리 가운데 거하시며 아버지가 되어 주시고, 지금을 은혜 받을 만한 때로 주신 하나님께 감사합니다"}, {"key": "p2", "tag": "회개", "text": "은혜를 고백하면서도 내 이익과 편안함을 따라 살고, 회개와 순종을 미루며, 어려움을 핑계로 사람에게 거칠게 대했던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "주님의 은혜를 헛되이 받지 않게 하시고, 고난 속에서도 사랑으로 견디며 마음을 넓히고, 육과 영을 깨끗하게 하여 거룩함을 이루게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "November 8, Lord's Day", "ref": "2 Corinthians 6:1–7:1", "headline": "Is the Grace I've Received<br>Changing My Life?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · 2 Corinthians 6:1-7:1", "s1heading": "Today's Word", "verse": "\"Working together with Him, then, we appeal to you<br>not to receive the grace of God in vain …<br>Behold, now is the favorable time; behold, now is the day of salvation.\"", "verseRef": "2 Corinthians 6:1–2", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · When 'I Received Grace' Carries into Everyday Life", "paragraphs": ["After worship we often say, 'I received grace.' Yet in daily life we sometimes cling to the same familiar thoughts and ways of living. We still thank God, but our attitude toward people doesn't change, and in important choices we instinctively weigh our own interests and comfort first. Today Paul shows how the grace we've received should show itself in life. <mark>The grace we receive from God must change how we face suffering, our hearts toward people, and our loyalty to God.</mark>", "In chapter 3 Paul explained the Spirit's work of transforming people; in chapter 4, God's power revealed through weak people; and in chapter 5, the grace of being reconciled to God in Christ. Yet suspicion and conflict still remained between Paul, who proclaimed that grace, and the Corinthian church. So today's passage deals together with <mark>Paul's ministry, his relationship with the church, and the community's holy life</mark>. God accepted us first. Through today's Word, let's look at ourselves: How is the grace I've received changing my attitudes, relationships, and choices right now? Let's look at four keywords."], "points": ["How is the grace I've received changing my attitudes, relationships, and choices right now?"]}, {"title": "6:1–2 · Responding to Grace: Now Is the Day of Salvation", "paragraphs": ["In verse 1, Paul urges the Corinthians: <mark>'Working together with Him, then, we appeal to you not to receive the grace of God in vain.'</mark> 'We' here refers first to Paul and his co-workers — God proclaimed the message of reconciliation, the gospel, through them. The grace the believers received is the grace of being reconciled to God through Christ. Receiving grace in vain means <mark>confessing grace while living in a direction that rejects that gospel</mark> — saying we've been reconciled to God while continuing to serve something else as master, and ignoring the new purpose of life Christ has given. Paul doesn't end this appeal by telling them to do more church work. He asks them to truly believe the gospel they received and entrust their lives to that grace.", "In verse 2, Paul quotes Isaiah 49:8, God's promise to save and restore His people in exile. Paul proclaims that this promise is being fulfilled through Christ's death and resurrection: <mark>'Behold, now is the favorable time; behold, now is the day of salvation.'</mark> So now is the time when God's salvation has been revealed through Christ, and those who hear this grace must respond <mark>now</mark>. Are you perhaps continually postponing repentance and obedience until later? God gave grace first. Respond to it today."], "points": ["Treasuring grace means remembering the moments it moved us and entrusting today's choices to it as well."]}, {"title": "6:3–10 · Responding in Suffering: Enduring as God's Servants", "paragraphs": ["In verse 3, Paul says he strove so that <mark>'no fault may be found with our ministry.'</mark> Paul was criticized too, but his own faults must not obscure the gospel. He worked so that his dishonesty or selfish behavior would never become an obstacle to people receiving the gospel. The gospel we proclaim and the way we live must go together. We can apply this to ourselves: we must take care that people don't misunderstand the Lord we believe in because of our words and actions. In verses 4–7, Paul explains how he lived as a servant of God: afflictions, hardships, calamities, beatings, imprisonments, riots, labors, sleepless nights, hunger. The word leading this list is <mark>'great endurance.'</mark> Paul isn't boasting about how much he suffered; he shows how he carried out his ministry amid those hardships — revealing the gospel's power. So verses 6–7 mention purity, knowledge, patience, kindness, the Holy Spirit, genuine love, the word of truth, and the power of God. Experiencing many hardships doesn't automatically make us love people; we may even hurt others because of our pain. That's why <mark>what kind of person we are in suffering</mark> matters so much. Paul endured and loved by the Spirit's help and God's power. God's power appeared not only in rescuing him from danger but in a life that treated difficult people with patience and sincerity. The picture of 'weapons of righteousness for the right hand and for the left' shows him carrying out his ministry with weapons God provides — not deception or coercion, but serving the church in righteous ways.", "In verses 8–10, Paul received both honor and dishonor, praise and slander. But people's evaluations didn't have the final say over his ministry. Called a deceiver, he was truthful. Unrecognized, he was known to God. In danger of death and the pain of beatings, God held his life. Sorrow was real, hunger and poverty were real — but joy and grace in the Lord were real too: <mark>'as sorrowful, yet always rejoicing; as poor, yet making many rich; as having nothing, yet possessing everything.'</mark> Paul didn't rejoice because he felt no pain; he could rejoice because pain wasn't the whole of his life. 'Making many rich' means serving so that people are reconciled to God through the gospel and enjoy new life. Though materially poor, Paul shared the grace he'd received in Christ. The greatest riches he held were belonging to God."], "points": ["The grace we've received shows clearly in how we treat people in the midst of hardship."]}, {"title": "6:11–13 · A Heart Widened by Love: Widen Your Hearts Too", "paragraphs": ["In verses 11–12, Paul addresses the Corinthian believers directly: <mark>'We have spoken freely to you, Corinthians; our heart is wide open.'</mark> He confesses that his words and heart are open toward them. Even while rebuking their wrongs, Paul does not withdraw his love, forgiveness, and acceptance. Because he treasures their faith, he sometimes spoke needed words frankly, even as rebuke. The Corinthian believers still doubted Paul and kept their distance. Yet Paul still holds them in his heart. He makes clear that the relational difficulty didn't arise from a lack of love on his part, but because <mark>their hearts were closed toward him</mark>. He seeks both the restoration of their relationship and that they live worthily of the gospel.", "In verse 13, Paul says as to children, <mark>'In return (I speak as to children) widen your hearts also.'</mark> This isn't treating them as infants; it reminds them of the father-child relationship of having walked the path of faith together since he brought them the gospel. 'In return' doesn't mean money; it's a request to respond with love to Paul, who opened his heart to them in love. We must not turn this into a command to obey today's leaders unconditionally. We should examine whether counsel accords with the Word — but we must not push away truthful words simply because they make us uncomfortable."], "points": ["Opening our hearts means going beyond welcome words to making room for truthful counsel that sets us right."]}, {"title": "6:14–7:1 · People Who Belong to God: Bringing Holiness to Completion", "paragraphs": ["In 6:14–16, right after 'widen your hearts' comes the command, <mark>'Do not be unequally yoked with unbelievers.'</mark> Loving people and participating in everything they do must be distinguished. A yoke is a tool binding animals together to work. Paul uses this picture to urge believers not to bind themselves in a direction that conflicts with following God. Corinth then had temples to many gods, and their feasts were tied to social life. Even after believing in Jesus, there was temptation to keep up a life connected with idolatry. Some interpreters link this passage with Paul's opponents, but the contrast between God's temple and idols shows that relationships tied to idolatry come first; any specific group can't be determined from the text alone. Paul contrasts righteousness and lawlessness, light and darkness, Christ and Belial — here a name for Satan — believer and unbeliever, the temple of God and idols. A community belonging to God cannot participate in idol worship. Yet this doesn't mean cutting off all relationships with the world. Paul said believers may eat with unbelievers, and told a believer already married to an unbeliever to keep the marriage if the spouse wishes to stay (1 Corinthians 5:10; 7:12–13). The question for discernment is this: <mark>Does this relationship or participation cause me to abandon my loyalty to God?</mark>", "In verses 16–18, Paul declares that the church community is <mark>'the temple of the living God.'</mark> Because God dwells among them, that community must be set apart — holy. Paul connects God's promise to dwell among His people with His word to the returning exiles to depart from unclean places, and applies this promise to the church that has become God's people in Christ. God isn't One who only gives orders from afar. He dwells among us, welcomes us, and <mark>'I will be a father to you'</mark> (v. 18). So holiness begins with our relationship with God: because He first received us as His children, we now live as people who belong to Him. 7:1: <mark>'Since we have these promises, beloved, let us cleanse ourselves from every defilement of body and spirit, bringing holiness to completion in the fear of God.'</mark> Here Paul includes himself; he isn't just commanding the believers but confessing he stands under the same calling. 'Body and spirit' refers to both our outward selves and our inner life — not only visible actions but thoughts, desires, and hidden motives must be examined before God. In this context, what's needed first is concrete obedience: breaking with idolatry and actually leaving behavior that defiles us. That obedience then leads to holiness in the whole of life. Fearing God means taking our Father's holiness and judgment seriously; because the relationship with Him is precious, we don't take sin lightly."], "points": ["The more precious our relationship with God, the clearer what we must lay down becomes."]}, {"title": "Application · Responding Today to the Grace Already Received", "paragraphs": ["Remember the scene of Jesus coming to Zacchaeus. People grumbled that He was going into a sinner's house, but Jesus sought him out and stayed with him. In that encounter Zacchaeus said, <mark>'Behold, Lord, the half of my goods I give to the poor. And if I have defrauded anyone of anything, I restore it fourfold'</mark> (Luke 19:8). The Lord came to him first, and his response to that grace carried into the hands that handled money and actions that took responsibility for his neighbors. For Zacchaeus, grace didn't end with the emotion of that day.", "Our Lord came to sinners, bore sin on the cross, and rose again to open the way of a life reconciled to God. <mark>This grace that has received us is both our reason and our strength to obey today.</mark>", "So begin one small response today. Stop the harsh tone that hardship has given your words; open a little the heart you've kept closed and listen to truthful counsel and God's Word; and <mark>take one step back from any participation that clouds your loyalty to God</mark>. We don't obey in order to earn God's love. Because the love we've already received is precious, we respond to that grace.", "What words, relationships, and choices will you change today to respond to the grace you've already received?"], "points": ["Now is the favorable time. Without delay, I respond today in one concrete way."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether my confession 'I received grace' is carrying into today's attitudes and choices."}, {"key": "c2", "text": "I checked whether there's repentance or obedience I keep putting off 'until later.'"}, {"key": "c3", "text": "I reflected on whether I treated others harshly using hardship as an excuse."}, {"key": "c4", "text": "I discerned whether any relationship or participation is clouding my loyalty to God."}], "s4heading": "One-Line Reflection", "memoHint": "What is one word, relationship, or choice I need to change today to respond to the grace I've already received?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Don't Delay", "value": "Put into practice today one act of repentance or obedience you've kept postponing"}, {"key": "act2", "label": "Change My Tone", "value": "Stop the harsh tone that comes from hardship and speak with patience and kindness"}, {"key": "act3", "label": "Widen My Heart", "value": "Listen again to truthful counsel or a Word you pushed away because it was uncomfortable"}, {"key": "act4", "label": "Step Back", "value": "Take one step back from a participation or habit that clouds your loyalty to God"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize 2 Corinthians 6:1–2 and remember that 'now is the favorable time'"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, God, for reconciling me in Christ, dwelling among us and being our Father, and giving us now as the favorable time of grace."}, {"key": "p2", "tag": "Repent", "text": "I repent of confessing grace while living by my interests and comfort, postponing repentance and obedience, and treating people harshly with hardship as my excuse."}, {"key": "p3", "tag": "Ask", "text": "Keep me from receiving Your grace in vain; help me endure with love in suffering, widen my heart, and cleanse body and spirit to bring holiness to completion."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Nobyembre 8, Araw ng Panginoon", "ref": "2 Corinto 6:1–7:1", "headline": "Binabago ba ng Biyayang Natanggap Ko<br>ang Aking Buhay?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · 2 Corinto 6:1-7:1", "s1heading": "Salita Ngayon", "verse": "\"Bilang mga kamanggagawa Niya, nakikiusap kami sa inyo<br>na huwag ninyong tanggapin nang walang kabuluhan ang biyaya ng Diyos …<br>Narito, ngayon ang kanais-nais na panahon; narito, ngayon ang araw ng kaligtasan.\"", "verseRef": "2 Corinto 6:1–2", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Kapag Dinadala sa Pang-araw-araw na Buhay ang 'Nakatanggap Ako ng Biyaya'", "paragraphs": ["Pagkatapos ng pagsamba, madalas nating sabihin, 'Nakatanggap ako ng biyaya.' Ngunit sa pang-araw-araw na buhay, minsan ay kumakapit tayo sa parehong pamilyar na pag-iisip at paraan ng pamumuhay. Nagpapasalamat pa rin tayo sa Diyos, ngunit hindi nagbabago ang ating saloobin sa mga tao, at sa mahahalagang pasya ay likas nating inuuna ang sariling interes at ginhawa. Ngayon, ipinapakita ni Pablo kung paano dapat mahayag sa buhay ang biyayang natanggap natin. <mark>Ang biyayang natatanggap natin mula sa Diyos ay dapat magbago sa pagharap natin sa pagdurusa, sa ating puso para sa mga tao, at sa ating katapatan sa Diyos.</mark>", "Sa kabanata 3, ipinaliwanag ni Pablo ang gawa ng Espiritu na nagbabago sa mga tao; sa kabanata 4, ang kapangyarihan ng Diyos na nahahayag sa pamamagitan ng mahihinang tao; at sa kabanata 5, ang biyaya ng pakikipagkasundo sa Diyos kay Cristo. Gayunman, nananatili pa rin ang hinala at alitan sa pagitan ni Pablo, na nagpahayag ng biyayang iyon, at ng iglesya sa Corinto. Kaya sama-samang hinaharap ng talata ngayon ang <mark>ministeryo ni Pablo, ang kanyang relasyon sa iglesya, at ang banal na pamumuhay ng komunidad</mark>. Ang Diyos ang unang tumanggap sa atin. Sa pamamagitan ng Salita ngayon, tingnan natin ang ating sarili: Paano binabago ngayon ng biyayang natanggap ko ang aking saloobin, relasyon, at pasya? Tingnan natin ang apat na susing salita."], "points": ["Paano binabago ngayon ng biyayang natanggap ko ang aking saloobin, relasyon, at pasya?"]}, {"title": "6:1–2 · Pagtugon sa Biyaya: Ngayon ang Araw ng Kaligtasan", "paragraphs": ["Sa talata 1, hinihimok ni Pablo ang mga taga-Corinto: <mark>'Bilang mga kamanggagawa Niya, nakikiusap kami sa inyo na huwag ninyong tanggapin nang walang kabuluhan ang biyaya ng Diyos.'</mark> Ang 'kami' rito ay unang tumutukoy kay Pablo at sa kanyang mga kamanggagawa — ipinahayag ng Diyos ang mensahe ng pakikipagkasundo, ang ebanghelyo, sa pamamagitan nila. Ang biyayang natanggap ng mga mananampalataya ay ang biyaya ng pakikipagkasundo sa Diyos sa pamamagitan ni Cristo. Ang pagtanggap ng biyaya nang walang kabuluhan ay <mark>pagpapahayag ng biyaya habang namumuhay sa direksyong tumatanggi sa ebanghelyong iyon</mark> — pagsasabing nakipagkasundo na tayo sa Diyos habang patuloy na naglilingkod sa ibang bagay bilang panginoon, at binabalewala ang bagong layunin ng buhay na ibinigay ni Cristo. Hindi tinatapos ni Pablo ang pakiusap na ito sa pagsasabing gumawa pa ng mas maraming gawain sa iglesya. Hinihiling niyang tunay nilang paniwalaan ang ebanghelyong natanggap nila at ipagkatiwala ang kanilang buhay sa biyayang iyon.", "Sa talata 2, sinipi ni Pablo ang Isaias 49:8, ang pangako ng Diyos na iligtas at ibalik ang Kanyang bayang nasa pagkabihag. Ipinahayag ni Pablo na natutupad ang pangakong ito sa pamamagitan ng kamatayan at muling pagkabuhay ni Cristo: <mark>'Narito, ngayon ang kanais-nais na panahon; narito, ngayon ang araw ng kaligtasan.'</mark> Kaya ngayon ang panahong nahayag ang kaligtasan ng Diyos sa pamamagitan ni Cristo, at ang mga nakaririnig ng biyayang ito ay dapat tumugon <mark>ngayon</mark>. Patuloy mo bang ipinagpapaliban ang pagsisisi at pagsunod? Ang Diyos ang unang nagbigay ng biyaya. Tumugon dito ngayon."], "points": ["Ang pagpapahalaga sa biyaya ay pag-alala sa mga sandaling inantig tayo nito at pagkakatiwala rin dito ng mga pasya ngayon."]}, {"title": "6:3–10 · Pagtugon sa Pagdurusa: Nagtitiis Bilang mga Lingkod ng Diyos", "paragraphs": ["Sa talata 3, sinasabi ni Pablo na nagsikap siya upang <mark>'walang kapintasang masumpungan sa aming ministeryo.'</mark> Pinuna rin si Pablo, ngunit hindi dapat takpan ng sarili niyang mga pagkakamali ang ebanghelyo. Nagsikap siya upang hindi kailanman maging hadlang ang kanyang kawalang-katapatan o makasariling kilos sa pagtanggap ng mga tao sa ebanghelyo. Dapat magkasama ang ebanghelyong ipinapahayag natin at ang paraan ng ating pamumuhay. Mailalapat natin ito sa ating sarili: dapat tayong mag-ingat na huwag hindi maunawaan ng mga tao ang Panginoong sinasampalatayanan natin dahil sa ating mga salita at kilos. Sa talata 4–7, ipinaliwanag ni Pablo kung paano siya namuhay bilang lingkod ng Diyos: mga kapighatian, kahirapan, sakuna, pambubugbog, pagkabilanggo, kaguluhan, pagpapagal, mga gabing walang tulog, gutom. Ang salitang nangunguna sa listahang ito ay <mark>'malaking pagtitiis.'</mark> Hindi nagmamalaki si Pablo sa dami ng kanyang pagdurusa; ipinapakita niya kung paano niya ginampanan ang kanyang ministeryo sa gitna ng mga paghihirap na iyon — inihahayag ang kapangyarihan ng ebanghelyo. Kaya binabanggit ng talata 6–7 ang kadalisayan, kaalaman, pagtitiyaga, kabaitan, ang Espiritu Santo, tapat na pag-ibig, ang salita ng katotohanan, at ang kapangyarihan ng Diyos. Hindi tayo awtomatikong napapaibig sa mga tao dahil sa maraming paghihirap; maaari pa nga tayong makasakit ng iba dahil sa ating sakit. Kaya napakahalaga ng <mark>kung anong uri ng tao tayo sa pagdurusa</mark>. Nagtiis at umibig si Pablo sa tulong ng Espiritu at kapangyarihan ng Diyos. Nahayag ang kapangyarihan ng Diyos hindi lamang sa pagliligtas sa kanya sa panganib kundi sa buhay na tumatrato sa mahihirap na tao nang may pagtitiyaga at katapatan. Ang larawan ng 'mga sandata ng katuwiran sa kanan at sa kaliwang kamay' ay nagpapakita na ginampanan niya ang kanyang ministeryo gamit ang mga sandatang ibinibigay ng Diyos — hindi panlilinlang o pamimilit, kundi paglilingkod sa iglesya sa matuwid na paraan.", "Sa talata 8–10, tumanggap si Pablo ng parehong karangalan at kahihiyan, papuri at paninirang-puri. Ngunit hindi ang pagsusuri ng tao ang may huling salita sa kanyang ministeryo. Tinawag na manlilinlang, tapat siya. Hindi kinikilala, kilala siya ng Diyos. Sa panganib ng kamatayan at sakit ng pambubugbog, hinawakan ng Diyos ang kanyang buhay. Totoo ang kalungkutan, totoo ang gutom at kahirapan — ngunit totoo rin ang kagalakan at biyaya sa Panginoon: <mark>'na parang nalulungkot, ngunit laging nagagalak; na parang dukha, ngunit nagpapayaman sa marami; na parang walang anuman, ngunit nagtataglay ng lahat ng bagay.'</mark> Hindi nagalak si Pablo dahil wala siyang nadamang sakit; nakapagagalak siya dahil hindi ang sakit ang kabuuan ng kanyang buhay. Ang 'nagpapayaman sa marami' ay nangangahulugang paglilingkod upang makipagkasundo ang mga tao sa Diyos sa pamamagitan ng ebanghelyo at tamasahin ang bagong buhay. Bagama't dukha sa materyal, ibinahagi ni Pablo ang biyayang natanggap niya kay Cristo. Ang pinakadakilang kayamanang hawak niya ay ang pagiging pag-aari ng Diyos."], "points": ["Malinaw na nahahayag ang biyayang natanggap natin sa kung paano natin tinatrato ang mga tao sa gitna ng hirap."]}, {"title": "6:11–13 · Pusong Pinalawak ng Pag-ibig: Palawakin Din Ninyo ang Inyong Puso", "paragraphs": ["Sa talata 11–12, tuwirang tinawag ni Pablo ang mga mananampalataya sa Corinto: <mark>'Malaya kaming nagsalita sa inyo, mga taga-Corinto; bukas na bukas ang aming puso.'</mark> Ipinahayag niyang bukas ang kanyang mga salita at puso sa kanila. Kahit sinasaway niya ang kanilang mga mali, hindi binabawi ni Pablo ang kanyang pag-ibig, kapatawaran, at pagtanggap. Dahil pinahahalagahan niya ang kanilang pananampalataya, minsan ay tapat niyang sinabi ang kinakailangang salita, kahit bilang pagsaway. Patuloy pa ring nagdududa at lumalayo ang mga mananampalataya sa Corinto kay Pablo. Gayunman, dala pa rin sila ni Pablo sa kanyang puso. Nililinaw niyang ang hirap sa relasyon ay hindi nagmula sa kakulangan ng pag-ibig niya, kundi dahil <mark>sarado ang kanilang puso sa kanya</mark>. Hinahangad niya kapwa ang pagpapanumbalik ng kanilang relasyon at ang kanilang pamumuhay nang karapat-dapat sa ebanghelyo.", "Sa talata 13, sinabi ni Pablo na parang sa mga anak, <mark>'Bilang ganti (nagsasalita ako na parang sa mga anak), palawakin din ninyo ang inyong puso.'</mark> Hindi ito pagtrato sa kanila bilang mga sanggol; ipinaaalala nito ang relasyon ng ama at anak na sama-samang lumakad sa landas ng pananampalataya mula nang dalhin niya sa kanila ang ebanghelyo. Ang 'bilang ganti' ay hindi nangangahulugang pera; ito ay kahilingang tumugon nang may pag-ibig kay Pablo, na nagbukas ng kanyang puso sa kanila nang may pag-ibig. Hindi natin dapat gawin itong utos na walang kondisyong sundin ang mga pinuno ngayon. Dapat nating suriin kung ang payo ay naaayon sa Salita — ngunit hindi natin dapat itulak palayo ang tapat na mga salita dahil lamang hindi tayo komportable."], "points": ["Ang pagbubukas ng ating puso ay higit pa sa masarap pakinggang salita; ito ay paglalaan ng puwang para sa tapat na payong nagtutuwid sa atin."]}, {"title": "6:14–7:1 · Mga Taong Pag-aari ng Diyos: Isinasakatuparan ang Kabanalan", "paragraphs": ["Sa 6:14–16, kasunod mismo ng 'palawakin ang inyong puso' ay ang utos, <mark>'Huwag kayong makipamatok nang hindi pantay sa mga hindi mananampalataya.'</mark> Dapat ibukod ang pag-ibig sa mga tao at ang pakikibahagi sa lahat ng kanilang ginagawa. Ang pamatok ay kasangkapang nagbubuklod sa mga hayop upang magkasamang magtrabaho. Ginagamit ni Pablo ang larawang ito upang himukin ang mga mananampalataya na huwag igapos ang sarili sa direksyong salungat sa pagsunod sa Diyos. Noon, maraming templo ng iba't ibang diyos sa Corinto, at ang kanilang mga piging ay kaugnay ng buhay panlipunan. Kahit matapos manampalataya kay Jesus, may tukso na ipagpatuloy ang buhay na kaugnay ng pagsamba sa diyus-diyosan. Iniuugnay ng ilang interpreter ang talatang ito sa mga kalaban ni Pablo, ngunit ipinapakita ng paghahambing ng templo ng Diyos at mga diyus-diyosan na una ang mga relasyong kaugnay ng pagsamba sa diyus-diyosan; hindi matitiyak mula sa talata lamang ang anumang tiyak na grupo. Pinaghahambing ni Pablo ang katuwiran at kasamaan, liwanag at kadiliman, si Cristo at si Belial — dito ay pangalan ni Satanas — ang mananampalataya at hindi mananampalataya, ang templo ng Diyos at mga diyus-diyosan. Hindi maaaring makibahagi sa pagsamba sa diyus-diyosan ang komunidad na pag-aari ng Diyos. Gayunman, hindi ito nangangahulugang putulin ang lahat ng relasyon sa mundo. Sinabi ni Pablo na maaaring kumain ang mga mananampalataya kasama ng mga hindi mananampalataya, at sinabihan ang mananampalatayang kasal na sa hindi mananampalataya na panatilihin ang kasal kung nais ng asawa na manatili (1 Corinto 5:10; 7:12–13). Ito ang tanong para sa pagkilala: <mark>Pinapangyari ba ng relasyon o pakikibahaging ito na talikuran ko ang aking katapatan sa Diyos?</mark>", "Sa talata 16–18, ipinahayag ni Pablo na ang komunidad ng iglesya ay <mark>'ang templo ng buhay na Diyos.'</mark> Dahil nananahan ang Diyos sa gitna nila, dapat ibukod ang komunidad na iyon — banal. Iniuugnay ni Pablo ang pangako ng Diyos na manahan sa gitna ng Kanyang bayan sa Kanyang salita sa mga bumabalik mula sa pagkabihag na lumayo sa maruruming lugar, at inilalapat ang pangakong ito sa iglesyang naging bayan ng Diyos kay Cristo. Ang Diyos ay hindi ang Isang nag-uutos lamang mula sa malayo. Nananahan Siya sa gitna natin, tinatanggap tayo, at <mark>'Ako'y magiging Ama ninyo'</mark> (t. 18). Kaya nagsisimula ang kabanalan sa ating relasyon sa Diyos: dahil Siya ang unang tumanggap sa atin bilang Kanyang mga anak, namumuhay na tayo ngayon bilang mga taong pag-aari Niya. 7:1: <mark>'Dahil taglay natin ang mga pangakong ito, mga minamahal, linisin natin ang ating sarili mula sa bawat karumihan ng katawan at espiritu, isinasakatuparan ang kabanalan sa takot sa Diyos.'</mark> Dito, isinasama ni Pablo ang kanyang sarili; hindi lamang siya nag-uutos sa mga mananampalataya kundi ipinapahayag niyang nakatayo rin siya sa ilalim ng parehong pagtawag. Ang 'katawan at espiritu' ay tumutukoy kapwa sa ating panlabas na pagkatao at panloob na buhay — hindi lamang ang nakikitang kilos kundi ang mga isip, pagnanasa, at nakatagong motibo ay dapat suriin sa harap ng Diyos. Sa kontekstong ito, ang unang kailangan ay kongkretong pagsunod: pagputol sa pagsamba sa diyus-diyosan at tunay na paglayo sa kilos na nagpaparumi sa atin. Humahantong ang pagsunod na iyon sa kabanalan ng buong buhay. Ang pagkatakot sa Diyos ay seryosong pagtanggap sa kabanalan at paghatol ng ating Ama; dahil mahalaga ang relasyon sa Kanya, hindi natin ginagaan ang kasalanan."], "points": ["Habang lalong nagiging mahalaga ang ating relasyon sa Diyos, lalong lumilinaw kung ano ang dapat nating bitawan."]}, {"title": "Aplikasyon · Tumutugon Ngayon sa Biyayang Natanggap Na", "paragraphs": ["Alalahanin ang tagpo ng pagdating ni Jesus kay Zaqueo. Bumulong ang mga tao na pumapasok Siya sa bahay ng makasalanan, ngunit hinanap siya ni Jesus at nanatili kasama niya. Sa pagkikitang iyon, sinabi ni Zaqueo, <mark>'Narito, Panginoon, ang kalahati ng aking ari-arian ay ibinibigay ko sa mga dukha. At kung may nadaya ako sa anuman, ibabalik ko nang apat na ulit'</mark> (Lucas 19:8). Ang Panginoon ang unang dumating sa kanya, at ang kanyang tugon sa biyayang iyon ay umabot sa mga kamay na humahawak ng pera at sa mga kilos na nananagot sa kanyang kapwa. Para kay Zaqueo, hindi nagtapos ang biyaya sa damdamin ng araw na iyon.", "Dumating ang ating Panginoon sa mga makasalanan, pinasan ang kasalanan sa krus, at muling nabuhay upang buksan ang daan ng buhay na nakipagkasundo sa Diyos. <mark>Ang biyayang ito na tumanggap sa atin ang kapwa dahilan at lakas natin upang sumunod ngayon.</mark>", "Kaya simulan ang isang maliit na tugon ngayon. Ihinto ang magaspang na tonong ibinigay ng hirap sa iyong mga salita; buksan nang kaunti ang pusong isinara mo at pakinggan ang tapat na payo at Salita ng Diyos; at <mark>umatras ng isang hakbang mula sa anumang pakikibahaging nagpapalabo sa iyong katapatan sa Diyos</mark>. Hindi tayo sumusunod upang makamit ang pag-ibig ng Diyos. Dahil mahalaga ang pag-ibig na natanggap na natin, tumutugon tayo sa biyayang iyon.", "Anong mga salita, relasyon, at pasya ang babaguhin mo ngayon upang tumugon sa biyayang natanggap mo na?"], "points": ["Ngayon ang kanais-nais na panahon. Nang walang pagpapaliban, tumutugon ako ngayon sa isang kongkretong paraan."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung ang pagpapahayag kong 'Nakatanggap ako ng biyaya' ay umaabot sa aking saloobin at pasya ngayon."}, {"key": "c2", "text": "Sinuri ko kung may pagsisisi o pagsunod na patuloy kong ipinagpapaliban 'sa susunod.'"}, {"key": "c3", "text": "Pinag-isipan ko kung tinrato ko nang magaspang ang iba gamit ang hirap bilang dahilan."}, {"key": "c4", "text": "Kinilala ko kung may relasyon o pakikibahaging nagpapalabo sa aking katapatan sa Diyos."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Ano ang isang salita, relasyon, o pasya na kailangan kong baguhin ngayon upang tumugon sa biyayang natanggap ko na?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Huwag Ipagpaliban", "value": "Isagawa ngayon ang isang pagsisisi o pagsunod na patuloy mong ipinagpapaliban"}, {"key": "act2", "label": "Baguhin ang Tono", "value": "Ihinto ang magaspang na tonong dulot ng hirap at magsalita nang may pagtitiyaga at kabaitan"}, {"key": "act3", "label": "Palawakin ang Puso", "value": "Pakinggang muli ang tapat na payo o Salitang itinulak mo palayo dahil hindi ka komportable"}, {"key": "act4", "label": "Umatras ng Isang Hakbang", "value": "Umatras ng isang hakbang mula sa pakikibahagi o ugaling nagpapalabo sa iyong katapatan sa Diyos"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang 2 Corinto 6:1–2 at alalahaning 'ngayon ang kanais-nais na panahon'"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Diyos, sa pakikipagkasundo sa akin kay Cristo, sa pananahan sa gitna namin at pagiging aming Ama, at sa pagbibigay sa amin ng ngayon bilang kanais-nais na panahon ng biyaya."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa pagpapahayag ng biyaya habang namumuhay ayon sa aking interes at ginhawa, sa pagpapaliban ng pagsisisi at pagsunod, at sa magaspang na pagtrato sa mga tao gamit ang hirap bilang dahilan."}, {"key": "p3", "tag": "Kahilingan", "text": "Ilayo Mo ako sa pagtanggap ng Iyong biyaya nang walang kabuluhan; tulungan Mo akong magtiis nang may pag-ibig sa pagdurusa, palawakin ang aking puso, at linisin ang katawan at espiritu upang isakatuparan ang kabanalan."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-11-08';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
