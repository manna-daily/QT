<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "11월 26일 목요일", "ref": "이사야 40장 1–11절", "headline": "하나님이 시작하신 위로,<br>예수님 안에서 이루어지다", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 이사야 40:1-11", "s1heading": "오늘의 말씀", "verse": "\"너희의 하나님이 이르시되<br>너희는 위로하라<br>내 백성을 위로하라\"", "verseRef": "이사야 40:1", "s2heading": "5분 요약", "cards": [{"title": "배경 · 이사야서 전반부와 후반부", "paragraphs": ["이사야서는 모두 66장입니다. 보통 1–39장을 전반부, 40–66장을 후반부로 나눕니다. 그 이유는 크게 세 가지 변화 때문입니다. 첫째는 <mark>역사적 배경의 변화</mark>입니다. 전반부에서는 앗수르의 위협이 중요하게 등장하지만, 후반부에서는 바벨론 포로와 그 이후의 회복이 중요한 배경이 됩니다.", "둘째는 <mark>메시지의 변화</mark>입니다. 전반부에서는 하나님의 심판과 경고가 강조되었다면, 40장부터는 하나님의 위로와 구원의 약속이 더욱 강조됩니다. 셋째는 <mark>소망의 구체화</mark>입니다. 하나님께서 자기 백성을 어떻게 구원하시고, 궁극적으로 어떤 새로운 세상을 이루실지를 보여 주십니다.", "후반부 가운데 40–48장은 포로 된 백성을 향한 하나님의 위로와 해방을 다룹니다. 여기서 기억할 것이 있습니다. 바로 앞 39장은 유다 백성이 <mark>바벨론의 포로로 끌려갈 것이라는 예고</mark>로 끝납니다. 그들이 의지했던 것들을 잃게 될 것이라는 심판의 말씀입니다. 그렇다면 하나님께서 자기 백성을 버리신 것일까요? 놀랍게도 40장은 전혀 다른 말씀으로 시작합니다."], "points": ["심판의 말씀 뒤에 위로의 말씀이 이어진다는 것은, 하나님에 대해 무엇을 말해 줍니까?"]}, {"title": "들어가며 · 심판이 하나님의 마지막 말씀은 아니었습니다", "paragraphs": ["40장에서 하나님은 <mark>자기 백성을 위로하라고 명령하십니다</mark>. 하나님은 심판을 말씀하셨지만, 심판이 하나님의 마지막 말씀은 아니었습니다. 고난을 겪을 때 가장 두려운 것은 고난 자체만이 아닙니다. 그 고난이 언제 끝날지 알 수 없다는 것입니다. 군 복무를 하는 이들이 '그래도 시간은 간다'고 말하며 버티듯, 힘들어도 끝이 있다는 것을 알면 견딜 수 있습니다.", "그런데 끝이 보이지 않는 고난은 어떨까요? 특히 <mark>자신의 잘못으로 인해 고난을 겪을 때</mark>는 더욱 그렇습니다. '하나님께서 나를 다시 받아 주실까? 다시 시작할 기회가 있을까? 하나님께서 나를 잊으신 것은 아닐까?' 바벨론 포로를 겪게 될 유다 백성도 이런 질문 앞에 놓였습니다. 그들은 단순히 강대국에 패배한 것이 아니라, 하나님의 말씀을 거절한 결과를 심판으로 겪게 되었기 때문입니다.", "그런데 오늘 본문은 하나님께서 먼저 그들에게 말씀하시는 장면으로 시작합니다. 그 말씀은 또 다른 책망이 아니라, <mark>여전히 그들을 자기 백성이라고 부르시는</mark> 말씀이었습니다. 하나님의 백성이 절망 가운데서도 다시 소망을 가질 수 있는 이유는 무엇일까요? 그 대답은 인간의 능력이나 변화가 아니라 <mark>먼저 위로를 시작하시는 하나님의 은혜</mark>에 있습니다."], "points": ["내 잘못으로 시작된 어려움 앞에서, 하나님이 나를 잊으셨다고 생각하고 있지는 않습니까?"]}, {"title": "1–2절 · 위로의 이유: 먼저 \"내 백성\"이라 부르시는 하나님", "paragraphs": ["<mark>\"너희의 하나님이 이르시되 너희는 위로하라 내 백성을 위로하라\"</mark>(1절). 여기서 먼저 주목할 것은 말씀의 내용보다 <mark>누가 먼저 말씀하시는가</mark>입니다. 사사기를 보면 처음에는 백성이 부르짖지만, 시간이 지나자 하나님을 부르지도 않습니다. 그럼에도 하나님은 회복을 약속하십니다. 오늘 본문도 유다 백성이 용서를 구하는 장면으로 시작하지 않습니다. 그들이 회복을 위해 무언가를 이루었다는 이야기도 없습니다. 하나님께서 먼저 말씀하시고, '위로하라'를 두 번 반복하십니다.", "여기서 위로는 단순히 마음을 편하게 해 주는 감정적 위안이 아니라, <mark>하나님께서 자기 백성을 회복시키겠다는 구원의 선언</mark>입니다. 더 중요한 표현은 '내 백성'과 '너희의 하나님'입니다. 이것은 하나님과 이스라엘 사이의 언약 관계를 나타냅니다. 유다는 말씀을 거절했고 심판을 겪지만, 하나님은 언약의 신실하심을 포기하지 않으셨습니다. 하나님의 위로는 인간이 먼저 자격을 갖추었기 때문이 아니라 하나님께서 먼저 은혜를 베푸시기에 시작됩니다.", "2절은 위로의 이유를 세 가지로 말합니다. <mark>\"그 노역의 때가 끝났고 그 죄악이 사함을 받았느니라 그의 모든 죄로 말미암아 여호와의 손에서 벌을 배나 받았느니라\"</mark>. '배나 받았다'는 말은 죄보다 두 배로 가혹하게 벌하셨다는 뜻이 아니라, 형벌의 기간이 충분히 찼고 이제 용서와 회복을 선언하신다는 의미입니다. 그렇다고 이스라엘이 고난으로 스스로 죄를 해결한 것은 아닙니다. 이사야 후반부는 값없이 베푸시는 구원의 은혜를 강조하며, 53장에서는 <mark>여호와의 종이 백성의 죄를 담당하시는 모습</mark>을 보여 줍니다. 하나님의 은혜는 죄를 무시하는 은혜가 아니라, 죄의 문제를 다루시면서도 자기 백성을 포기하지 않으시는 은혜입니다."], "points": ["상황이 바뀌기 전에, 하나님이 나를 여전히 \"내 백성\"이라 부르신다는 사실을 붙들고 있습니까?"]}, {"title": "3–5절 · 위로의 실현: 하나님이 친히 오시는 길", "paragraphs": ["바벨론에 포로로 잡혀간 백성이 자기 힘으로 벗어날 수 있을까요? 그들에게는 바벨론을 이길 군사력도, 운명을 바꿀 정치적 능력도 없었습니다. <mark>\"너희는 광야에서 여호와의 길을 예비하라 사막에서 우리 하나님의 대로를 평탄하게 하라\"</mark>(3절). 이것은 왕이 행차할 때 길을 정비하는 모습을 떠올리게 합니다. 그런데 그 길은 <mark>이스라엘이 탈출하기 위한 길이 아니라 하나님께서 오시기 위한 길</mark>입니다. 출애굽 때처럼, 이제 다시 하나님께서 친히 찾아오십니다.", "<mark>\"골짜기마다 돋우어지며 산마다, 언덕마다 낮아지며 고르지 아니한 곳이 평탄하게 되며 험한 곳이 평지가 될 것이요\"</mark>(4절). 이것은 지형이 바뀐다는 이야기만이 아닙니다. 하나님께서 자기 백성을 구원하러 오실 때 <mark>어떤 장애물도 그 구원을 막을 수 없다</mark>는 선언입니다. 사람의 눈에는 바벨론이 절대적인 힘을 가진 것처럼 보이지만, 하나님 앞에서는 그 거대한 제국도 장애물이 될 수 없습니다.", "<mark>\"여호와의 영광이 나타나고 모든 육체가 그것을 함께 보리라\"</mark>(5절). 하나님이 오시는 목적은 포로 생활을 끝내는 데 그치지 않고 하나님의 영광이 온 세상에 드러나는 것입니다. 이것이 모든 사람이 자동으로 구원받는다는 뜻은 아니며, 하나님이 자기 백성을 구원하시는 일이 온 세상 앞에 그분의 영광을 드러낸다는 뜻입니다. 이 말씀은 신약에서 예수님의 길을 준비한 <mark>세례 요한의 사명</mark>과 연결됩니다. 구원의 시작은 우리가 하나님께 도달할 수 있다는 자신감이 아니라, <mark>하나님께서 우리에게 찾아오셨다는 사실</mark>에 있습니다."], "points": ["문제가 생기면 내가 할 일부터 찾기 전에, 먼저 찾아오시는 하나님을 바라보고 있습니까?"]}, {"title": "6–8절 · 위로의 확실성: 풀은 마르나 말씀은 영원히 서리라", "paragraphs": ["그래도 현실을 보면 의문이 생깁니다. 정말 하나님께서 그 약속을 이루실 수 있을까요? <mark>\"모든 육체는 풀이요 그의 모든 아름다움은 들의 꽃과 같으니\"</mark>(6절). 풀과 꽃은 아름답지만 오래가지 못합니다. 인간의 생명만 유한한 것이 아니라, <mark>인간이 자랑하는 능력과 영광, 심지어 인간의 신실함조차</mark> 영원하지 않습니다. 당시 세상을 지배하던 바벨론도 하나님 앞에서는 풀과 같습니다.", "<mark>\"풀은 마르고 꽃이 시듦은 여호와의 기운이 그 위에 불기 때문이라 이 백성은 실로 풀이로다\"</mark>(7절). 바벨론만 풀이 아니라 이스라엘도 풀입니다. 이것은 두 가지를 동시에 보여 줍니다. <mark>바벨론은 하나님의 구원을 막을 수 없고, 이스라엘은 자기 능력으로 구원을 이룰 수 없습니다.</mark> 구원의 확실성은 인간에게 있지 않고 하나님께 있습니다. 또 5절의 '모든 육체'가 하나님의 영광을 보는데, 6절은 바로 그 '모든 육체'가 풀이라고 말합니다. 영광을 보는 이들은 연약하고 유한한 존재이기에, 구원은 인간의 강함이 아니라 하나님의 신실하심을 드러냅니다.", "<mark>\"풀은 마르고 꽃은 시드나 우리 하나님의 말씀은 영원히 서리라\"</mark>(8절). 여기서 하나님의 말씀은 단순한 종교적 교훈이 아니라, 앞에서 선언하신 위로와 회복의 약속을 포함합니다. 세상을 지배하는 제도도 사라지고 인간의 영광도 사라집니다. 그러나 하나님께서 자기 백성을 구원하시겠다고 말씀하셨다면 그 약속은 반드시 이루어집니다. 믿음은 변하지 않는 세상을 기대하는 것이 아니라, <mark>변하는 세상 가운데서도 변하지 않는 하나님의 말씀을 신뢰하는 것</mark>입니다."], "points": ["흔들리는 상황 속에서, 나는 무엇보다 영원히 서는 하나님의 말씀을 신뢰하고 있습니까?"]}, {"title": "9–11절 · 위로의 선포: 강한 팔의 왕이 품어 주시는 목자로", "paragraphs": ["<mark>\"좋은 소식을 시온에 전하는 자여 너는 높은 산에 오르라… 두려워하지 말고 소리를 높여 유다의 성읍들에게 이르기를 너희의 하나님을 보라 하라\"</mark>(9절). 아름다운 소식은 단순히 바벨론의 짐에서 벗어난다는 소식이 아니라 <mark>하나님께서 자기 백성을 찾아오신다는 소식</mark>입니다. 이것이 복음의 출발점입니다. 하나님의 백성은 위로를 받고서 멈추는 존재가 아니라, 자신들을 구원하신 하나님을 세상에 전하는 존재입니다.", "<mark>\"보라 주 여호와께서 장차 강한 자로 임하실 것이요 친히 그의 팔로 다스리실 것이라 보라 상급이 그에게 있고 보응이 그의 앞에 있으며\"</mark>(10절). 하나님의 강한 팔은 자기 백성을 구원하고 원수를 물리치시는 능력을 드러냅니다. 하나님은 단순히 마음을 달래시는 분이 아니라 <mark>자기 백성을 억압하는 권세를 이기시는 능력의 하나님</mark>입니다. 상급과 보응을 가지고 오신다는 말씀도 승리하신 왕의 모습입니다.", "그런데 11절에서 놀라운 장면이 나타납니다. <mark>\"그는 목자 같이 양 떼를 먹이시며 어린 양을 그 팔로 모아 품에 안으시며 젖먹이는 암컷들을 온순히 인도하시리로다\"</mark>. 10절에서 강한 팔로 다스리시는 왕이 11절에서는 <mark>바로 그 팔로 어린 양을 품에 안으시는 목자</mark>가 되십니다. 하나님은 모든 양을 같은 속도로 몰아붙이지 않으시고, 각각의 형편과 연약함을 아시고 세심하게 돌보십니다. 하나님은 사랑은 있으나 능력이 없는 분도, 능력은 있으나 사랑이 없는 통치자도 아닙니다. 세상을 다스리시는 능력이 연약한 백성을 품으시는 사랑으로 나타납니다."], "points": ["나를 같은 속도로 몰아붙이지 않으시고 품어 주시는 목자의 팔을 경험하고 있습니까?"]}, {"title": "적용 · 예수님 안에서 우리에게 이른 위로", "paragraphs": ["이 위로의 약속은 어떻게 우리에게까지 이르렀을까요? 그 대답은 예수 그리스도께 있습니다. 광야에서 여호와의 길을 예비하라는 3절 말씀은 신약에서 <mark>세례 요한을 통해 다시 선포됩니다</mark>(마 3:3). 세례 요한은 사람들에게 회개를 촉구하며 주님의 길을 준비했고, 그 길에 예수님께서 오셨습니다. 요한복음 1장은 <mark>\"말씀이 육신이 되어 우리 가운데 거하시매\"</mark>(요 1:14)라고 증언합니다. 하나님께서 친히 오시겠다는 약속이 예수님 안에서 더욱 깊고 분명하게 성취되었습니다.", "예수님은 오셔서 우리의 고난을 이해한다고 말씀하시는 데서 그치지 않으셨습니다. 우리의 죄를 대신 담당하시고 십자가에서 죽으셨으며, 부활하심으로 죄와 죽음의 권세를 이기셨습니다. <mark>우리가 하나님께 돌아갈 길을 스스로 만든 것이 아니라, 예수님께서 우리를 하나님께로 이끄셨습니다.</mark> 또 요한복음 10장에서 예수님은 자신이 선한 목자이심을 밝히십니다. 어린 양을 품으시는 11절의 목자는 우리를 위해 자기 목숨까지 내어 주신 예수님 안에서 구체적으로 드러납니다.", "혹시 지금 하나님으로부터 멀어져 계십니까? 자신의 잘못 때문에 하나님 앞에 다시 나아가기가 두려우십니까? 끝이 보이지 않는 문제 앞에서 하나님이 나를 잊으셨다고 생각하고 계십니까? 이 말씀은 모든 문제가 당장 사라진다는 약속은 아니지만, <mark>우리의 문제가 하나님의 사랑보다 크지 않다</mark>는 사실을 기억하게 합니다. 물론 믿음으로 돌아서는 결단과 순종이 필요합니다. '하나님이 다 알아서 하시겠지' 하며 자신의 죄를 외면하는 것은 믿음이 아니라 방종입니다. 그러나 우리가 돌아갈 수 있는 이유는 우리의 의지가 강해서가 아니라, 예수님을 통해 은혜를 베푸신 하나님께서 우리를 부르고 계시기 때문입니다.", "오늘 우리가 할 일은 분명합니다. 상황이 달라지기만을 기다리기보다 <mark>하나님의 말씀 앞에 다시 서는 것</mark>입니다. 그리고 내가 받은 위로를 가족과 이웃에게도 전하는 것입니다. 우리의 소망은 고난이 끝났다는 확신이 아니라, 예수 그리스도를 통해 찾아오신 하나님이 끝까지 우리를 붙드신다는 약속에 있습니다. 오늘도 우리를 위로하시고 품으시고 인도하시는 선한 목자 예수님을 신뢰하며 살아가시기 바랍니다."], "points": ["상황이 바뀌기만 기다리지 않고, 오늘 하나님의 말씀 앞에 다시 서며 받은 위로를 이웃에게 전하겠습니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "내 잘못으로 시작된 어려움 속에서도 하나님이 나를 \"내 백성\"이라 부르심을 기억했다"}, {"key": "c2", "text": "내 힘으로 해결하려 하기 전에 먼저 찾아오시는 하나님을 바라보았다"}, {"key": "c3", "text": "\"하나님이 알아서 하시겠지\" 하며 내 죄를 외면하지 않고 돌이켰다"}, {"key": "c4", "text": "내가 받은 하나님의 위로를 가족이나 이웃에게 전했다"}], "s4heading": "묵상 한 줄", "memoHint": "끝이 보이지 않는 문제 앞에서, 오늘 내가 붙들 하나님의 위로의 말씀은 무엇입니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "다시 나아가기", "value": "잘못 때문에 멀어졌던 마음을 정직하게 고백하고 하나님 앞에 다시 나아가기"}, {"key": "act2", "label": "말씀 붙들기", "value": "상황을 바라보며 걱정하기 전에 이사야 40:8을 읽고 하루를 시작하기"}, {"key": "act3", "label": "위로 전하기", "value": "지친 가족이나 이웃에게 \"하나님이 당신을 잊지 않으셨어요\"라고 위로의 말 건네기"}, {"key": "act4", "label": "속도 맞춰 주기", "value": "연약한 사람을 내 속도로 몰아붙이지 않고 그의 형편에 맞게 기다려 주기"}, {"key": "act5", "label": "말씀 암송", "value": "이사야 40:1, 8을 외우며 먼저 위로하시는 하나님의 은혜를 기억하기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "심판의 자리에서도 저를 \"내 백성\"이라 부르시며 먼저 위로를 시작하시고, 예수님 안에서 친히 찾아오신 하나님께 감사드립니다."}, {"key": "p2", "tag": "회개", "text": "제 잘못 때문에 하나님께 나아가기를 두려워하거나, 반대로 \"알아서 하시겠지\" 하며 죄를 외면했던 것을 회개합니다."}, {"key": "p3", "tag": "간구", "text": "풀처럼 연약한 저를 영원한 말씀으로 붙드시고, 강한 팔과 온유한 품으로 인도하시며, 제가 받은 위로를 이웃에게 전하게 해 주십시오."}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "November 26, Thursday", "ref": "Isaiah 40:1–11", "headline": "The Comfort God Began,<br>Fulfilled in Jesus", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · Isaiah 40:1-11", "s1heading": "Today's Word", "verse": "\"Comfort, comfort my people,<br>says your God.\"", "verseRef": "Isaiah 40:1", "s2heading": "5-Minute Summary", "cards": [{"title": "Background · The First and Second Halves of Isaiah", "paragraphs": ["The book of Isaiah has 66 chapters. It is commonly divided into a first half (chapters 1–39) and a second half (chapters 40–66). This is because of three major shifts. The first is <mark>a shift in historical background</mark>. In the first half, the threat of Assyria features prominently; in the second half, the key background is the Babylonian exile and the restoration that follows.", "The second is <mark>a shift in message</mark>. Where the first half emphasizes God's judgment and warning, from chapter 40 onward God's comfort and promise of salvation are emphasized all the more. The third is <mark>hope becoming concrete</mark>: God shows how He will save His people and what new world He will ultimately bring about.", "Within the second half, chapters 40–48 deal with God's comfort and deliverance for His exiled people. Here is something to remember: chapter 39, just before, ends with <mark>the prediction that the people of Judah will be carried off to Babylon</mark>—a word of judgment that they will lose what they had relied on. Has God, then, abandoned His people? Remarkably, chapter 40 begins with an entirely different word."], "points": ["What does it say about God that words of comfort follow words of judgment?"]}, {"title": "Introduction · Judgment Was Not God's Final Word", "paragraphs": ["In chapter 40, God <mark>commands that His people be comforted</mark>. God had spoken judgment, but judgment was not His final word. When people suffer, what they fear most is not only the suffering itself but not knowing when it will end. Just as those serving in the military endure by telling themselves 'time still passes,' knowing that hardship has an end helps us bear it.", "But what about suffering with no end in sight? It is even harder <mark>when the suffering comes from our own wrongdoing</mark>. 'Will God take me back? Is there a chance to start again? Has God forgotten me?' The people of Judah, facing exile in Babylon, stood before these same questions. They were not simply defeated by a great power; they experienced judgment as the result of rejecting God's word.", "Yet today's passage opens with God speaking to them first. That word was not another rebuke, but one that <mark>still called them His people</mark>. Why can God's people have hope again even in despair? The answer lies not in human ability or change, but in <mark>the grace of God who begins comfort first</mark>."], "points": ["Facing hardship that began with my own wrong, do I think God has forgotten me?"]}, {"title": "Verses 1–2 · The Reason for Comfort: God First Calls Them \"My People\"", "paragraphs": ["<mark>\"Comfort, comfort my people, says your God\"</mark> (v.1). What we should notice first is not so much the content of the words but <mark>who speaks first</mark>. In Judges, the people cry out at first, but as time passes they stop calling on God at all—yet God still promises restoration. Today's passage likewise does not begin with Judah asking for forgiveness, nor with any account of them achieving something to earn restoration. God speaks first, and He repeats 'comfort' twice.", "Comfort here is not merely emotional reassurance that soothes the heart; it is <mark>God's declaration of salvation that He will restore His people</mark>. Even more important are the phrases 'my people' and 'your God,' which express the covenant relationship between God and Israel. Judah rejected His word and would face judgment, but God did not abandon His covenant faithfulness. God's comfort begins not because people qualify first, but because God first shows grace.", "Verse 2 gives three reasons for comfort: <mark>\"her warfare is ended, her iniquity is pardoned, she has received from the LORD's hand double for all her sins.\"</mark> 'Double' does not mean God punished them twice as harshly as their sins deserved; it means the period of punishment has been fully completed, and God now declares forgiveness and restoration. Nor did Israel resolve its sin by suffering enough. The second half of Isaiah emphasizes the grace of salvation given freely, and in chapter 53 shows <mark>the Servant of the LORD bearing the sins of His people</mark>. God's grace does not ignore sin; it deals with sin while refusing to give up on His people."], "points": ["Before circumstances change, do I hold on to the fact that God still calls me \"My people\"?"]}, {"title": "Verses 3–5 · Comfort Realized: The Way for God Himself to Come", "paragraphs": ["Could the people taken captive to Babylon escape by their own strength? They had neither the military might to defeat Babylon nor the political power to change their fate. <mark>\"In the wilderness prepare the way of the LORD; make straight in the desert a highway for our God\"</mark> (v.3). This recalls roads being prepared for a king's procession. But this road is <mark>not for Israel to escape, but for God to come</mark>. As in the exodus, God Himself is coming again to His people.", "<mark>\"Every valley shall be lifted up, and every mountain and hill be made low; the uneven ground shall become level, and the rough places a plain\"</mark> (v.4). This is not merely about a change in terrain. It declares that when God comes to save His people, <mark>no obstacle can block His salvation</mark>. To human eyes, Babylon seemed to hold absolute power, but before God, even that vast empire cannot stand in the way.", "<mark>\"And the glory of the LORD shall be revealed, and all flesh shall see it together\"</mark> (v.5). God's purpose in coming is not only to end the exile but for His glory to be revealed to the whole world. This does not mean everyone is automatically saved; it means that God's saving of His people displays His glory before all the world. In the New Testament this word connects with <mark>the mission of John the Baptist</mark>, who prepared the way for Jesus. The beginning of salvation lies not in our confidence that we can reach God, but in <mark>the fact that God has come to us</mark>."], "points": ["When problems arise, do I look first to the God who comes to me, before looking for what I must do?"]}, {"title": "Verses 6–8 · Comfort Made Certain: The Grass Withers, but the Word Stands Forever", "paragraphs": ["Still, looking at reality, questions arise: can God truly fulfill this promise? <mark>\"All flesh is grass, and all its beauty is like the flower of the field\"</mark> (v.6). Grass and flowers are beautiful but do not last. Not only is human life finite—<mark>even the power and glory humans boast of, and even human faithfulness</mark>, are not eternal. Babylon, which ruled the world then, was like grass before God.", "<mark>\"The grass withers, the flower fades when the breath of the LORD blows on it; surely the people are grass\"</mark> (v.7). Not only Babylon but Israel too is grass. This shows two things at once: <mark>Babylon cannot block God's salvation, and Israel cannot achieve salvation by its own strength.</mark> The certainty of salvation lies not in humans but in God. Also, in verse 5 'all flesh' sees God's glory, while verse 6 says that same 'all flesh' is grass. Those who see His glory are frail and finite, so salvation reveals not human strength but God's faithfulness.", "<mark>\"The grass withers, the flower fades, but the word of our God will stand forever\"</mark> (v.8). Here the word of God is not merely religious instruction; it includes the promise of comfort and restoration declared above. The systems that rule the world will pass away, and human glory will fade. But if God has said He will save His people, that promise will surely come to pass. Faith is not expecting a world that never changes, but <mark>trusting the unchanging word of God in the midst of a changing world</mark>."], "points": ["In shaky circumstances, do I trust above all the word of God that stands forever?"]}, {"title": "Verses 9–11 · Comfort Proclaimed: The King of the Strong Arm Becomes the Shepherd Who Holds Us", "paragraphs": ["<mark>\"Go on up to a high mountain, O Zion, herald of good news… lift it up, fear not; say to the cities of Judah, 'Behold your God!'\"</mark> (v.9). The good news is not simply that they will be freed from Babylon's burden, but that <mark>God is coming to His people</mark>. This is the starting point of the gospel. God's people are not those who stop once they have been comforted, but those who proclaim to the world the God who saved them.", "<mark>\"Behold, the Lord GOD comes with might, and his arm rules for him; behold, his reward is with him, and his recompense before him\"</mark> (v.10). God's strong arm reveals His power to save His people and defeat their enemies. God is not one who merely soothes our feelings; He is <mark>the God of power who overcomes the forces that oppress His people</mark>. Coming with reward and recompense also portrays a victorious King.", "But in verse 11 an amazing scene appears: <mark>\"He will tend his flock like a shepherd; he will gather the lambs in his arms; he will carry them in his bosom, and gently lead those that are with young.\"</mark> The King who rules with a strong arm in verse 10 becomes, in verse 11, <mark>the Shepherd who holds the lambs in that very arm</mark>. God does not drive all the sheep at the same pace; He knows each one's condition and weakness and cares for them tenderly. He is neither a God of love without power, nor a ruler of power without love. The power that governs the world appears as love that embraces His weak people."], "points": ["Am I experiencing the Shepherd's arms that hold me instead of driving me at the same pace as everyone else?"]}, {"title": "Application · The Comfort That Has Reached Us in Jesus", "paragraphs": ["How has this promise of comfort reached us? The answer is in Jesus Christ. Verse 3's call to prepare the way of the LORD in the wilderness is <mark>proclaimed again in the New Testament through John the Baptist</mark> (Matthew 3:3). John called people to repentance and prepared the Lord's way, and on that way Jesus came. John 1 testifies, <mark>\"The Word became flesh and dwelt among us\"</mark> (John 1:14). God's promise to come Himself was fulfilled more deeply and clearly in Jesus.", "When Jesus came, He did not stop at saying He understood our suffering. He bore our sins in our place and died on the cross, and by rising again He overcame the power of sin and death. <mark>We did not make our own way back to God; Jesus brought us to God.</mark> And in John 10, Jesus reveals that He is the Good Shepherd. The Shepherd of verse 11 who carries the lambs is shown concretely in Jesus, who laid down His very life for us.", "Are you feeling far from God right now? Are you afraid to come before Him again because of your own wrong? Facing a problem with no end in sight, do you wonder whether God has forgotten you? This word is not a promise that all your problems will vanish immediately, but it reminds us that <mark>our problems are not greater than God's love</mark>. Of course, we need the decision and obedience of turning back in faith. Ignoring our sin while saying 'God will take care of it' is not faith but license. Yet the reason we can return is not that our will is strong, but that God, who has shown us grace through Jesus, is calling us.", "What we must do today is clear: rather than simply waiting for circumstances to change, <mark>stand again before the word of God</mark>, and share the comfort we have received with our families and neighbors. Our hope is not the certainty that suffering has ended, but the promise that God, who came to us through Jesus Christ, will hold us to the end. May you live today trusting Jesus, the Good Shepherd who comforts, embraces, and leads us."], "points": ["Rather than just waiting for circumstances to change, I will stand again before God's word today and share the comfort I've received with my neighbors."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "Even in hardship that began with my own wrong, I remembered that God calls me \"My people.\""}, {"key": "c2", "text": "Before trying to solve things by my own strength, I looked to the God who comes to me."}, {"key": "c3", "text": "I did not ignore my sin, thinking \"God will take care of it,\" but turned back."}, {"key": "c4", "text": "I shared the comfort I received from God with a family member or neighbor."}], "s4heading": "One-Line Reflection", "memoHint": "Facing a problem with no end in sight, what word of God's comfort will I hold on to today?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Come Back Again", "value": "Honestly confess the heart that drifted because of your wrong, and come before God again"}, {"key": "act2", "label": "Hold the Word", "value": "Before worrying over your circumstances, read Isaiah 40:8 and begin your day"}, {"key": "act3", "label": "Share Comfort", "value": "Tell a weary family member or neighbor, \"God has not forgotten you\""}, {"key": "act4", "label": "Match Their Pace", "value": "Don't drive a struggling person at your pace; wait for them according to their situation"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize Isaiah 40:1, 8 and remember the grace of the God who comforts first"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, God, for calling me \"My people\" even in the place of judgment, for beginning comfort first, and for coming to me Yourself in Jesus."}, {"key": "p2", "tag": "Repent", "text": "I repent of being afraid to come to You because of my wrongs, or, on the other hand, of ignoring my sin while thinking \"You'll take care of it.\""}, {"key": "p3", "tag": "Ask", "text": "Hold me, frail as grass, by Your everlasting word; lead me with Your strong arm and gentle embrace; and let me share the comfort I've received with my neighbors."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Nobyembre 26, Huwebes", "ref": "Isaias 40:1–11", "headline": "Ang Aliw na Sinimulan ng Diyos,<br>Natupad kay Jesus", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Isaias 40:1-11", "s1heading": "Salita Ngayon", "verse": "\"Aliwin, aliwin ninyo ang Aking bayan,<br>sabi ng inyong Diyos.\"", "verseRef": "Isaias 40:1", "s2heading": "5 Minutong Buod", "cards": [{"title": "Konteksto · Ang Unang Kalahati at Ikalawang Kalahati ng Isaias", "paragraphs": ["May 66 na kabanata ang aklat ng Isaias. Karaniwan itong hinahati sa unang kalahati (kabanata 1–39) at ikalawang kalahati (kabanata 40–66). Ito ay dahil sa tatlong malaking pagbabago. Ang una ay <mark>pagbabago ng makasaysayang konteksto</mark>. Sa unang kalahati, kitang-kita ang banta ng Asiria; sa ikalawang kalahati, ang pangunahing konteksto ay ang pagkabihag sa Babilonia at ang panunumbalik na kasunod nito.", "Ang ikalawa ay <mark>pagbabago ng mensahe</mark>. Kung binibigyang-diin ng unang kalahati ang hatol at babala ng Diyos, mula kabanata 40 ay lalong binibigyang-diin ang aliw at pangako ng kaligtasan ng Diyos. Ang ikatlo ay <mark>pagiging kongkreto ng pag-asa</mark>: ipinapakita ng Diyos kung paano Niya ililigtas ang Kanyang bayan at kung anong bagong mundo ang sa huli ay itatatag Niya.", "Sa ikalawang kalahati, ang kabanata 40–48 ay tungkol sa aliw at paglaya ng Diyos para sa Kanyang bihag na bayan. Narito ang dapat tandaan: ang kabanata 39, bago nito, ay nagtatapos sa <mark>hula na dadalhing bihag sa Babilonia ang bayan ng Juda</mark>—isang salita ng hatol na mawawala sa kanila ang kanilang sinandalan. Kung gayon, pinabayaan na ba ng Diyos ang Kanyang bayan? Kahanga-hanga, nagsisimula ang kabanata 40 sa ganap na naiibang salita."], "points": ["Ano ang sinasabi tungkol sa Diyos na ang mga salita ng aliw ay sumusunod sa mga salita ng hatol?"]}, {"title": "Panimula · Hindi Hatol ang Huling Salita ng Diyos", "paragraphs": ["Sa kabanata 40, <mark>iniuutos ng Diyos na aliwin ang Kanyang bayan</mark>. Nagsalita ang Diyos ng hatol, ngunit hindi hatol ang Kanyang huling salita. Kapag nagdurusa ang tao, ang pinakakinatatakutan niya ay hindi lamang ang pagdurusa mismo kundi ang hindi pagkaalam kung kailan ito matatapos. Gaya ng mga nasa serbisyong militar na nagtitiis sa pagsasabing 'lilipas din ang panahon,' ang pagkaalam na may katapusan ang hirap ay tumutulong sa atin na tiisin ito.", "Ngunit paano kung ang pagdurusa ay walang katapusang nakikita? Lalo itong mahirap <mark>kapag ang pagdurusa ay nagmula sa sarili nating pagkakamali</mark>. 'Tatanggapin pa ba ako ng Diyos? May pagkakataon pa bang magsimulang muli? Kinalimutan na ba ako ng Diyos?' Ang bayan ng Juda, na haharap sa pagkabihag sa Babilonia, ay tumayo sa harap ng parehong mga tanong. Hindi lamang sila basta natalo ng isang makapangyarihang bansa; dinanas nila ang hatol bilang bunga ng pagtanggi sa salita ng Diyos.", "Gayunman, nagsisimula ang talata ngayon sa Diyos na unang nagsasalita sa kanila. Ang salitang iyon ay hindi isa pang saway, kundi salitang <mark>tumatawag pa rin sa kanila bilang Kanyang bayan</mark>. Bakit muling makaaasa ang bayan ng Diyos kahit sa gitna ng kawalang-pag-asa? Ang sagot ay hindi sa kakayahan o pagbabago ng tao, kundi sa <mark>biyaya ng Diyos na unang nagsisimula ng aliw</mark>."], "points": ["Sa harap ng hirap na nagsimula sa sarili kong pagkakamali, iniisip ko bang kinalimutan na ako ng Diyos?"]}, {"title": "Talata 1–2 · Ang Dahilan ng Aliw: Unang Tinatawag Sila ng Diyos na \"Aking Bayan\"", "paragraphs": ["<mark>\"Aliwin, aliwin ninyo ang Aking bayan, sabi ng inyong Diyos\"</mark> (t.1). Ang una nating dapat pansinin ay hindi gaanong ang nilalaman ng mga salita kundi <mark>kung sino ang unang nagsasalita</mark>. Sa Mga Hukom, dumaraing ang bayan sa simula, ngunit sa paglipas ng panahon ay tumigil na silang tumawag sa Diyos—gayunman ay nangangako pa rin ang Diyos ng panunumbalik. Gayundin, ang talata ngayon ay hindi nagsisimula sa paghingi ng Juda ng kapatawaran, ni sa anumang salaysay na may nagawa sila upang makamit ang panunumbalik. Ang Diyos ang unang nagsasalita, at dalawang beses Niyang inuulit ang 'aliwin.'", "Ang aliw dito ay hindi lamang emosyonal na pagpapagaan ng loob; ito ay <mark>pahayag ng kaligtasan ng Diyos na ibabalik Niya ang Kanyang bayan</mark>. Lalong mahalaga ang mga pariralang 'Aking bayan' at 'inyong Diyos,' na nagpapahayag ng tipan sa pagitan ng Diyos at ng Israel. Tinanggihan ng Juda ang Kanyang salita at haharap sa hatol, ngunit hindi binitawan ng Diyos ang Kanyang katapatan sa tipan. Nagsisimula ang aliw ng Diyos hindi dahil unang naging karapat-dapat ang tao, kundi dahil unang nagpapakita ng biyaya ang Diyos.", "Nagbibigay ang talata 2 ng tatlong dahilan ng aliw: <mark>\"natapos na ang kanyang paglilingkod, napatawad na ang kanyang kasamaan, tumanggap na siya mula sa kamay ng PANGINOON ng doble para sa lahat ng kanyang kasalanan.\"</mark> Ang 'doble' ay hindi nangangahulugang pinarusahan sila ng Diyos nang dalawang beses na mas mabigat kaysa nararapat sa kanilang kasalanan; nangangahulugan itong ganap nang natapos ang panahon ng parusa, at ipinahahayag na ngayon ng Diyos ang kapatawaran at panunumbalik. Ni hindi rin nalutas ng Israel ang kanyang kasalanan sa sapat na pagdurusa. Binibigyang-diin ng ikalawang kalahati ng Isaias ang biyaya ng kaligtasang ibinibigay nang walang bayad, at sa kabanata 53 ay ipinapakita <mark>ang Lingkod ng PANGINOON na pinapasan ang mga kasalanan ng Kanyang bayan</mark>. Ang biyaya ng Diyos ay hindi nagbabalewala sa kasalanan; hinaharap nito ang kasalanan habang hindi sumusuko sa Kanyang bayan."], "points": ["Bago pa magbago ang kalagayan, pinanghahawakan ko ba na tinatawag pa rin ako ng Diyos na \"Aking bayan\"?"]}, {"title": "Talata 3–5 · Ang Pagkatupad ng Aliw: Ang Daan Para sa Pagdating Mismo ng Diyos", "paragraphs": ["Makatatakas ba sa sarili nilang lakas ang bayang dinalang bihag sa Babilonia? Wala silang lakas-militar upang talunin ang Babilonia ni kapangyarihang pampulitika upang baguhin ang kanilang kapalaran. <mark>\"Sa ilang ay ihanda ninyo ang daan ng PANGINOON; tuwirin ninyo sa disyerto ang lansangan para sa ating Diyos\"</mark> (t.3). Ipinaaalala nito ang paghahanda ng daan para sa prusisyon ng isang hari. Ngunit ang daang ito ay <mark>hindi para tumakas ang Israel, kundi para dumating ang Diyos</mark>. Gaya sa exodo, ang Diyos Mismo ay muling dumarating sa Kanyang bayan.", "<mark>\"Ang bawat lambak ay itataas, at ang bawat bundok at burol ay ibababa; ang baku-bakong lupa ay papantayin, at ang mga magaspang na lugar ay magiging kapatagan\"</mark> (t.4). Hindi lamang ito tungkol sa pagbabago ng lupain. Ipinahahayag nito na kapag dumating ang Diyos upang iligtas ang Kanyang bayan, <mark>walang hadlang na makapipigil sa Kanyang pagliligtas</mark>. Sa paningin ng tao, tila may ganap na kapangyarihan ang Babilonia, ngunit sa harap ng Diyos, kahit ang malawak na imperyong iyon ay hindi makahahadlang.", "<mark>\"At ang kaluwalhatian ng PANGINOON ay mahahayag, at makikita ito ng lahat ng laman nang sama-sama\"</mark> (t.5). Ang layunin ng pagdating ng Diyos ay hindi lamang wakasan ang pagkabihag kundi ihayag ang Kanyang kaluwalhatian sa buong mundo. Hindi ito nangangahulugang awtomatikong maliligtas ang lahat; nangangahulugan itong ang pagliligtas ng Diyos sa Kanyang bayan ay naghahayag ng Kanyang kaluwalhatian sa harap ng buong mundo. Sa Bagong Tipan, nakaugnay ang salitang ito sa <mark>misyon ni Juan Bautista</mark>, na naghanda ng daan para kay Jesus. Ang simula ng kaligtasan ay hindi sa ating kumpiyansa na maaabot natin ang Diyos, kundi sa <mark>katotohanang ang Diyos ang dumating sa atin</mark>."], "points": ["Kapag may problema, una ko bang tinitingnan ang Diyos na dumarating sa akin, bago hanapin ang dapat kong gawin?"]}, {"title": "Talata 6–8 · Ang Katiyakan ng Aliw: Natutuyo ang Damo, Ngunit Mananatili Magpakailanman ang Salita", "paragraphs": ["Gayunman, kapag tiningnan ang realidad, may mga tanong na lumilitaw: kaya ba talagang tuparin ng Diyos ang pangakong ito? <mark>\"Ang lahat ng laman ay damo, at ang lahat ng kagandahan nito ay gaya ng bulaklak sa parang\"</mark> (t.6). Maganda ang damo at bulaklak ngunit hindi nagtatagal. Hindi lamang may hangganan ang buhay ng tao—<mark>kahit ang kapangyarihan at kaluwalhatiang ipinagmamalaki ng tao, at maging ang katapatan ng tao</mark>, ay hindi walang hanggan. Ang Babilonia, na naghahari sa mundo noon, ay gaya ng damo sa harap ng Diyos.", "<mark>\"Natutuyo ang damo, nalalanta ang bulaklak kapag hinipan ito ng hininga ng PANGINOON; tunay na ang bayan ay damo\"</mark> (t.7). Hindi lamang ang Babilonia kundi pati ang Israel ay damo. Sabay itong nagpapakita ng dalawang bagay: <mark>hindi mahahadlangan ng Babilonia ang kaligtasan ng Diyos, at hindi makakamit ng Israel ang kaligtasan sa sarili nitong lakas.</mark> Ang katiyakan ng kaligtasan ay wala sa tao kundi nasa Diyos. Gayundin, sa talata 5 ay nakikita ng 'lahat ng laman' ang kaluwalhatian ng Diyos, samantalang sinasabi ng talata 6 na ang 'lahat ng laman' ding iyon ay damo. Ang mga nakakakita ng Kanyang kaluwalhatian ay mahina at may hangganan, kaya ang kaligtasan ay naghahayag hindi ng lakas ng tao kundi ng katapatan ng Diyos.", "<mark>\"Natutuyo ang damo, nalalanta ang bulaklak, ngunit ang salita ng ating Diyos ay mananatili magpakailanman\"</mark> (t.8). Dito, ang salita ng Diyos ay hindi lamang relihiyosong aral; kasama rito ang pangako ng aliw at panunumbalik na ipinahayag sa itaas. Maglalaho ang mga sistemang naghahari sa mundo, at kukupas ang kaluwalhatian ng tao. Ngunit kung sinabi ng Diyos na ililigtas Niya ang Kanyang bayan, tiyak na matutupad ang pangakong iyon. Ang pananampalataya ay hindi pag-asa sa mundong hindi nagbabago, kundi <mark>pagtitiwala sa di-nagbabagong salita ng Diyos sa gitna ng nagbabagong mundo</mark>."], "points": ["Sa gitna ng umuugang kalagayan, higit sa lahat ba ay nagtitiwala ako sa salita ng Diyos na mananatili magpakailanman?"]}, {"title": "Talata 9–11 · Ang Pagpapahayag ng Aliw: Ang Hari ng Malakas na Bisig ay Naging Pastol na Kumakalong sa Atin", "paragraphs": ["<mark>\"Umakyat ka sa mataas na bundok, O Zion, tagapaghatid ng mabuting balita… itaas mo ito, huwag kang matakot; sabihin mo sa mga lungsod ng Juda, 'Narito ang inyong Diyos!'\"</mark> (t.9). Ang mabuting balita ay hindi lamang na sila'y mapapalaya sa pasanin ng Babilonia, kundi na <mark>ang Diyos ay dumarating sa Kanyang bayan</mark>. Ito ang panimulang punto ng ebanghelyo. Ang bayan ng Diyos ay hindi humihinto kapag naaliw na, kundi nagpapahayag sa mundo ng Diyos na nagligtas sa kanila.", "<mark>\"Narito, ang Panginoong DIYOS ay dumarating na may kapangyarihan, at ang Kanyang bisig ang naghahari para sa Kanya; narito, ang Kanyang gantimpala ay kasama Niya, at ang Kanyang ganti ay nasa Kanyang harapan\"</mark> (t.10). Ipinapakita ng malakas na bisig ng Diyos ang Kanyang kapangyarihang iligtas ang Kanyang bayan at talunin ang kanilang mga kaaway. Ang Diyos ay hindi lamang nagpapagaan ng ating damdamin; Siya ay <mark>ang Diyos ng kapangyarihan na nananaig sa mga puwersang umaapi sa Kanyang bayan</mark>. Ang pagdating na may gantimpala at ganti ay larawan din ng isang matagumpay na Hari.", "Ngunit sa talata 11 ay may kahanga-hangang tagpo: <mark>\"Aalagaan Niya ang Kanyang kawan gaya ng isang pastol; titipunin Niya ang mga kordero sa Kanyang mga bisig; kakalungin Niya sila sa Kanyang dibdib, at marahang aakayin ang mga nagpapasuso.\"</mark> Ang Haring naghahari sa malakas na bisig sa talata 10 ay nagiging, sa talata 11, <mark>ang Pastol na kumakalong sa mga kordero sa mismong bisig na iyon</mark>. Hindi itinataboy ng Diyos ang lahat ng tupa sa iisang bilis; alam Niya ang kalagayan at kahinaan ng bawat isa at magiliw Niya silang inaalagaan. Hindi Siya Diyos ng pag-ibig na walang kapangyarihan, ni pinunong may kapangyarihan na walang pag-ibig. Ang kapangyarihang namamahala sa mundo ay nahahayag bilang pag-ibig na kumakalong sa Kanyang mahinang bayan."], "points": ["Nararanasan ko ba ang mga bisig ng Pastol na kumakalong sa akin sa halip na itaboy ako sa parehong bilis ng iba?"]}, {"title": "Pagsasabuhay · Ang Aliw na Umabot sa Atin kay Jesus", "paragraphs": ["Paano umabot sa atin ang pangakong ito ng aliw? Ang sagot ay kay Jesu-Cristo. Ang panawagan ng talata 3 na ihanda ang daan ng PANGINOON sa ilang ay <mark>muling ipinahayag sa Bagong Tipan sa pamamagitan ni Juan Bautista</mark> (Mateo 3:3). Nanawagan si Juan sa mga tao na magsisi at inihanda ang daan ng Panginoon, at sa daang iyon dumating si Jesus. Nagpapatotoo ang Juan 1, <mark>\"Ang Salita ay naging laman at nanirahan sa gitna natin\"</mark> (Juan 1:14). Ang pangako ng Diyos na Siya Mismo ang darating ay natupad nang mas malalim at malinaw kay Jesus.", "Nang dumating si Jesus, hindi Siya huminto sa pagsasabing nauunawaan Niya ang ating paghihirap. Pinasan Niya ang ating mga kasalanan sa ating lugar at namatay sa krus, at sa muling pagkabuhay ay napagtagumpayan Niya ang kapangyarihan ng kasalanan at kamatayan. <mark>Hindi tayo ang gumawa ng sarili nating daan pabalik sa Diyos; si Jesus ang nagdala sa atin sa Diyos.</mark> At sa Juan 10, ipinahayag ni Jesus na Siya ang Mabuting Pastol. Ang Pastol sa talata 11 na kumakalong sa mga kordero ay kongkretong nahayag kay Jesus, na nag-alay ng Kanyang buhay para sa atin.", "Pakiramdam mo ba ay malayo ka sa Diyos ngayon? Natatakot ka bang muling lumapit sa Kanya dahil sa sarili mong pagkakamali? Sa harap ng problemang walang nakikitang katapusan, iniisip mo bang kinalimutan ka na ng Diyos? Hindi pangako ang salitang ito na agad maglalaho ang lahat ng iyong problema, ngunit ipinaaalala nito na <mark>ang ating mga problema ay hindi mas malaki kaysa sa pag-ibig ng Diyos</mark>. Siyempre, kailangan natin ang pasya at pagsunod ng pagbabalik-loob sa pananampalataya. Ang pagbabalewala sa ating kasalanan habang sinasabing 'Bahala na ang Diyos' ay hindi pananampalataya kundi kalayawan. Gayunman, ang dahilan kung bakit tayo makababalik ay hindi dahil malakas ang ating kalooban, kundi dahil tinatawag tayo ng Diyos na nagpakita ng biyaya sa atin sa pamamagitan ni Jesus.", "Malinaw ang dapat nating gawin ngayon: sa halip na maghintay lamang na magbago ang kalagayan, <mark>muling tumayo sa harap ng salita ng Diyos</mark>, at ibahagi ang aliw na natanggap natin sa ating pamilya at kapwa. Ang ating pag-asa ay hindi ang katiyakang tapos na ang pagdurusa, kundi ang pangakong ang Diyos, na dumating sa atin sa pamamagitan ni Jesu-Cristo, ay hahawak sa atin hanggang sa wakas. Mamuhay nawa kayo ngayon na nagtitiwala kay Jesus, ang Mabuting Pastol na umaaliw, kumakalong, at gumagabay sa atin."], "points": ["Sa halip na maghintay lamang na magbago ang kalagayan, muli akong tatayo sa harap ng salita ng Diyos ngayon at ibabahagi ko sa aking kapwa ang aliw na natanggap ko."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Kahit sa hirap na nagsimula sa sarili kong pagkakamali, naalala kong tinatawag ako ng Diyos na \"Aking bayan.\""}, {"key": "c2", "text": "Bago subukang lutasin ang mga bagay sa sarili kong lakas, tumingin ako sa Diyos na dumarating sa akin."}, {"key": "c3", "text": "Hindi ko binalewala ang aking kasalanan sa pag-iisip na \"Bahala na ang Diyos,\" kundi nagbalik-loob ako."}, {"key": "c4", "text": "Ibinahagi ko ang aliw na natanggap ko mula sa Diyos sa isang kapamilya o kapwa."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Sa harap ng problemang walang nakikitang katapusan, anong salita ng aliw ng Diyos ang panghahawakan ko ngayon?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Lumapit Muli", "value": "Tapat na ipagtapat ang pusong lumayo dahil sa iyong pagkakamali, at muling lumapit sa Diyos"}, {"key": "act2", "label": "Hawakan ang Salita", "value": "Bago mag-alala sa iyong kalagayan, basahin ang Isaias 40:8 at simulan ang iyong araw"}, {"key": "act3", "label": "Ibahagi ang Aliw", "value": "Sabihin sa isang pagod na kapamilya o kapwa, \"Hindi ka kinalimutan ng Diyos\""}, {"key": "act4", "label": "Sabayan ang Kanilang Bilis", "value": "Huwag itaboy sa iyong bilis ang taong nahihirapan; hintayin siya ayon sa kanyang kalagayan"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang Isaias 40:1, 8 at alalahanin ang biyaya ng Diyos na unang umaaliw"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Diyos, sa pagtawag sa akin na \"Aking bayan\" kahit sa lugar ng hatol, sa pagsisimula Mo muna ng aliw, at sa pagdating Mo Mismo sa akin kay Jesus."}, {"key": "p2", "tag": "Pagsisisi", "text": "Pinagsisisihan ko ang pagkatakot na lumapit sa Iyo dahil sa aking mga pagkakamali, o sa kabilang banda, ang pagbabalewala sa aking kasalanan sa pag-iisip na \"Bahala na ang Diyos.\""}, {"key": "p3", "tag": "Kahilingan", "text": "Hawakan Mo ako, na mahina gaya ng damo, sa pamamagitan ng Iyong walang hanggang salita; akayin Mo ako sa Iyong malakas na bisig at magiliw na kalinga; at hayaan Mong ibahagi ko sa aking kapwa ang aliw na natanggap ko."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-11-26';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
