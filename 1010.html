<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f3eee5; --ink0:#1f1a14; --gold:#c9a25a; --ink:#2b241c; --ink2:#6b5f4e; --line:#d9cfbc;
    --sun:#c8772a; --sun2:#f0b26a; --card:#fffaf0; --sky:#3f6d8e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{font-size:clamp(15px,4.1vw,18px)}
  html.f1{font-size:clamp(13.5px,3.6vw,16px)} html.f3{font-size:clamp(17px,4.8vw,21px)}
  body{-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:'Gowun Dodum','Noto Sans KR',sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;
    background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px)}
  .wrap{max-width:560px;margin:0 auto;padding:.8rem 1.1rem 4rem}
  h1,h2,blockquote.key{font-family:'Gowun Batang',serif}

  .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.5rem .6rem;font-size:.8rem;color:var(--ink2);padding:0 .1rem}
  .topRight{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
  .bgm{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
  .bgm.on{background:var(--sky);color:#fff;border-color:var(--sky)}
  .bgm.on .bar{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem}
  .bgm .bar{display:none}
  .bgm .bar i{width:2px;background:#fff;animation:eq .8s ease-in-out infinite}
  .bgm .bar i:nth-child(2){animation-delay:.2s}.bgm .bar i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:3px}50%{height:12px}}
  .langsw{display:inline-flex;gap:.25rem;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.15rem}
  .langsw button{font:inherit;font-size:.8rem;background:transparent;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--ink2);cursor:pointer;line-height:1.3}
  .langsw button.on{background:var(--sun);color:#fff}
  .fs button{font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;margin-left:.25rem;color:var(--ink2);cursor:pointer}
  .fs button.on{background:var(--sun);color:#fff;border-color:var(--sun)}
  .fs b:nth-child(2){font-size:.75rem}.fs b:nth-child(3){font-size:.95rem}.fs b:nth-child(4){font-size:1.15rem}

  header{position:relative;margin:.9rem -1.1rem 0;padding:5.5rem 1.4rem 1.6rem;text-align:left;color:#f5efe3;
    background:#3a2d21 url(header.jpg) center 22%/cover no-repeat;border-radius:0 0 26px 26px;overflow:hidden;min-height:17rem;display:flex;flex-direction:column;justify-content:flex-end}
  header::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,18,12,0) 0%,rgba(25,18,12,.05) 35%,rgba(35,24,14,.55) 70%,rgba(35,24,14,.82) 100%)}
  header>*{position:relative}
  .kicker{font-size:.7rem;letter-spacing:.28em;color:#f3d79a;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6);display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:'';width:1.4rem;height:1px;background:#f3d79a;opacity:.9}
  .date{font-size:.85rem;margin-top:.45rem;color:#efe6d6;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .ref{display:inline-block;margin:.6rem 0 0;padding:.2rem .8rem;border:1px solid rgba(243,215,154,.65);border-radius:999px;font-size:.8rem;color:#f3d79a;background:rgba(25,18,12,.45);backdrop-filter:blur(3px)}
  h1{font-size:1.55rem;line-height:1.4;margin:.8rem 0 0;font-weight:700;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.4)}
  h1::after{display:none}

  .name{display:flex;align-items:center;gap:.6rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;margin-top:1.2rem}
  .name label{font-size:.9rem;color:var(--ink2);white-space:nowrap}
  .name input{flex:1;font:inherit;font-size:1rem;border:0;border-bottom:1px solid var(--line);background:transparent;padding:.2rem;color:var(--ink)}
  .name input:focus{outline:0;border-color:var(--sun)}

  .video{display:flex;align-items:center;gap:.8rem;background:#2b241c;color:#fff;border-radius:14px;padding:.8rem 1rem;margin-top:1.2rem;text-decoration:none}
  .video .play{width:2.4rem;height:2.4rem;border-radius:50%;background:#e33;display:flex;align-items:center;justify-content:center;flex:none}
  .video .play::after{content:'';border-left:.8rem solid #fff;border-top:.5rem solid transparent;border-bottom:.5rem solid transparent;margin-left:.2rem}
  .video small{display:block;opacity:.7;font-size:.8rem}

  section{margin-top:2rem}
  h2{font-size:1.15rem;color:var(--sun);margin-bottom:.7rem;display:flex;align-items:center;gap:.5rem}
  h2 .n{font-size:.75rem;background:var(--sun);color:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center;font-family:sans-serif;flex:none}

  blockquote.key{background:var(--card);border-left:5px solid var(--sun);padding:1rem 1.1rem;border-radius:0 12px 12px 0;font-size:1.05rem;line-height:1.8}
  blockquote.key small{display:block;margin-top:.5rem;color:var(--ink2);font-family:'Gowun Dodum';font-size:.85rem}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.7rem;overflow:hidden}
  .card b.t{color:var(--sun);display:block;margin-bottom:.25rem}
  mark{background:linear-gradient(transparent 45%,#ffd88f 45%);color:inherit;font-weight:700;padding:0 .1em}
  .point{margin-top:.7rem;background:#fff3df;border:1px dashed var(--sun);border-radius:10px;padding:.6rem .8rem;font-size:.95rem;font-weight:700;color:#7a4a14;display:flex;gap:.5rem;align-items:flex-start}
  .point::before{content:'★';color:var(--sun);flex:none}
  .card p{font-size:.95rem;margin-bottom:.6rem}.card p:last-child{margin-bottom:0}

  label.chk{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.6rem;cursor:pointer;transition:.2s}
  label.chk:has(input:checked){background:#fff3df;border-color:var(--sun)}
  label.chk input{width:1.4rem;height:1.4rem;margin-top:.2rem;accent-color:var(--sun);flex:none}
  label.chk span{font-size:.98rem}
  label.chk .tag{display:inline-block;font-size:.75rem;background:var(--sun2);color:#5a3a12;border-radius:6px;padding:0 .4rem;margin-right:.3rem;vertical-align:middle}

  textarea,input.line{width:100%;font:inherit;font-size:1rem;padding:.9rem;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
  textarea{min-height:100px;resize:vertical}
  textarea:focus,input.line:focus{outline:2px solid var(--sun2)}
  .hint{font-size:.85rem;color:var(--ink2);margin:0 0 .5rem}
  .field{margin-bottom:.8rem}
  .field label{display:block;font-size:.9rem;color:var(--ink2);margin-bottom:.3rem}

  .pill{display:flex;flex-wrap:wrap;gap:.5rem}
  .pill label{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.5rem .9rem;font-size:.9rem;cursor:pointer}
  .pill label:has(input:checked){background:var(--sun);color:#fff;border-color:var(--sun)}
  .pill input{display:none}
  #actDetail{display:none;margin-top:.7rem}
  #actDetail.on{display:block}

  .actions{position:fixed;bottom:0;left:0;right:0;background:rgba(246,241,231,.92);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:.45rem .8rem calc(.45rem + env(safe-area-inset-bottom));display:flex;gap:.5rem;justify-content:center}
  button.b{font:inherit;font-size:.9rem;font-weight:700;border:0;border-radius:999px;padding:.55rem 1rem;cursor:pointer;white-space:nowrap;line-height:1.3}
  .b1{background:var(--sun);color:#fff;flex:1;max-width:240px}
  .b2{background:#fff;border:1px solid var(--line)!important;color:var(--ink2)}
  .toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  .toast.on{opacity:1}
  .done{font-size:.85rem;color:var(--ink2);text-align:center;margin-top:1.5rem}
  footer{text-align:center;font-size:.8rem;color:var(--ink2);margin-top:2.5rem;font-family:'Gowun Batang',serif}
</style>

<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "10월 10일 토요일", "ref": "사사기 20장 1–7절", "headline": "하나가 되었다고<br>모두 옳은 것은 아닙니다", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 사사기 20:1-7", "s1heading": "오늘의 말씀", "verse": "\"그들을 진리로 거룩하게 하옵소서<br>아버지의 말씀은 진리니이다\"", "verseRef": "요한복음 17:17", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 하나님 앞에 모였지만, 하나님께 묻지는 않았습니다", "paragraphs": ["19장의 비극은 한 가정에서 시작되었습니다. 레위인은 자기 생명을 지키려고 첩을 내어 주었고, 그녀는 밤새 폭력을 당한 뒤 자신을 보호했어야 할 사람들이 머물던 집 문 밖에 쓰러졌습니다. 레위인은 그녀의 몸을 나누어 이스라엘 전역에 보냈습니다. 20장에서 이 사건은 더 이상 한 개인의 비극이 아니라 <mark>이스라엘 전체의 문제</mark>로 확대됩니다.", "놀랍게도 온 이스라엘이 미스바에 모입니다. 사사기에서 이렇게까지 하나로 모인 장면은 드뭅니다. 드보라와 바락 때에도 참여하지 않은 지파가 있었고, 기드온 때에도 이렇게 결집하지 않았습니다. 그런데 이름도 없는 한 레위인의 행동 때문에 이스라엘이 하나가 됩니다. 성경은 그들이 <mark>\"여호와 앞에 모였다\"</mark>고 말합니다. 그런데 이상합니다. <mark>하나님 앞에는 모였는데, 하나님께 묻지는 않습니다</mark>.", "더 큰 문제는 레위인의 증언입니다. 그는 기브아 사람들의 악을 말합니다. 실제로 악했습니다. 그러나 자신이 첩을 붙잡아 밖으로 내보냈다는 사실은 말하지 않습니다. 다른 사람의 죄는 말하면서 자기 책임은 이야기에서 지워 버립니다."], "points": ["우리의 하나됨은 하나님의 뜻을 이루기 위한 하나입니까, 우리의 뜻을 이루기 위한 하나입니까? 나는 다른 사람의 죄를 보기 전에 말씀 앞에서 내 죄와 책임을 정직하게 보고 있습니까?"]}, {"title": "1–2절 · \"한 사람같이\" — 무엇을 중심으로 하나가 되었습니까?", "paragraphs": ["<mark>\"이에 모든 이스라엘 자손이 단에서부터 브엘세바까지와 길르앗 땅에서 나와서 그 회중이 일제히 미스바에서 여호와 앞에 모였으니\"</mark>. 단에서 브엘세바까지는 북쪽 끝에서 남쪽 끝까지, 여기에 요단 동쪽 길르앗까지 더해져 거의 온 이스라엘을 뜻합니다. '일제히'로 번역된 히브리어는 <mark>'한 사람같이(케이쉬 에하드)'</mark>이며, 20장에서 반복됩니다. 흩어져 있던 이스라엘이 드디어 한 사람같이 움직입니다.", "겉으로는 아주 좋은 일입니다. 그러나 중요한 질문이 있습니다. <mark>무엇을 중심으로 하나가 되었습니까?</mark> 사람들이 같은 생각을 한다고 그것이 반드시 하나님의 뜻은 아닙니다. 분노도, 편향된 정보도, 공동의 적도 사람을 하나로 만들 수 있습니다. 하나됨 자체가 옳음을 보장하지는 않습니다.", "2절은 이 모임을 <mark>'하나님 백성의 총회'</mark>라고 부르지만, 동시에 칼을 빼는 보병이 사십만 명이었다고 기록합니다. 종교적인 언어와 군사적인 분위기가 함께 있습니다. 그런데 1–7절 어디에도 그들이 여호와께 물었다는 말은 없습니다. 17–18장의 단 지파도 하나님께 묻는 것처럼 보였지만, 먼저 자기 길을 정해 놓고 그 길이 성공할지만 물었습니다."], "points": ["하나님 앞에 모이는 것과 하나님의 뜻을 묻는 것은 같은 일이 아닙니다. 하나님의 이름으로 모였을수록 '우리가 원하는 것'이 아니라 '주님이 원하시는 것'을 더 물어야 합니다."]}, {"title": "3절 · 하나됨 밖에 있는 한 지파, 그리고 \"말하라\"", "paragraphs": ["1–3절은 계속 '모든 이스라엘', '온 백성', '모든 지파'를 말합니다. 그런데 3절이 이상합니다. <mark>\"이스라엘 자손이 미스바에 올라간 것을 베냐민 자손이 들었더라\"</mark>. 베냐민은 그 자리에 없습니다. 왜 참석하지 않았는지는 본문이 설명하지 않습니다. 그러나 분명한 것은, <mark>'한 사람같이 하나가 되었다'고 말하는 순간 이미 한 지파는 그 하나됨 밖에 있었다</mark>는 사실입니다. 이것이 앞으로 벌어질 내전을 준비합니다. 진리 없는 하나됨은 쉽게 '우리'와 '그들'을 만들어 냅니다.", "이스라엘이 묻습니다. <mark>\"이 악한 일이 어떻게 일어났는지 우리에게 말하라\"</mark>. 진상을 확인하려는 좋은 질문처럼 보입니다. 그러나 이제부터 중요한 것은 <mark>누구의 이야기를 듣느냐</mark>입니다. 그들이 듣는 것은 레위인의 이야기입니다. 우리는 19장을 읽었기에 실제 사건을 압니다. 그래서 레위인이 무엇을 말하는가뿐 아니라 무엇을 말하지 않는가도 들어야 합니다."], "points": ["공동체의 하나됨은 중요하지만, 진리 없는 일치는 위험합니다. 많은 사람이 동의한다고 반드시 옳은 것은 아닙니다. 필요한 것은 우리의 뜻을 이루기 위한 하나됨이 아니라 하나님의 뜻 아래 서는 하나됨입니다."]}, {"title": "4–7절 · 말하지 않은 한 문장 — 레위인의 왜곡된 증언", "paragraphs": ["4절은 그를 이렇게 소개합니다. <mark>\"레위 사람 곧 죽임을 당한 여인의 남편\"</mark>. 참 아이러니합니다. 그는 레위인, 곧 하나님의 말씀과 예배를 섬겨야 할 사람이고, 그 여인의 남편, 곧 그녀를 사랑하고 보호했어야 할 사람입니다. 그러나 19장에서 그는 두 역할 모두 감당하지 못했습니다. 그런데 이제 그가 사건의 공식 설명자가 됩니다. <mark>가장 큰 피해를 입은 여인은 말할 수 없고, 그 사건에 책임이 있는 사람이 이야기를 대신 전합니다</mark>.", "5절에서 그는 말합니다. <mark>\"기브아 사람들이 나를 치려고 일어나서 밤에 내가 묵고 있던 집을 에워싸고 나를 죽이려 하고 내 첩을 욕보여 그를 죽게 한지라\"</mark>. 19장과 비교하면 차이가 보입니다. 19장에서는 성읍의 불량배들이 등장하지만, 그의 설명에서는 기브아 사람 전체의 문제처럼 들립니다. 그리고 결정적인 한 문장이 없습니다. <mark>\"내가 내 첩을 붙잡아 그들에게 밖으로 내보냈습니다.\"</mark> 아침에 \"일어나라 우리가 떠나가자\"고만 했던 사실, 그녀가 정확히 언제 숨졌는지 확정되지 않았던 사실도 말하지 않습니다.", "그의 말이 전부 거짓은 아닙니다. 기브아에서는 실제로 끔찍한 범죄가 일어났습니다. 그러나 그는 자신에게 불리한 사실을 빼고 이야기를 자기 중심으로 재구성합니다. <mark>진실을 왜곡하는 방법은 거짓말만이 아닙니다. 원하는 결론을 위해 중요한 사실을 빼는 것도 진실을 왜곡하는 것입니다</mark>.", "6절에서 그는 강한 종교적 언어를 씁니다. \"이스라엘 기업의 온 땅\", \"음행과 망령된 일\". 기브아의 행동은 분명 악했습니다. 그러나 공동체의 죄를 고발하면서 자기 죄는 제외합니다. 그의 말에는 종교적 단어가 많지만 정작 <mark>여호와께서 어떻게 보시는가는 없습니다</mark>. 그리고 7절에서 \"여호와께 묻자\"가 아니라 <mark>\"너희의 의견과 방책을 낼지니라\"</mark>고 말합니다. 이제 한 개인이 아니라 공동체 전체가 자기 소견대로 움직이기 시작합니다."], "points": ["회개하지 않은 사람도 정의를 요구할 수 있습니다. 그러므로 정의를 말하기 전에 먼저 물어야 합니다. \"주님, 이 문제 속에서 내가 회개해야 할 것은 무엇입니까?\""]}, {"title": "적용 · 말씀 아래의 하나됨, 내 눈의 들보부터", "paragraphs": ["오늘 본문에는 두 가지 위험이 있습니다. 첫째는 <mark>잘못된 하나됨</mark>입니다. 이스라엘은 한 사람같이 여호와 앞에 모였지만 여호와께 묻지 않았고, 자기들의 분노와 판단을 중심으로 하나가 되었습니다. 교회도, 가정도 모두 같은 결정을 할 수 있습니다. 중요한 것은 단순히 우리가 하나인가가 아니라 <mark>무엇을 중심으로 하나인가</mark>입니다.", "예수님은 제자들의 하나됨을 위해 기도하시면서 먼저 이렇게 기도하셨습니다. <mark>\"그들을 진리로 거룩하게 하옵소서 아버지의 말씀은 진리니이다\"</mark>. 예수님이 원하시는 하나됨은 진리를 버린 하나됨이 아니라 하나님의 말씀 안에서, 하나님의 뜻 아래에서 이루어지는 하나됨입니다. 교회가 정말 하나 되기를 원한다면 '우리 모두 동의합시다'보다 먼저 <mark>'우리 모두 말씀 아래 섭시다'</mark>라고 말해야 합니다.", "둘째는 <mark>왜곡된 시선</mark>입니다. 레위인은 다른 사람의 죄는 정확하게 말하면서 자기 책임은 뺐습니다. 우리도 내 말에는 이유가 있었고, 남의 말은 잘못이었고, 내 행동은 상황 때문에 어쩔 수 없었고, 남의 행동은 죄라고 말할 수 있습니다. 예수님은 말씀하셨습니다. <mark>\"어찌하여 형제의 눈 속에 있는 티는 보고 네 눈 속에 있는 들보는 깨닫지 못하느냐\"</mark>. 다른 사람의 죄를 무시하라는 것이 아니라, 먼저 자신을 진실하게 보라는 말씀입니다. 말씀은 다른 사람을 판단하기 전에 나를 먼저 비추는 거울이어야 합니다.", "사사기의 사람들은 하나님 앞에 모였지만 자기 소견을 따라갔습니다. 예수님의 제자는 다릅니다. 함께 말씀 아래 서고, 먼저 자기 눈의 들보를 보고, 자기 뜻보다 아버지의 뜻을 묻습니다. <mark>진정한 하나됨은 모두가 같은 말을 하는 데서가 아니라, 모두가 함께 하나님의 말씀 아래 서는 데서 시작됩니다</mark>."], "points": ["정의는 다른 사람을 정죄하는 데서가 아니라, 하나님의 말씀 앞에서 나 자신도 같은 기준 아래 세우는 데서 시작됩니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "내가 속한 공동체의 하나됨이 말씀 중심인지, 아니면 같은 분노나 같은 편 의식 중심인지 돌아봤다"}, {"key": "c2", "text": "하나님 앞에 모여 기도하면서도 이미 내 계획을 정해 놓고 하나님의 뜻은 묻지 않은 일이 없는지 점검했다"}, {"key": "c3", "text": "어떤 일을 설명할 때 나에게 불리한 사실을 빼고 내 중심으로 이야기를 재구성하지 않았는지 돌아봤다"}, {"key": "c4", "text": "다른 사람의 티보다 내 눈의 들보를 먼저 보고, 이 문제 속에서 내가 회개할 것이 무엇인지 물었다"}], "s4heading": "묵상 한 줄", "memoHint": "요즘 내가 다른 사람의 잘못을 이야기하면서 정작 빼놓고 있는 '나의 한 문장'은 무엇입니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "먼저 묻기", "value": "공동체나 가정의 결정을 앞두고, 결론을 내기 전에 함께 '주님의 뜻이 무엇입니까?' 하고 기도하기"}, {"key": "act2", "label": "빠진 한 문장 찾기", "value": "최근 갈등을 떠올리고, 내가 말하지 않았던 내 책임 한 가지를 정직하게 적어 보기"}, {"key": "act3", "label": "들보 먼저", "value": "누군가를 비판하고 싶을 때, 먼저 '이 일에서 내가 회개할 것은?'을 하나님께 묻기"}, {"key": "act4", "label": "밖에 있는 사람", "value": "'우리'의 하나됨 밖에 놓인 한 사람이나 그룹을 떠올리고 그들의 이야기도 들어 보기"}, {"key": "act5", "label": "말씀 아래 서기", "value": "요한복음 17:17을 외우며, 오늘 내 판단을 말씀에 비추어 다시 점검하기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "진리로 우리를 거룩하게 하시고, 아버지의 말씀 안에서 하나 되기를 기도하신 예수님의 사랑에 감사합니다"}, {"key": "p2", "tag": "회개", "text": "하나님 앞에 모이면서도 하나님께 묻지 않고, 다른 사람의 티는 크게 보며 내 눈의 들보와 내 책임은 이야기에서 지워 왔던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "우리의 하나됨이 분노나 같은 편 의식이 아니라 말씀과 진리 위에 서게 하시고, 정의를 말하기 전에 먼저 제 자신을 말씀 앞에 정직하게 세우게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "October 10, Saturday", "ref": "Judges 20:1–7", "headline": "Being United<br>Doesn't Make Us Right", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · Judges 20:1-7", "s1heading": "Today's Word", "verse": "\"Sanctify them in the truth;<br>Your word is truth.\"", "verseRef": "John 17:17", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · They Gathered Before God, but Did Not Ask God", "paragraphs": ["The tragedy of chapter 19 began in one household. The Levite gave up his concubine to save his own life, and after a night of violence she collapsed outside the door of the house where those who should have protected her were staying. The Levite divided her body and sent it throughout Israel. In chapter 20, this event is no longer one individual's tragedy; it becomes <mark>a problem for all Israel</mark>.", "Remarkably, all Israel gathers at Mizpah. Such a united gathering is rare in Judges. Some tribes didn't take part even in the days of Deborah and Barak, and Israel didn't rally like this under Gideon. Yet because of the actions of one nameless Levite, Israel becomes one. Scripture says they <mark>\"assembled before the LORD.\"</mark> But something is strange: <mark>they gathered before God, yet they did not ask God</mark>.", "A bigger problem is the Levite's testimony. He describes the evil of the men of Gibeah — and it truly was evil. But he doesn't mention that he seized his concubine and sent her outside. He speaks of others' sin while erasing his own responsibility from the story."], "points": ["Is our unity for accomplishing God's will, or our own? Before looking at others' sins, do I honestly face my own sin and responsibility before the Word?"]}, {"title": "Verses 1–2 · \"As One Man\" — United Around What?", "paragraphs": ["<mark>\"Then all the people of Israel came out, from Dan to Beersheba, including the land of Gilead, and the congregation assembled as one man to the LORD at Mizpah.\"</mark> 'From Dan to Beersheba' means from the northern edge to the southern edge; adding Gilead east of the Jordan, it means virtually all Israel. The Hebrew phrase is <mark>'as one man' (ke'ish echad)</mark>, and it repeats throughout chapter 20. At last, scattered Israel moves as one man.", "Outwardly, this is very good. But there's an important question: <mark>united around what?</mark> People thinking alike doesn't necessarily mean it's God's will. Anger can unite people; biased information can unite people; a common enemy can unite people. Unity itself does not guarantee rightness.", "Verse 2 calls this gathering <mark>'the assembly of the people of God,'</mark> yet also records 400,000 foot soldiers who drew the sword. Religious language and a military atmosphere stand side by side. And nowhere in verses 1–7 does it say they inquired of the LORD. The tribe of Dan in chapters 17–18 also seemed to ask God, but they had already chosen their path and only asked whether it would succeed."], "points": ["Gathering before God and asking God's will are not the same. The more we gather in God's name, the more we must ask not 'what we want,' but 'what the Lord wants.'"]}, {"title": "Verse 3 · One Tribe Outside the Unity — and \"Tell Us\"", "paragraphs": ["Verses 1–3 keep saying 'all Israel,' 'all the people,' 'all the tribes.' But verse 3 is odd: <mark>\"Now the people of Benjamin heard that the people of Israel had gone up to Mizpah.\"</mark> Benjamin isn't there. The text doesn't explain why. But one thing is clear: <mark>the very moment they declared themselves united 'as one man,' one tribe was already outside that unity</mark>. This sets the stage for the civil war to come. Unity without truth easily creates 'us' and 'them.'", "Israel asks, <mark>\"Tell us, how did this evil happen?\"</mark> It looks like a good question aimed at finding the facts. But from here on, what matters is <mark>whose story they listen to</mark>. They hear the Levite's account. Since we've read chapter 19, we know what actually happened. So we must listen not only to what the Levite says, but also to what he leaves out."], "points": ["A community's unity matters, but agreement without truth is dangerous. Many people agreeing doesn't make it right. What we need isn't unity to achieve our will, but unity that stands under God's will."]}, {"title": "Verses 4–7 · The One Sentence He Left Out — The Levite's Distorted Testimony", "paragraphs": ["Verse 4 introduces him this way: <mark>\"The Levite, the husband of the woman who was murdered.\"</mark> How ironic. He is a Levite — one meant to serve God's Word and worship — and he is her husband — one who should have loved and protected her. Yet in chapter 19 he failed in both roles. Now he becomes the official narrator of the event. <mark>The woman who suffered most cannot speak, and the one who bears responsibility tells the story in her place.</mark>", "In verse 5 he says, <mark>\"The leaders of Gibeah rose against me and surrounded the house against me by night. They meant to kill me, and they violated my concubine, and she is dead.\"</mark> Compared with chapter 19, the differences show. There, it was the city's worthless men; in his telling, it sounds like the whole of Gibeah. And one decisive sentence is missing: <mark>\"I seized my concubine and sent her out to them.\"</mark> He also omits that in the morning he only said, \"Get up, let us be going,\" and that it was never clear exactly when she died.", "Not everything he says is a lie. A horrific crime really did happen in Gibeah. But he leaves out the facts unfavorable to him and reconstructs the story around himself. <mark>Lying isn't the only way to distort the truth. Leaving out key facts to reach the conclusion we want also distorts the truth.</mark>", "In verse 6 he uses strong religious language: \"the whole country of the inheritance of Israel,\" \"abomination and outrage.\" Gibeah's actions were clearly evil. But while accusing the community's sin, he exempts his own. His words are full of religious terms, yet <mark>how the LORD sees it is missing</mark>. And in verse 7 he says not \"Let us ask the LORD,\" but <mark>\"Give your advice and counsel here.\"</mark> Now not just one individual, but the whole community begins to move by its own opinion."], "points": ["Even someone who hasn't repented can demand justice. So before speaking of justice, we must first ask: \"Lord, what do I need to repent of in this situation?\""]}, {"title": "Application · Unity Under the Word — Starting with the Log in My Own Eye", "paragraphs": ["Today's passage holds two dangers. The first is <mark>false unity</mark>. Israel gathered as one man before the LORD, yet did not inquire of the LORD; they united around their own anger and judgment. A church or a family can all reach the same decision. What matters isn't simply whether we are one, but <mark>what we are united around</mark>.", "When Jesus prayed for His disciples' unity, He first prayed, <mark>\"Sanctify them in the truth; Your word is truth.\"</mark> The unity Jesus desires isn't unity that abandons truth, but unity formed within God's Word and under God's will. If the church truly wants to be one, before saying 'Let's all agree,' we must say, <mark>'Let's all stand under the Word.'</mark>", "The second danger is <mark>a distorted view</mark>. The Levite described others' sin precisely while leaving out his own responsibility. We too can say: my words had good reason, theirs were wrong; my actions were unavoidable given the circumstances, theirs were sin. Jesus said, <mark>\"Why do you see the speck that is in your brother's eye, but do not notice the log that is in your own eye?\"</mark> He wasn't telling us to ignore others' sin, but to look honestly at ourselves first. God's Word must be a mirror that shows me myself before I judge anyone else.", "The people in Judges gathered before God but followed their own opinions. Jesus' disciples are different: they stand together under the Word, see the log in their own eye first, and ask the Father's will above their own. <mark>True unity doesn't begin when everyone says the same thing, but when everyone stands together under God's Word.</mark>"], "points": ["Justice doesn't begin by condemning others; it begins by placing myself under the same standard before God's Word."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether the unity of my community is centered on the Word, or on shared anger and a sense of 'our side.'"}, {"key": "c2", "text": "I checked whether I've gathered and prayed before God while my plans were already set, never really asking His will."}, {"key": "c3", "text": "I reflected on whether, when explaining something, I've left out facts unfavorable to me and reshaped the story around myself."}, {"key": "c4", "text": "I looked at the log in my own eye before the speck in others', and asked what I need to repent of in this situation."}], "s4heading": "One-Line Reflection", "memoHint": "When I talk about others' wrongs these days, what is the 'one sentence about me' I keep leaving out?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Ask First", "value": "Before a decision in your community or family, pray together 'Lord, what is Your will?' before reaching a conclusion"}, {"key": "act2", "label": "Find the Missing Sentence", "value": "Recall a recent conflict and honestly write down one part of your own responsibility that you didn't mention"}, {"key": "act3", "label": "The Log First", "value": "When you feel like criticizing someone, first ask God, 'What do I need to repent of in this?'"}, {"key": "act4", "label": "Those Outside", "value": "Think of a person or group left outside 'our' unity, and listen to their side of the story too"}, {"key": "act5", "label": "Stand Under the Word", "value": "Memorize John 17:17 and recheck today's judgments in the light of the Word"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, Jesus, for sanctifying us in the truth and praying that we would be one within the Father's Word."}, {"key": "p2", "tag": "Repent", "text": "I repent that I've gathered before You without asking You, magnified the speck in others' eyes, and erased the log in my own eye and my own responsibility from the story."}, {"key": "p3", "tag": "Ask", "text": "Let our unity stand not on anger or a sense of 'our side,' but on Your Word and truth. Before I speak of justice, help me first stand honestly before Your Word myself."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Oktubre 10, Sabado", "ref": "Mga Hukom 20:1–7", "headline": "Ang Pagkakaisa ay Hindi<br>Nangangahulugang Tama ang Lahat", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · Mga Hukom 20:1-7", "s1heading": "Salita Ngayon", "verse": "\"Pakabanalin Mo sila sa katotohanan;<br>ang Iyong salita ay katotohanan.\"", "verseRef": "Juan 17:17", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Nagtipon Sila sa Harap ng Diyos, Ngunit Hindi Nagtanong sa Diyos", "paragraphs": ["Nagsimula sa isang sambahayan ang trahedya ng kabanata 19. Isinuko ng Levita ang kanyang babae upang iligtas ang sariling buhay, at pagkatapos ng isang gabi ng karahasan, bumagsak siya sa labas ng pinto ng bahay kung saan nananatili ang mga dapat sanang nagprotekta sa kanya. Hinati ng Levita ang kanyang katawan at ipinadala sa buong Israel. Sa kabanata 20, hindi na ito trahedya ng isang tao lamang; naging <mark>problema ito ng buong Israel</mark>.", "Kahanga-hanga, nagtipon ang buong Israel sa Mizpa. Bihira sa Mga Hukom ang ganitong pagkakaisang pagtitipon. May mga liping hindi sumama kahit noong panahon nina Debora at Barak, at hindi ganito nagkaisa ang Israel sa ilalim ni Gideon. Ngunit dahil sa ginawa ng isang Levitang walang pangalan, nagkaisa ang Israel. Sinasabi ng Kasulatan na sila ay <mark>\"nagtipon sa harap ni Yahweh.\"</mark> Ngunit may kakaiba: <mark>nagtipon sila sa harap ng Diyos, ngunit hindi sila nagtanong sa Diyos</mark>.", "Mas malaking problema ang patotoo ng Levita. Inilarawan niya ang kasamaan ng mga taga-Gibea — at tunay ngang masama iyon. Ngunit hindi niya binanggit na hinawakan niya ang kanyang babae at inilabas ito. Binanggit niya ang kasalanan ng iba habang binubura sa kwento ang sarili niyang pananagutan."], "points": ["Ang ating pagkakaisa ba ay para tuparin ang kalooban ng Diyos, o ang sarili nating kalooban? Bago tingnan ang kasalanan ng iba, tapat ko bang hinaharap ang sarili kong kasalanan at pananagutan sa harap ng Salita?"]}, {"title": "Talata 1–2 · \"Gaya ng Iisang Tao\" — Nagkaisa sa Paligid ng Ano?", "paragraphs": ["<mark>\"Pagkatapos, lumabas ang lahat ng Israelita, mula Dan hanggang Beer-seba, kasama ang lupain ng Gilead, at nagtipon ang kapulungan gaya ng iisang tao sa harap ni Yahweh sa Mizpa.\"</mark> Ang 'mula Dan hanggang Beer-seba' ay mula sa hilagang dulo hanggang sa timog na dulo; kasama ang Gilead sa silangan ng Jordan, nangangahulugan ito ng halos buong Israel. Ang pariralang Hebreo ay <mark>'gaya ng iisang tao' (ke'ish echad)</mark>, at paulit-ulit ito sa kabanata 20. Sa wakas, kumikilos ang watak-watak na Israel gaya ng iisang tao.", "Sa panlabas, napakabuti nito. Ngunit may mahalagang tanong: <mark>nagkaisa sa paligid ng ano?</mark> Ang pagkakapareho ng iniisip ng mga tao ay hindi nangangahulugang kalooban na ito ng Diyos. Kayang pag-isahin ng galit ang mga tao; kayang pag-isahin ng may-kinikilingang impormasyon; kayang pag-isahin ng iisang kaaway. Hindi ginagarantiya ng pagkakaisa mismo ang katuwiran.", "Tinawag ng talata 2 ang pagtitipong ito na <mark>'kapulungan ng bayan ng Diyos,'</mark> ngunit itinala rin ang 400,000 kawal na humahawak ng tabak. Magkatabi ang wikang panrelihiyon at ang kapaligirang militar. At wala saanman sa talata 1–7 na nagtanong sila kay Yahweh. Ang lipi ni Dan sa kabanata 17–18 ay mukha ring nagtatanong sa Diyos, ngunit napili na nila ang kanilang landas at itinanong lamang kung magtatagumpay ito."], "points": ["Ang pagtitipon sa harap ng Diyos at ang pagtatanong sa kalooban ng Diyos ay hindi magkapareho. Habang mas nagtitipon tayo sa pangalan ng Diyos, lalo nating dapat itanong hindi 'ano ang gusto natin,' kundi 'ano ang gusto ng Panginoon.'"]}, {"title": "Talata 3 · Isang Liping Nasa Labas ng Pagkakaisa — at \"Sabihin Ninyo\"", "paragraphs": ["Paulit-ulit na sinasabi ng talata 1–3 ang 'buong Israel,' 'buong bayan,' 'lahat ng lipi.' Ngunit kakaiba ang talata 3: <mark>\"Nabalitaan ng mga Benjamita na umahon ang mga Israelita sa Mizpa.\"</mark> Wala roon ang Benjamin. Hindi ipinaliwanag ng teksto kung bakit. Ngunit isang bagay ang malinaw: <mark>sa mismong sandaling ipinahayag nilang nagkaisa sila 'gaya ng iisang tao,' may isang lipi nang nasa labas ng pagkakaisang iyon</mark>. Inihahanda nito ang digmaang sibil na darating. Madaling lumilikha ng 'tayo' at 'sila' ang pagkakaisang walang katotohanan.", "Nagtanong ang Israel, <mark>\"Sabihin ninyo sa amin, paano nangyari ang kasamaang ito?\"</mark> Mukha itong mabuting tanong upang alamin ang katotohanan. Ngunit mula rito, ang mahalaga ay <mark>kaninong kwento ang pinakikinggan nila</mark>. Ang naririnig nila ay ang salaysay ng Levita. Dahil nabasa na natin ang kabanata 19, alam natin ang tunay na nangyari. Kaya dapat nating pakinggan hindi lamang ang sinasabi ng Levita, kundi pati ang hindi niya sinasabi."], "points": ["Mahalaga ang pagkakaisa ng komunidad, ngunit mapanganib ang pagsang-ayong walang katotohanan. Ang pagsang-ayon ng marami ay hindi nangangahulugang tama. Ang kailangan natin ay hindi pagkakaisang tumutupad sa ating kalooban, kundi pagkakaisang nakatayo sa ilalim ng kalooban ng Diyos."]}, {"title": "Talata 4–7 · Ang Isang Pangungusap na Hindi Niya Sinabi — Ang Baluktot na Patotoo ng Levita", "paragraphs": ["Ipinakilala siya ng talata 4 nang ganito: <mark>\"Ang Levita, ang asawa ng babaeng pinatay.\"</mark> Napakabalintuna. Siya ay Levita — dapat naglilingkod sa Salita at pagsamba ng Diyos — at asawa niya ang babae — dapat sana'y umiibig at nagpoprotekta sa kanya. Ngunit sa kabanata 19, nabigo siya sa parehong tungkulin. Ngayon, siya ang naging opisyal na tagapagsalaysay ng pangyayari. <mark>Hindi makapagsalita ang babaeng pinakanagdusa, at ang may pananagutan ang nagkukuwento sa kanyang lugar.</mark>", "Sa talata 5, sinabi niya, <mark>\"Bumangon laban sa akin ang mga taga-Gibea at pinalibutan ang bahay sa gabi. Balak nila akong patayin, at nilapastangan nila ang aking babae, at namatay siya.\"</mark> Kapag inihambing sa kabanata 19, lumilitaw ang pagkakaiba. Doon, ang mga walang-kwentang lalaki ng lungsod; sa kanyang salaysay, parang ang buong Gibea. At may isang mapagpasyang pangungusap na nawawala: <mark>\"Hinawakan ko ang aking babae at inilabas siya sa kanila.\"</mark> Hindi rin niya binanggit na sa umaga ay sinabi lamang niya, \"Bumangon ka, umalis na tayo,\" at na hindi malinaw kung kailan talaga siya namatay.", "Hindi lahat ng sinabi niya ay kasinungalingan. Tunay na naganap ang kakila-kilabot na krimen sa Gibea. Ngunit inalis niya ang mga katotohanang hindi pabor sa kanya at muling binuo ang kwento sa paligid ng kanyang sarili. <mark>Hindi lamang pagsisinungaling ang paraan ng pagbaluktot sa katotohanan. Ang pag-aalis ng mahahalagang katotohanan upang maabot ang konklusyong gusto natin ay pagbaluktot din sa katotohanan.</mark>", "Sa talata 6, gumamit siya ng matinding wikang panrelihiyon: \"ang buong lupain ng mana ng Israel,\" \"kasuklam-suklam at kahangalan.\" Tunay na masama ang ginawa ng Gibea. Ngunit habang inaakusahan ang kasalanan ng komunidad, ibinukod niya ang sarili niyang kasalanan. Puno ng salitang panrelihiyon ang kanyang pananalita, ngunit <mark>wala roon kung paano ito tinitingnan ni Yahweh</mark>. At sa talata 7, hindi niya sinabing \"Magtanong tayo kay Yahweh,\" kundi <mark>\"Magbigay kayo ng inyong payo at panukala rito.\"</mark> Ngayon, hindi lamang isang indibidwal, kundi ang buong komunidad ang nagsisimulang kumilos ayon sa sariling opinyon."], "points": ["Kahit ang taong hindi nagsisi ay maaaring humingi ng katarungan. Kaya bago magsalita tungkol sa katarungan, itanong muna natin: \"Panginoon, ano ang kailangan kong pagsisihan sa sitwasyong ito?\""]}, {"title": "Aplikasyon · Pagkakaisa sa Ilalim ng Salita — Simula sa Troso sa Sarili Kong Mata", "paragraphs": ["Dalawang panganib ang nasa talata ngayon. Ang una ay <mark>maling pagkakaisa</mark>. Nagtipon ang Israel gaya ng iisang tao sa harap ni Yahweh, ngunit hindi nagtanong kay Yahweh; nagkaisa sila sa paligid ng sarili nilang galit at paghatol. Maaaring magkaisa sa iisang desisyon ang isang iglesia o pamilya. Ang mahalaga ay hindi lamang kung iisa tayo, kundi <mark>sa paligid ng ano tayo nagkakaisa</mark>.", "Nang ipanalangin ni Jesus ang pagkakaisa ng Kanyang mga alagad, una Niyang idinalangin, <mark>\"Pakabanalin Mo sila sa katotohanan; ang Iyong salita ay katotohanan.\"</mark> Ang pagkakaisang nais ni Jesus ay hindi pagkakaisang tumatalikod sa katotohanan, kundi pagkakaisang nabubuo sa loob ng Salita ng Diyos at sa ilalim ng Kanyang kalooban. Kung tunay na nais ng iglesia na magkaisa, bago sabihing 'Magkasundo tayong lahat,' dapat nating sabihing <mark>'Tumayo tayong lahat sa ilalim ng Salita.'</mark>", "Ang ikalawang panganib ay <mark>baluktot na pananaw</mark>. Eksaktong inilarawan ng Levita ang kasalanan ng iba habang inaalis ang sarili niyang pananagutan. Maaari rin nating sabihin: may mabuting dahilan ang aking mga salita, mali ang sa kanila; hindi maiiwasan ang aking ginawa dahil sa sitwasyon, kasalanan ang sa kanila. Sinabi ni Jesus, <mark>\"Bakit mo tinitingnan ang puwing sa mata ng iyong kapatid, ngunit hindi mo napapansin ang troso sa iyong sariling mata?\"</mark> Hindi Niya sinasabing balewalain ang kasalanan ng iba, kundi tingnan muna nang tapat ang ating sarili. Dapat maging salamin ang Salita ng Diyos na nagpapakita muna sa akin ng aking sarili bago ko hatulan ang iba.", "Nagtipon sa harap ng Diyos ang mga tao sa Mga Hukom ngunit sinunod ang sarili nilang opinyon. Iba ang mga alagad ni Jesus: magkasama silang tumatayo sa ilalim ng Salita, unang nakikita ang troso sa sarili nilang mata, at itinatanong ang kalooban ng Ama higit sa sarili nila. <mark>Ang tunay na pagkakaisa ay hindi nagsisimula kapag pare-pareho ang sinasabi ng lahat, kundi kapag sama-samang tumatayo ang lahat sa ilalim ng Salita ng Diyos.</mark>"], "points": ["Ang katarungan ay hindi nagsisimula sa paghatol sa iba; nagsisimula ito sa paglalagay sa aking sarili sa ilalim ng parehong pamantayan sa harap ng Salita ng Diyos."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung ang pagkakaisa ng aking komunidad ay nakasentro sa Salita, o sa iisang galit at pakiramdam na 'kami ang tama.'"}, {"key": "c2", "text": "Sinuri ko kung nagtipon at nanalangin ako sa harap ng Diyos habang nakatakda na ang aking mga plano, nang hindi talaga itinatanong ang Kanyang kalooban."}, {"key": "c3", "text": "Pinag-isipan ko kung, sa pagpapaliwanag ng isang bagay, inalis ko ang mga katotohanang hindi pabor sa akin at binuo muli ang kwento sa paligid ng aking sarili."}, {"key": "c4", "text": "Tiningnan ko muna ang troso sa sarili kong mata bago ang puwing sa iba, at itinanong kung ano ang kailangan kong pagsisihan sa sitwasyong ito."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Kapag pinag-uusapan ko ang mga pagkakamali ng iba nitong mga araw, ano ang 'isang pangungusap tungkol sa akin' na palagi kong inaalis?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Unang Magtanong", "value": "Bago ang isang desisyon sa komunidad o pamilya, magkasamang manalangin ng 'Panginoon, ano ang Iyong kalooban?' bago magkaroon ng konklusyon"}, {"key": "act2", "label": "Hanapin ang Nawawalang Pangungusap", "value": "Alalahanin ang isang kamakailang alitan at tapat na isulat ang isang bahagi ng sarili mong pananagutan na hindi mo binanggit"}, {"key": "act3", "label": "Ang Troso Muna", "value": "Kapag gusto mong pumuna ng iba, itanong muna sa Diyos, 'Ano ang kailangan kong pagsisihan dito?'"}, {"key": "act4", "label": "Ang mga Nasa Labas", "value": "Isipin ang isang tao o grupong naiwan sa labas ng 'aming' pagkakaisa, at pakinggan din ang kanilang panig"}, {"key": "act5", "label": "Tumayo sa Ilalim ng Salita", "value": "Isaulo ang Juan 17:17 at muling suriin ang iyong mga paghatol ngayon sa liwanag ng Salita"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Jesus, sa pagpapabanal Mo sa amin sa katotohanan at sa pananalangin na kami'y maging isa sa loob ng Salita ng Ama."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako na nagtipon ako sa harap Mo nang hindi nagtatanong sa Iyo, pinalaki ang puwing sa mata ng iba, at binura sa kwento ang troso sa sarili kong mata at ang aking pananagutan."}, {"key": "p3", "tag": "Kahilingan", "text": "Hayaan Mong tumayo ang aming pagkakaisa hindi sa galit o sa pakiramdam na 'kami ang tama,' kundi sa Iyong Salita at katotohanan. Bago ako magsalita tungkol sa katarungan, tulungan Mo akong tumayo muna nang tapat sa harap ng Iyong Salita."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-09-16';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
