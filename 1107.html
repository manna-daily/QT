<script>
const CONTENT = {"ko": {"kicker": "Daily Bible QT", "date": "11월 7일 토요일", "ref": "고린도후서 5장 11–21절", "headline": "나를 움직이는 힘은<br>무엇입니까?", "videoLabel": "오늘의 10분 말씀 듣기", "videoSub": "매일성경 큐티 · 고린도후서 5:11-21", "s1heading": "오늘의 말씀", "verse": "\"그리스도의 사랑이 우리를 강권하시는도다 …<br>그가 모든 사람을 대신하여 죽으심은 살아 있는 자들로 하여금<br>다시는 그들 자신을 위하여 살지 않고 오직 그들을 대신하여 죽었다가 다시 살아나신 이를 위하여 살게 하려 함이라\"", "verseRef": "고린도후서 5:14–15", "s2heading": "5분 요약", "cards": [{"title": "들어가며 · 무엇에 붙들려 살아가고 있습니까", "paragraphs": ["사람은 무엇에 붙들려 있느냐에 따라 삶의 방향이 달라집니다. 인정받고 싶은 마음이 크면 사람들의 평가에 민감해지고, 내 이익이 가장 중요하면 관계에서도 나에게 도움이 되는지를 먼저 따지며, 내 편안함이 기준이면 어려운 일을 피하게 됩니다. 바울도 사람들의 평가를 받았고 고린도 교회와 오해와 갈등을 겪었습니다. 그러나 그를 붙들고 움직인 힘은 <mark>그리스도의 사랑</mark>이었습니다.", "앞에서 바울은 주님과 함께할 미래를 소망하기에 주님을 기쁘시게 하려고 힘쓰며, 모두가 그리스도의 심판대 앞에 설 것을 기억하게 했습니다. 오늘 본문은 그 믿음이 바울의 사역에 어떤 영향을 주는지 보여 줍니다. 오늘 말씀의 중심은 이것입니다. <mark>우리를 위해 죽고 살아나신 그리스도의 사랑이 오늘 우리의 삶을 이끌어야 합니다</mark>."], "points": ["나는 내 평판과 이익을 지키기 위해 움직입니까, 나를 위해 자신을 내어 주신 주님의 사랑에 응답하며 살아갑니까?"]}, {"title": "11–13절 · 주님 앞에서 진실하고, 사람 앞에서도 설명합니다", "paragraphs": ["<mark>\"우리는 주를 두려워함을 알므로 사람들을 권면하거니와 우리가 하나님 앞에 알려졌으니 너희의 양심에도 알려지기를 바라노라\"</mark>(11절). 주님을 두려워한다는 것은 그분의 거룩하심과 판단을 진지하게 받아들이는 것입니다. 사람들의 좋은 평가만으로는 충분하지 않고 주님 앞에서도 진실해야 합니다. 그렇다고 \"하나님이 아시니 설명할 필요 없다\"고 하지도 않습니다. 하나님 앞에 정직한 사람은 다른 사람이 자신의 말과 행동을 살펴보는 일도 받아들입니다.", "바울은 <mark>\"마음으로 하지 않고 외모로 자랑하는 자들\"</mark>(12절)을 말합니다. 외모는 얼굴만이 아니라 사람 눈에 인상적으로 보이는 조건과 지위를 포함합니다. 우리도 눈에 보이는 성과로 신앙과 섬김을 평가하기 쉽지만, 주님 앞에서는 <mark>어떤 마음으로 누구를 위해 섬겼는지</mark>가 중요합니다. 바울은 미쳤다 보이든 온전하다 보이든 하나님과 성도들을 위해 행동한다고 말합니다(13절). 자신을 돋보이게 하는 것이 목적이 아니었습니다."], "points": ["신앙의 진실함은 특별한 경험보다, 받은 말씀에 충실한지와 함께하는 사람들을 어떻게 대하는지에서 드러납니다."]}, {"title": "14–15절 · 그리스도의 사랑이 우리를 강권하십니다", "paragraphs": ["<mark>\"그리스도의 사랑이 우리를 강권하시는도다\"</mark>(14절). 여기서 먼저 말하는 것은 우리의 사랑이 아니라 <mark>그리스도께서 우리에게 베푸신 사랑</mark>입니다. 이어지는 말씀이 그 사랑을 그분의 죽음으로 설명하기 때문입니다. '강권한다'는 것은 그 사랑이 바울을 붙들고 행동하도록 이끈다는 뜻입니다. 그리스도께서 죄인을 대표해 대신 죽으셨고, 그리스도께 속한 사람은 그분의 죽음과 새 생명에 참여합니다.", "그 목적은 <mark>\"다시는 그들 자신을 위하여 살지 않고 오직 그들을 대신하여 죽었다가 다시 살아나신 이를 위하여 살게 하려 함\"</mark>(15절)입니다. 우리를 심판하실 주님이 바로 우리를 위해 죽으신 구주이십니다. 그러니 그 사랑을 안다고 죄를 가볍게 여기지 않고, 죄를 깨달았을 때 그리스도를 의지해 돌아갑니다. 내가 얼마나 열심히 했는지만 계산하면 인정받지 못할 때 쉽게 지칩니다. 그때 <mark>나를 위해 생명을 내어 주신 주님</mark>을 기억하십시오."], "points": ["그리스도의 사랑에 붙들리면, 내가 얻을 것을 계산하던 자리에서 다른 사람에게 필요한 것을 살피는 자리로 나아갑니다."]}, {"title": "16–17절 · 그리스도 안에서 사람을 보는 기준이 달라집니다", "paragraphs": ["<mark>\"그러므로 우리가 이제부터는 어떤 사람도 육신을 따라 알지 아니하노라\"</mark>(16절). 세상의 기준과 눈에 보이는 조건으로 사람을 판단하지 않는다는 뜻입니다. 바울 자신도 전에는 그리스도를 그렇게 판단했지만, 십자가와 부활을 통해 그분을 새롭게 알았습니다. 그리스도를 보는 눈이 달라지니 사람을 보는 눈도 달라졌습니다. 우리는 사람을 만나면 나에게 도움이 되는지, 내 편인지부터 살필 때가 있습니다. 그러나 그리스도의 사랑을 믿는다면 <mark>상대를 내 필요를 채워 주는 사람으로만 대할 수 없습니다</mark>.", "<mark>\"그런즉 누구든지 그리스도 안에 있으면 새로운 피조물이라 이전 것은 지나갔으니 보라 새 것이 되었도다\"</mark>(17절). 새로워짐의 출발점은 그리스도와의 관계입니다. 모든 습관이 한순간에 완벽해지거나 과거의 책임이 없어진다는 뜻은 아니고, 삶의 중심과 방향이 달라졌다는 뜻입니다. 내가 새롭게 되었다고 믿는다면, <mark>다른 사람도 과거의 모습에만 묶어 두지 않고</mark> 하나님께서 그 안에 행하실 변화를 함께 바라보아야 합니다."], "points": ["새롭게 된 은혜는 나를 위로하는 데서 끝나지 않고, 다른 사람을 대하는 태도에서도 드러나야 합니다."]}, {"title": "18–21절 · 하나님과 화목하라", "paragraphs": ["<mark>\"모든 것이 하나님께로서 났나니\"</mark>(18절). 관계를 깨뜨린 쪽은 우리였지만, 하나님께서 그리스도를 통해 우리를 자신에게로 이끄셨습니다. 하나님은 <mark>\"그들의 죄를 그들에게 돌리지 아니하시고\"</mark>(19절) 화목을 이루셨습니다. 죄를 대수롭지 않게 여겨서가 아니라 그리스도를 통해 그 죄를 다루셨기 때문입니다. 그리고 바울은 자신을 그리스도를 대신한 <mark>\"사신\"</mark>이라 부르며 <mark>\"너희는 하나님과 화목하라\"</mark>(20절)고 간청합니다. 맡겨진 말씀을 자기 이익에 맞게 바꿀 권한은 없습니다.", "<mark>\"하나님이 죄를 알지도 못하신 이를 우리를 대신하여 죄로 삼으신 것은 우리로 하여금 그의 안에서 하나님의 의가 되게 하려 하심이라\"</mark>(21절). 예수님이 죄를 지으셨다는 뜻이 아니라, 죄인이 받아야 할 죽음과 심판을 대신 담당하셨다는 뜻입니다. 순서를 기억하십시오. 우리가 충분히 의롭게 살아서 화목을 얻은 것이 아니라, <mark>그리스도 때문에 받아들여졌기에 이제 그 은혜에 합당하게 살아갑니다</mark>."], "points": ["복음을 전할 때도 내가 이기거나 인정받는 것이 아니라, 상대가 하나님께 돌아오는 것이 목적입니다."]}, {"title": "적용 · 선택의 순간, 주님의 사랑을 먼저 기억합니다", "paragraphs": ["하나님과의 화목이 그리스도를 통해 죄를 실제로 다루신 결과라면, 우리도 갈등을 풀 때 잘못을 덮어 두는 것으로 만족할 수 없습니다. 남보다 나 자신을 먼저 돌아보십시오. <mark>내 잘못을 인정하고 회개하며, 용서하고, 필요한 책임을 감당하는 것</mark>입니다. 화목의 은혜를 받은 사람은 체면을 지키는 일보다 진실하게 관계를 회복하는 일을 귀하게 여깁니다.", "예수님은 십자가를 앞두고 제자들의 발을 씻기시며 <mark>\"내가 너희에게 행한 것 같이 너희도 행하게 하려 하여 본을 보였노라\"</mark>(요 13:15)고 말씀하셨습니다. 먼저 주님께서 사랑하고 섬기셨고, 그 사랑을 받은 제자들에게 같은 길을 걸으라 하셨습니다. 우리가 순종할 힘도 <mark>먼저 베푸신 주님의 사랑</mark>에서 나옵니다. 바울도 그 사랑에 붙들렸기에 자신과 갈등하던 성도들에게까지 화목의 은혜를 전했습니다.", "오늘 선택의 순간에 잠시 멈추어 보십시오. 인정받지 못했다고 차갑게 말하고 싶을 때, 내 편이 아니라고 밀어내고 싶을 때, 손해 볼까 두려워 필요한 섬김을 피하고 싶을 때, <mark>주님께서 나를 어떻게 사랑하셨는지를 먼저 기억하십시오</mark>.", "오늘 나의 말과 선택을 움직이는 힘은 나의 편안함과 이익과 평판입니까, 아니면 우리를 위해 죽고 살아나신 그리스도의 사랑입니까?"], "points": ["나를 위해 죽고 살아나신 그리스도의 사랑에 붙들려, 오늘 나보다 그리스도를 위해 살아갑니다."]}], "s3heading": "오늘 나를 점검합니다", "checks": [{"key": "c1", "text": "사람들의 평가와 눈에 보이는 성과보다 주님 앞에서의 진실함을 구했는지 돌아봤다"}, {"key": "c2", "text": "내가 한 수고를 계산하며 인정받지 못해 지쳐 있지 않은지 점검했다"}, {"key": "c3", "text": "사람을 '나에게 도움이 되는가, 내 편인가'로 판단하지 않았는지 돌아봤다"}, {"key": "c4", "text": "갈등 앞에서 체면보다 내 잘못을 먼저 인정하고 화목을 구했는지 점검했다"}], "s4heading": "묵상 한 줄", "memoHint": "오늘 나의 말과 선택을 움직이는 힘은 무엇이며, 그리스도의 사랑에 붙들릴 때 무엇이 달라지겠습니까?", "memoPlaceholder": "한 문장이면 충분합니다.", "s5heading": "오늘 실천 하나", "pills": [{"key": "act1", "label": "주님의 사랑 기억하기", "value": "차갑게 말하고 싶은 순간 잠시 멈추고, 나를 위해 죽으신 주님의 사랑을 먼저 떠올리기"}, {"key": "act2", "label": "새롭게 바라보기", "value": "과거의 모습으로만 대하던 한 사람을 하나님이 변화시키실 사람으로 바라보고 따뜻한 말 건네기"}, {"key": "act3", "label": "먼저 인정하기", "value": "갈등 중인 관계에서 내 잘못을 먼저 인정하고 화목을 구하는 말 건네기"}, {"key": "act4", "label": "계산 내려놓기", "value": "손해가 두려워 피하던 섬김 하나를 오늘 기꺼이 감당하기"}, {"key": "act5", "label": "말씀 암송", "value": "고린도후서 5:17을 외우며 그리스도 안에서 새로운 피조물임을 기억하기"}], "s6heading": "오늘의 기도", "prayers": [{"key": "p1", "tag": "감사", "text": "죄를 알지도 못하신 그리스도를 우리를 대신하여 죄로 삼으시고, 우리 죄를 우리에게 돌리지 않으시며, 우리를 새로운 피조물로 삼아 화목하게 하신 하나님께 감사합니다"}, {"key": "p2", "tag": "회개", "text": "사람들의 평가와 내 이익과 편안함에 붙들려 살고, 사람을 내 필요와 내 편으로만 판단하며, 갈등 앞에서 체면을 지키려 했던 저를 회개합니다"}, {"key": "p3", "tag": "간구", "text": "그리스도의 사랑이 저를 강권하게 하셔서 더 이상 나를 위하여 살지 않고 주님을 위해 살게 하시며, 화목의 은혜를 전하는 사람이 되게 하소서"}], "s7heading": "나의 기도제목", "pr1Label": "나를 위해", "pr1Placeholder": "한 줄", "pr2Label": "구역 · 이웃을 위해", "pr2Placeholder": "서로 기도해 드릴 수 있도록", "actWhoPlaceholder": "누구에게 · 언제 · 어떻게 (예: ○○에게 오늘 저녁 전화)", "footer": "항상 기뻐하라 · 쉬지 말고 기도하라 · 범사에 감사하라", "ui": {"bgmIdle": "🎵 묵상 음악 ", "bgmPlaying": "🎵 재생 중 ", "bgmTapToPlay": "🎵 눌러서 재생 ", "fontLabel": "글자", "copyBtn": "📋 나눔 복사", "shareBtn": "공유", "toastMusicFail": "음악 파일을 불러올 수 없습니다", "toastCopied": "복사됨! 카톡방에 붙여넣으세요", "toastLinkCopied": "링크 복사됨", "savedPrefix": "이 기기에 자동 저장됨 · ", "loadedPrev": "이전에 저장한 내용을 불러왔습니다", "shareText": "오늘 큐티 함께해요", "copyHeader": "나눔", "copyCheck": "점검", "copyAct": "실천", "copyPrayer": "기도", "copyPrayerReq": "기도제목", "copyMine": "나", "copyGroup": "구역"}}, "en": {"kicker": "Daily Bible QT", "date": "November 7, Saturday", "ref": "2 Corinthians 5:11–21", "headline": "What Is the Power<br>That Moves Me?", "videoLabel": "Listen to Today's 10-Minute Message", "videoSub": "Daily Bible QT · 2 Corinthians 5:11-21", "s1heading": "Today's Word", "verse": "\"For the love of Christ controls us …<br>and He died for all, that those who live might no longer live for themselves<br>but for Him who for their sake died and was raised.\"", "verseRef": "2 Corinthians 5:14–15", "s2heading": "5-Minute Summary", "cards": [{"title": "Introduction · What Are You Held By?", "paragraphs": ["What a person is held by changes the way and direction they live. When the desire for recognition is strong, we become sensitive to people's evaluations. When our own interest matters most, we first ask whether a relationship benefits us. When our comfort is the standard, we want to avoid hard things. What are you held by as you live? Paul too was evaluated by people, and he went through misunderstanding and conflict with the Corinthian church. But the power that held and moved him was <mark>the love of Christ</mark>.", "In the previous passage, Paul said that because he hopes for the future with the Lord, he aims to please Him now, and he reminded us all that we will stand before the judgment seat of Christ. Today's passage shows how that faith shaped Paul's ministry. He explains his sincerity but doesn't stop there; he longs for the believers to be reconciled to God and live worthily of Christ, because he sees them through Christ's love. Here is the center of today's Word: <mark>the love of Christ, who died and rose for us, must lead our lives today.</mark> How do you look at your church? Before thinking of others, let's each look at ourselves: Do I move to protect my reputation and interests? Or do I live today responding to the love of the Lord who gave Himself for me? Let's look at Paul's three confessions."], "points": ["Do I move to protect my reputation and interests, or do I live responding to the love of the Lord who gave Himself for me?"]}, {"title": "Verses 11–13 · Truthful Before the Lord, and Willing to Explain to People", "paragraphs": ["Verse 11 continues from the judgment seat: <mark>'Therefore, knowing the fear of the Lord, we persuade others. But what we are is known to God, and I hope it is known also to your conscience.'</mark> Paul knows that his words and even his inner motives will be revealed before the Lord. So he persuades people to accept the gospel and explains so that the believers will rightly understand his ministry. Fearing the Lord means taking His holiness and judgment seriously. Good evaluations from people aren't enough; we must also be truthful before the Lord. Yet Paul doesn't say, 'God knows, so I don't need to explain myself to people.' He hopes the Corinthians will recognize his sincerity too. A person who is honest before God also accepts others examining their words and actions.", "Verse 12 corrects the standard for evaluating ministry. Paul speaks of <mark>'those who boast about outward appearance and not about what is in the heart.'</mark> 'Outward appearance' isn't only facial features; it includes conditions and status that look impressive to people. Paul helps the believers recognize his genuine ministry so they can answer those captivated by appearances. We too easily evaluate faith and service by visible results. But before the Lord, <mark>with what heart and for whom we served</mark> matters greatly. In verse 13, Paul says that whether he seems out of his mind or in his right mind, it is for God and for the believers. It's hard to determine from the text alone exactly what experience or behavior this refers to. But the direction Paul emphasizes is clear: his purpose is not to make himself stand out but to serve God and benefit the church. The genuineness of faith can't be judged only by how special our experiences are; it shows in whether we're faithful to the Word we've received and how we treat the people around us."], "points": ["Genuine faith shows less in special experiences than in faithfulness to the Word and how we treat those around us."]}, {"title": "Verses 14–15 · The Love of Christ Controls Us", "paragraphs": ["Verse 14: <mark>'For the love of Christ controls us, because we have concluded this: that one has died for all, therefore all have died.'</mark> What's spoken of first here is <mark>the love Christ has shown us</mark>. Remember: not our response first, but God's love first — the following words explain that love through His death. 'Controls' or 'compels' means that this love takes hold of Paul and leads him to act. Paul knew the Lord who gave His life for him, and because of that love he lives for God and the church. What do you live for? Christ died as the representative of sinners, in their place. Those who belong to Christ share in His death and new life.", "In verse 15, Paul states the purpose clearly: <mark>'and He died for all, that those who live might no longer live for themselves but for Him who for their sake died and was raised.'</mark> Those who have received new life turn from living for themselves to living for the Christ who died and rose for them. The Lord who will judge us is the very Savior who died for us. So knowing His love, we don't take sin lightly; and when we realize our sin, we return to God relying on the Christ who died for us. When our devotion wavers, we must look again at this love. If we only calculate how hard we've worked, we easily lose heart and grow weary when we're not recognized. At that moment, remember <mark>the Lord who gave His life for you</mark>."], "points": ["Held by Christ's love, I move from calculating what I'll gain to noticing what others need."]}, {"title": "Verses 16–17 · In Christ, the Way We See People Changes", "paragraphs": ["Verse 16 begins with 'From now on, therefore' — continuing the change brought by Christ's death and resurrection: <mark>'we regard no one according to the flesh.'</mark> In this context it means not judging people by worldly standards and visible conditions. Paul himself once judged Christ by such standards, but through the cross and resurrection he came to know Him anew. As the way he saw Christ changed, the way he saw people changed too. The Corinthians needed this — and so do we — because they were judging Paul's whole ministry by his sufferings and weakness. We too sometimes first check, when we meet someone, whether they're useful to us or approve of us — whether they're on our side or not. But if we know and believe the love with which Christ gave Himself, <mark>we can't treat others merely as people who meet our needs</mark>.", "Verse 17: <mark>'Therefore, if anyone is in Christ, he is a new creation. The old has passed away; behold, the new has come.'</mark> The starting point of renewal is our relationship with Christ. To those who belong to the Lord who died and rose, God gives a new life. This doesn't mean every habit becomes perfect in an instant or that responsibility for past wrongs disappears. It means that, as people who belong to Christ, the center and direction of our lives have changed — and that change keeps growing with the Spirit's help. So the grace of being made new doesn't end with comforting ourselves; it must show in how we treat others. Even as we see someone's shortcomings, we look also at what God has done in them and the possibility of His changing them. If I believe I've been made new, <mark>I mustn't bind others only to their past</mark>, but look together toward the path of repentance and change."], "points": ["The grace of being made new doesn't stop at comforting me; it must show in how I treat others."]}, {"title": "Verses 18–21 · Be Reconciled to God", "paragraphs": ["In verse 18, Paul confesses, <mark>'All this is from God, who through Christ reconciled us to Himself and gave us the ministry of reconciliation.'</mark> New life comes from God too. We were the ones who broke the relationship, but God drew us to Himself through Christ. Verse 19 connects this reconciliation with the forgiveness of sins: God was <mark>'not counting their trespasses against them.'</mark> Not because He takes sin lightly, but because He dealt with that sin through Christ. God forgives us and welcomes us into a relationship of living with Him. The peace Paul wants to share comes from this reconciliation with God. In verse 20, God, having accomplished reconciliation, also entrusted the message of it. Paul calls himself an <mark>'ambassador for Christ'</mark> — 'we' here refers first to Paul and his gospel co-workers. Today's church likewise serves faithfully according to the apostles' gospel so that people return to God. Those who proclaim an entrusted Word have no right to change it to suit their own interests. Paul's plea is <mark>'be reconciled to God'</mark> — the heart of his gospel, before which the Corinthians too had to examine their lives and relationships.", "Remember the order: God first accomplished reconciliation, forgiveness, and peace through Christ, and then calls us to receive that grace. We didn't pay the price of salvation through obedience; we believe the grace He first gave and respond to it. So when we share the gospel, our goal must not be to win or be recognized, but to serve so the other person returns to God and lives in that grace. Verse 21 reveals how reconciliation was possible: <mark>'For our sake He made Him to be sin who knew no sin, so that in Him we might become the righteousness of God.'</mark> This doesn't mean Jesus sinned; it means He bore for us the death and judgment sinners deserved. By that grace we are counted righteous before God in Christ and accepted. We don't gain reconciliation by living righteously enough; <mark>because we've been accepted on account of Christ, we now live worthily of that grace</mark>."], "points": ["When sharing the gospel, the goal isn't to win or be recognized, but for the other person to return to God."]}, {"title": "Application · In Moments of Choice, Remember the Lord's Love First", "paragraphs": ["This grace changes how we deal with relational problems. If reconciliation with God is the result of Him actually dealing with sin through Christ, then we too can't be content to simply cover over wrongs when resolving conflict. Think of yourself before others: <mark>admit your own wrong, repent, forgive, and take on the responsibility needed.</mark> Reconciliation with God and restoring human relationships are distinct, but the grace we've received leads us to look honestly at our relationships. Those who have received the grace of reconciliation value truthfully admitting wrong and restoring relationships far more than protecting their face.", "Remember the scene of Jesus washing His disciples' feet before the cross. The Lord loved His own to the end and humbled Himself to serve them. Then He said, <mark>'For I have given you an example, that you also should do just as I have done to you'</mark> (John 13:15). The Lord loved and served first, and told the disciples who received that love to walk the same path. The strength for our obedience, too, comes from <mark>the Lord's love given first</mark>. The Lord who washed their feet bore our sins on the cross and rose again, opening the way of new life. Paul lived held by that love — so he shared the grace of reconciliation even with believers in conflict with him and sought for them to stand right before God.", "Today, pause at the moment of choice. When you want to speak coldly because you weren't recognized, when you want to push someone away because they're not on your side, when you want to avoid needed service for fear of loss — <mark>first remember how the Lord has loved you</mark>.", "Is the power moving my words and choices today my comfort, interests, and reputation — or the love of Christ, who died and rose for us?"], "points": ["Held by the love of Christ who died and rose for me, today I live not for myself but for Him."]}], "s3heading": "Check Myself Today", "checks": [{"key": "c1", "text": "I reflected on whether I sought truthfulness before the Lord more than people's evaluations and visible results."}, {"key": "c2", "text": "I checked whether I'm worn out from calculating my efforts and not being recognized."}, {"key": "c3", "text": "I reflected on whether I judged people by 'Are they useful to me? Are they on my side?'"}, {"key": "c4", "text": "I checked whether, in conflict, I first admitted my own wrong and sought reconciliation rather than saving face."}], "s4heading": "One-Line Reflection", "memoHint": "What is the power moving my words and choices today, and what would change if I were held by Christ's love?", "memoPlaceholder": "One sentence is enough.", "s5heading": "One Action Today", "pills": [{"key": "act1", "label": "Remember His Love", "value": "When you want to speak coldly, pause and first recall the love of the Lord who died for you"}, {"key": "act2", "label": "See Them Anew", "value": "Look at someone you've only seen through their past as a person God will change, and offer a warm word"}, {"key": "act3", "label": "Admit First", "value": "In a conflicted relationship, admit your own wrong first and speak words seeking reconciliation"}, {"key": "act4", "label": "Drop the Calculation", "value": "Willingly take on one act of service you've avoided for fear of loss"}, {"key": "act5", "label": "Memorize the Word", "value": "Memorize 2 Corinthians 5:17 and remember that in Christ you are a new creation"}], "s6heading": "Today's Prayer", "prayers": [{"key": "p1", "tag": "Thanks", "text": "Thank You, God, for making Christ, who knew no sin, to be sin for us, for not counting our trespasses against us, and for making us new creations reconciled to You."}, {"key": "p2", "tag": "Repent", "text": "I repent of living held by people's evaluations, my interests, and my comfort, of judging people only by my needs and my side, and of trying to save face in conflict."}, {"key": "p3", "tag": "Ask", "text": "Let the love of Christ control me so that I no longer live for myself but for You, and make me one who carries the grace of reconciliation."}], "s7heading": "My Prayer Requests", "pr1Label": "For myself", "pr1Placeholder": "One line", "pr2Label": "For my group · neighbors", "pr2Placeholder": "So we can pray for one another", "actWhoPlaceholder": "To whom · when · how (e.g., call ○○ this evening)", "footer": "Rejoice always · Pray without ceasing · Give thanks in all circumstances", "ui": {"bgmIdle": "🎵 Reflection Music ", "bgmPlaying": "🎵 Playing ", "bgmTapToPlay": "🎵 Tap to play ", "fontLabel": "Text", "copyBtn": "📋 Copy to Share", "shareBtn": "Share", "toastMusicFail": "Couldn't load the music file", "toastCopied": "Copied! Paste it in your group chat", "toastLinkCopied": "Link copied", "savedPrefix": "Auto-saved on this device · ", "loadedPrev": "Loaded your previous entry", "shareText": "Join today's QT with me", "copyHeader": "QT share", "copyCheck": "Checked", "copyAct": "Action", "copyPrayer": "Prayer", "copyPrayerReq": "Prayer requests", "copyMine": "Me", "copyGroup": "Group"}}, "tl": {"kicker": "Daily Bible QT", "date": "Nobyembre 7, Sabado", "ref": "2 Corinto 5:11–21", "headline": "Ano ang Kapangyarihang<br>Nagpapakilos sa Akin?", "videoLabel": "Pakinggan ang 10-Minutong Mensahe Ngayon", "videoSub": "Daily Bible QT · 2 Corinto 5:11-21", "s1heading": "Salita Ngayon", "verse": "\"Sapagkat ang pag-ibig ni Cristo ang nag-uudyok sa amin …<br>at Siya'y namatay para sa lahat, upang ang mga nabubuhay ay hindi na mabuhay para sa kanilang sarili<br>kundi para sa Kanya na alang-alang sa kanila ay namatay at muling binuhay.\"", "verseRef": "2 Corinto 5:14–15", "s2heading": "5 Minutong Buod", "cards": [{"title": "Panimula · Ano ang Humahawak sa Iyo?", "paragraphs": ["Kung ano ang humahawak sa isang tao ang nagbabago sa paraan at direksyon ng kanyang pamumuhay. Kapag malakas ang pagnanais na kilalanin, nagiging sensitibo tayo sa pagsusuri ng mga tao. Kapag ang sariling interes ang pinakamahalaga, inuuna nating itanong kung kapaki-pakinabang sa atin ang isang relasyon. Kapag ang ating ginhawa ang pamantayan, gusto nating iwasan ang mahihirap na bagay. Ano ang humahawak sa iyo sa iyong pamumuhay? Si Pablo rin ay sinuri ng mga tao, at dumaan siya sa hindi pagkakaunawaan at alitan sa iglesya sa Corinto. Ngunit ang kapangyarihang humawak at nagpakilos sa kanya ay <mark>ang pag-ibig ni Cristo</mark>.", "Sa naunang talata, sinabi ni Pablo na dahil umaasa siya sa hinaharap kasama ng Panginoon, nagsisikap siyang kalugdan Siya ngayon, at ipinaalala niya sa ating lahat na haharap tayo sa hukuman ni Cristo. Ipinapakita ng talata ngayon kung paano hinubog ng pananampalatayang iyon ang ministeryo ni Pablo. Ipinaliliwanag niya ang kanyang katapatan ngunit hindi siya humihinto roon; nananabik siyang makipagkasundo ang mga mananampalataya sa Diyos at mamuhay nang karapat-dapat kay Cristo, dahil tinitingnan niya sila sa pamamagitan ng pag-ibig ni Cristo. Narito ang sentro ng Salita ngayon: <mark>ang pag-ibig ni Cristo, na namatay at muling nabuhay para sa atin, ang dapat umakay sa ating buhay ngayon.</mark> Paano mo tinitingnan ang iyong iglesya? Bago isipin ang iba, tingnan muna natin ang bawat sarili: Kumikilos ba ako upang protektahan ang aking reputasyon at interes? O namumuhay ba ako ngayon bilang tugon sa pag-ibig ng Panginoong nagbigay ng Kanyang sarili para sa akin? Tingnan natin ang tatlong pagpapahayag ni Pablo."], "points": ["Kumikilos ba ako upang protektahan ang aking reputasyon at interes, o namumuhay ako bilang tugon sa pag-ibig ng Panginoong nagbigay ng sarili para sa akin?"]}, {"title": "Talata 11–13 · Tapat sa Harap ng Panginoon, at Handang Magpaliwanag sa mga Tao", "paragraphs": ["Ipinagpapatuloy ng talata 11 ang tungkol sa hukuman: <mark>'Kaya, dahil alam namin ang takot sa Panginoon, hinihikayat namin ang mga tao. Ngunit kung ano kami ay kilala ng Diyos, at umaasa akong kilala rin ito ng inyong konsensya.'</mark> Alam ni Pablo na mahahayag sa harap ng Panginoon ang kanyang mga salita at maging ang kanyang panloob na motibo. Kaya hinihikayat niya ang mga tao na tanggapin ang ebanghelyo at nagpapaliwanag upang wastong maunawaan ng mga mananampalataya ang kanyang ministeryo. Ang pagkatakot sa Panginoon ay pagtanggap nang seryoso sa Kanyang kabanalan at paghatol. Hindi sapat ang mabuting pagsusuri ng tao; dapat din tayong maging tapat sa harap ng Panginoon. Gayunman, hindi sinasabi ni Pablo, 'Alam ng Diyos, kaya hindi ko kailangang magpaliwanag sa tao.' Umaasa siyang makikilala rin ng mga taga-Corinto ang kanyang katapatan. Ang taong tapat sa harap ng Diyos ay tumatanggap din na suriin ng iba ang kanyang mga salita at kilos.", "Itinatama ng talata 12 ang pamantayan sa pagsusuri ng ministeryo. Nagsasalita si Pablo tungkol sa <mark>'mga nagmamalaki sa panlabas na anyo at hindi sa nasa puso.'</mark> Ang 'panlabas na anyo' ay hindi lamang mukha; kasama rito ang mga kalagayan at katayuang kahanga-hanga sa paningin ng tao. Tinutulungan ni Pablo ang mga mananampalataya na kilalanin ang kanyang tunay na ministeryo upang masagot nila ang mga nabighani sa panlabas. Madali rin nating suriin ang pananampalataya at paglilingkod batay sa nakikitang resulta. Ngunit sa harap ng Panginoon, lubhang mahalaga <mark>kung anong puso at para kanino tayo naglingkod</mark>. Sa talata 13, sinasabi ni Pablo na mukha man siyang wala sa sarili o nasa tamang pag-iisip, ito'y para sa Diyos at para sa mga mananampalataya. Mahirap matiyak mula sa talata lamang kung anong karanasan o kilos ang tinutukoy nito. Ngunit malinaw ang direksyong idinidiin ni Pablo: ang kanyang layunin ay hindi ang pagpapakitang-gilas kundi ang paglilingkod sa Diyos at pakinabang ng iglesya. Hindi mahuhusgahan ang katapatan ng pananampalataya sa kung gaano lamang kaespesyal ang ating mga karanasan; nahahayag ito sa kung tapat tayo sa Salitang natanggap natin at kung paano natin tinatrato ang mga tao sa paligid natin."], "points": ["Mas nahahayag ang tunay na pananampalataya sa katapatan sa Salita at sa pagtrato sa mga nasa paligid kaysa sa espesyal na karanasan."]}, {"title": "Talata 14–15 · Ang Pag-ibig ni Cristo ang Nag-uudyok sa Atin", "paragraphs": ["Talata 14: <mark>'Sapagkat ang pag-ibig ni Cristo ang nag-uudyok sa amin, dahil napagpasyahan namin ito: na ang isa ay namatay para sa lahat, kaya ang lahat ay namatay.'</mark> Ang unang binabanggit dito ay <mark>ang pag-ibig na ipinakita ni Cristo sa atin</mark>. Alalahanin: hindi ang ating tugon ang una, kundi ang pag-ibig ng Diyos ang una — ipinaliliwanag ng mga sumunod na salita ang pag-ibig na iyon sa pamamagitan ng Kanyang kamatayan. Ang 'nag-uudyok' ay nangangahulugang hinahawakan ng pag-ibig na ito si Pablo at inaakay siyang kumilos. Kilala ni Pablo ang Panginoong nagbigay ng Kanyang buhay para sa kanya, at dahil sa pag-ibig na iyon ay namumuhay siya para sa Diyos at sa iglesya. Para saan ka namumuhay? Namatay si Cristo bilang kinatawan ng mga makasalanan, sa kanilang lugar. Ang mga kabilang kay Cristo ay nakikibahagi sa Kanyang kamatayan at bagong buhay.", "Sa talata 15, malinaw na sinabi ni Pablo ang layunin: <mark>'at Siya'y namatay para sa lahat, upang ang mga nabubuhay ay hindi na mabuhay para sa kanilang sarili kundi para sa Kanya na alang-alang sa kanila ay namatay at muling binuhay.'</mark> Ang mga tumanggap ng bagong buhay ay tumatalikod mula sa pamumuhay para sa sarili tungo sa pamumuhay para kay Cristo na namatay at muling nabuhay para sa kanila. Ang Panginoong hahatol sa atin ay siya ring Tagapagligtas na namatay para sa atin. Kaya sa pagkaalam sa Kanyang pag-ibig, hindi natin ginagaan ang kasalanan; at kapag napagtanto natin ang ating kasalanan, bumabalik tayo sa Diyos na umaasa kay Cristo na namatay para sa atin. Kapag umuuga ang ating debosyon, dapat nating tingnang muli ang pag-ibig na ito. Kung kinukuwenta lamang natin kung gaano tayo nagsikap, madali tayong manghina ang loob at mapagod kapag hindi tayo kinikilala. Sa sandaling iyon, alalahanin <mark>ang Panginoong nagbigay ng Kanyang buhay para sa iyo</mark>."], "points": ["Kapag hawak ng pag-ibig ni Cristo, lumilipat ako mula sa pagkukuwenta ng aking makukuha tungo sa pagpansin sa kailangan ng iba."]}, {"title": "Talata 16–17 · Kay Cristo, Nagbabago ang Paraan ng Pagtingin Natin sa mga Tao", "paragraphs": ["Nagsisimula ang talata 16 sa 'Kaya mula ngayon' — ipinagpapatuloy ang pagbabagong dulot ng kamatayan at muling pagkabuhay ni Cristo: <mark>'hindi na namin tinitingnan ang sinuman ayon sa laman.'</mark> Sa kontekstong ito, ibig sabihin ay hindi paghatol sa tao batay sa makamundong pamantayan at nakikitang kalagayan. Minsan ding hinatulan ni Pablo si Cristo sa ganoong pamantayan, ngunit sa pamamagitan ng krus at muling pagkabuhay ay nakilala niya Siya nang panibago. Habang nagbago ang pagtingin niya kay Cristo, nagbago rin ang pagtingin niya sa mga tao. Kailangan ito ng mga taga-Corinto — at natin din — dahil hinuhusgahan nila ang buong ministeryo ni Pablo batay sa kanyang pagdurusa at kahinaan. Minsan, kapag nakakatagpo tayo ng tao, inuuna nating tingnan kung kapaki-pakinabang siya o kung sinasang-ayunan niya tayo — kung kakampi natin siya o hindi. Ngunit kung kilala at pinaniniwalaan natin ang pag-ibig na ibinigay ni Cristo ang Kanyang sarili, <mark>hindi natin matatrato ang iba bilang mga taong tumutugon lamang sa ating pangangailangan</mark>.", "Talata 17: <mark>'Kaya kung ang sinuman ay kay Cristo, siya'y bagong nilalang. Ang luma ay lumipas na; narito, dumating na ang bago.'</mark> Ang simula ng pagbabago ay ang ating relasyon kay Cristo. Sa mga kabilang sa Panginoong namatay at muling nabuhay, nagbibigay ang Diyos ng bagong buhay. Hindi ito nangangahulugang magiging perpekto ang bawat ugali sa isang iglap o mawawala ang pananagutan sa nakaraang mali. Ibig sabihin, bilang mga kabilang kay Cristo, nagbago ang sentro at direksyon ng ating buhay — at patuloy na lumalago ang pagbabagong iyon sa tulong ng Espiritu. Kaya ang biyaya ng pagiging bago ay hindi nagtatapos sa pag-aliw sa ating sarili; dapat itong mahayag sa pagtrato natin sa iba. Kahit nakikita natin ang mga kakulangan ng iba, tinitingnan din natin ang ginawa ng Diyos sa kanila at ang posibilidad ng Kanyang pagbabago sa kanila. Kung naniniwala akong ginawa akong bago, <mark>hindi ko dapat igapos ang iba sa kanilang nakaraan lamang</mark>, kundi sama-samang tumingin sa landas ng pagsisisi at pagbabago."], "points": ["Ang biyaya ng pagiging bago ay hindi humihinto sa pag-aliw sa akin; dapat itong mahayag sa pagtrato ko sa iba."]}, {"title": "Talata 18–21 · Makipagkasundo Kayo sa Diyos", "paragraphs": ["Sa talata 18, ipinahayag ni Pablo, <mark>'Ang lahat ng ito ay mula sa Diyos, na sa pamamagitan ni Cristo ay nakipagkasundo sa atin sa Kanyang sarili at nagbigay sa atin ng ministeryo ng pakikipagkasundo.'</mark> Mula rin sa Diyos ang bagong buhay. Tayo ang sumira sa relasyon, ngunit inilapit tayo ng Diyos sa Kanyang sarili sa pamamagitan ni Cristo. Iniuugnay ng talata 19 ang pakikipagkasundong ito sa kapatawaran ng mga kasalanan: ang Diyos ay <mark>'hindi ibinibilang sa kanila ang kanilang mga pagsalangsang.'</mark> Hindi dahil ginagaan Niya ang kasalanan, kundi dahil hinarap Niya ang kasalanang iyon sa pamamagitan ni Cristo. Pinatatawad tayo ng Diyos at tinatanggap tayo sa relasyon ng pamumuhay kasama Niya. Ang kapayapaang nais ibahagi ni Pablo ay nagmumula sa pakikipagkasundong ito sa Diyos. Sa talata 20, matapos isakatuparan ang pakikipagkasundo, ipinagkatiwala rin ng Diyos ang mensahe nito. Tinatawag ni Pablo ang sarili na <mark>'sugo ni Cristo'</mark> — ang 'kami' rito ay unang tumutukoy kay Pablo at sa kanyang mga kamanggagawa sa ebanghelyo. Ang iglesya ngayon ay naglilingkod din nang tapat ayon sa ebanghelyo ng mga apostol upang bumalik ang mga tao sa Diyos. Ang mga nagpapahayag ng ipinagkatiwalang Salita ay walang karapatang baguhin ito para sa sariling interes. Ang pakiusap ni Pablo ay <mark>'makipagkasundo kayo sa Diyos'</mark> — ang puso ng kanyang ebanghelyo, na sa harap nito ay kailangan ding suriin ng mga taga-Corinto ang kanilang buhay at relasyon.", "Alalahanin ang pagkakasunod: unang isinakatuparan ng Diyos ang pakikipagkasundo, kapatawaran, at kapayapaan sa pamamagitan ni Cristo, at saka tayo tinatawag na tanggapin ang biyayang iyon. Hindi natin binayaran ang kaligtasan sa pamamagitan ng pagsunod; pinaniniwalaan natin ang biyayang Kanyang unang ibinigay at tumutugon tayo rito. Kaya kapag nagbabahagi tayo ng ebanghelyo, hindi dapat maging layunin ang manalo o makilala, kundi ang maglingkod upang bumalik ang iba sa Diyos at mamuhay sa biyayang iyon. Inihahayag ng talata 21 kung paano naging posible ang pakikipagkasundo: <mark>'Alang-alang sa atin ay ginawa Niyang kasalanan ang hindi nakakilala ng kasalanan, upang tayo'y maging katuwiran ng Diyos sa Kanya.'</mark> Hindi ito nangangahulugang nagkasala si Jesus; ibig sabihin, pinasan Niya para sa atin ang kamatayan at paghatol na nararapat sa mga makasalanan. Sa biyayang iyon, ibinibilang tayong matuwid sa harap ng Diyos kay Cristo at tinatanggap. Hindi natin nakakamit ang pakikipagkasundo sa pamumuhay nang sapat na matuwid; <mark>dahil tinanggap tayo alang-alang kay Cristo, namumuhay na tayo ngayon nang karapat-dapat sa biyayang iyon</mark>."], "points": ["Sa pagbabahagi ng ebanghelyo, ang layunin ay hindi ang manalo o makilala, kundi ang makabalik ang iba sa Diyos."]}, {"title": "Aplikasyon · Sa mga Sandali ng Pagpili, Unahing Alalahanin ang Pag-ibig ng Panginoon", "paragraphs": ["Binabago ng biyayang ito ang pagharap natin sa mga problema sa relasyon. Kung ang pakikipagkasundo sa Diyos ay bunga ng tunay Niyang pagharap sa kasalanan sa pamamagitan ni Cristo, hindi rin tayo masisiyahan sa basta pagtatakip ng mga mali kapag nilulutas ang alitan. Isipin muna ang sarili bago ang iba: <mark>aminin ang sariling mali, magsisi, magpatawad, at panagutan ang kinakailangang pananagutan.</mark> Magkaiba ang pakikipagkasundo sa Diyos at ang pagpapanumbalik ng relasyon sa tao, ngunit inaakay tayo ng biyayang natanggap natin na tapat na suriin ang ating mga relasyon. Ang mga tumanggap ng biyaya ng pakikipagkasundo ay higit na nagpapahalaga sa tapat na pag-amin ng mali at pagpapanumbalik ng relasyon kaysa sa pagliligtas ng dangal.", "Alalahanin ang tagpo ng paghuhugas ni Jesus sa mga paa ng Kanyang mga alagad bago ang krus. Inibig ng Panginoon ang Kanyang sarili hanggang sa wakas at nagpakumbaba upang paglingkuran sila. Pagkatapos ay sinabi Niya, <mark>'Sapagkat binigyan Ko kayo ng halimbawa, upang gawin din ninyo ang ginawa Ko sa inyo'</mark> (Juan 13:15). Ang Panginoon ang unang umibig at naglingkod, at sinabihan Niya ang mga alagad na tumanggap ng pag-ibig na iyon na lumakad sa parehong landas. Ang lakas ng ating pagsunod ay nagmumula rin sa <mark>pag-ibig ng Panginoon na unang ibinigay</mark>. Ang Panginoong naghugas ng kanilang mga paa ay nagpasan ng ating mga kasalanan sa krus at muling nabuhay, binubuksan ang daan ng bagong buhay. Namuhay si Pablo na hawak ng pag-ibig na iyon — kaya ibinahagi niya ang biyaya ng pakikipagkasundo kahit sa mga mananampalatayang kaalitan niya at hinangad na tumayo silang matuwid sa harap ng Diyos.", "Ngayon, huminto sandali sa sandali ng pagpili. Kapag gusto mong magsalita nang malamig dahil hindi ka kinilala, kapag gusto mong itulak palayo ang isang tao dahil hindi siya kakampi mo, kapag gusto mong iwasan ang kinakailangang paglilingkod dahil natatakot kang malugi — <mark>unahing alalahanin kung paano ka inibig ng Panginoon</mark>.", "Ang kapangyarihan bang nagpapakilos sa aking mga salita at pasya ngayon ay ang aking ginhawa, interes, at reputasyon — o ang pag-ibig ni Cristo, na namatay at muling nabuhay para sa atin?"], "points": ["Hawak ng pag-ibig ni Cristo na namatay at muling nabuhay para sa akin, ngayon ay namumuhay ako hindi para sa sarili kundi para sa Kanya."]}], "s3heading": "Suriin Ko ang Sarili Ngayon", "checks": [{"key": "c1", "text": "Pinag-isipan ko kung hinanap ko ang katapatan sa harap ng Panginoon nang higit sa pagsusuri ng tao at nakikitang resulta."}, {"key": "c2", "text": "Sinuri ko kung pagod ako dahil kinukuwenta ko ang aking pagsisikap at hindi ako kinikilala."}, {"key": "c3", "text": "Pinag-isipan ko kung hinatulan ko ang mga tao sa 'Kapaki-pakinabang ba siya sa akin? Kakampi ko ba siya?'"}, {"key": "c4", "text": "Sinuri ko kung, sa alitan, inuna kong aminin ang sarili kong mali at hinanap ang pakikipagkasundo sa halip na iligtas ang dangal."}], "s4heading": "Isang-Linyang Pagninilay", "memoHint": "Ano ang kapangyarihang nagpapakilos sa aking mga salita at pasya ngayon, at ano ang magbabago kung hawak ako ng pag-ibig ni Cristo?", "memoPlaceholder": "Sapat na ang isang pangungusap.", "s5heading": "Isang Gawain Ngayon", "pills": [{"key": "act1", "label": "Alalahanin ang Kanyang Pag-ibig", "value": "Kapag gusto mong magsalita nang malamig, huminto at unahing alalahanin ang pag-ibig ng Panginoong namatay para sa iyo"}, {"key": "act2", "label": "Tingnan Sila nang Bago", "value": "Tingnan ang taong nakikita mo lamang sa kanyang nakaraan bilang taong babaguhin ng Diyos, at mag-alok ng mainit na salita"}, {"key": "act3", "label": "Unang Umamin", "value": "Sa relasyong may alitan, unahing aminin ang sarili mong mali at magsalita ng mga salitang naghahangad ng pakikipagkasundo"}, {"key": "act4", "label": "Bitawan ang Pagkukuwenta", "value": "Kusang-loob na gampanan ang isang paglilingkod na iniwasan mo dahil natatakot kang malugi"}, {"key": "act5", "label": "Isaulo ang Salita", "value": "Isaulo ang 2 Corinto 5:17 at alalahaning kay Cristo ikaw ay bagong nilalang"}], "s6heading": "Panalangin Ngayon", "prayers": [{"key": "p1", "tag": "Pasasalamat", "text": "Salamat, Diyos, sa paggawa kay Cristo, na hindi nakakilala ng kasalanan, na maging kasalanan para sa amin, sa hindi pagbibilang sa amin ng aming mga pagsalangsang, at sa paggawa sa amin na mga bagong nilalang na nakipagkasundo sa Iyo."}, {"key": "p2", "tag": "Pagsisisi", "text": "Nagsisisi ako sa pamumuhay na hawak ng pagsusuri ng tao, ng aking interes, at ng aking ginhawa, sa paghatol sa mga tao batay lamang sa aking pangangailangan at panig, at sa pagsisikap na iligtas ang dangal sa alitan."}, {"key": "p3", "tag": "Kahilingan", "text": "Hayaan Mong ang pag-ibig ni Cristo ang mag-udyok sa akin upang hindi na ako mabuhay para sa aking sarili kundi para sa Iyo, at gawin Mo akong tagapagdala ng biyaya ng pakikipagkasundo."}], "s7heading": "Aking mga Kahilingan sa Panalangin", "pr1Label": "Para sa akin", "pr1Placeholder": "Isang linya", "pr2Label": "Para sa grupo · kapwa", "pr2Placeholder": "Upang makapanalangin tayo sa isa't isa", "actWhoPlaceholder": "Kanino · kailan · paano (hal., tawagan si ○○ ngayong gabi)", "footer": "Magalak kayong lagi · Manalangin kayong walang tigil · Magpasalamat kayo sa lahat ng bagay", "ui": {"bgmIdle": "🎵 Musika sa Pagninilay ", "bgmPlaying": "🎵 Tumutugtog ", "bgmTapToPlay": "🎵 Pindutin para tumugtog ", "fontLabel": "Font", "copyBtn": "📋 Kopyahin para Ibahagi", "shareBtn": "Ibahagi", "toastMusicFail": "Hindi ma-load ang music file", "toastCopied": "Nakopya! I-paste sa inyong group chat", "toastLinkCopied": "Nakopya ang link", "savedPrefix": "Awtomatikong na-save sa device na ito · ", "loadedPrev": "Na-load ang dati mong sagot", "shareText": "Sumali sa QT natin ngayon", "copyHeader": "QT sharing", "copyCheck": "Nasuri", "copyAct": "Gawain", "copyPrayer": "Panalangin", "copyPrayerReq": "Mga kahilingan", "copyMine": "Ako", "copyGroup": "Grupo"}}};
const KEY='qt-2026-11-07';
const LANGKEY='qt-lang';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}

let LANG = ls.get(LANGKEY) || 'ko';

// 글자 크기
$$('.fs button').forEach(b=>b.onclick=()=>{document.documentElement.className=b.dataset.f;$$('.fs button').forEach(x=>x.classList.toggle('on',x===b));ls.set('qt-font',b.dataset.f)});
const f=ls.get('qt-font');if(f!==null){document.documentElement.className=f;$$('.fs button').forEach(x=>x.classList.toggle('on',x.dataset.f===f))}

// 배경음악
const au=$('#audio'),bb=$('#bgm');au.volume=0.35;
function bgmUI(on){bb.classList.toggle('on',on);$('#bgmLabel').textContent=on?CONTENT[LANG].ui.bgmPlaying:CONTENT[LANG].ui.bgmIdle}
bb.onclick=async()=>{if(au.paused){try{await au.play();bgmUI(true);ls.set('qt-bgm','1')}catch(e){toast(CONTENT[LANG].ui.toastMusicFail)}}else{au.pause();bgmUI(false);ls.set('qt-bgm','0')}};
au.onerror=()=>{bb.style.display='none'};

// 영상 링크 없으면 숨김
if($('#video').getAttribute('href')==='VIDEO_URL')$('#video').style.display='none';

function actToggle(){$('#actDetail').classList.toggle('on',!!$('input[name=act]:checked'))}

function state(){return{
  c:$$('input[name=c]:checked').map(i=>i.value),
  memo:$('#memo').value.trim(),
  act:($('input[name=act]:checked')||{}).value||'', actWho:$('#actWho').value.trim(),
  p:$$('input[name=p]:checked').map(i=>i.value),
  pr1:$('#pr1').value.trim(), pr2:$('#pr2').value.trim()
}}
function save(){const s=state();ls.set(KEY,JSON.stringify(s));
  $('#saved').textContent=CONTENT[LANG].ui.savedPrefix+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
function load(){
  const s=JSON.parse(ls.get(KEY)||'null');if(!s)return;
  $$('input[name=c]').forEach(i=>i.checked=s.c.includes(i.value));
  $('#memo').value=s.memo||'';if(s.act)($$('input[name=act]').find(i=>i.value===s.act)||{}).checked=true;
  $('#actWho').value=s.actWho||'';$$('input[name=p]').forEach(i=>i.checked=(s.p||[]).includes(i.value));
  $('#pr1').value=s.pr1||'';$('#pr2').value=s.pr2||'';
  $('#saved').textContent=CONTENT[LANG].ui.loadedPrev}

function bindDynamicEvents(){
  document.removeEventListener('input',save);document.removeEventListener('change',changeHandler);
  document.addEventListener('input',save);document.addEventListener('change',changeHandler);
}
function changeHandler(){actToggle();save()}

function render(lang){
  LANG = lang; ls.set(LANGKEY, lang);
  const c = CONTENT[lang];
  $$('#langsw button').forEach(b=>b.classList.toggle('on', b.dataset.lang===lang));

  $('#dateEl').textContent = c.date;
  $('#refEl').textContent = c.ref;
  $('#headlineEl').innerHTML = c.headline;
  $('#videoLabelEl').textContent = c.videoLabel;
  $('#videoSubEl').textContent = c.videoSub;
  $('#s1heading').textContent = c.s1heading;
  $('#verseEl').innerHTML = c.verse;
  $('#verseRefEl').textContent = c.verseRef;
  $('#s2heading').textContent = c.s2heading;

  $('#cardsContainer').innerHTML = c.cards.map(card=>{
    const paras = card.paragraphs.map(p=>`<p>${p}</p>`).join('');
    const points = (card.points||[]).map(p=>`<div class="point">${p}</div>`).join('');
    return `<div class="card"><b class="t">${card.title}</b>${paras}${points}</div>`;
  }).join('');

  $('#s3heading').textContent = c.s3heading;
  $('#checklistContainer').innerHTML = c.checks.map(ch=>
    `<label class="chk"><input type="checkbox" name="c" value="${ch.key}"><span>${ch.text}</span></label>`
  ).join('');

  $('#s4heading').textContent = c.s4heading;
  $('#memoHintEl').textContent = c.memoHint;
  $('#memo').placeholder = c.memoPlaceholder;

  $('#s5heading').textContent = c.s5heading;
  $('#pillsContainer').innerHTML = c.pills.map(p=>
    `<label><input type="radio" name="act" value="${p.key}">${p.label}</label>`
  ).join('');
  $('#actWho').placeholder = c.actWhoPlaceholder;

  $('#s6heading').textContent = c.s6heading;
  $('#prayerContainer').innerHTML = c.prayers.map(p=>
    `<label class="chk"><input type="checkbox" name="p" value="${p.key}"><span><em class="tag">${p.tag}</em>${p.text}</span></label>`
  ).join('');

  $('#s7heading').textContent = c.s7heading;
  $('#pr1LabelEl').textContent = c.pr1Label; $('#pr1').placeholder = c.pr1Placeholder;
  $('#pr2LabelEl').textContent = c.pr2Label; $('#pr2').placeholder = c.pr2Placeholder;

  $('#footerEl').textContent = c.footer;

  $('#fontLabel').textContent = c.ui.fontLabel;
  $('#copy').textContent = c.ui.copyBtn;
  $('#share').textContent = c.ui.shareBtn;
  bgmUI(!au.paused);

  bindDynamicEvents();
  load();
  actToggle();
}

$$('#langsw button').forEach(b=>b.onclick=()=>render(b.dataset.lang));

render(LANG);

$('#copy').onclick=async()=>{
  const c = CONTENT[LANG];
  const s=state();
  const checkMap={}; c.checks.forEach(ch=>checkMap[ch.key]=ch.text);
  const actMap={}; c.pills.forEach(p=>actMap[p.key]=p.label);
  const prayerMap={}; c.prayers.forEach(p=>prayerMap[p.key]=p.tag);
  const L=[`📖 ${c.date} ${c.ref} ${c.ui.copyHeader}`,`✅ ${c.ui.copyCheck} ${s.c.length}/${c.checks.length}`];
  if(s.memo)L.push(`💭 ${s.memo}`);
  if(s.act)L.push(`🙏 ${c.ui.copyAct}: ${actMap[s.act]||s.act}`+(s.actWho?` — ${s.actWho}`:''));
  if(s.p.length)L.push(`🕯 ${c.ui.copyPrayer}: ${s.p.map(k=>prayerMap[k]||k).join('·')}`);
  if(s.pr1||s.pr2)L.push(`🕊 ${c.ui.copyPrayerReq}`+(s.pr1?`\n  ${c.ui.copyMine} — ${s.pr1}`:'')+(s.pr2?`\n  ${c.ui.copyGroup} — ${s.pr2}`:''));
  const txt=L.join('\n');
  try{await navigator.clipboard.writeText(txt);toast(c.ui.toastCopied)}catch(e){prompt('',txt)}
};
$('#share').onclick=async()=>{
  const c = CONTENT[LANG];
  const d={title:document.title,text:c.ui.shareText,url:location.href};
  if(navigator.share){try{await navigator.share(d)}catch(e){}}
  else{try{await navigator.clipboard.writeText(location.href);toast(c.ui.toastLinkCopied)}catch(e){prompt('',location.href)}}
};
</script>

</body>
</html>
